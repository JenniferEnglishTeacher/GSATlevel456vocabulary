<script>window.QUIZ_CONFIG={"title": "109 年國中會考英語｜單題＋閱讀測驗＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. The man is holding one of the ______.", "options": ["bowls", "glasses", "plates", "spoons"], "answer": 1, "answerLabel": "B", "source": "109 會考｜單題｜第 1 題", "explanation": "圖中男子手裡拿的是一個高腳杯，one of the glasses（杯子之一）。", "explanationSource": "own", "section": "單題", "image": "assets/cap109-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　My mom puts the ______ on to keep her hands away from water when she washes the dishes.", "options": ["gloves", "jacket", "ring", "socks"], "answer": 0, "answerLabel": "A", "source": "109 會考｜單題｜第 2 題", "explanation": "洗碗時戴上「手套」讓手不碰到水：gloves。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Can you ______ your feet a little off the floor? I want to see if my keys are under the sofa.", "options": ["check", "kick", "raise", "show"], "answer": 2, "answerLabel": "C", "source": "109 會考｜單題｜第 3 題", "explanation": "要看鑰匙是否在沙發下，請對方把腳「抬高」一點：raise。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　______ of my sisters are older than I am. I’m the youngest of the three children in my family.", "options": ["Both", "Few", "Most", "Some"], "answer": 0, "answerLabel": "A", "source": "109 會考｜單題｜第 4 題", "explanation": "我是三個孩子中最小的，所以「兩個」姊姊都比我大：Both。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　The beach near our town is a very ______ place. Every summer at least one kid dies there in the water.", "options": ["dangerous", "exciting", "lonely", "popular"], "answer": 0, "answerLabel": "A", "source": "109 會考｜單題｜第 5 題", "explanation": "每年都有孩子在那裡溺水，所以是「危險的」地方：dangerous。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　My wife enjoys going to the movies with her friends, but I like to watch TV at home by ______.", "options": ["I", "me", "myself", "mine"], "answer": 2, "answerLabel": "C", "source": "109 會考｜單題｜第 6 題", "explanation": "by oneself＝獨自；主詞是 I，用 myself。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　For the past twenty years, my father ______ in a school library. But he’ll leave the job next month.", "options": ["worked", "has worked", "is working", "works"], "answer": 1, "answerLabel": "B", "source": "109 會考｜單題｜第 7 題", "explanation": "For the past twenty years（過去二十年來）一直到現在，用現在完成式 has worked。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　It’s great that we can buy train tickets over the phone without going out. It ______ us a lot of time.", "options": ["lends", "prepares", "saves", "takes"], "answer": 2, "answerLabel": "C", "source": "109 會考｜單題｜第 8 題", "explanation": "不用出門就能買票，「節省」很多時間：save sb. time。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Mozart ______ his first music when he was only six years old.", "options": ["is writing", "has written", "will write", "wrote"], "answer": 3, "answerLabel": "D", "source": "109 會考｜單題｜第 9 題", "explanation": "when he was only six years old 是過去時間，用過去式 wrote。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Jill: Have you decided ______ you will celebrate your 30th birthday?\nSue: Yeah, I’m going to have a big barbecue party.", "options": ["how", "where", "what", "when"], "answer": 0, "answerLabel": "A", "source": "109 會考｜單題｜第 10 題", "explanation": "Sue 回答要辦烤肉派對，說的是慶祝的「方式」：how。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　Alison doesn’t like ______ what to do. She only does things she wants to do.", "options": ["told", "to tell", "be told", "to be told"], "answer": 3, "answerLabel": "D", "source": "109 會考｜單題｜第 11 題", "explanation": "Alison 不喜歡「被告知」要做什麼：like + to be + p.p.（被動）。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Josh has planned to make a trip to New York and ______ some of his friends there.", "options": ["visit", "visits", "visiting", "visited"], "answer": 0, "answerLabel": "A", "source": "109 會考｜單題｜第 12 題", "explanation": "and 連接兩個不定詞：to make a trip ... and (to) visit friends，用原形 visit。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　Ms. Johnson has been taking phone calls since she entered the office this morning. Just when she thought she could finally leave work, ______ call came in.", "options": ["another", "each", "the next", "the other"], "answer": 0, "answerLabel": "A", "source": "109 會考｜單題｜第 13 題", "explanation": "接了一整天電話，正要下班時又來「另一通」：another。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　We were so sure that Jerry ______ well on the difficult job. His past experience in other work showed he was the right guy for it. So when he failed, no one believed it.", "options": ["had done", "did", "has done", "would do"], "answer": 3, "answerLabel": "D", "source": "109 會考｜單題｜第 14 題", "explanation": "過去「認為」他會做得好（過去的未來），用 would do。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　For Mike, the price is ______ important thing when he shops for jeans. He cares even more about the shape and the size of the pockets.", "options": ["the more", "the most", "the less", "the least"], "answer": 3, "answerLabel": "D", "source": "109 會考｜單題｜第 15 題", "explanation": "後句說他更在意形狀和口袋，表示價格是「最不」重要的：the least。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "【閱讀測驗 第 16–17 題】\nWhen it arrives,\nEveryone cheers.\nThe shirts and shorts dance\nOn the clothesline,\nThe trees and flowers wave\nLike they’re saying hi,\nAnd the clouds are so excited\nTo have a running race.\n\nWhen it comes,\nDad’s face falls.\nHis coat and jeans jump\nOff the clothesline\nInto the pond.\nThe tree leaves hop off\nAnd have a party on his new car.\n\nWhen it gets here,\nA lot of fun things I notice:\nThe pond’s face,\nSad and old with lines;\nMrs. Smith’s bread,\nDelicious and freshly baked.\nBut what smell is it?\nOh, no, it’s from Mr. Brown’s feet!\n（leaf (leaves) 葉子）\n\n▶ 第 16 題　What is it in the reading?", "options": ["The sun.", "The rain.", "The wind.", "The rainbow."], "answer": 2, "answerLabel": "C", "source": "109 會考｜閱讀測驗｜第 16 題", "explanation": "衣服在曬衣繩上「跳舞」、樹在揮手、雲在賽跑、衣服被吹進池塘、聞到遠處的味道，都是「風」造成的。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 17, "question": "【閱讀測驗 第 16–17 題】\nWhen it arrives,\nEveryone cheers.\nThe shirts and shorts dance\nOn the clothesline,\nThe trees and flowers wave\nLike they’re saying hi,\nAnd the clouds are so excited\nTo have a running race.\n\nWhen it comes,\nDad’s face falls.\nHis coat and jeans jump\nOff the clothesline\nInto the pond.\nThe tree leaves hop off\nAnd have a party on his new car.\n\nWhen it gets here,\nA lot of fun things I notice:\nThe pond’s face,\nSad and old with lines;\nMrs. Smith’s bread,\nDelicious and freshly baked.\nBut what smell is it?\nOh, no, it’s from Mr. Brown’s feet!\n（leaf (leaves) 葉子）\n\n▶ 第 17 題　How does Dad feel “when it comes”?", "options": ["He is scared.", "He is excited.", "He is not happy.", "He is not interested."], "answer": 2, "answerLabel": "C", "source": "109 會考｜閱讀測驗｜第 17 題", "explanation": "Dad’s face falls（臉垮下來），因為他的外套和牛仔褲被吹進池塘、葉子落滿新車，所以他不高興。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 18, "question": "【閱讀測驗 第 18–19 題】\nGroup: Buffy, Debby, Jamie, Albert, Matt….(7)\nBuffy: Hey, guys! I have a lot of things I don’t need, so I’m thinking about having a yard sale. What do you think?\nDebby: Having a yard sale is not easy. You have to collect things, put prices on them, put them out on tables and then wait for people to come. And usually you have to sell things at VERY low prices. For all that time and work, you make very little money. Why not just sell your things online for higher prices?\nJamie: Debby’s right. But I think it’d be even better to just give your things to people who need them. I just sent out a lot of things last week.\nAlbert: Hey, I love yard sales! It’s a great chance to make big money if you pick the right day. In my experience, Saturday is the best.\nMatt: I agree with Albert. You can make money and meet interesting people. I made some good friends at my last yard sale.\n\n▶ 第 18 題　What can we learn about Buffy’s friends?", "options": ["Matt has experience of yard sales.", "Jamie had a successful yard sale last week.", "Albert thinks weather is important for yard sales.", "Debby thinks things are cheaper online than at yard sales."], "answer": 0, "answerLabel": "A", "source": "109 會考｜閱讀測驗｜第 18 題", "explanation": "Matt 說 I made some good friends at my last yard sale，表示他辦過車庫拍賣。Jamie 上週是把東西送人；Albert 說的是「挑對日子」；Debby 認為網路上能賣更高價。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap109-g18.png?v=20261120-7"}, {"id": 19, "question": "【閱讀測驗 第 18–19 題】\nGroup: Buffy, Debby, Jamie, Albert, Matt….(7)\nBuffy: Hey, guys! I have a lot of things I don’t need, so I’m thinking about having a yard sale. What do you think?\nDebby: Having a yard sale is not easy. You have to collect things, put prices on them, put them out on tables and then wait for people to come. And usually you have to sell things at VERY low prices. For all that time and work, you make very little money. Why not just sell your things online for higher prices?\nJamie: Debby’s right. But I think it’d be even better to just give your things to people who need them. I just sent out a lot of things last week.\nAlbert: Hey, I love yard sales! It’s a great chance to make big money if you pick the right day. In my experience, Saturday is the best.\nMatt: I agree with Albert. You can make money and meet interesting people. I made some good friends at my last yard sale.\n\n▶ 第 19 題　What do Buffy’s friends think about having a yard sale?", "options": ["Albert and Matt think it’s a nice way to make friends.", "Debby and Albert think it’s difficult to make money from it.", "Matt agrees with Jamie that it’s a good chance to help people.", "Jamie agrees with Debby that it’s a lot of trouble to prepare for it."], "answer": 3, "answerLabel": "D", "source": "109 會考｜閱讀測驗｜第 19 題", "explanation": "Jamie 說 Debby’s right，同意 Debby 認為辦車庫拍賣很麻煩、又賺不了多少錢。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap109-g18.png?v=20261120-7"}, {"id": 20, "question": "【閱讀測驗 第 20–21 題】\nHere is an ad for Sunny Market.\nFrom Jan. 4 to Feb. 4, for each $50 you spend (on anything EXCEPT books and CDs) at Sunny Market, you’ll get a Sunny Sun picture. (2 pictures for every $100, 3 pictures for every $150, …)\n• Collect 12 pictures, and you can get a Sunny Cup for free!\n• Collect 10 pictures, and you can get any of the desserts on the right for free!\n• Collect 6 pictures, and you can buy a Sunny Cup for $200, or any of the desserts on the right for $100!\n☺ From Jan. 4 to Feb. 10, you can use Sunny Sun pictures to get Sunny Cups or desserts.\nWith Sunny Sun pictures, you can get one of the prizes below for free or at low prices!!\nSunny Cup／Chocolate／Fruitcake／Ice cream\n\n▶ 第 20 題　From the ad, which is true about Sunny Sun pictures?", "options": ["The first day to use Sunny Sun pictures is Feb. 4.", "The last day to collect Sunny Sun pictures is Feb. 10.", "You cannot use Sunny Sun pictures to get free desserts.", "You cannot get Sunny Sun pictures when you buy books."], "answer": 3, "answerLabel": "D", "source": "109 會考｜閱讀測驗｜第 20 題", "explanation": "買書和 CD 不送 Sunny Sun 貼紙（EXCEPT books and CDs）。集點到 2/4、兌換到 2/10；集滿 10 張可免費換甜點。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap109-g20.png?v=20261120-7"}, {"id": 21, "question": "【閱讀測驗 第 20–21 題】\nHere is an ad for Sunny Market.\nFrom Jan. 4 to Feb. 4, for each $50 you spend (on anything EXCEPT books and CDs) at Sunny Market, you’ll get a Sunny Sun picture. (2 pictures for every $100, 3 pictures for every $150, …)\n• Collect 12 pictures, and you can get a Sunny Cup for free!\n• Collect 10 pictures, and you can get any of the desserts on the right for free!\n• Collect 6 pictures, and you can buy a Sunny Cup for $200, or any of the desserts on the right for $100!\n☺ From Jan. 4 to Feb. 10, you can use Sunny Sun pictures to get Sunny Cups or desserts.\nWith Sunny Sun pictures, you can get one of the prizes below for free or at low prices!!\nSunny Cup／Chocolate／Fruitcake／Ice cream\n\n▶ 第 21 題　Sammy has 7 Sunny Sun pictures. She wants to get a Sunny Cup. How can she get one?", "options": ["Use 6 Sunny Sun pictures and pay $100.", "Use 6 Sunny Sun pictures and pay $200.", "Spend $150 to get 3 more Sunny Sun pictures.", "Spend $200 to get 4 more Sunny Sun pictures."], "answer": 1, "answerLabel": "B", "source": "109 會考｜閱讀測驗｜第 21 題", "explanation": "集 6 張可用 $200 加購杯子；7 張已足夠。要免費換杯子需 12 張，再花 $150 或 $200 也只有 10 或 11 張。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap109-g20.png?v=20261120-7"}, {"id": 22, "question": "【閱讀測驗 第 22–24 題】\nNow I’m going to show you how to work with chocolate. I’ll do it in a “bain-marie,” or, well, some people call it “water bath.” I myself love the name “bain-marie.” To make a “bain-marie,” you need two pots, one bigger than the other.\nFirst, break the chocolate into small pieces and put them in the smaller pot. Usually when making chocolate desserts, you’ll need to mix chocolate with butter and sugar. So if you do, put them in the pot too.\nNow, half fill the bigger pot with warm water. Put the smaller pot over the bigger one, and start to slowly mix the chocolate, the butter, and the sugar together. Keep the water under 50ºC, or the chocolate may lose its shine. And make sure that no water goes in the smaller pot, or the chocolate will become hard and cannot be used.\nKeep mixing for about five to ten minutes, and the job is done. Easy, right?\n（mix 混合）\n\n▶ 第 22 題　From the reading, which picture best shows the “bain-marie” way of working with chocolate?", "options": ["(A)", "(B)", "(C)", "(D)"], "answer": 1, "answerLabel": "B", "source": "109 會考｜閱讀測驗｜第 22 題", "explanation": "小鍋放巧克力（和奶油、糖），大鍋裝半鍋溫水，小鍋架在大鍋上，而且水不能跑進小鍋，符合 B。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap109-q22.png?v=20261120-7"}, {"id": 23, "question": "【閱讀測驗 第 22–24 題】\nNow I’m going to show you how to work with chocolate. I’ll do it in a “bain-marie,” or, well, some people call it “water bath.” I myself love the name “bain-marie.” To make a “bain-marie,” you need two pots, one bigger than the other.\nFirst, break the chocolate into small pieces and put them in the smaller pot. Usually when making chocolate desserts, you’ll need to mix chocolate with butter and sugar. So if you do, put them in the pot too.\nNow, half fill the bigger pot with warm water. Put the smaller pot over the bigger one, and start to slowly mix the chocolate, the butter, and the sugar together. Keep the water under 50ºC, or the chocolate may lose its shine. And make sure that no water goes in the smaller pot, or the chocolate will become hard and cannot be used.\nKeep mixing for about five to ten minutes, and the job is done. Easy, right?\n（mix 混合）\n\n▶ 第 23 題　What does them mean in the reading?", "options": ["Bains-marie.", "Butter and sugar.", "Chocolate desserts.", "Small pieces of chocolate."], "answer": 1, "answerLabel": "B", "source": "109 會考｜閱讀測驗｜第 23 題", "explanation": "若做甜點需要把巧克力和奶油、糖混合，就把 them（奶油和糖）也放進小鍋。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 24, "question": "【閱讀測驗 第 22–24 題】\nNow I’m going to show you how to work with chocolate. I’ll do it in a “bain-marie,” or, well, some people call it “water bath.” I myself love the name “bain-marie.” To make a “bain-marie,” you need two pots, one bigger than the other.\nFirst, break the chocolate into small pieces and put them in the smaller pot. Usually when making chocolate desserts, you’ll need to mix chocolate with butter and sugar. So if you do, put them in the pot too.\nNow, half fill the bigger pot with warm water. Put the smaller pot over the bigger one, and start to slowly mix the chocolate, the butter, and the sugar together. Keep the water under 50ºC, or the chocolate may lose its shine. And make sure that no water goes in the smaller pot, or the chocolate will become hard and cannot be used.\nKeep mixing for about five to ten minutes, and the job is done. Easy, right?\n（mix 混合）\n\n▶ 第 24 題　From the reading, which is true about working with chocolate?", "options": ["It is better to use a “bain-marie” than a “water bath.”", "The water in the pot should not be warmer than 50ºC.", "It is better to finish mixing it in less than five minutes.", "We should not mix butter and sugar together at the same time."], "answer": 1, "answerLabel": "B", "source": "109 會考｜閱讀測驗｜第 24 題", "explanation": "Keep the water under 50ºC，否則巧克力會失去光澤。bain-marie 和 water bath 是同一件事；要攪拌 5–10 分鐘。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 25, "question": "【閱讀測驗 第 25–27 題】\nTaiwanese Bian-dang in Manhattan, New York City　5/30/2014　by Eva Schmidt\nDuring lunch time, on 53rd Street, you’ll see a long line of people in front of a Taiwanese food truck for their “bian-dang,” a Taiwanese word for “lunch box.” On the menu you can find fried chicken with rice, pork dumplings, tea eggs, and other popular Taiwanese dishes.\nThe owners of the food truck are Thomas and Diana Yang, two Taiwanese-Americans. This brother-sister team started their business in 2009. Back then, there were a few Taiwanese restaurants in the city and several thousand food trucks, but the Yangs were the first to sell Taiwanese food on a food truck.\nAt first, business was slack. People thought they were just another Chinese food truck, and the food truck’s name, “Cravings,” often made people think of desserts, not lunch. Few people would stop by and try their food. “I couldn’t even give away free food,” said Thomas. To catch people’s eye, they painted their truck blue, and drew Taiwan’s national flower, the plum blossom, on it. They also changed the food truck’s name to “bian-dang.” Soon people started to notice them, and business finally got better. Now on a good day, they can sell about 150 bian-dangs in about two hours.\nSo what’s next for Thomas and Diana? Well, they hope one day there will be a block with Taiwanese food in the city, just like there is a Chinatown, a Korea Town, and a Little Italy. And their bian-dang food truck might just help to make that happen.\n（national 國家的）\n\n▶ 第 25 題　What does the news story say about the Yangs’ food truck?", "options": ["What people love about their food.", "What made them start their business.", "How they made delicious fried chicken.", "How they fixed their business problems."], "answer": 3, "answerLabel": "D", "source": "109 會考｜閱讀測驗｜第 25 題", "explanation": "一開始生意差，他們把餐車漆成藍色、畫上梅花、改名 bian-dang，生意才好轉，報導說明了他們如何解決經營問題。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 26, "question": "【閱讀測驗 第 25–27 題】\nTaiwanese Bian-dang in Manhattan, New York City　5/30/2014　by Eva Schmidt\nDuring lunch time, on 53rd Street, you’ll see a long line of people in front of a Taiwanese food truck for their “bian-dang,” a Taiwanese word for “lunch box.” On the menu you can find fried chicken with rice, pork dumplings, tea eggs, and other popular Taiwanese dishes.\nThe owners of the food truck are Thomas and Diana Yang, two Taiwanese-Americans. This brother-sister team started their business in 2009. Back then, there were a few Taiwanese restaurants in the city and several thousand food trucks, but the Yangs were the first to sell Taiwanese food on a food truck.\nAt first, business was slack. People thought they were just another Chinese food truck, and the food truck’s name, “Cravings,” often made people think of desserts, not lunch. Few people would stop by and try their food. “I couldn’t even give away free food,” said Thomas. To catch people’s eye, they painted their truck blue, and drew Taiwan’s national flower, the plum blossom, on it. They also changed the food truck’s name to “bian-dang.” Soon people started to notice them, and business finally got better. Now on a good day, they can sell about 150 bian-dangs in about two hours.\nSo what’s next for Thomas and Diana? Well, they hope one day there will be a block with Taiwanese food in the city, just like there is a Chinatown, a Korea Town, and a Little Italy. And their bian-dang food truck might just help to make that happen.\n（national 國家的）\n\n▶ 第 26 題　What does it mean when business is slack?", "options": ["It is bad.", "It is for sale.", "It is growing.", "It is open every day."], "answer": 0, "answerLabel": "A", "source": "109 會考｜閱讀測驗｜第 26 題", "explanation": "後文說很少人停下來吃，連免費送都送不出去，business was slack＝生意「冷清」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 27, "question": "【閱讀測驗 第 25–27 題】\nTaiwanese Bian-dang in Manhattan, New York City　5/30/2014　by Eva Schmidt\nDuring lunch time, on 53rd Street, you’ll see a long line of people in front of a Taiwanese food truck for their “bian-dang,” a Taiwanese word for “lunch box.” On the menu you can find fried chicken with rice, pork dumplings, tea eggs, and other popular Taiwanese dishes.\nThe owners of the food truck are Thomas and Diana Yang, two Taiwanese-Americans. This brother-sister team started their business in 2009. Back then, there were a few Taiwanese restaurants in the city and several thousand food trucks, but the Yangs were the first to sell Taiwanese food on a food truck.\nAt first, business was slack. People thought they were just another Chinese food truck, and the food truck’s name, “Cravings,” often made people think of desserts, not lunch. Few people would stop by and try their food. “I couldn’t even give away free food,” said Thomas. To catch people’s eye, they painted their truck blue, and drew Taiwan’s national flower, the plum blossom, on it. They also changed the food truck’s name to “bian-dang.” Soon people started to notice them, and business finally got better. Now on a good day, they can sell about 150 bian-dangs in about two hours.\nSo what’s next for Thomas and Diana? Well, they hope one day there will be a block with Taiwanese food in the city, just like there is a Chinatown, a Korea Town, and a Little Italy. And their bian-dang food truck might just help to make that happen.\n（national 國家的）\n\n▶ 第 27 題　What does that mean in the news story?", "options": ["A Taiwanese restaurant.", "A second Taiwanese food truck.", "A city block that sells Taiwanese food.", "A business that is popular across the country."], "answer": 2, "answerLabel": "C", "source": "109 會考｜閱讀測驗｜第 27 題", "explanation": "that 指前句的願望：城裡有一個像中國城、韓國城那樣的台灣美食街區。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 28, "question": "【閱讀測驗 第 28–30 題】\nThis is a letter by Selena Bieber to the students in her school.\nhttp://www.nvhsstudsup.org/openletter\nLater Is Better!\nSelena Bieber, Northville High School\nDo you feel it’s hard to get up early for school and even harder to listen well in the first class at 8 a.m.? Well, this happens to most of us and is not helpful for our learning!\nSome studies show that teenagers’ brains make melatonin, the hormone that helps sleep, between 11 p.m. and 8 a.m. So it’s better for us to sleep during these nine hours. But here comes the problem. We’re asked to get to school by 7:30 a.m. That means we have to get up before 7, when our brains should still be sleeping. That’s why we’re always so tired and can’t think clearly in early morning classes. No clear head, no good learning, right?\nIf we can’t change how our body works, why can’t school start later? In this way, we can not only sleep more but also learn better!\nWant to help us make it happen? Visit www.nvhsstudsup.org/later-better to learn more.\n（brain 大腦　hormone 荷爾蒙）\n\n▶ 第 28 題　What problem is Selena Bieber trying to fix?", "options": ["High school lessons are too difficult.", "Classes start too early in the morning.", "Too many students are late for school.", "Lunch break is too short for taking a rest."], "answer": 1, "answerLabel": "B", "source": "109 會考｜閱讀測驗｜第 28 題", "explanation": "她認為學生 7:30 到校太早、大腦還在睡，所以希望學校晚一點開始上課。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 29, "question": "【閱讀測驗 第 28–30 題】\nThis is a letter by Selena Bieber to the students in her school.\nhttp://www.nvhsstudsup.org/openletter\nLater Is Better!\nSelena Bieber, Northville High School\nDo you feel it’s hard to get up early for school and even harder to listen well in the first class at 8 a.m.? Well, this happens to most of us and is not helpful for our learning!\nSome studies show that teenagers’ brains make melatonin, the hormone that helps sleep, between 11 p.m. and 8 a.m. So it’s better for us to sleep during these nine hours. But here comes the problem. We’re asked to get to school by 7:30 a.m. That means we have to get up before 7, when our brains should still be sleeping. That’s why we’re always so tired and can’t think clearly in early morning classes. No clear head, no good learning, right?\nIf we can’t change how our body works, why can’t school start later? In this way, we can not only sleep more but also learn better!\nWant to help us make it happen? Visit www.nvhsstudsup.org/later-better to learn more.\n（brain 大腦　hormone 荷爾蒙）\n\n▶ 第 29 題　What can we learn from the letter?", "options": ["Too much melatonin can hurt teenagers’ brain.", "The brain stops making melatonin after 11 p.m.", "Sleeping longer helps the body make more melatonin.", "It is easier to fall asleep when the brain is making melatonin."], "answer": 3, "answerLabel": "D", "source": "109 會考｜閱讀測驗｜第 29 題", "explanation": "melatonin 是 the hormone that helps sleep，所以大腦分泌它時比較容易入睡。大腦在 11 p.m.–8 a.m. 分泌，不是 11 點後停止。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 30, "question": "【閱讀測驗 第 28–30 題】\nThis is a letter by Selena Bieber to the students in her school.\nhttp://www.nvhsstudsup.org/openletter\nLater Is Better!\nSelena Bieber, Northville High School\nDo you feel it’s hard to get up early for school and even harder to listen well in the first class at 8 a.m.? Well, this happens to most of us and is not helpful for our learning!\nSome studies show that teenagers’ brains make melatonin, the hormone that helps sleep, between 11 p.m. and 8 a.m. So it’s better for us to sleep during these nine hours. But here comes the problem. We’re asked to get to school by 7:30 a.m. That means we have to get up before 7, when our brains should still be sleeping. That’s why we’re always so tired and can’t think clearly in early morning classes. No clear head, no good learning, right?\nIf we can’t change how our body works, why can’t school start later? In this way, we can not only sleep more but also learn better!\nWant to help us make it happen? Visit www.nvhsstudsup.org/later-better to learn more.\n（brain 大腦　hormone 荷爾蒙）\n\n▶ 第 30 題　Below is some information from another study.\n“We studied 48 high school students and found that the students who went to bed earlier did better on their school tests. This is not only true for those who slept nine hours, but also true for those who slept less. And some of them agreed that they learned better in early morning classes.”\nDo the ideas in Selena Bieber’s letter agree with the information?", "options": ["Yes, because her letter says it is better to sleep from 11 p.m. to 8 a.m.", "Yes, because her letter says getting up early is not helpful for learning.", "No, because her letter says students are asked to get to school by 7:30 a.m.", "No, because her letter says teenagers’ brains do not work well in early morning classes."], "answer": 3, "answerLabel": "D", "source": "109 會考｜閱讀測驗｜第 30 題", "explanation": "另一份研究說有些學生覺得早上的課學得更好，而 Selena 認為青少年在一大早的課頭腦不清楚，兩者看法不同。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 31, "question": "【閱讀測驗 第 31–34 題】\nKivalina, an island village in Alaska, USA, is known by only a few people. It cannot be found on most maps of Alaska because it is only 10 km². This small Arctic village is home to 400 Inuit people*. However, their home will become uninhabitable because the island could be covered by the Chukchi Sea by 2025. These Inuit people will have to leave their home.\nBut life now is already difficult. Over the past twenty years, winters have become warmer, the Arctic ice has kept melting, and the sea has been rising. These changes have made it harder to live by hunting and fishing than before. What’s worse, there is no Arctic ice thick enough to keep them safe from terrible wind and rain.\nThese Inuit people think it is the oil and power companies in Alaska that have brought all these troubles, but they are the ones who are paying the price. It would cost hundreds of millions to move their village, and they have no idea where to get the money. Groups like ReLocate are working together with the Inuit people to save Kivalina, but nobody is sure if their hard work will come to anything. All the Inuit people can do now is to pray the rising sea will not cover their home too soon.\n* The Inuit people are a group of people who live in the Arctic.\n（melt 融化　hunt 打獵　company 公司）\n\n▶ 第 31 題　What can we learn about Kivalina?", "options": ["It is waiting to shine.", "It has become history.", "It is fighting for one last hope.", "It has given up its chance to rise."], "answer": 2, "answerLabel": "C", "source": "109 會考｜閱讀測驗｜第 31 題", "explanation": "村子可能在 2025 年被海淹沒，團體正和居民一起努力搶救，居民也只能祈禱，表示它正在為最後的希望奮鬥。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 32, "question": "【閱讀測驗 第 31–34 題】\nKivalina, an island village in Alaska, USA, is known by only a few people. It cannot be found on most maps of Alaska because it is only 10 km². This small Arctic village is home to 400 Inuit people*. However, their home will become uninhabitable because the island could be covered by the Chukchi Sea by 2025. These Inuit people will have to leave their home.\nBut life now is already difficult. Over the past twenty years, winters have become warmer, the Arctic ice has kept melting, and the sea has been rising. These changes have made it harder to live by hunting and fishing than before. What’s worse, there is no Arctic ice thick enough to keep them safe from terrible wind and rain.\nThese Inuit people think it is the oil and power companies in Alaska that have brought all these troubles, but they are the ones who are paying the price. It would cost hundreds of millions to move their village, and they have no idea where to get the money. Groups like ReLocate are working together with the Inuit people to save Kivalina, but nobody is sure if their hard work will come to anything. All the Inuit people can do now is to pray the rising sea will not cover their home too soon.\n* The Inuit people are a group of people who live in the Arctic.\n（melt 融化　hunt 打獵　company 公司）\n\n▶ 第 32 題　What does it mean when we say a place is uninhabitable?", "options": ["It is not big.", "It is not popular.", "It cannot be bought.", "It cannot be lived in."], "answer": 3, "answerLabel": "D", "source": "109 會考｜閱讀測驗｜第 32 題", "explanation": "島可能被海淹沒，居民必須搬走，uninhabitable＝「無法居住的」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 33, "question": "【閱讀測驗 第 31–34 題】\nKivalina, an island village in Alaska, USA, is known by only a few people. It cannot be found on most maps of Alaska because it is only 10 km². This small Arctic village is home to 400 Inuit people*. However, their home will become uninhabitable because the island could be covered by the Chukchi Sea by 2025. These Inuit people will have to leave their home.\nBut life now is already difficult. Over the past twenty years, winters have become warmer, the Arctic ice has kept melting, and the sea has been rising. These changes have made it harder to live by hunting and fishing than before. What’s worse, there is no Arctic ice thick enough to keep them safe from terrible wind and rain.\nThese Inuit people think it is the oil and power companies in Alaska that have brought all these troubles, but they are the ones who are paying the price. It would cost hundreds of millions to move their village, and they have no idea where to get the money. Groups like ReLocate are working together with the Inuit people to save Kivalina, but nobody is sure if their hard work will come to anything. All the Inuit people can do now is to pray the rising sea will not cover their home too soon.\n* The Inuit people are a group of people who live in the Arctic.\n（melt 融化　hunt 打獵　company 公司）\n\n▶ 第 33 題　What does the writer think about the Inuit people in Kivalina?", "options": ["Their way of living has been hurting the earth.", "They might not be able to get enough money to move their village.", "They should make the oil and power companies fix their problems.", "There are better ways than to move their village to somewhere else."], "answer": 1, "answerLabel": "B", "source": "109 會考｜閱讀測驗｜第 33 題", "explanation": "搬村要花數億元，他們不知道去哪裡籌錢，所以可能籌不到足夠的錢。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 34, "question": "【閱讀測驗 第 31–34 題】\nKivalina, an island village in Alaska, USA, is known by only a few people. It cannot be found on most maps of Alaska because it is only 10 km². This small Arctic village is home to 400 Inuit people*. However, their home will become uninhabitable because the island could be covered by the Chukchi Sea by 2025. These Inuit people will have to leave their home.\nBut life now is already difficult. Over the past twenty years, winters have become warmer, the Arctic ice has kept melting, and the sea has been rising. These changes have made it harder to live by hunting and fishing than before. What’s worse, there is no Arctic ice thick enough to keep them safe from terrible wind and rain.\nThese Inuit people think it is the oil and power companies in Alaska that have brought all these troubles, but they are the ones who are paying the price. It would cost hundreds of millions to move their village, and they have no idea where to get the money. Groups like ReLocate are working together with the Inuit people to save Kivalina, but nobody is sure if their hard work will come to anything.
