<script>window.QUIZ_CONFIG={"title": "106 年國中會考英語｜單題＋閱讀測驗＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. The dog is sitting ______.", "options": ["on the bag", "next to the woman", "inside the bag", "between the woman and the bag"], "answer": 1, "answerLabel": "B", "source": "106 會考｜單題｜第 1 題", "explanation": "圖中狗坐在車上、女人的旁邊：next to the woman。", "explanationSource": "own", "section": "單題", "image": "assets/cap106-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　My sister wants to buy a car ______ she doesn’t have enough money.", "options": ["because", "but", "if", "or"], "answer": 1, "answerLabel": "B", "source": "106 會考｜單題｜第 2 題", "explanation": "想買車卻沒錢，前後語意相反，用 but。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Jim always forgets my birthday. He has asked me many times and still can’t ______ it.", "options": ["answer", "celebrate", "remember", "understand"], "answer": 2, "answerLabel": "C", "source": "106 會考｜單題｜第 3 題", "explanation": "他一直忘記我的生日，問了很多次還是「記不住」：can’t remember it。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　The little girl was ______ by a truck on her way home and was badly hurt.", "options": ["hit", "led", "lost", "paid"], "answer": 0, "answerLabel": "A", "source": "106 會考｜單題｜第 4 題", "explanation": "be hit by a truck＝被卡車撞到，後句說傷得很重。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　Excuse me. I really need to go now. My kids ______ for me at school.", "options": ["are waiting", "were waiting", "wait", "waited"], "answer": 0, "answerLabel": "A", "source": "106 會考｜單題｜第 5 題", "explanation": "I need to go now 表示孩子「現在正在」學校等我：現在進行式 are waiting。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Amy’s father is very sick. The doctors can do nothing for him, so Amy went to the temple to ______ for him.", "options": ["care", "count", "look", "pray"], "answer": 3, "answerLabel": "D", "source": "106 會考｜單題｜第 6 題", "explanation": "醫生已無能為力，所以去廟裡「祈禱」：pray for him。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　I’m glad that my school has students wear ______. I don’t have to worry about what clothes to wear to school.", "options": ["belts", "caps", "gloves", "uniforms"], "answer": 3, "answerLabel": "D", "source": "106 會考｜單題｜第 7 題", "explanation": "不用煩惱穿什麼衣服上學，因為學校規定穿「制服」uniforms。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　We are surprised that Sally and Ray decided to get married. No one knows ______. They often fight with each other and are unhappy together.", "options": ["why", "where", "when", "how"], "answer": 0, "answerLabel": "A", "source": "106 會考｜單題｜第 8 題", "explanation": "他們常吵架、在一起不快樂，大家不懂「為什麼」要結婚：why。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　I don’t think Katie will read any one of the books you’ve picked out for her: ______ look(s) very boring.", "options": ["it", "one", "some", "they"], "answer": 3, "answerLabel": "D", "source": "106 會考｜單題｜第 9 題", "explanation": "指前面提到的 the books（複數），代名詞用 they（look 不加 s）。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Jenny’s bag is very heavy because ______ filled with toy cars.", "options": ["it is", "they are", "there is", "there are"], "answer": 0, "answerLabel": "A", "source": "106 會考｜單題｜第 10 題", "explanation": "指 Jenny 的包包（單數），it is filled with...＝裡面裝滿了…。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　______ a map with you when you go to a place for the first time.", "options": ["Have taken", "Take", "Taking", "To take"], "answer": 1, "answerLabel": "B", "source": "106 會考｜單題｜第 11 題", "explanation": "給建議的祈使句，以原形動詞開頭：Take a map with you...", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　The weather ______ rainy and cloudy in the last few days. I hope the sun will come out soon.", "options": ["has been", "had been", "will be", "would be"], "answer": 0, "answerLabel": "A", "source": "106 會考｜單題｜第 12 題", "explanation": "in the last few days（過去幾天以來）搭配現在完成式 has been。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　All the excuses Nick made ______ a lot about how much he hates to do the job.", "options": ["say", "saying", "which say", "to say"], "answer": 0, "answerLabel": "A", "source": "106 會考｜單題｜第 13 題", "explanation": "主詞是 All the excuses（複數），句子需要主要動詞 say。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　Sabine walks so ______ in the apartment that sometimes you don’t even know she’s just passed by. You wonder if her feet ever touch the floor.", "options": ["freely", "lightly", "shyly", "slowly"], "answer": 1, "answerLabel": "B", "source": "106 會考｜單題｜第 14 題", "explanation": "走路輕到你不知道她經過、懷疑她的腳有沒有碰到地，表示走得很「輕」lightly。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　In the past, people thought it was a ______ idea to send e-mails and read news online, but now it is part of our everyday life.", "options": ["simple", "popular", "good", "fresh"], "answer": 3, "answerLabel": "D", "source": "106 會考｜單題｜第 15 題", "explanation": "現在已是日常生活的一部分，以前則被認為是「新穎」的想法：fresh。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "【閱讀測驗 第 16–18 題】\nDo you have some books you don’t want?\nYour old love may be someone’s new favorite.\nBring one book to the Town Library & get another one home for free!\nWhen & How:\nMarch 2 - March 14　Bring one book for one book festival card.\nMarch 16 - March 31　Bring one card for one book you like to read.\nWhat books:\nAll kinds of books EXCEPT school books, comic books, and dictionaries.\nNotice:\n• Your book must be in good shape, without any page missing.\n• Your book must be clean, and nothing is written on it.\nWant to know more? Please call 1234-5678. (We are closed on Mondays.)\n-Town Library-\n\n▶ 第 16 題　What is the book festival for?", "options": ["Selling second-hand books.", "Telling people how to choose books.", "Inviting people to change books with each other.", "Knowing what kinds of books are the most popular."], "answer": 2, "answerLabel": "C", "source": "106 會考｜閱讀測驗｜第 16 題", "explanation": "帶一本不要的書來，就能免費換一本書回家，是邀請大家「交換書」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 17, "question": "【閱讀測驗 第 16–18 題】\nDo you have some books you don’t want?\nYour old love may be someone’s new favorite.\nBring one book to the Town Library & get another one home for free!\nWhen & How:\nMarch 2 - March 14　Bring one book for one book festival card.\nMarch 16 - March 31　Bring one card for one book you like to read.\nWhat books:\nAll kinds of books EXCEPT school books, comic books, and dictionaries.\nNotice:\n• Your book must be in good shape, without any page missing.\n• Your book must be clean, and nothing is written on it.\nWant to know more? Please call 1234-5678. (We are closed on Mondays.)\n-Town Library-\n\n▶ 第 17 題　Sonja is busy packing some books for the book festival. Which is most likely one of them?", "options": ["An old dictionary of medicine.", "A book of short stories in English.", "A picture book with her own notes.", "A workbook she used in her math class."], "answer": 1, "answerLabel": "B", "source": "106 會考｜閱讀測驗｜第 17 題", "explanation": "字典、課本（習作）不收，書上也不能有字，只有英文短篇故事書符合。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 18, "question": "【閱讀測驗 第 16–18 題】\nDo you have some books you don’t want?\nYour old love may be someone’s new favorite.\nBring one book to the Town Library & get another one home for free!\nWhen & How:\nMarch 2 - March 14　Bring one book for one book festival card.\nMarch 16 - March 31　Bring one card for one book you like to read.\nWhat books:\nAll kinds of books EXCEPT school books, comic books, and dictionaries.\nNotice:\n• Your book must be in good shape, without any page missing.\n• Your book must be clean, and nothing is written on it.\nWant to know more? Please call 1234-5678. (We are closed on Mondays.)\n-Town Library-\n\n▶ 第 18 題　Look at the calendar. If Sean has a book festival card, when can he use it?", "options": ["March 3.", "March 14.", "March 23.", "March 29."], "answer": 2, "answerLabel": "C", "source": "106 會考｜閱讀測驗｜第 18 題", "explanation": "換書卡要在 3/16–3/31 使用，而且週一休館。3/29 是週一，所以只有 3/23 可以。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap106-q18.png?v=20261120-7"}, {"id": 19, "question": "【閱讀測驗 第 19–21 題】\nI had a horrendous experience last Saturday.\nThat day, my family went camping near a big lake. While my parents were preparing dinner, my brother and I were playing by the lake. A dirty man appeared from somewhere, and his face was half covered by his hair. He walked to us and asked for some water.\nWhen I gave him water, the bag he carried dropped, and things inside fell out on the grass. I saw a rope, a knife, and a baseball bat. The strangest thing was that there were also a woman’s shoe and a ring, and I’m sure they were not his. The man quickly put all his things back in the bag and looked at us angrily. At that moment, the picture of a man the police was looking for came to my mind. He was the crazy killer! I was so afraid that I could not move at all.\nLuckily, before he could get any closer, my mom shouted from far away, and the man hurried off into the dark.\n（while 當……的時候）\n\n▶ 第 19 題　What happened in the story?", "options": ["A killer was caught by the police.", "The writer’s family invited a stranger to dinner.", "The writer’s brother ran to their parents for help.", "A man ran away after he heard the writer’s mother’s voice."], "answer": 3, "answerLabel": "D", "source": "106 會考｜閱讀測驗｜第 19 題", "explanation": "最後媽媽從遠處大喊，那個男人就匆忙跑進黑暗中。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 20, "question": "【閱讀測驗 第 19–21 題】\nI had a horrendous experience last Saturday.\nThat day, my family went camping near a big lake. While my parents were preparing dinner, my brother and I were playing by the lake. A dirty man appeared from somewhere, and his face was half covered by his hair. He walked to us and asked for some water.\nWhen I gave him water, the bag he carried dropped, and things inside fell out on the grass. I saw a rope, a knife, and a baseball bat. The strangest thing was that there were also a woman’s shoe and a ring, and I’m sure they were not his. The man quickly put all his things back in the bag and looked at us angrily. At that moment, the picture of a man the police was looking for came to my mind. He was the crazy killer! I was so afraid that I could not move at all.\nLuckily, before he could get any closer, my mom shouted from far away, and the man hurried off into the dark.\n（while 當……的時候）\n\n▶ 第 20 題　What can we learn about the writer and the man with a bag?", "options": ["The man attacked the writer.", "The writer followed the man into the dark.", "The writer did not find out who the man was in the end.", "The man did not want the writer to see things in his bag."], "answer": 3, "answerLabel": "D", "source": "106 會考｜閱讀測驗｜第 20 題", "explanation": "東西掉出來後，男人很快收回袋子並生氣地看著他們，表示不想被看到袋子裡的東西。作者當下就認出他是警方在找的殺手，所以 C 不對。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 21, "question": "【閱讀測驗 第 19–21 題】\nI had a horrendous experience last Saturday.\nThat day, my family went camping near a big lake. While my parents were preparing dinner, my brother and I were playing by the lake. A dirty man appeared from somewhere, and his face was half covered by his hair. He walked to us and asked for some water.\nWhen I gave him water, the bag he carried dropped, and things inside fell out on the grass. I saw a rope, a knife, and a baseball bat. The strangest thing was that there were also a woman’s shoe and a ring, and I’m sure they were not his. The man quickly put all his things back in the bag and looked at us angrily. At that moment, the picture of a man the police was looking for came to my mind. He was the crazy killer! I was so afraid that I could not move at all.\nLuckily, before he could get any closer, my mom shouted from far away, and the man hurried off into the dark.\n（while 當……的時候）\n\n▶ 第 21 題　How do people feel when they experience something horrendous?", "options": ["Angry.", "Sad.", "Scared.", "Tired."], "answer": 2, "answerLabel": "C", "source": "106 會考｜閱讀測驗｜第 21 題", "explanation": "作者說自己 so afraid that I could not move at all，horrendous 的經歷讓人「害怕」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 22, "question": "【閱讀測驗 第 22–24 題】\nRuth: I’ve got two tickets for a football game. The Lions vs. the Sharks, front-row seats, next Saturday. Interested? You can take Jessica to the game.\nNate: How did you get the tickets?! They were all sold out months ago!\nRuth: And a table for two at Leeds.\nNate: Leeds?! But I called them yesterday and they said they were all booked for the year!\nRuth: Now it’s yours. You and Jessica can have a lovely dinner there after the game.\nNate: Wait a second. This is just not like you. What’s the catch?\nRuth: Well, you know this Friday I’m leaving for my vacation in London, and . . . .\nNate: And what?\nRuth: And I was thinking if Charlie could stay with you next week.\nNate: The whole week?!\nRuth: Please! I can’t just leave him in my apartment.\nNate: You know I hate that stupid dog! And he hates me too.\nRuth: Please! You’re my last hope.\nNate: I need to think about it.\nRuth: OK, but not too long.\n（book 預訂）\n\n▶ 第 22 題　What does the catch mean in the dialogue?", "options": ["A plan that starts well but ends badly.", "A fact that everyone knows but never talks about.", "A problem that is hidden behind something good.", "An action that is right in one way but wrong in another."], "answer": 2, "answerLabel": "C", "source": "106 會考｜閱讀測驗｜第 22 題", "explanation": "Ruth 送上難得的球賽門票和餐廳訂位，其實是要 Nate 幫忙照顧狗，the catch＝好處背後「隱藏的條件」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 23, "question": "【閱讀測驗 第 22–24 題】\nRuth: I’ve got two tickets for a football game. The Lions vs. the Sharks, front-row seats, next Saturday. Interested? You can take Jessica to the game.\nNate: How did you get the tickets?! They were all sold out months ago!\nRuth: And a table for two at Leeds.\nNate: Leeds?! But I called them yesterday and they said they were all booked for the year!\nRuth: Now it’s yours. You and Jessica can have a lovely dinner there after the game.\nNate: Wait a second. This is just not like you. What’s the catch?\nRuth: Well, you know this Friday I’m leaving for my vacation in London, and . . . .\nNate: And what?\nRuth: And I was thinking if Charlie could stay with you next week.\nNate: The whole week?!\nRuth: Please! I can’t just leave him in my apartment.\nNate: You know I hate that stupid dog! And he hates me too.\nRuth: Please! You’re my last hope.\nNate: I need to think about it.\nRuth: OK, but not too long.\n（book 預訂）\n\n▶ 第 23 題　What does it mean in the dialogue?", "options": ["Taking care of Charlie.", "Having dinner with Jessica.", "Going to the football game.", "Going to London for vacation."], "answer": 0, "answerLabel": "A", "source": "106 會考｜閱讀測驗｜第 23 題", "explanation": "Nate 說 I need to think about it，要考慮的是讓 Charlie 那隻狗住他家一週。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 24, "question": "【閱讀測驗 第 22–24 題】\nRuth: I’ve got two tickets for a football game. The Lions vs. the Sharks, front-row seats, next Saturday. Interested? You can take Jessica to the game.\nNate: How did you get the tickets?! They were all sold out months ago!\nRuth: And a table for two at Leeds.\nNate: Leeds?! But I called them yesterday and they said they were all booked for the year!\nRuth: Now it’s yours. You and Jessica can have a lovely dinner there after the game.\nNate: Wait a second. This is just not like you. What’s the catch?\nRuth: Well, you know this Friday I’m leaving for my vacation in London, and . . . .\nNate: And what?\nRuth: And I was thinking if Charlie could stay with you next week.\nNate: The whole week?!\nRuth: Please! I can’t just leave him in my apartment.\nNate: You know I hate that stupid dog! And he hates me too.\nRuth: Please! You’re my last hope.\nNate: I need to think about it.\nRuth: OK, but not too long.\n（book 預訂）\n\n▶ 第 24 題　What do we know from the dialogue?", "options": ["Ruth will go to London next Saturday.", "Ruth had trouble booking a hotel room in London.", "Nate is the first person that Ruth thought of for help.", "Nate is surprised that Ruth was able to book a table at Leeds."], "answer": 3, "answerLabel": "D", "source": "106 會考｜閱讀測驗｜第 24 題", "explanation": "Nate 昨天打電話被告知全年都訂滿了，所以很驚訝 Ruth 訂得到。Ruth 是這週五出發；她說 Nate 是她「最後的希望」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 25, "question": "【閱讀測驗 第 25–26 題】\nWhen you need to see a doctor, surely you will want to see a good one. But there is one important thing you may never have thought about: Has your doctor rested enough?\nDoctors in our country often have to work 34 hours or longer without sleep. Most of them work 104 hours a week, and some even 150. (There are only 168 hours a week!) One report said that a doctor who works such long hours cannot think more clearly than a drunk driver. Another found that doctors who sleep 5.8 fewer hours than the week before might make 22% more serious mistakes. Surely no one wants to get in a car that is driven by a drunk driver. So, how safe would you feel when you are under the care of a tired doctor?\nSadly this problem has been around for a long time. There are no laws about it yet and hospital bosses don’t look like they care either. And that is why we doctors are asking you to join us on the street this Sunday. Fight together with us on the street so we can fight better for your life in the hospital.\nTime: 1 p.m. May 2nd　Place: City Hospital Square\n（drunk 酒醉的　law 法律）\n\n▶ 第 25 題　What is this reading for?", "options": ["Telling people rules about hospital visits.", "Getting people to stand up and speak for doctors.", "Telling people how to find a good doctor for themselves.", "Getting  that, for every 100 people who go to the theater, 85 see US movies. This may be good news for US movie makers, but not for those in other countries.\nChart 1 shows the percentages (%) of US movies in five countries in 1984 and in 2001; Chart 2 shows the percentages (%) of domestic movies in the five countries in 1984 and in 2001. In Chart 1, we can see that US movies have been popular in foreign markets. In Chart 2, we can see that domestic movies in the five countries are not doing well in their domestic market. The falling market for domestic movies may be a serious problem, but there is something more important. When people welcome US movies with open arms, they in fact also say yes to the American way of thinking. Some people in these countries worry that what is lost may not just be their domestic market for domestic movies, but also their own way of thinking that has been passed down from parents to children.\n（見下方 Chart 1、Chart 2）\n（globalization 全球化　domestic 當地的；國產的；本國的）\n\n▶ 第 31 題　What does the report say about globalization’s influence on the movie world?", "options": ["It has changed the way of making movies.", "It has changed a country’s domestic market for movies.", "It has brought together movie makers from around the world.", "It has helped US movies make more money abroad than in the US."], "answer": 1, "answerLabel": "B", "source": "106 會考｜閱讀測驗｜第 31 題", "explanation": "全球化讓美國電影在各國越來越受歡迎，各國國產電影的市占率下降，改變了各國本地的電影市場。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap106-g31.png?v=20261120-7"}, {"id": 32, "question": "【閱讀測驗 第 31–33 題】\nCinema Times　June 5th, 2005\nThanks to globalization, we get to see movies from around the world. If anyone should feel most excited about globalization, it is US movie makers. A study in 2001 shows that, for every 100 people who go to the theater, 85 see US movies. This may be good news for US movie makers, but not for those in other countries.\nChart 1 shows the percentages (%) of US movies in five c
