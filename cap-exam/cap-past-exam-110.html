<script>window.QUIZ_CONFIG={"title": "110 年國中會考英語｜單題＋閱讀測驗＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　In the picture, the boy is ______ the old man.", "options": ["smiling at", "dancing with", "cheering for", "bowing to"], "answer": 3, "answerLabel": "D", "source": "110 會考｜單題｜第 1 題", "explanation": "圖中男孩正對老人彎腰，是在「鞠躬」：bowing to。", "explanationSource": "own", "section": "單題", "image": "assets/cap110-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　Listen! The baby ______ in the bedroom. Why don’t you go in and take a look?", "options": ["cried", "cries", "is crying", "will cry"], "answer": 2, "answerLabel": "C", "source": "110 會考｜單題｜第 2 題", "explanation": "Listen! 表示「此刻正在」發生：嬰兒正在哭 is crying。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Jill is ______ that the city park is closed for the music festival because now she can’t jog there.", "options": ["excited", "proud", "scared", "unhappy"], "answer": 3, "answerLabel": "D", "source": "110 會考｜單題｜第 3 題", "explanation": "公園關閉讓她不能去慢跑，所以她「不高興」：unhappy。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　Steven wants to be a ______, because he loves to watch people enjoy the food he prepares.", "options": ["cook", "doctor", "driver", "farmer"], "answer": 0, "answerLabel": "A", "source": "110 會考｜單題｜第 4 題", "explanation": "喜歡看人們享用他做的食物，想當「廚師」：cook。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　Paul misses his parents a lot. He ______ them since he came to work in Taiwan a year ago.", "options": ["didn’t see", "doesn’t see", "hasn’t seen", "won’t see"], "answer": 2, "answerLabel": "C", "source": "110 會考｜單題｜第 5 題", "explanation": "since + 過去時間點，用現在完成式：hasn’t seen（一直沒見到）。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Our teacher Ms. Wu seldom laughs, but when she ______, everyone in the same building can hear her.", "options": ["can", "does", "has", "will"], "answer": 1, "answerLabel": "B", "source": "110 會考｜單題｜第 6 題", "explanation": "does 代替前面的一般動詞 laughs：when she does (laugh)。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　My sister is coming to my home today. She ______ with me for a week.", "options": ["stays", "stayed", "has stayed", "will stay"], "answer": 3, "answerLabel": "D", "source": "110 會考｜單題｜第 7 題", "explanation": "姊姊今天來，「將會」跟我住一週：未來式 will stay。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Edward had worked as a computer engineer for ten years. This ______ helped him a lot when he started his own computer shop.", "options": ["chance", "experience", "hobby", "knowledge"], "answer": 1, "answerLabel": "B", "source": "110 會考｜單題｜第 8 題", "explanation": "當了十年電腦工程師的「經驗」幫助他開店：experience。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　If you’re interested in our business plan, ______ this number and ask for Ms. Lee. She’ll answer your questions.", "options": ["calling", "call", "and call", "to call"], "answer": 1, "answerLabel": "B", "source": "110 會考｜單題｜第 9 題", "explanation": "if 子句後接祈使句：call this number（打這支電話）。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Jimmy would not get up for breakfast, ______ his dad had already tried to pull him from his bed several times.", "options": ["although", "because", "if", "until"], "answer": 0, "answerLabel": "A", "source": "110 會考｜單題｜第 10 題", "explanation": "爸爸已經拉了好幾次他還是不起床，前後語意相反：although（雖然）。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　Duncan spent all his money trying to ______ the bookstore his mom left him. Sadly, the business never got better, and he had to close it in the end.", "options": ["build", "buy", "save", "start"], "answer": 2, "answerLabel": "C", "source": "110 會考｜單題｜第 11 題", "explanation": "想「挽救」媽媽留下的書店，但生意沒好轉最後還是關了：save。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Fiona loves listening to her children sing songs ______ at school.", "options": ["are learned", "that learned", "they learned", "that they are learned"], "answer": 2, "answerLabel": "C", "source": "110 會考｜單題｜第 12 題", "explanation": "the songs (that) they learned at school：省略關係代名詞的形容詞子句，they learned 修飾 songs。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　Beverly eats lots of snacks ______ meals. That’s why she is often too full to eat anything at mealtimes.", "options": ["after", "between", "during", "from"], "answer": 1, "answerLabel": "B", "source": "110 會考｜單題｜第 13 題", "explanation": "零食吃太多、正餐吃不下，是在兩餐「之間」吃零食：between meals。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　Nora: Can I check your drawer for some tools we can use?\nMatt: Sure. Take a look. See if you can find ______ in there.", "options": ["any", "it", "others", "those"], "answer": 0, "answerLabel": "A", "source": "110 會考｜單題｜第 14 題", "explanation": "any 表示「任何」（工具），指 Nora 說的不特定 some tools；it 和 those 有特定所指，others 不合語意。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "【閱讀測驗 第 15–16 題】\nWe’ve prepared many wonderful surprises for you at e-BeautiMed, BeautiMed’s online store!\nSurprise 1　Join “BeautiMed Friend” online for free and get 2000 BeautiMed points!\nSurprise 2　Already a “BeautiMed Friend”? Come collect your free gift by entering your “BeautiMed Friend” card number at e-BeautiMed before 8/31.\nSurprise 3　Get 500 BeautiMed points by shopping at e-BeautiMed and you’ll get 500 more points if you spend more than $1,000.\nSurprise 4　Shop at e-BeautiMed during 7/1-8/31 and you may win $5,000 or free movie tickets!\nSurprise 5　Invite a friend to join “BeautiMed Friend” and you both can get 1000 points each!\n（enter 輸入）\n\n▶ 第 15 題　What is this ad for?", "options": ["Teaching people how to use their BeautiMed points.", "Telling people they can shop at BeautiMed on the Internet now.", "Inviting people to share their shopping experience at e-BeautiMed.", "Letting people know what is on sale at e-BeautiMed from 7/1 to 8/31."], "answer": 1, "answerLabel": "B", "source": "110 會考｜閱讀測驗｜第 15 題", "explanation": "廣告介紹 BeautiMed 的網路商店 e-BeautiMed 的各種優惠，目的是告訴大家現在可以在網路上購物。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 16, "question": "【閱讀測驗 第 15–16 題】\nWe’ve prepared many wonderful surprises for you at e-BeautiMed, BeautiMed’s online store!\nSurprise 1　Join “BeautiMed Friend” online for free and get 2000 BeautiMed points!\nSurprise 2　Already a “BeautiMed Friend”? Come collect your free gift by entering your “BeautiMed Friend” card number at e-BeautiMed before 8/31.\nSurprise 3　Get 500 BeautiMed points by shopping at e-BeautiMed and you’ll get 500 more points if you spend more than $1,000.\nSurprise 4　Shop at e-BeautiMed during 7/1-8/31 and you may win $5,000 or free movie tickets!\nSurprise 5　Invite a friend to join “BeautiMed Friend” and you both can get 1000 points each!\n（enter 輸入）\n\n▶ 第 16 題　What will NOT get you BeautiMed points?", "options": ["Shopping at e-BeautiMed.", "Joining “BeautiMed Friend” online.", "Inviting a friend to join “BeautiMed Friend.”", "Entering the “BeautiMed Friend” card number."], "answer": 3, "answerLabel": "D", "source": "110 會考｜閱讀測驗｜第 16 題", "explanation": "輸入會員卡號得到的是「免費禮物」（Surprise 2），不是點數；其他三項都能得到點數。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 17, "question": "【閱讀測驗 第 17–18 題】\nJoey: Lynn, have you tried Caldron? I’ve heard that restaurant is good.\nLynn: I have. I went there once for Tom’s party.\nJoey: And?\nLynn: Well, I never thought I would have to cook for myself when eating out.\nJoey: But it’s fun to cook your own food.\nLynn: I don’t see any fun in that. Besides, I want nice food.\nJoey: So you didn’t like the food there?\nLynn: Everything tasted the same. I mean, they were all cooked in the same boiling pot. How could they taste different? I just kept throwing strange things into the pot. I didn’t even know what half the things were made of.\nJoey: Don’t worry. Everything should be safe to eat after a hot bath in the pot. And you didn’t get sick after that, right? Besides, you tried something different there. Still a good experience, I think?\nLynn: I don’t think we share the same idea of good experiences.\n\n▶ 第 17 題　Lynn took some photos at Tom’s party. Which is most likely one of them?", "options": ["(A)", "(B)", "(C)", "(D)"], "answer": 1, "answerLabel": "B", "source": "110 會考｜閱讀測驗｜第 17 題", "explanation": "Caldron 要自己煮，所有食物都放進同一鍋滾水裡，是火鍋店，所以是 B（圍著冒煙的鍋子吃）。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap110-q17.png?v=20261120-7"}, {"id": 18, "question": "【閱讀測驗 第 17–18 題】\nJoey: Lynn, have you tried Caldron? I’ve heard that restaurant is good.\nLynn: I have. I went there once for Tom’s party.\nJoey: And?\nLynn: Well, I never thought I would have to cook for myself when eating out.\nJoey: But it’s fun to cook your own food.\nLynn: I don’t see any fun in that. Besides, I want nice food.\nJoey: So you didn’t like the food there?\nLynn: Everything tasted the same. I mean, they were all cooked in the same boiling pot. How could they taste different? I just kept throwing strange things into the pot. I didn’t even know what half the things were made of.\nJoey: Don’t worry. Everything should be safe to eat after a hot bath in the pot. And you didn’t get sick after that, right? Besides, you tried something different there. Still a good experience, I think?\nLynn: I don’t think we share the same idea of good experiences.\n\n▶ 第 18 題　What can we learn about Lynn from the dialogue?", "options": ["She does not cook.", "She likes to try new food.", "She did not enjoy the food at Caldron.", "She changed Joey’s idea about Caldron."], "answer": 2, "answerLabel": "C", "source": "110 會考｜閱讀測驗｜第 18 題", "explanation": "Lynn 說每樣東西吃起來都一樣，也不覺得自己煮有趣，可知她不喜歡那裡的食物。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 19, "question": "【閱讀測驗 第 19–21 題】\nBelow is a page from Katie’s diary.\nDear Diary,　June 7, 2011\nI was very sad to hear what happened to Woollie yesterday. Woollie was my favorite sheep. I have a storybook about Woollie. It says when Woollie was four, he ran away from Mr. Armstrong’s farm, and it took Mr. Armstrong six years to find Woollie. But Woollie had grown so much fleece that he didn’t even look like a sheep. Mr. Armstrong decided to cut his fleece on TV so everyone could see. Daddy said this happened on the day I was born. Woollie’s fleece weighed 27 kg, and could make clothes for 20 large men. I asked Daddy if his favorite vest was made from Woollie’s fleece. Daddy said no, because Woollie’s fleece was sold to collect money for sick kids. In the storybook, Woollie was taken to see Ms. Stella Clark, the leader of our city then. They even had tea together. Daddy said Woollie did meet Ms. Clark, but he wasn’t sure if they had tea. Daddy said Woollie was put down because he was too sick and there was no way to help him. I cried. I hope Woollie will be happy up there in the sky.\n（fleece 羊毛　weigh 重達）\n\n▶ 第 19 題　What do we know about Woollie from Katie’s diary?", "options": ["Woollie was older than Katie.", "Woollie was taken to visit sick kids.", "Woollie was sick when he ran away.", "Woollie looked strange without his fleece."], "answer": 0, "answerLabel": "A", "source": "110 會考｜閱讀測驗｜第 19 題", "explanation": "Woollie 四歲逃走、六年後才被找到並剪毛，那天正是 Katie 出生的日子，所以 Woollie 比 Katie 大十歲。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 20, "question": "【閱讀測驗 第 19–21 題】\nBelow is a page from Katie’s diary.\nDear Diary,　June 7, 2011\nI was very sad to hear what happened to Woollie yesterday. Woollie was my favorite sheep. I have a storybook about Woollie. It says when Woollie was four, he ran away from Mr. Armstrong’s farm, and it took Mr. Armstrong six years to find Woollie. But Woollie had grown so much fleece that he didn’t even look like a sheep. Mr. Armstrong decided to cut his fleece on TV so everyone could see. Daddy said this happened on the day I was born. Woollie’s fleece weighed 27 kg, and could make clothes for 20 large men. I asked Daddy if his favorite vest was made from Woollie’s fleece. Daddy said no, because Woollie’s fleece was sold to collect money for sick kids. In the storybook, Woollie was taken to see Ms. Stella Clark, the leader of our city then. They even had tea together. Daddy said Woollie did meet Ms. Clark, but he wasn’t sure if they had tea. Daddy said Woollie was put down because he was too sick and there was no way to help him. I cried. I hope Woollie will be happy up there in the sky.\n（fleece 羊毛　weigh 重達）\n\n▶ 第 20 題　Which picture of Woollie and Ms. Clark did Katie talk about in her diary?", "options": ["(A)", "(B)", "(C)", "(D)"], "answer": 2, "answerLabel": "C", "source": "110 會考｜閱讀測驗｜第 20 題", "explanation": "日記提到故事書裡 Woollie 和市長 Clark 女士一起喝茶，所以是 C。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap110-q20.png?v=20261120-7"}, {"id": 21, "question": "【閱讀測驗 第 19–21 題】\nBelow is a page from Katie’s diary.\nDear Diary,　June 7, 2011\nI was very sad to hear what happened to Woollie yesterday. Woollie was my favorite sheep. I have a storybook about Woollie. It says when Woollie was four, he ran away from Mr. Armstrong’s farm, and it took Mr. Armstrong six years to find Woollie. But Woollie had grown so much fleece that he didn’t even look like a sheep. Mr. Armstrong decided to cut his fleece on TV so everyone could see. Daddy said this happened on the day I was born. Woollie’s fleece weighed 27 kg, and could make clothes for 20 large men. I asked Daddy if his favorite vest was made from Woollie’s fleece. Daddy said no, because Woollie’s fleece was sold to collect money for sick kids. In the storybook, Woollie was taken to see Ms. Stella Clark, the leader of our city then. They even had tea together. Daddy said Woollie did meet Ms. Clark, but he wasn’t sure if they had tea. Daddy said Woollie was put down because he was too sick and there was no way to help him. I cried. I hope Woollie will be happy up there in the sky.\n（fleece 羊毛　weigh 重達）\n\n▶ 第 21 題　What happened when Woollie was put down?", "options": ["He was sold.", "He couldn’t be found.", "He died.", "He became famous."], "answer": 2, "answerLabel": "C", "source": "110 會考｜閱讀測驗｜第 21 題", "explanation": "Woollie 病得太重沒辦法救，Katie 哭了並希望他在天上快樂，put down 指（讓動物）安樂死。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 22, "question": "【閱讀測驗 第 22–24 題】\nHere’s The Piano Lesson, one of Henri Matisse’s most famous paintings. The boy in the picture is the painter’s son, Pierre. In the picture, Pierre looks quite serious. Why? Well, look at the yellow candle on the red piano. It’s almost burned down. So maybe Pierre has already practiced for hours. And Matisse uses a lot of gray, not a very fun color, right? It shows how the poor kid feels, don’t you think?\nOn the top right corner, you can see a woman sitting straight on a seat. Is she Pierre’s piano teacher? Or his mother? Well, if you’re a Matisse fan, you’ll know this is in fact another painting by him, Woman on a High Stool. Interesting, right? Matisse likes to do that a lot. In fact, there’s another work by Matisse in the picture. Did you find it? Right! The sculpture on the bottom left corner!\nMatisse painted this picture in 1916. Pierre was already 16 then, but the artist painted his son much younger than he really was. Pierre had gone away to be a soldier, and Matisse didn’t know whether he would come back. Maybe this is a worried father’s way to remember the good old days.\n（sculpture 雕像）\n\n▶ 第 22 題　What can we learn about The Piano Lesson from the reading?", "options": ["Matisse painted it when his son was away from home.", "The woman who sits on a seat behind the boy is his mother.", "Matisse uses yellow and red to show that his son was happy.", "The candle on the piano shows that the piano lesson has just begun."], "answer": 0, "answerLabel": "A", "source": "110 會考｜閱讀測驗｜第 22 題", "explanation": "1916 年作畫時 Pierre 已離家去當兵。右上角的女子其實是另一幅畫；灰色表現孩子的心情；蠟燭快燒完表示已練了很久。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 23, "question": "【閱讀測驗 第 22–24 題】\nHere’s The Piano Lesson, one of Henri Matisse’s most famous paintings. The boy in the picture is the painter’s son, Pierre. In the picture, Pierre looks quite serious. Why? Well, look at the yellow candle on the red piano. It’s almost burned down. So maybe Pierre has already practiced for hours. And Matisse uses a lot of gray, not a very fun color, right? It shows how the poor kid feels, don’t you think?\nOn the top right corner, you can see a woman sitting straight on a seat. Is she Pierre’s piano teacher? Or his mother? Well, if you’re a Matisse fan, you’ll know this is in fact another painting by him, Woman on a High Stool. Interesting, right? Matisse likes to do that a lot. In fact, there’s another work by Matisse in the picture. Did you find it? Right! The sculpture on the bottom left corner!\nMatisse painted this picture in 1916. Pierre was already 16 then, but the artist painted his son much younger than he really was. Pierre had gone away to be a soldier, and Matisse didn’t know whether he would come back. Maybe this is a worried father’s way to remember the good old days.\n（sculpture 雕像）\n\n▶ 第 23 題　What does do that mean in the reading?", "options": ["Put his family in his paintings.", "Paint to remember the good old days.", "Use a lot of fun colors in his art works.", "Put his earlier art work in a new painting."], "answer": 3, "answerLabel": "D", "source": "110 會考｜閱讀測驗｜第 23 題", "explanation": "前句說畫中的女子其實是他的另一幅畫，Matisse 很喜歡「把自己以前的作品畫進新畫裡」，後面還舉了雕像為例。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 24, "question": "【閱讀測驗 第 22–24 題】\nHere’s The Piano Lesson, one of Henri Matisse’s most famous paintings. The boy in the picture is the painter’s son, Pierre. In the picture, Pierre looks quite serious. Why? Well, look at the yellow candle on the red piano. It’s almost burned down. So maybe Pierre has already practiced for hours. And Matisse uses a lot of gray, not a very fun color, right? It shows how the poor kid feels, don’t you think?\nOn the top right corner, you can see a woman sitting straight on a seat. Is she Pierre’s piano teacher? Or his mother? Well, if you’re a Matisse fan, you’ll know this is in fact another painting by him, Woman on a High Stool. Interesting, right? Matisse likes to do that a lot. In fact, there’s another work by Matisse in the picture. Did you find it? Right! The sculpture on the bottom left corner!\nMatisse painted this picture in 1916. Pierre was already 16 then, but the artist painted his son much younger than he really was. Pierre had gone away to be a soldier, and Matisse didn’t know whether he would come back. Maybe this is a worried father’s way to remember the good old days.\n（sculpture 雕像）\n\n▶ 第 24 題　What is NOT used in the reading to refer to Henri Matisse?", "options": ["The artist.", "The painter.", "The poor kid.", "A worried father."], "answer": 2, "answerLabel": "C", "source": "110 會考｜閱讀測驗｜第 24 題", "explanation": "the poor kid 指的是兒子 Pierre，其他三個都指 Matisse。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 25, "question": "【閱讀測驗 第 25–28 題】\nOn Teachers’ Day, we thank our teachers for their hard work. We also celebrate this day to remember Confucius, the great Chinese teacher from 2,500 years ago. Well, that’s everything we’re taught about Teachers’ Day. But, the first Teachers’ Day was not on Confucius’s birthday, and it was not about thanking our teachers.\nIn 1930, Mr. Tai Shuang-qiu and other teachers celebrated the first Teachers’ Day in Nanjing. But there was nothing to celebrate. Teachers were paid very little and not respected. These teachers took this chance to shout out their problems. They had Teachers’ Day on June 6 because the date was easy to remember and near the end of the school year. This action by Mr. Tai and the other teachers was welcomed and followed by teachers from other cities. In 1939, the government made Teachers’ Day a national holiday. However, it was on August 27, the day when Confucius’s birthday was celebrated. Not everyone hailed this decision: Teachers’ Day was never about Confucius, and Confucius couldn’t speak for all the teachers either.\nOne funny thing was that the government was wrong about the date of Confucius’s birthday. In 1952, people found out he was in fact born on September 28. That was when we started to celebrate Teachers’ Day on Confucius’s real birthday.\n（respect 尊敬　government 政府）\n\n▶ 第 25 題　What idea is talked about in the reading?", "options": ["How Teachers’ Day is celebrated now.", "Why Teachers’ Day was celebrated at first.", "Why Confucius was seen as a great teacher.", "How teachers today feel about Teachers’ Day."], "answer": 1, "answerLabel": "B", "source": "110 會考｜閱讀測驗｜第 25 題", "explanation": "文章說明第一個教師節是老師們為了喊出薪水低、不受尊重的問題而辦的，談的是教師節「最初」的由來。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 26, "question": "【閱讀測驗 第 25–28 題】\nOn Teachers’ Day, we thank our teachers for their hard work. We also celebrate this day to remember Confucius, the great Chinese teacher from 2,500 years ago. Well, that’s everything we’re taught about Teachers’ Day. But, the first Teachers’ Day was not on Confucius’s birthday, and it was not about thanking our teachers.\nIn 1930, Mr. Tai Shuang-qiu and other teachers celebrated the first Teachers’ Day in Nanjing. But there was nothing to celebrate. Teachers were paid very little and not respected. These teachers took this chance to shout out their problems. They had Teachers’ Day on June 6 because the date was easy to remember and near the end of the school year. This action by Mr. Tai and the other teachers was welcomed and followed by teachers from other cities. In 1939, the government made Teachers’ Day a national holiday. However, it was on August 27, the day when Confucius’s birthday was celebrated. Not everyone hailed this decision: Teachers’ Day was never about Confucius, and Confucius couldn’t speak for all the teachers either.\nOne funny thing was that the government was wrong about the date of Confucius’s birthday. In 1952, people found out he was in fact born on September 28. That was when we started to celebrate Teachers’ Day on Confucius’s real birthday.\n（respect 尊敬　government 政府）\n\n▶ 第 26 題　Which is true about Teachers’ Day from the reading?", "options": ["It used to be celebrated on different dates.", "It was started by students for their teachers.", "It has been celebrated in Nanjing for over 2,500 years.", "Teachers decided to celebrate it on Confucius’s birthday."], "answer": 0, "answerLabel": "A", "source": "110 會考｜閱讀測驗｜第 26 題", "explanation": "教師節先後是 6 月 6 日、8 月 27 日，後來才改成 9 月 28 日。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 27, "question": "【閱讀測驗 第 25–28 題】\nOn Teachers’ Day, we thank our teachers for their hard work. We also celebrate this day to remember Confucius, the great Chinese teacher from 2,500 years ago. Well, that’s everything we’re taught about Teachers’ Day. But, the first Teachers’ Day was not on Confucius’s birthday, and it was not about thanking our teachers.\nIn 1930, Mr. Tai Shuang-qiu and other teachers celebrated the first Teachers’ Day in Nanjing. But there was nothing to celebrate. Teachers were paid very little and not respected. These teachers took this chance to shout out their problems. They had Teachers’ Day on June 6 because the date was easy to remember and near the end of the school year. This action by Mr. Tai and the other teachers was welcomed and followed by teachers from other cities. In 1939, the government made Teachers’ Day a national holiday. However, it was on August 27, the day when Confucius’s birthday was celebrated. Not everyone hailed this decision: Teachers’ Day was never about Confucius, and Confucius couldn’t speak for all the teachers either.\nOne funny thing was that the government was wrong about the date of Confucius’s birthday. In 1952, people found out he was in fact born on September 28. That was when we started to celebrate Teachers’ Day on Confucius’s real birthday.\n（respect 尊敬　government 政府）\n\n▶ 第 27 題　What does “not everyone hailed this decision” mean in the reading?", "options": ["Not everyone cared about the decision.", "Not everyone welcomed the decision.", "Not everyone heard about the decision.", "Not everyone remembered the decision."], "answer": 1, "answerLabel": "B", "source": "110 會考｜閱讀測驗｜第 27 題", "explanation": "冒號後說明理由：教師節本來就和孔子無關，孔子也不能代表所有老師，表示不是每個人都「贊成」這個決定。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 28, "question": "【閱讀測驗 第 25–28 題】\nOn Teachers’ Day, we thank our teachers for their hard work. We also celebrate this day to remember Confucius, the great Chinese teacher from 2,500 years ago. Well, that’s everything we’re taught about Teachers’ Day. But, the first Teachers’ Day was not on Confucius’s birthday, and it was not about thanking our teachers.\nIn 1930, Mr. Tai Shuang-qiu and other teachers celebrated the first Teachers’ Day in Nanjing. But there was nothing to celebrate. Teachers were paid very little and not respected. These teachers took this chance to shout out their problems. They had Teachers’ Day on June 6 because the date was easy to remember and near the end of the school year. This action by Mr. Tai and the other teachers was welcomed and followed by teachers from other cities. In 1939, the government made Teachers’ Day a national holiday. However, it was on August 27, the day when Confucius’s birthday was celebrated. Not everyone hailed this decision: Teachers’ Day was never about Confucius, and Confucius couldn’t speak for all the teachers either.\nOne funny thing was that the government was wrong about the date of Confucius’s birthday. In 1952, people found out he was in fact born on September 28. That was when we started to celebrate Teachers’ Day on Confucius’s real birthday.\n（respect 尊敬　government 政府）\n\n▶ 第 28 題　What does the writer try to do with this reading?", "options": ["To talk about a problem that no one notices.", "To share a fun experience that was not common.", "To tell a piece of history that few people know about.", "To give an example of an idea that is hard to understand."], "answer": 2, "answerLabel": "C", "source": "110 會考｜閱讀測驗｜第 28 題", "explanation": "開頭說「這就是我們被教的全部」，接著說出第一個教師節的真正由來，是在介紹一段少有人知的歷史。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 29, "question": "【閱讀測驗 第 29–31 題】\nDear Traveler,\nYou have bought an NFR ticket online for a train that runs between White Water City and Cloud City.\nWe are sorry to tell you that, because of the typhoon last month, the Sand Town – Spring Town line will be closed between August 14 and 28 2016. During this time, some trains will change lines and will not stop at a few stations. There will be free buses to take travelers to these stations. Please check below for the changes. Visit http://www.nfr.gov/ for more information.\nWe wish you a nice summer.\nLena Muller, National Formosa Railway\n\n1. Trains that run between Green City and Cloud City will take the Smoke Town – Spring Town line, and will stop at every station. Below are the trains that will change lines.\nGoing South　RL101 White Water City → Cloud City／RL102 White Water City → Spring Town／RL103 Green City → Cloud City\nGoing North　RL201 Spring Town → Green City／RL202 Cloud City → Green City\n2. The free buses for the Sand Town – Spring Town line will wait at Green City (going south) and Spring Town (going north) stations. No stop at Gray Village.\n（見下方路線圖；line 路線）\n\n▶ 第 29 題　Why does National Formosa Railway write this letter?", "options": ["There is a train ticket sale.", "A train line will be closed in July.", "It will open a new train line in August.", "Some of its trains will run on different lines."], "answer": 3, "answerLabel": "D", "source": "110 會考｜閱讀測驗｜第 29 題", "explanation": "因颱風，Sand Town – Spring Town 線 8 月停駛，部分列車將改走其他路線，信是為了通知這件事。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap110-g29.png?v=20261120-7"}, { e of the typhoon last month, the Sand Town – Spring Town line will be closed between August 14 and 28 2016. During this time, some trains will change lines and will not stop at a few stations. There will be free buses to take travelers to these stations. Please check below for the changes. Visit http://www.nfr.gov/ for more information.\nWe wish you a nice summer.\nLena Muller, National Formosa Railway\n\n1. Trains that run between Green City and Cloud City will take the Smoke Town – Spring Town line, and will stop at every station. Below are the trains that will change lines.\nGoing South　RL101 White Water City → Cloud City／RL102 White Water City → Spring Town／RL103 Green City → Cloud City\nGoing North　RL201 Spring Town → Green City／RL202 Cloud City → Green City\n2. The free buses for the Sand Town – Spring Town line will wait at Green City (going south) and Spring Town (going north) stations. No stop at Gray Village.\n（見下方路線圖；line 路線）\n\n▶ 第 31 題　James lives in Smoke Town. He wants to go to Black Town on August 19. How can he get there?", "options": ["Take Train RL202 to Green City, get off there, and take the free bus.", "Take Train RL103 to Green City, get off there, and take the free bus.", "Take Train RL102 to Spring Town, get off there, and take Train RL201.", "Take Train RL101 to Cloud City, get off there, and take the free bus."], "answer": 0, "answerLabel": "A", "source": "110 會考｜閱讀測驗｜第 31 題", "explanation": "Black Town 在停駛路段，只能搭接駁車，而南下接駁車在 Green City 等。RL202（Cloud City → Green City）改走 Smoke Town 線、每站都停，James 可在 Smoke Town 上車到 Green City，再換接駁車。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap110-g29.png?v=20261120-7"}, {"id": 32, "question": "【閱讀測驗 第 32–34 題】\nIn Darayya, a city in Syria, there’s a library, and it has 15,000 books on almost every subject you can think of. However, it is different from any libraries you know: It is a secret underground library, and only people in Darayya know where it is.\nOver the years, war has shaken Darayya badly. Every day, houses are bombed and people are killed. Stores are closed one after another, and so are schools. To help the kids in Darayya with their learning, Anas Ahmad, a 19-year-old student, and his friends decided to build a library. They built the library under the ground to keep it safe from bombing. But it is dangerous to collect books for the library. Often, Ahmad and his friends look for books in houses that were bombed. They need to be careful because they may be killed in another bombing.\nYou may ask, “In a place like Darayya, would people be interested in books?” “Just like the body needs food, the mind needs books,” says one library user. In the library, people enjoy their time of reading and forget about the terrible world above, so their life doesn’t seem so hard. Through reading, they are able to dream of a better life after war.\n（war 戰爭　bomb 轟炸　seem 彷彿）\n\n▶ 第 32 題　Below are the ideas that are talked about in the reading.\na. The problems Darayya has.\nb. How Darayya’s library was started.\nc. What makes Darayya’s library special.\nd. How Darayya’s library helps people there.\nIn what order does the writer put his ideas in the reading?", "options": ["c → b → a → d", "b → a → d → c", "a → c → b → d", "c → a → b → d"], "answer": 3, "answerLabel": "D", "source": "110 會考｜閱讀測驗｜第 32 題", "explanation": "先說圖書館的特別之處（地下、秘密，c），再說戰爭帶來的問題（a），接著說圖書館怎麼建起來（b），最後說它如何幫助人們（d）。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 33, "question": "【閱讀測驗 第 32–34 題】\nIn Darayya, a city in Syria, there’s a library, and it has 15,000 books on almost every subject you can think of. However, it is different from any libraries you know: It is a secret underground library, and only people in Darayya know where it is.\nOver the years, war has shaken Darayya badly. Every day, houses are bombed and people are killed. Stores are closed one after another, and so are schools. To help the kids in Darayya with their learning, Anas Ahmad, a 19-year-old student, and
