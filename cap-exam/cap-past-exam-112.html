<script>window.QUIZ_CONFIG={"title": "112 年國中會考英語｜單題＋閱讀測驗＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. The man is holding a ______ of grapes in his hands.", "options": ["bag", "basket", "bowl", "box"], "answer": 1, "answerLabel": "B", "source": "112 會考｜單題｜第 1 題", "explanation": "圖中男子手上拿著一「籃」葡萄：a basket of grapes。", "explanationSource": "own", "section": "單題", "image": "assets/cap112-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　Dennis enjoys ______ in public. He is proud of his beautiful voice.", "options": ["dancing", "drawing", "shopping", "singing"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 2 題", "explanation": "他對自己好聽的嗓音很自豪，所以喜歡在公開場合「唱歌」：enjoy singing。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Mrs. Johnson can’t hear very well. If you need to talk to her, you must ______.", "options": ["explain", "hurry", "listen", "shout"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 3 題", "explanation": "她聽力不好，跟她說話必須「大聲喊」：shout。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　People got very excited when they watched Ms. Smith ______ at the party.", "options": ["danced", "dancing", "has danced", "to dance"], "answer": 1, "answerLabel": "B", "source": "112 會考｜單題｜第 4 題", "explanation": "感官動詞 watch + 受詞 + V-ing／原形：watched Ms. Smith dancing。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　I tried on these shoes in several different ______, and I thought the white pair looked best on me.", "options": ["colors", "prices", "shapes", "sizes"], "answer": 0, "answerLabel": "A", "source": "112 會考｜單題｜第 5 題", "explanation": "試穿不同「顏色」，最後覺得白色那雙最好看：colors。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Rex did not feel the earthquake this morning. He ______ in the park at the time.", "options": ["jogged", "was jogging", "has jogged", "would jog"], "answer": 1, "answerLabel": "B", "source": "112 會考｜單題｜第 6 題", "explanation": "地震發生的「當時」他正在公園慢跑：過去進行式 was jogging。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　Mr. Lee has worked in the same store for ten years; he’s never thought about ______ his job.", "options": ["changing", "finding", "remembering", "starting"], "answer": 0, "answerLabel": "A", "source": "112 會考｜單題｜第 7 題", "explanation": "think about + V-ing：從沒想過「換」工作：changing。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　I didn’t take the bus today because it was ______. All the seats were taken and a lot of students were standing.", "options": ["dirty", "fast", "full", "wrong"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 8 題", "explanation": "座位都坐滿、很多人站著，公車很「滿」：full。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Don’t go away when you’re cooking, ______ the food might burn.", "options": ["but", "if", "or", "so"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 9 題", "explanation": "煮飯時別離開，「否則」食物可能燒焦：or。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Jerry wanted to know ______ he was kicked off the soccer team, but no one gave him a good reason.", "options": ["where", "when", "whether", "why"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 10 題", "explanation": "後句說沒人給他好理由，所以他想知道「為什麼」被踢出球隊：why。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　Jenny is already forty, doesn’t have a job and often makes trouble for her parents. To them, she is really a(n) ______.", "options": ["daughter", "example", "gift", "headache"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 11 題", "explanation": "四十歲沒工作還常惹麻煩，對父母來說是令人「頭痛」的人：headache。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Ed and Jill ______ camping this weekend, so they have to finish their homework by Friday.", "options": ["went", "were going", "are going", "have gone"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 12 題", "explanation": "this weekend 的計畫，用現在進行式表示即將發生：are going。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　Doraemon, a blue Japanese robot cat, has hated mice since his ears ______ by a mouse.", "options": ["bit", "bite", "were bitten", "have bitten"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 13 題", "explanation": "耳朵是「被」老鼠咬的，since 後接過去式被動 were bitten。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　If we play some interesting games in class, there ______ more fun in learning English.", "options": ["are", "has", "will be", "will have"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 14 題", "explanation": "if 子句用現在式，主要子句用未來式：there will be more fun。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　The ______ of this shop was so bad; I never got any answer after I emailed them my questions.", "options": ["item", "business", "price", "service"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 15 題", "explanation": "寄信問問題都沒得到回覆，表示這家店的「服務」很差：service。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "第 16 題　It’s not easy to see those islands clearly from here on sunny days, and it’s even less ______ to see them on cloudy days.", "options": ["difficult", "lucky", "possible", "special"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 16 題", "explanation": "晴天都看不清楚了，陰天更「不可能」看見：even less possible。", "explanationSource": "own", "section": "單題"}, {"id": 17, "question": "第 17 題　Do you remember the CD I was looking for for months? I ______ found it in a small shop. Look, here it is!", "options": ["almost", "even", "finally", "still"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 17 題", "explanation": "找了好幾個月的 CD，「終於」在小店找到了：finally。", "explanationSource": "own", "section": "單題"}, {"id": 18, "question": "第 18 題　Business at Jane’s shop has not been good these days. And the new supermarket across the street only makes things ______.", "options": ["easier", "worse", "more boring", "more convenient"], "answer": 1, "answerLabel": "B", "source": "112 會考｜單題｜第 18 題", "explanation": "生意已經不好，對面新超市只會讓情況「更糟」：makes things worse。", "explanationSource": "own", "section": "單題"}, {"id": 19, "question": "第 19 題　Scott wasn’t sure if the young woman before him was ______ pulled him out of a car on fire.", "options": ["who", "the one", "the one she", "the one who"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 19 題", "explanation": "the one who＝那個…的人；who 當關係子句的主詞：the one who pulled him out...", "explanationSource": "own", "section": "單題"}, {"id": 20, "question": "第 20 題　I ______ swimming for several years before I went to this high school. I gave it up because of heavy schoolwork.", "options": ["have practiced", "am practicing", "practiced", "would practice"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 20 題", "explanation": "上高中前練了好幾年、現在已經放棄，是過去的事：過去式 practiced。", "explanationSource": "own", "section": "單題"}, {"id": 21, "question": "第 21 題　Frank Kane is so good in the movie that many people ______ he will win the best actor prize.", "options": ["expect", "forget", "notice", "plan"], "answer": 0, "answerLabel": "A", "source": "112 會考｜單題｜第 21 題", "explanation": "他演得很好，很多人「預期」他會得最佳男主角：expect。", "explanationSource": "own", "section": "單題"}, {"id": 22, "question": "第 22 題　The new medicine that just came out on the market ______ thousands of lives.", "options": ["and saved", "has saved", "saving", "to save"], "answer": 1, "answerLabel": "B", "source": "112 會考｜單題｜第 22 題", "explanation": "新藥上市以來「已經拯救」上千條生命：現在完成式 has saved。", "explanationSource": "own", "section": "單題"}, {"id": 23, "question": "第 23 題　Now I often think of those days with Pip, my pet dog. When I read in my room, he ______ quietly beside me.", "options": ["will come and sit", "comes and sits", "has come and sat", "used to come and sit"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 23 題", "explanation": "Now I often think of those days 表示是過去的習慣：used to come and sit。", "explanationSource": "own", "section": "單題"}, {"id": 24, "question": "【閱讀測驗 第 24–25 題】\nFour Seasons’ Kitchen\nOpening hours: 2:00~8:00 pm　Tuesday~Sunday\n(We’re closed on Mondays and the second Sunday of every month.)\nSandwiches\n• Beach Sandwich … $70 (Bread + Fish + Lettuce)\n• Garden Sandwich … $80 (Bread + Chicken + Tomatoes + Cheese)\n• Sunday Sandwich … $90 (Bread + Egg + Steak + Ham + Lettuce)\nDrinks\n• Spring Rain … $50 (Green Tea + Guava + Lemon)\n• Summer Rainbow … $60 (Milk + Watermelon)\n• Autumn Wind … $60 (Black Tea + Apple)\n• Winter Snow … $70 (Chocolate Milk + Ice Cream)\nGood News: Star-Collecting Plan\n★ You get a star by ordering a sandwich or a drink.\n★ With 15 stars, you can get a $60 drink for free!\n\n▶ 第 24 題　Amy went to Four Seasons’ Kitchen with her mother after she collected 15 stars. They ordered two Garden Sandwiches, an Autumn Wind, and a Winter Snow. After using the stars, how much did they pay for their meals?", "options": ["$290.", "$230.", "$220.", "$160."], "answer": 1, "answerLabel": "B", "source": "112 會考｜閱讀測驗｜第 24 題", "explanation": "兩份 Garden Sandwich 160 元＋Autumn Wind 60 元＋Winter Snow 70 元＝290 元；15 顆星可免費換一杯 60 元飲料，290－60＝230 元。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap112-g24.png?v=20261120-7"}, {"id": 25, "question": "【閱讀測驗 第 24–25 題】\nFour Seasons’ Kitchen\nOpening hours: 2:00~8:00 pm　Tuesday~Sunday\n(We’re closed on Mondays and the second Sunday of every month.)\nSandwiches\n• Beach Sandwich … $70 (Bread + Fish + Lettuce)\n• Garden Sandwich … $80 (Bread + Chicken + Tomatoes + Cheese)\n• Sunday Sandwich … $90 (Bread + Egg + Steak + Ham + Lettuce)\nDrinks\n• Spring Rain … $50 (Green Tea + Guava + Lemon)\n• Summer Rainbow … $60 (Milk + Watermelon)\n• Autumn Wind … $60 (Black Tea + Apple)\n• Winter Snow … $70 (Chocolate Milk + Ice Cream)\nGood News: Star-Collecting Plan\n★ You get a star by ordering a sandwich or a drink.\n★ With 15 stars, you can get a $60 drink for free!\n\n▶ 第 25 題　Amy wants to bring her friends to Four Seasons’ Kitchen in August. She looks at her calendar (月曆) to pick a time to go there. Which are the time and date she can choose?", "options": ["8:30 pm, August 1.", "5:00 pm, August 11.", "3:00 pm, August 13.", "2:00 pm, August 28."], "answer": 1, "answerLabel": "B", "source": "112 會考｜閱讀測驗｜第 25 題", "explanation": "營業時間 2:00–8:00 pm，週一和每月第二個週日公休。8/1 晚上 8:30 已打烊；8/13 是第二個週日；8/28 是週一。8/11 週五 5 點 Amy 也沒有行程。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap112-q25.png?v=20261120-7"}, {"id": 26, "question": "【閱讀測驗 第 26–27 題】\nClass: Science　Date: 2020/6/17\nWhat Should You Do If You Find a Baby Bird Out of the Nest?\nIf the bird is HURT:\nCall the animal center (0-123-4567).\nOR\nCarefully pick the bird up and take it to an animal hospital.\n(Keep it warm and don’t give it any food!)\nIf the bird is NOT HURT:\n○ If it has FEW FEATHERS:\n　+ You CAN reach the nest → Put the bird back.\n　+ If you CAN’T find or reach the nest → Call the animal center.\n○ If it has FEATHERS:\n　+ Just leave it there! (It’s learning how to fly!)\nNote: People believe birds will give up their babies if they have the smell of people on them. → WRONG! Birds don’t care!\n（nest 鳥巢　feather 羽毛）\n\n▶ 第 26 題　According to the notes, which is the WRONG way to help a baby bird that is out of its nest?", "options": ["Feed it before you take it to a hospital.", "Leave it alone if it is not hurt and has feathers.", "Call the animal center if you can’t find its nest.", "Put it back in its nest if it is not hurt and has few feathers."], "answer": 0, "answerLabel": "A", "source": "112 會考｜閱讀測驗｜第 26 題", "explanation": "筆記寫受傷的鳥要保暖，而且 don’t give it any food，所以先餵食是錯的。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap112-g26.png?v=20261120-7"}, {"id": 27, "question": "【閱讀測驗 第 26–27 題】\nClass: Science　Date: 2020/6/17\nWhat Should You Do If You Find a Baby Bird Out of the Nest?\nIf the bird is HURT:\nCall the animal center (0-123-4567).\nOR\nCarefully pick the bird up and take it to an animal hospital.\n(Keep it warm and don’t give it any food!)\nIf the bird is NOT HURT:\n○ If it has FEW FEATHERS:\n　+ You CAN reach the nest → Put the bird back.\n　+ If you CAN’T find or reach the nest → Call the animal center.\n○ If it has FEATHERS:\n　+ Just leave it there! (It’s learning how to fly!)\nNote: People believe birds will give up their babies if they have the smell of people on them. → WRONG! Birds don’t care!\n（nest 鳥巢　feather 羽毛）\n\n▶ 第 27 題　According to the notes, what do birds do if their babies have the smell of people on them?", "options": ["They keep taking care of them.", "They push them out of the nest.", "They clean them until the smell goes away.", "They leave them behind and move to a new nest."], "answer": 0, "answerLabel": "A", "source": "112 會考｜閱讀測驗｜第 27 題", "explanation": "一般人以為鳥會拋棄有人類氣味的幼鳥，但筆記說 WRONG! Birds don’t care!，鳥會繼續照顧牠們。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap112-g26.png?v=20261120-7"}, {"id": 28, "question": "【閱讀測驗 第 28–29 題】\nFROM THE FARM TO THE TABLE: FIVE STAGES OF FOOD WASTE\nStage 1 On the farm: Throw away food of wrong shapes or sizes／Grow more food than the market needs\nStage 2 On the road: Do not have refrigerators to keep food fresh／Lose food that falls off the truck\nStage 3 At factories: Do not have enough machines to make, keep and pack food／Throw away food of wrong shapes or sizes\nStage 4 At stores: Throw away food that does not look fresh／Order more food than they can sell\nStage 5 At homes or restaurants: Buy too much food／Throw away food when it is still safe to eat\nWHAT PERCENTAGE OF FOOD IN EACH AREA IS WASTED AT EACH STAGE IN 2014?（Stage 1／2／3／4／5）\nNorth America & Oceania 32.4%: 10.5%／3.5%／3.4%／2.4%／12.6%\nEurope 31.4%: 11.3%／3.4%／3.9%／2.2%／10.6%\nSouth & Southeast Asia 28.2%: 8.7%／9.6%／2.7%／4.6%／2.6%\n（stage 階段　waste 浪費　percentage 百分比）\n\n▶ 第 28 題　According to the reading, which is one of the reasons for food waste?", "options": ["Stores do not know how to pack food well.", "Farmers do not have enough machines to collect food.", "There is no refrigerator on the truck to keep food fresh.", "Factories do not have enough trucks to carry food to stores."], "answer": 2, "answerLabel": "C", "source": "112 會考｜閱讀測驗｜第 28 題", "explanation": "Stage 2（運送途中）的原因之一是 Do not have refrigerators to keep food fresh。缺機器的是工廠，不是農夫。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap112-g28.png?v=20261120-7"}, {"id": 29, "question": "【閱讀測驗 第 28–29 題】\nFROM THE FARM TO THE TABLE: FIVE STAGES OF FOOD WASTE\nStage 1 On the farm: Throw away food of wrong shapes or sizes／Grow more food than the market needs\nStage 2 On the road: Do not have refrigerators to keep food fresh／Lose food that falls off the truck\nStage 3 At factories: Do not have enough machines to make, keep and pack food／Throw away food of wrong shapes or sizes\nStage 4 At stores: Throw away food that does not look fresh／Order more food than they can sell\nStage 5 At homes or restaurants: Buy too much food／Throw away food when it is still safe to eat\nWHAT PERCENTAGE OF FOOD IN EACH AREA IS WASTED AT EACH STAGE IN 2014?（Stage 1／2／3／4／5）\nNorth America & Oceania 32.4%: 10.5%／3.5%／3.4%／2.4%／12.6%\nEurope 31.4%: 11.3%／3.4%／3.9%／2.2%／10.6%\nSouth & Southeast Asia 28.2%: 8.7%／9.6%／2.7%／4.6%／2.6%\n（stage 階段　waste 浪費　percentage 百分比）\n\n▶ 第 29 題　Which is true about food waste at each stage in the three parts of the world?", "options": ["For each area, the highest percentage of food waste happens at Stage 5.", "Europe has a lower percentage of food waste at Stage 3 than the other two areas.", "North America & Oceania has a higher percentage of food waste at Stage 1 than Europe.", "South & Southeast Asia has a higher percentage of food waste at Stage 4 than the other two areas."], "answer": 3, "answerLabel": "D", "source": "112 會考｜閱讀測驗｜第 29 題", "explanation": "Stage 4 南亞與東南亞 4.6%，高於北美 2.4% 和歐洲 2.2%。南亞最高的是 Stage 2；歐洲 Stage 3 的 3.9% 最高；北美 Stage 1 的 10.5% 比歐洲 11.3% 低。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap112-g28.png?v=20261120-7"}, {"id": 30, "question": "【閱讀測驗 第 30–32 題】\nSometimes when the rain falls hard and fast on you, it might hurt a little. But what happens when it hits a mosquito? A 2012 study says when a raindrop falls on a mosquito, it’s like when a bus hits a person. Besides, the little insect is hit by a raindrop about once every 20 seconds. So why don’t we see many dead mosquitoes after it rains?\nA mosquito is as big as a raindrop, but it is much lighter — 0.002 g only. This saves its life in raindrop attacks. Because the mosquito is so light, when it is hit by a raindrop, it won’t experience a force that is strong enough to kill it.\nThe study also found that when a mosquito is hit by a raindrop, the insect is pushed by the raindrop and falls together with it. But the mosquito doesn’t get wet easily because it is covered with hairs which keep off water. After dropping about 6 cm, it will roll off the raindrop and fly away.\nHowever, this trick isn’t always successful. If the mosquito flies too low when it is hit by the raindrop, it won’t have time to fly off. Then it will hit the ground and meet its death.\n（force 力量）\n\n▶ 第 30 題　What is the trick that the mosquito uses in rain?", "options": ["It shakes its body fast enough to get water off.", "It drops with the raindrop and then rolls off it.", "It flies behind the raindrop and pushes it away.", "It rides on the raindrop and lands on the ground."], "answer": 1, "answerLabel": "B", "source": "112 會考｜閱讀測驗｜第 30 題", "explanation": "蚊子被雨滴打中時跟著雨滴一起掉落，約 6 公分後從雨滴上滾開飛走，this trick 指這個方法。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 31, "question": "【閱讀測驗 第 30–32 題】\nSometimes when the rain falls hard and fast on you, it might hurt a little. But what happens when it hits a mosquito? A 2012 study says when a raindrop falls on a mosquito, it’s like when a bus hits a person. Besides, the little insect is hit by a raindrop about once every 20 seconds. So why don’t we see many dead mosquitoes after it rains?\nA mosquito is as big as a raindrop, but it is much lighter — 0.002 g only. This saves its life in raindrop attacks. Because the mosquito is so light, when it is hit by a raindrop, it won’t experience a force that is strong enough to kill it.\nThe study also found that when a mosquito is hit by a raindrop, the insect is pushed by the raindrop and falls together with it. But the mosquito doesn’t get wet easily because it is covered with hairs which keep off water. After dropping about 6 cm, it will roll off the raindrop and fly away.\nHowever, this trick isn’t always successful. If the mosquito flies too low when it is hit by the raindrop, it won’t have time to fly off. Then it will hit the ground and meet its death.\n（force 力量）\n\n▶ 第 31 題　What keeps a mosquito safe in the rain?", "options": ["It is very light.", "It has no body hairs.", "It is as big as a raindrop.", "It is strong enough to fight the force of a raindrop."], "answer": 0, "answerLabel": "A", "source": "112 會考｜閱讀測驗｜第 31 題", "explanation": "蚊子只有 0.002 公克，因為很輕，被雨滴打到時受到的力量不足以致命。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 32, "question": "【閱讀測驗 第 30–32 題】\nSometimes when the rain falls hard and fast on you, it might hurt a little. But what happens when it hits a mosquito? A 2012 study says when a raindrop falls on a mosquito, it’s like when a bus hits a person. Besides, the little insect is hit by a raindrop about once every 20 seconds. So why don’t we see many dead mosquitoes after it rains?\nA mosquito is as big as a raindrop, but it is much lighter — 0.002 g only. This saves its life in raindrop attacks. Because the mosquito is so light, when it is hit by a raindrop, it won’t experience a force that is strong enough to kill it.\nThe study also found that when a mosquito is hit by a raindrop, the insect is pushed by the raindrop and falls together with it. But the mosquito doesn’t get wet easily because it is covered with hairs which keep off water. After dropping about 6 cm, it will roll off the raindrop and fly away.\nHowever, this trick isn’t always successful. If the mosquito flies too low when it is hit by the raindrop, it won’t have time to fly off. Then it will hit the ground and meet its death.\n（force 力量）\n\n▶ 第 32 題　When would it be dangerous for a mosquito in the rain?", "options": ["When it flies too close to the ground.", "When the rain falls too hard and too fast.", "When it is hit by raindrops too many times.", "When it drops for more than 6 cm in the rain."], "answer": 0, "answerLabel": "A", "source": "112 會考｜閱讀測驗｜第 32 題", "explanation": "如果被打中時飛得太低，來不及飛走就會撞到地面而死。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 33, "question": "【閱讀測驗 第 33–35 題】\nYou probably have heard Beethoven’s famous piano piece “For Elise,” but do you know who “Elise” was?\nOne story is that Elise was Elisabeth Röckel. She once sang in Beethoven’s opera Fidelio, and the two became very good friends. Beethoven called her “Elise.” When Röckel was leaving the city of Vienna, Beethoven wrote “For Elise” to say goodbye to her. Another story is that Elise was Therese Malfatti. Beethoven was in love with her. He wrote a piece for her and put “For Therese” on the manuscript. Malfatti kept the manuscript and left it to her family when she died. Later, a man copied the manuscript and wrote “For Elise” by mistake. There is another possible Elise: Elise Barensfeld. She learned the piano from Malfatti, the same Malfatti in the second story. To help Malfatti, Beethoven wrote the piece for her to use to teach Barensfeld.\nThese are just some guesses about who Elise was. We may never know the right answer. No one knew about the piece until 1867, when the manuscript was found. This was 40 years after Beethoven’s death, so he wasn’t around to tell us who Elise was. Only one thing is for sure: “For Elise” will always be enjoyed.\n（opera 歌劇　manuscript 手稿）\n\n▶ 第 33 題　What do the three stories in the reading all talk about?", "options": ["Who Beethoven’s true love was.", "Who played “For Elise” the best.", "How “For Elise” became popular.", "Why Beethoven wrote “For Elise.”"], "answer": 3, "answerLabel": "D", "source": "112 會考｜閱讀測驗｜第 33 題", "explanation": "三個說法分別是為了和朋友道別、送給心愛的人、幫朋友教學生，都在說貝多芬「為什麼」寫這首曲子。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 34, "question": "【閱讀測驗 第 33–35 題】\nYou probably have heard Beethoven’s famous piano piece “For Elise,” but do you know who “Elise” was?\nOne story is that Elise was Elisabeth Röckel. She once sang in Beethoven’s opera Fidelio, and the two became very good friends. Beethoven called her “Elise.” When Röckel was leaving the city of Vienna, Beethoven wrote “For Elise” to say goodbye to her. Another story is that Elise was Therese Malfatti. Beethoven was in love with her. He wrote a piece for her and put “For Therese” on the manuscript. Malfatti kept the manuscript and left it to her family when she died. Later, a man copied the manuscript and wrote “For Elise” by mistake. There is another possible Elise: Elise Barensfeld. She learned the piano from Malfatti, the same Malfatti in the second story. To help Malfatti, Beethoven wrote the piece for her to use to teach Barensfeld.\nThese are just some guesses about who Elise was. We may never know the right answer. No one knew about the piece until 1867, when the manuscript was found. This was 40 years after Beethoven’s death, so he wasn’t around to tell us who Elise was. Only one thing is for sure: “For Elise” will always be enjoyed.\n（opera 歌劇　manuscript 手稿）\n\n▶ 第 34 題　What do we know about “For Elise” from the reading?", "options": ["It first appeared in the opera Fidelio.", "The true “Elise” was Elise Barensfeld.", "The manuscript was found after Beethoven died.", "The manuscript is now kept by the city of Vienna."], "answer": 2, "answerLabel": "C", "source": "112 會考｜閱讀測驗｜第 34 題", "explanation": "手稿 1867 年才被發現，是貝多芬過世 40 年後。真正的 Elise 是誰至今仍不確定。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 35, "question": "【閱讀測驗 第 33–35 題】\nYou probably have heard Beethoven’s famous piano piece “For Elise,” but do you know who “Elise” was?\nOne story is that Elise was Elisabeth Röckel. She once sang in Beethoven’s opera Fidelio, and the two became very good friends. Beethoven called her “Elise.” When Röckel was leaving the city of Vienna, Beethoven wrote “For Elise” to say goodbye to her. Another story is that Elise was Therese Malfatti. Beethoven was in love with her. He wrote a piece for her and put “For Therese” on the manuscript. Malfatti kept the manuscript and left it to her family when she died. Later, a man copied the manuscript and wrote “For Elise” by mistake. There is another possible Elise: Elise Barensfeld. She learned the piano from Malfatti, the same Malfatti in the second story. To help Malfatti, Beethoven wrote the piece for her to use to teach Barensfeld.\nThese are just some guesses about who Elise was. We may never know the right answer. No one knew about the piece until 1867, when the manuscript was found. This was 40 years after Beethoven’s death, so he wasn’t around to tell us who Elise was. Only one thing is for sure: “For Elise” will always be enjoyed.\n（opera 歌劇　manuscript 手稿）\n\n▶ 第 35 題　What can we learn about the three women from the stories?", "options": ["They were called “Elise” by their friends.", "Elisabeth Röckel was a close friend of Beethoven’s.", "Therese Malfatti changed “For Elise” to “For Therese.”", "Elise Barensfeld was Beethoven’s student."], "answer": 1, "answerLabel": "B", "source": "112 會考｜閱讀測驗｜第 35 題", "explanation": "Röckel 唱過貝多芬的歌劇，兩人 became very good friends。Barensfeld 是 Malfatti 的學生；是抄寫的人誤寫成 For Elise。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 36, "question": "【閱讀測驗 第 36–38 題】\nJesse Cohen Says　Family 365　Jul. 2017\nWhich would you give a boy for his birthday, a toy truck or a doll? If you choose the truck, well, you’re not alone. Most people think that some toys are for boys and some are for girls. We might pick building toys for boys and kitchen toys for girls. But why do we do this? Are boys and girls really born with different interests in toys?\nNo, they are not. Children start to show different interests in toys at age three, but only because at this time, they begin to learn about gender and to follow what others of their gender do. If you give a girl kitchen toys, she will think they are girls’ toys because she sees other girls playing with them. But if you give a girl a toy car and show her a group of girls who are playing with cars, she’ll play with the toy car and think it is a girls’ toy. This “watch and follow” habit often becomes a rule for both boys and girls in choosing the “right” toys.\nHowever, this rule can be bad for children. Different toys teach children different things. Dolls help with their early language use, and building toys are good for learning math and science. By playing with different toys, children can find out what they are interested in or what they are good at. If they only play one kind of toy, they may lose this important chance. They may also get a wrong idea about what boys or girls are able to do. Some doctors worry that children may use the same kind of thinking when they look for jobs in the future. If they do, they may miss something more important than just getting a chance to play with different toys. They may miss many, perhaps better, chances in life.\n（gender 性別）\n\n▶ 第 36 題　What idea does Jesse Cohen talk about in the reading?", "options": ["Not all kinds of toys are helpful for children’s learning.", "Parents should give their children the right toys for their age.", "Children should learn about their gender from playing with toys.", "We should not let gender decide which toys children can play with."], "answer": 3, "answerLabel": "D", "source": "112 會考｜閱讀測驗｜第 36 題", "explanation": "作者說孩子並非天生喜好不同玩具，只是模仿同性別的人；只玩某一類玩具會錯失很多機會，主張不該讓性別決定玩什麼。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 37, "question": "【閱讀測驗 第 36–38 題】\nJesse Cohen Says　Family 365　Jul. 2017\nWhich would you give a boy for his birthday, a toy truck or a doll? If you choose the truck, well, you’re not alone. Most people think that some toys are for boys and some are for girls. We might pick building toys for boys and kitchen toys for girls. But why do we do this? Are boys and girls really born with different interests in toys?\nNo, they are not. Children start to show different interests in toys at age three, but only because at this time, they begin to learn about gender and to follow what others of their gender do. If you give a girl kitchen toys, she will think they are girls’ toys because she sees other girls playing with them. But if you give a girl a toy car and show her a group of girls who are playing with cars, she’ll play with the toy car and think it is a girls’ toy. This “watch and follow” habit often becomes a rule for both boys and girls in choosing the “right” toys.\nHowever, this rule can be bad for children. Different toys teach children different things. Dolls help with their early language use, and building toys are good for learning math and science. By playing with different toys, children can find out what they are interested in or what they are good at. If they only play one kind of toy, they may lose this important chance. They may also get a wrong idea about what boys or girls are able to do. Some doctors worry that children may use the same kind of thinking when they look for jobs in the future. If they do, they may miss something more important than just getting a chance to play with different toys. They may miss many, perhaps better, chances in life.\n（gender 性別）\n\n▶ 第 37 題　In the third paragraph (段落), why does Jesse Cohen think “this rule can be bad for children”?", "options": ["Children may not want to share their toys with others.", "Children may have the wrong idea about following rules.", "Children may not be able to learn from playing with toys.", "Children may miss the chance to find out what they really like."], "answer": 3, "answerLabel": "D", "source": "112 會考｜閱讀測驗｜第 37 題", "explanation": "玩不同玩具能讓孩子發現自己的興趣和專長；只玩一種就可能失去這個重要的機會。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 38, "question": "【閱讀測驗 第 36–38 題】\nJesse Cohen Says　Family 365　Jul. 2017\nWhich would you give a boy for his birthday, a toy truck or a doll? If you choose the truck, well, you’re not alone. Most people think that some toys are for boys and some are for girls. We might pick building toys for boys and kitchen toys for girls. But why do we do this? Are boys and girls really born with different interests in toys?\nNo, they are not. Children start to show different interests in toys at age three, but only because at this time, they begin to learn about gender and to follow what others of their gender do. If you give a girl kitchen toys, she will think they are girls’ toys because she sees other girls playing with them. But if you give a girl a toy car and show her a group of girls who are playing with cars, she’ll play with the toy car and think it is a girls’ toy. This “watch and follow” habit often becomes a rule for both boys and girls in choosing the “right” toys.\nHowever, this rule can be bad for children. Different toys teach children different things. Dolls help with their early language use, and building toys are good for learning math and science. By playing with different toys, children can find out what they are interested in or what they are good at. If they only play one kind of toy, they may lose this important chance. They may also get a wrong idea about what boys or girls are able to do. Some doctors worry that children may use the same kind of thinking when they look for jobs in the future. If they do, they may miss something more important than just getting a chance to play with different toys. They may miss many, perhaps better, chances in life.\n（gender 性別）\n\n▶ 第 38 題　In the reading, after Jesse Cohen talks about an idea, he often gives an example to make it clear. Below are four of the sentences in the third paragraph. Which is used as an example?", "options": ["“However, this rule can be bad for children.”", "“Dolls help with their early language use, and building toys are good for learning math and science.”", "“Some doctors worry that children may use the same kind of thinking when they look for jobs in the future.”", "“If they do, they may miss something more important than just getting a chance to play with different toys.”"], "answer": 1, "answerLabel": "B", "source": "112 會考｜閱讀測驗｜第 38 題", "explanation": "前句說「不同玩具教孩子不同的東西」，接著用洋娃娃幫助語言、積木幫助數理來舉例說明。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 39, "question": "【閱讀測驗 第 39–41 題】\nMarie Colvin was a world-famous war reporter. She was born in New York, USA, in 1956 and died in Homs, Syria, in 2012.\nWhen she was a student at Yale University, Colvin decided that she wanted to be a reporter in the future. She joined the Sunday Times, a UK newspaper, in 1985 and soon became its Middle East reporter. Besides the Middle East, she also reported from other parts of the world: Chechnya, Kosovo and Sri Lanka, for example. When she was reporting on the war in Sri Lanka, she lost her left eye. But that never stopped her. She still went to dangerous places that few reporters wanted to visit and stayed when others left.\nColvin showed great empathy in her stories. For her, war reporting was not just some quick interviews and a few photos. She wrote about real people and their real lives. Her writing made you feel so strongly about these people’s stories, just like they were your own. She hoped that through her work the world would understand what really happened in war, and would take action to stop the fighting.\nOn February 22, 2012, the day after she gave her report on the war in Homs, Colvin was killed when the house she was staying in was attacked. She always knew what price a war reporter might have to pay. She already lost an eye before. This time, she gave her life to the work she could not give up — telling the true stories to the world.\n（war 戰爭）\n\n▶ 第 39 題　What is the reading mostly about?", "options": ["Marie Colvin’s war reports.", "Marie Colvin’s working life.", "Marie Colvin’s schooldays at Yale.", "Marie Colvin’s experiences in Homs."], "answer": 1, "answerLabel": "B", "source": "112 會考｜閱讀測驗｜第 39 題", "explanation": "文章從她決定當記者、進入報社、到各地採訪、受傷到殉職，介紹的是她的工作生涯。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 40, "question": "【閱讀測驗 第 39–41 題】\nMarie Colvin was a world-famous war reporter. She was born in New York, USA, in 1956 and died in Homs, Syria, in 2012.\nWhen she was a student at Yale University, Colvin decided that she wanted to be a reporter in the future. She joined the Sunday Times, a UK newspaper, in 1985 and soon became its Middle East reporter. Besides the Middle East, she also reported from other parts of the world: Chechnya, Kosovo and Sri Lanka, for example. When she was reporting on the war in Sri Lanka, she lost her left eye. But that never stopped her. She still went to dangerous places that few reporters wanted to visit and stayed when others left.\nColvin showed great empathy in her stories. For her, war reporting was not just some quick interviews and a few photos. She wrote about real people and their real lives. Her writing made you feel so strongly about these people’s stories, just like they were your own. She hoped that through her work the world would understand what really happened in war, and would take action to stop the fighting.\nOn February 22, 2012, the day after she gave her report on the war in Homs, Colvin was killed when the house she was staying in was attacked. She always knew what price a war reporter might have to pay. She already lost an eye before. This time, she gave her life to the work she ": ["The chance to study at Yale made her leave her job in the Middle East.", "The experience in Sri Lanka did not change her way of reporting news.", "She was killed in Homs when she was interviewing soldiers there for her report.", "She was not sure what to do in the future until she worked for the Sunday Times."], "answer": 1, "answerLabel": "B", "source": "112 會考｜閱讀測驗｜第 41 題", "explanation": "在斯里蘭卡失去左眼 never stopped her，她仍然去危險的地方採訪。她在耶魯時就決定當記者；遇難時是住處遭到攻擊。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 42, "question": "【克漏字 第 42–43 題】\nNiceReads\nSpeaking American is a great book!\nLucia Leisure ★★★★★\nI just love Josh Katz’s new book! It’s about __42__ in different parts of the US. The information in the book was collected from the quiz that Katz built on the website in 2013. The quiz asked what words people use for something, and their answers showed interesting facts. For example, there are different names for sports shoes. In most parts of the US, people say “tennis shoes.” In the northeast of the country, people wear “sneakers.” In some towns, “tennis shoes” and “sneakers” become “gym shoes.”\nThe use of words tells us where people are from, like Katz’s book says. But in my experience, it also shows __43__. My family has lived in New York since my grandparents. It’s not surprising that I say “sneakers.” But my grandfather says “plimsolls,” and my daughter says “kicks” or “vans.” Maybe Katz can study this difference for his next book.\n（website 網站）\n\n▶ 第 42 題　請選出 __42__ 的最佳答案", "options": ["what things are called", "how sports are played", "why different languages are spoken", "what words are often spelled differently"], "answer": 0, "answerLabel": "A", "source": "112 會考｜克漏字｜第 42 題", "explanation": "書中調查人們用什麼字稱呼某樣東西（如運動鞋的不同說法），主題是「東西被怎麼稱呼」。", "explanationSource": "own", "section": "克漏字"}, {"id": 43, "question": "【克漏字 第 42–43 題】\nNiceReads\nSpeaking American is a great book!\nLucia Leisure ★★★★★\nI just love Josh Katz’s new book! It’s about __42__ i
