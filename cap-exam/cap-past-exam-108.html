<script>window.QUIZ_CONFIG={"title": "108 年國中會考英語｜單題＋閱讀測驗＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. The mother duck is ______ the baby ducks across the street.", "options": ["carrying", "leading", "pushing", "watching"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 1 題", "explanation": "圖中母鴨走在前面，小鴨跟著過馬路，是在「帶領」：leading。", "explanationSource": "own", "section": "單題", "image": "assets/cap108-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　Ms. Liu usually gives us a lot of homework, ______ she didn’t give us any today.", "options": ["but", "if", "or", "so"], "answer": 0, "answerLabel": "A", "source": "108 會考｜單題｜第 2 題", "explanation": "老師通常出很多功課，「但」今天沒出，語意轉折用 but。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Playing games on the cellphone ______ popular with high school students.", "options": ["is", "are", "being", "to be"], "answer": 0, "answerLabel": "A", "source": "108 會考｜單題｜第 3 題", "explanation": "動名詞片語 Playing games... 當主詞視為單數，用 is。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　There ______ more than twenty clubs in our school. Which one would you like to join?", "options": ["has", "have", "is", "are"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 4 題", "explanation": "表示「某地有…」用 There is/are；more than twenty clubs 是複數，用 are。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　Diane had a bad cold last week. She is still too ______ to go mountain climbing with you.", "options": ["busy", "short", "weak", "young"], "answer": 2, "answerLabel": "C", "source": "108 會考｜單題｜第 5 題", "explanation": "上週重感冒，現在身體還太「虛弱」不能去爬山：too weak to...", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　The book under Mary’s desk is ______, but I don’t know why it is there.", "options": ["us", "me", "my", "mine"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 6 題", "explanation": "空格要代替 Mary’s book，用所有格代名詞 mine（我的書）。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　Last night a garbage truck hit a tree and turned over. Now the street is ______ with lots of garbage.", "options": ["dark", "dirty", "heavy", "poor"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 7 題", "explanation": "垃圾車翻覆、滿街垃圾，街道很「髒」：dirty with garbage。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　It almost killed Kevin to take care of his baby sister for one afternoon. He wondered how his mom could do ______ every day.", "options": ["her", "it", "one", "them"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 8 題", "explanation": "it 指前面整件事「照顧妹妹」；他不懂媽媽怎麼能每天做這件事。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Joyce tells her brother everything. She never ______ anything from him.", "options": ["covers", "believes", "hides", "takes"], "answer": 2, "answerLabel": "C", "source": "108 會考｜單題｜第 9 題", "explanation": "什麼都跟哥哥說，表示從不「隱瞞」任何事：hide sth. from sb.", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Ben always uses his birthday as a(n) ______ to ask Dad to buy him something expensive.", "options": ["action", "excuse", "prize", "rule"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 10 題", "explanation": "拿生日當作「藉口」要爸爸買貴的東西：excuse。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　______ that last piece of pie? If not, can I have it? I didn’t eat much this morning.", "options": ["Had you eaten", "Were you eating", "Do you eat", "Are you going to eat"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 11 題", "explanation": "問對方「是否打算吃」最後一塊派，如果不吃我可以吃嗎？表示未來打算：Are you going to eat...?", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Everyone in the class enjoys playing chess ______ Bill; he thinks the game is boring.", "options": ["except", "for", "like", "of"], "answer": 0, "answerLabel": "A", "source": "108 會考｜單題｜第 12 題", "explanation": "全班都喜歡下棋，「除了」Bill，他覺得很無聊：except。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　In my school days, I ______ to English radio programs every day. That was how I learned English at that time.", "options": ["listen", "have listened", "used to listen", "was listening"], "answer": 2, "answerLabel": "C", "source": "108 會考｜單題｜第 13 題", "explanation": "In my school days 是過去的習慣，用 used to listen（過去常常聽）。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　Tom’s voice ______ when he talks about his neighbors. He speaks faster, his face becomes redder and you can almost see fire in his eyes.", "options": ["appears", "drops", "grows", "rises"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 14 題", "explanation": "講到鄰居就說話變快、臉變紅，表示生氣，聲音「提高」：rises。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　______ other waiters in the restaurant have worked here longer than Clark; only Lois and Lana started working here before him.", "options": ["All", "Most", "Some", "Few"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 15 題", "explanation": "只有兩個人比 Clark 早來，所以「很少」其他服務生比他資深：Few。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "【閱讀測驗 第 16–17 題】\nMaking goulash\nwe don’t talk much,\nDaddy and me.\n\n“The talking’s in the making, son,”\nhe smiles.\nI see what he means.\n\nIt’s in the knife\nmeeting the beef,\nin the dancing of potatoes\nas they turn in the water,\nin the singing\nof boiling soup in the pot.\n\nThere are enough words\nin the way\nDaddy teaches me his famous dish\nand the way he hugs me\nwhen we finish.\n\nMaking goulash\nwe don’t talk much,\nDaddy and me,\nbut everything is said.\n(Ideas from Candace Pearson’s poem)\n（poem 詩）\n\n▶ 第 16 題　What are “Daddy and me” doing in the poem?", "options": ["Eating.", "Singing.", "Dancing.", "Cooking."], "answer": 3, "answerLabel": "D", "source": "108 會考｜閱讀測驗｜第 16 題", "explanation": "詩中提到刀切牛肉、馬鈴薯在水裡翻滾、鍋裡湯在沸騰，還有爸爸教他做拿手菜，可知兩人在「做菜」。（dancing、singing 是比喻，不是真的跳舞唱歌）", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 17, "question": "【閱讀測驗 第 16–17 題】\nMaking goulash\nwe don’t talk much,\nDaddy and me.\n\n“The talking’s in the making, son,”\nhe smiles.\nI see what he means.\n\nIt’s in the knife\nmeeting the beef,\nin the dancing of potatoes\nas they turn in the water,\nin the singing\nof boiling soup in the pot.\n\nThere are enough words\nin the way\nDaddy teaches me his famous dish\nand the way he hugs me\nwhen we finish.\n\nMaking goulash\nwe don’t talk much,\nDaddy and me,\nbut everything is said.\n(Ideas from Candace Pearson’s poem)\n（poem 詩）\n\n▶ 第 17 題　What can we most likely know about the speaker?", "options": ["He seldom understands his father.", "He enjoys his time with his father.", "He often makes goulash for his father.", "He wants to be as famous as his father."], "answer": 1, "answerLabel": "B", "source": "108 會考｜閱讀測驗｜第 17 題", "explanation": "兩人雖然話不多，但「一切都說了」，做完菜爸爸還會抱他，可見他很享受和爸爸相處的時光。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 18, "question": "【閱讀測驗 第 18–19 題】\nCity Sight Bus　www.citysightbus.org\n（見下方圖：Line A 點線 ……▶，Line B 虛線 – – –▶）\n\nOPENING HOURS\n• High Season (April to September): 9:00 – 18:00 every day\n• Low Season (October to March): 9:00 – 17:00 every day\nTICKET PRICES\n• Line A: $20 each person\n• Line B: $18 each person\nTHINGS YOU SHOULD KNOW\n• Buses for both lines leave every hour from Central Station.\n• Line A takes one hour; Line B takes 50 minutes.\n• If you are taking your pet with you, please buy a seat for it at half price.\n• Save 10% if you buy tickets on the Internet.\n• Save 10% if you buy tickets for both lines.\n• Go to www.citysightbus.org for more information.\n\n▶ 第 18 題　Which is true about City Sight Bus tickets?", "options": ["It costs less to buy tickets on the Internet.", "People must pay the full ticket price for a pet.", "Tickets are more expensive in the high season.", "People save 10% if they buy two tickets for the same line."], "answer": 0, "answerLabel": "A", "source": "108 會考｜閱讀測驗｜第 18 題", "explanation": "網路購票可省 10%，所以比較便宜。寵物是半價；票價不分淡旺季；買「兩條路線」的票才省 10%，不是同一路線兩張。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap108-g18.png?v=20261120-7"}, {"id": 19, "question": "【閱讀測驗 第 18–19 題】\nCity Sight Bus　www.citysightbus.org\n（見下方圖：Line A 點線 ……▶，Line B 虛線 – – –▶）\n\nOPENING HOURS\n• High Season (April to September): 9:00 – 18:00 every day\n• Low Season (October to March): 9:00 – 17:00 every day\nTICKET PRICES\n• Line A: $20 each person\n• Line B: $18 each person\nTHINGS YOU SHOULD KNOW\n• Buses for both lines leave every hour from Central Station.\n• Line A takes one hour; Line B takes 50 minutes.\n• If you are taking your pet with you, please buy a seat for it at half price.\n• Save 10% if you buy tickets on the Internet.\n• Save 10% if you buy tickets for both lines.\n• Go to www.citysightbus.org for more information.\n\n▶ 第 19 題　Which is true about the bus lines?", "options": ["Line B takes more time.", "Both lines cross Farmers’ Bridge.", "Both lines leave from Central Station.", "There are more gardens to see on Line A."], "answer": 2, "answerLabel": "C", "source": "108 會考｜閱讀測驗｜第 19 題", "explanation": "Buses for both lines leave every hour from Central Station。Line A 一小時、Line B 50 分鐘；只有 Line B 經過 Farmers’ Bridge；兩線各經過一個花園。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap108-g18.png?v=20261120-7"}, {"id": 20, "question": "【閱讀測驗 第 20–22 題】\nSarah: You’re VERY popular today. I’ve had seventeen calls asking for you.\nMike: Finally! After all these years of kicking and running, I’ve got my own fans! So what did they want? My photos? Do I need to sign my name? Are they starting a fan club for me?\nSarah: Well, let me ask you this: What day was yesterday?\nMike: Friday… Why?\nSarah: Did you forget something?\nMike: Did I forget… OH, NO! I didn’t pick up my soccer team’s sport shirts from the shop! And we’re having this big game tomorrow!\nSarah: Yeah. And from what I’ve heard, it’s your team’s most important game this season.\nMike: OK. I have to go fix this now.\nSarah: Too late. They’ve tried. It’s not open on the weekend. And if you want to know, they are Johnny, Ricky, Archie, Freddie…\nMike: I know, I know, everyone on my team. Oh, I’m a dead man now.\nSarah: Yeah, that was what they said on the phone, seventeen times.\n\n▶ 第 20 題　Why were there seventeen calls asking for Mike?", "options": ["His team was angry at him.", "He is a popular soccer player.", "He did not show up for the game on Friday.", "His name did not appear on the list of players."], "answer": 0, "answerLabel": "A", "source": "108 會考｜閱讀測驗｜第 20 題", "explanation": "Mike 忘了去店裡拿全隊的球衣，打電話來的都是隊友，還說「你死定了」，可見隊友很生氣。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 21, "question": "【閱讀測驗 第 20–22 題】\nSarah: You’re VERY popular today. I’ve had seventeen calls asking for you.\nMike: Finally! After all these years of kicking and running, I’ve got my own fans! So what did they want? My photos? Do I need to sign my name? Are they starting a fan club for me?\nSarah: Well, let me ask you this: What day was yesterday?\nMike: Friday… Why?\nSarah: Did you forget something?\nMike: Did I forget… OH, NO! I didn’t pick up my soccer team’s sport shirts from the shop! And we’re having this big game tomorrow!\nSarah: Yeah. And from what I’ve heard, it’s your team’s most important game this season.\nMike: OK. I have to go fix this now.\nSarah: Too late. They’ve tried. It’s not open on the weekend. And if you want to know, they are Johnny, Ricky, Archie, Freddie…\nMike: I know, I know, everyone on my team. Oh, I’m a dead man now.\nSarah: Yeah, that was what they said on the phone, seventeen times.\n\n▶ 第 21 題　What does It mean in the dialogue?", "options": ["The shop.", "The fan club.", "The soccer game.", "The soccer season."], "answer": 0, "answerLabel": "A", "source": "108 會考｜閱讀測驗｜第 21 題", "explanation": "It’s not open on the weekend.：週末「沒開」的是拿球衣的那家店。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 22, "question": "【閱讀測驗 第 20–22 題】\nSarah: You’re VERY popular today. I’ve had seventeen calls asking for you.\nMike: Finally! After all these years of kicking and running, I’ve got my own fans! So what did they want? My photos? Do I need to sign my name? Are they starting a fan club for me?\nSarah: Well, let me ask you this: What day was yesterday?\nMike: Friday… Why?\nSarah: Did you forget something?\nMike: Did I forget… OH, NO! I didn’t pick up my soccer team’s sport shirts from the shop! And we’re having this big game tomorrow!\nSarah: Yeah. And from what I’ve heard, it’s your team’s most important game this season.\nMike: OK. I have to go fix this now.\nSarah: Too late. They’ve tried. It’s not open on the weekend. And if you want to know, they are Johnny, Ricky, Archie, Freddie…\nMike: I know, I know, everyone on my team. Oh, I’m a dead man now.\nSarah: Yeah, that was what they said on the phone, seventeen times.\n\n▶ 第 22 題　What can we learn about Mike?", "options": ["He is nice to people from his fan club.", "He plays soccer with Johnny and Ricky.", "He found a way to fix the trouble he made.", "He decided not to go to the game on Sunday."], "answer": 1, "answerLabel": "B", "source": "108 會考｜閱讀測驗｜第 22 題", "explanation": "打電話的 Johnny、Ricky 等人是 everyone on my team，所以他和他們同隊踢球。他並沒有粉絲俱樂部，問題也來不及解決。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 23, "question": "【閱讀測驗 第 23–25 題】\nAnimals have their special ways to deal with hard times in nature. The superb fairy-wren, one kind of bright-blue bird in Australia, is one example. This year, a ten-year study showed that this small bird has eggs of different sizes in different kinds of weather. When the weather is hot and dry, there is less food for young superb fairy-wrens, and they die easily. So the mother bird will make larger eggs to help her babies grow stronger inside before they break out of the eggs into the “hungry” world.\nHowever, not all mother birds are able to do this trick. Only those with at least one male child can. When the weather is “good,” the mother will make smaller eggs, and her sons will bring food back for their baby brothers and sisters from the eggs. With her sons’ help, the mother can save more energy to make larger eggs when the weather is bad. Isn’t this amazing?\n（male 雄性　energy 能量）\n\n▶ 第 23 題　Which is the best title for this reading?", "options": ["Australia: The Best Place for Birds.", "Mother Bird Fights Weather Changes.", "Larger Mother Birds Have Larger Eggs.", "Family Love: Brothers & Sisters Work Together."], "answer": 1, "answerLabel": "B", "source": "108 會考｜閱讀測驗｜第 23 題", "explanation": "全文說明鳥媽媽會依天氣好壞生下大小不同的蛋，來面對惡劣天氣，B 最能涵蓋主旨。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 24, "question": "【閱讀測驗 第 23–25 題】\nAnimals have their special ways to deal with hard times in nature. The superb fairy-wren, one kind of bright-blue bird in Australia, is one example. This year, a ten-year study showed that this small bird has eggs of different sizes in different kinds of weather. When the weather is hot and dry, there is less food for young superb fairy-wrens, and they die easily. So the mother bird will make larger eggs to help her babies grow stronger inside before they break out of the eggs into the “hungry” world.\nHowever, not all mother birds are able to do this trick. Only those with at least one male child can. When the weather is “good,” the mother will make smaller eggs, and her sons will bring food back for their baby brothers and sisters from the eggs. With her sons’ help, the mother can save more energy to make larger eggs when the weather is bad. Isn’t this amazing?\n（male 雄性　energy 能量）\n\n▶ 第 24 題　What does this trick mean in the reading?", "options": ["Having eggs of different sizes.", "Growing stronger inside the egg.", "Saving food for weaker baby birds.", "Helping baby birds break out of the eggs."], "answer": 0, "answerLabel": "A", "source": "108 會考｜閱讀測驗｜第 24 題", "explanation": "this trick 指前一段鳥媽媽「依天氣生下不同大小的蛋」這件事。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 25, "question": "【閱讀測驗 第 23–25 題】\nAnimals have their special ways to deal with hard times in nature. The superb fairy-wren, one kind of bright-blue bird in Australia, is one example. This year, a ten-year study showed that this small bird has eggs of different sizes in different kinds of weather. When the weather is hot and dry, there is less food for young superb fairy-wrens, and they die easily. So the mother bird will make larger eggs to help her babies grow stronger inside before they break out of the eggs into the “hungry” world.\nHowever, not all mother birds are able to do this trick. Only those with at least one male child can. When the weather is “good,” the mother will make smaller eggs, and her sons will bring food back for their baby brothers and sisters from the eggs. With her sons’ help, the mother can save more energy to make larger eggs when the weather is bad. Isn’t this amazing?\n（male 雄性　energy 能量）\n\n▶ 第 25 題　What can we learn about superb fairy-wrens from the reading?", "options": ["Male birds can usually live for ten years.", "Baby birds grow well in hot, dry weather.", "Young male birds share the job of feeding the baby birds.", "Mother birds make smaller eggs when there is less food outside."], "answer": 2, "answerLabel": "C", "source": "108 會考｜閱讀測驗｜第 25 題", "explanation": "天氣好時，鳥媽媽的兒子會帶食物回來餵弟弟妹妹，所以年輕雄鳥會分擔餵食工作。十年是研究時間；乾熱時食物少、雛鳥易死；食物少時蛋反而較大。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 26, "question": "【閱讀測驗 第 26–28 題】\nHere are two pieces of news that Annie collected for her report.\n\nPapier-mâché is works of art that are made of paper. In Taiwan, it is known as zhizha and is usually burned as a gift for dead people. Taiwan’s papier-mâché is dying because it is not much needed now. However, this dying art won a Frenchman’s heart when he visited the island. He then invited one of ost famous works is That Evening, We Performed Crosstalk (1985). It was such a smash hit that people became interested again in xiangsheng, a show of funny talk between two actors. This art used to be a hobby that only a few people shared, but Lai has opened a bigger market for it. Now it has fans across all ages.\n（work 作品）\n\n▶ 第 27 題　What does it mean when something is a smash hit?", "options": ["It is old.", "It is successful.", "It is foreign.", "It is useful."], "answer": 1, "answerLabel": "B", "source": "108 會考｜閱讀測驗｜第 27 題", "explanation": "作品紅到讓大家重新對相聲感興趣，smash hit 指「大受歡迎、非常成功」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 28, "question": "【閱讀測驗 第 26–28 題】\nHere are two pieces of news that Annie collected for her report.\n\nPapier-mâché is works of art that are made of paper. In Taiwan, it is known as zhizha and is usually burned as a gift for dead people. Taiwan’s papier-mâché is dying because it is not much needed now. However, this dying art won a Frenchman’s heart when he visited the island. He then invited one of the papier-mâché shops, Hsin Hsin Paper Offering Store, to show their beautiful works in France. The shop owner’s son also used papier-mâché in a way that no one ever thought of—making a movie with it.\n\nStan Lai is very important in Taiwan’s theater. He brought changes to Chinese theater art of the old days to make it closer to our life experiences and easier to understand. One of his most famous works is That Evening, We Performed Crosstalk (1985). It was such a smash hit that people became interested again in xiangsheng, a show of funny talk between two actors. This art used to be a hobby that only a few people shared, but Lai has opened a bigger market for it. Now it has fans across all ages.\n（work 作品）\n\n▶ 第 28 題　What do we know from the news?", "options": ["Lai has taught xiangsheng in many schools.", "Lai often puts his own life stories into his art works.", "The owner of Hsin Hsin Paper Offering Store is a Frenchman.", "People do not burn papier-mâché for dead people as often as before."], "answer": 3, "answerLabel": "D", "source": "108 會考｜閱讀測驗｜第 28 題", "explanation": "紙紮 is dying because it is not much needed now，表示現在燒紙紮的人比以前少。邀請展出的才是法國人，店主不是。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 29, "question": "【閱讀測驗 第 29–32 題】\nVOF News　16/01/2015\nFor many people, having a cup of coffee right out of bed is the best way to start a day. But a report from Asap Science says otherwise. It says the worst time for coffee is soon after we get up. When we wake up, our bodies start to make cortisol. Cortisol helps us to think clearly and be quick to understand and act. The cortisol levels rise after we wake up and climb to the highest in about an hour. So there are two problems when we drink coffee during this time: (1) our bodies will make less cortisol, and (2) the cortisol will make coffee less useful. And that’s why some of us drink more and more coffee.\nThen, when’s the best time to have coffee? When the cortisol levels are going down, the report says. Cortisol levels are usually highest between 8 a.m. and 9 a.m., between noon and 1 p.m., and between 5:30 p.m. and 6:30 p.m. So if you want to have coffee, enjoy it after these times, and this popular drink will help you the most.\n（cortisol 皮質醇　level 數值；濃度）\n\n▶ 第 29 題　Which idea is talked about in the news?", "options": ["How often we should drink coffee.", "What happens when we have too much coffee.", "How to help the body make the cortisol we need.", "What happens when we have coffee at the wrong time."], "answer": 3, "answerLabel": "D", "source": "108 會考｜閱讀測驗｜第 29 題", "explanation": "新聞說起床後馬上喝咖啡是最糟的時間，會造成兩個問題，談的是「在錯誤時間喝咖啡會怎樣」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 30, "question": "【閱讀測驗 第 29–32 題】\nVOF News　16/01/2015\nFor many people, having a cup of coffee right out of bed is the best way to start a day. But a report from Asap Science says otherwise. It says the worst time for coffee is soon after we get up. When we wake up, our bodies start to make cortisol. Cortisol helps us to think clearly and be quick to understand and act. The cortisol levels rise after we wake up and climb to the highest in about an hour. So there are two problems when we drink coffee during this time: (1) our bodies will make less cortisol, and (2) the cortisol will make coffee less useful. And that’s why some of us drink more and more coffee.\nThen, when’s the best time to have coffee? When the cortisol levels are going down, the report says. Cortisol levels are usually highest between 8 a.m. and 9 a.m., between noon and 1 p.m., and between 5:30 p.m. and 6:30 p.m. So if you want to have coffee, enjoy it after these times, and this popular drink will help you the most.\n（cortisol 皮質醇　level 數值；濃度）\n\n▶ 第 30 題　What does it mean when someone thinks otherwise about something?", "options": ["They are serious about it.", "They have no idea about it.", "They think differently about it.", "They do not think it is a problem."], "answer": 2, "answerLabel": "C", "source": "108 會考｜閱讀測驗｜第 30 題", "explanation": "很多人認為起床喝咖啡最好，But 報告 says otherwise，認為那是最糟的時間，otherwise＝持不同看法。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 31, "question": "【閱讀測驗 第 29–32 題】\nVOF News　16/01/2015\nFor many people, having a cup of coffee right out of bed is the best way to start a day. But a report from Asap Science says otherwise. It says the worst time for coffee is soon after we get up. When we wake up, our bodies start to make cortisol. Cortisol helps us to think clearly and be quick to understand and act. The cortisol levels rise after we wake up and climb to the highest in about an hour. So there are two problems when we drink coffee during this time: (1) our bodies will make less cortisol, and (2) the cortisol will make coffee less useful. And that’s why some of us drink more and more coffee.\nThen, when’s the best time to have coffee? When the cortisol levels are going down, the report says. Cortisol levels are usually highest between 8 a.m. and 9 a.m., between noon and 1 p.m., and between 5:30 p.m. and 6:30 p.m. So if you want to have coffee, enjoy it after these times, and this popular drink will help you the most.\n（cortisol 皮質醇　level 數值；濃度）\n\n▶ 第 31 題　The picture shows how the cortisol levels rise and fall during the day. From the news, which is a good time for coffee?", "options": ["A.", "B.", "C.", "D."], "answer": 3, "answerLabel": "D", "source": "108 會考｜閱讀測驗｜第 31 題", "explanation": "最佳時機是皮質醇「下降」的時候。圖中 A、B 在上升、C 在最高點，只有 D（中午高峰過後）正在下降。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap108-q31.png?v=20261120-7"}, {"id": 32, "question": "【閱讀測驗 第 29–32 題】\nVOF News　16/01/2015\nFor many people, having a cup of coffee right out of bed is the best way to start a day. But a report from Asap Science says otherwise. It says the worst time for coffee is soon after we get up. When we wake up, our bodies start to make cortisol. Cortisol helps us to think clearly and be quick to understand and act. The cortisol levels rise after we wake up and climb to the highest in about an hour. So there are two problems when we drink coffee during this time: (1) our bodies will make less cortisol, and (2) the cortisol will make coffee less useful. And that’s why some of us drink more and more coffee.\nThen, when’s the best time to have coffee? When the cortisol levels are going down, the report says. Cortisol levels are usually highest between 8 a.m. and 9 a.m., between noon and 1 p.m., and between 5:30 p.m. and 6:30 p.m. So if you want to have coffee, enjoy it after these times, and this popular drink will help you the most.\n（cortisol 皮質醇　level 數值；濃度）\n\n▶ 第 32 題　Four people read the news and wrote what they thought about it.\nMike: The best time to drink coffee is when you want to drink coffee.\nSarah: I usually wake up AFTER I drink coffee!\nCharlie: The worst time to drink coffee is when you're DEAD.\nLisa: If you need someone to tell you when to drink coffee, well, that’s just sad.\nWhat did they think about the news?", "options": ["They wanted to try what it said.", "They were sad about what it said.", "They did not agree with what it said.", "They were not surprised at what it said."], "answer": 2, "answerLabel": "C", "source": "108 會考｜閱讀測驗｜第 32 題", "explanation": "四人的留言都在開玩笑或反駁：想喝就喝、喝了才醒、需要別人告訴你何時喝很可悲，都表示不認同新聞的說法。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 33, "question": "【閱讀測驗 第 33–35 題】\nBelow is part of a new shopping center’s market report.\nOur busiest time is weekend afternoons, between 1:30 p.m. and 3:30 p.m. About half the business of the week is done then. So it would be better if we move Weekend’s Best Buy from Saturday evening to Saturday afternoon when there may be more shoppers during the sale. We should also think about having more free buses during the weekend, as 75% of the shoppers who were interviewed said two buses an hour are just not enough.\nWeekend evenings are second busiest, though it is not as good as last season. An interesting fact is that business is better on weekday evenings, usually one hour before closing, than on weekend mornings. Most of the shoppers then are people who live near or working parents who do their last-minute shopping. They together make up almost 60% of the business on weekday evenings. It might bring in more business if we open half an hour longer during weekdays, until 10:30 p.m.\n（as 由於　make up 構成；組成）\n\n▶ 第 33 題　What does the report NOT suggest?", "options": ["Having more free buses for shoppers.", "Changing the opening hours on weekdays.", "Making plans to help weekday morning business.", "Changing the time of the special sale on weekends."], "answer": 2, "answerLabel": "C", "source": "108 會考｜閱讀測驗｜第 33 題", "explanation": "報告建議增加免費公車、平日延長營業半小時、把週末特賣移到週六下午；沒有提到平日早上的生意。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 34, "question": "【閱讀測驗 第 33–35 題】\nBelow is part of a new shopping center’s market report.\nOur busiest time is weekend afternoons, between 1:30 p.m. and 3:30 p.m. About half the business of the week is done then. So it would be better if we move Weekend’s Best Buy from Saturday evening to Saturday afternoon when there may be more shoppers during the sale. We should also think about having more free buses during the weekend, as 75% of the shoppers who were interviewed said two buses an hour are just not enough.\nWeekend evenings are second busiest, though it is not as good as last season. An interesting fact is that business is better on weekday evenings, usually one hour before closing, than on weekend mornings. Most of the shoppers then are people who live near or working parents who do their last-minute shopping. They together make up almost 60% of the business on weekday evenings. It might bring in more business if we open half an hour longer during weekdays, until 10:30 p.m.\n（as 由於　make up 構成；組成）\n\n▶ 第 34 題　What does the report say about the shopping center?", "options": ["Its business on weekdays is not as good as last season.", "It has a special sale one hour before closing every day.", "Most of the shoppers take the free buses to the shopping center.", "A large part of its shoppers on weekday evenings are working parents."], "answer": 3, "answerLabel": "D", "source": "108 會考｜閱讀測驗｜第 34 題", "explanation": "平日晚上的顧客大多是附近居民和下班後採買的上班族父母。不如上一季的是「週末晚上」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 35, "question": "【閱讀測驗 第 33–35 題】\nBelow is part of a new shopping center’s market report.\nOur busiest time is weekend afternoons, between 1:30 p.m. and 3:30 p.m. About half the business of the week is done then. So it would be better if we move Weekend’s Best Buy from Saturday evening to Saturday afternoon when there may be more shoppers during the sale. We should also think about having more free buses during the weekend, as 75% of the shoppers who were interviewed said two buses an hour are just not enough.\nWeekend evenings are second busiest, though it is not as good as last season. An i
