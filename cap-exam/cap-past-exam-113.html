<script>window.QUIZ_CONFIG={"title": "113 年國中會考英語｜單題＋閱讀測驗＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. There is ______ under the door.", "options": ["an envelope", "a plant", "a sign", "an umbrella"], "answer": 0, "answerLabel": "A", "source": "113 會考｜單題｜第 1 題", "explanation": "圖中門下放著一個「信封」：an envelope。", "explanationSource": "own", "section": "單題", "image": "assets/cap113-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　My ______ hurts so much that I cannot even turn my head.", "options": ["arm", "knee", "neck", "stomach"], "answer": 2, "answerLabel": "C", "source": "113 會考｜單題｜第 2 題", "explanation": "痛到連頭都轉不了，是「脖子」痛：neck。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Our school basketball team won the national game last night. We are so ______ them.", "options": ["popular with", "proud of", "sorry for", "worried about"], "answer": 1, "answerLabel": "B", "source": "113 會考｜單題｜第 3 題", "explanation": "球隊得到全國冠軍，我們以他們為「榮」：be proud of。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　Tomorrow is Sam’s last day in the office. Nobody knows why he decided to ______.", "options": ["hide", "leave", "pack", "walk"], "answer": 1, "answerLabel": "B", "source": "113 會考｜單題｜第 4 題", "explanation": "明天是最後一天上班，沒人知道他為什麼決定「離職」：leave。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　It’s not a good idea to go mountain climbing in this bad ______. We should wait until the typhoon goes away.", "options": ["chance", "dream", "habit", "weather"], "answer": 3, "answerLabel": "D", "source": "113 會考｜單題｜第 5 題", "explanation": "等颱風走了再去，表示現在「天氣」不好：bad weather。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Chris loves walking with Anna on snowy days, but Anna hates ______ very much.", "options": ["them", "so", "one", "it"], "answer": 3, "answerLabel": "D", "source": "113 會考｜單題｜第 6 題", "explanation": "it 代替前面提到的「在雪天散步」這件事。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　Lora likes to eat bananas that are already a little brown on the outside, and so ______ I.", "options": ["am", "do", "have", "will"], "answer": 1, "answerLabel": "B", "source": "113 會考｜單題｜第 7 題", "explanation": "附和句：前句 likes 是現在式一般動詞，so do I（我也是）。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Your refrigerator shouldn’t be making loud noises now, but if it ______ does, just give me a call and I’ll come check it again.", "options": ["already", "even", "finally", "still"], "answer": 3, "answerLabel": "D", "source": "113 會考｜單題｜第 8 題", "explanation": "冰箱現在不該有噪音，但如果「仍然」有，就打給我：still。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　After winning money in the card game, Jay decided to try again. He felt that he might also be ______ a second time.", "options": ["famous", "interested", "lucky", "ready"], "answer": 2, "answerLabel": "C", "source": "113 會考｜單題｜第 9 題", "explanation": "剛贏了錢，覺得第二次也可能「好運」：lucky。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　The knife doesn’t cut very well. It’s not as ______ as before.", "options": ["bright", "heavy", "quick", "sharp"], "answer": 3, "answerLabel": "D", "source": "113 會考｜單題｜第 10 題", "explanation": "刀子切不好，表示不像以前那麼「鋒利」：sharp。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　John will stay with his sister until he ______ an apartment.", "options": ["will find", "would find", "finds", "found"], "answer": 2, "answerLabel": "C", "source": "113 會考｜單題｜第 11 題", "explanation": "until 引導時間副詞子句，用現在式代替未來式：until he finds。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Students ______ to go on the school trip should ask their parents first.", "options": ["who want", "want", "who they want", "what they want"], "answer": 0, "answerLabel": "A", "source": "113 會考｜單題｜第 12 題", "explanation": "Students who want to go...：who 引導形容詞子句修飾 Students。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　The temple sits alone in the mountains at a height of 3,000m ______ sea level.", "options": ["above", "at", "below", "in"], "answer": 0, "answerLabel": "A", "source": "113 會考｜單題｜第 13 題", "explanation": "海拔三千公尺：3,000m above sea level（海平面以上）。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　Patty spent several days planning to invite Charlie to dinner, ______ she couldn’t say a word when they met.", "options": ["but", "if", "or", "so"], "answer": 0, "answerLabel": "A", "source": "113 會考｜單題｜第 14 題", "explanation": "計劃了好幾天，見面時「卻」說不出話：but。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　I can’t tell you what I think of the movie because I ______ it. I’ll probably watch it this Saturday.", "options": ["am not seeing", "don’t see", "haven’t seen", "won’t see"], "answer": 2, "answerLabel": "C", "source": "113 會考｜單題｜第 15 題", "explanation": "這週六才要看，所以現在「還沒看過」：haven’t seen。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "第 16 題　The new guy at the help desk answers calls like a ______. There are no ups and downs in his voice and you can’t tell if he is happy or sad.", "options": ["father", "foreigner", "radio", "robot"], "answer": 3, "answerLabel": "D", "source": "113 會考｜單題｜第 16 題", "explanation": "聲音沒有起伏、聽不出開心或難過，像「機器人」：robot。", "explanationSource": "own", "section": "單題"}, {"id": 17, "question": "第 17 題　Jasmine planned to spend her summer in the country, but right after she got there, she started to ______ the noise in the city.", "options": ["enjoy", "mind", "miss", "notice"], "answer": 2, "answerLabel": "C", "source": "113 會考｜單題｜第 17 題", "explanation": "剛到鄉下就開始「想念」城市的噪音：miss。", "explanationSource": "own", "section": "單題"}, {"id": 18, "question": "第 18 題　“Bad traffic” is perhaps the ______ excuse for being late when your boss knows it only takes you five minutes to walk to work.", "options": ["easiest", "oldest", "smartest", "worst"], "answer": 3, "answerLabel": "D", "source": "113 會考｜單題｜第 18 題", "explanation": "走路上班只要五分鐘還說塞車，是「最爛」的藉口：the worst excuse。", "explanationSource": "own", "section": "單題"}, {"id": 19, "question": "第 19 題　The housework in Mr. and Mrs. Wang’s family ______ between them and their kids. Everyone’s got their own job to do.", "options": ["is shared", "are shared", "shares", "share"], "answer": 0, "answerLabel": "A", "source": "113 會考｜單題｜第 19 題", "explanation": "家事是「被分擔」的：The housework 為不可數，用 is shared。", "explanationSource": "own", "section": "單題"}, {"id": 20, "question": "第 20 題　I want to find another dentist because ______ pulled out a good tooth last time I went to him.", "options": ["I", "me", "mine", "myself"], "answer": 2, "answerLabel": "C", "source": "113 會考｜單題｜第 20 題", "explanation": "空格指「我的牙醫」，用所有格代名詞 mine（= my dentist）。", "explanationSource": "own", "section": "單題"}, {"id": 21, "question": "第 21 題　Mom: Linda, you’ve been playing computer games all evening! Have you finished your report?\nLinda: Well, ______ most of it this afternoon, and I’ll finish it by Friday.", "options": ["I would do", "I did", "I was doing", "I’ll do"], "answer": 1, "answerLabel": "B", "source": "113 會考｜單題｜第 21 題", "explanation": "this afternoon 已經過去，表示已完成的動作：過去式 I did。", "explanationSource": "own", "section": "單題"}, {"id": 22, "question": "【閱讀測驗 第 22–23 題】\nIt was around eight o’clock on Saturday night. Philip was at home with his little brother, Jason. Jason was hungry and kept crying. But Philip couldn’t cook and their father was not home yet because he was working late in the office. So Philip decided to take Jason out for some food.\nHalf an hour later, when they came back home, Philip was surprised to find that their father was talking to the police and a woman outside their house. He didn’t know who the woman was. She looked scared and stood behind the police. Philip’s father was very angry and kept shouting, “I didn’t do anything wrong! I forgot my keys and was just trying to get into MY OWN HOUSE!” But the police didn’t believe him until Philip ran to them and explained everything.\nThe police told Philip that the woman called 110 when she saw Philip’s father trying to get into a house through a window. That was how it all happened.\n\n▶ 第 22 題　Why did Philip go out?", "options": ["To meet a woman.", "To look for his father.", "To ask the police for help.", "To buy food for his brother."], "answer": 3, "answerLabel": "D", "source": "113 會考｜閱讀測驗｜第 22 題", "explanation": "弟弟肚子餓一直哭，Philip 不會煮飯，就帶弟弟出去買吃的。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 23, "question": "【閱讀測驗 第 22–23 題】\nIt was around eight o’clock on Saturday night. Philip was at home with his little brother, Jason. Jason was hungry and kept crying. But Philip couldn’t cook and their father was not home yet because he was working late in the office. So Philip decided to take Jason out for some food.\nHalf an hour later, when they came back home, Philip was surprised to find that their father was talking to the police and a woman outside their house. He didn’t know who the woman was. She looked scared and stood behind the police. Philip’s father was very angry and kept shouting, “I didn’t do anything wrong! I forgot my keys and was just trying to get into MY OWN HOUSE!” But the police didn’t believe him until Philip ran to them and explained everything.\nThe police told Philip that the woman called 110 when she saw Philip’s father trying to get into a house through a window. That was how it all happened.\n\n▶ 第 23 題　Why was Philip’s father angry?", "options": ["He forgot his keys.", "The woman was hiding from him.", "The police didn’t believe what he said.", "Philip and his brother went out at night."], "answer": 2, "answerLabel": "C", "source": "113 會考｜閱讀測驗｜第 23 題", "explanation": "爸爸一直大喊自己沒做錯事、只是要進自己家，但警察不相信，直到 Philip 跑來解釋。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 24, "question": "【閱讀測驗 第 24–25 題】\nBaker’s Kitchen\nWe Give You the Taste of the Good Life\nWant to be the first to bring our popular breads home? Here is when they come fresh out of the oven every day.\nFrench bread 7:30am／bread rolls 8:30am／croissants 9:30am／white bread 10:30am／bagels 11:30am\npretzels 2:30pm (*Friday only)／challah 3:30pm (*Friday only)／farm bread 4:30pm\nAll breads at half price after 8pm (after 7pm on Saturdays and Sundays)\nBusiness hours: Mon. to Fri., 7:30am to 9pm, Sat. & Sun., 7:30am to 8pm\n（oven 烤箱）\n\n▶ 第 24 題　Kevin is going to buy some fresh bread at Baker’s Kitchen. He loves white bread, his mom likes farm bread, his father enjoys bagels, and his sister eats only challah. Which is the earliest possible time for him to get all these breads for his family?", "options": ["11:00am.", "4:00pm.", "5:00pm.", "7:00pm."], "answer": 2, "answerLabel": "C", "source": "113 會考｜閱讀測驗｜第 24 題", "explanation": "白麵包 10:30、貝果 11:30、哈拉麵包 3:30（週五）、農夫麵包 4:30 才出爐，所以最早要 4:30 以後，選項中最早的是 5:00 pm。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap113-g24.png?v=20261120-7"}, {"id": 25, "question": "【閱讀測驗 第 24–25 題】\nBaker’s Kitchen\nWe Give You the Taste of the Good Life\nWant to be the first to bring our popular breads home? Here is when they come fresh out of the oven every day.\nFrench bread 7:30am／bread rolls 8:30am／croissants 9:30am／white bread 10:30am／bagels 11:30am\npretzels 2:30pm (*Friday only)／challah 3:30pm (*Friday only)／farm bread 4:30pm\nAll breads at half price after 8pm (after 7pm on Saturdays and Sundays)\nBusiness hours: Mon. to Fri., 7:30am to 9pm, Sat. & Sun., 7:30am to 8pm\n（oven 烤箱）\n\n▶ 第 25 題　What do we know about Baker’s Kitchen?", "options": ["It is open five days a week.", "Its breads are half price one hour before closing.", "Its croissants and pretzels are sold on weekends.", "Its members can save $100 when they shop on Fridays."], "answer": 1, "answerLabel": "B", "source": "113 會考｜閱讀測驗｜第 25 題", "explanation": "平日 9 點打烊、8 點後半價；週末 8 點打烊、7 點後半價，都是打烊前一小時半價。店每天都營業；pretzels 只有週五賣。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap113-g24.png?v=20261120-7"}, {"id": 26, "question": "【閱讀測驗 第 26–27 題】\nINFORMATION ABOUT THE 2021 GREEN FESTIVAL\n1. The 2021 Green Festival will be held at Satyr’s Park from April 1 to May 31.\n2. You are welcome to take the Free Festival Bus at the Goat Street Station to the festival.\n3. You can also go to the festival by metro (get off at the Koala Street Station or the Turtle Street Station) or by bus (take No. 28, 103, 125, 157, 259, 505, 908, or 1086).\n4. During the festival, Fox Street is closed; no cars can enter the street.\n5. Garden Square won’t be open for car parking; there will be a farmers’ market at the square during the festival.\n6. During the festival, Faun’s Weekend Flower Market will be open every day from 8am to 2pm.\n（見下方地圖；recommend 推薦）\n\n▶ 第 26 題　What is recommended to people who want to visit the festival?", "options": ["Using the free festival bus service.", "Visiting the festival on the weekend.", "Entering Satyr’s Park from Fox Street.", "Parking in Garden Square and walking to the festival."], "answer": 0, "answerLabel": "A", "source": "113 會考｜閱讀測驗｜第 26 題", "explanation": "第 2 點歡迎大家在 Goat Street 站搭免費接駁車去園遊會。Fox Street 封路，Garden Square 不開放停車。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap113-g26.png?v=20261120-7"}, {"id": 27, "question": "【閱讀測驗 第 26–27 題】\nINFORMATION ABOUT THE 2021 GREEN FESTIVAL\n1. The 2021 Green Festival will be held at Satyr’s Park from April 1 to May 31.\n2. You are welcome to take the Free Festival Bus at the Goat Street Station to the festival.\n3. You can also go to the festival by metro (get off at the Koala Street Station or the Turtle Street Station) or by bus (take No. 28, 103, 125, 157, 259, 505, 908, or 1086).\n4. During the festival, Fox Street is closed; no cars can enter the street.\n5. Garden Square won’t be open for car parking; there will be a farmers’ market at the square during the festival.\n6. During the festival, Faun’s Weekend Flower Market will be open every day from 8am to 2pm.\n（見下方地圖；recommend 推薦）\n\n▶ 第 27 題　What can we learn about the farmers’ market from the map?", "options": ["The farmers’ market is next to the flower market.", "The farmers’ market and the festival are on the same block.", "You can go to the farmers’ market by taking Bus No. 157 to Puppy Street.", "The nearest metro station to the farmers’ market is the Koala Street Station."], "answer": 3, "answerLabel": "D", "source": "113 會考｜閱讀測驗｜第 27 題", "explanation": "農夫市集在 Garden Square，地圖上它旁邊就是 Koala Street 的捷運站。花市和園遊會都在 Lion Road 的另一側；157 公車站在 Koala Street 側，不在 Puppy Street。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap113-g26.png?v=20261120-7"}, {"id": 28, "question": "【閱讀測驗 第 28–29 題】\nYan lived a good life in a big house. One day he invited a friend to dinner at his house. However, on the dinner table there was only one small dish of one small fish. The friend looked quietly at the fish. It was no bigger than a finger.\nThen he asked Yan if he could borrow a lamp.\n“What for?” Yan asked.\n“Well, it’s so dark in here,” the friend said with a dry smile, “I can’t see the other delicious dishes you’ve prepared for me.”\n\nChang kept a lot of ducks and chickens on his farm. One day, his best friend came to visit him. At noon, Chang told his friend that he couldn’t let him stay for lunch because there wasn’t much food to eat. The friend looked out at Chang’s farm animals for a moment. Then he asked Chang if he had a big knife.\n“Yes, but what for?” Chang asked.\n“I’m thinking about killing the horse I rode here so we’ll have something for lunch,” the friend said.\n“But how are you going to go home without it?”\n“Well, you wouldn’t mind lending me one of your many ducks or chickens so I can ride it home, would you?”\n（likely 可能）\n\n▶ 第 28 題　What kind of people do Yan’s and Chang’s friends most likely think Yan and Chang are?", "options": ["They enjoy good food.", "They don’t like to share.", "They like to make friends.", "They don’t like new things."], "answer": 1, "answerLabel": "B", "source": "113 會考｜閱讀測驗｜第 28 題", "explanation": "Yan 住大房子卻只請一條小魚，Chang 養很多雞鴨卻說沒東西吃，朋友都用反話諷刺他們小氣、不願分享。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 29, "question": "【閱讀測驗 第 28–29 題】\nYan lived a good life in a big house. One day he invited a friend to dinner at his house. However, on the dinner table there was only one small dish of one small fish. The friend looked quietly at the fish. It was no bigger than a finger.\nThen he asked Yan if he could borrow a lamp.\n“What for?” Yan asked.\n“Well, it’s so dark in here,” the friend said with a dry smile, “I can’t see the other delicious dishes you’ve prepared for me.”\n\nChang kept a lot of ducks and chickens on his farm. One day, his best friend came to visit him. At noon, Chang told his friend that he couldn’t let him stay for lunch because there wasn’t much food to eat. The friend looked out at Chang’s farm animals for a moment. Then he asked Chang if he had a big knife.\n“Yes, but what for?” Chang asked.\n“I’m thinking about killing the horse I rode here so we’ll have something for lunch,” the friend said.\n“But how are you going to go home without it?”\n“Well, you wouldn’t mind lending me one of your many ducks or chickens so I can ride it home, would you?”\n（likely 可能）\n\n▶ 第 29 題　What is it in the second story?", "options": ["A big knife.", "The horse.", "Lunch.", "One of Chang’s ducks or chickens."], "answer": 1, "answerLabel": "B", "source": "113 會考｜閱讀測驗｜第 29 題", "explanation": "朋友說要殺掉騎來的馬，Chang 問「沒有牠你怎麼回家」，it 指那匹馬。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 30, "question": "【閱讀測驗 第 30–32 題】\nTAINAN CO!\nUsually, people visit bookstores to buy books. But those who walk into Cotoha come to see its owner, Chen Bing-Hong. They bring him books with different problems. Some have lost their covers, some are missing a few pages, and some have pages that are falling out. Chen can always fix the books and make them whole again.\nChen sees himself as a doctor. He says that books, like people, get sick and need help. In Taiwan, there are not many “doctors” like him, and most of them work for big libraries and museums. If big libraries and museums are hospitals, Chen’s bookstore is a health center. Big libraries and museums fix important old books with serious problems, and Chen helps people with books that have smaller problems. However, the smaller size of the problems doesn’t mean Chen’s job is less important.\nChen gave an example of a science book he once worked on. It was very old and half of its cover was lost. Its owner still wanted to keep it because it was a gift from a teacher who helped him follow his dream of studying science. When he got his book back, he was very surprised at the new-old book. He felt he was brought back to the days with his teacher. Seeing the owner’s smile made Chen happy, because smiles like that are what his magic is for.\n\n▶ 第 30 題　Why does the writer talk about doctors and a health center in the reading?", "options": ["To explain Chen’s services.", "To talk about Chen’s future plans.", "To explain Chen’s love for books.", "To show why bookstores are important."], "answer": 0, "answerLabel": "A", "source": "113 會考｜閱讀測驗｜第 30 題", "explanation": "作者把大型圖書館、博物館比作醫院，陳的書店比作衛生所，說明他是幫一般人修補小問題書本的「書醫生」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 31, "question": "【閱讀測驗 第 30–32 題】\nTAINAN CO!\nUsually, people visit bookstores to buy books. But those who walk into Cotoha come to see its owner, Chen Bing-Hong. They bring him books with different problems. Some have lost their covers, some are missing a few pages, and some have pages that are falling out. Chen can always fix the books and make them whole again.\nChen sees himself as a doctor. He says that books, like people, get sick and need help. In Taiwan, there are not many “doctors” like him, and most of them work for big libraries and museums. If big libraries and museums are hospitals, Chen’s bookstore is a health center. Big libraries and museums fix important old books with serious problems, and Chen helps people with books that have smaller problems. However, the smaller size of the problems doesn’t mean Chen’s job is less important.\nChen gave an example of a science book he once worked on. It was very old and half of its cover was lost. Its owner still wanted to keep it because it was a gift from a teacher who helped him follow his dream of studying science. When he got his book back, he was very surprised at the new-old book. He felt he was brought back to the days with his teacher. Seeing the owner’s smile made Chen happy, because smiles like that are what his magic is for.\n\n▶ 第 31 題　Why is Chen Bing-Hong’s job important in the example he gave?", "options": ["It allows people to get books as gifts.", "It saves people money on new books.", "It gives people hope to follow their dreams.", "It helps people think of special moments in the past."], "answer": 3, "answerLabel": "D", "source": "113 會考｜閱讀測驗｜第 31 題", "explanation": "書主拿回修好的書，覺得被帶回和老師相處的日子，修書讓人想起過去的特別時光。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 32, "question": "【閱讀測驗 第 30–32 題】\nTAINAN CO!\nUsually, people visit bookstores to buy books. But those who walk into Cotoha come to see its owner, Chen Bing-Hong. They bring him books with different problems. Some have lost their covers, some are missing a few pages, and some have pages that are falling out. Chen can always fix the books and make them whole again.\nChen sees himself as a doctor. He says that books, like people, get sick and need help. In Taiwan, there are not many “doctors” like him, and most of them work for big libraries and museums. If big libraries and museums are hospitals, Chen’s bookstore is a health center. Big libraries and museums fix important old books with serious problems, and Chen helps people with books that have smaller problems. However, the smaller size of the problems doesn’t mean Chen’s job is less important.\nChen gave an example of a science book he once worked on. It was very old and half of its cover was lost. Its owner still wanted to keep it because it was a gift from a teacher who helped him follow his dream of studying science. When he got his book back, he was very surprised at the new-old book. He felt he was brought back to the days with his teacher. Seeing the owner’s smile made Chen happy, because smiles like that are what his magic is for.\n\n▶ 第 32 題　What is his magic?", "options": ["Fixing books.", "Making book owners smile.", "Finding books that are long lost.", "Changing his bookstore into a library."], "answer": 0, "answerLabel": "A", "source": "113 會考｜閱讀測驗｜第 32 題", "explanation": "他的「魔法」是讓破損的書恢復完整，也就是修書；書主的笑容是這個魔法的目的。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 33, "question": "【閱讀測驗 第 33–35 題】\nhttps://www.refugeefriendly.org/habibi-hawara/\nA Delicious Surprise and Welcome Change\nBy Karl Falk, June 1, 2016\nIn Austria, there are not many restaurants like Habibi & Hawara. Here you can enjoy Austrian and Syrian food together. Two Austrians, Martin Rohla and David Kreytenberg, started this yummy plan from their experience of working with refugees.\nEvery year, thousands of people have to leave their homes and families because of war in their countries. So many of them go to Austria that some people in the country think they have become a problem. They are afraid refugees may take away their jobs and they don’t feel safe around them, either. But Rohla and Kreytenberg would beg to differ: The refugees don’t have to be a problem. They want to help them start a new life. They invited refugees to meetings and found that some of them were cooks back in Syria. So the idea of Habibi & Hawara was born—a restaurant that brings together Austrian and Syrian food. “The two worlds far away from each other meet together,” Kreytenberg said.\nBut Rohla and Kreytenberg want to do more than just give the refugees work. They want their best workers to buy the restaurant in the end. They hope that Habibi & Hawara is not just a one-time plan and that other Austrians will join them and help more refugees.\n（refugee 難民　war 戰爭）\n\n▶ 第 33 題　According to the reading, why did Rohla and Kreytenberg open Habibi & Hawara?", "options": ["To help refugees live better in Austria.", "To collect money to help Syria fight the war.", "To help Austrians learn about the war in Syria.", "To help refugees go back to their home countries."], "answer": 0, "answerLabel": "A", "source": "113 會考｜閱讀測驗｜第 33 題", "explanation": "他們認為難民不一定是問題，想幫助他們在奧地利展開新生活，所以開了這家餐廳。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 34, "question": "【閱讀測驗 第 33–35 題】\nhttps://www.refugeefriendly.org/habibi-hawara/\nA Delicious Surprise and Welcome Change\nBy Karl Falk, June 1, 2016\nIn Austria, there are not many restaurants like Habibi & Hawara. Here you can enjoy Austrian and Syrian food together. Two Austrians, Martin Rohla and David Kreytenberg, started this yummy plan from their experience of working with refugees.\nEvery year, thousands of people have to leave their homes and families because of war in their countries. So many of them go to Austria that some people in the country think they have become a problem. They are afraid refugees may take away their jobs and they don’t feel safe around them, either. But Rohla and Kreytenberg would beg to differ: The refugees don’t have to be a problem. They want to help them start a new life. They invited refugees to meetings and found that some of them were cooks back in Syria. So the idea of Habibi & Hawara was born—a restaurant that brings together Austrian and Syrian food. “The two worlds far away from each other meet together,” Kreytenberg said.\nBut Rohla and Kreytenberg want to do more than just give the refugees work. They want their best workers to buy the restaurant in the end. They hope that Habibi & Hawara is not just a one-time plan and that other Austrians will join t speak for others.", "They do not notice something."], "answer": 0, "answerLabel": "A", "source": "113 會考｜閱讀測驗｜第 35 題", "explanation": "有些人認為難民是問題，但兩人 beg to differ，認為難民不一定是問題，表示「不同意」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 36, "question": "【閱讀測驗 第 36–39 題】\nVOICES OF PEOPLE\nIf you want to learn about bringing back extinct animals, reading John Smith’s Back from the Dead is a good start. But I have to say: I can’t agree with everything he says.　— Ellen Zimmer\nFrom his book, I can see Smith is an advocate of bringing extinct animals back. He says we have lost many animals because we made their living spaces too dirty. He also thinks we must do everything we can to bring them back. However, I don’t know how much time and money we would need to make the world a better place for them, and honestly no one knows if they could actually come back.\nSmith also says that bringing back extinct animals may be good for us. He talks about an extinct frog that grew tadpoles in its stomach. Some women’s babies die before they are born, and Smith believes bringing back the frog may be an answer to the problem. According to him, by studying how the tadpoles grow inside the frog’s stomach, we might be able to find new ways to help these women successfully keep their babies. But I don’t think things are as easy as Smith thinks. We have spent ten years and millions of dollars on this kind of frog, but all we have got are only a few dead frog eggs. If we can’t see a real frog, how can we be sure women will get the help they need?\nDr. Solomon Wang from the Animal Saving Office says the study of bringing back extinct animals is “throwing good money after bad.” And he’s right. A lot of hard work has been put into this expensive dream, but we haven’t seen anything come out of it. So should we still keep going down this road?\n（extinct 絕種的　tadpole 蝌蚪）\n\n▶ 第 36 題　What does it mean when someone is an advocate of something?", "options": ["They talk a lot but do little abou  about the extinct frog in Smith’s book?", "options": ["It can live in a dirty living space.", "It might help fix a health problem.", "It eats its babies when it cannot find food.", "It is the first extinct animal that people studied."], "answer": 1, "answerLabel": "B", "source": "113 會考｜閱讀測驗｜第 37 題", "explanation": "研究這種在胃裡孕育蝌蚪的青蛙，可能找到幫助孕婦保住胎兒的新方法。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 38, "question": "【閱讀測驗 第 36–39 題】\nVOICES OF PEOPLE\nIf you want to learn about bringing back extinct animals, reading John Smith’s Back from the Dead is a good start. But I have to say: I can’t agree with everything he says.　— Ellen Zimmer\nFrom his book, I can see Smith is an advocate of bringing extinct animals back. He says we have lost many animals because we made their living spaces too dirty. He also thinks we must do everything we can to bring them back. However, I don’t know how much time and money we would need to make the world a better place for them, and honestly no one knows if they could actually come back.\nSmith also says that bringing back extinct animals may be good for us. He talks about an extinct frog that grew tadpoles in its stomach. Some women’s babies die before they are born, and Smith believes bringing back the frog may be an answer to the problem. According to him, by studying how the tadpoles grow inside the frog’s stomach, we might be able to find new ways to help these women successfully keep their babies. But I don’t think things are as easy as Smith thinks. We have spent ten years and millions of dollars on this kind of frog, but all we have got are only a few dead frog eggs. If we can’t see a real frog, how can we be sure women will get the help they need?\nDr. Solomon Wang from the Animal Saving Office says the study of bringing back extinct animals is “throwing good money after bad.” And he’s right. A lot of hard work has been put into this expensive dream, but we haven’t seen anything come out of it. So should we still keep goi
