<script>window.QUIZ_CONFIG={"title": "114 年國中會考英語｜單題＋閱讀測驗＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. A ______ is flying over the houses.", "options": ["bird", "butterfly", "kite", "plane"], "answer": 3, "answerLabel": "D", "source": "114 會考｜單題｜第 1 題", "explanation": "圖中飛過房子上方的是「飛機」：plane。", "explanationSource": "own", "section": "單題", "image": "assets/cap114-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　When I was a teenager, I was very ______. But now, it’s easier for me to talk to people.", "options": ["happy", "lazy", "popular", "shy"], "answer": 3, "answerLabel": "D", "source": "114 會考｜單題｜第 2 題", "explanation": "現在比較容易跟人說話，表示以前很「害羞」：shy。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Lena doesn’t want to go ______ with John because she is afraid of water.", "options": ["dancing", "hiking", "sailing", "shopping"], "answer": 2, "answerLabel": "C", "source": "114 會考｜單題｜第 3 題", "explanation": "怕水，所以不想去「航行」：go sailing。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　Cindy enjoys ______ her dad read stories to her before bed.", "options": ["to listen to", "listening to", "listen to", "listens to"], "answer": 1, "answerLabel": "B", "source": "114 會考｜單題｜第 4 題", "explanation": "enjoy + V-ing：enjoys listening to her dad read stories。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　Dad is busy cooking in the kitchen. Dinner will be ______ in ten minutes.", "options": ["free", "full", "medium", "ready"], "answer": 3, "answerLabel": "D", "source": "114 會考｜單題｜第 5 題", "explanation": "爸爸在廚房煮飯，晚餐十分鐘後就「準備好」：ready。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　There are so many new ______ in the office. It’ll take me some time to remember who is who.", "options": ["faces", "ideas", "rules", "tools"], "answer": 0, "answerLabel": "A", "source": "114 會考｜單題｜第 6 題", "explanation": "需要時間記住誰是誰，表示辦公室有很多「新面孔」：new faces。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　I feel like a ______. I was looking for my keys for hours but they have been in my pocket the whole time.", "options": ["fool", "ghost", "king", "stranger"], "answer": 0, "answerLabel": "A", "source": "114 會考｜單題｜第 7 題", "explanation": "找了好幾小時的鑰匙一直在口袋裡，覺得自己像個「笨蛋」：fool。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Mr. and Mrs. Wu have three daughters. Two are in high school, and ______ is in elementary school.", "options": ["each", "the other", "the one", "the next"], "answer": 1, "answerLabel": "B", "source": "114 會考｜單題｜第 8 題", "explanation": "三個女兒中兩個讀高中，「剩下的那一個」讀小學：the other。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　It is hard for trees to ______ along this beach because of the strong winds from the sea.", "options": ["blow", "build", "follow", "grow"], "answer": 3, "answerLabel": "D", "source": "114 會考｜單題｜第 9 題", "explanation": "強風讓樹很難在海邊「生長」：grow。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Christmas ______ and I want to visit my aunt abroad. Do you have any plans yet?", "options": ["came", "comes", "is coming", "was coming"], "answer": 2, "answerLabel": "C", "source": "114 會考｜單題｜第 10 題", "explanation": "聖誕節「快要到了」：用現在進行式表示即將發生 is coming。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　Jo won’t be happy if you’re late for his party tonight, so ______ sure that you arrive on time.", "options": ["make", "makes", "to make", "is making"], "answer": 0, "answerLabel": "A", "source": "114 會考｜單題｜第 11 題", "explanation": "祈使句：make sure that...（務必確定…）。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　You may have a long drive because of the terrible ______. There are usually a lot of cars and buses during this time.", "options": ["experience", "machine", "service", "traffic"], "answer": 3, "answerLabel": "D", "source": "114 會考｜單題｜第 12 題", "explanation": "這個時段車輛很多，所以是「交通」很糟：terrible traffic。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　In the future, there will ______ be greater basketball players than Stephen Curry, but now we believe he is the best!", "options": ["again", "already", "never", "perhaps"], "answer": 3, "answerLabel": "D", "source": "114 會考｜單題｜第 13 題", "explanation": "未來「或許」會有更強的球員：perhaps。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　I guess the rainwater has come in from the kitchen. See? ______ of the windows are closed except the one in the kitchen.", "options": ["All", "Both", "Most", "Some"], "answer": 0, "answerLabel": "A", "source": "114 會考｜單題｜第 14 題", "explanation": "除了廚房那扇，「全部的」窗戶都關著：All。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　______ machines have been used to pick fruits for a long time, they were not used on strawberry farms until several years ago.", "options": ["Although", "Because", "Before", "If"], "answer": 0, "answerLabel": "A", "source": "114 會考｜單題｜第 15 題", "explanation": "機器用來採水果很久了，「雖然」如此，草莓農場直到幾年前才使用：Although。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "第 16 題　There are online videos that teach you exercises you can do at home. They’ll ______ you a trip to the gym, and some money too.", "options": ["cost", "give", "keep", "save"], "answer": 3, "answerLabel": "D", "source": "114 會考｜單題｜第 16 題", "explanation": "在家運動可以「省下」去健身房的路程和錢：save sb. a trip。", "explanationSource": "own", "section": "單題"}, {"id": 17, "question": "第 17 題　Jane’s parents are always happy to see their grandchildren, but mine ______ less so when I visit them with my kids.", "options": ["is", "are", "do", "does"], "answer": 1, "answerLabel": "B", "source": "114 會考｜單題｜第 17 題", "explanation": "mine＝my parents（複數），代替 are happy：mine are less so。", "explanationSource": "own", "section": "單題"}, {"id": 18, "question": "第 18 題　Before she ______ about it, you should tell Daphne you broke her favorite cup.", "options": ["asks", "asked", "was asking", "will ask"], "answer": 0, "answerLabel": "A", "source": "114 會考｜單題｜第 18 題", "explanation": "Before 引導時間副詞子句，用現在式代替未來式：Before she asks。", "explanationSource": "own", "section": "單題"}, {"id": 19, "question": "第 19 題　It was very windy this morning. Some of the shirts on the balcony were blown away ______ in the pond.", "options": ["fell", "and fell", "fallen", "and fallen"], "answer": 1, "answerLabel": "B", "source": "114 會考｜單題｜第 19 題", "explanation": "were blown away and fell in the pond：and 連接兩個過去式動詞。", "explanationSource": "own", "section": "單題"}, {"id": 20, "question": "【閱讀測驗 第 20–21 題】\nRex is a dog that lives at the bakery next to our school. He is cute and friendly. Every morning, he stands in front of the school to welcome everybody. We all see Rex as one of us. But one Monday morning, I was surprised that Rex was not there to say hello to us. “Rex is in the hospital. He was hit by a car last night,” my classmate told me. We went to see Rex in the hospital that day after school. Two weeks later, Rex was much better, and we decided to take him for a walk every evening. Because of the exercise, Rex became healthier and stronger. Soon he could happily run and jump again. He is now as handsome and strong as before!\n\n▶ 第 20 題　What happened to Rex?", "options": ["He got lost.", "He got hurt.", "He bit people.", "He ate too much."], "answer": 1, "answerLabel": "B", "source": "114 會考｜閱讀測驗｜第 20 題", "explanation": "Rex 晚上被車撞，住進醫院，所以是受傷了。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 21, "question": "【閱讀測驗 第 20–21 題】\nRex is a dog that lives at the bakery next to our school. He is cute and friendly. Every morning, he stands in front of the school to welcome everybody. We all see Rex as one of us. But one Monday morning, I was surprised that Rex was not there to say hello to us. “Rex is in the hospital. He was hit by a car last night,” my classmate told me. We went to see Rex in the hospital that day after school. Two weeks later, Rex was much better, and we decided to take him for a walk every evening. Because of the exercise, Rex became healthier and stronger. Soon he could happily run and jump again. He is now as handsome and strong as before!\n\n▶ 第 21 題　How did the writer help Rex?", "options": ["By calling the police.", "By making him exercise.", "By taking him to see a doctor.", "By looking for a new home for him."], "answer": 1, "answerLabel": "B", "source": "114 會考｜閱讀測驗｜第 21 題", "explanation": "Rex 好轉後，作者和同學每天傍晚帶牠散步，因為運動讓牠更健康強壯。送醫的不是作者。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 22, "question": "【閱讀測驗 第 22–23 題】\nFriends Forever Group (3) Jenny, Linda, Mark\nJenny: Hey guys, guess what? I’m getting married next year!\nLinda: Wow, I’m so happy for you.\nMark: I have good news too! I just got the job I’ve wanted so much.\nLinda: Come on, Mark. Don’t start again.\nLinda: You’re stealing Jenny’s thunder. Jenny was telling us about her big news. It’s very important to her. And you want us to hear about your new job now?\nMark: I didn’t mean that. I just...\nJenny: I agree. Last time when we were talking about how delicious Linda’s cake was, you started telling us about the chocolate cake you made at home.\nMark: All right, all right, my problem. Sorry, Jenny. I’ll never do that again.\nLinda: So do you want to know what job I got?\n\n▶ 第 22 題　What do we know about Mark from the dialogue?", "options": ["He made Linda unhappy.", "He is looking for a new job.", "He did not like Linda’s cake.", "He is getting married to Jenny."], "answer": 0, "answerLabel": "A", "source": "114 會考｜閱讀測驗｜第 22 題", "explanation": "Linda 說 Don’t start again，還指責他搶 Jenny 的風頭，可見 Mark 讓 Linda 不高興。他已經找到工作了；要結婚的是 Jenny。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 23, "question": "【閱讀測驗 第 22–23 題】\nFriends Forever Group (3) Jenny, Linda, Mark\nJenny: Hey guys, guess what? I’m getting married next year!\nLinda: Wow, I’m so happy for you.\nMark: I have good news too! I just got the job I’ve wanted so much.\nLinda: Come on, Mark. Don’t start again.\nLinda: You’re stealing Jenny’s thunder. Jenny was telling us about her big news. It’s very important to her. And you want us to hear about your new job now?\nMark: I didn’t mean that. I just...\nJenny: I agree. Last time when we were talking about how delicious Linda’s cake was, you started telling us about the chocolate cake you made at home.\nMark: All right, all right, my problem. Sorry, Jenny. I’ll never do that again.\nLinda: So do you want to know what job I got?\n\n▶ 第 23 題　Which is most likely an example of stealing someone’s thunder?", "options": ["Dennis never changes his mind except when his wife tells him to.", "Melisa tells Tom she’ll go to the party but tells her mom she’ll stay home.", "Jeff tells everyone he’ll move abroad when Ivy is still telling them about her baby.", "Alisa says she doesn’t care what we have for lunch but also doesn’t like the restaurant we chose."], "answer": 2, "answerLabel": "C", "source": "114 會考｜閱讀測驗｜第 23 題", "explanation": "steal someone’s thunder 是別人在分享大事時，插嘴說自己的事搶走風頭。Ivy 正在說寶寶的事時，Jeff 宣布要出國，就是這種情況。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 24, "question": "【閱讀測驗 第 24–25 題】\nBuy a White Lake City Card When You’re in the City\n① With any of the Cards, you can\n- visit the city by metro, bus, or train as many times as you want. *\n- take one child under 12 with you for free.\n- save 20% on tickets to public museums.\n② The 1-day, 3-day, and 5-day Cards are for trips from Monday to Friday, and the Weekend Card is for trips on weekends and holidays.\n③ Check the map and buy the right Card for the zones you’ll be entering.\nCard　Zone 1／Zones 1-2／Zones 1-3\n1-day　$20／$40／$60\n3-day　$40／$60／$80\n5-day　$50／$80／$110\nWeekend　$30／$50／$80\n* The Cards are only for trips inside the three zones.\n（見地圖：ⓐ White Lake Main Station　ⓑ Museum of White Lake City History　ⓒ Museum of Modern Art　ⓓ White Lake　ⓔ White Lake Castle　ⓕ White Lake Airport；zone 區）\n\n▶ 第 24 題　What can you do with a White Lake City Card?", "options": ["Save 20% on children’s train tickets.", "Visit any public museum in the city for free.", "Take a train to places out of the three zones.", "Move around the city by metro as much as you want."], "answer": 3, "answerLabel": "D", "source": "114 會考｜閱讀測驗｜第 24 題", "explanation": "持卡可不限次數搭乘捷運、公車、火車。博物館門票是打八折，不是免費；12 歲以下兒童可免費同行；只限三區內。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap114-g24.png?v=20261120-7"}, {"id": 25, "question": "【閱讀測驗 第 24–25 題】\nBuy a White Lake City Card When You’re in the City\n① With any of the Cards, you can\n- visit the city by metro, bus, or train as many times as you want. *\n- take one child under 12 with you for free.\n- save 20% on tickets to public museums.\n② The 1-day, 3-day, and 5-day Cards are for trips from Monday to Friday, and the Weekend Card is for trips on weekends and holidays.\n③ Check the map and buy the right Card for the zones you’ll be entering.\nCard　Zone 1／Zones 1-2／Zones 1-3\n1-day　$20／$40／$60\n3-day　$40／$60／$80\n5-day　$50／$80／$110\nWeekend　$30／$50／$80\n* The Cards are only for trips inside the three zones.\n（見地圖：ⓐ White Lake Main Station　ⓑ Museum of White Lake City History　ⓒ Museum of Modern Art　ⓓ White Lake　ⓔ White Lake Castle　ⓕ White Lake Airport；zone 區）\n\n▶ 第 25 題　Stacy is going to White Lake City and is staying at a hotel near the White Lake Main Station. She wants to visit the Museum of White Lake City History on Friday and see White Lake on Saturday. If she plans to buy (a) White Lake City Card(s), which of the four choices will be best for her and cost her the least?", "options": ["A 3-day Card for Zone 1.", "A Weekend Card for Zones 1-3.", "A 1-day Card for Zone 1 and a Weekend Card for Zones 1-2.", "A 1-day Card for Zones 1-2 and a Weekend Card for Zones 1-2."], "answer": 2, "answerLabel": "C", "source": "114 會考｜閱讀測驗｜第 25 題", "explanation": "週五去 Zone 1 的博物館，買 Zone 1 的 1-day Card（$20）；週六去 Zone 2 的白湖，買 Zones 1-2 的 Weekend Card（$50）。平日卡不能週末用，所以 A、B 不行。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap114-g24.png?v=20261120-7"}, {"id": 26, "question": "【閱讀測驗 第 26–28 題】\nAt 5 o’clock every morning, while most people are sleeping, 16-year-old Libby Larson is already up. She mops the floor, gets the mail and the newspapers, and gets ready for visitors to Rolling Acres. Libby’s grandparents started Rolling Acres in 1970, and since then all of the Larson family have been working there. Rolling Acres used to be just a sheep farm, but now, with its fruit trees, vegetable gardens, and many other kinds of animals, it has become a popular place for families to go on vacation. Visitors can pick fruits, collect eggs, and feed the animals. It is one of Libby’s jobs to show kids how to feed the baby sheep.\nFor her work, Libby is paid $10 an hour. This summer, she expects to make about $1,200 and plans to buy a cell phone. Her friends think it’s great to make that much money in a summer. However, for Libby, working at a family business also means making sacrifices. “I’d love to sleep until noon or go to summer camp like other kids. My friends stopped inviting me on trips because I’m always busy in the summer.” However, Libby also said, “But it’s better to see both sides. Working with your family is great. You feel closer to each other.”\n\n▶ 第 26 題　What is Rolling Acres?", "options": ["A zoo.", "A campground.", "A vacation farm.", "A family restaurant."], "answer": 2, "answerLabel": "C", "source": "114 會考｜閱讀測驗｜第 26 題", "explanation": "Rolling Acres 原本是牧羊場，現在有果樹、菜園、動物，成為家庭度假的熱門地點，是休閒農場。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 27, "question": "【閱讀測驗 第 26–28 題】\nAt 5 o’clock every morning, while most people are sleeping, 16-year-old Libby Larson is already up. She mops the floor, gets the mail and the newspapers, and gets ready for visitors to Rolling Acres. Libby’s grandparents started Rolling Acres in 1970, and since then all of the Larson family binet. Later, he found that he loved his cabinet more than any of his other furniture.\nAriely wanted to know if anyone shared his feelings, so he did a fun origami study. He invited two groups of people to join his study. He called one group “builders” and the other group “buyers.” Builders were told to make origami, like paper frogs or paper birds. When they finished, they were asked how much they would spend on their works. Ariely then showed the origami to buyers and asked them how much they would pay for them.\nThe two groups gave very different answers. Though buyers would pay only five cents for builders’ origami, builders would spend 25 cents! Interestingly, builders believed others would think their works were good enough to cost that much money!\nAriely’s study showed that he was not alone in his IKEA experience—we just love things more, sometimes blindly, when we make them ourselves. Ariely called it “the IKEA effect.”\n（effect 效應　furniture 家具）\n\n▶ 第 32 題　What did Ariely try to find out in the origami study?", "options": ["If he could stop the IKEA effect.", "Why people love making origami.", "Why IKEA furniture is so famous.", "If anyone shared his IKEA experience."], "answer": 3, "answerLabel": "D", "source": "114 會考｜閱讀測驗｜第 32 題", "explanation": "Ariely wanted to know if anyone shared his feelings, so he did a fun origami study。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 33, "question": "【閱讀測驗 第 32–34 題】\nThe IKEA Effect\nMany years ago, Dan Ariely bought a cabinet from IKEA. IKEA is a famous furniture store that sells boxes of furniture parts. People who buy them have to put all the parts together themselves. It took Ariely hours to build his cabinet. Ariely didn’t really enjoy himself when he was trying to put all the parts together. However, after he finished, he felt quite good about himself and his cabinet. Later, he found that he loved his cabinet more than any of his other furniture.\nAriely wanted to know if anyone shared his feelings, so he did a fun origami study. He invited two groups of people to join his study. He called one group “builders” and the other group “buyers.” Builders were told to make origami, like paper frogs or paper birds. When they finished, they were asked how much they would spend on their works. Ariely then showed the origami to buyers and asked them how much they would pay for them.\nThe two groups gave very different answers. Though buyers would pay only five cents for builders’ origami, builders would spend 25 cents! Interestingly, builders believed others would think their works were good enough to cost that much money!\nAriely’s study showed that he was not alone in his IKEA experience—we just love things more, sometimes blindly, when we make them ourselves. Ariely called it “the IKEA effect.”\n（effect 效應　furniture 家具）\n\n▶ 第 33 題　Which is true about the origami study?", "options": ["Buyers would spend less on builders’ origami than builders would.", "Builders and buyers needed to decide a price on the origami they made.", "Builders knew others would not pay as much for the origami as they would.", "Buyers would spend more on builders’ origami after knowing how they were made."], "answer": 0, "answerLabel": "A", "source": "114 會考｜閱讀測驗｜第 33 題", "explanation": "買家只願付 5 分錢，製作者卻願付 25 分錢。只有製作者動手做；製作者還以為別人也會覺得值那麼多。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 34, "question": "【閱讀測驗 第 32–34 題】\nThe IKEA Effect\nMany years ago, Dan Ariely bought a cabinet from IKEA. IKEA is a famous furniture store that sells boxes of furniture parts. People who buy them have to put all the parts together themselves. It took Ariely hours to build his cabinet. Ariely didn’t really enjoy himself when he was trying to put all the parts together. However, after he finished, he felt quite good about himself and his cabinet. Later, he found that he loved his cabinet more than any of his other furniture.\nAriely wanted to know if anyone shared his feelings, so he did a fun origami e.\nA year later, the electricity workers asked for another pay rise. To get what they wanted, they worked shorter hours and acted like they would walk away from their job anytime. But this time, the government decided to fight. To save electricity, it made new rules for people to follow. For example, each family could turn on the heat in only one room; TV stations had to stop their shows at 10:30 p.m.; businesses could open only three days a week.\nPeople’s lives were greatly changed. Without enough heat to keep the house warm, people covered themselves in blankets all the time. Hospitals had to use candles because they couldn’t keep all the lights on. Factories couldn’t keep their machines working. Many people lost their jobs. For months, people were paying the price while the electricity workers were fighting for their wish. In the end, the government agreed to the second pay rise. This picture shows what many people thought of the electricity workers during the “dark” time.\n（electricity 電力　government 政府）\n\n▶ 第 35 題　What is the reading mainly about?", "options": ["The tips on using a picture to tell a story.", "The change that electricity brought to people’s lives.", "The history behind the picture of a UK electricity worker.", "The story of a famous UK electricity worker from the 1970s."], "answer": 2, "answerLabel": "C", "source": "114 會考｜閱讀測驗｜第 35 題", "explanation": "文章從一張 1970 年代英國電力工人的圖片談起，說明當時電力工人要求加薪的歷史背景。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap114-g35.png?v=20261120-7"}, {"id": 36, "question": "【閱讀測驗 第 35–37 題】\n（圖：一位 1970 年代的英國電力工人，標語 NOTHING HERE ALWAYS OUT）\nIn the picture is a UK electricity worker in the 1970s. Pictures like this appeared in many newspapers at the time. In 1972, electricity workers in the UK asked to be paid more, and they decided to stop working until their wish was answered. The government worried that there wouldn’t be enough electricity for the country if these workers didn’t go to work, so it agre
