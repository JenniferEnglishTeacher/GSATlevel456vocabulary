<script>window.QUIZ_CONFIG={"title": "105 年國中會考英語｜單題＋閱讀測驗＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. What is the dog doing?", "options": ["Biting the man.", "Crossing the street.", "Running after the bus.", "Sitting on the sidewalk."], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 1 題", "explanation": "圖中狗正走在斑馬線上，所以是 Crossing the street（過馬路）。", "explanationSource": "own", "section": "單題", "image": "assets/cap105-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　Chris: Which ______ looks better on me?\nPenny: I think purple's better. You look great in purple.", "options": ["color", "grade", "shape", "size"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 2 題", "explanation": "Penny 回答紫色比較好，可見問的是「顏色」：Which color looks better on me?", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　My cat got excited when it saw the boy ______ the birds.", "options": ["catches", "catching", "to catch", "caught"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 3 題", "explanation": "感官動詞 see + 受詞 + V-ing／原形動詞。saw the boy catching the birds＝看見男孩正在抓鳥。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　Mr. Jackson is a very ______ writer; people of all ages enjoy his stories.", "options": ["polite", "popular", "handsome", "honest"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 4 題", "explanation": "後句說各年齡層都喜歡他的故事，表示他是「受歡迎的」作家 popular。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　Carol sounded happy when we talked on the phone; I could feel joy in her ______.", "options": ["eyes", "mail", "smile", "voice"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 5 題", "explanation": "講電話時只聽得到聲音，所以是從她的 voice（聲音）感受到喜悅。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Mark studies very hard and never ______ classes. He goes to school even when he is sick.", "options": ["loses", "misses", "changes", "forgets"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 6 題", "explanation": "生病還去上學，表示他從不「缺課」：miss classes。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　Have you got anything for Joe ______? He'd be happy to get your gift on his birthday.", "options": ["almost", "either", "soon", "yet"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 7 題", "explanation": "Have you got...? 是現在完成式問句，句尾用 yet「已經…了嗎」。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Susan bought ______ bread in the supermarket, but she did not buy anything to drink.", "options": ["many", "some", "any", "one"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 8 題", "explanation": "bread 是不可數名詞；肯定句表示「一些」用 some。many 接可數，any 多用於否定或疑問句。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Playing sports at least three times a week ______ good for your health.", "options": ["is", "are", "has", "have"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 9 題", "explanation": "動名詞片語 Playing sports... 當主詞視為單數，用 is。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　My parents have different hobbies. One enjoys baking; ______ enjoys taking pictures.", "options": ["another", "the next", "the other", "the second"], "answer": 2, "answerLabel": "C", "source": "105 會考｜單題｜第 10 題", "explanation": "父母只有兩個人：one…, the other…（一個…，另一個…）。another 用於三者以上。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　My mom told me to take care of ______ in England. She worried that I couldn't eat or sleep well there.", "options": ["me", "myself", "her", "herself"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 11 題", "explanation": "主詞（我）和受詞是同一人，take care of myself（照顧自己）。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　The paint on the wall is not as ______ as it was ten years ago. It has changed from white to gray.", "options": ["bright", "heavy", "sure", "young"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 12 題", "explanation": "從白色變成灰色，表示牆上的油漆不像十年前那麼「明亮」bright。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　I told you this road went the wrong way, but you just wouldn't listen. Now we have to ______ and take another road.", "options": ["go ahead", "move away", "pass by", "turn back"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 13 題", "explanation": "走錯路要「掉頭」改走另一條路：turn back。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　The last five years have not been ______ to Jennie. Her face is covered with lines and she looks much older than she is.", "options": ["kind", "special", "real", "enough"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 14 題", "explanation": "滿臉皺紋、看起來比實際年齡老很多，表示這五年對她「不仁慈」：be kind to sb.", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　My dog Jimmy loves ______ with a comb. Every time I comb his hair, he will close his eyes and fall asleep.", "options": ["to brush", "brushing", "to be brushing", "being brushed"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 15 題", "explanation": "狗是「被」梳毛，love 後接動名詞的被動 being brushed。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "【閱讀測驗 第 16–17 題】\nOur Pinky Street, one of the oldest streets in the world, was almost lost to a big fire last night. Most of the old houses on Pinky were burned down. The living history we are proud of is dying. But we should never give up. Pinky is like a parent, always there caring for our town. Now we must do something together to get the old Pinky back. There will be a meeting at 2:00 this Saturday afternoon at Town Office. Anyone who wants to help is welcome. Let’s see what we can do.\nAdam Bolton, Town Office　March 9\n\n▶ 第 16 題　What is the reading for?", "options": ["Finding out why the old street was on fire.", "Inviting people to do business on the old street.", "Getting people to find ways to save the old street.", "Asking for help for people who got hurt in the fire."], "answer": 2, "answerLabel": "C", "source": "105 會考｜閱讀測驗｜第 16 題", "explanation": "老街幾乎被燒毀，鎮公所邀請想幫忙的人週六來開會，一起想辦法讓老街恢復原貌。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 17, "question": "【閱讀測驗 第 16–17 題】\nOur Pinky Street, one of the oldest streets in the world, was almost lost to a big fire last night. Most of the old houses on Pinky were burned down. The living history we are proud of is dying. But we should never give up. Pinky is like a parent, always there caring for our town. Now we must do something together to get the old Pinky back. There will be a meeting at 2:00 this Saturday afternoon at Town Office. Anyone who wants to help is welcome. Let’s see what we can do.\nAdam Bolton, Town Office　March 9\n\n▶ 第 17 題　Which is NOT used in the reading to talk about the old street?", "options": ["A good friend.", "The old Pinky.", "A parent.", "A living history."], "answer": 0, "answerLabel": "A", "source": "105 會考｜閱讀測驗｜第 17 題", "explanation": "文中用 the living history、like a parent、the old Pinky 來指老街，沒有用 a good friend。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 18, "question": "【閱讀測驗 第 18–20 題】\nFunGana 2016\nNo idea where to spend your vacation? If you are a big fan of sun, beach, and water sports, then you must join FunGana 2016!\nOver the years, FunGana has taken people to many places in Gana. This year, we are taking you to Piso Island, one of Gana’s beautiful islands. Piso Island is adjacent to Wako Island, the biggest island in Gana, so it is only 15 minutes away by boat from Wako Island. The best time to visit? All year around, the weather on Piso Island is just wonderful for a vacation. You can sail out to watch whales, or enjoy one of the best mud springs in the world. We will also show you around the island in a special car, the Cocoon Rider. It’s our pleasure to help you enjoy your stay on Piso Island.\nFind out more about FunGana 2016 at http://www.fungana2016.com.gn.\n\n▶ 第 18 題　What is FunGana 2016 for?", "options": ["Studying sea animals in Gana.", "Giving courses in water sports.", "Giving weather reports in Gana.", "Helping people experience Gana."], "answer": 3, "answerLabel": "D", "source": "105 會考｜閱讀測驗｜第 18 題", "explanation": "FunGana 帶大家到 Gana 各地遊玩，今年去 Piso 島賞鯨、泡泥泉、搭車環島，目的是讓人體驗 Gana。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 19, "question": "【閱讀測驗 第 18–20 題】\nFunGana 2016\nNo idea where to spend your vacation? If you are a big fan of sun, beach, and water sports, then you must join FunGana 2016!\nOver the years, FunGana has taken people to many places in Gana. This year, we are taking you to Piso Island, one of Gana’s beautiful islands. Piso Island is adjacent to Wako Island, the biggest island in Gana, so it is only 15 minutes away by boat from Wako Island. The best time to visit? All year around, the weather on Piso Island is just wonderful for a vacation. You can sail out to watch whales, or enjoy one of the best mud springs in the world. We will also show you around the island in a special car, the Cocoon Rider. It’s our pleasure to help you enjoy your stay on Piso Island.\nFind out more about FunGana 2016 at http://www.fungana2016.com.gn.\n\n▶ 第 19 題　What does the reading say about Piso Island?", "options": ["It makes the best cars in Gana.", "It has nice weather in every season.", "It is the most popular island in Gana.", "It has the most mud springs in the world."], "answer": 1, "answerLabel": "B", "source": "105 會考｜閱讀測驗｜第 19 題", "explanation": "All year around, the weather on Piso Island is just wonderful：一年四季天氣都很好。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 20, "question": "【閱讀測驗 第 18–20 題】\nFunGana 2016\nNo idea where to spend your vacation? If you are a big fan of sun, beach, and water sports, then you must join FunGana 2016!\nOver the years, FunGana has taken people to many places in Gana. This year, we are taking you to Piso Island, one of Gana’s beautiful islands. Piso Island is adjacent to Wako Island, the biggest island in Gana, so it is only 15 minutes away by boat from Wako Island. The best time to visit? All year around, the weather on Piso Island is just wonderful for a vacation. You can sail out to watch whales, or enjoy one of the best mud springs in the world. We will also show you around the island in a special car, the Cocoon Rider. It’s our pleasure to help you enjoy your stay on Piso Island.\nFind out more about FunGana 2016 at http://www.fungana2016.com.gn.\n\n▶ 第 20 題　What does adjacent to mean?", "options": ["Like.", "Near.", "Bigger than.", "Warmer than."], "answer": 1, "answerLabel": "B", "source": "105 會考｜閱讀測驗｜第 20 題", "explanation": "Piso 島 adjacent to Wako 島，所以搭船只要 15 分鐘，adjacent to＝「鄰近」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 21, "question": "【閱讀測驗 第 21–22 題】\nHere is the schedule with the notice of the summer school that Tina goes to.\n　　　　　　　Mon.　　Tues.　　Wed.　　Thurs.　　Fri.\n09:30~10:30　English　Computer　English　English　Piano\n10:40~11:40　Piano　English　Painting　Dancing　Dancing\n13:30~14:30　Tennis　Painting　Tennis　Painting　Computer\n14:40~15:40　Baseball　Baseball　Swimming　Basketball　Basketball\nNOTICE\n• The school restaurant is closed during the summer school (7/4~7/31). Please bring your own lunch. If you need to order lunch, please tell your class leader the day before.\n• Dancing shoes can be borrowed with your summer school card. Please find Mr. Shum in Room 117.\n• During the third week, the gym will be used for the High School Ball Games. Please go to the playground for the basketball classes of the week.\n（schedule 課表）\n\n▶ 第 21 題　What do we know from the notice?", "options": ["The summer school is three weeks long.", "Students can order lunch from the school restaurant.", "There are basketball classes in the gym every week except the third week.", "Those who need to borrow dancing shoes must tell Mr. Shum the day before."], "answer": 2, "answerLabel": "C", "source": "105 會考｜閱讀測驗｜第 21 題", "explanation": "第三週體育館要辦球賽，籃球課改到操場，所以其他週都在體育館上。暑期班 7/4–7/31 約四週；餐廳不開放；要前一天告知的是訂午餐。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 22, "question": "【閱讀測驗 第 21–22 題】\nHere is the schedule with the notice of the summer school that Tina goes to.\n　　　　　　　Mon.　　Tues.　　Wed.　　Thurs.　　Fri.\n09:30~10:30　English　Computer　English　English　Piano\n10:40~11:40　Piano　English　Painting　Dancing　Dancing\n13:30~14:30　Tennis　Painting　Tennis　Painting　Computer\n14:40~15:40　Baseball　Baseball　Swimming　Basketball　Basketball\nNOTICE\n• The school restaurant is closed during the summer school (7/4~7/31). Please bring your own lunch. If you need to order lunch, please tell your class leader the day before.\n• Dancing shoes can be borrowed with your summer school card. Please find Mr. Shum in Room 117.\n• During the third week, the gym will be used for the High School Ball Games. Please go to the playground for the basketball classes of the week.\n（schedule 課表）\n\n▶ 第 22 題　Below is what Tina told her friends about the classes in her summer school schedule.\n“Mr. Reed was really crazy to give us so many new words at one time. Who can possibly remember all of them in a night? In our art class, when Ms. Grant asked us to draw a picture, I just drew a mad me looking at Mr. Reed. But then I totally forgot about Mr. Reed after two hours of PE classes in the afternoon. I was just too tired to think! Luckily, there was no computer class today to make it a really bad day.”\nWhich day was Tina talking about?", "options": ["Monday.", "Tuesday.", "Wednesday.", "Thursday."], "answer": 2, "answerLabel": "C", "source": "105 會考｜閱讀測驗｜第 22 題", "explanation": "那天有英文課（背單字）、美術課，下午兩堂體育課，而且沒有電腦課。週三是英文、畫畫、網球、游泳，完全符合。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 23, "question": "【閱讀測驗 第 23–24 題】\nThe wind keeps blowing.\nThe door keeps opening.\nWill you be with me, my dear Lucy,\nWhen I look for candy\nDown there in the dark, dark kitchen?\nThe wind keeps crying.\nThe door keeps shaking.\nWill you be with me, my dear Lucy,\nWhen I pick up my toy puppy\nOut there on the high, high balcony?\nWish you could always be with me\nAnd make them go away with your Do-Re-Me.\nI remember last Halloween\nThey ran away when you started to sing,\n“Dear Tommy, my little king,\nClose your eyes and have a sweet dream.”\nSo please stay with me and sing\nTo stop them kicking the door, riding the wind,\nAnd pulling me down to their house under the ground.\nThey’ll go away if you sing here for me,\nIn a voice that gets a black cat’s hair standing,\nThe strongest legs shaking, and the window glass breaking.\n(ideas from Matthew Sweeney’s poem)\n\n▶ 第 23 題　Which is most likely true about the speaker in the reading?", "options": ["He thinks a black cat is hiding somewhere in the house.", "He feels lonely because he is the only child in his family.", "He is looking for something he left somewhere in the house.", "He is afraid of being by himself when he feels ghosts around."], "answer": 3, "answerLabel": "D", "source": "105 會考｜閱讀測驗｜第 23 題", "explanation": "他一直問 Lucy 會不會陪著他，覺得「它們」會踢門、乘著風、把他拉到地底下，可見他怕鬼、不敢一個人。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 24, "question": "【閱讀測驗 第 23–24 題】\nThe wind keeps blowing.\nThe door keeps opening.\nWill you be with me, my dear Lucy,\nWhen I look for candy\nDown there in the dark, dark kitchen?\nThe wind keeps crying.\nThe door keeps shaking.\nWill you be with me, my dear Lucy,\nWhen I pick up my toy puppy\nOut there on the high, high balcony?\nWish you could always be with me\nAnd make them go away with your Do-Re-Me.\nI remember last Halloween\nThey ran away when you started to sing,\n“Dear Tommy, my little king,\nClose your eyes and have a sweet dream.”\nSo please stay with me and sing\nTo stop them kicking the door, riding the wind,\nAnd pulling me down to their house under the ground.\nThey’ll go away if you sing here for me,\nIn a voice that gets a black cat’s hair standing,\nThe strongest legs shaking, and the window glass breaking.\n(ideas from Matthew Sweeney’s poem)\n\n▶ 第 24 題　What can we learn about Lucy in the reading?", "options": ["She keeps opening the door.", "Her voice makes the speaker feel safe.", "Her candy was hidden in the kitchen.", "She was away from home last Halloween."], "answer": 1, "answerLabel": "B", "source": "105 會考｜閱讀測驗｜第 24 題", "explanation": "去年萬聖節 Lucy 一唱歌「它們」就跑了，所以他希望 Lucy 唱歌陪他，她的歌聲讓他覺得安心。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 25, "question": "【閱讀測驗 第 25–27 題】\n（漫畫，見下方圖片）\n1　Catch-22 by Joseph Heller\n2　There was a soldier…\n4　Soldier: This job is dangerous. I could die any time I fly.\n5　(The soldier goes to the hospital.)\n6　Soldier: Doctor, how can I get out of my dangerous job?\n7　Doctor: Rule 22 – A soldier can stop flying airplanes only if he is crazy. But he has to MAKE THE DOCTOR BELIEVE IT.\n8　Soldier: That’s easy!\n9　Doctor: Really? Think about it. If you are crazy, you won’t worry about your life. Then you would never think you should stop flying airplanes. If you ever think you should stop flying, it means that you worry about your life and that you’re not crazy. If you are not crazy, you have to keep flying. You see, you’re caught by Rule 22. You have no way out. You will still need to fly.\n10　Now people use “catch-22,” the name of Joseph Heller’s book, to mean that someone has a problem like the soldier’s.\n　want to stop → get crazy first　BUT…　already got crazy → will not want to stop\n\n▶ 第 25 題　What does IT in picture 7 mean?", "options": ["Rule 22 is easy to follow.", "Anyone can die at any time.", "Flying airplanes is dangerous.", "The soldier has become crazy."], "answer": 3, "answerLabel": "D", "source": "105 會考｜閱讀測驗｜第 25 題", "explanation": "規定是飛官瘋了才能停飛，但必須讓醫生「相信」，IT 指飛官已經瘋了這件事。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap105-g25.png?v=20261120-7"}, {"id": 26, "question": "【閱讀測驗 第 25–27 題】\n（漫畫，見下方圖片）\n1　Catch-22 by Joseph Heller\n2　There was a
