<script>window.QUIZ_CONFIG={"title": "111 年國中會考英語｜單題＋閱讀測驗＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. The woman is putting ______ on the cake.", "options": ["candles", "forks", "plates", "strawberries"], "answer": 0, "answerLabel": "A", "source": "111 會考｜單題｜第 1 題", "explanation": "圖中女子正把「蠟燭」插在蛋糕上：candles。", "explanationSource": "own", "section": "單題", "image": "assets/cap111-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　The movie starts at two o’clock, ______ let’s meet at the theater at one forty-five.", "options": ["so", "or", "if", "because"], "answer": 0, "answerLabel": "A", "source": "111 會考｜單題｜第 2 題", "explanation": "電影兩點開始，「所以」約 1:45 碰面：so。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Peter is afraid of the dark. He even leaves the ______ on when sleeping.", "options": ["computer", "fans", "lights", "music"], "answer": 2, "answerLabel": "C", "source": "111 會考｜單題｜第 3 題", "explanation": "怕黑所以睡覺時開著「燈」：leave the lights on。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　Pam is a ______ baseball player; she has more fans than any other player on her team.", "options": ["boring", "heavy", "popular", "rich"], "answer": 2, "answerLabel": "C", "source": "111 會考｜單題｜第 4 題", "explanation": "她的粉絲比隊上任何人都多，所以是「受歡迎的」選手：popular。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　I did not do my homework, so my teacher said I ______ stay after school to finish it.", "options": ["failed to", "had to", "hoped to", "used to"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 5 題", "explanation": "沒寫功課，老師說我放學「必須」留下來完成：had to。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Kevin has only enough money for the bag or the shoes. That is a hard ______ to make because he likes them both.", "options": ["choice", "gift", "rule", "trick"], "answer": 0, "answerLabel": "A", "source": "111 會考｜單題｜第 6 題", "explanation": "錢只夠買一樣，兩個都喜歡，很難做「選擇」：make a choice。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　It was ______ for us to answer the math question because we’ve done the same kind of questions many times.", "options": ["common", "easy", "safe", "special"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 7 題", "explanation": "同類型題目做過很多次，所以回答很「容易」：easy。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Although it took me lots of time ______ a big meal for ten people, I was happy that everyone enjoyed it.", "options": ["prepare", "to prepare", "preparing", "prepared"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 8 題", "explanation": "It takes + 人 + 時間 + to V：花了很多時間「去準備」：to prepare。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Don’t let the children swim in the river. We don’t know how ______ it is. It could be dangerous.", "options": ["deep", "far", "long", "thick"], "answer": 0, "answerLabel": "A", "source": "111 會考｜單題｜第 9 題", "explanation": "不知道河水有多「深」，可能很危險：how deep。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Bob is ______ of the boys in the family. He never does any housework. His brothers at least take out the garbage sometimes.", "options": ["lazier", "the lazy", "the lazier", "the laziest"], "answer": 3, "answerLabel": "D", "source": "111 會考｜單題｜第 10 題", "explanation": "他從不做家事，兄弟至少偶爾倒垃圾，所以他是家中「最懶」的：the laziest。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　Aunt Gina has lived in this town for more than sixty years, so she ______ it very well.", "options": ["will know", "knew", "knows", "was going to know"], "answer": 2, "answerLabel": "C", "source": "111 會考｜單題｜第 11 題", "explanation": "已經住了六十多年，現在對這個城鎮很「熟悉」，陳述現在事實用現在式 knows。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　We won’t see the sun even after the typhoon leaves, because the news said that heavier rain will soon ______.", "options": ["catch", "follow", "move", "stop"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 12 題", "explanation": "颱風走後還看不到太陽，因為更大的雨會「接著來」：follow。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　Yesterday when I got home from work, my brother ______ for dinner, so he invited me to join him.", "options": ["goes out", "went out", "has gone out", "was going out"], "answer": 3, "answerLabel": "D", "source": "111 會考｜單題｜第 13 題", "explanation": "我回到家的「當時」，弟弟正要出門吃飯：過去進行式 was going out。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　You were ______ not to lend Amy money. She never gives back what she borrows.", "options": ["crazy", "helpful", "wise", "wrong"], "answer": 2, "answerLabel": "C", "source": "111 會考｜單題｜第 14 題", "explanation": "Amy 借錢從不還，所以你不借她是「明智的」：wise。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　Have you found a summer job yet? Mr. Firth ______ someone to take care of his kids during the vacation. Maybe you can talk to him.", "options": ["has looked for", "is looking for", "looks for", "was looking for"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 15 題", "explanation": "暑假需要保母，Firth 先生「現在正在」找人：is looking for。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "第 16 題　David looked out of the balcony window and saw a woman get in his car ______ away.", "options": ["drive", "drove", "and drive", "and drove"], "answer": 2, "answerLabel": "C", "source": "111 會考｜單題｜第 16 題", "explanation": "感官動詞 see + 受詞 + 原形：saw a woman get in his car and drive away，兩個原形動詞用 and 連接。", "explanationSource": "own", "section": "單題"}, {"id": 17, "question": "第 17 題　The police haven’t found the little girl who ______ at a supermarket. They’ll keep doing all they can to find her.", "options": ["took away", "taken away", "has taken away", "was taken away"], "answer": 3, "answerLabel": "D", "source": "111 會考｜單題｜第 17 題", "explanation": "小女孩是「被帶走」的：關係子句用過去式被動 was taken away。", "explanationSource": "own", "section": "單題"}, {"id": 18, "question": "第 18 題　Buses to the airport only come once every hour, and we just missed ______. Why don’t we take a taxi?", "options": ["another", "it", "one", "them"], "answer": 2, "answerLabel": "C", "source": "111 會考｜單題｜第 18 題", "explanation": "one＝a bus（同類中不特定的一班）；公車一小時一班，我們剛錯過「一班」，所以搭計程車。it 指特定那一個，題意不是特定公車。", "explanationSource": "own", "section": "單題"}, {"id": 19, "question": "第 19 題　Ariel ______ every night for a week before her Chinese test and got a very good grade.", "options": ["studied", "studies", "has studied", "was going to study"], "answer": 0, "answerLabel": "A", "source": "111 會考｜單題｜第 19 題", "explanation": "before her Chinese test 是過去的事，用過去式 studied。", "explanationSource": "own", "section": "單題"}, {"id": 20, "question": "第 20 題　While reading this story, Brad saw the word “trolling” and didn’t know what it meant.\n\n“Josh turned off the screen and sat back. ‘Why are they trolling me like this?’ He didn’t understand. They wanted him to share what he thought about the show, and he did. And now look what he got. In the end, all they wanted was nice words.”\n\nHe found several meanings of the word in a dictionary. Which one should Brad choose?", "options": ["To celebrate in song.", "To make someone or something move around.", "To pull a fishing line through the water, often from a boat.", "To write something on the Internet to hurt someone or make them angry."], "answer": 3, "answerLabel": "D", "source": "111 會考｜單題｜第 20 題", "explanation": "文中 Josh 分享想法後被留言攻擊，所以 trolling 指在網路上寫東西傷人或激怒人。", "explanationSource": "own", "section": "單題"}, {"id": 21, "question": "【閱讀測驗 第 21–22 題】\nYou Drink Tea-Rock & We Send You to the USA\nThank You for Being with Us for Twenty Summers & Winters\nCut out the picture of the tea cup on a bottle of Tea-Rock tea, collect two of the pictures, and paste them on a postcard. On the postcard, be sure to write down your name, birthday, telephone number, e-mail address, and your favorite Tea-Rock tea. Send the postcard to “Tea-Rock 20,” PO Box 70265, Miao-Song (1/10/2010 ~ 3/15/2010). You have a chance to win 2 tickets from Taipei to New York!\n1st Prize: 2 tickets from Taipei to New York\n2nd Prize: A Sonia 42” TV\n3rd Prize: A Sonia MP4 Player\nAnd many more surprises for you!\nWant to know more? Go to http://www.tearock.com.tw/tearock20.aspx or call us at (07)777-7777.\n（address 地址）\n\n▶ 第 21 題　What does Tea-Rock celebrate?", "options": ["Their sales in 20 countries.", "The coming out of their 20th kind of tea.", "Their 20th year of business.", "The opening of their 20th store in the USA."], "answer": 2, "answerLabel": "C", "source": "111 會考｜閱讀測驗｜第 21 題", "explanation": "Thank You for Being with Us for Twenty Summers & Winters：感謝大家陪伴二十個寒暑，慶祝的是營業 20 週年。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap111-g21.png?v=20261120-7"}, {"id": 22, "question": "【閱讀測驗 第 21–22 題】\nYou Drink Tea-Rock & We Send You to the USA\nThank You for Being with Us for Twenty Summers & Winters\nCut out the picture of the tea cup on a bottle of Tea-Rock tea, collect two of the pictures, and paste them on a postcard. On the postcard, be sure to write down your name, birthday, telephone number, e-mail address, and your favorite Tea-Rock tea. Send the postcard to “Tea-Rock 20,” PO Box 70265, Miao-Song (1/10/2010 ~ 3/15/2010). You have a chance to win 2 tickets from Taipei to New York!\n1st Prize: 2 tickets from Taipei to New York\n2nd Prize: A Sonia 42” TV\n3rd Prize: A Sonia MP4 Player\nAnd many more surprises for you!\nWant to know more? Go to http://www.tearock.com.tw/tearock20.aspx or call us at (07)777-7777.\n（address 地址）\n\n▶ 第 22 題　Here is the postcard Jason is going to send to Tea-Rock 20.\nFrom: Jason Wang (04) 444-4444 / jason_best@goodmail.com.tw / My favorite Tea-Rock tea is black tea. ＋ 2 pictures of the tea cup\nWhat else does he need to put on the postcard before he sends it?", "options": ["His age.", "His address.", "His birthday.", "Another picture of the tea cup."], "answer": 2, "answerLabel": "C", "source": "111 會考｜閱讀測驗｜第 22 題", "explanation": "規定要寫姓名、生日、電話、e-mail 和最喜歡的茶，還要貼兩張杯子圖。明信片上已有姓名、電話、e-mail、最愛的茶和兩張圖，只缺生日。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap111-q22.png?v=20261120-7"}, {"id": 23, "question": "【閱讀測驗 第 23–24 題】\nBelow is an infographic.\nDangerously Sweet: Sugar　（1 teaspoon = 4 g of sugar）\nHow much sugar can we have a day?　Man: 9 teaspoons of sugar／Woman: 6 teaspoons of sugar／Child: 3 teaspoons of sugar\nHow much sugar do we have a day?　The UK: 17.1 teaspoons for each person／Taiwan: 17.75 teaspoons for each person／The US: 18.75 teaspoons for each person\nWhat does sugar do to our body?　remembering less well, looking older than our age, holes in our teeth, heart problems, liver problems, stomach problems, spending longer time in the bathroom, feeling worried or unhappy easily, getting fat, sleeping less well\nSugar that is hidden in foods and drinks（見下方圖表，每支湯匙＝1 茶匙糖）: ice cream (66 g), cheesecake (95 g), orange juice (300 ml), rice milk (400 ml), cola (330 ml), sports drink (590 ml), grape juice (400 ml)\n（infographic 資訊圖表）\n\n▶ 第 23 題　What can we learn about sugar from the infographic?", "options": ["There are 4 g of sugar in 66 g of ice cream.", "A woman can eat as much sugar a day as a man can.", "Taiwan eats more sugar for each person than the US does.", "400 ml of rice milk has less sugar than 400 ml of grape juice."], "answer": 3, "answerLabel": "D", "source": "111 會考｜閱讀測驗｜第 23 題", "explanation": "圖中米漿 400 ml 的湯匙數比葡萄汁 400 ml 少。冰淇淋有 3 匙（12 g）糖；女性 6 匙、男性 9 匙；台灣 17.75 匙少於美國 18.75 匙。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap111-g23.png?v=20261120-7"}, {"id": 24, "question": "【閱讀測驗 第 23–24 題】\nBelow is an infographic.\nDangerously Sweet: Sugar　（1 teaspoon = 4 g of sugar）\nHow much sugar can we have a day?　Man: 9 teaspoons of sugar／Woman: 6 teaspoons of sugar／Child: 3 teaspoons of sugar\nHow much sugar do we have a day?　The UK: 17.1 teaspoons for each person／Taiwan: 17.75 teaspoons for each person／The US: 18.75 teaspoons for each person\nWhat does sugar do to our body?　remembering less well, looking older than our age, holes in our teeth, heart problems, liver problems, stomach problems, spending longer time in the bathroom, feeling worried or unhappy easily, getting fat, sleeping less well\nSugar that is hidden in foods and drinks（見下方圖表，每支湯匙＝1 茶匙糖）: ice cream (66 g), cheesecake (95 g), orange juice (300 ml), rice milk (400 ml), cola (330 ml), sports drink (590 ml), grape juice (400 ml)\n（infographic 資訊圖表）\n\n▶ 第 24 題　What can be a reason why the list of “Sugar that is hidden in foods and drinks” is put in the infographic?", "options": ["To help us understand how sugar hurts our body.", "To show what kinds of foods and drinks are popular with children.", "To tell us that we often have more sugar than we can without knowing it.", "To let us know how much sugar is enough to make foods and drinks taste good."], "answer": 2, "answerLabel": "C", "source": "111 會考｜閱讀測驗｜第 24 題", "explanation": "「藏在食物飲料裡的糖」提醒我們，一瓶飲料可能就超過一天建議量，常在不知不覺中吃下過多的糖。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap111-g23.png?v=20261120-7"}, {"id": 25, "question": "【閱讀測驗 第 25–26 題】\nDarrell: Marina…Marina…MARINA!\nMarina: Oh, sorry. I didn’t hear you. I was thinking about my homework.\nDarrell: What’s it about?\nMarina: Well, I need to draw a future house for my art class, but I haven’t got any ideas. Maybe I should go to the library and look for something useful.\nDarrell: Or you can try Pinterest.\nMarina: Isn’t it a shopping app?\nDarrell: Not really. Many people share their works on Pinterest and tell you how they made them. I’m sure you can get some ideas there.\nMarina: Sounds like you use it often.\nDarrell: Yeah. Just last week I went there and found the A to Z of making chocolate cake—from choosing good chocolate to baking the cake to making sugar flowers on top.\nMarina: Really? I’ll check it out later. Thanks a lot.\n\n▶ 第 25 題　Why did Darrell tell Marina to go to Pinterest?", "options": ["To find some examples for her homework.", "To shop for things that are needed for art classes.", "To meet new friends who have the same interests.", "To share her works and tell people how they are made."], "answer": 0, "answerLabel": "A", "source": "111 會考｜閱讀測驗｜第 25 題", "explanation": "Marina 美術作業沒有靈感，Darrell 說 Pinterest 上有很多人分享作品，可以找到點子。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 26, "question": "【閱讀測驗 第 25–26 題】\nDarrell: Marina…Marina…MARINA!\nMarina: Oh, sorry. I didn’t hear you. I was thinking about my homework.\nDarrell: What’s it about?\nMarina: Well, I need to draw a future house for my art class, but I haven’t got any ideas. Maybe I should go to the library and look for something useful.\nDarrell: Or you can try Pinterest.\nMarina: Isn’t it a shopping app?\nDarrell: Not really. Many people share their works on Pinterest and tell you how they made them. I’m sure you can get some ideas there.\nMarina: Sounds like you use it often.\nDarrell: Yeah. Just last week I went there and found the A to Z of making chocolate cake—from choosing good chocolate to baking the cake to making sugar flowers on top.\nMarina: Really? I’ll check it out later. Thanks a lot.\n\n▶ 第 26 題　What does it mean when you learn something from A to Z?", "options": ["You can learn it at any time.", "You learn it in a baking class.", "You learn everything about it.", "You spend all your life learning it."], "answer": 2, "answerLabel": "C", "source": "111 會考｜閱讀測驗｜第 26 題", "explanation": "從挑選巧克力、烤蛋糕到做糖花，A to Z 指「從頭到尾、全部」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 27, "question": "【閱讀測驗 第 27–29 題】\nTabata training is a very popular way of exercising these days. It doesn’t take much time or space, and it burns calories faster than other ways of exercising. The idea of Tabata training is simple: exercise for 20 seconds, rest for 10 seconds, and then repeat (at least eight times). The moves for the 20-second exercise are not difficult to learn. Jumping jacks, high knees, squats, and planks are some of the most common moves. You can decide yourself what moves to do in your Tabata training. For example, you can do more leg exercises if you want strong legs.\nOne great thing about Tabata training is that your body will keep burning calories for at least an hour after 4 minutes of Tabata training. But to have this wonderful “afterburn,” you need to exercise really hard during each 20 seconds. If you seldom exercise or have heart problems, this exercise may not be good for you. But for people who enjoy exercising but are too busy to go to the gym, Tabata training might just be the answer.\n（calorie 卡路里(熱量單位)）\n\n▶ 第 27 題　Which idea is talked about in the first paragraph of the reading?", "options": ["How you should do Tabata training.", "What is the best time for Tabata training.", "Who first had the idea of Tabata training.", "How often you should do Tabata training."], "answer": 0, "answerLabel": "A", "source": "111 會考｜閱讀測驗｜第 27 題", "explanation": "第一段說明做法：運動 20 秒、休息 10 秒，重複至少八次，並介紹常見動作。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 28, "question": "【閱讀測驗 第 27–29 題】\nTabata training is a very popular way of exercising these days. It doesn’t take much time or space, and it burns calories faster than other ways of exercising. The idea of Tabata training is simple: exercise for 20 seconds, rest for 10 seconds, and then repeat (at least eight times). The moves for the 20-second exercise are not difficult to learn. Jumping jacks, high knees, squats, and planks are some of the most common moves. You can decide yourself what moves to do in your Tabata training. For example, you can do more leg exercises if you want strong legs.\nOne great thing about Tabata training is that your body will keep burning calories for at least an hour after 4 minutes of Tabata training. But to have this wonderful “afterb  the afterburn."], "answer": 1, "answerLabel": "B", "source": "111 會考｜閱讀測驗｜第 29 題", "explanation": "You can decide yourself what moves to do。動作不難學、不需要大空間，每 20 秒之間可休息 10 秒。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 30, "question": "【閱讀測驗 第 30–32 題】\nThe problem of long working hours is a real headache in our country. It kills many people every year (see Figure 1), and many companies are trying to change that. They have at least one “No Overtime Day” in a week, and it is often Wednesday. On “No Overtime Day,” workers are asked to leave their offices before 8 p.m. At 8 p.m., companies play the song “There’s Always Tomorrow” and turn off all the lights.\nHowever, after the workers walk out of their offices, they don’t go home. Some go back later, turn on their table lamps, and keep working, and others find somewhere else to work until very late at night. Restaurants and coffee shops are busier on Wednesday evenings, and they have started selling drinks and meals for these workers.\nBut why do these people keep working? A study shows that workers who work more hours often have a bigger chance to get paid more and rise higher in their companies. This is true for both men and women (see Figure 2). Working long hours has become a way to show that people are hard-working. Clearly, this must be changed before the problem gets any worse.\n（見下方 Figure 1、Figure 2；average 平均）\n\n▶ 第 30 題　There are four important points in the report:\na. What “No Overtime Day” is\nb. Why “No Overtime Day” fails\nc. Why there is “No Overtime Day” in the country\nd. How workers deal with “No Overtime Day”\nHow are they ordered in the report?", "options": ["a → c → d → b", "a → d → c → b", "c → a → b → d", "c → a → d → b"], "answer": 3, "answerLabel": "D", "source": "111 會考｜閱讀測驗｜第 30 題", "explanation": "先說工時過長的問題（為何有不加班日，c），再說明不加班日的做法（a），接著是員工如何應對（d），最後說明失敗的原因（b）。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap111-g30.png?v=20261120-7"}, {"id": 31, "question": "【 leave their offices before 8 p.m. At 8 p.m., companies play the song “There’s Always Tomorrow” and turn off all the lights.\nHowever, after the workers walk out of their offices, they don’t go home. Some go back later, turn on their table lamps, and keep working, and others find somewhere else to work until very late at night. Restaurants and coffee shops are busier on Wednesday evenings, and they have started selling drinks and meals for these workers.\nBut why do these people keep working? A study shows that workers who work more hours often have a bigger chance to get paid more and rise higher in their companies. This is true for both men and women (see Figure 2). Working long hours has become a way to show that people are hard-working. Clearly, this must be changed before the problem gets any worse.\n（見下方 Figure 1、Figure 2；average 平均）\n\n▶ 第 32 題　What can we learn from Figure 1 and Figure 2?", "options": ["Long working hours killed more women than men in 2014.", "Long working hours kills more and more workers every year.", "Men usually have a bigger chance to get paid more and rise higher when they work the same hours as women.", "Men and women have almost the same chance to get paid more and rise higher when they work 2,200 hours."], "answer": 3, "answerLabel": "D", "source": "111 會考｜閱讀測驗｜第 32 題", "explanation": "Figure 2 中年工時 2,200 小時時，男女的機率幾乎相同（約 13%）。Figure 1 沒有分男女，死亡人數也有升有降；大多數工時下女性的機率較高。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap111-g30.png?v=20261120-7"}, {"id": 33, "question": "【閱讀測驗 第 33–36 題】\nhttp://www.aab.com/news/language-and-power-756315\nLanguage and Power: Cameroon’s Story\nBy Elisa Grant, 2 Oct 2017\nIn the modern world, being able to speak English is often a way to get power. However, this is not true for English speakers in Cameroon. To know why things are different in this African country, we need to go back one hundred years.\nIn 1919, Kamerun (the name of Cameroon at the time) was cut into two parts: one belonged to France, and the other belonged to the UK. In 1960, the French Cameroon became the Republic of Cameroun, and the UK’s part joined it in 1961. The new country changed its name to the Federal Republic of Cameroon. Although both French and English are Cameroon’s official languages, only around 20% of its people speak English. Also, the government has been in French speakers’ hands since the two parts became one country.\nFor a long time, Cameroon’s English speakers have felt they are not welcome in their own country. For example, it is very difficult for them to find jobs in the government, and they are often asked to speak French in business and at official events. They have become more resentful at the government and decided to fight for themselves. Since last year, the English speakers have tried to build their own country. Yesterday, they said in a public meeting that they were not part of Cameroon anymore. They are now a new country, “Ambazonia.” When the police tried to stop the meeting, at least eight people were killed.\n（official 官方的　government 政府）\n\n▶ 第 33 題　Which map is most likely the map of Cameroon in 1962?", "options": ["(A)", "(B)", "(C)", "(D)"], "answer": 3, "answerLabel": "D", "source": "111 會考｜閱讀測驗｜第 33 題", "explanation": "英國管轄的部分在 1961 年併入，新國家改名為 Federal Republic of Cameroon，所以 1962 年是 D。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap111-q33.png?v=20261120-7"}, {"id": 34, "question": "【閱讀測驗 第 33–36 題】\nhttp://www.aab.com/news/language-and-power-756315\nLanguage and Power: Cameroon’s Story\nBy Elisa Grant, 2 Oct 2017\nIn the modern world, being able to speak English is often a way to get power. However, this is not true for English speakers in Cameroon. To know why things are different in this African country, we need to go back one hundred years.\nIn 1919, Kamerun (the name of Cameroon at the time) was cut into two parts: one belonged to France, and the other belonged to the UK. In 1960, the French Cameroon became the Rep
