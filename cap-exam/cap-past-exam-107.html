<script>window.QUIZ_CONFIG={"title": "107 年國中會考英語｜單題＋克漏字＋閱讀測驗", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. The girl is ______ the clothes.", "options": ["making", "packing", "showing", "washing"], "answer": 1, "answerLabel": "B", "source": "107 會考｜單題｜第 1 題", "explanation": "圖中女孩正把衣服放進箱子裡，是在「打包」packing。", "explanationSource": "own", "section": "單題", "image": "assets/cap107-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　The ______ is so strong today that my hair keeps blowing in the air.", "options": ["rain", "snow", "sun", "wind"], "answer": 3, "answerLabel": "D", "source": "107 會考｜單題｜第 2 題", "explanation": "頭髮一直被吹起來，表示「風」很大：The wind is strong.", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　When the baby cried, Mr. Wu ______ in the kitchen and did not hear it.", "options": ["cooked", "was cooking", "has cooked", "is going to cook"], "answer": 1, "answerLabel": "B", "source": "107 會考｜單題｜第 3 題", "explanation": "嬰兒哭的「當時」，吳先生正在廚房煮飯：過去進行式 was cooking。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　I don’t have any money with me because I ______ my wallet this morning.", "options": ["had lost", "would lose", "lost", "was losing"], "answer": 2, "answerLabel": "C", "source": "107 會考｜單題｜第 4 題", "explanation": "this morning 是過去的時間，錢包是今天早上「弄丟」的：過去式 lost。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　You need not only good luck but also hard work to become a ______ baseball player.", "options": ["young", "successful", "happy", "friendly"], "answer": 1, "answerLabel": "B", "source": "107 會考｜單題｜第 5 題", "explanation": "需要好運和努力才能成為「成功的」棒球選手：successful。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　The woman who lives next door to Ken is a ______ to him. They have never met and he doesn’t even know her name.", "options": ["daughter", "friend", "stranger", "teacher"], "answer": 2, "answerLabel": "C", "source": "107 會考｜單題｜第 6 題", "explanation": "兩人從沒見過面、連名字都不知道，她對他而言是「陌生人」stranger。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　With the new bus line, it is much more ______ for Fanny to go to school. It saves her a lot of time now.", "options": ["useful", "possible", "interesting", "convenient"], "answer": 3, "answerLabel": "D", "source": "107 會考｜單題｜第 7 題", "explanation": "新公車路線幫她省很多時間，上學更「方便」：convenient。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Dad: Have you brushed your teeth yet?\nAnn: No, but I ______ before I go to bed.", "options": ["haven’t", "have", "won’t", "will"], "answer": 3, "answerLabel": "D", "source": "107 會考｜單題｜第 8 題", "explanation": "Ann 說還沒刷牙，但睡前「會」刷：but I will (brush my teeth)。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Alice: Do you know ______ Grandma is going to visit us?\nWilly: It’s next week. She told me on the phone. And we’ll take her to the national park.", "options": ["where", "when", "whether", "why"], "answer": 1, "answerLabel": "B", "source": "107 會考｜單題｜第 9 題", "explanation": "Willy 回答 It’s next week，所以問的是「什麼時候」：when。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　It took the police lots of time ______ who entered Liu’s house and killed her one year ago.", "options": ["and found out", "find out", "finding out", "to find out"], "answer": 3, "answerLabel": "D", "source": "107 會考｜單題｜第 10 題", "explanation": "It takes + 人 + 時間 + to V：花了警方很多時間「去查出」…：to find out。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　Many famous people visit this restaurant. Popular singers like A-mei and Jay Chou ______ here with their friends.", "options": ["to be often seen", "often seen", "are often seen", "and are often seen"], "answer": 2, "answerLabel": "C", "source": "107 會考｜單題｜第 11 題", "explanation": "歌手「被看見」常在這裡出現，用被動語態：are often seen。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　The factory has been throwing trash into the river for years. Now ______ must be taken to stop this.", "options": ["action", "chances", "exercise", "notes"], "answer": 0, "answerLabel": "A", "source": "107 會考｜單題｜第 12 題", "explanation": "要阻止工廠往河裡丟垃圾，必須「採取行動」：take action。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　The beach party tonight ______ the end of our summer vacation. Tomorrow we are all going back home and getting ready for school.", "options": ["changes", "marks", "passes", "saves"], "answer": 1, "answerLabel": "B", "source": "107 會考｜單題｜第 13 題", "explanation": "今晚的海灘派對「標誌著」暑假結束：mark（標示、象徵）。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　Anyone who reads Loren’s business plan will quickly see some serious problems in it, or ______ feel something is not right.", "options": ["at least", "even", "in fact", "still"], "answer": 0, "answerLabel": "A", "source": "107 會考｜單題｜第 14 題", "explanation": "大家很快會看出問題，「至少」也會覺得不對勁：at least。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　I’ve wanted to read The Diary of a Young Girl for months, ______ today I finally borrowed the book from the library.", "options": ["and", "since", "so", "until"], "answer": 0, "answerLabel": "A", "source": "107 會考｜單題｜第 15 題", "explanation": "想讀這本書好幾個月，「而」今天終於借到了；表示順接用 and。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "【克漏字 第 16–18 題】\nRobert likes to take a walk in the park after work. One day when he was walking in the park, he heard a woman calling his name. He stopped to look around, but didn’t see anything __16__. Shortly after Robert saw it, it was gone.\nThough Robert felt a little strange, he did not think about it too much and sat down for a rest on a bench in the park. Then he noticed the snake he had just seen __17__. Robert was too afraid to move away from the bench. Right at this moment, a woman behind him shouted, “Come here, Robert. You can’t stay on the bench like that. __18__.”\nIn surprise, Robert turned around and said to the woman, “Excuse me, but that’s not a very nice thing to say, and in fact some people say I’m handsome.”\n“I’m not talking to you,” said the woman. “I’m telling Robert, my pet snake, to get down from the bench, not you.”\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["like a snake", "that could move", "except a little snake", "that could make noise"], "answer": 2, "answerLabel": "C", "source": "107 會考｜克漏字｜第 16 題", "explanation": "後句說 Shortly after Robert saw it, it was gone，且下段提到 the snake he had just seen，所以他「除了一條小蛇」什麼都沒看到。", "explanationSource": "own", "section": "克漏字"}, {"id": 17, "question": "【克漏字 第 16–18 題】\nRobert likes to take a walk in the park after work. One day when he was walking in the park, he heard a woman calling his name. He stopped to look around, but didn’t see anything __16__. Shortly after Robert saw it, it was gone.\nThough Robert felt a little strange, he did not think about it too much and sat down for a rest on a bench in the park. Then he noticed the snake he had just seen __17__. Robert was too afraid to move away from the bench. Right at this moment, a woman behind him shouted, “Come here, Robert. You can’t stay on the bench like that. __18__.”\nIn surprise, Robert turned around and said to the woman, “Excuse me, but that’s not a very nice thing to say, and in fact some people say I’m handsome.”\n“I’m not talking to you,” said the woman. “I’m telling Robert, my pet snake, to get down from the bench, not you.”\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["climbing up the bench", "running after a woman", "stopping beside his feet", "falling down from a tree"], "answer": 0, "answerLabel": "A", "source": "107 會考｜克漏字｜第 17 題", "explanation": "他嚇得不敢離開長椅，最後女子叫蛇「從長椅上下來」，可知蛇正「爬上長椅」。", "explanationSource": "own", "section": "克漏字"}, {"id": 18, "question": "【克漏字 第 16–18 題】\nRobert likes to take a walk in the park after work. One day when he was walking in the park, he heard a woman calling his name. He stopped to look around, but didn’t see anything __16__. Shortly after Robert saw it, it was gone.\nThough Robert felt a little strange, he did not think about it too much and sat down for a rest on a bench in the park. Then he noticed the snake he had just seen __17__. Robert was too afraid to move away from the bench. Right at this moment, a woman behind him shouted, “Come here, Robert. You can’t stay on the bench like that. __18__.”\nIn surprise, Robert turned around and said to the woman, “Excuse me, but that’s not a very nice thing to say, and in fact some people say I’m handsome.”\n“I’m not talking to you,” said the woman. “I’m telling Robert, my pet snake, to get down from the bench, not you.”\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["The bench is broken", "The seat has been taken", "People will be scared by you", "The paint of the bench is still wet"], "answer": 2, "answerLabel": "C", "source": "107 會考｜克漏字｜第 18 題", "explanation": "Robert 回答「這話不太好聽，有人說我很帥」，表示他以為女子說「別人會被你嚇到」。", "explanationSource": "own", "section": "克漏字"}, {"id": 19, "question": "【克漏字 第 19–21 題】\nIf you cannot live without your car, Zurich might be the last city you would like to visit. In Zurich, people are welcome, but cars are not! Over the past 20 years, this city has used smart ways __19__. One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n__20__, the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there are fewer cars in the city. Now, you may wonder __21__. The answer is simple: The city wants to make more space for its people.\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["to make traffic lighter", "to invite people to visit", "to make itself a famous city", "to build more parking spaces"], "answer": 0, "answerLabel": "A", "source": "107 會考｜克漏字｜第 19 題", "explanation": "後面介紹限制停車位、控管進城車輛等方法，目的是「減輕交通量」。", "explanationSource": "own", "section": "克漏字"}, {"id": 20, "question": "【克漏字 第 19–21 題】\nIf you cannot live without your car, Zurich might be the last city you would like to visit. In Zurich, people are welcome, but cars are not! Over the past 20 years, this city has used smart ways __19__. One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n__20__, the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there are fewer cars in the city. Now, you may wonder __21__. The answer is simple: The city wants to make more space for its people.\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["This way", "However", "For example", "Also"], "answer": 3, "answerLabel": "D", "source": "107 會考｜克漏字｜第 20 題", "explanation": "前段是第一個方法（One is...），這裡介紹「另一個」方法，用 Also（此外）。", "explanationSource": "own", "section": "克漏字"}, {"id": 21, "question": "【克漏字 第 19–21 題】\nIf you cannot live without your car, Zurich might be the last city you would like to visit. In Zurich, people are welcome, but cars are not! Over the past 20 years, this city has used smart ways __19__. One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n__20__, the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there are fewer cars in the city. Now, you may wonder __21__. The answer is simple: The city wants to make more space for its people.\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["why Zurich is doing this", "what all this has cost Zurich", "if Zurich should try other ways", "if Zurich can deal with angry drivers"], "answer": 0, "answerLabel": "A", "source": "107 會考｜克漏字｜第 21 題", "explanation": "後句 The answer is simple: 要為市民多留空間，回答的是「為什麼這樣做」。", "explanationSource": "own", "section": "克漏字"}, {"id": 22, "question": "【閱讀測驗 第 22–24 題】\nEdward's Travel Tips\nWhat kind of place do you usually choose to stay for the night during a trip? Expensive hotels that may make you feel like you don’t get what you pay for? Or cheap hostels that put you and five other strangers in the same bedroom? If both choices sound terrible to you, here’s something new: holiday apartments.\nIn a holiday apartment, you have more space than what a hotel room can give you. Everything in the apartment is at your disposal. The living room, the kitchen, the study, and, of course, the bedrooms are all for your own use. Some apartments even have a lovely garden or a game room. You’ll feel at home in the holiday apartment. The best thing is, a holiday apartment is not expensive. The price for a holiday apartment is for two people, and the apartment is often cheaper than a hotel room for two. You only need to pay a little more for a third or fourth person. If you travel with friends or your family, a holiday apartment will be your best choice!\n（hostel (提供廉價食宿的)旅舍）\n\n▶ 第 22 題　What is the reading mostly about?", "options": ["Where to find a nice holiday apartment.", "How to choose a nice holiday apartment.", "Why one should choose a holiday apartment.", "How one can change their house into a holiday apartment."], "answer": 2, "answerLabel": "C", "source": "107 會考｜閱讀測驗｜第 22 題", "explanation": "文章比較飯店和旅舍的缺點，再列出度假公寓空間大、設備齊全、價格便宜等優點，重點是「為什麼該選度假公寓」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 23, "question": "【閱讀測驗 第 22–24 題】\nEdward's Travel Tips\nWhat kind of place do you usually choose to stay for the night during a trip? Expensive hotels that may make you feel like you don’t get what you pay for? Or cheap hostels that put you and five other strangers in the same bedroom? If both choices sound terrible to you, here’s something new: holiday apartments.\nIn a holiday apartment, you have more space than what a hotel room can give you. Everything in the apartment is at your disposal. The living room, the kitchen, the study, and, of course, the bedrooms are all for your own use. Some apartments even have a lovely garden or a game room. You’ll feel at home in the holiday apartment. The best thing is, a holiday apartment is not expensive. The price for a holiday apartment is for two people, and the apartment is often cheaper than a hotel room for two. You only need to pay a little more for a third or fourth person. If you travel with friends or your family, a holiday apartment will be your best choice!\n（hostel (提供廉價食宿的)旅舍）\n\n▶ 第 23 題　From the reading, what can we learn about holiday apartments?", "options": ["They are good for people who like to take one-day trips.", "They are good for people who travel in a group of three or more.", "They are good for people who want to make new friends when traveling.", "They are good for people who like to spend their holidays in the country."], "answer": 1, "answerLabel": "B", "source": "107 會考｜閱讀測驗｜第 23 題", "explanation": "價格以兩人計算，第三、四人只要多付一點，和朋友或家人同行最划算，所以適合三人以上一起旅行。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 24, "question": "【閱讀測驗 第 22–24 題】\nEdward's Travel Tips\nWhat kind of place do you usually choose to stay for the night during a trip? Expensive hotels that may make you feel like you don’t get what you pay for? Or cheap hostels that put you and five other strangers in the same bedroom? If both choices sound terrible to you, here’s something new: holiday apartments.\nIn a holiday apartment, you have more space than what a hotel room can give you. Everything in the apartment is at your disposal. The living room, the kitchen, the study, and, of course, the bedrooms are all for your own use. Some apartments even have a lovely garden or a game room. You’ll feel at home in the holiday apartment. The best thing is, a holiday apartment is not expensive. The price for a holiday apartment is for two people, and the apartment is often cheaper than a hotel room for two. You only need to pay a little more for a third or fourth person. If you travel with friends or your family, a holiday apartment will be your best choice!\n（hostel (提供廉價食宿的)旅舍）\n\n▶ 第 24 題　What does it mean to say that something is at your disposal?", "options": ["You are free to use it.", "You can find it everywhere.", "You know everything about it.", "You can buy it at a lower price."], "answer": 0, "answerLabel": "A", "source": "107 會考｜閱讀測驗｜第 24 題", "explanation": "後句說客廳、廚房、書房、臥室 are all for your own use，at your disposal＝任你使用。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 25, "question": "【閱讀測驗 第 25–26 題】\nSHARP WEAR: A T-shirt like no other!\nFirst hirts each time.", "You can choose from sixteen colors for both the T-shirt and the pocket.", "Some of the T-shirts have pictures on both the front side and the back side.", "T-shirts in the wrong sizes cannot be sent back if they have pictures or pockets on them."], "answer": 1, "answerLabel": "B", "source": "107 會考｜閱讀測驗｜第 26 題", "explanation": "第 2 步 T 恤有 16 色，第 5 步口袋也可以 Choose from the 16 colors AGAIN。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap107-g25.png?v=20261120-7"}, {"id": 27, "question": "【閱讀測驗 第 27–28 題】\nThe sky is turning bright and clear.\nThe earth is wearing red and green.\nWinter is gone; spring has come.\nThe air smells fresh and sweet.\nThe summer heat is not yet here;\nA little fox comes out to play.\nA bird is busy in a tree\nWaking a daisy from her sleep.\nLittle daisy, little daisy,\nPeople call the flower the “day’s eye.”\nWhen she opens her eye,\nThe springtime brings us cheer.\n（poem 詩）\n\n▶ 第 27 題　Which season is this poem about?", "options": ["Spring.", "Summer.", "Autumn.", "Winter."], "answer": 0, "answerLabel": "A", "source": "107 會考｜閱讀測驗｜第 27 題", "explanation": "Winter is gone; spring has come.，夏天的炎熱還沒來，最後一句也提到 springtime，描寫的是春天。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 28, "question": "【閱讀測驗 第 27–28 題】\nThe sky is turning bright and clear.\nThe earth is wearing red and green.\nWinter is gone; spring has come.\nThe air smells fresh and sweet.\nThe summer heat is not yet here;\nA little fox comes out to play.\nA bird is busy in a tree\nWaking a daisy from her sleep.\nLittle daisy, little daisy,\nPeople call the flower the “day’s eye.”\nWhen she opens her eye,\nThe springtime brings us cheer.\n（poem 詩）\n\n▶ 第 28 題　What is a daisy?", "options": ["A body part.", "A kind of bird.", "A kind of flower.", "A kind of smell."], "answer": 2, "answerLabel": "C", "source": "107 會考｜閱讀測驗｜第 28 題", "explanation": "People call the flower the “day’s eye.”：daisy 是一種花（雛菊）。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 29, "question": "【閱讀測驗 第 29–31 題】\nWhen we get wet, we need a towel to get ourselves dry. When a dog gets wet, all it needs is to shake its body. A study in 2010 showed that a wet dog can throw off half the water on its body by shaking for less than a second. In fact, this common act of dogs works better than a washing machine.\nThe study found that animal shaking begins with the head and ends with the tail. During a shake, the animal’s head, body and skin all move. Smaller animals must shake faster than bigger animals to get water off. For example, in one second, a rat can shake 18 times, a dog 6 times, and a bear 4 times. Bigger animals can get their bodies dry with fewer shakes.\nFor animals, shaking is not just about getting themselves dry. It is also about saving their lives. Being wet makes animals heavier, and that makes it harder to run. In the animal world, how fast an animal can run often decides whether it will live or not. Maybe that’s why the “wet-dog shake” has become a common habit of many animals.\n（skin 皮膚）\n\n▶ 第 29 題　What does the reading say about shaking?", "options": ["Different animals’ shaking begins with different body parts.", "Shaking is a way that animals use to make other animals scared.", "Animals that are not kept as pets do the shaking better than those that are.", "Shaking themselves dry may help animals run faster in dangerous moments."], "answer": 3, "answerLabel": "D", "source": "107 會考｜閱讀測驗｜第 29 題", "explanation": "身體濕了會變重、跑不快；甩乾身體能救命，因為跑多快常決定能不能活下來。甩動都是從頭開始到尾巴結束。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 30, "question": "【閱讀測驗 第 29–31 題】\nWhen we get wet, we need a towel to get ourselves dry. When a dog gets wet, all it needs is to shake its body. A study in 2010 showed that a wet dog can throw off half the water on its body by shaking for less than a second. In fact, this common act of dogs works better than a washing machine.\nThe study found that animal shaking begins with the head and ends with the tail. During a shake, the animal’s head, body and skin all move. Smaller animals must shake faster than bigger animals to get water off. For example, in one second, a rat can shake 18 times, a dog 6 times, and a bear 4 times. Bigger animals can get their bodies dry with fewer shakes.\nFor animals, shaking is not just about getting themselves dry. It is also about saving their lives. Being wet makes animals heavier, and that makes it harder to run. In the animal world, how fast an animal can run often decides whether it will live or not. Maybe that’s why the “wet-dog shake” has become a common habit of many animals.\n（skin 皮膚）\n\n▶ 第 30 題　What can we learn from the reading?", "options": ["The animal’s tail can help it run more quickly and easily.", "Some animals shake more than they need to get water off.", "The idea of washing machines came from the shaking of dogs.", "Larger animals get themselves drier at each shake than smaller animals."], "answer": 3, "answerLabel": "D", "source": "107 會考｜閱讀測驗｜第 30 題", "explanation": "Bigger animals can get their bodies dry with fewer shakes.：大型動物甩一次就能甩掉較多水。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 31, "question": "【閱讀測驗 第 29–31 題】\nWhen we get wet, we need a towel to get ourselves dry. When a dog gets wet, all it needs is to shake its body. A study in 2010 showed that a wet dog can throw off half the water on its body by shaking for less than a second. In fact, this common act of dogs works better than a washing machine.\nThe study found that animal shaking begins with the head and ends with the tail. During a shake, the animal’s head, body and skin all move. Smaller animals must shake faster than bigger animals to get water off. For example, in one second, a rat can shake 18 times, a dog 6 times, and a bear 4 times. Bigger animals can get their bodies dry with fewer shakes.\nFor animals, shaking is not just about getting themselves dry. It is also about saving their lives. Being wet makes animals heavier, and that makes it harder to run. In the animal world, how fast an animal can run often decides whether it will live or not. Maybe that’s why the “wet-dog shake” has become a common habit of many animals.\n（skin 皮膚）\n\n▶ 第 31 題　The four pictures show how fast tigers, cats and mice can shake. From the reading, which picture is most likely correct?", "options": ["(A)", "(B)", "(C)", "(D)"], "answer": 1, "answerLabel": "B", "source": "107 會考｜閱讀測驗｜第 31 題", "explanation": "動物越小，每秒甩動次數越多（老鼠 18 次、狗 6 次、熊 4 次），所以老鼠最多、貓次之、老虎最少，符合 B。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap107-q31.png?v=20261120-7"}, {"id": 32, "question": "【閱讀測驗 第 32–34 題】\nJosh: Do you know about “pay it forward coffee” at Flora Café?\nEric: You mean you pay for a cup of coffee for someone poor to have it later?\nJosh: Yeah. A cup of coffee is not much, but on cold winter days like today, it might warm them up a little. And maybe their hearts too.\nEric: But will Flora Café really give this cup of coffee to someone later?\nJosh: Come on. I’ve known the shopkeeper well. He’s an honest man. He’s got a blackboard in the shop that says how many cups are paid for and how many have been given out.\nEric: But how will they know who to give? Anyone can ask for it, even if they’re not poor.\nJosh: True, but then I guess they’ll just have to believe in people.\nEric: Perhaps. But will poor people go and ask for a free coffee? Won’t they worry about losing face?\nJosh: Why do you always say things like that?\nEric: Well, it may happen.\nJosh: Yeah, I know, but I still think it’s a good thing to do, and it gets people to care about others.\n\n▶ 第 32 題　What does things like that mean?", "options": ["Problems about the free coffee plan.", "Trouble for people who go to Flora Café.", "Ways to make the free coffee plan successful.", "Good things free coffee will bring to Flora Café."], "answer": 0, "answerLabel": "A", "source": "107 會考｜閱讀測驗｜第 32 題", "explanation": "Eric 一直提出質疑：店家會不會真的送、怎麼知道誰窮、窮人會不會怕丟臉，things like that 指這個計畫可能出現的「問題」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 33, "question": "【閱讀測驗 第 32–34 題】\nJosh: Do you know about “pay it forward coffee” at Flora Café?\nEric: You mean you pay for a cup of coffee for someone poor to have it later?\nJosh: Yeah. A cup of coffee is not much, but on cold winter days like today, it might warm them up a little. And maybe their hearts too.\nEric: But will Flora Café really give this cup of coffee to someone later?\nJosh: Come on. I’ve known the shopkeeper well. He’s an honest man. He’s got a blackboard in the shop that says how many cups are paid for and how many have been given out.\nEric: But how will they know who to give? Anyone can ask for it, even if they’re not poor.\nJosh: True, but then I guess they’ll just have to believe in people.\nEric: Perhaps. But will poor people go and ask for a free coffee? Won’t they worry about losing face?\nJosh: Why do you always say things like that?\nEric: Well, it may happen.\nJosh: Yeah, I know, but I still think it’s a good thing to do, and it gets people to care about others.\n\n▶ 第 33 題　What can we learn about Josh and Eric?", "options": ["Josh was not able to change Eric’s mind about free coffee.", "Eric has more hope for the free coffee plan than Josh does.", "They found a way to make people feel OK to take free coffee.", "They do not know whether Flora Café will do business honestly."], "answer": 0, "answerLabel": "A", "source": "107 會考｜閱讀測驗｜第 33 題", "explanation": "到最後 Eric 仍說 it may happen，Josh 也只能說自己還是覺得這是好事，Josh 沒能改變 Eric 的想法。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 34, "question": "【閱讀測驗 第 32–34 題】\nJosh: Do you know about “pay it forward coffee” at Flora Café?\nEric: You mean you pay for a cup of coffee for someone poor to have it later?\nJosh: Yeah. A cup of coffee is not much, but on cold winter days like today, it might warm them up a little. And maybe their hearts too.\nEric: But will Flora Café really give this cup of coffee to someone later?\nJosh: Come on. I’ve known the shopkeeper well. He’s an honest man. He’s got a blackboard in the shop that says how many cups are paid for and how many have been given out.\nEric: But how will they know who to give? Anyone can ask for it, even if they’re not poor.\nJosh: True, but then I guess they’ll just have to believe in people.\nEric: Perhaps. But will poor people go and ask for a free coffee? Won’t they worry about losing face?\nJosh: Why do you always say things like that?\nEric: Well, it may happen.\nJosh: Yeah, I know, but I still think it’s a good thing to do, and it gets people to care about others.\n\n▶ 第 34 題　What do we know about Flora Café from the dialogue?", "options": ["It has a way to know who really is poor.", "Free coffee has brought it more business.", "People pay less for free coffee than other coffee.", "Its blackboard shows if there are free coffees to be taken."], "answer": 3, "answerLabel": "D", "source": "107 會考｜閱讀測驗｜第 34 題", "explanation": "店裡的黑板寫著已付款幾杯、已送出幾杯，看黑板就知道還有沒有待用咖啡。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 35, "question": "【閱讀測驗 第 35–37 題】\nOver the years, the number of whales has dropped sharply. From 1946 to 1986, about 340,000 whales were killed. People worry that children in the future can only see whales in pictures. They believe all kinds of whaling (whale hunting) should be stopped before it’s too late.\nSome people are trying to stop whaling all over the world. But they fail to notice one fact: Whaling was going on for a long time before the number of whales went down and became a problem.\nWhaling started as early as 1,500 years ago. This was how tribespeople fed their families. They hunted whales for meat because almost nothing could grow on their land. They also made whale fat into oil and used it to make candles or oil lamps. Over the years, whaling became their way of living, and even part of who they are.\nTribe whaling is not the thing we should worry about. Of all the whales that were killed over the past forty years, only 10% were hunted by tribespeople. The other 90% died at the hands of the money-making whaling business. When we try to stop all kinds of whaling, we should think what we are asking tribespeople to give up and whether this is the best answer to the problem of whaling.\n（tribe 部落　fat 脂肪）\n\n▶ 第 35 題　Below are the writer’s points in the reading:\na. Whether we should stop tribespeople whaling\nb. The problem of whaling\nc. Whaling as a way of life\nIn what order does the writer talk about his points?", "options": ["a → c → b", "b → c → a", "c → a → b", "c → b → a"], "answer": 1, "answerLabel": "B", "source": "107 會考｜閱讀測驗｜第 35 題", "explanation": "先談鯨魚數量銳減的捕鯨問題（b），再談捕鯨是部落的生活方式（c），最後討論是否該禁止部落捕鯨（a）。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 36, "question": "【閱讀測驗 第 35–37 題】\nOver the years, the number of whales has dropped sharply. From 1946 to 1986, about 340,000 whales were killed. People worry that children in the future can only see whales in pictures. They believe all kinds of whaling (whale hunting) should be stopped before it’s too late.\nSome people are trying to stop whaling all over the world. But they fail to notice one fact: Whaling was going on for a long time before the number of whales went down and became a problem.\nWhaling started as early as 1,500 years ago. This was how tribespeople fed their families. They hunted whales for meat because almost nothing could grow on their land. They also made whale fat into oil and used it to make candles or oil lamps. Over the years, whaling became their way of living, and even part of who they are.\nTribe whaling is not the thing we should worry about. Of all the whales that were killed over the past forty years, only 10% were hunted by tribespeople. The other 90% died at the hands of the money-making whaling business. When we try to stop all kinds of whaling, we should think what we are asking tribespeople to give up and whether this is the best answer to ople’s lives in different ways."], "answer": 3, "answerLabel": "D", "source": "107 會考｜閱讀測驗｜第 37 題", "explanation": "部落靠鯨肉養家，也把鯨脂做成油來做蠟燭和油燈，捕鯨在多方面幫助他們生活。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 38, "question": "【閱讀測驗 第 38–41 題】\nNBN NEWS　Ryan Kim　7/15/2013\nGuesses about Carolyn Cole have been flying around since last week, and now things have taken a new turn.\nLast week Carolyn Cole won the Inscriber Prize, the country’s biggest book prize, with her book Paper Soldier. Cole herself did not show up for the prize. It was not only the first time in history that a first-time writer won the prize, but also the first time that the winner did not appear.\nNow here comes another “first time” for the Inscriber: Cole is not real. “She” is in fact Thomas Goode. Goode is known for his picture books. His best-known book, Blue Moon, won him two national book prizes and sold over one million copies.\nGoode had tried to write “serious” books before. His first try was Parent, which came out in 2006. Sadly, Goode’s big name did not help, and there was little interest in Parent. Goode’s friend told NBN that he wanted to write a book under a different name. Goode thought that people might treat his book seriously if they did not know it was from a picture book writer.\nFor the moment, there has been no word from Goode yet.\n\n▶ 第 38 題　From the news story, which fact is seen as a new turn?", "options": ["Carolyn Cole is a first-time writer.", "Carolyn Cole won the Inscriber Prize.", "Carolyn Cole is not the winner’s real name.", "Carolyn Cole did not appear for the Inscriber Prize."], "answer": 2, "answerLabel": "C", "source": "107 會考｜閱讀測驗｜第 38 題", "explanation": "新的轉折是 Cole is not real，她其實是 Thomas Goode，Carolyn Cole 是筆名。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 39, "question": "【閱讀測驗 第 38–41 題】\nNBN NEWS　Ryan Kim　7/15/2013\nGuesses about Carolyn Cole have been flying around since last week, and now things have taken a new turn.\nLast week Carolyn Cole
