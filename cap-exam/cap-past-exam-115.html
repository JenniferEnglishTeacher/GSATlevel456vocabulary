<script>window.QUIZ_CONFIG={"title": "115 年國中會考英語｜單題＋閱讀測驗＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. All of the students who are exercising are wearing ______.", "options": ["caps", "glasses", "jackets", "pants"], "answer": 1, "answerLabel": "B", "source": "115 會考｜單題｜第 1 題", "explanation": "圖中所有在運動的學生都戴著「眼鏡」：glasses。", "explanationSource": "own", "section": "單題", "image": "assets/cap115-q1.png?v=20261120-7"}, {"id": 2, "question": "第 2 題　Rita ______ her dogs many times a day. That’s why they’re too fat.", "options": ["feeds", "kisses", "walks", "washes"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 2 題", "explanation": "後句說狗太胖，表示她一天「餵」很多次：feeds。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　You can ask Sophia anything about butterflies and bees. She has great ______ of insects.", "options": ["chances", "knowledge", "news", "power"], "answer": 1, "answerLabel": "B", "source": "115 會考｜單題｜第 3 題", "explanation": "什麼都可以問她，表示她對昆蟲很有「知識」：have great knowledge of。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　Adam slept ______ last night because he kept waking up from bad dreams.", "options": ["deeply", "early", "terribly", "quickly"], "answer": 2, "answerLabel": "C", "source": "115 會考｜單題｜第 4 題", "explanation": "一直被惡夢驚醒，睡得很「糟」：slept terribly（副詞修飾動詞）。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　Tara enjoys being with all kinds of animals; she even ______ a snake as a pet.", "options": ["drops", "gives", "keeps", "makes"], "answer": 2, "answerLabel": "C", "source": "115 會考｜單題｜第 5 題", "explanation": "她喜歡動物，甚至「養」了一條蛇當寵物：keep a pet。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Little Eric chose the doll ______ big brown eyes because it was the cutest in the store.", "options": ["at", "in", "on", "with"], "answer": 3, "answerLabel": "D", "source": "115 會考｜單題｜第 6 題", "explanation": "with＋特徵：the doll with big brown eyes（有大棕眼睛的娃娃）。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　After four hours of mountain climbing, Rosa’s legs got ______, so she took a rest on the top of the mountain.", "options": ["dirty", "sick", "sore", "strong"], "answer": 2, "answerLabel": "C", "source": "115 會考｜單題｜第 7 題", "explanation": "爬了四小時山，腿很「痠痛」：sore。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Having three cups of coffee a day can’t be bad for our health, ______?", "options": ["can it", "can they", "is it", "are they"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 8 題", "explanation": "附加問句：主詞 Having...（動名詞）視為 it；前句否定 can’t，附加問句用肯定 can it?", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　You can’t push that door open with only one hand. It’s too heavy. You have to use ______!", "options": ["all", "another", "both", "one"], "answer": 2, "answerLabel": "C", "source": "115 會考｜單題｜第 9 題", "explanation": "門太重單手推不開，要用「兩隻」手：both。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Alan works hard in his new job, and he wants to know ______ his boss feels about him.", "options": ["how", "that", "whether", "why"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 10 題", "explanation": "想知道老闆對他「感覺如何」：how his boss feels about him。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　I thought the girl ______ was Kate, but it was her sister, Candy. They sounded almost the same.", "options": ["answered the phone", "she answered the phone", "who answered the phone", "and answered the phone"], "answer": 2, "answerLabel": "C", "source": "115 會考｜單題｜第 11 題", "explanation": "the girl who answered the phone：who 引導形容詞子句修飾 the girl。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Ken is going abroad with a woman he met online, though he doesn’t know ______ well.", "options": ["her", "each other", "any", "another"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 12 題", "explanation": "her 指 a woman；他不太了解「她」。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　Joe is happy he is not at the ______ of the class now. His grades are better than half of his classmates’ this school year.", "options": ["side", "front", "center", "bottom"], "answer": 3, "answerLabel": "D", "source": "115 會考｜單題｜第 13 題", "explanation": "成績比一半同學好，表示他不再是班上「最後幾名」：at the bottom of the class。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　Look! There is not a cloud in the sky. I think the chances of getting some rain today are really ______.", "options": ["far", "good", "possible", "small"], "answer": 3, "answerLabel": "D", "source": "115 會考｜單題｜第 14 題", "explanation": "天空萬里無雲，下雨的機率很「小」：small。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　On windy days, the flowers in my garden ______ like shy children with their heads down.", "options": ["bow", "fall", "rise", "smell"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 15 題", "explanation": "花朵像害羞的孩子低著頭，是在「彎腰；低頭」：bow。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "第 16 題　Mr. Olson went to the doctor when he found he ______ his hair. He hoped he would be able to keep his thick hair.", "options": ["was losing", "is losing", "will lose", "has lost"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 16 題", "explanation": "當時發現自己「正在」掉頭髮：過去進行式 was losing。", "explanationSource": "own", "section": "單題"}, {"id": 17, "question": "第 17 題　Do you know what Lindsey’s first job was? Before becoming a movie star, she ______ the floors at the supermarket.", "options": ["mops", "is mopping", "has mopped", "mopped"], "answer": 3, "answerLabel": "D", "source": "115 會考｜單題｜第 17 題", "explanation": "成為明星「之前」是過去的事：過去式 mopped。", "explanationSource": "own", "section": "單題"}, {"id": 18, "question": "第 18 題　Our dog Lassie hides under the bed every time the moon comes out. She has been ______ for years, but we don’t know why.", "options": ["it", "like this", "like us", "that"], "answer": 1, "answerLabel": "B", "source": "115 會考｜單題｜第 18 題", "explanation": "She has been like this for years：她多年來一直「像這樣」。", "explanationSource": "own", "section": "單題"}, {"id": 19, "question": "第 19 題　Tom: Sam, could you help me in the kitchen now?\nSam: No, I ______ TV. It’s the most important game of the season.", "options": ["watch", "watched", "have watched", "am watching"], "answer": 3, "answerLabel": "D", "source": "115 會考｜單題｜第 19 題", "explanation": "Sam 說不能幫忙，因為他「正在」看電視：am watching。", "explanationSource": "own", "section": "單題"}, {"id": 20, "question": "【閱讀測驗 第 20–21 題】\nFruit Tea DIY　http://www.fruitteaDIY.com\nThe Best Fruit Tea You Can Make at Home\nThings to get ready:\n3-4 teabags (green or black tea), half an apple, half a peach, half a pear, 20 mL lemon juice, 1,200 mL water, 30 g sugar\n(Note) Most fruits are good for making fruit tea, but not papayas or bananas.\nHow to make fruit tea:\n1. Boil a pot of water.\n2. Put the teabags into the pot of hot water for 2 to 3 minutes and take them out.\n3. Cut the fruit into small pieces.\n4. Put the pieces into the hot tea and wait for another 5 to 6 minutes. (Leave the fruit in the pot to make the tea taste better.)\n5. Put in sugar and lemon juice and stir for at least 10 seconds.\nNow enjoy the tea!\n\n▶ 第 20 題　Amanda wants to make fruit tea by following The Best Fruit Tea You Can Make at Home. She has several kinds of fruit in the kitchen: apples, bananas, oranges, papayas, pears, and strawberries. Which are some of the fruits she can use to make the fruit tea?", "options": ["Oranges, papayas and pears.", "Apples, bananas and oranges.", "Apples, oranges and strawberries.", "Bananas, papayas and strawberries."], "answer": 2, "answerLabel": "C", "source": "115 會考｜閱讀測驗｜第 20 題", "explanation": "大部分水果都能用，只有木瓜和香蕉不行，所以只有 C 沒有包含這兩種。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 21, "question": "【閱讀測驗 第 20–21 題】\nFruit Tea DIY　http://www.fruitteaDIY.com\nThe Best Fruit Tea You Can Make at Home\nThings to get ready:\n3-4 teabags (green or black tea), half an apple, half a peach, half a pear, 20 mL lemon juice, 1,200 mL water, 30 g sugar\n(Note) Most fruits are good for making fruit tea, but not papayas or bananas.\nHow to make fruit tea:\n1. Boil a pot of water.\n2. Put the teabags into the pot of hot water for 2 to 3 minutes and take them out.\n3. Cut the fruit into small pieces.\n4. Put the pieces into the hot tea and wait for another 5 to 6 minutes. (Leave the fruit in the pot to make the tea taste better.)\n5. Put in sugar and lemon juice and stir for at least 10 seconds.\nNow enjoy the tea!\n\n▶ 第 21 題　According to the reading, which is correct when we make the fruit tea?", "options": ["Boiling water with sugar in it.", "Making sure to take out the fruit.", "Putting in the fruit and the lemon juice at the same time.", "Leaving the teabags in the pot of hot water for 2 to 3 minutes."], "answer": 3, "answerLabel": "D", "source": "115 會考｜閱讀測驗｜第 21 題", "explanation": "第 2 步：茶包放進熱水 2–3 分鐘再拿出來。糖最後才加；水果要留在鍋裡；水果和檸檬汁是不同步驟放的。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 22, "question": "【閱讀測驗 第 22–23 題】\n（漫畫，見下方圖片）\nHawkins: In 6th grade, I tried to get the students to pick me as student leader. I totally bombed it.\nHawkins (speech): I’ll make class hours shorter. And we’ll have only three days of school a week...\nStudents: What? That’s not what a student leader can decide. He doesn’t know anything.\nHawkins: I was the best choice, but why didn’t people know that?\nHawkins: I became a salesperson when I was 23 and I believed I could be Number 1.\nBoss: Hawkins, we don’t need your service anymore. But you sold only 1 car a month.\nHawkins: Don’t worry. I’ll sell 149 cars next month.\nBoss: You said that a year ago.\n\n▶ 第 22 題　According to the comics, what kind of person is Hawkins?", "options": ["He sees good things in people.", "He never goes to work on time.", "He blindly follows other people.", "He talks about things he can’t do."], "answer": 3, "answerLabel": "D", "source": "115 會考｜閱讀測驗｜第 22 題", "explanation": "選班長時承諾縮短上課時間、一週只上三天；當業務一個月只賣一台卻說下個月要賣 149 台，他總是說自己做不到的事。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap115-g22.png?v=20261120-7"}, {"id": 23, "question": "【閱讀測驗 第 22–23 題】\n（漫畫，見下方圖片）\nHawkins: In 6th grade, I tried to get the students to pick me as student leader. I totally bombed it.\nHawkins (speech): I’ll make class hours shorter. And we’ll have only three days of school a week...\nStudents: What? That’s not what a student leader can decide. He doesn’t know anything.\nHawkins: I was the best choice, but why didn’t people know that?\nHawkins: I became a salesperson when I was 23 and I believed I could be Number 1.\nBoss: Hawkins, we don’t need your service anymore. But you sold only 1 car a month.\nHawkins: Don’t worry. I’ll sell 149 cars next month.\nBoss: You said that a year ago.\n\n▶ 第 23 題　What does it mean when we say someone bombed something?", "options": ["They gave it up.", "They failed at it.", "They were fine with it.", "They were careful about it."], "answer": 1, "answerLabel": "B", "source": "115 會考｜閱讀測驗｜第 23 題", "explanation": "同學都覺得他什麼都不懂，他沒選上班長，bombed it＝搞砸、失敗。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap115-g22.png?v=20261120-7"}, {"id": 24, "question": "【閱讀測驗 第 24–26 題】\nThe Marigolds’ Home\nMarch to October 10:00-17:00／November to February 10:00-16:00／Closed on Mondays\n（地圖：① Main Gate ② Butterfly Garden ③ Playground ④ Family Library ⑤ Main House ⑥ The Rabbit’s Temple ⑦ Sir Archie’s House ⑧ Farmyard ⑨ Rose Garden　Gift Shops　Café）\nTo make sure you enjoy your visit to The Marigolds’ Home, we’d like to ask you to follow the rules below:\n1. Pets are not allowed in any areas of the Marigolds’ Home.\n2. Eating and drinking are not allowed inside the buildings, except in the café.\n3. Picture-taking is not allowed inside Sir Archie’s House.\n4. Please take off your shoes before entering the Rabbit’s Temple.\nBecome a member and save 10% on tickets and 30% on all items in the gift shops. To join, visit www.themarigoldshome.com.\n（brochure 宣傳手冊）\n\n▶ 第 24 題　Which question can the brochure answer?", "options": ["Can I order tickets online?", "How much are the tickets?", "How can I get to the Marigolds’ Home?", "When can I visit the Marigolds’ Home?"], "answer": 3, "answerLabel": "D", "source": "115 會考｜閱讀測驗｜第 24 題", "explanation": "手冊列出各季開放時間和週一休館，可以回答「何時可以參觀」。沒有票價、交通方式或網路訂票的資訊。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap115-g24.png?v=20261120-7"}, {"id": 25, "question": "【閱讀測驗 第 24–26 題】\nThe Marigolds’ Home\nMarch to October 10:00-17:00／November to February 10:00-16:00／Closed on Mondays\n（地圖：① Main Gate ② Butterfly Garden ③ Playground ④ Family Library ⑤ Main House ⑥ The Rabbit’s Temple ⑦ Sir Archie’s House ⑧ Farmyard ⑨ Rose Garden　Gift Shops　Café）\nTo make sure you enjoy your visit to The Marigolds’ Home, we’d like to ask you to follow the rules below:\n1. Pets are not allowed in any areas of the Marigolds’ Home.\n2. Eating and drinking are not allowed inside the buildings, except in the café.\n3. Picture-taking is not allowed inside Sir Archie’s House.\n4. Please take off your shoes before entering the Rabbit’s Temple.\nBecome a member and save 10% on tickets and 30% on all items in the gift shops. To join, visit www.themarigoldshome.com.\n（brochure 宣傳手冊）\n\n▶ 第 25 題　What breaks the rules for visitors to the Marigolds’ Home?", "options": ["Eating burgers in the Rose Garden.", "Taking pictures in the Main House.", "Entering the Rabbit’s Temple without shoes.", "Taking pet dogs for a walk on the playground."], "answer": 3, "answerLabel": "D", "source": "115 會考｜閱讀測驗｜第 25 題", "explanation": "規則一：寵物不得進入任何區域。只有建築物內不能飲食；只有 Sir Archie’s House 不能拍照；進兔子廟本來就要脫鞋。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap115-g24.png?v=20261120-7"}, {"id": 26, "question": "【閱讀測驗 第 24–26 題】\nThe Marigolds’ Home\nMarch to October 10:00-17:00／November to February 10:00-16:00／Closed on Mondays\n（地圖：① Main Gate ② Butterfly Garden ③ Playground ④ Family Library ⑤ Main House ⑥ The Rabbit’s Temple ⑦ Sir Archie’s House ⑧ Farmyard ⑨ Rose Garden　Gift Shops　Café）\nTo make sure you enjoy your visit to The Marigolds’ Home, we’d like to ask you to follow the rules below:\n1. Pets are not allowed in any areas of the Marigolds’ Home.\n2. Eating and drinking are not allowed inside the buildings, except in the café.\n3. Picture-taking is not allowed inside Sir Archie’s House.\n4. Please take off your shoes before entering the Rabbit’s Temple.\nBecome a member and save 10% on tickets and 30% on all items in the gift shops. To join, visit www.themarigoldshome.com.\n（brochure 宣傳手冊）\n\n▶ 第 26 題　After shopping at the gift shop of the Main House, Lizzy walks out and sees the Family Library in front of her. She wants to visit the Rose Garden. How can she get there?", "options": ["Turn left and walk past the Main House, then go straight and turn right at the corner.", "Turn left and walk past Sir Archie’s House, then turn right and walk past the Main House.", "Turn right and go straight to the Farmyard, then turn right and go straight, then turn left at the corner.", "Turn right and walk through the Butterfly Garden, then walk past the Rabbit’s Temple and the café."], "answer": 2, "answerLabel": "C", "source": "115 會考｜閱讀測驗｜第 26 題", "explanation": "面向北邊的圖書館，右轉往東走到農場，再右轉往南直走，到轉角左轉就到玫瑰園（請對照地圖）。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/cap115-g24.png?v=20261120-7"}, {"id": 27, "question": "【閱讀測驗 第 27–28 題】\nOne summer evening when English cello player Beatrice Harrison was practicing in her garden, she was joined by a visitor she did not expect.\nThe visitor was a nightingale. The small brown bird sang together with Harrison’s cello music, and the birdsong sounded like the piece she was playing. For the next few evenings, her visitor kept coming back, sometimes with several of its friends. Harrison decided that more people should hear the little singers.\nSo, on May 19, 1924, Harrison worked with the BBC, the UK’s national TV and radio station, and played in her garden. At first, the artist was playing alone. Fifteen minutes before the end of her playing, the nightingales began to sing with the cello.\nThe nightingale show was popular with radio listeners. It was repeated the next week, and for the next twelve years Harrison played on the radio with her garden friends. During this time, she got 50,000 fan letters. People called her “the Nightingale Lady.”\n（Photo: Ms. Harrison with the cello）\n\n▶ 第 27 題　Why was Beatrice Harrison called the Nightingale Lady?", "options": ["She wrote songs about nightingales.", "She sang as beautifully as a nightingale did.", "She taught nightingales to sing in a radio show.", "She was famous for playing music with nightingales."], "answer": 3, "answerLabel": "D", "source": "115 會考｜閱讀測驗｜第 27 題", "explanation": "她在花園和夜鶯一起演奏的廣播節目大受歡迎，持續了十二年，因此被稱為夜鶯女士。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 28, "question": "【閱讀測驗 第 27–28 題】\nOne summer evening when English cello player Beatrice Harrison was practicing in her garden, she was joined by a visitor she did not expect.\nThe visitor was a nightingale. The small brown bird sang together with Harrison’s cello music, and the birdsong sounded like the piece she was playing. For the next few evenings, her visitor kept coming back, sometimes with several of its friends. Harrison decided that more people should hear the little singers.\nSo, on May 19, 1924, Harrison worked with the BBC, the UK’s national TV and radio station, and played in her garden. At first, the artist was playing alone. Fifteen minutes before the end of her playing, the nightingales began to sing with the cello.\nThe nightingale show was popular with radio listeners. It was repeated the next week, and for the next twelve years Harris  "閱讀測驗"}, {"id": 30, "question": "【閱讀測驗 第 29–31 題】\nAction! US　MOVIE | TV | MUSIC | THEATER | VIDEO | Q&A\nWith heavy hearts, we are here to say goodbye to Rose Lacey, a wonderful writer who will be sadly missed.\nRose and I first met in 2010. I was at a party to pick up my wife when I heard Rose explaining to her and her friends why Get Across was a great movie. Her ideas were so interesting that I invited her to write some articles about movies for Action! US. Rose was very excited and agreed right away.\nOver the next ten years, Rose wrote more than 150 articles. Rose could always bring out something new from movies that we thought we knew so well. People often told me that Rose never failed to surprise them. Her articles often made them think whether they actually saw the same movie, but if they went to see it again, they experienced the movie in a whole new way.\nIn her short life of 40 years, Rose has made her mark on the world of movies with her articles for Action! US. We are lucky to have had her in our lives. She was a very special person.\nAlex Jackson, Head of Action! US\n（article 文章）\n\n▶ 第 30 題　How did Rose Lacey and Alex Jackson get to know each other?", "options": ["They met at a party.", "They were relatives.", "They worked in the same office.", "They took a course on movies together."], "answer": 0, "answerLabel": "A", "source": "115 會考｜閱讀測驗｜第 30 題", "explanation": "2010 年 Alex 去派對接太太時，聽到 Rose 在談電影，兩人因此認識。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 31, "question": "【閱讀測驗 第 29–31 題】\nAction! US　MOVIE | TV | MUSIC | THEATER | VIDEO | Q&A\nWith heavy hearts, we are here to say goodbye to Rose Lacey, a wonderful writer who will be sadly missed.\nRose and I first met in 2010. I was at a party to pick up my wife when I heard Rose explaining to her and her friends why Get Across was a great movie. Her ideas were so interesting that I invited her to write some articles about movies for Action! US. Rose was very excited and agreed right away.\ bowls and cups have become more popular these days. This means there are fewer glass items in the sea, so less and less sea glass will be found in the future.\n\n▶ 第 32 題　Why does the title say “Glass Bottles’ Second Life”?", "options": ["People collect sea glass and use it to make new glass bottles.", "People collect sea glass at the beach and use it to make wishes.", "Glass bottles that are thrown into the sea become the homes of sea animals.", "Glass bottles that are thrown into the sea become sea glass which is used in art pieces."], "answer": 3, "answerLabel": "D", "source": "115 會考｜閱讀測驗｜第 32 題", "explanation": "被丟進海裡的玻璃瓶變成海玻璃，再被藝術家用在作品中，等於得到「第二次生命」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 33, "question": "【閱讀測驗 第 32–34 題】\nSEA GLASS: GLASS BOTTLES’ SECOND LIFE\nSea glass is made from the magic of the sea. It usually comes from glass bottles that are thrown into the water. Each piece of sea glass looks different, and sea glass is often seen on art pieces. The pictures below explain how sea glass is born.\n1. Glass bottles are thrown as garbage into the sea.\n2. When these bottles ride the waves of the sea, they hit each other or other garbage in the sea and break into small pieces of glass.\n3. Pieces of glass are pushed by sea water and move along the sea floor. The sharp pieces slowly become rounder and rounder.\n4. After tens or hundreds of years in the sea, the pieces of glass grow an ice-like white color on the outside and become sea glass.\n5. Sea glass is finally pushed up to the beach.\n6. Artists collect pieces of sea glass and put them into their works.\nHowever, people now seldom use glass to make bottles and bowls—paper bowls and cups have become more popular these days. This means there are fewer glass items in the sea, so less and less sea glass will be found in the future.\n\n▶ 第 33 題　According to the reading, how is sea glass made?", "options": ["Sea glass becomes rounder after it is pushed up to the beach.", "Colder sea water helps pieces of glass become sea glass faster.", "Pieces of glass become white on the outside after many years in the sea.", "Glass bottles break into pieces when they are dug out from the sea floor."], "answer": 2, "answerLabel": "C", "source": "115 會考｜閱讀測驗｜第 33 題", "explanation": "玻璃碎片在海裡幾十到幾百年後，外層會變成像冰一樣的白色。變圓是在海底移動時發生的；瓶子是在海浪中互撞而碎。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 34, "question": "【閱讀測驗 第 32–34 題】\nSEA GLASS: GLASS BOTTLES’ SECOND LIFE\nSea glass is made from the magic of the sea. It usually comes from glass bottles that are thrown into the water. Each piece of sea glass looks different, and sea glass is often seen on art pieces. The pictures below explain how sea glass is born.\n1. Glass bottles are thrown as garbage into the sea.\n2. When these bottles ride the waves of the sea, they hit each other or other garbage in the sea and break into small pieces of glass.\n3. Pieces of glass are pushed by sea water and move along the sea floor. The sharp pieces slowly become rounder and rounder.\n4. After tens or hundreds of years in the sea, the pieces of glass grow an ice-like white color on the outside and become sea glass.\n5. Sea glass is finally pushed up to the beach.\n6. Artists collect pieces of sea glass and put them into their works.\nHowever, people now seldom use glass to make bottles and bowls—paper bowls and cups have become more popular these days. This means there are fewer glass items in the sea, so less and less sea glass will be found in the future.\n\n▶ 第 34 題　According to the reading, why will less sea glass be found in the future?", "options": ["People do not make as many glass items as before.", "People have learned not to throw garbage into the sea.", "Artists are using too much sea glass in their art pieces.", "Waves are not big enough to push sea glass up to the beach."], "answer": 0, "answerLabel": "A", "source": "115 會考｜閱讀測驗｜第 34 題", "explanation": "現在很少用玻璃做瓶子和碗，改用紙碗紙杯，海裡的玻璃製品變少，海玻璃也會越來越少。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 35, "question": "【閱讀測驗 第 35–39 題】\nScandinavian News　The Future of Icelandic　by Anna Adams\nIcelandic is a language that is spoken only in Iceland. It has a long history. But many Icelanders are worried that they’re losing Icelandic.\nThe reason for their worry is the prevalence of English in Iceland. “I use English when I talk to my housework robot, use my phone, and watch movies,” said Helgi Atlason, an engineer. There is a reason for that. Most of these products use English, and few companies care to change the language into Icelandic because there are only a small number of Icelandic speakers (314,000 people). Actually, you see English everywhere in Iceland.\nIcelanders also speak and hear more English than Icelandic these days because many foreigners who come to live and work in Iceland speak only English. “We can’t use Icelandic abroad, and we’re not using it much in Iceland, either. How do you expect our kids will want to learn it?” said Eiríkur Wilson, a teacher.\nWill Iceland one day give up Icelandic for English? It may happen soon.\n\nScandinavian News　Our Future with Icelandic　by Gunnar Eggertsson\nMany people think Icelandic is a language in its sickbed and that it needs to be saved. I understand their worries, but does the future of our language really look that bad?\nAccording to Dr. David Clingingsmith, a language needs at least 35,000 speakers to be “safe” from becoming a dying language. There are now 314,000 Icelandic speakers. Also, every year Iceland spends 51.3 million Icelandic crowns (3.7 million US dollars) teaching Icelandic to machines: phones, computers, and robots. Icelandic is appearing more often in products. Most importantly, schools still teach Icelandic to children. Clearly, we are not giving up our first language.\nHowever, I’m not saying that Iceland has done enough for Icelandic. Our country can do a better job at getting more people to speak this beautiful language. One way to do so is to give more language courses to foreigners. With much more work, I’m sure Icelandic can grow and even reach farther into the world.\n\n▶ 第 35 題　What does the prevalence of English mean?", "options": ["That English is very common.", "That English is not welcomed.", "That English is easy and simple.", "That English is not a national language."], "answer": 0, "answerLabel": "A", "source": "115 會考｜閱讀測驗｜第 35 題", "explanation": "後文說機器人、手機、電影都用英文，冰島到處都看得到英文，prevalence＝普遍、盛行。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 36, "question": "【閱讀測驗 第 35–39 題】\nScandinavian News　The Future of Icelandic　by Anna Adams\nIcelandic is a language that is spoken only in Iceland. It has a long history. But many Icelanders are worried that they’re losing Icelandic.\nThe reason for their worry is the prevalence of English in Iceland. “I use English when I talk to my housework robot, use my phone, and watch movies,” said Helgi Atlason, an engineer. There is a reason for that. Most of these products use English, and few companies care to change the language into Icelandic because there are only a small number of Icelandic speakers (314,000 people). Actually, you see English everywhere in Iceland.\nIcelanders also speak and hear more English than Icelandic these days because many foreigners who come to live and work in Iceland speak only English. “We can’t use Icelandic abroad, and we’re not using it much in Iceland, either. How do you expect our kids will want to learn it?” said Eiríkur Wilson, a teacher.\nWill Iceland one day give up Icelandic for English? It may happen soon.\n\nScandinavian News　Our Future with Icelandic　by Gunnar Eggertsson\nMany people think Icelandic is a language in its sickbed and that it needs to be saved. I understand their worries, but does the future of our language really look that bad?\nAccording to Dr. David Clingingsmith, a language needs at least 35,000 speakers to be “safe” from becoming a dying language. There are now 314,000 Icelandic speakers. Also, every year Iceland spends 51.3 million Icelandic crowns (3.7 million US dollars) teaching Icelandic to machines: phones, computers, and robots. Icelandic is appearing more often in products. Most importantly, schools still teach Icelandic to children. Clearly, we are not giving up our first language.\nHowever, I’m not saying that Iceland has done enough for Icelandic. Our country can do a better job at getting more people to speak this beautiful language. One way to do so is to give more language courses to foreigners. With much more work, I’m sure Icelandic can grow and even reach farther into the world.\n\n▶ 第 36 題　In the first reading, which is one of the ways that Anna Adams uses to make readers believe in her ideas?", "options": ["Sharing her own life stories.", "Borrowing from people’s experience.", "Using examples from another language.", "Showing information from news reports."], "answer": 1, "answerLabel": "B", "source": "115 會考｜閱讀測驗｜第 36 題", "explanation": "Adams 引用工程師 Helgi 和老師 Eiríkur 的親身經驗來支持自己的看法。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 37, "question": "【閱讀測驗 第 35–39 題】\nScandinavian News　The Future of Icelandic　by Anna Adams\nIcelandic is a language that is spoken only in Iceland. It has a long history. But many Icelanders are worried that they’re losing Icelandic.\nThe reason for their worry is the prevalence of English in Iceland. “I use English when I talk to my housework robot, use my phone, and watch movies,” said Helgi Atlason, an engineer. There is a reason for that. Most of these products use English, and few companies care to change the language into Icelandic because there are only a small number of Icelandic speakers (314,000 people). Actually, you see English everywhere in Iceland.\nIcelanders also speak and hear more English than Icelandic these days because many foreigners who come to live and work in Iceland speak only English. “We can’t use Icelandic abroad, and we’re not using it much in Iceland, either. How do you expect our kids will want to learn it?” said Eiríkur Wilson, a teacher.\nWill Iceland one day give up Icelandic for English? It may happen soon.\n\nScandinavian News　Our Future with Icelandic　by Gunnar Eggertsson\nMany people think Icelandic is a language in its sickbed and that it needs to be saved. I understand their worries, but does the future of our language really look that bad?\nAccording to Dr. David Clingingsmith, a language needs at least 35,000 speakers to be “safe” from becoming a dying language. There are now 314,000 Icelandic speakers. Also, every year Iceland spends 51.3 million Icelandic crowns (3.7 million US dollars) teaching Icelandic to machines: phones, computers, and robots. Icelandic is appearing more often in products. Most importantly, schools still teach Icelandic to children. Clearly, we are not giving up our first language.\nHowever, I’m not saying that Iceland has done enough for Icelandic. Our country can do a better job at getting more people to speak this beautiful language. One way to do so is to give more language courses to foreigners. With much more work, I’m sure Icelandic can grow and even reach farther into the world.\n\n▶ 第 37 題　Which words in the second reading are NOT used to describe Icelandic?", "options": ["A language in its sickbed.", "A dying language.", "Our first language.", "This beautiful language."], "answer": 1, "answerLabel": "B", "source": "115 會考｜閱讀測驗｜第 37 題", "explanation": "Eggertsson 說語言要有 35,000 人使用才不會成為 a dying language，而冰島語有 314,000 人，所以這個詞不是用來形容冰島語。sickbed 是別人的看法，first language、beautiful language 都是在說冰島語。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 38, "question": "【閱讀測驗 第 35–39 題】\nScandinavian News　The Future of Icelandic　by Anna Adams\nIcelandic is a language that is spoken only in Iceland. It has a long history. But many Icelanders are worried that they’re losing Icelandic.\nThe reason for their worry is the prevalence of English in Iceland. “I use English when I talk to my housework robot, use my
