<script>window.QUIZ_CONFIG={"title": "98 年學測英文｜詞彙＋綜合測驗＋文意選填＋閱讀測驗", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Steve’s description of the place was so ______ that I could almost picture it in my mind.", "options": ["bitter", "vivid", "sensitive", "courageous"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 1 題", "explanation": "描述「生動」到幾乎能在腦中想像出畫面：vivid 生動的。bitter 苦的、sensitive 敏感的、courageous 勇敢的。", "explanationSource": "own", "section": "詞彙"}, {"id": 2, "question": "第 2 題　When people feel uncomfortable or nervous, they may ______ their arms across their chests as if to protect themselves.", "options": ["toss", "fold", "veil", "yield"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 2 題", "explanation": "緊張時會把手臂「交叉抱」在胸前像保護自己：fold one’s arms 抱臂。toss 丟、veil 遮蓋、yield 屈服。", "explanationSource": "own", "section": "詞彙"}, {"id": 3, "question": "第 3 題　The doors of these department stores slide open ______ when you approach them. You don’t have to open them yourself.", "options": ["necessarily", "diligently", "automatically", "intentionally"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 3 題", "explanation": "不必自己開門，門會「自動」滑開：automatically。necessarily 必然地、diligently 勤奮地、intentionally 故意地。", "explanationSource": "own", "section": "詞彙"}, {"id": 4, "question": "第 4 題　Nicole is a ______ language learner. Within a short period of time, she has developed a good command of Chinese and Japanese.", "options": ["convenient", "popular", "regular", "brilliant"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 4 題", "explanation": "短時間內精通中日文，是「傑出的」語言學習者：brilliant。convenient 方便的、popular 受歡迎的、regular 規律的。", "explanationSource": "own", "section": "詞彙"}, {"id": 5, "question": "第 5 題　With rising oil prices, there is an increasing ______ for people to ride bicycles to work.", "options": ["permit", "instrument", "appearance", "tendency"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 5 題", "explanation": "油價上漲，騎單車通勤的「趨勢」增加：tendency 趨勢。permit ": "經濟惡化時，把錢存銀行比投資股市更「明智」：sensible 明智的。portable 可攜帶的、explicit 明確的、anxious 焦慮的。", "explanationSource": "own", "section": "詞彙"}, {"id": 11, "question": "第 11 題　Under the ______ of newly elected president Barack Obama, the US is expected to turn a new page in politics and economy.", "options": ["adoption", "fragrance", "identity", "leadership"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 11 題", "explanation": "在新總統的「領導」下，美國將開啟新頁：leadership。adoption 採用、fragrance 香氣、identity 身分。", "explanationSource": "own", "section": "詞彙"}, {"id": 12, "question": "第 12 題　Rapid advancement in motor engineering makes it ______ possible to build a flying car in the near future.", "options": ["individually", "narrowly", "punctually", "technically"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 12 題", "explanation": "引擎技術進步，使製造飛行汽車在「技術上」可行：technically。individually 個別地、narrowly 勉強地、punctually 準時地。", "explanationSource": "own", "section": "詞彙"}, {"id": 13, "question": "第 13 題　When you take photos, you can move around to shoot the target object from different ______.", "options": ["moods", "trends", "angles", "inputs"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 13 題", "explanation": "拍照時可移動以從不同「角度」拍攝：angles。mood 心情、trend 趨勢、input 輸入。", "explanationSource": "own", "section": "詞彙"}, {"id": 14, "question": "第 14 題　Students were asked to ______ or rewrite their compositions based on the teacher’s comments.", "options": ["revise", "resign", "refresh", "remind"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 14 題", "explanation": "依老師評語「修改」或重寫作文：revise 修訂。resign 辭職、refresh 使恢復、remind 提醒。", "explanationSource": "own", "section": "詞彙"}, {"id": 15, "question": "第 15 題　Besides lung cancer, another ______ of smoking is wrinkles, a premature sign of aging.", "options": ["blessing", "campaign", "consequence", "breakthrough"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 15 題", "explanation": "除了肺癌，吸菸的另一個「後果」是皺紋：consequence。blessing 福氣、campaign 活動、breakt ortance of teamwork。(J) teamwork。", "explanationSource": "own", "section": "文意選填"}, {"id": 41, "question": "【閱讀測驗 第 41–44 題】\nTo Whom It May Concern:\nYour address was forwarded to us by Why Bother Magazine. All of us here think The International Institute of Not Doing Much is the best organization in the world. You know how to avoid unnecessary activities!\nWe closely followed the advice in your article. First, we replaced all our telephones with carrier pigeons. Simply removing the jingle of telephones and replacing them with the pleasant sounds of birds has had a remarkable effect on everyone. Besides, birds are cheaper than telephone service. After all, we are a business. We have to think of the bottom line. As a side benefit, the birds also fertilize the lawn outside the new employee sauna.\nNext, we sold the computers off to Stab, Grab, Grit, and Nasty, a firm of lawyers nearby. Our electricity bill went way down. Big savings! The boss is impressed. We have completely embraced paper technology. Now that we all use pencils, doodling is on the increase, and the quality of pencilwomanship is impressive, as you can tell from my handwriting in this letter. By the way, if you can, please send this letter back to us. We can erase and reuse it. Just tie it to Maggie’s leg and she’ll know where to take it.\nNow it’s very calm and quiet here. You can notice the difference. No more loud chatter on the telephones! All we hear is the scratching of pencil on paper, the sound of pigeons, and the delivery of inter-office correspondence by paper airplane.\nWonderful! I’ve always wanted to work for an insurance company ever since I was a little girl. Now it’s perfect.\nSincerely yours,\nEleanor Lightly\nSpokeswoman and Company Hair Stylist\nABC Activity Insurance: Insure against overdoing it\n\n▶ 第 41 題　Which of the following best describes the life the author is leading?", "options": ["A simple, slow-paced life.", "A life of hard work and security.", "A religious, peasant-like life.", "A life away from paper and pencils."], "answer": 0, "answerLabel": "A", "source": "98 學測｜閱讀測驗｜第 41 題", "explanation": "整封信描述把電話換成信鴿、賣掉電腦改用鉛筆、辦公室安靜平和——簡單、慢節奏的生活。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 42, "question": "【閱讀測驗 第 41–44 題】\nTo Whom It May Concern:\nYour address was forwarded to us by Why Bother Magazine. All of us here think The International Institute of Not Doing Much is the best organization in the world. You know how to avoid unnecessary activities!\nWe closely followed the advice in your article. First, we replaced all our telephones with carrier pigeons. Simply removing the jingle of telephones and replacing them with the pleasant sounds of birds has had a remarkable effect on everyone. Besides, birds are cheaper than telephone service. After all, we are a business. We have to think of the bottom line. As a side benefit, the birds also fertilize the lawn outside the new employee sauna.\nNext, we sold the computers off to Stab, Grab, Grit, and Nasty, a firm of lawyers nearby. Our electricity bill went way down. Big savings! The boss is impressed. We have completely embraced paper technology. Now that we all use pencils, doodling is on the increase, and the quality of pencilwomanship is impressive, as you can tell from my handwriting in this letter. By the way, if you can, please send this letter back to us. We can erase and reuse it. Just tie it to Maggie’s leg and she’ll know where to take it.\nNow it’s very calm and quiet here. You can notice the difference. No more loud chatter on the telephones! All we hear is the scratching of pencil on paper, the sound of pigeons, and the delivery of inter-office correspondence by paper airplane.\nWonderful! I’ve always wanted to work for an insurance company ever since I was a little girl. Now it’s perfect.\nSincerely yours,\nEleanor Lightly\nSpokeswoman and Company Hair Stylist\nABC Activity Insurance: Insure against overdoing it\n\n▶ 第 42 題　Where is Eleanor’s letter sent to?", "options": ["Why Bother Magazine.", "ABC Activity Insurance Company.", "Stab, Grab, Grit, and Nasty Law Firm.", "The International Institute of Not Doing Much."], "answer": 3, "answerLabel": "D", "source": "98 學測｜閱讀測驗｜第 42 題", "explanation": "開頭說「你們 The International Institute of Not Doing Much 是世上最好的組織」，並說照著你們文章的建議做——收信者就是這個機構。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 43, "question": "【閱讀測驗 第 41–44 題】\nTo Whom It May Concern:\nYour address was forwarded to us by Why Bother Magazine. All of us here think The International Institute of Not Doing Much is the best organization in the world. You know how to avoid unnecessary activities!\nWe closely followed the advice in your article. First, we replaced all our telephones with carrier pigeons. Simply removing the jingle of telephones and replacing them with the pleasant sounds of birds has had a remarkable effect on everyone. Besides, birds are cheaper than telephone service. After all, we are a business. We have to think of the bottom line. As a side benefit, the birds also fertilize the lawn outside the new employee sauna.\nNext, we sold the computers off to Stab, Grab, Grit, and Nasty, a firm of lawyers nearby. Our electricity bill went way down. Big savings! The boss is impressed. We have completely embraced paper technology. Now that we all use pencils, doodling is on the increase, and the quality of pencilwomanship is impressive, as you can tell from my handwriting in this letter. By the way, if you can, please send this letter back to us. We can erase and reuse it. Just tie it to Maggie’s leg and she’ll know where to take it.\nNow it’s very calm and quiet here. You can notice the difference. No more loud chatter on the telephones! All we hear is the scratching of pencil on paper, the sound of pigeons, and the delivery of inter-office correspondence by paper airplane.\nWonderful! I’ve always wanted to work for an insurance company ever since I was a little girl. Now it’s perfect.\nSincerely yours,\nEleanor Lightly\nSpokeswoman and Company Hair Stylist\nABC Activity Insurance: Insure against overdoing it\n\n▶ 第 43 題　Which of the following is practiced in the author’s company?", "options": ["Replacing the manual work system with modern technology.", "Turning off lights in the daytime to save electricity.", "Recycling paper resources whenever possible.", "Buying birds and pets as company for the staff."], "answer": 2, "answerLabel": "C", "source": "98 學測｜閱讀測驗｜第 43 題", "explanation": "第三段：請把信寄回來，「我們可以擦掉重複使用」——盡可能回收紙張。(C)。(A) 相反，他們放棄現代科技。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 44, "question": "【閱讀測驗 第 41–44 題】\nTo Whom It May Concern:\nYour address was forwarded to us by Why Bother Magazine. All of us here think The International Institute of Not Doing Much is the best organization in the world. You know how to avoid unnecessary activities!\nWe closely followed the advice in your article. First, we replaced all our telephones with carrier pigeons. Simply removing the jingle of telephones and replacing them with the pleasant sounds of birds has had a remarkable effect on everyone. Besides, birds are cheaper than telephone service. After all, we are a business. We have to think of the bottom line. As a side benefit, the birds also fertilize the lawn outside the new employee sauna.\nNext, we sold the computers off to Stab, Grab, Grit, and Nasty, a firm of lawyers nearby. Our electricity bill went way down. Big savings! The boss is impressed. We have completely embraced paper technology. Now that we all use pencils, doodling is on the increase, and the quality of pencilwomanship is impressive, as you can tell from my handwriting in this letter. By the way, if you can, please send this letter back to us. We can erase and reuse it. Just tie it to Maggie’s leg and she’ll know where to take it.\nNow it’s very calm and quiet here. You can notice the difference. No more loud chatter on the telephones! All we hear is the scratching of pencil on paper, the sound of pigeons, and the delivery of inter-office correspondence by paper airplane.\nWonderful! I’ve always wanted to work for an insurance company ever since I was a little girl. Now it’s perfect.\nSincerely yours,\nEleanor Lightly\nSpokeswoman and Company Hair Stylist\nABC Activity Insurance: Insure against overdoing it\n\n▶ 第 44 題　What is true about Maggie?", "options": ["She works as a manager in the author’s company.", "She sometimes helps fertilize the lawn outside the sauna.", "She often helps with inter-office correspondence using e-mail.", "Her handwriting has improved a lot after entering the company."], "answer": 1, "answerLabel": "B", "source": "98 學測｜閱讀測驗｜第 44 題", "explanation": "Maggie 是信鴿（「把信綁在 Maggie 的腳上」）；第二段說鳥會「為桑拿外的草地施肥」。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 45, "question": "【閱讀測驗 第 45–48 題】\nThe Galápagos Islands are the Pacific island paradise where Darwin’s theory of evolution was born. They are places filled with giant tree lizards, sandy beaches, and tropical plants. Now they will be famous for one more thing: the world’s first green airport.\nThis group of islands off the coast of Ecuador has recently contracted Argentine Corporación America to manage the redevelopment of the airport on the island of Baltra. It is estimated that US$20 million is needed to complete the project by 2009. The new development has several important features: use of wind and solar energy, passive heating and cooling systems, as well as concrete runways in place of asphalt, which has a greater carbon footprint during its production cycle. This new development couldn’t be coming at a better time for the Galápagos, which were added to an environmental “danger list” in 2007.\nPacific islands like the Galápagos, Easter Island, and Tahiti, have economies that are driven almost completely by tourism. However, some people think these are “unsustainable models of development.” The number of visitors to the Galápagos rose more than 250% from 1990 to 2006, while the number of commercial flights to the area rose 193% from 2001 to 2006. These increases put great stress on the islands’ resources and environment. Air travel is especially criticized for exhausting natural resources and causing environmental damage. Thus, efforts are being made to reduce the environmental impact of the tourism industry. The greening of airports is just one of these attempts.\n\n▶ 第 45 題　What is this article mainly about?", "options": ["The problems of Darwin’s theory.", "The background of building a green airport.", "The history of the Galápagos Islands.", "The ease of transportation to the Pacific islands."], "answer": 1, "answerLabel": "B", "source": "98 學測｜閱讀測驗｜第 45 題", "explanation": "全文：加拉巴哥群島要蓋全球第一座綠色機場，並說明觀光壓力等背景。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 46, "question": "【閱讀測驗 第 45–48 題】\nThe Galápagos Islands are the Pacific island paradise where Darwin’s theory of evolution was born. They are places filled with giant tree lizards, sandy beaches, and tropical plants. Now they will be famous for one more thing: the world’s first green airport.\nThis group of islands off the coast of Ecuador has recently contracted Argentine Corporación America to manage the redevelopment of the airport on the island of Baltra. It is estimated that US$20 million is needed to complete the project by 2009. The new development has several important features: use of wind and solar energy, passive heating and cooling systems, as well as concrete runways in place of asphalt, which has a greater carbon footprint during its production cycle. This new development couldn’t be coming at a better time for the Galápagos, which were added to an environmental “danger list” in 2007.\nPacific islands like the Galápagos, Easter Island, and Tahiti, have economies that are driven almost completely by tourism. However, some people think these are “unsustainable models of development.” The number of visitors to the Galápagos rose more than 250% from 1990 to 2006, while the number of commercial flights to the area rose 193% from 2001 to 2006. These increases put great stress on the islands’ resources and environment. Air travel is especially criticized for exhausting natural resources and causing environmental damage. Thus, efforts are being made to reduce the environmental impact of the tourism industry. The greening of airports is just one of these attempts.\n\n▶ 第 46 題　Where will the world’s first green airport be built?", "options": ["In Tahiti.", "In Argentina.", "In Baltra.", "In the United States."], "answer": 2, "answerLabel": "C", "source": "98 學測｜閱讀測驗｜第 46 題", "explanation": "第二段：重新開發「Baltra 島」上的機場。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 47, "question": "【閱讀測驗 第 45–48 題】\nThe Galápagos Islands are the Pacific island paradise where Darwin’s theory of evolution was born. They are places filled with giant tree lizards, sandy beaches, and tropical plants. Now they will be famous for one more thing: the world’s first green airport.\nThis group of islands off the coast of Ecuador has recently contracted Argentine Corporación America to manage the redevelopment of the airport on the island of Baltra. It is estimated that US$20 million is needed to complete the project by 2009. The new development has several important features: use of wind and solar energy, passive heating and cooling systems, as well as concrete runways in place of asphalt, which has a greater carbon footprint during its production cycle. This new development couldn’t be coming at a better time for the Galápagos, which were added to an environmental “danger list” in 2007.\nPacific islands like the Galápagos, Easter Island, and Tahiti, have economies that are driven almost completely by tourism. However, some people think these are “unsustainable models of development.” The number of visitors to the Galápagos rose more than 250% from 1990 to 2006, while the number of commercial flights to the area rose 193% from 2001 to 2006. These increases put great stress on the islands’ resources and environment. Air travel is especially criticized for exhausting natural resources and causing environmental damage. Thus, efforts are being made to reduce the environmental impact of the tourism industry. The greening of airports is just one of these attempts.\n\n▶ 第 47 題　What is true about the Galápagos Islands?", "options": ["They are located near Ecuador in the Pacific Ocean.", "They have had a great increase in population since 2001.", "They will invest US$20 million to promote their tourism.", "They have become one of the most dangerous places in the world."], "answer": 0, "answerLabel": "A", "source": "98 學測｜閱讀測驗｜第 47 題", "explanation": "第二段：This group of islands off the coast of Ecuador，位於太平洋、厄瓜多外海。(A)。(B) 是遊客數增加非人口；(C) 資金是蓋機場非推廣觀光；(D) 是列入環境「危險名單」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 48, "question": "【閱讀測驗 第 45–48 題】\nThe Galápagos Islands are the Pacific island paradise where Darwin’s theory of evolution was born. They are places filled with giant tree lizards, sandy beaches, and tropical plants. Now they will be famous for one more thing: the world’s first green airport.\nThis group of islands off the coast of Ecuador has recently contracted Argentine Corporación America to manage the redevelopment of the airport on the island of Baltra. It is estimated that US$20 million is needed to complete the project by 2009. The new development has several important features: use of wind and solar energy, passive heating and cooling systems, as well as concrete runways in place of asphalt, which has a greater carbon footprint during its production cycle. This new development couldn’t be coming at a better time for the Galápagos, which were added to an environmental “danger list” in 2007.\nPacific islands like the Galápagos, Easter Island, and Tahiti, have economies that are driven almost completely by tourism. However, some people think these are “unsustainable models of development.” The number of visitors to the Galápagos rose more than 250% from 1990 to 2006, while the number of commercial flights to the area rose 193% from 2001 to 2006. These increases put great stress on the islands’ resources and environment. Air travel is especially criticized for exhausting natural resources and causing environmental damage. Thus, efforts are being made to reduce the environmental impact of the tourism industry. The greening of airports is just one of these attempts.\n\n▶ 第 48 題　What does the project in the second paragraph refer to?", "options": ["The plan to build a green airport.", "The research on the production of solar energy.", "The task of calculating a carbon footprint.", "The study on the exhaustion of natural resources."], "answer": 0, "answerLabel": "A", "source": "98 學測｜閱讀測驗｜第 48 題", "explanation": "the project 指前句的「重新開發 Baltra 島機場」，即建綠色機場的計畫。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 49, "question": "【閱讀測驗 第 49–52 題】\nAccording to popular folklore, many animals are smarter than they appear. Dogs bark before earthquakes; cattle predict rainfall by sitting on the ground. But cattle may have another hidden talent in telling which way is north.\nSmall animals such as mole rats living underground are known for the use of magnetism to navigate. Dr. Begall and her colleagues wanted to know whether larger mammals also have the ability to perceive magnetic fields. They investigated this possibility by studying images of thousands of cattle captured on Google Earth, a website that stitches together satellite photographs to produce an image of the Earth’s surface.\nGrazing animals are known to orient themselves in a way that minimizes wind chill from the north and maximizes the warmth of the sun when they are cold. The researchers therefore had to study a lot of cows grazing in lots of different places at different times of day, in order to average out these factors and see whether cattle could act like compass needles.\nThe researchers concluded that cattle do generally orient themselves in a north-south direction. This north-south preference has also been noted in flies, termites and honeybees. But unfortunately, even the high resolution of Google Earth is not powerful enough to tell which end of the cow is its head, and which its tail. The researchers were therefore unable to answer their research questions of whether cattle prefer to look north or south, and whether that differs in the northern and southern hemispheres.\n\n▶ 第 49 題　What is the article mainly about?", "options": ["The usefulness of Google Earth.", "Whether cattle are superior to other animals.", "Animals’ sensitivity to natural disasters.", "Whether cattle behave like compass needles."], "answer": 3, "answerLabel": "D", "source": "98 學測｜閱讀測驗｜第 49 題", "explanation": "全文探討牛是否能像指北針一樣辨別方向。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 50, "question": "【閱讀測驗 第 49–52 題】\nAccording to popular folklore, many animals are smarter than they appear. Dogs bark before earthquakes; cattle predict rainfall by sitting on the ground. But cattle may have another hidden talent in telling which way is north.\nSmall animals such as mole rats living underground are known for the use of magnetism to navigate. Dr. Begall and her colleagues wanted to know whether larger mammals also have the ability to perceive magnetic fields. They investigated this possibility by studying images of thousands of cattle captured on Google Earth, a website that stitches together satellite photographs to produce an image of the Earth’s surface.\nGrazing animals are known to orient themselves in a way that minimizes wind chill from the north and maximizes the warmth of the sun when they are cold. The researchers therefore had to study a lot of cows grazing in lots of different places at different times of day, in order to average out these factors and see whether cattle could act like compass needles.\nThe researchers concluded that cattle do  But unfortunately, even the high resolution of Google Earth is not powerful enough to tell which end of the cow is its head, and which its tail. The researchers were therefore unable to answer their research questions of whether cattle prefer to look north or south, and whether that differs in the northern and southern hemispheres.\n\n▶ 第 52 題　Why couldn’t the researchers get the answer to their research questions?", "options": ["Many cattle in their study were sitting on the ground.", "The cattle constantly change directions to avoid wind chill.", "There is magnetic difference between the two hemispheres.", "They couldn’t tell a cow’s head from its tail in the satellite pictures."], "answer": 3, "answerLabel": "D", "source": "98 學測｜閱讀測驗｜第 52 題", "explanation": "第四段末：Google Earth 解析度不足以分辨牛的頭和尾，因此無法回答牛是面向北或南。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nChildren normally have a distrust of new foods. But it’s the parents’ job to serve a variety of foods and expose their children to healthy dieting habits.\nSome simple strategies can help even the pickiest eater learn to like a more varied diet. First of all, you don’t have to send children out of the kitchen. With hot stoves, boiling water and sharp knives at hand, it is understandable that parents don’t want children in the kitchen when they’re making dinner. But studies suggest that involving children in meal preparation is an important first step in getting them to try new foods. In one study, nearly 600 children from kindergarten to sixth grade took part in a nutrition curriculum intended to get them to eat more vegetables and whole grains. The researchers found that children who had cooked their own foods were more likely to eat those foods in the cafeteria than children who had not. Kids don’t usually like radishes, but if kids cut them up and put them in the salad, they will love the dish.\nAnother strategy is not to diet in front of your children. Kids are tuned into their parents’ eating preferences and are far more likely to try foods if they see their mother or father eating them. Given this powerful effect, parents who are trying to lose weight should be careful of how their dieting habits can influence a child’s perceptions about food and healthful eating. In one study of 5-year-old girls about dieting, one child noted that dieting involved drinking chocolate milkshakes, because her mother was using Slim-Fast drinks. Another child said dieting meant “you fix food but you don’t eat it.” By exposing young children to erratic dieting habits, parents may be putting them at risk for eating disorders.\n\n▶ 第 53 題　What is the main purpose of this article?", "options": ["To explain what causes children’s eating disorder.", "To teach children about the meal preparation process.", "To advocate the importance of vegetables and whole grains.", "To inform parents how they can help their children like varied foods."], "answer": 3, "answerLabel": "D", "source": "98 學測｜閱讀測驗｜第 53 題", "explanation": "第一段與全文：父母的工作是讓孩子接觸多樣食物，並提供兩個策略——告訴父母如何幫助孩子喜歡多樣化飲食。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nChildren normally have a distrust of new foods. But it’s the parents’ job to serve a variety of foods and expose their children to healthy dieting habits.\nSome simple strategies can help even the pickiest eater learn to like a more varied diet. First of all, you don’t have to send children out of the kitchen. With hot stoves, boiling water and sharp knives at hand, it is understandable that parents don’t want children in the kitchen when they’re making dinner. But studies suggest that involving children in meal preparation is an important first step in getting them to try new foods. In one study, nearly 600 children from kindergarten to sixth grade took part in a nutrition curriculum intended to get them to eat more vegetables and whole grains. The researchers found that children who had cooked their own foods were more likely to eat those foods in the cafeteria than children who had not. Kids don’t usually like radishes, but if kids cut them up and put them in the salad, they will love the dish.\nAnother strategy is not to diet in front of your children. Kids are tuned into their parents’ eating preferences and are far more likely to try foods if they see their mother or father eating them. Given this powerful effect, parents who are trying to lose weight should be careful of how their dieting habits can influence a child’s perceptions about food and healthful eating. In one study of 5-year-old girls about dieting, one child noted that dieting involved drinking chocolate milkshakes, because her mother was using Slim-Fast drinks. Another child said dieting meant “you fix food but you don’t eat it.” By exposing young children to erratic dieting habits, parents may be putting them at risk for eating disorders.\n\n▶ 第 54 題　Which of the following groups will eat more balanced meals?", "options": ["The children who help cook food.", "The children whose parents are on a diet.", "The children who do not love radishes.", "The children whose parents work in a cafeteria."], "answer": 0, "answerLabel": "A", "source": "98 學測｜閱讀測驗｜第 54 題", "explanation": "第二段：研究發現「自己動手煮過的孩子」較願意在餐廳吃那些食物。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 55, "question": "【閱讀測驗 第 53–56 題】\nChildren normally have a distrust of new foods. But it’s the parents’ job to serve a variety of foods and expose their children to healthy dieting habits.\nSome simple strategies can help even the pickiest eater learn to like a more varied diet. First of all, you don’t have to send children out of the kitchen. With hot stoves, boiling water and sharp knives at hand, it is understandable that parents don’t want children in the kitchen when they’re making dinner. But studies suggest that involving children in meal preparation is an important first step in getting them to try new foods. In
