cy", "departure"], "answer": 3, "answerLabel": "D", "source": "104 學測｜詞彙｜第 5 題", "explanation": "機場關閉，飛往巴黎的「出發」延到隔天：departure。movement 移動、registration 登記、tendency 傾向。", "explanationSource": "own", "section": "詞彙"}, {"id": 6, "question": "第 6 題　The moment the students felt the earthquake, they ran ______ out of the classroom to an open area outside.", "options": ["swiftly", "nearly", "loosely", "formally"], "answer": 0, "answerLabel": "A", "source": "104 學測｜詞彙｜第 6 題", "explanation": "感覺到地震就「迅速」跑出教室：swiftly。nearly 幾乎、loosely 鬆散地、formally 正式地。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　The ______ capacity of this elevator is 400 kilograms. For safety reasons, it shouldn’t be overloaded.", "options": ["delicate", "automatic", "essential", "maximum"], "answer": 3, "answerLabel": "D", "source": "104 學測｜詞彙｜第 7 題", "explanation": "電梯「最大」載重 400 公斤，不可超載：maximum capacity。delicate 精細的、automatic 自動的、essential 必要的。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　An open display of ______ behavior between men and women, such as hugging and kissing, is not allowed in some conservative societies.", "options": ["intimate", "ashamed", "earnest", "urgent"], "answer": 0, "answerLabel": "A", "source": "104 學測｜詞彙｜第 8 題", "explanation": "擁抱、親吻等「親密」行為在保守社會不被允許公開：intimate。ashamed 羞愧的、earnest 認真的、urgent 緊急的。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　When taking medicine, we should read the instructions on the ______ carefully because they provide important information such as how and when to take it.", "options": ["medals", "quotes", "labels", "recipes"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 9 題", "explanation": "吃藥前要仔細閱讀「標籤」上的說明：labels。medal 獎牌、quote 引言、recipe 食譜。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　The angry passengers argued ______ with the airline staff because their flight was cancelled without any reason.", "options": ["evidently e paperclip played an important __37__ role in Norway. During World War II, Norway was occupied by the Nazis. Norwegians were prohibited from wearing any __38__ of their national unity, such as buttons with the initials of their king. Thus, in __39__, they started wearing paperclips to show their solidarity. The reason for doing this was simple: Paperclips were a Norwegian invention whose original function was to bind together. After the war, a giant paperclip statue was erected in Oslo to __40__ Vaaler—even though his design was never actually manufactured.\n\n▶ 第 40 題　請從 (A)–(J) 選出最適合 __40__ 的字（每個選項只用一次）", "options": ["familiar", "honor", "device", "removable", "known as", "protest", "symbol", "twisted into", "associated with", "historical"], "answer": 1, "answerLabel": "B", "source": "104 學測｜文意選填｜第 40 題", "explanation": "戰後在奧斯陸立了巨大迴紋針雕像以「紀念」Vaaler：to honor Vaaler。(B) honor。", "explanationSource": "own", "section": "文意選填"}, {"id": 41, "question": "【閱讀測驗 第 41–44 題】\nIn 2009, the Taiwu Elementary School Folk Singers were invited to perform in Belgium, France, Germany, and Luxemburg. In 2011, they were voted as one of the world’s top five performance groups by audiences of Japan Broadcasting Corporation’s Amazing Voice program.\nRecalling the group’s first tour in Europe, Camake Valaule, a physical education teacher and the founder of the Taiwu Elementary School Folk Singers, admitted that he felt very nervous. He was worried that the audience would fall asleep since most of the 75-minute performance was a cappella, that is, singing without instrumental sound. Surprisingly, the audience listened with full focus and high spirits. Camake said, “They told me afterward that through our performance, they had a vision of our country, our village, without having to visit it. This experience greatly boosted our confidence.”\nAccording to Camake Valaule, singing traditional ballads has helped students and their parents to re-understand their culture. “It used to be that the only ones who could sing these songs were tribal elders aged between 50 and 60. Now with the children performing the pieces, parents are beginning to ask, ‘Why do we not know how to sing these ballads?’ Many times nowadays, it is the children who teach the songs to their parents, putting back the pieces of a blurred memory.”\nWinning international fame, however, was neither the original intention nor the main reason why Camake founded the group in 2006. The most important thing was to make children understand why they sing these songs and to preserve and pass on their culture. Referring to the relocation of Taiwu Elementary School and Taiwu Village following Typhoon Morakot in August 2009, Camake said, “We could not take the forest or our houses in the mountains with us; but we were able to bring our culture along. As long as the children are willing to sing, I will always be there for them, singing with them and leading them to experience the meaning of the ballads.”\n\n▶ 第 41 題　Which of the following is true about Taiwu Elementary School Folk Singers?", "options": ["The group was first established in 2009.", "The group was founded by a PE teacher.", "The singers usually sing popular folk songs.", "The singers learn to sing from their parents."], "answer": 1, "answerLabel": "B", "source": "104 學測｜閱讀測驗｜第 41 題", "explanation": "第二段：創辦人 Camake Valaule 是「體育老師」。(B)。(A) 錯：2006 年成立；(C) 錯：唱傳統古謠；(D) 相反：是孩子教父母。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 42, "question": "【閱讀測驗 第 41–44 題】\nIn 2009, the Taiwu Elementary School Folk Singers were invited to perform in Belgium, France, Germany, and Luxemburg. In 2011, they were voted as one of the world’s top five performance groups by audiences of Japan Broadcasting Corporation’s Amazing Voice program.\nRecalling the group’s first tour in Europe, Camake Valaule, a physical education teacher and the founder of the Taiwu Elementary School Folk Singers, admitted that he felt very nervous. He was worried that the audienc s came back negative, more were ordered, and she was hospitalized as a precaution when she developed a cold. She had as many as 25 doctor visits during one six-month period. The couple was spending about $30,000 a year for her care.\nAfter several years of physical suffering and near financial ruin from the medical costs, the couple began questioning the treatment after consulting with other patients in online support groups. “It’s a really hard thing to determine when they’ve crossed the line,” Mr. Power said. “You think she’s getting the best care in the world, but after a while you start to wonder: What is the objective?” Mr. Power then spoke with his own primary care doctor, who advised him to find a new specialist to oversee Mrs. Power’s care. Under the new doctor’s care, the regular testing stopped and Mrs. Power’s condition stabilized. Now she sees the doctor only four or five times a year.\n\n▶ 第 45 題　What is the main idea of this passage?", "options": ["Treatments do not always cause harmful side effects.", "Patients tend to believe more testing is better treatment.", "Too much medical care may not be beneficial to patients.", "Doctors generally recommend office visits that are necessary."], "answer": 2, "answerLabel": "C", "source": "104 學測｜閱讀測驗｜第 45 題", "explanation": "第一段：過度治療——太多掃描、驗血、處置——可能造成傷害；全文以 Power 太太為例。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 46, "question": "【閱讀測驗 第 45–48 題】\nWhen it comes to medical care, many patients and doctors believe “more is better.” But what they do not realize is that overtreatment—too many scans, too many blood tests, too many procedures—may pose harm. Sometimes a test leads you down a path to more and more testing, some of which may be invasive, or to treatment for things that should be left alone.\nTerrence Power, for example, complained that after his wife learned she had Wegener’s disease, an uncommon disorder of the immune system, they found it difficult to refuse testing recommended by her physician. The doctor insisted on office visits every three weeks, even when she was feeling well. He frequently ordered blood tests and X-rays, and repeatedly referred her to specialists for even minor complaints. Even when tests came back negative, more were ordered, and she was hospitalized as a precaution when she developed a cold. She had as many as 25 doctor visits during one six-month period. The couple was spending about $30,000 a year for her care.\nAfter several years of physical suffering and near financial ruin from the medical costs, the couple began questioning the treatment after consulting with other patients in online support groups. “It’s a really hard thing to determine when they’ve crossed the line,” Mr. Power said. “You think she’s getting the best care in the world, but after a while you start to wonder: What is the objective?” Mr. Power then spoke with his own primary care doctor, who advised him to find a new specialist to oversee Mrs. Power’s care. Under the new doctor’s care, the regular testing stopped and Mrs. Power’s condition stabilized. Now she sees the doctor only four or five times a year.\n\n▶ 第 46 題　Which of the following was a problem for Mrs. Power during her medical treatment?", "options": ["She had to be hospitalized for three weeks whenever she had a cold.", "She didn’t have any insurance, so she went broke because of her illness.", "When test results showed she was fine, her doctor still ordered more tests.", "Her doctor asked her to consult other specialists due to her constant complaints."], "answer": 2, "answerLabel": "C", "source": "104 學測｜閱讀測驗｜第 46 題", "explanation": "第二段：即使檢驗結果是陰性，醫生仍開更多檢查。(C)。(A) 錯：感冒住院是預防措施，非三週；(D) 錯：是輕微不適就轉診。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 47, "question": "【閱讀測驗 第 45–48 題】\nWhen it comes to medical care, many patients and doctors believe “more is better.” But what they do not realize is that overtreatment—too many scans, too many blood tests, too many procedures—may pose harm. Sometimes a test leads you down a path to more and more testing, some of which may be invasive, or to treatment for things that should be left alone.\nTerrence Power, for example, complained that after his wife learned she had Wegener’s disease, an uncommon disorder of the immune system, they found it difficult to refuse testing recommended by her physician. The doctor insisted on office visits every three weeks, even when she was feeling well. He frequently ordered blood tests and X-rays, and repeatedly referred her to specialists for even minor complaints. Even when tests came back negative, more were ordered, and she was hospitalized as a precaution when she developed a cold. She had as many as 25 doctor visits during one six-month period. The couple was spending about $30,000 a year for her care.\nAfter several years of physical suffering and near financial ruin from the medical costs, the couple began questioning the treatment after consulting with other patients in online support groups. “It’s a really hard thing to determine when they’ve crossed the line,” Mr. Power said. “You think she’s getting the best care in the world, but after a while you start to wonder: What is the objective?” Mr. Power then spoke with his own primary care doctor, who advised him to find a new specialist to oversee Mrs. Power’s care. Under the new doctor’s care, the regular testing stopped and Mrs. Power’s condition stabilized. Now she sees the doctor only four or five times a year.\n\n▶ 第 47 題　Who does “they” in the third paragraph most likely refer to?", "options": ["Physicians.", "Other patients.", "Mr. and Mrs. Power.", "The online support groups."], "answer": 0, "answerLabel": "A", "source": "104 學測｜閱讀測驗｜第 47 題", "explanation": "「很難判斷他們何時越線了」——指過度開檢查的醫生。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 48, "question": "【閱讀測驗 第 45–48 題】\nWhen it comes to medical care, many patients and doctors believe “more is better.” But what they do not realize is that overtreatment—too many scans, too many blood tests, too many procedures—may pose harm. Sometimes a test leads you down a path to more and more testing, some of which may be invasive, or to treatment for things that should be left alone.\nTerrence Power, for example, complained that after his wife learned she had Wegener’s disease, an uncommon disorder of the immune system, they found it difficult to refuse testing recommended by her physician. The doctor insisted on office visits every three weeks, even when she was feeling well. He frequently ordered blood tests and X-rays, and repeatedly referred her to specialists for even minor complaints. Even when tests came back negative, more were ordered, and she was hospitalized as a precaution when she developed a cold. She had as many as 25 doctor visits during one six-month period. The couple was spending about $30,000 a year for her care.\nAfter several years of physical suffering and near financial ruin from the medical costs, the couple began questioning the treatment after consulting with other patients in online support groups. “It’s a really hard thing to determine when they’ve crossed the line,” Mr. Power said. “You think she’s getting the best care in the world, but after a while you start to wonder: What is the objective?” Mr. Power then spoke with his own primary care doctor, who advised him to find a new specialist to oversee Mrs. Power’s care. Under the new doctor’s care, the regular testing stopped and Mrs. Power’s condition stabilized. Now she sees the doctor only four or five times a year.\n\n▶ 第 48 題　Which of the following best describes the author’s attitude toward medical tests?", "options": ["More tests than necessary are too much.", "Medical tests are essential for disease prevention.", "Many tests are needed for confirmation of diagnosis.", "Doctors’ interpretations of test results are seldom wrong."], "answer": 0, "answerLabel": "A", "source": "104 學測｜閱讀測驗｜第 48 題", "explanation": "作者以 overtreatment 可能有害為題，並以案例說明——超過必要的檢查就是太多。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 49, "question": "【閱讀測驗 第 49–52 題】\nHenri Cartier-Bresson (1908–2004) is one of the most original and influential figures in the history of photography. His humane, spontaneous photographs helped establish photojournalism as an art form.\nCartier-Bresson’s family was wealthy—his father made a fortune as a textile manufacturer—but Cartier-Bresson later joked that due to his parents’ frugal ways, it often seemed as though his family was poor.\nEducated in Paris, Cartier-Bresson developed an early love for literature and the arts. As a teenager, Cartier-Bresson rebelled against his parents’ formal ways of education. In his early adulthood, he even drifted toward communism. But it was art that remained at the center of his life.\nCartier-Bresson traveled to Africa in 1931 to hunt antelope and boar. And Africa fueled another interest in him: photography. He then wandered around the world with his camera, using a handheld camera to catch images from fleeting moments of everyday life.\nNot long after World War II, Cartier-Bresson traveled east, spending considerable time in India, where he met and photographed Gandhi shortly before his assassination in 1948. Cartier-Bresson’s subsequent work to document Gandhi’s death and its immediate impact on the country became one of Life Magazine’s most prized photo essays.\nCartier-Bresson’s approach to photography remained much the same throughout his life. He made clear his dislike of images that had been improved by artificial light, darkroom effects, and even cropping. The naturalist in Cartier-Bresson believed that all editing should be done when the photo is taken. In 1952, his first book, The Decisive Moment, a rich collection of his work spanning two decades, was published. “There is nothing in this world that does not have a decisive moment,” he said.\nIn 1968, he began to turn away from photography and returned to his passion for drawing and painting.\n\n▶ 第 49 題　Which of the following best describes Cartier-Bresson’s family background?", "options": ["His family was rich but was very economical.", "His father went to Paris to open a textile factory.", "His wealthy family went bankrupt and became poor.", "His parents were very liberal in their ways of education."], "answer": 0, "answerLabel": "A", "source": "104 學測｜閱讀測驗｜第 49 題", "explanation": "第二段：家境富裕，但父母節儉到常讓人覺得家裡很窮——有錢但很節省。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 50, "question": "【閱讀測驗 第 49–52 題】\nHenri Cartier-Bresson (1908–2004) is one of the most original and influential figures in the history of photography. His humane, spontaneous photographs helped establish photojournalism as an art form.\nCartier-Bresson’s family was wealthy—his father made a fortune as a textile manufacturer—but Cartier-Bresson later joked that due to his parents’ frugal ways, it often seemed as though his family was poor.\nEducated in Paris, Cartier-Bresson developed an early love for literature and the arts. As a teenager, Cartier-Bresson rebelled against his parents’ formal ways of education. In his early adulthood, he even drifted toward communism. But it was art that remained at the center of his life.\nCartier-Bresson traveled to Africa in 1931 to hunt antelope and boar. And Africa fueled another interest in him: photography. He then wandered around the world with his camera, using a handheld camera to catch images from fleeting moments of everyday life.\nNot long after World War II, Cartier-Bresson traveled east, spending considerable time in India, where he met and photographed Gandhi shortly before his assassination in 1948. Cartier-Bresson’s subsequent work to document Gandhi’s death and its immediate impact on the country became one of Life Magazine’s most prized photo essays.\nCartier-Bresson’s approach to photography remained much the same throughout his life. He made clear his dislike of images that had been improved by artificial light, darkroom effects, and even cropping. The naturalist in Cartier-Bresson believed that all editing should be done when the photo is taken. In 1952, his first book, The Decisive Moment, a rich collection of his work spanning two decades, was published. “There is nothing in this world that does not have a decisive moment,” he said.\nIn 1968, he began to turn away from photography and returned to his passion for drawing and painting.\n\n▶ 第 50 題　Which of the following is true about Cartier-Bresson’s career in photography?", "options": ["He devoted himself to photography all his life.", "He developed a passion for photography when he traveled to Africa.", "He quit photography right after the publication of The Decisive Moment.", "During World War II, he documented the everyday life of the Indian people."], "answer": 1, "answerLabel": "B", "source": "104 學測｜閱讀測驗｜第 50 題", "explanation": "第四段：1931 年到非洲打獵，非洲「點燃了他另一個興趣：攝影」。(B)。(A)(C) 錯：1968 年轉向繪畫；(D) 錯：是二戰後。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 51, "question": "【閱讀測驗 第 49–52 題】\nHenri Cartier-Bresson (1908–2004) is one of the most original and influential figures in the history of photography. His humane, spontaneous photographs helped establish photojournalism as an art form.\nCartier-Bresson’s family was wealthy—his father made a fortune as a textile manufacturer—but Cartier-Bresson later joked that due to his parents’ frugal ways, it often seemed as though his family was poor.\nEducated in Paris, Cartier-Bresson developed an early love for literature and the arts. As a teenager, Cartier-Bresson rebelled against his parents’ formal ways of education. In his early adulthood, he even drifted toward communism. But it was art that remained at the center of his life.\nCartier-Bresson traveled to Africa in 1931 to hunt antelope and boar. And Africa fueled another interest in him: photography. He then wandered around the world with his camera, using a handheld camera to catch images from fleeting moments of everyday life.\nNot long after World War II, Cartier-Bresson traveled east, spending considerable time in India, where he met and photographed Gandhi shortly before his assassination in 1948. Cartier-Bresson’s subsequent work to document Gandhi’s death and its immediate impact on the country became one of Life Magazine’s most prized photo essays.\nCartier-Bresson’s approach to photography remained much the same throughout his life. He made clear his dislike of images that had been improved by artificial light, darkroom effects, and even cropping. The naturalist in Cartier-Bresson believed that all editing should be done when the photo is taken. In 1952, his first book, The Decisive Moment, a rich collection of his work spanning two decades, was published. “There is nothing in this world that does not have a decisive moment,” he said.\nIn 1968, he began to turn away from photography and returned to his passion for drawing and painting.\n\n▶ 第 51 題　What significance did Cartier-Bresson have to Gandhi of India?", "options": ["He witnessed Gandhi’s assassination in 1948.", "He was the first photographer to take Gandhi’s photo.", "He used photos to document the effect of Gandhi’s death on India.", "His photos told the world who was guilty of assassinating Gandhi."], "answer": 2, "answerLabel": "C", "source": "104 學測｜閱讀測驗｜第 51 題", "explanation": "第五段：他記錄甘地之死及其對印度的衝擊，成為 Life 雜誌最珍貴的攝影專題之一。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 52, "question": "【閱讀測驗 第 49–52 題】\nHenri Cartier-Bresson (1908–2004) is one of the most original and influential figures in the history of photography. His humane, spontaneous photographs helped establish photojournalism as an art form.\nCartier-Bresson’s family was wealthy—his father made a fortune as a textile manufacturer—but Cartier-Bresson later joked that due to his parents’ frugal ways, it often seemed as though his family was poor.\nEducated in Paris, Cartier-Bresson developed an early love for literature and the arts. As a teenager, Cartier-Bresson rebelled against his parents’ formal ways of education. In his early adulthood, he even drifted toward communism. But it was art that remained at the center of his life.\nCartier-Bresson traveled to Africa in 1931 to hunt antelope and boar. And Africa fueled another interest in him: photography. He then wandered around the world with his camera, using a handheld camera to catch images from fleeting moments of everyday life.\nNot long after World War II, Cartier-Bresson traveled east, spending considerable time in India, where he met and photographed Gandhi shortly before his assassination in 1948. Cartier-Bresson’s subsequent work to document Gandhi’s death and its immediate impact on the country became one of Life Magazine’s most prized photo essays.\nCartier-Bresson’s approach to photography remained much the same throughout his life. He made clear his dislike of images that had been improved by artificial light, darkroom effects, and even cropping. The naturalist in Cartier-Bresson believed that all editing should be done when the photo is taken. In 1952, his first book, The Decisive Moment, a rich collection of his work spanning two decades, was published. “There is nothing in this world that does not have a decisive moment,” he said.\nIn 1968, he began to turn away from photography and returned to his passion for drawing and painting.\n\n▶ 第 52 題　Which of the following is true about Cartier-Bresson’s approach to photography?", "options": ["He never waited for a decisive moment to shoot photos.", "He preferred to edit his images carefully in his darkroom.", "Most of his photos described things that happen every day.", "He experimented with different ways and settled on being a naturalist."], "answer": 2, "answerLabel": "C", "source": "104 學測｜閱讀測驗｜第 52 題", "explanation": "第四段：用手持相機捕捉「日常生活稍縱即逝的瞬間」。(C)。(B) 相反：他討厭暗房效果與裁切。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nYou’ve most likely heard the news by now: A car-commuting, desk-bound, TV-watching lifestyle can be harmful to our health. All the time that we spend rooted in the chair is linked to increased risks of so many deadly diseases that experts have named this modern-day health epidemic the “sitting disease.”\nSitting for too long slows down the body’s metabolism and the way enzymes break down our fat reserves, raising both blood sugar levels and blood pressure. Small amounts of regular activity, even just standing and moving around, throughout the day is enough to bring the increased levels back down. And those small amounts of activity add up—30 minutes of light activity in two or three-minute bursts can be just as effective as a half-hour block of exercise. But without that activity, blood sugar levels and blood pressure keep creeping up, steadily damaging the inside of the arteries and increasing the risk of diabetes, heart disease, stroke, and other serious diseases. In essence, fundamental changes in biology occur if you sit for too long.\nBut wait, you’re a runner. You needn’t worry about the harm of a sedentary lifestyle because you exercise regularly, right? Well, not so fast. Recent studies show that people spend an average of 64 hours a week sitting, whether or not they exercise 150 minutes a week as recommended by World Health Organization (WHO). Regular exercisers, furthermore, are found to be about 30 percent less active on days when they exercise. Overall, most people simply aren’t exercising or moving around enough to counteract all the harm that can result from sitting nine hours or more a day.\nScared straight out of your chair? Good. The remedy is as simple as standing up and taking activity breaks.\n\n▶ 第 53 題　What is the purpose of this passage?", "options": ["To point out the challenges of the modern lifestyle.", "To discuss how a modern epidemic may spread quickly.", "To explore the effects of regular exercise to our body.", "To explain the threat to our health from long hours of sitting."], "answer": 3, "answerLabel": "D", "source": "104 學測｜閱讀測驗｜第 53 題", "explanation": "全文說明久坐被稱為 sitting disease，講久坐對健康的威脅。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nYou’ve most likely heard the news by now: A car-commuting, desk-bound, TV-watching lifestyle can be harmful to our health. All the time that we spend rooted in the chair is linked to increased risks of so many deadly diseases that experts have named this modern-day health epidemic the “sitting disease.”\nSitting for too long slows down the body’s metabolism and the way enzymes break down our fat reserves, raising both blood sugar levels and blood pressure. Small amounts of regular activity, even just standing and moving around, throughout the day is enough to bring the increased levels back down. And those small amounts of activity add up—30 minutes of light activity in two or three-minute bursts can be just as effective as a half-hour block of exercise. But without that activity, blood sugar levels and blood pressure keep creeping up, steadily damaging the inside of the arteries and increasing the risk of diabetes, heart disease, stroke, and other serious diseases. In essence, fundamental changes in biology occur if you sit for too long.\nBut wait, you’re a runner. You needn’t worry about the harm of a sedentary lifestyle because you exercise regularly, right? Well, not so fast. Recent studies show that people spend an average of 64 hours a week sitting, whether or not they exercise 150 minutes a week as recommended by World Health Organization (WHO). Regular exercisers, furthermore, are found to be about 30 percent less active on days when they exercise. Overall, most people simply aren’t exercising or moving around enough to counteract all the harm that can result from sitting nine hours or more a day.\nScared straight out of your chair? Good. The remedy is as simple as standing up and taking activity breaks.\n\n▶ 第 54 題　What does the word “se hair? Good. The remedy is as simple as standing up and taking activity breaks.\n\n▶ 第 55 題　What is the best way to bring down high blood sugar level and blood pressure?", "options": ["Exercising for 150 minutes or more every week.", "Getting rid of the habit of car commuting and TV watching.", "Interrupting sitting time with light activity as often as possible.", "Standing or moving around for at least two or three minutes every day."], "answer": 2, "answerLabel": "C", "source": "104 學測｜閱讀測驗｜第 55 題", "explanation": "第二段：一整天中少量、規律的活動，兩三分鐘的短暫活動累加起來就有效——盡量用輕度活動打斷久坐。(C)。(A) 錯：第三段說每週 150 分鐘仍不夠。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 56, "question": "【閱讀測驗 第 53–56 題】\nYou’ve most likely heard the news by now: A car-commuting, desk-bound, TV-watching lifestyle can be harmful to our health. All the time that we spend rooted in the chair is linked to increased risks of so many deadly diseases that experts have named this modern-day health epidemic the “sitting disease.”\nSitting for too long slows down the body’s metabolism and the way enzymes break down our fat reserves, raising both blood sugar levels and blood pressure. Small amounts of regular activity, even just standing and moving around, throughout the day is enough to bring the increased levels back down. And those small amounts of activity add up—30 minutes of light activity in two or three-minute bursts can be just as effective as a half-hour block of exercise. But without that activity, blood sugar levels and blood pressure keep creeping up, steadily damaging the inside of the arteries and increasing the risk of diabetes, heart disease, stroke, and other serious diseases. In essence, fundamental changes in biology occur if you sit for too long.\nBut wait, you’re a runner. You needn’t worry about the harm of a sedentary lifestyle because you exercise regularly, right? Well, not so fast. Recent studies show that people spend an average of 64 hours a week sitting, whether or not they exercise 150 minutes a week as recommended by World Health Organization (WHO). Regular exercisers, furthermore, are found to be about 30 percent less active on days when they exercise. Overall, most people simply aren’t exercising or moving around enough to counteract all the harm that can result from sitting nine hours or more a day.\nScared straight out of your chair? Good. The remedy is as simple as standing up and taking activity breaks.\n\n▶ 第 56 題　Which of the following may be inferred about those who do serious exercise?", "options": ["They often live longer than those who don’t exercise.", "They tend to stand or move around less on days they work out.", "They generally spend less time sitting than those who are inactive.", "They usually do not meet the standard of exercise recommended by WHO."], "answer": 1, "answerLabel": "B", "source": "104 學測｜閱讀測驗｜第 56 題", "explanation": "第三段：規律運動者在運動當天「其他時間活動量少約 30%」。(B)。(C) 錯：不論是否運動，平均都坐 64 小時。", "explanationSource": "own", "section": "閱讀測驗"}]};</script><script>(function(){var M={};window.QUIZ_CONFIG.questions.forEach(function(q){if(q.image)M[q.question]=q.image});var qn=document.getElementById("question");if(!qn)return;function put(){var old=document.getElementById("gsatImg");var src=M[qn.textContent];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement("img");im.id="gsatImg";im.dataset.src=src;im.src=src;im.alt="題目圖片";im.style.cssText="display:block;max-width:100%;max-height:520px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;background:#fff";qn.insertAdjacentElement("afterend",im)}new MutationObserver(put).observe(qn,{childList:true,characterData:true,subtree:true});})();</script><script src="quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="104 年學測英文：詞彙 15＋綜合測驗 15＋文意選填 10＋閱讀測驗 16｜共 56 題｜單選｜附中文解析｜Level 3–6 單字滑過即看中譯與字卡｜可隨機 20 題、隨時結束並下載 DOCX 錯題";</script><script src="lexicon.js?v=20261120-5"></script><script src="vocab-hover.js?v=
