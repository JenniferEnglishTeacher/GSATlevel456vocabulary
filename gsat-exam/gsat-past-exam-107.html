<script>window.QUIZ_CONFIG={"title": "107 年學測英文｜詞彙＋綜合測驗＋文意選填＋閱讀測驗", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Mangoes are a ______ fruit here in Taiwan; most of them reach their peak of sweetness in July.", "options": ["mature", "usual", "seasonal", "particular"], "answer": 2, "answerLabel": "C", "source": "107 學測｜詞彙｜第 1 題", "explanation": "七月最甜，表示芒果是「季節性」水果：seasonal。mature 成熟的、usual 平常的、particular 特定的。", "explanationSource": "own", "section": "詞彙"}, {"id": 2, "question": "第 2 題　Writing term papers and giving oral reports are typical course ______ for college students.", "options": ["requirements", "techniques", "situations", "principles"], "answer": 0, "answerLabel": "A", "source": "107 學測｜詞彙｜第 2 題", "explanation": "寫報告和口頭報告是大學課程的典型「要求」：requirements。technique 技巧、situation 情況、principle 原則。", "explanationSource": "own", "section": "詞彙"}, {"id": 3, "question": "第 3 題　If we work hard to ______ our dreams when we are young, we will not feel that we missed out on something when we get old.", "options": ["distribute", "fulfill", "convince", "monitor"], "answer": 1, "answerLabel": "B", "source": "107 學測｜詞彙｜第 3 題", "explanation": "年輕時努力「實現」夢想，老了才不會覺得錯過什麼：fulfill。distribute 分配、convince 說服、monitor 監控。", "explanationSource": "own", "section": "詞彙"}, {"id": 4, "question": "第 4 題　Few people will trust you if you continue making ______ promises and never make efforts to keep them.", "options": ["chilly", "liberal", "hollow", "definite"], "answer": 2, "answerLabel": "C", "source": "107 學測｜詞彙｜第 4 題", "explanation": "一直做「空洞的」承諾又不守信，沒人會信任你：hollow promises。chilly 寒冷的、liberal 自由的、definite 明確的。", "explanationSource": "own", "section": "詞彙"}, {"id": 5, "question": "第 5 題　Becky ______ her ankle while she was playing tennis last week. Now it still hurts badly.", "options": ["slipped", "dumped", "twisted", "recovered"], "answer": 2, "answerLabel": "C", "source": "107 學測｜詞彙｜第 5 題", "explanation": "打網球「扭傷」腳踝，現在還很痛：twisted her ankle。slip 滑倒、dump 丟棄、recover 恢復。", "explanationSou e house for public tours, and it has remained open, except during wartime, ever since. In addition, Jefferson welcomed visitors to annual receptions on New Year’s Day and on the Fourth of July. Abraham Lincoln did the same, but then the inaugural crowds became far too large for the White House to accommodate comfortably, and this also created a security issue. It was not until Grover Cleveland’s first presidency that some effective crowd control measures were implemented to address the problem caused by this practice.\nAt various times in history, the White House has been known as the “President’s Palace,” the “President’s House,” and the “Executive Mansion.” President Theodore Roosevelt officially gave the White House its current name in 1901.\n\n▶ 第 41 題　What is this passage mainly about?", "options": ["The design of the White House.", "The location of the White House.", "The importance of the White House.", "The history of the White House."], "answer": 3, "answerLabel": "D", "source": "107 學測｜閱讀測驗｜第 41 題", "explanation": "從 1790 選址、1792 動工、1800 入住，到歷任總統的開放傳統與 1901 定名——白宮的歷史。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 42, "question": "【閱讀測驗 第 41–44 題】\nFor more than two hundred years, the White House has stood as a symbol of the United States Presidency, the U.S. government, and the American people. In 1790, President George Washington declared that the federal government would reside in a district “not exceeding ten miles square … on the river Potomac.” As preparations began, a competition was held to find a builder of the “President’s House.” Nine proposals were submitted, and the Irish-born architect James Hoban won the gold medal for his practical and handsome design. Construction began when the first cornerstone was laid in October of 1792. Although President Washington oversaw the construction of the house, he never lived in it. It was not until 1800, when the White House was nearly completed, that its first residents, President John Adams nment, and the American people. In 1790, President George Washington declared that the federal government would reside in a district “not exceeding ten miles square … on the river Potomac.” As preparations began, a competition was held to find a builder of the “President’s House.” Nine proposals were submitted, and the Irish-born architect James Hoban won the gold medal for his practical and handsome design. Construction began when the first cornerstone was laid in October of 1792. Although President Washington oversaw the construction of the house, he never lived in it. It was not until 1800, when the White House was nearly completed, that its first residents, President John Adams and his wife Abigail, moved in.\nAmerican presidents can express their individual style in how they decorate the house and in how they receive the public. Thomas Jefferson held the first inaugural open house in 1805; many of those who attended the swearing-in ceremony at the U.S. Capitol simply followed him home. President Jefferson also opened the house for public tours, and it has remained open, except during wartime, ever since. In addition, Jefferson welcomed visitors to annual receptions on New Year’s Day and on the Fourth of July. Abraham Lincoln did the same, but then the inaugural crowds became far too large for the White House to accommodate comfortably, and this also created a security issue. It was not until Grover Cleveland’s first presidency that some effective crowd control measures were implemented to address the problem caused by this practice.\nAt various times in history, the White House has been known as the “President’s Palace,” the “President’s House,” and the “Executive Mansion.” President Theodore Roosevelt officially gave the White House its current name in 1901.\n\n▶ 第 44 題　According to the passage, which of the following is NOT true about the White House?", "options": ["The White House has had several names.", "The designer of the White House was an American president.", "People were not allowed to visit the White House during wartime.", "The White House is located in a district not larger than ten miles square."], "answer": 1, "answerLabel": "B", "source": "107 學測｜閱讀測驗｜第 44 題", "explanation": "設計者 James Hoban 是愛爾蘭出生的建築師，不是總統。(B) 不正確。其他：三個舊名、戰時不開放、不超過十平方英里皆有提到。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 45, "question": "【閱讀測驗 第 45–48 題】\nWest Nile is a tropical disease that begins in birds, which pass it on to mosquitoes that then go on to infect human beings with a bite. Most people who contract West Nile do not experience any symptoms at all, but, if they do, symptoms typically develop between 3 to 14 days after a mosquito bite. About 5 persons suffers fever, headaches, and body aches, usually lasting a week or so. A far less lucky 150 experiences high fever, tremors, paralysis, and coma. Some—especially the elderly and those with weak immune systems—die.\nThat is what made the major outbreaks of West Nile in the U.S. in the summer of 2012 so scary. The situation was particularly bad in Dallas, Texas, where the West Nile virus killed 10 people and sickened more than 200. The city declared a state of emergency and began aerial spraying of a pesticide to kill the mosquitoes, even though residents argued that the pesticide could be more dangerous than the disease.\nWhy was the summer of 2012 so hospitable to the West Nile virus and the mosquitoes that carry it? Blame the weather. An extremely mild winter allowed more mosquitoes than usual to survive, while the unusually high temperatures in that scorching summer further increased their number by speeding up their life cycle. The economic crisis may have also played a role: Homeowners who were not able to pay their bank loans were forced to abandon their properties, sometimes leaving behind swimming pools that made excellent mosquito breeding grounds.\nThe severity of tropical diseases is also a matter of whether governments are capable—and willing—to defend their populations against infections. Dallas County was not doing some of the key things to slow the spread of West Nile, such as testing dead birds and setting mosquito traps to test for the presence of the disease. Tropical infections are thus as much related to government inaction as they are to climate.\n\n▶ 第 45 題　What is this passage mainly about?", "options": ["West Nile and methods to fight it.", "West Nile and governmental efficiency.", "West Nile and the conditions its virus thrives in.", "West Nile and its relation to tropical diseases."], "answer": 2, "answerLabel": "C", "source": "107 學測｜閱讀測驗｜第 45 題", "explanation": "第三段問「為什麼 2012 年夏天對病毒和蚊子如此有利」並說明天氣、經濟因素——病毒滋長的條件。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 46, "question": "【閱讀測驗 第 45–48 題】\nWest Nile is a tropical disease that begins in birds, which pass it on to mosquitoes that then go on to infect human beings with a bite. Most people who contract West Nile do not experience any symptoms at all, but, if they do, symptoms typically develop between 3 to 14 days after a mosquito bite. About 5 persons suffers fever, headaches, and body aches, usually lasting a week or so. A far less lucky 150 experiences high fever, tremors, paralysis, and coma. Some—especially the elderly and those with weak immune systems—die.\nThat is what made the major outbreaks of West Nile in the U.S. in the summer of 2012 so scary. The situation was particularly bad in Dallas, Texas, where the West Nile virus killed 10 people and sickened more than 200. The city declared a state of emergency and began aerial spraying of a pesticide to kill the mosquitoes, even though residents argued that the pesticide could be more dangerous than the disease.\nWhy was the summer of 2012 so hospitable to the West Nile virus and the mosquitoes that carry it? Blame the weather. An extremely mild winter allowed more mosquitoes than usual to survive, while the unusually high temperatures in that scorching summer further increased their ore than 200. The city declared a state of emergency and began aerial spraying of a pesticide to kill the mosquitoes, even though residents argued that the pesticide could be more dangerous than the disease.\nWhy was the summer of 2012 so hospitable to the West Nile virus and the mosquitoes that carry it? Blame the weather. An extremely mild winter allowed more mosquitoes than usual to survive, while the unusually high temperatures in that scorching summer further increased their number by speeding up their life cycle. The economic crisis may have also played a role: Homeowners who were not able to pay their bank loans were forced to abandon their properties, sometimes leaving behind swimming pools that made excellent mosquito breeding grounds.\nThe severity of tropical diseases is also a matter of whether governments are capable—and willing—to defend their populations against infections. Dallas County was not doing some of the key things to slow the spread of West Nile, such as testing dead birds and setting mosquito traps to test for the presence of the disease. Tropical infections are thus as much related to government inaction as they are to climate.\n\n▶ 第 47 題　What did Dallas County do to fight off West Nile?", "options": ["They sprayed pesticide from the air.", "They asked citizens to stay away from dead birds.", "They encouraged citizens to get vaccinations.", "They drained the swimming pools in the county."], "answer": 0, "answerLabel": "A", "source": "107 學測｜閱讀測驗｜第 47 題", "explanation": "第二段：達拉斯宣布緊急狀態，「空中噴灑」殺蟲劑。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 48, "question": "【閱讀測驗 第 45–48 題】\nWest Nile is a tropical disease that begins in birds, which pass it on to mosquitoes that then go on to infect human beings with a bite. Most people who contract West Nile do not experience any symptoms at all, but, if they do, symptoms typically develop between 3 to 14 days after a mosquito bite. About 5 persons suffers fever, headaches, and body aches, usually lasting a week or so. A far less lucky 150 experiences high fever, tremors, paralysis, and coma. Some—especially the elderly and those with weak immune systems—die.\nThat is what made the major outbreaks of West Nile in the U.S. in the summer of 2012 so scary. The situation was particularly bad in Dallas, Texas, where the West Nile virus killed 10 people and sickened more than 200. The city declared a state of emergency and began aerial spraying of a pesticide to kill the mosquitoes, even though residents argued that the pesticide could be more dangerous than the disease.\nWhy was the summer of 2012 so hospitable to the West Nile virus and the mosquitoes that carry it? Blame the weather. An extremely mild winter allowed more mosquitoes than usual to survive, while the unusually high temperatures in that scorching summer further increased their number by speeding up their life cycle. The economic crisis may have also played a role: Homeowners who were not able to pay their bank loans were forced to abandon their properties, sometimes leaving behind swimming pools that made excellent mosquito breeding grounds.\nThe severity of tropical diseases is also a matter of whether governments are capable—and willing—to defend their populations against infections. Dallas County was not doing some of the key things to slow the spread of West Nile, such as testing dead birds and setting mosquito traps to test for the presence of the disease. Tropical infections are thus as much related to government inaction as they are to climate.\n\n▶ 第 48 題　Which of the following is a reason why Dallas was hit most seriously in the U.S. in 2012?", "options": ["The increasing population in Texas raised the risk of contracting the disease.", "The government did not issue a warning about the disease in time.", "The residents worried about the county’s decision and action.", "The weather of the previous winter was not as cold as usual."], "answer": 3, "answerLabel": "D", "source": "107 學測｜閱讀測驗｜第 48 題", "explanation": "第三段：異常溫暖的冬天讓更多蚊子存活。(D)。(B) 文中說郡政府沒做檢測死鳥等關鍵措施，但未提「警告不及時」。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 49, "question": "【閱讀測驗 第 49–52 題】\nMost parts of Taiwan have access to sufficient supplies of fresh water for drinking. But fresh water can be in short supply in many arid regions of the world such as Saudi Arabia, where there are limited water resources. As the world population continues to grow, shortages of fresh water will occur more often and the need for additional water supplies will become critical. Some may ask, “Since the ocean covers more than 70 percent of the Earth, why not just get drinking water from the ocean?”\nTo turn seawater into fresh water, we need to remove the salt in seawater, that is, to desalinate seawater. The problem is that the desalination of water requires a lot of energy. Salt dissolves very easily in water, forming strong chemical bonds, and those bonds are difficult to break. The energy and technology to desalinate water are both expensive, and this means that desalinating water can be costly.\nThere are environmental costs of desalination as well. Sea life can get sucked into desalination plants, killing small ocean creatures like baby fish and plankton, upsetting the food chain. Also, there is the problem of what to do with the separated salt, which is left over as a very concentrated brine. Pumping this super-salty water back into the ocean can harm local aquatic life. Reducing these impacts is possible, but it adds to the costs.\nDespite the economic and environmental hurdles, desalination is becoming increasingly attractive as human beings are using up fresh water from other sources. At present, desalinating seawater is the only viable way to provide water to growing populations in rural areas of the Middle East and North Africa. Therefore, the race is on to find a cheaper, cleaner, and more energy-efficient way of desalinating seawater, and promising new findings are being reported.\n\n▶ 第 49 題　Which of the following is closest in meaning to “arid” in the first paragraph?", "options": ["Occupied.", "Isolated.", "Dry.", "Remote."], "answer": 2, "answerLabel": "C", "source": "107 學測｜閱讀測驗｜第 49 題", "explanation": "arid 乾旱的；後文說沙烏地阿拉伯水資源有限。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 50, "question": "【閱讀測驗 第 49–52 題】\nMost parts of Taiwan have access to sufficient supplies of fresh water for drinking. But fresh water can be in short supply in many arid regions of the world such as Saudi Arabia, where there are limited water resources. As the world population continues to grow, shortages of fresh water will occur more often and the need for additional water supplies will become critical. Some may ask, “Since the ocean covers more than 70 percent of the Earth, why not just get drinking water from the ocean?”\nTo turn seawater into fresh water, we need to remove the salt in seawater, that is, to desalinate seawater. The problem is that the desalination of water requires a lot of energy. Salt dissolves very easily in water, forming strong chemical bonds, and those bonds are difficult to break. The energy and technology to desalinate water are both expensive, and this means that desalinating water can be costly.\nThere are environmental costs of desalination as well. Sea life can get sucked into desalination plants, killing small ocean creatures like baby fish and plankton, upsetting the food chain. Also, there is the problem of what to do with the separated salt, which is left over as a very concentrated brine. Pumping this super-salty water back into the ocean can harm local aquatic life. Reducing these impacts is possible, but it adds to the costs.\nDespite the economic and environmental hurdles, desalination is becoming increasingly attractive as human beings are using up fresh water from other sources. At present, desalinating seawater is the only viable way to provide water to growing populations in rural areas of the Middle East and North Africa. Therefore, the race is on to find a cheaper, cleaner, and more energy-efficient way of desalinating seawater, and promising new findings are being reported.\n\n▶ 第 50 題　What is the second paragraph mainly about?", "options": ["The high cost of desalinating seawater.", "The major chemical characteristics of seawater.", "The urgent need to turn seawater into fresh water.", "The amount of energy produced in the desalination of seawater."], "answer": 0, "answerLabel": "A", "source": "107 學測｜閱讀測驗｜第 50 題", "explanation": "第二段：海水淡化需要大量能源，能源和技術都昂貴——成本高。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 51, "question": "【閱讀測驗 第 49–52 題】\nMost parts of Taiwan have access to sufficient supplies of fresh water for drinking. But fresh water can be in short supply in many arid regions of the world such as Saudi Arabia, where there are limited water resources. As the world population continues to grow, shortages of fresh water will occur more often and the need for additional water supplies will become critical. Some may ask, “Since the ocean covers more than 70 percent of the Earth, why not just get drinking water from the ocean?”\nTo turn seawater into fresh water, we need to remove the salt in seawater, that is, to desalinate seawater. The problem is that the desalination of water requires a lot of energy. Salt dissolves very easily in water, forming strong chemical bonds, and those bonds are difficult to break. The energy and technology to desalinate water are both expensive, and this means that desalinating water can be costly.\nThere are environmental costs of desalination as well. Sea life can get sucked into desalination plants, killing small ocean creatures like baby fish and plankton, upsetting the food chain. Also, there is the problem of what to do with the separated salt, which is left over as a very concentrated brine. Pumping this super-salty water back into the ocean can harm local aquatic life. Reducing these impacts is possible, but it adds to the costs.\nDespite the economic and environmental hurdles, desalination is becoming increasingly attractive as human beings are using up fresh water from other sources. At present, desalinating seawater is the only viable way to provide water to growing populations in rural areas of the Middle East and North Africa. Therefore, the race is on to find a cheaper, cleaner, and more energy-efficient way of desalinating seawater, and promising new findings are being reported.\n\n▶ 第 51 題　According to the passage, which of the following statements is true?", "options": ["Mixing salt with water is not as easy as removing salt from seawater.", "Desalinating seawater may kill some sea creatures and disturb the food chain.", "Covering 70% of the Earth, the ocean has always satisfied human needs for water.", "The increasing population in Saudi Arabia has resulted in shortages of fresh water."], "answer": 1, "answerLabel": "B", "source": "107 學測｜閱讀測驗｜第 51 題", "explanation": "第三段：海洋生物會被吸進淡化廠，殺死小魚和浮游生物，破壞食物鏈。(B)。(A) 相反：鹽很容易溶於水。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 52, "question": "【閱讀測驗 第 49–52 題】\nMost parts of Taiwan have access to sufficient supplies of fresh water for drinking. But fresh water can be in short supply in many arid regions of the world such as Saudi Arabia, where there are limited water resources. As the world population continues to grow, shortages of fresh water will occur more often and the need for additional water supplies will become critical. Some may ask, “Since the ocean covers more than 70 percent of the Earth, why not just get drinking water from the ocean?”\nTo turn seawater into fresh water, we need to remove the salt in seawater, that is, to desalinate seawater. The problem is that the desalination of water requires a lot of energy. Salt dissolves very easily in water, forming strong chemical bonds, and those bonds are difficult to break. The energy and technology to desalinate water are both expensive, and this means that desalinating water can be costly.\nThere are environmental costs of desalination as well. Sea life can get sucked into desalination plants, killing small ocean creatures like baby fish and plankton, upsetting the food chain. Also, there is the problem of what to do with the separated salt, which is left over as a very concentrated brine. Pumping this super-salty water back into the ocean can harm local aquatic life. Reducing these impacts is possible, but it adds to the costs.\nDespite the economic and environmental hurdles, desalination is becoming increasingly attractive as human beings are using up fresh water from other sources. At present, desalinating seawater is the only viable way to provide water to growing populations in rural areas of the Middle East and North Africa. Therefore, the race is on to find a cheaper, cleaner, and more energy-efficient way of desalinating seawater, and promising new findings are being reported.\n\n▶ 第 52 題　Which of the following best describes the author’s attitude toward the future of desalination?", "options": ["Amazed.", "Doubtful.", "Conservative.", "Hopeful."], "answer": 3, "answerLabel": "D", "source": "107 學測｜閱讀測驗｜第 52 題", "explanation": "最後一段：儘管有障礙，淡化越來越有吸引力，「正在尋找更便宜的方法，並有令人期待的新發現」——樂觀。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nFour millennia ago, an ancient Babylonian wrote down what is possibly the first lullaby. It is a rather threatening lullaby, in which the baby is scolded for disturbing the house god with its crying and warned of terrifying consequences. It may have got the baby to sleep, but its message is far from comforting: If he/she does not stop crying, the demon will eat him/her. This lullaby may sound more scary than sleep-inducing, yet it is true that many lullabies—including those sung today—have dark undertones.\nResearch has shown that lullabies, when used correctly, can soothe and possibly even help to heal an infant; but it is the caretaker’s voice and the rhythm and melody of the music that babies respond to, not the content of the song. Then, what is the function of the content? According to studies, some lullabies provide advice, like the Babylonian lullaby, and quite a few others offer the space to sing the unsung, say the unsayable. Lyrics to those lullabies can indeed be interpreted as a reflection of the caregiver’s emotions.\nResearchers believe that a large part of the function of lullabies is to help a mother vocalize her worries and concerns. The mother’s fear of loss especially makes sense since the infant/toddler years of life are fragile ones. Since there is a special physical bond between mother and child during this period, mothers feel they can sing to their child about their own fears and anxieties. Lullabies, therefore, serve as therapy for the mother. In addition, the songs are seemingly trying to work some magic—as if, by singing, the mother is saying, “Sadness has already touched this house; no need to come by again.”\n\n▶ 第 53 題　Which of the following titles best describes the main idea of this passage?", "options": ["The Origin of Lullabies", "The Functions of Lullabies", "Threatening Lullabies", "Sleep-Inducing Lullabies"], "answer": 1, "answerLabel": "B", "source": "107 學測｜閱讀測驗｜第 53 題", "explanation": "第二、三段：搖籃曲能安撫嬰兒，也讓母親抒發憂慮、如同治療——講搖籃曲的功能。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nFour millennia ago, an ancient Babylonian wrote down what is possibly the first lullaby. It is a rather threatening lullaby, in which the baby is scolded for disturbing the house god with its crying and warned of terrifying consequences. It may have got the baby to sleep, but its message is far from comforting: If he/she does not stop crying, the demon will eat him/her. This lullaby may sound more scary than sleep-inducing, yet it is true that many lullabies—including those sung today—have dark undertones.\nResearch has shown that lullabies, when used correctly, can soothe and possibly even help to heal an infant; but it is the caretaker’s voice and the rhythm and melody of the music that babies respond to, not the content of the song. Then, what is the function of the content? According to studies, some lullabies provide advice, like the Babylonian lullaby, and quite a few others offer the space to sing the unsung, say the unsayable. Lyrics to those lullabies can indeed be interpreted as a reflection of the caregiver’s emotions.\nResearchers believe that a large part of the function of lullabies is to help a mother vocalize her worries and concerns. The mother’s fear of loss especially makes sense since the infant/toddler years of life are fragile ones. Since there is a special physical bond between mother and child during this period, mothers feel they can sing to their child about their own fears and anxieties. Lullabies, therefore, serve as therapy for the mother. In addition, the songs are seemingly trying to work some magic—as if, by singing, the mother is saying, “Sadness has already touched this house; no need to come by again.”\n\n▶ 第 54 題　Which of the following is closest in meaning to the word “undertones” in the first paragraph?", "options": ["Consequences.", "Vocals.", "Whispers.", "Messages."], "answer": 3, "answerLabel": "D", "source": "107 學測｜閱讀測驗｜第 54 題", "explanation": "dark undertones 隱含的陰暗訊息；上文說巴比倫搖籃曲的 message 並不安慰人。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 55, "question": "【閱讀測驗 第 53–56 題】\nFour millennia ago, an ancient Babylonian wrote down what is possibly the first lullaby. It is a rather threatening lullaby, in which the baby is scolded for disturbing the house god with its crying and warned of terrifying consequences. It may have got the baby to sleep, but its message is far from comforting: If he/she does not stop crying, the demon will eat him/her. This lullaby may sound more scary than sleep-inducing, yet it is true that many lullabies—including those sung today—have dark undertones.\nResearch has shown that lullabies, when used correctly, can soothe and possibly even help to heal an infant; but it is the caretaker’s voice and the rhythm and melody of the music that babies respond to, not the content of the song. Then, what is the function of the content? According to studies, some lullabies provide advice, like the Babylonian lullaby, and quite a few others offer the space to sing the unsung, say the unsayable. Lyrics to those lullabies can indeed be interpreted as a reflection of the caregiver’s emotions.\nResearchers believe that a large part of the function of lullabies is to help a mother vocalize her worries and concerns. The mother’s fear of loss especially makes sense since the infant/toddler years of life are fragile ones. Since there is a special physical bond between mother and child during this period, mothers feel they can sing to their child about their own fears and anxieties. Lullabies, therefore, serve as therapy for the mother. In addition, the songs are seemingly trying to work some magic—as if, by singing, the mother is saying, “Sadness has already touched this house; no need to come by again.”\n\n▶ 第 55 題　What does the author use to support the idea that lullabies can have a soothing effect?", "options": ["Research reports.", "Examples found in history.", "Stories of caretakers.", "The author’s personal experiences."], "answer": 0, "answerLabel": "A", "source": "107 學測｜閱讀測驗｜第 55 題", "explanation": "第二段：Research has shown that lullabies… can soothe——用研究報告支持。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 56, "question": "【閱讀測驗 第 53–56 題】\nFour millennia ago, an ancient Babylonian wrote down what is possibly the first lullaby. It is a rather threatening lullaby, in which the baby is scolded for disturbing the house god with its crying and warned of terrifying consequences. It may have got the baby to sleep, but its message is far from comforting: If he/she does not stop crying, the demon
