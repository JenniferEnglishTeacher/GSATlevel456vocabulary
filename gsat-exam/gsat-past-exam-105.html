victim 受害者。", "explanationSource": "own", "section": "詞彙"}, {"id": 6, "question": "第 6 題　The principal of this school is a man of exceptional ______. He sets aside a part of his salary for a scholarship fund for children from needy families.", "options": ["security", "maturity", "facility", "generosity"], "answer": 3, "answerLabel": "D", "source": "105 學測｜詞彙｜第 6 題", "explanation": "校長拿出部分薪水設立獎學金，表現出非凡的「慷慨」：generosity。security 安全、maturity 成熟、facility 設施。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　The science teacher always ______ the use of the laboratory equipment before she lets her students use it on their own.", "options": ["tolerates", "associates", "demonstrates", "exaggerates"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 7 題", "explanation": "讓學生自己操作前，老師會先「示範」儀器用法：demonstrates。tolerate 容忍、associate 聯想、exaggerate 誇大。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　Most of the area is covered by woods, where bird species are so ______ that it is a paradise for birdwatchers.", "options": ["durable", "private", "realistic", "numerous"], "answer": 3, "answerLabel": "D", "source": "105 學測｜詞彙｜第 8 題", "explanation": "鳥類種類「眾多」，成為賞鳥天堂：numerous。durable 耐用的、private 私人的、realistic 務實的。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　In most cases, the committee members can reach agreement quickly. ______, however, they differ greatly in opinion and have a hard time making decisions.", "options": ["Occasionally", "Automatically", "Enormously", "Innocently"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 9 題", "explanation": "大多數時候很快達成共識，「偶爾」卻意見分歧：Occasionally。automatically 自動地、enormously 極大地、innocently 無辜地。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　Many people try to save a lot of money before ______, since having enough money would give them a sense of security for their future.", "options": ["isolation", "promotion", "retirement", "announcement"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 10 題", "explanation": "在「退休」前存夠錢以獲得安全感：retirement。isolation 孤立、promotion 升遷、announcement 宣布。", "explanationSource": "own", "section": "詞彙"}, {"id": 11, "question": "第 11 題　In winter, our skin tends to become dry and ______, a problem which is usually treated by applying lotions or creams.", "options": ["alert", "itchy", "steady", "flexible"], "answer": 1, "answerLabel": "B", "source": "105 學測｜詞彙｜第 11 題", "explanation": "冬天皮膚乾燥「發癢」，需塗乳液：itchy。alert 警覺的、steady 穩定的、flexible 有彈性的。", "explanationSource": "own", "section": "詞彙"}, {"id": 12, "question": "第 12 題　Benson married Julie soon after he had ______ her heart and gained her parents’ approval.", "options": ["conquered", "estimated", "guaranteed", "intensified"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 12 題", "explanation": "「贏得」她的心並獲得父母同意後結婚：conquer one’s heart。estimate 估計、guarantee 保證、intensify 加強。", "explanationSource": "own", "section": "詞彙"}, {"id": 13, "question": "第 13 題　The recent flood completely ______ my parents’ farm. The farmhouse and fruit trees were all gone and nothing was left.", "options": ["ruined", "cracked", "hastened", "neglected"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 13 題", "explanation": "洪水徹底「毀了」農場，什麼都沒剩：ruined。crack 使破裂、hasten 加速、neglect 忽視。", "explanationSource": "own", "section": "詞彙"}, {"id": 14, "question": "第 14 題　The results of this survey are not reliable because the people it questioned were not a typical or ______ sample of the entire population that was studied.", "options": ["primitive", "spiritual", "representative", "informative"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 14 題", "explanation": "受訪者不是母體的典型或「具代表性的」樣本，所以結果不可靠：representative sample。", "explanationSource": "own", "section": "詞彙"}, {"id": 15, "question": "第 15 題　In line with the worldwide green movement, carmakers have been working hard to make their new models more ______ friendly to redu sitive perfectionists and good team players, but over-anxious. Type Os are curious and generous but stubborn. Type ABs are artistic but mysterious and unpredictable, and type Bs are cheerful but eccentric, individualistic, and selfish. Though lacking scientific evidence, this belief is widely seen in books, magazines, and television shows. The blood-type belief has been used in unusual ways. The women's softball team that won gold for Japan at the Beijing Olympics is reported to have used blood-type theories to customize training for each player. Some kindergartens have adopted teaching methods along blood group lines, and even major companies reportedly make decisions about assignments based on an employee's blood type. In 1990, Mitsubishi Electronics was reported to have announced the formation of a team composed entirely of AB workers, thanks to \"their ability to make plans.\" The belief even affects politics. One former prime minister considered it important enough to reveal in his official profile that he was a type A, while his opposition rival was type B. In 2011, a minister, Ryu Matsumoto, was forced to resign after only a week in office, when a bad-tempered encounter with local officials was televised. In his resignation speech, he blamed his failings on the fact that he was blood type B. The blood-type craze, considered simply harmless fun by some Japanese, may manifest itself as prejudice and discrimination. In fact, this seems so common that the Japanese now have a term for it: bura-hara, meaning blood-type harassment. There are reports of discrimination leading to children being bullied, ending of happy relationships, and loss of job opportunities due to blood type.\n\n▶ 第 41 題　What is the speaker's attitude toward the blood-type belief in Japan?", "options": ["Negative.", "Defensive.", "Objective.", "Encouraging."], "answer": 2, "answerLabel": "C", "source": "105 學測｜閱讀測驗｜第 41 題", "explanation": "作者客觀陳述血型信念的內容、各領域的運用與衍生的歧視，用 is reported、reportedly 等中立語  any person too short to reach the sink. When not in use, the hinges allowed the two pieces of wood to fold back up tightly against the cabinet, where they were held in place by magnets. Jeanie called her invention the \"Kiddie Stool.\" Jeanie's Kiddie Stool won first place in her school's contest. Two years later, it was awarded first prize again at Houston's first annual Invention Fair. As a result, Jeanie was invited to make a number of public appearances with her Kiddie Stool, and was featured on local TV as well as in newspapers. Many people found the story of the Kiddie Stool inspiring because it showed that with imagination, anyone can be an inventor.\n\n▶ 第 45 題　Why did Jeanie Low invent the Kiddie Stool, according to the passage?", "options": ["Many other five-year-olds had problems reaching the bathroom sink.", "She did not think that plastic stools were tall enough for her.", "The stool in her bathroom was not firm and often got in the way.", "She was invited to enter an invention contest held by her school."], "answer": 2, "answerLabel": "C", "source": "105 學測｜閱讀測驗｜第 45 題", "explanation": "第一段：家裡的塑膠凳子「不穩且占空間」，所以她想做一個固定在浴室又能收起來的凳子。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 46, "question": "【閱讀測驗 第 45–48 題】\nLike many other five-year-olds, Jeanie Low of Houston, Texas, would use a stool to help her reach the bathroom sink. However, the plastic step-stool she had at home was unstable and cluttered up the small bathroom shared by her whole family. After learning of an invention contest held by her school that year, Jeanie resolved to enter the contest by creating a stool that would be a permanent fixture in the bathroom, and yet could be kept out of the way when not in use. Jeanie decided to make a stool attached to the bathroom cabinet door under the sink. She cut a plank of wood into two pieces, each about two feet wide and one foot long. Using metal hinges, Jeanie attached one piece of the wood to the front of the cabinet door, and the ng school, according to a report published by UNICEF, the United Nations Children's Fund. The report states that 40% of all children across the region are currently not receiving an education, which is a result of two consequences of violence: structural damage to schools and the displacement of populations, also called \"forced migration.\" Both issues result from the tide of violence that has crossed the region in recent years. The report examines nine countries where a state of war has become the norm. Across these countries, violence has made 8,500 schools unusable. In certain cases, communities have relied on school buildings to function as shelters for the displaced, with up to nine families living in a single classroom in former schools across Iraq. The report pays particularly close attention to Syria, where a bloody civil war has displaced at least nine million people since the war began in 2011. With the crisis now in its fifth year, basic public services, including education, inside Syria have been stretched to breaking point. Within the country, the quality and availability of education depends on whether a particular region is suffering violence. The report concludes with an earnest request to international policymakers to distribute financial and other resources to ease the regional crisis. With more than 13 million children already driven from classrooms by conflict, it is no exaggeration to say that the educational prospects of a generation of children are in the balance. The forces that are crushing individual lives and futures are also destroying the prospects for an entire region.\n\n▶ 第 49 題　What is this article mainly about?", "options": ["Why people are moving away from their own countries.", "Why there are civil wars and violence in the Middle East.", "Why many schools have become shelters for displaced families.", "Why many children in the Middle East are not attending school."], "answer": 3, "answerLabel": "D", "source": "105 學測｜閱讀測驗｜第 49 題" to international policymakers to distribute financial and other resources to ease the regional crisis. With more than 13 million children already driven from classrooms by conflict, it is no exaggeration to say that the educational prospects of a generation of children are in the balance. The forces that are crushing individual lives and futures are also destroying the prospects for an entire region.\n\n▶ 第 52 題　According to the passage, which of the following statements is true?", "options": ["The war in Syria has been going on since 2011.", "More than nine thousand schools have been destroyed by wars.", "Thirteen million people have been forced to leave their homes in the Middle East.", "Forty percent of all children in the world are not attending schools due to ongoing conflict."], "answer": 0, "answerLabel": "A", "source": "105 學測｜閱讀測驗｜第 52 題", "explanation": "第三段：敘利亞內戰自 2011 年開始。(A)。(B) 錯：8,500 所；(C) 錯：1,300 萬是失學兒童；(D) 錯：40% 是該地區兒童。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nMany marine animals, including penguins and marine iguanas, have evolved ways to get rid of excess salt by using special salt-expelling glands around their tongue. However, the sea snake's salt glands cannot handle the massive amounts of salt that would enter their bodies if they actually drank seawater. This poses a serious problem when it comes to getting enough water to drink. If seawater is not an option, how does this animal survive in the ocean? An international team of researchers focused on a population of yellow-bellied sea snakes living near Costa Rica, where rain often does not fall for up to seven months out of the year. Because yellow-bellied sea snakes usually spend all of their time far from land, rain is the animals' only source of fresh water. When it rains, a thin layer of fresh water forms on top of the ocean, providing the snakes with a fleeting opportunity to lap up that precious resource. But during the dry season when there is no rain, snakes presumably have nothing to drink. Thus, the team became interested in testing whether sea snakes became dehydrated at sea. The researchers collected more than 500 yellow-bellied sea snakes and weighed them. They found that during the dry season about half of the snakes accepted fresh water offered to them, while nearly none did during the wet season. A snake's likelihood to drink also correlated with its body condition, with more withered snakes being more likely to drink, and to drink more. Finally, as predicted, snakes captured during the dry season contained significantly less body water than those scooped up in the rainy season. Thus, it seems the snake is able to endure certain degrees of dehydration in between rains. Scientists believe that dehydration at sea may explain the declining populations of sea snakes in some parts of the world.\n\n▶ 第 53 題　What is the purpose of the study described in this passage?", "options": ["To test if sea snakes lose body water at sea.", "To see whether sea snakes drink water offered to them.", "To find out if sea snakes are greatly reduced in population.", "To prove that sea snakes drink only water coming from rivers."], "answer": 0, "answerLabel": "A", "source": "105 學測｜閱讀測驗｜第 53 題", "explanation": "第二段末：研究團隊想測試海蛇在海上是否會「脫水」。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nMany marine animals, including penguins and marine iguanas, have evolved ways to get rid of excess salt by using special salt-expelling glands around their tongue. However, the sea snake's salt glands cannot handle the massive amounts of salt that would enter their bodies if they actually drank seawater. This poses a serious problem when it comes to getting enough water to drink. If seawater is not an option, how does this animal survive in the ocean? An international team of researchers focused on a population of yellow-bellied sea snakes living near Costa Rica, where rain often does no
