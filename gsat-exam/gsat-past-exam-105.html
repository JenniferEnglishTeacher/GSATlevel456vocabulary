<script>window.QUIZ_CONFIG={"title": "105 年學測英文｜詞彙＋綜合測驗＋文意選填", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Posters of the local rock band were displayed in store windows to promote the sale of their ______ tickets.", "options": ["journey", "traffic", "concert", "record"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 1 題", "explanation": "搖滾樂團的海報用來促銷「演唱會」門票：concert tickets。journey 旅程、traffic 交通、record 唱片。", "explanationSource": "own", "section": "詞彙"}, {"id": 2, "question": "第 2 題　Maria didn’t want to deliver the bad news to David about his failing the job interview. She herself was quite ______ about it.", "options": ["awful", "drowsy", "tragic", "upset"], "answer": 3, "answerLabel": "D", "source": "105 學測｜詞彙｜第 2 題", "explanation": "要傳達壞消息，她自己也很「難過」：upset。awful 糟糕的、drowsy 昏昏欲睡的、tragic 悲劇的（修飾事情）。", "explanationSource": "own", "section": "詞彙"}, {"id": 3, "question": "第 3 題　The newcomer speaks with a strong Irish ______; he must be from Ireland.", "options": ["accent", "identity", "gratitude", "signature"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 3 題", "explanation": "說話帶有濃厚的愛爾蘭「口音」：accent。identity 身分、gratitude 感謝、signature 簽名。", "explanationSource": "own", "section": "詞彙"}, {"id": 4, "question": "第 4 題　Although Maggie has been physically ______ to her wheelchair since the car accident, she does not limit herself to indoor activities.", "options": ["ceased", "committed", "confined", "conveyed"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 4 題", "explanation": "車禍後身體「受限於」輪椅：be confined to。cease 停止、commit 投入、convey 傳達。", "explanationSource": "own", "section": "詞彙"}, {"id": 5, "question": "第 5 題　All passengers riding in cars are required to fasten their seatbelts in order to reduce the risk of ______ in case of an accident.", "options": ["injury", "offense", "sacrifice", "victim"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 5 題", "explanation": "繫安全帶以降低意外時「受傷」的風險：risk of injury。offense 冒犯、sacrifice 犧牲、victim 受害者。", "explanationSource": "own", "section": "詞彙"}, {"id": 6, "question": "第 6 題　The principal of this school is a man of exceptional ______. He sets aside a part of his salary for a scholarship fund for children from needy families.", "options": ["security", "maturity", "facility", "generosity"], "answer": 3, "answerLabel": "D", "source": "105 學測｜詞彙｜第 6 題", "explanation": "校長拿出部分薪水設立獎學金，表現出非凡的「慷慨」：generosity。security 安全、maturity 成熟、facility 設施。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　The science teacher always ______ the use of the laboratory equipment before she lets her students use it on their own.", "options": ["tolerates", "associates", "demonstrates", "exaggerates"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 7 題", "explanation": "讓學生自己操作前，老師會先「示範」儀器用法：demonstrates。tolerate 容忍、associate 聯想、exaggerate 誇大。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　Most of the area is covered by woods, where bird species are so ______ that it is a paradise for birdwatchers.", "options": ["durable", "private", "realistic", "numerous"], "answer": 3, "answerLabel": "D", "source": "105 學測｜詞彙｜第 8 題", "explanation": "鳥類種類「眾多」，成為賞鳥天堂：numerous。durable 耐用的、private 私人的、realistic 務實的。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　In most cases, the committee members can reach agreement quickly. ______, however, they differ greatly in opinion and have a hard time making decisions.", "options": ["Occasionally", "Automatically", "Enormously", "Innocently"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 9 題", "explanation": "大多數時候很快達成共識，「偶爾」卻意見分歧：Occasionally。automatically 自動地、enormously 極大地、innocently 無辜地。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　Many people try to save a lot of money before ______, since having enough money would give them a sense of security for their future.", "options": ["isolation", "promotion", "retirement", "announcement"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 10 題", "explanation": "在「退休」前存夠錢以獲得安全感：retirement。isolation 孤立、promotion 升遷、announcement 宣布。", "explanationSource": "own", "section": "詞彙"}, {"id": 11, "question": "第 11 題　In winter, our skin tends to become dry and ______, a problem which is usually treated by applying lotions or creams.", "options": ["alert", "itchy", "steady", "flexible"], "answer": 1, "answerLabel": "B", "source": "105 學測｜詞彙｜第 11 題", "explanation": "冬天皮膚乾燥「發癢」，需塗乳液：itchy。alert 警覺的、steady 穩定的、flexible 有彈性的。", "explanationSource": "own", "section": "詞彙"}, {"id": 12, "question": "第 12 題　Benson married Julie soon after he had ______ her heart and gained her parents’ approval.", "options": ["conquered", "estimated", "guaranteed", "intensified"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 12 題", "explanation": "「贏得」她的心並獲得父母同意後結婚：conquer one’s heart。estimate 估計、guarantee 保證、intensify 加強。", "explanationSource": "own", "section": "詞彙"}, {"id": 13, "question": "第 13 題　The recent flood completely ______ my parents’ farm. The farmhouse and fruit trees were all gone and nothing was left.", "options": ["ruined", "cracked", "hastened", "neglected"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 13 題", "explanation": "洪水徹底「毀了」農場，什麼都沒剩：ruined。crack 使破裂、hasten 加速、neglect 忽視。", "explanationSource": "own", "section": "詞彙"}, {"id": 14, "question": "第 14 題　The results of this survey are not reliable because the people it questioned were not a typical or ______ sample of the entire population that was studied.", "options": ["primitive", "spiritual", "representative", "informative"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 14 題", "explanation": "受訪者不是母體的典型或「具代表性的」樣本，所以結果不可靠：representative sample。", "explanationSource": "own", "section": "詞彙"}, {"id": 15, "question": "第 15 題　In line with the worldwide green movement, carmakers have been working hard to make their new models more ______ friendly to reduce pollution.", "options": ["liberally", "individually", "financially", "environmentally"], "answer": 3, "answerLabel": "D", "source": "105 學測｜詞彙｜第 15 題", "explanation": "減少污染，使新車更「環保」：environmentally friendly。liberally 自由地、individually 個別地、financially 財務上。", "explanationSource": "own", "section": "詞彙"}, {"id": 16, "question": "【綜合測驗 第 16–20 題】\nBill and Sam decided to kidnap the son of a banker to compensate for their business loss. They kidnapped the boy and hid him in a cave. They asked for a ransom of $2,000 to return the boy. __16__, their plan quickly got out of control. Their young captive __17__ to be a mischievous boy. He viewed the kidnapping as a wonderful camping trip. He demanded that his kidnappers play tiring games with him, such as riding Bill as a horse for nine miles. Bill and Sam were soon desperate and decided to __18__ the little terror. They lowered the price to $1,500. Yet, knowing perfectly well __19__ a troublemaker his son was, the father refused to give them any money. __20__, he asked the kidnappers to pay him $250 to take the boy back. To persuade the boy to return home, Bill and Sam had to tell him that his father was taking him bear-hunting. The kidnappers finally handed over the boy and $250 to the banker and fled town as quickly as they could.\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["However", "Otherwise", "Furthermore", "Accordingly"], "answer": 0, "answerLabel": "A", "source": "105 學測｜綜合測驗｜第 16 題", "explanation": "計畫很快失控，與前文形成轉折：However。Otherwise 否則、Furthermore 此外、Accordingly 因此。", "explanationSource": "own", "section": "綜合測驗"}, {"id": 17, "question": "【綜合測驗 第 16–20 題】\nBill and Sam decided to kidnap the son of a banker to compensate for their business loss. They kidnapped the boy and hid him in a cave. They asked for a ransom of $2,000 to return the boy. __16__, their plan quickly got out of control. Their young captive __17__ to be a mischievous boy. He viewed the kidnapping as a wonderful camping trip. He demanded that his kidnapp
