", "section": "詞彙"}, {"id": 6, "question": "第 6 題　After spending most of her salary on rent and food, Amelia ______ had any money left for entertainment and other expenses.", "options": ["barely", "fairly", "merely", "readily"], "answer": 0, "answerLabel": "A", "source": "106 學測｜詞彙｜第 6 題", "explanation": "薪水大多花在房租和食物上，「幾乎沒有」錢剩下：barely。fairly 相當、merely 僅僅、readily 容易地。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　In the Bermuda Triangle, a region in the western part of the North Atlantic Ocean, some airplanes and ships were reported to have mysteriously disappeared without a ______.", "options": ["guide", "trace", "code", "print"], "answer": 1, "answerLabel": "B", "source": "106 學測｜詞彙｜第 7 題", "explanation": "飛機船隻神祕消失得「無影無蹤」：without a trace。guide 指南、code 代碼、print 印痕。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　Shouting greetings and waving a big sign, Tony ______ the passing shoppers to visit his shop and buy the freshly baked bread.", "options": ["accessed", "edited", "imposed", "urged"], "answer": 3, "answerLabel": "D", "source": "106 學測｜詞彙｜第 8 題", "explanation": "大聲招呼、揮舞招牌，「催促」路過的顧客進店：urged。access 存取、edit 編輯、impose 強加。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　With a continuous 3 km stretch of golden sand, the beach attracts artists around the world each summer to create amazing ______ with its fine soft sand.", "options": ["constitutions", "objections", "sculptures", "adventures"], "answer": 2, "answerLabel": "C", "source": "106 學測｜詞彙｜第 9 題", "explanation": "藝術家用細沙創作驚人的「雕塑」：sand sculptures。constitution 憲法、objection 反對、adventure 冒險。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　The clouds parted and a ______ of light fell on the church, through the windows, and onto the floor.", "options": ["dip", "beam", "spark", "path"], "answer": 1, "answerLabel": "B", "source": "106 學測｜詞彙｜第 10 題", "explanation": "雲散開，一「道」光射進教堂：a beam of light。dip 浸 tellect in several aspects—from empathy to memory to reasoning skills. But don’t expect it to measure your pet’s IQ. Dr. Hare, one of the venture’s co-founders, says a dog’s intelligence can’t be described with a single number. Just as humans have a wide range of intelligences, so do dogs. The question is what type your dog relies on more.\nAfter you plunk your money down, Dognition’s website will take you through a questionnaire about your dog: For example, how excited does your dog get around other dogs, or children? Do fireworks scare your pup? Then, Dognition guides you through tests that are as fun as playing fetch or hide-and-seek. At the end, you get a report of your dog’s cognitive profile.\nYour dog could fall into one of nine categories: Ace, Stargazer, Maverick, Charmer, Socialite, Protodog, Einstein, Expert, or Renaissance Dog. That can give you something to brag about on Dognition’s Facebook page. It also can shed new light on why dogs do the things they do. For example, a Charmer is a dog that trusts you so much that it would prefer to solve problems using information you give it rather than information it can get with its own eyes.\nDognition helps people understand their dogs in ways that they have never been able to do. This new understanding can enrich the relationship between dogs and their owners.\n\n▶ 第 41 題　What is the third paragraph mainly about?", "options": ["The theory behind the questionnaire used in the Dognition test.", "The procedure for evaluating a dog’s intellect on Dognition.", "The products one can get by paying a fee to Dognition.", "The characteristics of the activities Dognition offers."], "answer": 1, "answerLabel": "B", "source": "106 學測｜閱讀測驗｜第 41 題", "explanation": "第三段：付費後填問卷，再做像丟接球、躲貓貓一樣有趣的測試，最後拿到報告——評估流程。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 42, "question": "【閱讀測驗 第 41–44 題】\nIs your dog an Einstein or a Charmer? For US $60, a recently-founded company called Dognition will help you learn more about t wants."], "answer": 2, "answerLabel": "C", "source": "106 學測｜閱讀測驗｜第 44 題", "explanation": "第四段：Charmer 非常信任主人，寧願用「你給的資訊」而非自己眼睛看到的來解決問題——靠主人指出零食在哪。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 45, "question": "【閱讀測驗 第 45–48 題】\nCapoeira is a martial art that combines elements of fight, acrobatics, drumming, singing, dance, and rituals. It involves a variety of techniques that make use of the hands, feet, legs, arms, and head. Although Capoeira appears dancelike, many of its basic techniques are similar to those in other martial arts.\nCapoeira was created nearly 500 years ago in Brazil by African slaves. It is believed that the martial art was connected with tribal fighting in Africa, in which people fought body to body, without weapons, in order to acquire a bride or desired woman. In the sixteenth century, when the Africans were taken from their homes to Brazil against their will and kept in slavery, Capoeira began to take form among the community of slaves for self-defense. But it soon became a strong weapon in the life-or-death struggle against their oppressors. When the slave owners realized the power of Capoeira, they began to punish those who practiced it. Capoeiristas learned to camouflage the forbidden fights with singing, clapping, and dancing as though it were simply entertainment.\nAt first, Capoeira was considered illegal in Brazil. However, a man known as Mestre Bimba devoted a great deal of time and effort to convincing the Brazilian authorities that Capoeira has great cultural value and should become an official fighting style. He succeeded in his endeavor and transformed the martial art into Brazil’s national sport. He and Mestre Pastinha were the first to open schools, and the Capoeira tree grew, spreading its branches across the world. Nowadays, it is performed in movies and music clips. Capoeira is also believed to have influenced several dancing styles like breaking and hip-hop.\n\n▶ 第 45 題　What is the passage mainly about?", "options": ["The history of Capoeira.", "The values of Capoeira.", "The contribution of Capoeira.", "The techniques of Capoeira."], "answer": 0, "answerLabel": "A", "source": "106 學測｜閱讀測驗｜第 45 題", "explanation": "全文從 500 年前非洲奴隸創造，到被禁、合法化、傳到世界各地——歷史。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 46, "question": "【閱讀測驗 第 45–48 題】\nCapoeira is a martial art that combines elements of fight, acrobatics, drumming, singing, dance, and rituals. It involves a variety of techniques that make use of the hands, feet, legs, arms, and head. Although Capoeira appears dancelike, many of its basic techniques are similar to those in other martial arts.\nCapoeira was created nearly 500 years ago in Brazil by African slaves. It is believed that the martial art was connected with tribal fighting in Africa, in which people fought body to body, without weapons, in order to acquire a bride or desired woman. In the sixteenth century, when the Africans were taken from their homes to Brazil against their will and kept in slavery, Capoeira began to take form among the community of slaves for self-defense. But it soon became a strong weapon in the life-or-death struggle against their oppressors. When the slave owners realized the power of Capoeira, they began to punish those who practiced it. Capoeiristas learned to camouflage the forbidden fights with singing, clapping, and dancing as though it were simply entertainment.\nAt first, Capoeira was considered illegal in Brazil. However, a man known as Mestre Bimba devoted a great deal of time and effort to convincing the Brazilian authorities that Capoeira has great cultural value and should become an official fighting style. He succeeded in his endeavor and transformed the martial art into Brazil’s national sport. He and Mestre Pastinha were the first to open schools, and the Capoeira tree grew, spreading its branches across the world. Nowadays, it is performed in movies and music clips. Capoeira is also believed to have influenced several dancing styles like breaking and hip-hop.\n\n▶ 第 46 題　Which of the following will probably NOT be found in the performance of Capoeira?", "options": ["Singing with drums.", "Sweeping with the legs.", "Stabbing with swords.", "Striking with the hands."], "answer": 2, "answerLabel": "C", "source": "106 學測｜閱讀測驗｜第 46 題", "explanation": "第一段：使用手、腳、腿、手臂和頭；第二段：非洲部落徒手搏鬥，沒有武器——不會有刀劍。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 47, "question": "【閱讀測驗 第 45–48 題】\nCapoeira is a martial art that combines elements of fight, acrobatics, drumming, singing, dance, and rituals. It involves a variety of techniques that make use of the hands, feet, legs, arms, and head. Although Capoeira appears dancelike, many of its basic techniques are similar to those in other martial arts.\nCapoeira was created nearly 500 years ago in Brazil by African slaves. It is believed that the martial art was connected with tribal fighting in Africa, in which people fought body to body, without weapons, in order to acquire a bride or desired woman. In the sixteenth century, when the Africans were taken from their homes to Brazil against their will and kept in slavery, Capoeira began to take form among the community of slaves for self-defense. But it soon became a strong weapon in the life-or-death struggle against their oppressors. When the slave owners realized the power of Capoeira, they began to punish those who practiced it. Capoeiristas learned to camouflage the forbidden fights with singing, clapping, and dancing as though it were simply entertainment.\nAt first, Capoeira was considered illegal in Brazil. However, a man known as Mestre Bimba devoted a great deal of time and effort to convincing the Brazilian authorities that Capoeira has great cultural value and should become an official fighting style. He succeeded in his endeavor and transformed the martial art into Brazil’s national sport. He and Mestre Pastinha were the first to open schools, and the Capoeira tree grew, spreading its branches across the world. Nowadays, it is performed in movies and music clips. Capoeira is also believed to have influenced several dancing styles like breaking and hip-hop.\n\n▶ 第 47 題　What is the author’s attitude toward Capoeira as a sport?", "options": ["Admiring.", "Objective.", "Doubtful.", "Harsh."], "answer": 1, "answerLabel": "B", "source": "106 學測｜閱讀測驗｜第 47 題", "explanation": "作者以 It is believed、is also believed 等客觀語氣敘述，沒有讚美或批評。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 48, "question": "【閱讀測驗 第 45–48 題】\nCapoeira is a martial art that combines elements of fight, acrobatics, drumming, singing, dance, and rituals. It involves a variety of techniques that make use of the hands, feet, legs, arms, and head. Although Capoeira appears dancelike, many of its basic techniques are similar to those in other martial arts.\nCapoeira was created nearly 500 years ago in Brazil by African slaves. It is believed that the martial art was connected with tribal fighting in Africa, in which people fought body to body, without weapons, in order to acquire a bride or desired woman. In the sixteenth century, when the Africans were taken from their homes to Brazil against their will and kept in slavery, Capoeira began to take form among the community of slaves for self-defense. But it soon became a strong weapon in the life-or-death struggle against their oppressors. When the slave owners realized the power of Capoeira, they began to punish those who practiced it. Capoeiristas learned to camouflage the forbidden fights with singing, clapping, and dancing as though it were simply entertainment.\nAt first, Capoeira was considered illegal in Brazil. However, a man known as Mestre Bimba devoted a great deal of time and effort to convincing the Brazilian authorities that Capoeira has great cultural value and should become an official fighting style. He succeeded in his endeavor and transformed the martial art into Brazil’s national sport. He and Mestre Pastinha were the first to open schools, and the Capoeira tree grew, spreading its branches across the world. Nowadays, it is performed in movies and music clips. Capoeira is also believed to have influenced several dancing styles like breaking and hip-hop.\n\n▶ 第 48 題　According to the passage, which of the following statements is true about Capoeira?", "options": ["It was greatly influenced by modern dancing styles.", "It was initially created as a type of dance and ritual.", "It was mainly performed to protect a bride or desired woman.", "It was officially recognized in Brazil through the effort of Mestre Bimba."], "answer": 3, "answerLabel": "D", "source": "106 學測｜閱讀測驗｜第 48 題", "explanation": "第三段：Mestre Bimba 說服巴西當局，使 Capoeira 成為官方認可的國家運動。(D)。(A) 相反：是它影響了現代舞風；(B) 錯：原為自衛。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 49, "question": "【閱讀測驗 第 49–52 題】\nWinslow Homer (1836-1910) is regarded by many as the greatest American painter of the nineteenth century. Born and raised in Boston, he began his career at age eighteen in his hometown, working as an apprentice at a printing company. Skilled at drawing, he soon made a name for himself making illustrations for novels, sheet music, magazines, and children’s books.\nHe then moved to New York City, where he worked as a freelance illustrator with Harper’s Weekly, a popular magazine of the time, and began painting. Homer was assigned to cover the inauguration of President Lincoln and, later, the Civil War. His pictures of the Union troops won international recognition. Homer moved to England and, after a two-year stay, returned to America. He settled permanently in Maine in 1883.\nFrom the late 1850s until his death in 1910, Winslow Homer produced a body of work distinguished by its thoughtful expression and its independence from artistic conventions. A man of multiple talents, Homer excelled equally in the arts of illustration, oil painting, and watercolor. Many of his works—depictions of children at play and in school, farm girls attending to their work, hunters and their prey—have become classic images of nineteenth-century American life. Others speak to more universal themes such as the primal relationship of humans to nature.\nThis two-week exhibition highlights a wide and representative range of Homer’s art. It shows his extraordinary career from the battlefields, farmland, and coastal villages of America, to the North Sea fishing village of Cullercoats, the rocky coast of Maine, the Adirondacks, and the Caribbean. The exhibition offers viewers an opportunity to experience and appreciate the breadth of his remarkable artistic achievement.\n\n▶ 第 49 題　Where does this passage most likely appear?", "options": ["On an ad featuring contemporary arts.", "On a website of an art gallery.", "In a booklet on American-born British artists.", "In an encyclopedia on the art of printing."], "answer": 1, "answerLabel": "B", "source": "106 學測｜閱讀測驗｜第 49 題", "explanation": "最後一段：This two-week exhibition…，介紹為期兩週的展覽——藝廊網站。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 50, "question": "【閱讀測驗 第 49–52 題】\nWinslow Homer (1836-1910) is regarded by many as the greatest American painter of the nineteenth century. Born and raised in Boston, he began his career at age eighteen in his hometown, working as an apprentice at a printing company. Skilled at drawing, he soon made a name for himself making illustrations for novels, sheet music, magazines, and children’s books.\nHe then moved to New York City, where he worked as a freelance illustrator with Harper’s Weekly, a popular magazine of the time, and began painting. Homer was assigned to cover the inauguration of President Lincoln and, later, the Civil War. His pictures of the Union troops won international recognition. Homer moved to England and, after a two-year stay, returned to America. He settled permanently in Maine in 1883.\nFrom the late 1850s until his death in 1910, Winslow Homer produced a body of work distinguished by i y. Born and raised in Boston, he began his career at age eighteen in his hometown, working as an apprentice at a printing company. Skilled at drawing, he soon made a name for himself making illustrations for novels, sheet music, magazines, and children’s books.\nHe then moved to New York City, where he worked as a freelance illustrator with Harper’s Weekly, a popular magazine of the time, and began painting. Homer was assigned to cover the inauguration of President Lincoln and, later, the Civil War. His pictures of the Union troops won international recognition. Homer moved to England and, after a two-year stay, returned to America. He settled permanently in Maine in 1883.\nFrom the late 1850s until his death in 1910, Winslow Homer produced a body of work distinguished by its thoughtful expression and its independence from artistic conventions. A man of multiple talents, Homer excelled equally in the arts of illustration, oil painting, and watercolor. Many of his works—depictions of children at play and in school, farm girls attending to their work, hunters and their prey—have become classic images of nineteenth-century American life. Others speak to more universal themes such as the primal relationship of humans to nature.\nThis two-week exhibition highlights a wide and representative range of Homer’s art. It shows his extraordinary career from the battlefields, farmland, and coastal villages of America, to the North Sea fishing village of Cullercoats, the rocky coast of Maine, the Adirondacks, and the Caribbean. The exhibition offers viewers an opportunity to experience and appreciate the breadth of his remarkable artistic achievement.\n\n▶ 第 52 題　What does “Others” in the third paragraph refer to?", "options": ["Other artists.", "Other themes.", "Other works.", "Other images."], "answer": 2, "answerLabel": "C", "source": "106 學測｜閱讀測驗｜第 52 題", "explanation": "Many of his works… Others speak to…：Others 指他「其他的作品」。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nTea, the most typical English drink, became established in Britain because of the influence of a foreign princess, Catherine of Braganza, the queen of Charles II. A lover of tea since her childhood in Portugal, she brought tea-drinking to the English royal court and set a trend for the beverage in the seventeenth century. The fashion soon spread beyond the circle of the nobility to the middle classes, and tea became a popular drink at the London coffee houses where people met to do business and discuss events of the day. Many employers served a cup of tea to their workers in the middle of the morning, thus inventing a lasting British institution, the “tea break.” However, drinking tea in social settings outside the workplace was beyond the means of the majority of British people. It came with a high price tag and tea was taxed as well.\nAround 1800, the seventh Duchess of Bedford, Anne Maria, began the popular practice of “afternoon tea,” a ceremony taking place at about four o’clock. Until then, people did not usually eat or drink anything between lunch and dinner. At approximately the same time, the Earl of Sandwich popularized a new way of eating bread—in thin slices, with something (e.g., jam or cucumbers) between them. Before long, a small meal at the end of the afternoon, involving tea and sandwiches, had become part of the British way of life.\nAs tea became much cheaper during the nineteenth century, its popularity spread right through all corners of the British society. Thus, tea became Britain’s favorite drink. In working-class households, it was served with the main meal of the day, eaten when workers returned home after a day’s labor. This meal has become known as “high tea.”\nToday, tea can be drunk at any time of the day, and accounts for over two-fifths of all beverages consumed in Britain—with the exception of water.\n\n▶ 第 53 題　How is this passage organized?", "options": ["By cause and effect.", "In the order of importance.", "In the sequence of time.", "By comparison and contrast."], "answer": 2, "answerLabel": "C", "source": "106 學測｜閱讀測驗｜第 53 題", "explanation": "17 世紀王后帶來飲茶 → 1800 年左右下午茶 → 19 世紀普及 → 今日：依時間順序組織。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nTea, the most typical English drink, became established in Britain because of the influence of a foreign princess, Catherine of Braganza, the queen of Charles II. A lover of tea since her childhood in Portugal, she brought tea-drinking to the English royal court and set a trend for the beverage in the seventeenth century. The fashion soon spread beyond the circle of the nobility to the middle classes, and tea became a popular drink at the London coffee houses where people met to do business and discuss events of the day. Many employers served a cup of tea to their workers in the middle of the morning, thus inventing a lasting British institution, the “tea break.” However, drinking tea in social settings outside the workplace was beyond the means of the majority of British people. It came with a high price tag and tea was taxed as well.\nAround 1800, the seventh Duchess of Bedford, Anne Maria, began the popular practice of “afternoon tea,” a ceremony taking place at about four o’clock. Until then, people did not usually eat or drink anything between lunch and dinner. At approximately the same time, the Earl of Sandwich popularized a new way of eating bread—in thin slices, with something (e.g., jam or cucumbers) between them. Before long, a small meal at the end of the afternoon, involving tea and sandwiches, had become part of the British way of life.\nAs tea became much cheaper during the nineteenth century, its popularity spread right through all corners of the British society. Thus, tea became Britain’s favorite drink. In working-class households, it was served with the main meal of the day, eaten when workers returned home after a day’s labor. This meal has bec  tea,” a ceremony taking place at about four o’clock. Until then, people did not usually eat or drink anything between lunch and dinner. At approximately the same time, the Earl of Sandwich popularized a new way of eating bread—in thin slices, with something (e.g., jam or cucumbers) between them. Before long, a small meal at the end of the afternoon, involving tea and sandwiches, had become part of the British way of life.\nAs tea became much cheaper during the nineteenth century, its popularity spread right through all corners of the British society. Thus, tea became Britain’s favorite drink. In working-class households, it was served with the main meal of the day, eaten when workers returned home after a day’s labor. This meal has become known as “high tea.”\nToday, tea can be drunk at any time of the day, and accounts for over two-fifths of all beverages consumed in Britain—with the exception of water.\n\n▶ 第 56 題　According to the passage, which of the following is true?", "options": ["High tea was served later in the day than afternoon tea in the nineteenth century.", "British people had tea breaks twice a day in the eighteenth century.", "Princess Catherine brought tea to England after visiting Portugal.", "The Earl of Sandwich started the afternoon tea ceremony."], "answer": 0, "answerLabel": "A", "source": "106 學測｜閱讀測驗｜第 56 題", "explanation": "下午茶約四點，high tea 是勞工下班回家後與正餐一起喝——比下午茶更晚。(A)。(C) 錯：她從葡萄牙嫁來；(D) 錯：三明治伯爵推廣的是夾餡麵包。", "explanationSource": "own", "section": "閱讀測驗"}]};</script><script>(function(){var M={};window.QUIZ_CONFIG.questions.forEach(function(q){if(q.image)M[q.question]=q.image});var qn=document.getElementById("question");if(!qn)return;function put(){var old=document.getElementById("gsatImg");var src=M[qn.textContent];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement("img");im.id="gsatImg";im.dataset.src=src;im.src=src;im.alt="題目圖片";im.style.cssText="display:block;max-width:100%;max-height:520px;ma
