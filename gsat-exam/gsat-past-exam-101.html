<script>window.QUIZ_CONFIG={"title": "101 年學測英文｜詞彙＋綜合測驗＋文意選填＋閱讀測驗", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　The ending of the movie did not come as a ______ to John because he had already read the novel that the movie was based on.", "options": ["vision", "focus", "surprise", "conclusion"], "answer": 2, "answerLabel": "C", "source": "101 學測｜詞彙｜第 1 題", "explanation": "已經讀過原著，所以結局並不「意外」：come as a surprise 令人意外。vision 視野、focus 焦點、conclusion 結論。", "explanationSource": "own", "section": "詞彙"}, {"id": 2, "question": "第 2 題　In order to stay healthy and fit, John exercises ______. He works out twice a week in a gym.", "options": ["regularly", "directly", "hardly", "gradually"], "answer": 0, "answerLabel": "A", "source": "101 學測｜詞彙｜第 2 題", "explanation": "每週固定上健身房兩次，表示「規律地」運動：regularly。directly 直接地、hardly 幾乎不、gradually 逐漸地。", "explanationSource": "own", "section": "詞彙"}, {"id": 3, "question": "第 3 題　Traveling is a good way for us to ______ different cultures and broaden our horizons.", "options": ["assume", "explore", "occupy", "inspire"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 3 題", "explanation": "旅行是「探索」不同文化、拓展視野的好方法：explore。assume 假定、occupy 占據、inspire 啟發。", "explanationSource": "own", "section": "詞彙"}, {"id": 4, "question": "第 4 題　The story about Hou-I shooting down nine suns is a well-known Chinese ______, but it may not be a true historical event.", "options": ["figure", "rumor", "miracle", "legend"], "answer": 3, "answerLabel": "D", "source": "101 學測｜詞彙｜第 4 題", "explanation": "后羿射日是著名的中國「傳說」，未必是真實歷史：legend。figure 人物、rumor 謠言、miracle 奇蹟。", "explanationSource": "own", "section": "詞彙"}, {"id": 5, "question": "第 5 題　According to recent research, children under the age of 12 are generally not ______ enough to recognize risk and deal with dangerous situations.", "options": ["diligent", "mature", "familiar", "sincere"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 5 題", "explanation": "12 歲以下兒童不夠「成熟」，難以辨識風險：mature。diligent 勤奮的、familiar 熟悉的、sincere 真誠的。", "explanationSource": "own", "section": "詞彙"}, {"id": 6, "question": "第 6 題　Helen let out a sigh of ______ after hearing that her brother was not injured in the accident.", "options": ["hesitation", "relief", "sorrow", "triumph"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 6 題", "explanation": "聽到哥哥沒受傷，鬆了一口氣：a sigh of relief。hesitation 猶豫、sorrow 悲傷、triumph 勝利。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　Research suggests that people with outgoing personalities tend to be more ______, often expecting that good things will happen.", "options": ["efficient", "practical", "changeable", "optimistic"], "answer": 3, "answerLabel": "D", "source": "101 學測｜詞彙｜第 7 題", "explanation": "外向的人常期待好事發生，較「樂觀」：optimistic。efficient 有效率的、practical 實際的、changeable 多變的。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　No one could beat Paul at running. He has won the running championship ______ for three years.", "options": ["rapidly", "urgently", "continuously", "temporarily"], "answer": 2, "answerLabel": "C", "source": "101 學測｜詞彙｜第 8 題", "explanation": "沒人跑得過他，「連續」三年奪冠：continuously。rapidly 快速地、urgently 緊急地、temporarily 暫時地。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　If you fly from Taipei to Tokyo, you’ll be taking an international, rather than a ______ flight.", "options": ["liberal", "domestic", "connected", "universal"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 9 題", "explanation": "台北飛東京是國際航線，而非「國內」航線：domestic。liberal 自由的、connected 相連的、universal 普遍的。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　Jack is very proud of his fancy new motorcycle. He has been ______ to all his friends about how cool it looks and how fast it runs.", "options": ["boasting", "proposing", "gossiping", "confessing"], "answer": 0, "answerLabel": "A", "source": "101 學測｜詞彙｜第 10 題", "explanation": "向朋友「吹噓」新機車多酷多快：boast to sb. about。propos  exhibits. The association of particular patterns with individual families can be traced back hundreds of years. Then in the Victorian era (19th century), weaving companies began to systematically record and formalize the system of setts for commercial purposes. Today there are also setts for States and Provinces, schools and universities, and general patterns that anybody can wear.\nThe kilt can be worn with accessories. On the front apron, there is often a kilt pin, topped with a small decorative family symbol. A small knife can be worn with the kilt too. It typically comes in a very wide variety, from fairly plain to quite elaborate silver- and jewel-ornamented designs. The kilt can also be worn with a sporran, which is the Gaelic word for pouch or purse.\n\n▶ 第 41 題　What’s the proper way of wearing the kilt?", "options": ["It should be worn with underwear underneath it.", "It should loosely fit on the body to be turned around.", "It should be long enough to cover the wearer’s knees.", "It should be wrapped across the front of the body two times."], "answer": 3, "answerLabel": "D", "source": "101 學測｜閱讀測驗｜第 41 題", "explanation": "第一段：從一側繞到前面、繞過背面、再「橫過前面」到另一側——前面繞兩次（重疊的部分叫 aprons）。(D)。(A) 錯：內褲隨個人喜好；(B) 錯：不可太鬆；(C) 錯：只到膝上。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 42, "question": "【閱讀測驗 第 41–44 題】\nThe kilt is a skirt traditionally worn by Scottish men. It is a tailored garment that is wrapped around the wearer’s body at the waist starting from one side, around the front and back and across the front again to the opposite side. The overlapping layers in front are called “aprons.” Usually, the kilt covers the body from the waist down to just above the knees. A properly made kilt should not be so loose that the wearer can easily twist the kilt around the body, nor should it be so tight that it causes bulging of the fabric where it is buckled. Underwear may be worn as one prefers.\nOne of the most distinctive features of the kilt is the pattern of squares, or sett, it exhibits. The association of particular patterns with individual families can be traced back hundreds of years. Then in the Victorian era (19th century), weaving companies began to systematically record and formalize the system of setts for commercial purposes. Today there are also setts for States and Provinces, schools and universities, and general patterns that anybody can wear.\nThe kilt can be worn with accessories. On the front apron, there is often a kilt pin, topped with a small decorative family symbol. A small knife can be worn with the kilt too. It typically comes in a very wide variety, from fairly plain to quite elaborate silver- and jewel-ornamented designs. The kilt can also be worn with a sporran, which is the Gaelic word for pouch or purse.\n\n▶ 第 42 題　Which of the following is a correct description about setts?", "options": ["They were once symbols for different Scottish families.", "They were established by the government for business purposes.", "They represented different States and Provinces in the 19th century.", "They used to come in one general pattern for all individuals and institutions."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 42 題", "explanation": "第二段：特定格紋與「個別家族」的關聯可追溯數百年。(A)。(B) 錯：是織布公司而非政府記錄；(C) 州省圖案是「今日」才有。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 43, "question": "【閱讀測驗 第 41–44 題】\nThe kilt is a skirt traditionally worn by Scottish men. It is a tailored garment that is wrapped around the wearer’s body at the waist starting from one side, around the front and back and across the front again to the opposite side. The overlapping layers in front are called “aprons.” Usually, the kilt covers the body from the waist down to just above the knees. A properly made kilt should not be so loose that the wearer can easily twist the kilt around the body, nor should it be so tight that it causes bulging of the fabric where it is buckled. Underwear may be worn as one prefers.\nOne of the most distin an be traced back hundreds of years. Then in the Victorian era (19th century), weaving companies began to systematically record and formalize the system of setts for commercial purposes. Today there are also setts for States and Provinces, schools and universities, and general patterns that anybody can wear.\nThe kilt can be worn with accessories. On the front apron, there is often a kilt pin, topped with a small decorative family symbol. A small knife can be worn with the kilt too. It typically comes in a very wide variety, from fairly plain to quite elaborate silver- and jewel-ornamented designs. The kilt can also be worn with a sporran, which is the Gaelic word for pouch or purse.\n\n▶ 第 44 題　What is the purpose of this passage?", "options": ["To introduce a Scottish garment.", "To advertise a weaving pattern.", "To persuade men to wear kilts.", "To compare a skirt with a kilt."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 44 題", "explanation": "全文客觀介紹蘇格蘭裙的穿法、格紋、配件——介紹一種蘇格蘭服飾。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 45, "question": "【閱讀測驗 第 45–48 題】\nWesla Whitfield, a famous jazz singer, has a unique style and life story, so I decided to see one of her performances and interview her for my column.\nI went to a nightclub in New York and watched the stage lights go up. After the band played an introduction, Wesla Whitfield wheeled herself onstage in a wheelchair. As she sang, Whitfield’s voice was so powerful and soulful that everyone in the room forgot the wheelchair was even there.\nAt 57, Whitfield is small and pretty, witty and humble, persistent and philosophical. Raised in California, Whitfield began performing in public at age 18, when she took a job as a singing waitress at a pizza parlor. After studying classical music in college, she moved to San Francisco and went on to sing with the San Francisco Opera Chorus.\nWalking home from rehearsal at age 29, she was caught in the midst of a random shooting that left her paralyzed from the waist down. I asked how she dealt with the realization that she’d never walk again, and she confessed that initially she didn’t want to face it. After a year of depression she tried to kill herself. She was then admitted to a hospital for treatment, where she was able to recover.\nWhitfield said she came to understand that the only thing she had lost in this misfortunate event was the ability to walk. She still possessed her most valuable asset—her mind. Pointing to her head, she said, “Everything important is in here. The only real disability in life is losing your mind.” When I asked if she was angry about what she had lost, she admitted to being frustrated occasionally, “especially when everybody’s dancing, because I love to dance. But when that happens I just remove myself so I can focus instead on what I can do.”\n\n▶ 第 45 題　In which of the following places has Wesla Whitfield worked?", "options": ["A college.", "A hospital.", "A pizza parlor.", "A news agency."], "answer": 2, "answerLabel": "C", "source": "101 學測｜閱讀測驗｜第 45 題", "explanation": "第三段：18 歲時在「披薩店」當會唱歌的女服務生。(C)。(B) 錯：醫院是去治療不是工作。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 46, "question": "【閱讀測驗 第 45–48 題】\nWesla Whitfield, a famous jazz singer, has a unique style and life story, so I decided to see one of her performances and interview her for my column.\nI went to a nightclub in New York and watched the stage lights go up. After the band played an introduction, Wesla Whitfield wheeled herself onstage in a wheelchair. As she sang, Whitfield’s voice was so powerful and soulful that everyone in the room forgot the wheelchair was even there.\nAt 57, Whitfield is small and pretty, witty and humble, persistent and philosophical. Raised in California, Whitfield began performing in public at age 18, when she took a job as a singing waitress at a pizza parlor. After studying classical music in college, she moved to San Francisco and went on to sing with the San Francisco Opera Chorus.\nWalking home from rehearsal at age 29, she was caught in the midst of a random shooting that left her paralyzed from the waist down. I asked how she dealt with the realization that she’d never walk again, and she confessed that initially she didn’t want to face it. After a year of depression she tried to kill herself. She was then admitted to a hospital for treatment, where she was able to recover.\nWhitfield said she came to understand that the only thing she had lost in this misfortunate event was the ability to walk. She still possessed her most valuable asset—her mind. Pointing to her head, she said, “Everything important is in here. The only real disability in life is losing your mind.” When I asked if she was angry about what she had lost, she admitted to being frustrated occasionally, “especially when everybody’s dancing, because I love to dance. But when that happens I just remove myself so I can focus instead on what I can do.”\n\n▶ 第 46 題　What does “when that happens” mean in the last paragraph?", "options": ["When Wesla is losing her mind.", "When Wesla is singing on the stage.", "When Wesla is going out in her wheelchair.", "When Wesla is watching other people dancing."], "answer": 3, "answerLabel": "D", "source": "101 學測｜閱讀測驗｜第 46 題", "explanation": "前句：「尤其當大家都在跳舞的時候」會感到挫折——that 指看到別人跳舞。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 47, "question": "【閱讀測驗 第 45–48 題】\nWesla Whitfield, a famous jazz singer, has a unique style and life story, so I decided to see one of her performances and interview her for my column.\nI went to a nightclub in New York and watched the stage lights go up. After the band played an introduction, Wesla Whitfield wheeled herself onstage in a wheelchair. As she sang, Whitfield’s voice was so powerful and soulful that everyone in the room forgot the wheelchair was even there.\nAt 57, Whitfield is small and pretty, witty and humble, persistent and philosophical. Raised in California, Whitfield began performing in public at age 18, when she took a job as a singing waitress at a pizza parlor. After studying classical music in college, she moved to San Francisco and went on to sing with the San Francisco Opera Chorus.\nWalking home from rehearsal at age 29, she was caught in the midst of a random shooting that left her paralyzed from the waist down. I asked how she dealt with the realization that she’d never walk again, and she confessed that initially she didn’t want to face it. After a year of depression she tried to kill herself. She was then admitted to a hospital for treatment, where she was able to recover.\nWhitfield said she came to understand that the only thing she had lost in this misfortunate event was the ability to walk. She still possessed her most valuable asset—her mind. Pointing to her head, she said, “Everything important is in here. The only real disability in life is losing your mind.” When I asked if she was angry about what she had lost, she admitted to being frustrated occasionally, “especially when everybody’s dancing, because I love to dance. But when that happens I just remove myself so I can focus instead on what I can do.”\n\n▶ 第 47 題　Which of the following statements is true about Wesla Whitfield’s physical disability?", "options": ["It was caused by a traffic accident.", "It made her sad and depressed at first.", "It seriously affected her singing career.", "It happened when she was a college student."], "answer": 1, "answerLabel": "B", "source": "101 學測｜閱讀測驗｜第 47 題", "explanation": "第四段：起初她不願面對，憂鬱了一年甚至想自殺——一開始讓她悲傷沮喪。(B)。(A) 錯：是隨機槍擊；(D) 錯：是 29 歲走路回家時。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 48, "question": "【閱讀測驗 第 45–48 題】\nWesla Whitfield, a famous jazz singer, has a unique style and life story, so I decided to see one of her performances and interview her for my column.\nI went to a nightclub in New York and watched the stage lights go up. After the band played an introduction, Wesla Whitfield wheeled herself onstage in a wheelchair. As she sang, Whitfield’s voice was so powerful and soulful that everyone in the room forgot the wheelchair was even there.\nAt 57, Whitfield is small and pretty, witty and humble, persistent and philosophical. Raised in California, Whitfield began performing in public at age 18, when she took a job as a singing waitress at a pizza parlor. After studying classical music in college, she moved to San Francisco and went on to sing with the San Francisco Opera Chorus.\nWalking home from rehearsal at age 29, she was caught in the midst of a random shooting that left her paralyzed from the waist down. I asked how she dealt with the realization that she’d never walk again, and she confessed that initially she didn’t want to face it. After a year of depression she tried to kill herself. She was then admitted to a hospital for treatment, where she was able to recover.\nWhitfield said she came to understand that the only thing she had lost in this misfortunate event was the ability to walk. She still possessed her most valuable asset—her mind. Pointing to her head, she said, “Everything important is in here. The only real disability in life is losing your mind.” When I asked if she was angry about what she had lost, she admitted to being frustrated occasionally, “especially when everybody’s dancing, because I love to dance. But when that happens I just remove myself so I can focus instead on what I can do.”\n\n▶ 第 48 題　What advice would Wesla most likely give other disabled people?", "options": ["Ignore what you have lost and make the best use of what you have.", "Be modest and hard-working to earn respect from other people.", "Acquire a skill so that you can still be successful and famous.", "Try to sing whenever you feel upset and depressed."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 48 題", "explanation": "最後一段：她只失去走路的能力，仍擁有最寶貴的心智；挫折時就「專注在我能做的事上」。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 49, "question": "【閱讀測驗 第 49–52 題】\nForks trace their origins back to the ancient Greeks. Forks at that time were fairly large with two tines that aided in the carving of meat in the kitchen. The tines prevented meat from twisting or moving during carving and allowed food to slide off more easily than it would with a knife.\nBy the 7th century A.D., royal courts of the Middle East began to use forks at the table for dining. From the 10th through the 13th centuries, forks were fairly common among the wealthy in Byzantium. In the 11th century, a Byzantine wife brought forks to Italy; however, they were not widely adopted there until the 16th century. Then in 1533, forks were brought from Italy to France. The French were also slow to accept forks, for using them was thought to be awkward.\nIn 1608, forks were brought to England by Thomas Coryate, who saw them during his travels in Italy. The English first ridiculed forks as being unnecessary. “Why should a person need a fork when God had given him hands?” they asked. Slowly, however, forks came to be adopted by the wealthy as a symbol of their social status. They were prized possessions made of expensive materials intended to impress guests. By the mid 1600s, eating with forks was considered fashionable among the wealthy British.\nEarly table forks were modeled after kitchen forks, but small pieces of food often fell through the two tines or slipped off easily. In late 17th century France, larger forks with four curved tines were developed. The additional tines made diners less likely to drop food, and the curved tines served as a scoop so people did not have to constantly switch to a spoon while eating. By the early 19th century, four-tined forks had also been developed in Germany and England and slowly began to spread to America.\n\n▶ 第 49 題　What is the passage mainly about?", "options": ["The different designs of forks.", "The spread of fork-aided cooking.", "The history of using forks for dining.", "The development of fork-related table manners."], "answe e use of forks spread?", "options": ["Middle East → Greece → England → Italy → France", "Greece → Middle East → Italy → France → England", "Greece → Middle East → France → Italy → Germany", "Middle East → France → England → Italy → Germany"], "answer": 1, "answerLabel": "B", "source": "101 學測｜閱讀測驗｜第 50 題", "explanation": "依文章順序：古希臘 → 7 世紀中東宮廷 → 11 世紀義大利 → 1533 法國 → 1608 英國。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 51, "question": "【閱讀測驗 第 49–52 題】\nForks trace their origins back to the ancient Greeks. Forks at that time were fairly large with two tines that aided in the carving of meat in the kitchen. The tines prevented meat from twisting or moving during carving and allowed food to slide off more easily than it would with a knife.\nBy the 7th century A.D., royal courts of the Middle East began to use forks at the table for dining. From the 10th through the 13th centuries, forks were fairly common among the wealthy in Byzantium. In the 11th century, a Byzantine wife brought forks to Italy; however, they were not widely adopted there until the 16th century. Then in 1533, forks were brought from Italy to France. The French were also slow to accept forks, for using them was thought to be awkward.\nIn 1608, forks were brought to England by Thomas Coryate, who saw them during his travels in Italy. The English first ridiculed forks as being unnecessary. “Why should a person need a fork when God had given him hands?” they asked. Slowly, however, forks came to be adopted by the wealthy as a symbol of their social status. They were prized possessions made of expensive materials intended to impress guests. By the mid 1600s, eating with forks was considered fashionable among the wealthy British.\nEarly table forks were modeled after kitchen forks, but small pieces of food often fell through the two tines or slipped off easily. In late 17th century France, larger forks with four curved tines were developed. The additional tines made diners less likely to drop food, and the curved tines served as a scoop so people did not have to constantly switch to a spoon while eating. By the early 19th century, four-tined forks had also been developed in Germany and England and slowly began to spread to America.\n\n▶ 第 51 題　How did forks become popular in England?", "options": ["Wealthy British were impressed by the design of forks.", "Wealthy British thought it awkward to use their hands to eat.", "Wealthy British gave special forks to the nobles as luxurious gifts.", "Wealthy British considered dining with forks a sign of social status."], "answer": 3, "answerLabel": "D", "source": "101 學測｜閱讀測驗｜第 51 題", "explanation": "第三段：叉子逐漸被富人採用，作為「社會地位的象徵」。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 52, "question": "【閱讀測驗 第 49–52 題】\nForks trace their origins back to the ancient Greeks. Forks at that time were fairly large with two tines that aided in the carving of meat in the kitchen. The tines prevented meat from twisting or moving during carving and allowed food to slide off more easily than it would with a knife.\nBy the 7th century A.D., royal courts of the Middle East began to use forks at the table for dining. From the 10th through the 13th centuries, forks were fairly common among the wealthy in Byzantium. In the 11th century, a Byzantine wife brought forks to Italy; however, they were not widely adopted there until the 16th century. Then in 1533, forks were brought from Italy to France. The French were also slow to accept forks, for using them was thought to be awkward.\nIn 1608, forks were brought to England by Thomas Coryate, who saw them during his travels in Italy. The English first ridiculed forks as being unnecessary. “Why should a person need a fork when God had given him hands?” they asked. Slowly, however, forks came to be adopted by the wealthy as a symbol of their social status. They were prized possessions made of expensive materials intended to impress guests. By the mid 1600s, eating with forks was considered fashionable among the wealthy British.\nEarly table forks were modeled after kitchen forks, but small pieces of food often fell through the two tines or slipped off easily. In late 17th century France, larger forks with four curved tines were developed. The additional tines made diners less likely to drop food, and the curved tines served as a scoop so people did not have to constantly switch to a spoon while eating. By the early 19th century, four-tined forks had also been developed in Germany and England and slowly began to spread to America.\n\n▶ 第 52 題　Why were forks made into a curved shape?", "options": ["They could be used to scoop food as well.", "They looked more fashionable in this way.", "They were designed in this way for export to the US.", "They ensured the meat would not twist while being cut."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 52 題", "explanation": "第四段：彎曲的叉齒「可以當作湯匙舀食物」，不必一直換湯匙。(A)。(D) 是廚房叉子的功能。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nAnimals are a favorite subject of many photographers. Cats, dogs, and other pets top the list, followed by zoo animals. However, because it’s hard to get them to sit still and “perform on command,” some professional photographers refuse to photograph pets.\nOne way to get an appealing portrait of a cat or dog is to hold a biscuit or treat above the camera. The animal’s longing look toward the food will be captured by the camera, but the treat won’t appear in the picture because it’s out of the camera’s range. When you show the picture to your friends afterwards, they’ll be impressed by your pet’s loving expression.\nIf you are using fast film, you can take some good, quick shots of a pet by simply snapping a picture right after calling its name. You’ll get a different expression from your pet using this technique. Depending on your pet’s mood, the picture will capture an interested, curious expression or possibly a look of annoyance, especially if you’ve awakened it from a nap.\nTaking pictures of zoo animals requires a little more patience. After all, you can’t wake up a lion! You may have to wait for a while until the animal does something interesting or moves into a position for you to get a good shot. When photographing zoo animals, don’t get too close to the cages, and never tap on the glass or throw things between the bars of a cage. Concentrate on shooting some good pictures, and always respect the animals you are photographing.\n\n▶ 第 53 題　Why do some professional photographers NOT like to take pictures of pets?", "options": ["Pets may not follow orders.", "Pets don’t want to be bothered.", "Pets may not like photographers.", "Pets seldom change their expressions."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 53 題", "explanation": "第一段：寵物很難乖乖坐好、「聽指令表演」，所以有些專業攝影師不拍。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nAnimals are a favorite subject of many photographers. Cats, dogs, and other pets top the list, followed by zoo animals. However, because it’s hard to get them to sit still and “perform on command,” some professional photographers refuse to photograph pets.\nOne way to get an appealing portrait of a cat or dog is to hold a biscuit or treat above the camera. The animal’s longing look toward the food will be captured by the camera, but the treat won’t appear in the picture because it’s out of the camera’s range. When you show the picture to your friends afterwards, they’ll be impressed by your pet’s loving expression.\nIf you are using fast film, you can take some good, quick shots of a pet by simply snapping a picture right after calling its name. You’ll get a different expression from your pet using this technique. Depending on your pet’s mood, the picture will capture an interested, curious expression or possibly a look of annoyance, especially if you’ve awakened it from a nap.\nTaking pictures of zoo animals requires a little more patience. After all, you can’t wake up a lion! You may have to wait for a while until the animal does something interesting or moves into a position for you to get a good shot. When photographing zoo animals, don’t get too close to the cages, and never tap on the glass or throw things between the bars of a cage. Concentrate on shooting some good pictures, and always respect the animals you are photographing.\n\n▶ 第 54 題　What is the use of a biscuit in taking pictures of a pet?", "options": ["To capture a cute look.", "To create a special atmosphere.", "To arouse the appetite of the pet.", "To keep the pet from looking at the camera."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 54 題", "explanation": "第二段：把餅乾舉在相機上方，相機會捕捉到寵物渴望的眼神——拍到可愛的表情。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 55, "question": "【閱讀測驗 第 53–56 題】\nAnimals are a favorite subject of many photographers. Cats, dogs, and other pets top the list, followed by zoo animals. However, because it’s hard to get them to sit still and “perform on command,” some professional photographers refuse to photograph pets.\nOne way to get an appealing portrait of a cat or dog is to hold a biscuit or treat above the camera. The animal’s longing look toward the food will be captured by the camera, but the treat won’t appear in the picture because it’s out of the camera’s range. When you show the picture to your friends afterwards, they’ll be impressed by your pet’s loving expression.\nIf you are using fast film, you can take some good, quick shots of a pet by simply snapping a picture right after calling its name. You’ll get a different expression from your pet using this technique. Depending on your pet’s mood, the picture will capture an interested, curious expression or possibly a look of annoyance, especially if you’ve awakened it from a nap.\nTaking pictures of zoo animals requires a little more patience. After all, you can’t wake up a lion! You may have to wait for a while until the animal does something interesting or moves into a position for you to get a good shot. When photographing zoo animals, don’t get too close to the cages, and never tap on the glass or throw things between the bars of a cage. Concentrate on shooting some good pictures, and always respect the animals you are photographing.\n\n▶ 第 55 題　What is the advantage of calling your pet’s name when taking a shot of it?", "options": ["To help your pet look its best.", "To make sure that your pet sits still.", "To keep your pet awake for a while.", "To catch a different expression of your pet."], "answer": 3, "answerLabel": "D", "source": "101 學測｜閱讀測驗｜第 55 題", "explanation": "第三段：叫名字後立刻拍，會得到「不同的表情」（好奇或被吵醒的不悅）。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 56, "question": "【閱讀測驗 第 53–56 題】\nAnimals are a favorite subject of many photographers. Cats, dogs, and other pets top the list, followed by zoo animals. However, because it’s hard to get them to sit still and “perform on command,” some professional photographers refuse to photograph pets.\nOne way to get an appealing portrait of a cat or dog is to hold a biscuit or treat above the camera. The animal’s longing look toward the food will be captured by the camera, but the treat won’t appear in the picture because it’s out of the camera’s range. When you show the picture to your friends afterwards, they’ll be impressed by your pet’s loving expression.\nIf you are using fast film, you can take some good, quick shots of a pet by simply snapping a picture right after calling its name. You’ll get a different expression from your pet using this technique. Depending on your pet’s mood, the picture will capture an interested, curious expression or possibly a look of annoyance, especially if you’ve awakened it from a nap.\nTaking pictures of zoo animals requires a little more patience. After all, you can’t wake up a lion! You may have to wait for a while until the animal does something interesting or moves into a position for you to get a good shot. When photographing zoo animals, don’t get too close to the cages, and never tap on the glass or throw things between the bars of a cage. Concentrate on shooting some good pictures, and always respect the animals you are photographing.\n\n▶ 第 56 題　In what way is photographing zoo animals different from photographing pets?", "options": ["You need to have fast film.", "You need special equipment.", "You need to stay close to the animals.", "You need more time to watch and wait."], "answer": 3, "answerLabel": "D", "source": "101 學測｜閱讀測驗｜第 56 題", "explanation": "第四段：拍動物園動物需要更多耐心，你叫不醒獅子，可能要「等一段時間」。(D)。(C) 相反：不要太靠近籠子。", "explanationSource": "own", "section": "閱讀測驗"}]};</script><script>(function(){var M={};window.QUIZ_CONFIG.questions.forEach(function(q){if(q.image)M[q.question]=q.image});var qn=document.getElementById("question");if(!qn)return;function put(){var old=document.getElementById("gsatImg");var src=M[qn.textContent];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement("img");im.id="gsatImg";im.dataset.src=src;im.src=src;im.alt="題目圖片";im.style.cssText="display:block;max-width:100%;max-height:520px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;background:#fff";qn.insertAdjacentElement("afterend",im)}new MutationObserver(put).observe(qn,{childList:true,characterData:true,subtree:true});})();</script><script src="quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="101 年學測英文：詞彙 15＋綜合測驗 15＋文意選填 10＋閱讀測驗 16｜共 56 題｜單選｜附中文解析｜Level 3–6 單字滑過即看中譯與字卡｜可隨機 20 題、隨時結束並下載 DOCX 錯題";</script><script src="lexicon.js?v=20261120-6"></script><script src="vocab-hover.js?v=20261120-6"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
