ir usual, main sport (that is, to cross-train), at least some of the time. Still others say the safest thing to do is cross-train all the time until the pain is gone. __33__ Their consensus, however, is that unless the injury involves something as serious as a broken bone or a ripped muscle, moderate exercise can actually speed healing.\n__34__ Thus, more and more patients are now advised to keep moving despite the pain. The rule of thumb, however, is to see a doctor first and get an accurate diagnosis. If a serious injury is ruled out and the pain is not getting worse after exercising, then the exercise “makes a lot of sense.”\n\n▶ 第 31 題　請選出最適合放入 __31__ 的句子", "options": ["For example, an injured runner might end up cycling and swimming instead of running.", "Over time, researchers have come to realize the importance of exercising when injured.", "Many suggest that most patients can continue with the sport they love.", "This seems to run counter to the common practice."], "answer": 3, "answerLabel": "D", "source": "113 學測｜篇章結構｜第 31 題", "explanation": "此段開頭：後文說人們通常被勸告扭傷後不要馬上運動，但 Weinstein 醫師認為這過時。(D)「這似乎與一般做法相反」承接上段他受傷卻去跑步的故事。", "explanationSource": "own", "section": "篇章結構"}, {"id": 32, "question": "【篇章結構 第 31–34 題】\nWhile Dr. Weinstein, a surgeon at Dartmouth College, was trying to lift a heavy box, he twisted his back. The pain was agonizing. The surgeon could not sit, and when he lay down he could barely get up. So he decided to go out for a run. He took an aspirin, iced the injured area, and off he went. When he returned, he felt “pretty good.”\n__31__ When people have sprained a muscle or tendon, they are usually advised not to go right back to exercising until the pain goes away. But Dr. Weinstein says that approach is outdated and counterproductive. In fact, when active people consult him, he usually tells them to just keep exercising.\nDr. Weinstein is not alone in his treatment of sports injury, but the specific advice can differ from specialist to speciali en people have sprained a muscle or tendon, they are usually advised not to go right back to exercising until the pain goes away. But Dr. Weinstein says that approach is outdated and counterproductive. In fact, when active people consult him, he usually tells them to just keep exercising.\nDr. Weinstein is not alone in his treatment of sports injury, but the specific advice can differ from specialist to specialist. __32__ They nevertheless caution that a cutback may be necessary, such as running shorter distances or going more slowly. Others say the patients may need to engage in sports outside of their usual, main sport (that is, to cross-train), at least some of the time. Still others say the safest thing to do is cross-train all the time until the pain is gone. __33__ Their consensus, however, is that unless the injury involves something as serious as a broken bone or a ripped muscle, moderate exercise can actually speed healing.\n__34__ Thus, more and more patients are now advised to keep moving despite the pain. The rule of thumb, however, is to see a doctor first and get an accurate diagnosis. If a serious injury is ruled out and the pain is not getting worse after exercising, then the exercise “makes a lot of sense.”\n\n▶ 第 34 題　請選出最適合放入 __34__ 的句子", "options": ["For example, an injured runner might end up cycling and swimming instead of running.", "Over time, researchers have come to realize the importance of exercising when injured.", "Many suggest that most patients can continue with the sport they love.", "This seems to run counter to the common practice."], "answer": 1, "answerLabel": "B", "source": "113 學測｜篇章結構｜第 34 題", "explanation": "此段開頭，後句 Thus 說越來越多病人被建議帶著疼痛持續運動。(B)「隨著時間，研究者逐漸了解受傷時運動的重要性」是其原因。", "explanationSource": "own", "section": "篇章結構"}, {"id": 35, "question": "【閱讀測驗 第 35–38 題】\nOne fine morning in 1941, Swiss engineer George de Mestral went for a walk in the woods with his dog. Upon their return home, he found a lot of burrs (from plants) stuck to the dog’s fur and his pants. He immediately rushed to his microscope and examined the burrs attached on his pants—feeling a lightbulb moment coming on.\nUpon closer examination, de Mestral observed that the burrs, which appeared straight to the naked eye, actually contained many small hooks that clung firmly to the loops in the fabric of his pants. He determined that if he could recreate the same thing, making hooks-and-loops that bind to each other firmly, he could produce a strong fastener with many uses.\nDe Mestral’s first challenge was finding a fabric for a strong bonding system. He first tried cotton, but it proved too soft and could not withstand repeated openings and closures. After years of research and testing, he learned that synthetics worked best and eventually settled on heat-treated nylon, a strong and durable substance. By 1955, he had completed an improved version of the product, with each square inch of material containing 300 hooks, which made it stay fastened and yet easy enough to pull apart when needed. Named “Velcro,” from the French words velours (velvet) and crochet (hook), the new product received a patent from the Swiss government in 1955. De Mestral thus began mass-producing Velcro, opening plants in Europe and eventually into Canada and the United States.\nInitially Velcro did not fare well. As most fashion critics considered it ugly and cheap-looking, the use of Velcro was limited to athletic equipment. In the early 1960s, the product received a huge boost in popularity when NASA began using it in a lot of equipment that went into space along with astronauts. Today, de Mestral’s design is found almost everywhere: clothing and footwear, toys, airline seat cushions, blood pressure cuffs and surgeons’ gowns. Most impressively, the magical fastener was used in the first human artificial heart transplantation to hold together parts of the device.\n\n▶ 第 35 題　Which of the following pictures shows de Mestral’s invention?", "options": [" sy enough to pull apart when needed. Named “Velcro,” from the French words velours (velvet) and crochet (hook), the new product received a patent from the Swiss government in 1955. De Mestral thus began mass-producing Velcro, opening plants in Europe and eventually into Canada and the United States.\nInitially Velcro did not fare well. As most fashion critics considered it ugly and cheap-looking, the use of Velcro was limited to athletic equipment. In the early 1960s, the product received a huge boost in popularity when NASA began using it in a lot of equipment that went into space along with astronauts. Today, de Mestral’s design is found almost everywhere: clothing and footwear, toys, airline seat cushions, blood pressure cuffs and surgeons’ gowns. Most impressively, the magical fastener was used in the first human artificial heart transplantation to hold together parts of the device.\n\n▶ 第 37 題　Which of the following statements about Velcro is true?", "options": ["It has been a market favorite since its first appearance.", "Cotton was not durable enough to be used as its materials.", "It was given a French name because it was first produced in France.", "The design was intended to look as shiny and smooth as velvet."], "answer": 1, "answerLabel": "B", "source": "113 學測｜閱讀測驗｜第 37 題", "explanation": "第三段：棉太軟，禁不起反覆開合。(B)。(A) 錯：起初賣不好；(C) 錯：名字取自法文字 velours 與 crochet，與產地無關。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 38, "question": "【閱讀測驗 第 35–38 題】\nOne fine morning in 1941, Swiss engineer George de Mestral went for a walk in the woods with his dog. Upon their return home, he found a lot of burrs (from plants) stuck to the dog’s fur and his pants. He immediately rushed to his microscope and examined the burrs attached on his pants—feeling a lightbulb moment coming on.\nUpon closer examination, de Mestral observed that the burrs, which appeared straight to the naked eye, actually contained many small hooks that clung firmly to the loops in the fabric of famous painter in the 19th century, played an important role in the establishment of American national parks. His vivid paintings brought the splendor of the extraordinary landscapes before the eyes of American people, thus setting the stage for the regions to be widely recognized and officially established as national parks.\nMoran came to the United States at age 7 with his family and settled in Philadelphia. They came from northwest England, the blackened heart of the Industrial Revolution: Its main street was “a dark, unattractive hole” and the river running through it was a string of dirty water. That was all the nature that Moran knew. Moran began painting by age 15, inspired by the landscape paintings of the British master J.M.W. Turner. There was plenty of landscape for him to paint in America, much different from his hometown. Showing great talent in painting, Moran was soon hired as an illustrator at Scribner’s Monthly, and later appointed chief illustrator by age 34. In 1871, he was appointed to illustrate The Wonders of Yellowstone, a story by Nathaniel P. Langford, who had participated in an expedition to Yellowstone. Captivated by the utterly fantastic sights Langford described, Moran became eager to see this odd territory for himself.\nIn 1871 Moran joined the first US government survey of the Yellowstone region with photographer William Henry Jackson. For two weeks he filled his sketchbook with the landscape’s most stunning sights. Moran’s watercolors—the first color renderings of the area—as well as Jackson’s photos and the survey results were presented to the Congress. His powerful images of Yellowstone fired the imagination of Congress members. In March 1872, lawmakers officially made Yellowstone a national park, the world’s first.\nBefore Moran arrived, Yellowstone in the popular imagination was a harsh, wild place with hot water and steam coming out of hellish holes in the ground. Since the painter’s work appeared, Yellowstone National Park has  the Yellowstone region with photographer William Henry Jackson. For two weeks he filled his sketchbook with the landscape’s most stunning sights. Moran’s watercolors—the first color renderings of the area—as well as Jackson’s photos and the survey results were presented to the Congress. His powerful images of Yellowstone fired the imagination of Congress members. In March 1872, lawmakers officially made Yellowstone a national park, the world’s first.\nBefore Moran arrived, Yellowstone in the popular imagination was a harsh, wild place with hot water and steam coming out of hellish holes in the ground. Since the painter’s work appeared, Yellowstone National Park has come to be known as a picturesque wonderland. By the time Moran died, he had painted a dozen other areas that would become national parks or monuments.\n\n▶ 第 40 題　Why does the author use “the blackened heart” in paragraph 2 to describe Moran’s hometown?", "options": ["The place was severely polluted.", "The town was filled with darkened holes.", "There were many evil-hearted industry owners.", "The laborers mostly wore dark and dirty uniforms."], "answer": 0, "answerLabel": "A", "source": "113 學測｜閱讀測驗｜第 40 題", "explanation": "後文說主街是「黑暗、難看的洞」，河水骯髒——工業革命重鎮污染嚴重。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 41, "question": "【閱讀測驗 第 39–42 題】\nThomas Moran, a famous painter in the 19th century, played an important role in the establishment of American national parks. His vivid paintings brought the splendor of the extraordinary landscapes before the eyes of American people, thus setting the stage for the regions to be widely recognized and officially established as national parks.\nMoran came to the United States at age 7 with his family and settled in Philadelphia. They came from northwest England, the blackened heart of the Industrial Revolution: Its main street was “a dark, unattractive hole” and the river running through it was a string of dirty water. That was all the nature that Moran kn
