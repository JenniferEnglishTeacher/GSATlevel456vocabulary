<script>window.QUIZ_CONFIG={"title": "97 年學測英文｜詞彙＋綜合測驗＋文意選填", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Amy did not ______ changes in the course schedule and therefore missed the class.", "options": ["arrest", "alarm", "notice", "delay"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 1 題", "explanation": "沒有「注意到」課表更動，因此錯過上課：notice 注意到。arrest 逮捕、alarm 使驚恐、delay 延誤皆不合。", "explanationSource": "own", "section": "詞彙"}, {"id": 2, "question": "第 2 題　It is not easy for old people to ______ their backs, so they need help when their backs itch.", "options": ["label", "scratch", "lighten", "squeeze"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 2 題", "explanation": "背癢時需要人幫忙，表示老人不容易「抓」自己的背：scratch 抓、搔。label 貼標籤、lighten 變亮、squeeze 擠壓。", "explanationSource": "own", "section": "詞彙"}, {"id": 3, "question": "第 3 題　Mary is suffering from a stomachache and needs to eat food which is easy to ______.", "options": ["launch", "invade", "adopt", "digest"], "answer": 3, "answerLabel": "D", "source": "97 學測｜詞彙｜第 3 題", "explanation": "胃痛時要吃容易「消化」的食物：digest 消化。launch 發射、invade 入侵、adopt 採用。", "explanationSource": "own", "section": "詞彙"}, {"id": 4, "question": "第 4 題　Since our classroom is not air-conditioned, we have to ______ the heat during the hot summer days.", "options": ["consume", "tolerate", "recover", "promote"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 4 題", "explanation": "教室沒冷氣，只能「忍受」炎熱：tolerate 忍受。consume 消耗、recover 恢復、promote 促進。", "explanationSource": "own", "section": "詞彙"}, {"id": 5, "question": "第 5 題　Sue is so ______ that she always breaks something when she is shopping at a store.", "options": ["religious", "visual", "clumsy", "intimate"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 5 題", "explanation": "逛街總是打破東西，表示她很「笨手笨腳」：clumsy。religious 虔誠的、visual 視覺的、intimate 親密的。", "explanationSource": "own", "section": "詞彙"}, {"id": 6, "question": "第 6 題　Ann enjoyed going to the flower market. She believed that the ______ of flowers refreshed her mind.", "options": ["instance", "dominance", "appliance", "fragrance"], "answer": 3, "answerLabel": "D", "source": "97 學測｜詞彙｜第 6 題", "explanation": "花的「香氣」使她精神一振：fragrance 芳香。instance 例子、dominance 支配、appliance 家電。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　The profits of Prince Charles’s organic farm go to ______ to help the poor and the sick.", "options": ["charities", "bulletins", "harvests", "rebels"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 7 題", "explanation": "有機農場的利潤捐給「慈善機構」幫助窮人和病人：charities。bulletin 公告、harvest 收成、rebel 反叛者。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　Jack was given the rare ______ of using the president’s office, which made others quite jealous.", "options": ["mischief", "privilege", "involvement", "occupation"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 8 題", "explanation": "能使用總裁辦公室是罕見的「特權」，令人嫉妒：privilege。mischief 惡作劇、involvement 參與、occupation 職業。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　This new computer is obviously ______ to the old one because it has many new functions.", "options": ["technical", "suitable", "superior", "typical"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 9 題", "explanation": "新電腦功能多，明顯「優於」舊電腦：be superior to 優於（固定搭配 to）。technical 技術的、suitable 適合的、typical 典型的。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　Simon loves his work. To him, work always comes first, and family and friends are ______.", "options": ["secondary", "temporary", "sociable", "capable"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 10 題", "explanation": "工作永遠第一，家人朋友就是「次要的」：secondary。temporary 暫時的、sociable 善於社交的、capable 有能力的。", "explanationSource": "own", "section": "詞彙"}, {"id": 11, "question": "第 11 題　Although your plans look good, you have to be ______ and consider what you can actually do.", "options": ["dramatic", "realistic", "stressful",
