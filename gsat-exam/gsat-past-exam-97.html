___ of flowers refreshed her mind.", "options": ["instance", "dominance", "appliance", "fragrance"], "answer": 3, "answerLabel": "D", "source": "97 學測｜詞彙｜第 6 題", "explanation": "花的「香氣」使她精神一振：fragrance 芳香。instance 例子、dominance 支配、appliance 家電。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　The profits of Prince Charles’s organic farm go to ______ to help the poor and the sick.", "options": ["charities", "bulletins", "harvests", "rebels"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 7 題", "explanation": "有機農場的利潤捐給「慈善機構」幫助窮人和病人：charities。bulletin 公告、harvest 收成、rebel 反叛者。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　Jack was given the rare ______ of using the president’s office, which made others quite jealous.", "options": ["mischief", "privilege", "involvement", "occupation"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 8 題", "explanation": "能使用總裁辦公室是罕見的「特權」，令人嫉妒：privilege。mischief 惡作劇、involvement 參與、occupation 職業。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　This new computer is obviously ______ to the old one because it has many new functions.", "options": ["technical", "suitable", "superior", "typical"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 9 題", "explanation": "新電腦功能多，明顯「優於」舊電腦：be superior to 優於（固定搭配 to）。technical 技術的、suitable 適合的、typical 典型的。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　Simon loves his work. To him, work always comes first, and family and friends are ______.", "options": ["secondary", "temporary", "sociable", "capable"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 10 題", "explanation": "工作永遠第一，家人朋友就是「次要的」：secondary。temporary 暫時的、sociable 善於社交的、capable 有能力的。", "explanationSource": "own", "section": "詞彙"}, {"id": 11, "question": "第 11 題　Although your plans look good, you have to be ______ and consider what you can actually do.", "options": ["dramatic", "realistic", "stressful", "manageable"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 11 題", "explanation": "要考慮實際做得到的事，表示要「務實」：realistic 實際的。dramatic 戲劇性的、stressful 有壓力的、manageable 可管理的。", "explanationSource": "own", "section": "詞彙"}, {"id": 12, "question": "第 12 題　Built under the sea in 1994, the ______ between England and France connects the UK more closely with mainland Europe.", "options": ["waterfall", "temple", "tunnel", "channel"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 12 題", "explanation": "1994 年建於海底、連接英法兩國的是「隧道」（英法海底隧道）：tunnel。channel 是海峡，非人工建造。", "explanationSource": "own", "section": "詞彙"}, {"id": 13, "question": "第 13 題　This tour package is very appealing, and that one looks ______ attractive. I don’t know which one to choose.", "options": ["equally", "annually", "merely", "gratefully"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 13 題", "explanation": "這個行程很吸引人，那個「同樣」吸引人，所以難以抉擇：equally 同樣地。annually 每年、merely 僅僅、gratefully 感激地。", "explanationSource": "own", "section": "詞彙"}, {"id": 14, "question": "第 14 題　Hseu Fang-yi, a young Taiwanese dancer, recently ______ at Lincoln Center in New York and won a great deal of praise.", "options": ["performed", "pretended", "postponed", "persuaded"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 14 題", "explanation": "舞者在林肯中心「演出」並獲得好評：performed。pretend 假裝、postpone 延後、persuade 說服。", "explanationSource": "own", "section": "詞彙"}, {"id": 15, "question": "第 15 題　The police searched the house of the suspect ______. They almost turned the whole house upside down.", "options": ["relatively", "thoroughly", "casually", "permanently"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 15 題", "explanation": "幾乎把整間房子翻過來，表示搜查得非常「徹底」：thoroughly。relatively 相對地、casually 隨意地、permanently 永久地。", "explanationSource": "own", "section": "詞彙"}, {"id": 16, "question": "【綜合測驗 第 16–20 題】\nWhat is so special about green tea? The Chinese and Indians __16__ it for at least 4,000 years to treat everything from head : "【閱讀測驗 第 41–44 題】\nHowler monkeys are named for the long loud cries, or howls, that they make every day. They are the loudest land animal and their howls can be heard three miles away through dense forests. Male howler monkeys use their loud voices to fight for food, mates, or territory. Everyone starts and ends the day by howling to check out where their nearest competitors are.\nInterestingly, when there are few howler monkeys in an area, the howling routine takes on a different pattern. In Belize, where howler monkeys were newly reintroduced into a wildlife sanctuary, the howler monkeys were heard only a few times a week rather than every day. Apparently, with plenty of space and no other howler monkeys around, there was no need to check on the whereabouts of their competitors. At the sanctuary, keepers now use recorded howler sounds from a distance so that the monkeys feel the need to make the territorial calls as they would do in the wild. In the future when the population grows, there will be no need for the recording because the howler monkeys will have more reason to check in with the neighbors to define their own territories.\n\n▶ 第 41 題　Why do howler monkeys howl?", "options": ["To claim their territory.", "To check how popular they are.", "To tell others they are going to leave.", "To show friendliness to their neighbors."], "answer": 0, "answerLabel": "A", "source": "97 學測｜閱讀測驗｜第 41 題", "explanation": "第一段：公猴用吼聲爭奪食物、配偶和「領域」，每天開始和結束都要吼叫以確認競爭者在哪——即宣示領域。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 42, "question": "【閱讀測驗 第 41–44 題】\nHowler monkeys are named for the long loud cries, or howls, that they make every day. They are the loudest land animal and their howls can be heard three miles away through dense forests. Male howler monkeys use their loud voices to fight for food, mates, or territory. Everyone starts and ends the day by howling to check out where their nearest competitors are.\nInterestingly, when there are few howler monkeys  recorded howler sounds from a distance so that the monkeys feel the need to make the territorial calls as they would do in the wild. In the future when the population grows, there will be no need for the recording because the howler monkeys will have more reason to check in with the neighbors to define their own territories.\n\n▶ 第 43 題　Why do the keepers at the sanctuary use recorded howls?", "options": ["To prevent the howler monkeys from getting homesick.", "To help howler monkeys maintain their howling ability.", "To trick the monkeys into the belief that there is plenty of space around.", "To teach the monkeys how to make the loudest cries to scare people away."], "answer": 1, "answerLabel": "B", "source": "97 學測｜閱讀測驗｜第 43 題", "explanation": "第二段：管理員播放錄音，讓猴子覺得「有必要像在野外一樣發出領域呼叫」，維持它們的吼叫習性。(B)。(C) 相反，錄音是讓它們以為附近有競爭者。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 44, "question": "【閱讀測驗 第 41–44 題】\nHowler monkeys are named for the long loud cries, or howls, that they make every day. They are the loudest land animal and their howls can be heard three miles away through dense forests. Male howler monkeys use their loud voices to fight for food, mates, or territory. Everyone starts and ends the day by howling to check out where their nearest competitors are.\nInterestingly, when there are few howler monkeys in an area, the howling routine takes on a different pattern. In Belize, where howler monkeys were newly reintroduced into a wildlife sanctuary, the howler monkeys were heard only a few times a week rather than every day. Apparently, with plenty of space and no other howler monkeys around, there was no need to check on the whereabouts of their competitors. At the sanctuary, keepers now use recorded howler sounds from a distance so that the monkeys feel the need to make the territorial calls as they would do in the wild. In the future when the population grows, there will be no need for the recording because the howler monkeys will have more reason to check in with the neighbors to define their own territories.\n\n▶ 第 44 題　According to the passage, which of the following is true about howler monkeys?", "options": ["They howl most often at noon.", "They originally came from Belize.", "People can hear their howls three miles away.", "Female monkeys howl to protect their babies."], "answer": 2, "answerLabel": "C", "source": "97 學測｜閱讀測驗｜第 44 題", "explanation": "第一段：吼聲可穿過茂密森林傳到「三英里外」。(C)。(B) 錯：文中說它們是「重新引進」Belize；(A)(D) 文中未提。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 45, "question": "【閱讀測驗 第 45–48 題】\nAfter the creation of the Glacier National Park in Montana, the growing number of park visitors increased the need for roads. Eventually, the demand for a road across the mountains led to the building of the Going-to-the-Sun Road.\nThe construction of the Going-to-the-Sun Road was a huge task. After 11 years of work, the final section of the road was completed in 1932. The road is considered an engineering feat. Even today, visitors to the park marvel at how such a road could have been built. It is one of the most scenic roads in North America. The construction of the road has changed the way visitors experience the Glacier National Park. Visitors now can drive over sections of the park that previously took days of horseback riding to see.\nJust across the border, in Canada, is the Waterton Lakes National Park. In 1931, members of the Rotary Clubs of Alberta and Montana suggested joining the two parks as a symbol of peace and friendship between the two countries. In 1932, the United States and Canadian governments renamed the parks the Waterton-Glacier International Peace Park, the world’s first. More recently, the parks have received several international honors. They were named as a World Heritage Site in 1995. This international recognition highlights the importance of this area, not just to the United States and Canada, but to the entire world.\n\n▶ 第 45 題　What made it necessary to build a road through the ource": "97 學測｜閱讀測驗｜第 48 題", "explanation": "第三段：美國冰川國家公園與加拿大 Waterton Lakes 國家公園合併，成為世界第一座國際和平公園——由兩國的兩座公園組成。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 49, "question": "【閱讀測驗 第 49–52 題】\nIce sculpting is a difficult process. First, ice must be carefully selected so that it is suitable for sculpting. Its ideal material is pure, clean water with high clarity. It should also have the minimum amount of air bubbles. Perfectly clear ice blocks weighing 140 kg and measuring 100 cm × 50 cm × 25 cm are available from the Clinebell Company in Colorado. Much larger clear blocks are produced in Europe and Canada or harvested from a frozen river in Sweden. These large ice blocks are used for large ice sculpting events and for building ice hotels.\nAnother difficulty in the process of ice sculpting is time control. The temperature of the environment affects how quickly the piece must be completed to avoid the effects of melting. If the sculpting does not take place in a cold environment, then the sculptor must work quickly to finish his piece. The tools used for sculpting also affect when the task can be accomplished. Some sculptures can be completed in as little as ten minutes if power tools are used. Ice sculptors also use razor-sharp chisels that are specifically designed for cutting ice. The best ice chisels are made in Japan, a country that, along with China, has a long tradition of magnificent ice sculptures.\nIce sculptures are used as decorations in some cuisines, especially in Asia. When holding a dinner party, some large restaurants or hotels will use an ice sculpture to decorate the table. For example, in a wedding banquet it is common to see a pair of ice-sculpted swans that represent the union of the new couple.\n\n▶ 第 49 題　What kind of ice is ideal for sculpting?", "options": ["Ice from ice hotels.", "Ice from clean water.", "Ice with lots of bubbles in it.", "Ice weighing over 100 kilograms."], "answer": 1, "answerLabel": "B", "source": "97 學測｜閱 r": 0, "answerLabel": "A", "source": "97 學測｜閱讀測驗｜第 51 題", "explanation": "第三段：冰雕用作餐飲裝飾，如宴會餐桌、婚宴的天鵝——講的是冰雕的「用途」。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 52, "question": "【閱讀測驗 第 49–52 題】\nIce sculpting is a difficult process. First, ice must be carefully selected so that it is suitable for sculpting. Its ideal material is pure, clean water with high clarity. It should also have the minimum amount of air bubbles. Perfectly clear ice blocks weighing 140 kg and measuring 100 cm × 50 cm × 25 cm are available from the Clinebell Company in Colorado. Much larger clear blocks are produced in Europe and Canada or harvested from a frozen river in Sweden. These large ice blocks are used for large ice sculpting events and for building ice hotels.\nAnother difficulty in the process of ice sculpting is time control. The temperature of the environment affects how quickly the piece must be completed to avoid the effects of melting. If the sculpting does not take place in a cold environment, then the sculptor must work quickly to finish his piece. The tools used for sculpting also affect when the task can be accomplished. Some sculptures can be completed in as little as ten minutes if power tools are used. Ice sculptors also use razor-sharp chisels that are specifically designed for cutting ice. The best ice chisels are made in Japan, a country that, along with China, has a long tradition of magnificent ice sculptures.\nIce sculptures are used as decorations in some cuisines, especially in Asia. When holding a dinner party, some large restaurants or hotels will use an ice sculpture to decorate the table. For example, in a wedding banquet it is common to see a pair of ice-sculpted swans that represent the union of the new couple.\n\n▶ 第 52 題　Which of the following statements is true about the process of sculpting ice?", "options": ["It takes more time to carve with razor-sharp chisels.", "It can be finished in 10 minutes if the right tools are used.", "Larger blocks of ice from Sweden are easier to handle for sculptors.", "The carver must work fast in a cold environment to avoid catching cold."], "answer": 1, "answerLabel": "B", "source": "97 學測｜閱讀測驗｜第 52 題", "explanation": "第二段：使用電動工具，有些作品「十分鐘內」就能完成。(B)。(A) 錯：鋒利鑿刀是為切冰設計；(D) 錯：是在不冷的環境才要快。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nIf you touch your finger to a hot stove, you know it’s going to hurt. However, if you convince yourself beforehand that the pain won’t be so bad, you might not suffer as much. According to a recent study, the part of your brain that reacts to severe pain is largely the same part that reacts to expectation of pain.\nResearchers in this study worked with 10 volunteers, ages 24 to 46. Each volunteer wore a device that gave out 20-second-long pulses of heat to the right leg. There were three levels of heat, producing mild, moderate, or strong pain. During training, the volunteers would first hear a tone, followed by a period of silence, and then feel a heat pulse. They then learned to associate the length of the silent pause with the intensity of the upcoming heat pulse. The longer the pause, the stronger the heat pulse would be, causing more severe pain.\nA day or two later, the real experiment began. The researchers found that the parts of the brain involved in learning, memory, emotion, and touch became more active as the volunteers expected higher levels of pain. These were mainly the same areas that became active when participants actually felt pain. Interestingly, when the volunteers expected only mild or moderate pain but experienced severe pain, they reported feeling 28 percent less pain than when they expected severe pain and actually got it.\nThe new study emphasizes that pain has both physical and psychological elements. Understanding how pain works in the mind and brain could eventually give doctors tools for helping people cope with painful medical treatments.\n\n▶ 第 53 題　What is the main idea of the passage?", "options": ["We should learn to be sensitive to pain.", "Our feeling of pain is decided by our environment.", "How people feel pain remains unknown to scientists.", "Our reaction to pain is closely related to our expectation of pain."], "answer": 3, "answerLabel": "D", "source": "97 學測｜閱讀測驗｜第 53 題", "explanation": "全文主旨：大腦對疼痛的反應區與對「預期疼痛」的反應區大致相同，預期會影響感受。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nIf you touch your finger to a hot stove, you know it’s going to hurt. However, if you convince yourself beforehand that the pain won’t be so bad, you might not suffer as much. According to a recent study, the part of your brain that reacts to severe pain is largely the same part that reacts to expectation of pain.\nResearchers in this study worked with 10 volunteers, ages 24 to 46. Each volunteer wore a device that gave out 20-second-long pulses of heat to the right leg. There were three levels of heat, producing mild, moderate, or strong pain. During training, the volunteers would first hear a tone, followed by a period of silence, and then feel a heat pulse. They then learned to associate the length of the silent pause with the intensity of the upcoming heat pulse. The longer the pause, the stronger the heat pulse would be, causing more severe pain.\nA day or two later, the real experiment began. The researchers found that the parts of the brain involved in learning, memory, emotion, and touch became more active as the volunteers expected higher levels of pain. These were mainly the same areas that became active when participants actually felt pain. Interestingly, when the volunteers expected only mild or moderate pain but experienced severe pain, they reported feeling 28 percent less pain than when they expected severe pain and actually got it.\nThe new study emphasizes that pain has both physical and psychological elements. Understanding how pain works in the mind and brain could eventually give d e new study emphasizes that pain has both physical and psychological elements. Understanding how pain works in the mind and brain could eventually give doctors tools for helping people cope with painful medical treatments.\n\n▶ 第 55 題　How did the volunteers learn to expect different levels of heat?", "options": ["From the loudness of the tone they heard.", "From the instruction given to them by the researchers.", "From the color of a light flashing on the device they wore.", "From the length of the pause between a tone and the heat pulse."], "answer": 3, "answerLabel": "D", "source": "97 學測｜閱讀測驗｜第 55 題", "explanation": "第二段：受試者學會把「聲音後靜默的長度」與即將到來的熱度強度連結，靜默越長越痛。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 56, "question": "【閱讀測驗 第 53–56 題】\nIf you touch your finger to a hot stove, you know it’s going to hurt. However, if you convince yourself beforehand that the pain won’t be so bad, you might not suffer as much. According to a recent study, the part of your brain that reacts to severe pain is largely the same part that reacts to expectation of pain.\nResearchers in this study worked with 10 volunteers, ages 24 to 46. Each volunteer wore a device that gave out 20-second-long pulses of heat to the right leg. There were three levels of heat, producing mild, moderate, or strong pain. During training, the volunteers would first hear a tone, followed by a period of silence, and then feel a heat pulse. They then learned to associate the length of the silent pause with the intensity of the upcoming heat pulse. The longer the pause, the stronger the heat pulse would be, causing more severe pain.\nA day or two later, the real experiment began. The researchers found that the parts of the brain involved in learning, memory, emotion, and touch became more active as the volunteers expected higher levels of pain. These were mainly the same areas that became active when participants actually felt pain. Interestingly, when the volunteers expected only mild or moderate pain but experienced severe pain, they reported feeling 28 percent less pain than when they expected severe pain and actually got it.\nThe new study emphasizes that pain has both physical and psychological elements. Understanding how pain works in the mind and brain could eventually give doctors tools for helping people cope with painful medical treatments.\n\n▶ 第 56 題　According to the passage, what may be the author’s advice to a doctor before a surgery?", "options": ["To provide the patient with more pain killers.", "To talk to the patient and ease his/her worries.", "To give the patient strong heat pulses beforehand.", "To emphasize the possible severe pain to the patient."], "answer": 1, "answerLabel": "B", "source": "97 學測｜閱讀測驗｜第 56 題", "explanation": "第三段：預期輕微疼痛卻遭遇劇痛的人，痛感少 28%；因此醫生應降低病人的預期與擔憂。(B)。(D) 相反。", "explanationSource": "own", "section": "閱讀測驗"}]};</script><script>(function(){var M={};window.QUIZ_CONFIG.questions.forEach(function(q){if(q.image)M[q.question]=q.image});var qn=document.getElementById("question");if(!qn)return;function put(){var old=document.getElementById("gsatImg");var src=M[qn.textContent];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement("img");im.id="gsatImg";im.dataset.src=src;im.src=src;im.alt="題目圖片";im.style.cssText="display:block;max-width:100%;max-height:520px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;background:#fff";qn.insertAdjacentElement("afterend",im)}new MutationObserver(put).observe(qn,{childList:true,characterData:true,subtree:true});})();</script><script src="quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="97 年學測英文：詞彙 15＋綜合測驗 15＋文意選填 10＋閱讀測驗 16｜共 56 題｜單選｜附中文解析｜Level 3–6 單字滑過即看中譯與字卡｜可隨機 20 題、隨時結束並下載 DOCX 錯題";</script><script src="lexicon.js?v=20261120-5"></script><script src="vocab-hover.js?v=20261120-5"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></sc
