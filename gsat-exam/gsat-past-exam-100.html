Three people are running for mayor. All three ______ seem confident that they will be elected, but we won’t know until the outcome of the election is announced.", "options": ["particles", "receivers", "candidates", "containers"], "answer": 2, "answerLabel": "C", "source": "100 學測｜詞彙｜第 6 題", "explanation": "三個人競選市長，三位「候選人」都有信心：candidates。particle 粒子、receiver 接收者、container 容器。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　If you ______ a traffic law, such as drinking and driving, you may not drive for some time.", "options": ["destroy", "violate", "attack", "invade"], "answer": 1, "answerLabel": "B", "source": "100 學測｜詞彙｜第 7 題", "explanation": "「違反」交通法規會被禁止開車一段時間：violate a law。destroy 破壞、attack 攻擊、invade 入侵。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　Applying to college means sending in applications, writing study plans, and so on. It’s a long ______, and it makes students nervous.", "options": ["errand", "operation", "process", "display"], "answer": 2, "answerLabel": "C", "source": "100 學測｜詞彙｜第 8 題", "explanation": "寄申請、寫讀書計畫等一連串步驟，是漫長的「過程」：process。errand 差事、operation 手術/操作、display 展示。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　Dr. Chu’s speech on the new energy source attracted great ______ from the audience at the conference.", "options": ["attention", "fortune", "solution", "influence"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 9 題", "explanation": "演講吸引聽眾極大的「注意」：attract attention。fortune 財富、solution 解答、influence 影響。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　Everyone in the office must attend the meeting tomorrow. There are no ______ allowed.", "options": ["exceptions", "additions", "divisions", "measures"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 10 題", "explanation": "每個人都必須出席，不允許任何「例外」：exceptions。addition 增加、division 分割、measure 措施。", "explanationSource": "own", "section": "詞彙"}, {"id": 11, "questi cy for people making initial contact—in a job interview, for example—to stare fixedly at the other individual. However, this behavior is likely to make the interviewer feel very uncomfortable. Most of us are comfortable with eye contact lasting a few seconds. But eye contact which persists longer than that can make us nervous.\nAnother widely accepted belief is that powerful people in a society—often men—show their dominance over others by touching them in a variety of ways. In fact, research shows that in almost all cases, lower-status people initiate touch. Women also initiate touch more often than men do.\nThe belief that rapid speech and lying go together is also widespread and enduring. We react strongly—and suspiciously—to fast talk. However, the opposite is a greater cause for suspicion. Speech that is slow, because it is laced with pauses or errors, is a more reliable indicator of lying than the opposite.\n\n▶ 第 41 題　Which of the following statements is true according to the passage?", "options": ["Rapid speech without mistakes is a reliable sign of intelligence.", "Women often play a more dominant role than men in a community.", "Speaking slowly is more often a sign of lying than speaking quickly.", "Touching tends to be initiated first by people of higher social positions."], "answer": 2, "answerLabel": "C", "source": "100 學測｜閱讀測驗｜第 41 題", "explanation": "第三段：說話慢（夾雜停頓與錯誤）比說話快更能可靠地指出說謊。(C)。(B)(D) 皆與第二段相反。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 42, "question": "【閱讀測驗 第 41–44 題】\nThere is a long-held belief that when meeting someone, the more eye contact we have with the person, the better. The result is an unfortunate tendency for people making initial contact—in a job interview, for example—to stare fixedly at the other individual. However, this behavior is likely to make the interviewer feel very uncomfortable. Most of us are comfortable with eye contact lasting a few seconds. But eye contact which persists longer than that can make us nervous.\nAnother widely accepted belief is that powerful people in a society—often men—show their dominance over others by touching them in a variety of ways. In fact, research shows that in almost all cases, lower-status people initiate touch. Women also initiate touch more often than men do.\nThe belief that rapid speech and lying go together is also widespread and enduring. We react strongly—and suspiciously—to fast talk. However, the opposite is a greater cause for suspicion. Speech that is slow, because it is laced with pauses or errors, is a more reliable indicator of lying than the opposite.\n\n▶ 第 42 題　What is true about fixing your eyes on a person when you first meet him/her?", "options": ["Fixing your eyes on the person will make him/her feel at ease.", "It is more polite to fix your eyes on him/her as long as you can.", "Most people feel uneasy to have eye contact for over a few seconds.", "It doesn’t make a difference whether you fix your eyes on him/her or not."], "answer": 2, "answerLabel": "C", "source": "100 學測｜閱讀測驗｜第 42 題", "explanation": "第一段：多數人能接受幾秒的眼神接觸，更久就會讓人緊張不安。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 43, "question": "【閱讀測驗 第 41–44 題】\nThere is a long-held belief that when meeting someone, the more eye contact we have with the person, the better. The result is an unfortunate tendency for people making initial contact—in a job interview, for example—to stare fixedly at the other individual. However, this behavior is likely to make the interviewer feel very uncomfortable. Most of us are comfortable with eye contact lasting a few seconds. But eye contact which persists longer than that can make us nervous.\nAnother widely accepted belief is that powerful people in a society—often men—show their dominance over others by touching them in a variety of ways. In fact, research shows that in almost all cases, lower-status people initiate touch. Women also initiate touch more often than men do.\nThe belief that rapid speech and lying go together is also widespread and enduring. We react strongly—and suspiciously—to fast talk. However, the opposite is a greater cause for suspicion. Speech that is slow, because it is laced with pauses or errors, is a more reliable indicator of lying than the opposite.\n\n▶ 第 43 題　Which of the following is NOT discussed in the passage?", "options": ["Facial expressions.", "Physical contact.", "Rate of speech.", "Eye contact."], "answer": 0, "answerLabel": "A", "source": "100 學測｜閱讀測驗｜第 43 題", "explanation": "三段分別討論眼神接觸、觸碰（身體接觸）、說話速度；沒有討論「臉部表情」。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 44, "question": "【閱讀測驗 第 41–44 題】\nThere is a long-held belief that when meeting someone, the more eye contact we have with the person, the better. The result is an unfortunate tendency for people making initial contact—in a job interview, for example—to stare fixedly at the other individual. However, this behavior is likely to make the interviewer feel very uncomfortable. Most of us are comfortable with eye contact lasting a few seconds. But eye contact which persists longer than that can make us nervous.\nAnother widely accepted belief is that powerful people in a society—often men—show their dominance over others by touching them in a variety of ways. In fact, research shows that in almost all cases, lower-status people initiate touch. Women also initiate touch more often than men do.\nThe belief that rapid speech and lying go together is also widespread and enduring. We react strongly—and suspiciously—to fast talk. However, the opposite is a greater cause for suspicion. Speech that is slow, because it is laced with pauses or errors, is a more reliable indicator of lying than the opposite.\n\n▶ 第 44 題　What is the main idea of the passage?", "options": ["People have an instinct for interpreting non-verbal communication.", "We should not judge the intention of a person by his body language.", "A good knowledge of body language is essential for successful communication.", "Common beliefs about verbal and non-verbal communication are not always correct."], "answer": 3, "answerLabel": "D", "source": "100 學測｜閱讀測驗｜第 44 題", "explanation": "每段都先提出一個普遍信念（long-held belief / widely accepted belief / widespread belief），再用研究推翻——常見看法不一定正確。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 45, "question": "【閱讀測驗 第 45–48 題】\nIt is easy for us to tell our friends from our enemies. But can other animals do the same? Elephants can! They can use their sense of vision and smell to tell the difference between people who pose a threat and those who do not.\nIn Kenya, researchers found that elephants react differently to clothing worn by men of the Maasai and Kamba ethnic groups. Young Maasai men spear animals and thus pose a threat to elephants; Kamba men are mainly farmers and are not a danger to elephants.\nIn an experiment conducted by animal scientists, elephants were first presented with clean clothing or clothing that had been worn for five days by either a Maasai or a Kamba man. When the elephants detected the smell of clothing worn by a Maasai man, they moved away from the smell faster and took longer to relax than when they detected the smells of either clothing worn by Kamba men or clothing that had not been worn at all.\nGarment color also plays a role, though in a different way. In the same study, when the elephants saw red clothing not worn before, they reacted angrily, as red is typically worn by Maasai men. Rather than running away as they did with the smell, the elephants acted aggressively toward the red clothing.\nThe researchers believe that the elephants’ emotional reactions are due to their different interpretations of the smells and the sights. Smelling a potential danger means that a threat is nearby and the best thing to do is run away and hide. Seeing a potential threat without its smell means that risk is low. Therefore, instead of showing fear and running away, the elephants express their anger and become aggressive.\n\n▶ 第 45 題　According to the passage, which of the following statements is true about Kamba and Maasai people?", "options": ["Maasai people are a threat to elephants.", "Kamba people raise elephants for farming.", "Both Kamba and Maasai people are elephant hunters.", "Both Kamba and Maasai people traditionally wear red clothing."], "answer": 0, "answerLabel": "A", "source": "100 學測｜閱讀測驗｜第 45 題", "explanation": "第二段：年輕 Maasai 男子會用矛刺動物，對象構成威脅；Kamba 人主要是農夫。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 46, "question": "【閱讀測驗 第 45–48 題】\nIt is easy for us to tell our friends from our enemies. But can other animals do the same? Elephants can! They can use their sense of vision and smell to tell the difference between people who pose a threat and those who do not.\nIn Kenya, researchers found that elephants react differently to clothing worn by men of the Maasai and Kamba ethnic groups. Young Maasai men spear animals and thus pose a threat to elephants; Kamba men are mainly farmers and are not a danger to elephants.\nIn an experiment conducted by animal scientists, elephants were first presented with clean clothing or clothing that had been worn for five days by either a Maasai or a Kamba man. When the elephants detected the smell of clothing worn by a Maasai man, they moved away from the smell faster and took longer to relax than when they detected the smells of either clothing worn by Kamba men or clothing that had not been worn at all.\nGarment color also plays a role, though in a different way. In the same study, when the elephants saw red clothing not worn before, they reacted angrily, as red is typically worn by Maasai men. Rather than running away as they did with the smell, the elephants acted aggressively toward the red clothing.\nThe researchers believe that the elephants’ emotional reactions are due to their different interpretations of the smells and the sights. Smelling a potential danger means that a threat is nearby and the best thing to do is run away and hide. Seeing a potential threat without its smell means that risk is low. Therefore, instead of showing fear and running away, the elephants express their anger and become aggressive.\n\n▶ 第 46 題　How did the elephants react to smell in the study?", "options": ["They attacked a man with the smell of new clothing.", "They needed time to relax when smelling something unfamiliar.", "They became anxious when they smelled Kamba-scented clothing.", "They were frightened and ran away when they smelled their enemies."], "answer": 3, "answerLabel": "D", "source": "100 學測｜閱讀測驗｜第 46 題", "explanation": "第三段：聞到 Maasai 人穿過的衣服，大象更快走開、更久才放鬆——害怕逃離。(D)。(C) 錯：對 Kamba 衣物沒有這種反應。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 47, "question": "【閱讀測驗 第 45–48 題】\nIt is easy for us to tell our friends from our enemies. But can other animals do the same? Elephants can! They can use their sense of vision and smell to tell the difference between people who pose a threat and those who do not.\nIn Kenya, researchers found that elephants react differently to clothing worn by men of the Maasai and Kamba ethnic groups. Young Maasai men spear animals and thus pose a threat to elephants; Kamba men are mainly farmers and are not a danger to elephants.\nIn an experiment conducted by animal scientists, elephants were first presented with clean clothing or clothing that had been worn for five days by either a Maasai or a Kamba man. When the elephants detected the smell of clothing worn by a Maasai man, they moved away from the smell faster and took longer to relax than when they detected the smells of either clothing worn by Kamba men or clothing that had not been worn at all.\nGarment color also plays a role, though in a different way. In the same study, when the elephants saw red clothing not worn before, they reacted angrily, as red is typically worn by Maasai men. Rather than running away as they did with the smell, the elephants acted aggressively toward the red clothing.\nThe researchers believe that the elephants’ emotional reactions are due to their different interpretations of the smells and the sights. Smelling a potential danger means that a threat is nearby and the best thing to do is run away and hide. Seeing a potential threat without its smell means that risk is low. Therefore, instead of showing fear and running away, the elephants express their anger and become aggressive.\n\n▶ 第 47 題　What is the main idea of this passage?", "options": ["Elephants use sight and smell to detect danger.", "Elephants attack people who wear red clothing.", "Scientists are now able to control elephants’ emotions.", "Some Kenyan tribes understand elephants’ emotions very well."], "answer": 0, "answerLabel": "A", "source": "100 學測｜閱讀測驗｜第 47 題", "explanation": "第一段點題：大象能用視覺和嗅覺分辨有威脅與無威脅的人，全文即在證明這點。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 48, "question": "【閱讀測驗 第 45–48 題】\nIt is easy for us to tell our friends from our enemies. But can other animals do the same? Elephants can! They can use their sense of vision and smell to tell the difference between people who pose a threat and those who do not.\nIn Kenya, researchers found that elephants react differently to clothing worn by men of the Maasai and Kamba ethnic groups. Young Maasai men spear animals and thus pose a threat to elephants; Kamba men are mainly farmers and are not a danger to elephants.\nIn an experiment conducted by animal scientists, elephants were first presented with clean clothing or clothing that had been worn for five days by either a Maasai or a Kamba man. When the elephants detected the smell of clothing worn by a Maasai man, they moved away from the smell faster and took longer to relax than when they detected the smells of either clothing worn by Kamba men or clothing that had not been worn at all.\nGarment color also plays a role, though in a different way. In the same study, when the elephants saw red clothing not worn before, they reacted angrily, as red is typically worn by Maasai men. Rather than running away as they did with the smell, the elephants acted aggressively toward the red clothing.\nThe researchers believe that the elephants’ emotional reactions are due to their different interpretations of the smells and the sights. Smelling a potential danger means that a threat is nearby and the best thing to do is run away and hide. Seeing a potential threat without its smell means that risk is low. Therefore, instead of showing fear and running away, the elephants express their anger and become aggressive.\n\n▶ 第 48 題　What can be inferred about the elephant’s behavior from this passage?", "options": ["Elephants learn from their experiences.", "Elephants have sharper sense of smell than sight.", "Elephants are more intelligent than other animals.", "Elephants tend to attack rather than escape when in danger."], "answer": 0, "answerLabel": "A", "source": "100 學測｜閱讀測驗｜第 48 題", "explanation": "大象知道 Maasai 有威脅、紅色是 Maasai 的服色，顯示它們「從經驗中學習」。(A)。(D) 錯：聞到威脅時是逃跑。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 49, "question": "【閱讀測驗 第 49–52 題】\nIt was something she had dreamed of since she was five. Finally, after years of training and intensive workouts, Deborah Duffey was going to compete in her first high school basketball game. The goals of becoming an outstanding player and playing college ball were never far from Deborah’s mind.\nThe game was against Mills High School. With 1:42 minutes left in the game, Deborah’s team led by one point. A player of Mills had possession of the ball, and Deborah ran to guard against her. As Deborah shuffled sideways to block the player, her knee went out and she collapsed on the court in burning pain. Just like that, Deborah’s season was over.\nAfter suffering the bad injury, Deborah found that, for the first time in her life, she was in a situation beyond her control. Game after game, she could do nothing but sit on the sidelines watching others play the game that she loved so much.\nInjuries limited Deborah’s time on the court as she hurt her knees three more times in the next five years. She had to spend countless hours in a physical therapy clinic to receive treatment. Her frequent visits there gave her a passion and respect for the profession. And Deborah began to see a new light in her life.\nCurrently a senior in college, Deborah focuses on pursuing a degree in physical therapy. After she graduates, Deborah plans to use her knowledge to educate people how to best take care of their bodies and cope with the feelings of hopelessness that she remembers so well.\n\n▶ 第 49 題　What is the best title for this passage?", "options": ["A Painful Mistake", "A Great Adventure", "A Lifelong Punishment", "A New Direction in Life"], "answer": 3, "answerLabel": "D", "source": "100 學測｜閱讀測驗｜第 49 題", "explanation": "全文：Deborah 因受傷無法打球，卻在物理治療中找到新志向——人生新方向。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 50, "question": "【閱讀測驗 第 49–52 題】\nIt was something she had dreamed of since she was five. Finally, after years of training and intensive workouts, Deborah Duffey was going to compete in her first high school basketball game. The goals of becoming an outstanding player and playing college ball were never far from Deborah’s mind.\nThe game was against Mills High School. With 1:42 minutes left in the game, Deborah’s team led by one point. A player of Mills had possession of the ball, and Deborah ran to guard against her. As Deborah shuffled sideways to block the player, her knee went out and she collapsed on the court in burning pain. Just like that, Deborah’s season was over.\nAfter suffering the bad injury, Deborah found that, for the first time in her life, she was in a situation beyond her control. Game after game, she could do nothing but sit on the sidelines watching others play the game that she loved so much.\nInjuries limited Deborah’s time on the court as she hurt her knees three more times in the next five years. She had to spend countless hours in a physical therapy clinic to receive treatment. Her frequent visits there gave her a passion and respect for the profession. And Deborah began to see a new light in her life.\nCurrently a senior in college, Deborah focuses on pursuing a degree in physical therapy. After she graduates, Deborah plans to use her knowledge to educate people how to best take care of their bodies and cope with the feelings of hopelessness that she remembers so well.\n\n▶ 第 50 題　How did Deborah feel when she first hurt her knee?", "options": ["Excited.", "Confused.", "Ashamed.", "Disappointed."], "answer": 3, "answerLabel": "D", "source": "100 學測｜閱讀測驗｜第 50 題", "explanation": "第三段：她第一次面對無法控制的處境，只能坐在場邊看別人打球——失望。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 51, "question": "【閱讀測驗 第 49–52 題】\nIt was something she had dreamed of since she was five. Finally, after years of training and intensive workouts, Deborah Duffey was going to compete in her first high school basketball game. The goals of becoming an outstanding player and playing college ball were never far from Deborah’s mind.\nThe game was against Mills High School. With 1:42 minutes left in the game, Deborah’s team led by one point. A player of Mills had possession of the ball, and Deborah ran to guard against her. As Deborah shuffled sideways to block the player, her knee went out and she collapsed on the court in burning pain. Just like that, Deborah’s season was over.\nAfter suffering the bad injury, Deborah found that, for the first time in her life, she was in a situation beyond her control. Game after game, she could do nothing but sit on the sidelines watching others play the game that she loved so much.\nInjuries limited Deborah’s time on the court as she hurt her knees three more times in the next five years. She had to spend countless hours in a physical therapy clinic to receive treatment. Her frequent visits there gave her a passion and respect for the profession. And Deborah began to see a new light in her life.\nCurrently a senior in college, Deborah focuses on pursuing a degree in physical therapy. After she graduates, Deborah plans to use her knowledge to educate people how to best take care of their bodies and cope with the feelings of hopelessness that she remembers so well.\n\n▶ 第 51 題　What is true about Deborah Duffey?", "options": ["She didn’t play on the court after the initial injury.", "She injured her knee when she was trying to block her opponent.", "She knew that she couldn’t be a basketball player when she was a child.", "She refused to seek professional assistance to help her recover from her injuries."], "answer": 1, "answerLabel": "B", "source": "100 學測｜閱讀測驗｜第 51 題", "explanation": "第二段：她側步要阻擋對手球員時膝蓋受傷。(B)。(A) 錯：之後五年又受傷三次表示有再上場；(D) 錯：她花很多時間接受物理治療。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 52, "question": "【閱讀測驗 第 49–52 題】\nIt was something she had dreamed of since she was five. Finally, after years of training and intensive workouts, Deborah Duffey was going to compete in her first high school basketball game. The goals of becoming an outstanding player and playing college ball were never far from Deborah’s mind.\nThe game was against Mills High School. With 1:42 minutes left in the game, Deborah’s team led by one point. A player of Mills had possession of the ball, and Deborah ran to guard against her. As Deborah shuffled sideways to block the player, her knee went out and she collapsed on the court in burning pain. Just like that, Deborah’s season was over.\nAfter suffering the bad injury, Deborah found that, for the first time in her life, she was in a situation beyond her control. Game after game, she could do nothing but sit on the sidelines watching others play the game that she loved so much.\nInjuries limited Deborah’s time on the court as she hurt her knees three more times in the next five years. She had to spend countless hours in a physical therapy clinic to receive treatment. Her frequent visits there gave her a passion and respect for the profession. And Deborah began to see a new light in her life.\nCurrently a senior in college, Deborah focuses on pursuing a degree in physical therapy. After she graduates, Deborah plans to use her knowledge to educate people how to best take care of their bodies and cope with the feelings of hopelessness that she remembers so well.\n\n▶ 第 52 題　What was the new light that Deborah saw in her life?", "options": ["To help people take care of their bodies.", "To become a teacher of Physical Education.", "To become an outstanding basketball player.", "To receive treatment in a physical therapy office."], "answer": 0, "answerLabel": "A", "source": "100 學測｜閱讀測驗｜第 52 題", "explanation": "第四、五段：頻繁接受治療讓她對這個專業產生熱情，決定攻讀物理治療，教人如何照顧身體。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nRedwood trees are the tallest plants on the earth, reaching heights of up to 100 meters. They are also known for their longevity, typically 500 to 1000 years, but sometimes more than 2000 years. A hundred million years ago, in the age of dinosaurs, redwoods were common in the forests of a much more moist and tropical North America. As the climate became drier and colder, they retreated to a narrow strip along the Pacific coast of Northern California.\nThe trunk of redwood trees is very stout and usually forms a single straight column. It is covered with a beautiful soft, spongy bark. This bark can be pretty thick, well over two feet in the more mature trees. It gives the older trees a certain kind of protection from insects, but the main benefit is that it keeps the center of the tree intact from moderate forest fires because of its thickness. This fire resistant quality explains why the giant redwood grows to live that long. While most other types of trees are destroyed by forest fires, the giant redwood actually prospers because of them. Moderate fires will clear the ground of competing plant life, and the rising heat dries and opens the ripe cones of the redwood, releasing many thousands of seeds onto the ground below.\nNew trees are often produced from sprouts, little baby trees, which form at the base of the trunk. These sprouts grow slowly, nourished by the root system of the “mother” tree. When the main tree dies, the sprouts are then free to grow as full trees, forming a “fairy ring” of trees around the initial tree. These trees, in turn, may give rise to more sprouts, and the cycle continues.\n\n▶ 第 53 題　Why were redwood trees more prominent in the forests of North America millions of years ago?", "options": ["The trees were taller and stronger.", "The soil was softer for seeds to sprout.", "The climate was warmer and more humid.", "The temperature was lower along the Pacific coast."], "answer": 2, "answerLabel": "C", "source": "100 學測｜閱讀測驗｜第 53 題", "explanation": "第一段：一億年前北美「更潮濕、更熱帶」，紅杉很常見；氣候變乾變冷後才退到加州沿岸。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nRedwood trees are the tallest plants on the earth, reaching heights of up to 100 meters. They are also known for their longevity, typically 500 to 1000 years, but sometimes more than 2000 years. A hundred million years ago, in the age of dinosaurs, redwoods were common in the forests of a much more moist and tropical North America. As the climate became drier and colder, they retreated to a narrow strip along the Pacific coast of Northern California.\nThe trunk of redwood trees is very stout and usually forms a single straight column. It is covered with a beautiful soft, spongy bark. This bark can be pretty thick, well over two feet in the more mature trees. It gives the older trees a certain kind of protection from insects, but the main benefit is that it keeps the center of the tree intact from moderate forest fires because of its thickness. This fire resistant quality explains why the giant redwood grows to live that long. While most other types of trees are destroyed by forest fires, the giant redwood actually prospers because of them. Moderate fires will clear the ground of competing plant life, and the rising heat dries and opens the ripe cones of the redwood, releasing many thousands of seeds onto the ground below.\nNew trees are often produced from sprouts, little baby trees, which form at the base of the trunk. These sprouts grow slowly, nourished by the root system of the “mother” tree. When the main tree dies, the sprouts are then free to grow as full trees, forming a “fairy ring” of trees around the initial tree. These trees, in turn, may give rise to more sprouts, and the cycle continues.\n\n▶ 第 54 題　What does a “fairy ring” in the last paragraph refer to?", "options": ["Circled tree trunks.", "Connected root systems.", "Insect holes around an old tree.", "Young trees surrounding a mature tree."], "answer": 3, "answerLabel": "D", "source": "100 學測｜閱讀測驗｜第 54 題", "explanation": "最後一段：母樹死後，根部長出的小樹長成環繞原樹的一圈樹——「幼樹圍繞成熟樹」。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 55, "question": "【閱讀測驗 第 53–56 題】\nRedwood trees are the tallest plants on the earth, reaching heights of up to 100 meters. They are also known for their longevity, typically 500 to 1000 years, but sometimes more than 2000 years. A hundred million years ago, in the age of dinosaurs, redwoods were common in the forests of a much more moist and tropical North America. As the climate became drier and colder, they retreated to a narrow strip along the Pacific coast of Northern California.\nThe trunk of redwood trees is very stout and usually forms a single straight column. It is covered with a beautiful soft, spongy bark. This bark can be pretty thick, well over two feet in the more mature trees. It gives the older trees a certain kind of protection from insects, but the main benefit is that it keeps the center of the tree intact from moderate forest fires because of its thickness. This fire resistant quality explains why the giant redwood grows
