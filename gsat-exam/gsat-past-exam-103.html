n": "第 6 題　The restaurant has a ______ charge of NT$250 per person. So the four of us need to pay at least NT$1,000 to eat there.", "options": ["definite", "minimum", "flexible", "numerous"], "answer": 1, "answerLabel": "B", "source": "103 學測｜詞彙｜第 6 題", "explanation": "每人「最低」消費 250 元，四人至少 1,000 元：minimum charge。definite 明確的、flexible 彈性的、numerous 眾多的。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　At the Book Fair, exhibitors from 21 countries will ______ textbooks, novels, and comic books.", "options": ["predict", "require", "display", "target"], "answer": 2, "answerLabel": "C", "source": "103 學測｜詞彙｜第 7 題", "explanation": "書展參展者「展示」教科書、小說和漫畫：display。predict 預測、require 要求、target 鎖定。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　Before John got on the stage to give the speech, he took a deep ______ to calm himself down.", "options": ["order", "rest", "effort", "breath"], "answer": 3, "answerLabel": "D", "source": "103 學測｜詞彙｜第 8 題", "explanation": "上台前「深呼吸」讓自己冷靜：take a deep breath。order 命令、rest 休息、effort 努力。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　Most young people in Taiwan are not satisfied with a high school ______ and continue to pursue further education in college.", "options": ["maturity", "diploma", "foundation", "guarantee"], "answer": 1, "answerLabel": "B", "source": "103 學測｜詞彙｜第 9 題", "explanation": "不滿足於高中「文憑」而繼續升學：diploma。maturity 成熟、foundation 基礎、guarantee 保證。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　Residents are told not to dump all household waste ______ into the trash can; reusable materials should first be sorted out and recycled.", "options": ["shortly", "straight", "forward", "namely"], "answer": 1, "answerLabel": "B", "source": "103 學測｜詞彙｜第 10 題", "explanation": "不要把垃圾「直接」全丟進垃圾桶，應先分類回收：straight 直接地。shortly 不久、forward 向前、namely 也就是。", "explanationSource": "own", "section": "詞彙"}, {"id": 11, "question": "第 11 題　Kevin ction": "文意選填"}, {"id": 41, "question": "【閱讀測驗 第 41–44 題】\nAmerican writer Toni Morrison was born in 1931 in Ohio. She was raised in an African American family filled with songs and stories of Southern myths, which later shaped her prose. Her happy family life led to her excellent performance in school, despite the atmosphere of racial discrimination in the society. After graduating from college, Morrison started to work as a teacher and got married in 1958. Several years later, her marriage began to fail. For a temporary escape, she joined a small writers' group, in which each member was required to bring a story or poem for discussion. She wrote a story based on the life of a girl she knew in childhood who had prayed to God for blue eyes. The story was well received by the group, but then she put it away, thinking she was done with it. In 1964, Morrison got divorced and devoted herself to writing. One day, she dusted off the story she had written for the writers' group and decided to make it into a novel. She drew on her memories from childhood and expanded upon them using her imagination so that the characters developed a life of their own. The Bluest Eye was eventually published in 1970. From 1970 to 1992, Morrison published five more novels. In her novels, Morrison brings in different elements of the African American past, their struggles, problems and cultural memory. In Song of Solomon, for example, Morrison tells the story of an African American man and his search for identity in his culture. The novels and other works won her several prizes. In 1993, Morrison received the Nobel Prize in Literature. She is the eighth woman and the first African American woman to win the honor.\n\n▶ 第 41 題　What is the passage mainly about?", "options": ["The life of black people in the U.S.", "The life of an African American writer.", "The history of African American culture.", "The history of the Nobel Prize in Literature."], "answer": 1, "answerLabel": "B", "source": "103 學 y. I: Your brothers are a national source of fascination. Where do you think they'll be in five years? Z: Ari will be a superagent running the same company. Rahm would still be mayor of Chicago. I will probably continue to be my academic self. The one thing I can guarantee is none of us will have taken a cruise, none of us will be sitting on a beach with a pina colada.\n\n▶ 第 45 題　What does Zeke Emanuel have in mind when saying \"What did Mom put in the cereal?\"", "options": ["The secret to bringing up successful kids.", "The recipe for a breakfast food.", "The difference among the brothers.", "The questions from his kids."], "answer": 0, "answerLabel": "A", "source": "103 學測｜閱讀測驗｜第 45 題", "explanation": "三兄弟各在不同領域成功，大家問「媽媽在麥片裡放了什麼」——意指養出成功孩子的祕訣。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 46, "question": "【閱讀測驗 第 45–48 題】\nBelow is an excerpt from an interview with Zeke Emanuel, a health-policy expert, on his famous brothers. Interviewer: You're the older brother of Rahm, the mayor of Chicago, and Ari, an extremely successful talent agent. And you're a bioethicist and one of the architects of Obamacare. Isn't writing a book about how great your family is a bit odd? Zeke: I don't write a book about how great my family is. There are lots of idiocies and foolishness—a lot to make fun of in the book. I wrote Brothers Emanuel because I had begun jotting stories for my kids. And then we began getting a lot of questions: What did Mom put in the cereal? Three successful brothers, all different areas. I: To what do you attribute the Emanuel brothers' success? Z: I would put success in quotes. We strive. First, I think we got this striving from our mother to make the world a better place. A second important thing is you never rest on the last victory. There's always more to do. And maybe the third important thing is my father's admonition that offense is the best defense. We don't give up. I: Do you still not have a TV? Z: I don't own a TV. I don't own a ca ive up. I: Do you still not have a TV? Z: I don't own a TV. I don't own a car. I don't Facebook. I don't tweet. I: But you have four cell phones. Z: I'm down to two, thankfully. I: Your brothers are a national source of fascination. Where do you think they'll be in five years? Z: Ari will be a superagent running the same company. Rahm would still be mayor of Chicago. I will probably continue to be my academic self. The one thing I can guarantee is none of us will have taken a cruise, none of us will be sitting on a beach with a pina colada.\n\n▶ 第 47 題　According to Zeke Emanuel, which of the following is a reason for the brothers' success?", "options": ["They defend themselves by attacking others.", "They learn a lot from great people's quotes.", "They are committed to glorifying their parents.", "They keep moving forward even after a big success."], "answer": 3, "answerLabel": "D", "source": "103 學測｜閱讀測驗｜第 47 題", "explanation": "三個成功原因之一：never rest on the last victory，永遠還有更多事要做——大成功之後仍繼續前進。(D)。(A) 誤解「攻擊是最好的防守」意指不放棄。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 48, "question": "【閱讀測驗 第 45–48 題】\nBelow is an excerpt from an interview with Zeke Emanuel, a health-policy expert, on his famous brothers. Interviewer: You're the older brother of Rahm, the mayor of Chicago, and Ari, an extremely successful talent agent. And you're a bioethicist and one of the architects of Obamacare. Isn't writing a book about how great your family is a bit odd? Zeke: I don't write a book about how great my family is. There are lots of idiocies and foolishness—a lot to make fun of in the book. I wrote Brothers Emanuel because I had begun jotting stories for my kids. And then we began getting a lot of questions: What did Mom put in the cereal? Three successful brothers, all different areas. I: To what do you attribute the Emanuel brothers' success? Z: I would put success in quotes. We strive. First, I think we got this striving from our mother to make the world a better place. A second important thing is you never rest on the last victory. There's always more to do. And maybe the third important thing is my father's admonition that offense is the best defense. We don't give up. I: Do you still not have a TV? Z: I don't own a TV. I don't own a car. I don't Facebook. I don't tweet. I: But you have four cell phones. Z: I'm down to two, thankfully. I: Your brothers are a national source of fascination. Where do you think they'll be in five years? Z: Ari will be a superagent running the same company. Rahm would still be mayor of Chicago. I will probably continue to be my academic self. The one thing I can guarantee is none of us will have taken a cruise, none of us will be sitting on a beach with a pina colada.\n\n▶ 第 48 題　Which of the following best summarizes Zeke Emanuel's response to the last question?", "options": ["The brothers look forward to a family trip on a cruise.", "Nothing much will change in the near future for them.", "Higher positions and more power will be their goals.", "None of the brothers will go to the beach."], "answer": 1, "answerLabel": "B", "source": "103 學測｜閱讀測驗｜第 48 題", "explanation": "回答五年後：Ari 仍是超級經紀人、Rahm 仍是市長、我仍是學者——近期不會有太大改變。(B)。(D) 只是比喻他們不會停下來度假，不是重點。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 49, "question": "【閱讀測驗 第 49–52 題】\nMOOC, a massive open online course, aims at providing large-scale interactive participation and open access via the web. In addition to traditional course materials such as videos, readings, and problem sets, MOOCs provide interactive user forums that help build a community for the students, professors, and teaching assistants. MOOCs first made waves in the fall of 2011, when Professor Sebastian Thrun from Stanford University opened his graduate-level artificial intelligence course up to any student anywhere, and 160,000 students in more than 190 countries signed up. This new breed of online classes is shaking up the higher education world in many ways. Since the courses can be taken by hundreds of thousands of students at the same time, the number of universities might decrease dramatically. Professor Thrun has even envisioned a future in which there will only need to be 10 universities in the world. Perhaps the most striking thing about MOOCs, many of which are being taught by professors at prestigious universities, is that they're free. This is certainly good news for cash-strapped students. There is a lot of excitement and fear surrounding MOOCs. While some say free online courses are a great way to increase the enrollment of minority students, others have said they will leave many students behind. Some critics have said that MOOCs promote an unrealistic one-size-fits-all model of higher education and that there is no replacement for true dialogues between professors and their students. After all, a brain is not a computer. We are not blank hard drives waiting to be filled with data. People learn from people they love and remember the things that arouse emotion. Some critics worry that online students will miss out on the social aspects of college.\n\n▶ 第 49 題　What does the word \"cash-strapped\" in the second paragraph mean?", "options": ["Making a lot of money.", "Being short of money.", "Being careful with money.", "Spending little money."], "answer": 1, "answerLabel": "B", "source": "103 學測｜閱讀測驗｜第 49 題", "explanation": "cash-strapped 缺錢的；前句說課程是免費的，對缺錢的學生是好消息。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 50, "question": "【閱讀測驗 第 49–52 題】\nMOOC, a massive open online course, aims at providing large-scale interactive participation and open access via the web. In addition to traditional course materials such as videos, readings, and problem sets, MOOCs provide interactive user forums that help build a community for the students, professors, and teaching assistants. MOOCs first made waves in the fall of 2011, when Professor Sebastian Thrun from Stanford University opened his graduate-level artificial intelligence course up to any student anywhere, and 160,000 students in more than 190 countries signed up. This new breed of online classes is shaking up the higher education world in many ways. Since the courses can be taken by hundreds of thousands of students at the same time, the number of universities might decrease dramatically. Professor Thrun has even envisioned a future in which there will only need to be 10 universities in the world. Perhaps the most striking thing about MOOCs, many of which are being taught by professors at prestigious universities, is that they're free. This is certainly good news for cash-strapped students. There is a lot of excitement and fear surrounding MOOCs. While some say free online courses are a great way to increase the enrollment of minority students, others have said they will leave many students behind. Some critics have said that MOOCs promote an unrealistic one-size-fits-all model of higher education and that there is no replacement for true dialogues between professors and their students. After all, a brain is not a computer. We are not blank hard drives waiting to be filled with data. People learn from people they love and remember the things that arouse emotion. Some critics worry that online students will miss out on the social aspects of college.\n\n▶ 第 50 題　Which of the following is NOT one of the features of MOOCs?", "options": ["It is free to take the courses.", "Many courses are offered by famous universities.", "Most courses address artificial intelligence.", "Many students can take the course at the same time."], "answer": 2, "answerLabel": "C", "source": "103 學測｜閱讀測驗｜第 50 題", "explanation": "文中提到免費、名校教授授課、數十萬人同時上課；人工智慧只是 Thrun 第一門課的主題，不是 MOOC 的特色。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 51, "question": "【閱讀測驗 第 49–52 題】\nMOOC, a massive open online course, aims at providing large-scale interactive participation and open access via the web. In addition to traditional course materials such as videos, readings, and problem sets, MOOCs provide interactive user forums that help build a community for the students, professors, and teaching assistants. MOOCs first made waves in the fall of 2011, when Professor Sebastian Thrun from Stanford University opened his graduate-level artificial intelligence course up to any student anywhere, and 160,000 students in more than 190 countries signed up. This new breed of online classes is shaking up the higher education world in many ways. Since the courses can be taken by hundreds of thousands of students at the same time, the number of universities might decrease dramatically. Professor Thrun has even envisioned a future in which there will only need to be 10 universities in the world. Perhaps the most striking thing about MOOCs, many of which are being taught by professors at prestigious universities, is that they're free. This is certainly good news for cash-strapped students. There is a lot of excitement and fear surrounding MOOCs. While some say free online courses are a great way to increase the enrollment of minority students, others have said they will leave many students behind. Some critics have said that MOOCs promote an unrealistic one-size-fits-all model of higher education and that there is no replacement for true dialogues between professors and their students. After all, a brain is not a computer. We are not blank hard drives waiting to be filled with data. People learn from people they love and remember the things that arouse emotion. Some critics worry that online students will miss out on the social aspects of college.\n\n▶ 第 51 題　What is the second paragraph mainly about?", "options": ["The impact of MOOCs.", "The goal of MOOCs.", "The size of MOOC classes.", "The cost of MOOC courses."], "answer": 0, "answerLabel": "A", "source": "103 學測｜閱讀測驗｜第 51 題", "explanation": "第二段：MOOC 正在撼動高等教育——大學數量可能大減、課程免費——講的是 MOOC 的「影響」。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 52, "question": "【閱讀測驗 第 49–52 題】\nMOO eliance on professors from prestigious universities.", "The lack of social interaction among students and professors."], "answer": 3, "answerLabel": "D", "source": "103 學測｜閱讀測驗｜第 52 題", "explanation": "第三段：批評者說無法取代師生之間真正的對話，學生會錯過大學的社交面向。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nToday the car seems to make periodic leaps in progress. A variety of driver assistance technologies are appearing on new cars. A developing technology called Vehicle-to-Vehicle communication, or V2V, is being tested by automotive manufacturers as a way to help reduce the number of accidents. V2V works by using wireless signals to send information back and forth between cars about their location, speed and direction, so that they keep safe distances from each other. Another new technology being tested is Vehicle-to-Infrastructure communication, or V2I. V2I would allow vehicles to communicate with road signs or traffic signals and provide information to the vehicle about safety issues. V2I could also request traffic information from a traffic management system and access the best possible routes. Both V2V and V2I have the potential to reduce around 80 percent of vehicle crashes on the road. More and more new cars can reverse-park, read traffic signs, maintain a safe distance in steady traffic and brake automatically to avoid crashes. Moreover, a number of firms are creating cars that drive themselves to a chosen destination without a human at the controls. It is predicted that driverless cars will be ready for sale within five years. If and when cars go completely driverless, the benefits will be enormous. Google, which already uses prototypes of such cars to ferry its staff along Californian freeways, once put a blind man in a prototype and filmed him being driven off to buy takeaway hamburgers. If this works, huge numbers of elderly and disabled people can regain their personal mobility. The young will not have to pay crippling motor insurance, because their reckless hands and feet will no longer touch the wheel or the accelerator. People who commute by car will gain hours each day to work, rest, or read a newspaper.\n\n▶ 第 53 題　Which of the following statements is true about V2V?", "options": ["V2V communication has been very well developed.", "Through V2V, drivers can chat with each other on the road.", "V2V is designed to decrease crashes by keeping safe distances.", "Through V2V, a car can warn cyclists nearby of its approach."], "answer": 2, "answerLabel": "C", "source": "103 學測｜閱讀測驗｜第 53 題", "explanation": "第一段：V2V 讓車輛互傳位置、速度、方向資訊，以「保持安全距離」減少事故。(C)。(A) 錯：仍在測試中。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nToday the car seems to make periodic leaps in progress. A variety of driver assistance technologies are appearing on new cars. A developing technology called Vehicle-to-Vehicle communication, or V2V, is being tested by automotive manufacturers as a way to help reduce the number of accidents. V2V works by using wireless signals to send information back and forth between cars about their location, speed and direction, so that they keep safe distances from each other. Another new technology being tested is Vehicle-to-Infrastructure communication, or V2I. V2I would allow vehicles to communicate with road signs or traffic signals and provide information to the vehicle about safety issues. V2I could also request traffic information from a traffic management system and access the best possible routes. Both V2V and V2I have the potential to reduce around 80 percent of vehicle crashes on the road. More and more new cars can reverse-park, read traffic signs, maintain a safe distance in steady traffic and brake automatically to avoid crashes. Moreover, a number of firms are creating cars that drive themselves to a chosen destination without a human at the controls. It is predicted that driverless cars will be ready for sale within five years. If and when ca
