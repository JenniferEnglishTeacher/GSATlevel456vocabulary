 "洋芋片沒蓋放太久，不再新鮮「酥脆」：crispy。solid 固體的、original 原本的、smooth 平滑的。", "explanationSource": "own", "section": "詞彙"}, {"id": 6, "question": "第 6 題　The townspeople built a ______ in memory of the brave teacher who sacrificed her life to save her students from a burning bus.", "options": ["monument", "refugee", "souvenir", "firecracker"], "answer": 0, "answerLabel": "A", "source": "109 學測｜詞彙｜第 6 題", "explanation": "為紀念犧牲自己救學生的老師而建「紀念碑」：monument。refugee 難民、souvenir 紀念品、firecracker 鞭炮。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　The students in Professor Smith’s classical Chinese class are required to ______ poems by famous Chinese poets.", "options": ["construct", "expose", "recite", "install"], "answer": 2, "answerLabel": "C", "source": "109 學測｜詞彙｜第 7 題", "explanation": "古文課要求「背誦」名家詩作：recite。construct 建造、expose 暴露、install 安裝。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　Although Mr. Tang claims that the house belongs to him, he has not offered any proof of ______.", "options": ["convention", "relationship", "insurance", "ownership"], "answer": 3, "answerLabel": "D", "source": "109 學測｜詞彙｜第 8 題", "explanation": "聲稱房子是他的，卻無法提出「所有權」證明：ownership。convention 慣例、relationship 關係、insurance 保險。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　Ancient Athens, famous for its early development of the democratic system, is often said to be the ______ of democracy.", "options": ["mission", "target", "cradle", "milestone"], "answer": 2, "answerLabel": "C", "source": "109 學測｜詞彙｜第 9 題", "explanation": "雅典最早發展民主制度，被稱為民主的「發源地」：cradle 搖籃、發源地。mission 任務、target 目標、milestone 里程碑。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　The candy can no longer be sold because it was found to contain artificial ingredients far beyond the ______ level.", "options": ["abundant", "immense", "permissible", "descriptive"], "answer": 2, "answerLabel": "C", "source": "109 學測｜詞彙｜第 10 題", "explanat er you think it is worth the effort.\n\n▶ 第 40 題　請從 (A)–(J) 選出最適合 __40__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 6, "answerLabel": "G", "source": "109 學測｜文意選填｜第 40 題", "explanation": "這些方法「從」化妝這類簡單步驟「到」手術這類激烈手段：range from … to …。(G) range。", "explanationSource": "own", "section": "文意選填"}, {"id": 41, "question": "【閱讀測驗 第 41–44 題】\nThe flip-flop is the simplest shoe on the planet. It consists of a piece of rubber, plastic, leather, or woven material in the outline of a foot, with a strap holding the sandal to a wearer’s toes. The name comes from the sound the sandals make when they slap the walking feet.\nThe earliest record of people wearing the flip-flop comes from Egypt, but many ancient cultures had their own variants of the footwear. In the Greek version, the toe strap ran between the first and second toes, while Roman sandals had the strap between the second and third toes. The Mesopotamians wore the strap between the third and fourth toes. In India, “toe knob” sandals had a knob between the first and second toes.\nModern flip-flops derive from Japanese zōris, which were often worn with socks dividing the big toe from the rest, and were typically made of rice straw. During World War II, Japan seized much of Southeast Asia’s rubber. In 1945, devastated from the war, the country set about establishing a cheap industry that could rebuild its economy. The Japanese used their rubber reserves from the war to mass-produce the simplest Japanese footwear. Rubber thus replaced rice straw as the major material for the flip-flop.\nIn the 1950s, flip-flops became popular in the United States as soldiers returning from occupied Japan brought zōris home. The sandals have subsequently undergone redesign, often appearing in bright colors in line with Californian beach culture. They have remained popular due to their convenience, and are often worn with bathing suits or summer clothing. Some people also wear dressy versions for more formal occasions.\nDespite their popularity, flip-flops provoke some questions. Their simple design is responsible for many foot injuries. Another issue is the suitability of exposing feet on the street and places other than the beach. But even more serious is their environmental impact: Millions of plastic discards end up in landfills or the ocean, releasing chemicals and at the same time taking centuries to decompose.\n\n▶ 第 41 題　Which culture most likely created the sandals shown in the picture?", "options": ["Indian.", "Greek.", "Mesopotamian.", "Roman."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 41 題", "explanation": "圖中涼鞋的帶子穿在第二、三趾之間；第二段：羅馬式涼鞋的帶子在第二與第三趾之間（希臘：一二趾；美索不達米亞：三四趾；印度：趾間有球）。(D)。", "explanationSource": "own", "section": "閱讀測驗", "image": "assets/q41-109-flip-flop.png?v=20261120-6"}, {"id": 42, "question": "【閱讀測驗 第 41–44 題】\nThe flip-flop is the simplest shoe on the planet. It consists of a piece of rubber, plastic, leather, or woven material in the outline of a foot, with a strap holding the sandal to a wearer’s toes. The name comes from the sound the sandals make when they slap the walking feet.\nThe earliest record of people wearing the flip-flop comes from Egypt, but many ancient cultures had their own variants of the footwear. In the Greek version, the toe strap ran between the first and second toes, while Roman sandals had the strap between the second and third toes. The Mesopotamians wore the strap between the third and fourth toes. In India, “toe knob” sandals had a knob between the first and second toes.\nModern flip-flops derive from Japanese zōris, which were often worn with socks dividing the big toe from the rest, and were typically made of rice straw. During World War II, Japan seized much of Southeast Asia’s rubber. In 1945, devastated from the war, the country set about establishing a cheap industry that could rebuild its economy. The Japanese used their rubber reserves from the war to mass-produce the simplest Japanese footwear. Rubber thus replaced rice straw as the major material for the flip-flop.\nIn the 1950s, flip-flops became popular in the United States as soldiers returning from occupied Japan brought zōris home. The sandals have subsequently undergone redesign, often appearing in bright colors in line with Californian beach culture. They have remained popular due to their convenience, and are often worn with bathing suits or summer clothing. Some people also wear dressy versions for more formal occasions.\nDespite their popularity, flip-flops provoke some questions. Their simple design is responsible for many foot injuries. Another issue is the suitability of exposing feet on the street and places other than the beach. But even more serious is their environmental impact: Millions of plastic discards end up in landfills or the ocean, releasing chemicals and at the same time taking centuries to decompose.\n\n▶ 第 42 題　Why is the footwear discussed in the passage called “flip-flop”?", "options": ["Because of the noise it makes.", "Because of its changeable design.", "Because of its simple structure.", "Because of the comfort of wearing it."], "answer": 0, "answerLabel": "A", "source": "109 學測｜閱讀測驗｜第 42 題", "explanation": "第一段：名字來自涼鞋拍打腳時發出的聲音。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 43, "question": "【閱讀測驗 第 41–44 題】\nThe flip-flop is the simplest shoe on the planet. It consists of a piece of rubber, plastic, leather, or woven material in the outline of a foot, with a strap holding the sandal to a wearer’s toes. The name comes from the sound the sandals make when they slap the walking feet.\nThe earliest record of people wearing the flip-flop comes from Egypt, but many ancient cultures had their own variants of the footwear. In the Greek version, the toe strap ran between the first and second toes, while Roman sandals had the strap between the second and third toes. The Mesopotamians wore the strap between the third and fourth toes. In India, “toe knob” sandals had a knob between the first and second toes.\nModern flip-flops derive from Japanese zōris, which were often worn with socks dividing the big toe from the rest, and were typically made of rice straw. During World War II, Japan seized much of Southeast Asia’s rubber. In 1945, devastated from the war, the country set about establishing a cheap industry that could rebuild its economy. The Japanese used their rubber reserves from the war to mass-produce the simplest Japanese footwear. Rubber thus replaced rice straw as the major material for the flip-flop.\nIn the 1950s, flip-flops became popular in the United States as soldiers returning from occupied Japan brought zōris home. The sandals have subsequently undergone redesign, often appearing in bright colors in line with Californian beach culture. They have remained popular due to their convenience, and are often worn with bathing suits or summer clothing. Some people also wear dressy versions for more formal occasions.\nDespite their popularity, flip-flops provoke some questions. Their simple design is responsible for many foot injuries. Another issue is the suitability of exposing feet on the street and places other than the beach. But even more serious is their environmental impact: Millions of plastic discards end up in landfills or the ocean, releasing chemicals and at the same time taking centuries to decompose.\n\n▶ 第 43 題　Which of the following is true about the modern development of the flip-flop?", "options": ["Modern flip-flops originated from Indian toe knob sandals.", "Americans loved the Japanese flip-flop because of its bright colors.", "Rubber became the major material of the flip-flop before World War II.", "The sandals American soldiers brought home from Japan later became modern flip-flops."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 43 題", "explanation": "第三、四段：現代夾腳拖源自日本草履，1950 年代美國士兵從佔領的日本帶回來後流行。(D)。(C) 錯：二戰後才改用橡膠。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 44, "question": "【閱讀測驗 第 41–44 題】\nThe flip-flop is the simplest shoe on the planet. It consists of a piece of rubber, plastic, leather, or woven material in the outline of a foot, with a strap holding the sandal to a wearer’s toes. The name comes from the sound the sandals make when they slap the walking feet.\nThe earliest record of people wearing the flip-flop comes from Egypt, but many ancient cultures had their own variants of the footwear. In the Greek version, the toe strap ran between the first and second toes, while Roman sandals had the strap between the second and third toes. The Mesopotamians wore the strap between the third and fourth toes. In India, “toe knob” sandals had a knob between the first and second toes.\nModern flip-flops derive from Japanese zōris, which were often worn with socks dividing the big toe from the rest, and were typically made of rice straw. During World War II, Japan seized much of Southeast Asia’s rubber. In 1945, devastated from the war, the country set about establishing a cheap industry that could rebuild its economy. The Japanese used their rubber reserves from the war to mass-produce the simplest Japanese footwear. Rubber thus replaced rice straw as the major material for the flip-flop.\nIn the 1950s, flip-flops became popular in the United States as soldiers returning from occupied Japan brought zōris home. The sandals have subsequently undergone redesign, often appearing in bright colors in line with Californian beach culture. They have remained popular due to their convenience, and are often worn with bathing suits or summer clothing. Some people also wear dressy versions for more formal occasions.\nDespite their popularity, flip-flops provoke some questions. Their simple design is responsible for many foot injuries. Another issue is the suitability of exposing feet on the street and places other than the beach. But even more serious is their environmental impact: Millions of plastic discards end up in landfills or the ocean, releasing chemicals and at the same time taking centuries to decompose.\n\n▶ 第 44 題　Which of the following is NOT mentioned as a concern of wearing the flip-flop?", "options": ["Personal health.", "Poor quality.", "Social appropriateness.", "Marine pollution."], "answer": 1, "answerLabel": "B", "source": "109 學測｜閱讀測驗｜第 44 題", "explanation": "最後一段提到腳部受傷（健康）、在街上露腳是否合宜（社會適切性）、塑膠垃圾進入海洋（污染）；沒有提到「品質不佳」。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 45, "question": "【閱讀測驗 第 45–48 題】\nShips are the lifeline of trade among countries. Almost everything, from food to machinery, comes by way of the sea in huge ships piloted by captains. But the captain of a ship is responsible for guiding the vessel until they hit a port, waiting to enter the harbor. The task of bringing the ship into the harbor and anchoring it is taken up by a different captain. This captain is called a marine pilot.\nA marine pilot is a boat pilot with specialized knowledge of a particular port or harbor. The pilot is needed to direct large ships into a port, where there are often deep water channels surrounded by shallower seabeds. Without the services of a marine pilot, docking ships would be hazardous. There would be a real chance of running aground and damaging the ship and the cargo, some of which might be dangerous if released into a water-based ecosystem.\nIn addition to the shallower seabeds, tide and wind pose further challenges for bringing ships into a port. During different tides, currents may change from one direction to the other. The same strategy for docking a vessel during an incoming tide may not work during an outgoing tide. Also, the wind can significantly alter the direction of the ship and how it reacts, adding to the difficulty of anchoring the ship.\nMarine pilotage is a job that requires a high degree of proficiency as well as quick and independent thinking. Above all, it is about risk management. A marine pilot goes on board at a crucial time and controls the vessel based on his or her knowledge of the port and the situation at hand. The pilot is responsible for not only the safety of the ship but also the protection of the port and the marine environment.\n\n▶ 第 45 題　What is the passage mainly about?", "options": ["A special profession.", "Shipping and trading.", "Guidelines for safe docking.", "Protection of the marine environment."], "answer": 0, "answerLabel": "A", "source": "109 學測｜閱讀測驗｜第 45 題", "explanation": "全文介紹 marine pilot（領港員）這個專門職業的工作內容與挑戰。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 46, "question": "【閱讀測驗 第 45–48 題】\nShips are the lifeline of trade among countries. Almost everything, from food to machinery, comes by way of the sea in huge ships piloted by captains. But the captain of a ship is responsible for guiding the vessel until they hit a port, waiting to enter the harbor. The task of bringing the ship into the harbor and anchoring it is taken up by a different captain. This captain is called a marine pilot.\nA marine pilot is a boat pilot with specialized knowledge of a particular port or harbor. The pilot is needed to direct large ships into a port, where there are often deep water channels surrounded by shallower seabeds. Without the services of a marine pilot, docking ships would be hazardous. There would be a real chance of running aground and damaging the ship and the cargo, some of which might be dangerous if released into a water-based ecosystem.\nIn addition to the shallower seabeds, tide and wind pose further challenges for bringing ships into a port. During different tides, currents may change from one direction to the other. The same strategy for docking a vessel during an incoming tide may not work during an outgoing tide. Also, the wind can significantly alter the direction of the ship and how it reacts, adding to the difficulty of anchoring the ship.\nMarine pilotage is a job that requires a high degree of proficiency  how it reacts, adding to the difficulty of anchoring the ship.\nMarine pilotage is a job that requires a high degree of proficiency as well as quick and independent thinking. Above all, it is about risk management. A marine pilot goes on board at a crucial time and controls the vessel based on his or her knowledge of the port and the situation at hand. The pilot is responsible for not only the safety of the ship but also the protection of the port and the marine environment.\n\n▶ 第 47 題　What does “a crucial time” in the last paragraph refer to?", "options": ["When the vessel hits a flat.", "When the channel is not deep enough.", "When there is a collision of two ships.", "When a ship is waiting to enter the port."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 47 題", "explanation": "第一段：船長把船開到港口外等待進港，領港員在此時上船——關鍵時刻就是船等著進港時。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 48, "question": "【閱讀測驗 第 45–48 題】\nShips are the lifeline of trade among countries. Almost everything, from food to machinery, comes by way of the sea in huge ships piloted by captains. But the captain of a ship is responsible for guiding the vessel until they hit a port, waiting to enter the harbor. The task of bringing the ship into the harbor and anchoring it is taken up by a different captain. This captain is called a marine pilot.\nA marine pilot is a boat pilot with specialized knowledge of a particular port or harbor. The pilot is needed to direct large ships into a port, where there are often deep water channels surrounded by shallower seabeds. Without the services of a marine pilot, docking ships would be hazardous. There would be a real chance of running aground and damaging the ship and the cargo, some of which might be dangerous if released into a water-based ecosystem.\nIn addition to the shallower seabeds, tide and wind pose further challenges for bringing ships into a port. During different tides, currents may change from one direction to the other. The same strategy for docking a vessel during an incoming tide may not work during an outgoing tide. Also, the wind can significantly alter the direction of the ship and how it reacts, adding to the difficulty of anchoring the ship.\nMarine pilotage is a job that requires a high degree of proficiency as well as quick and independent thinking. Above all, it is about risk management. A marine pilot goes on board at a crucial time and controls the vessel based on his or her knowledge of the port and the situation at hand. The pilot is responsible for not only the safety of the ship but also the protection of the port and the marine environment.\n\n▶ 第 48 題　How does the author conclude the passage in the last paragraph?", "options": ["By adding new details.", "By predicting future development.", "By summarizing the main points.", "By giving advice to the general public."], "answer": 2, "answerLabel": "C", "source": "109 學測｜閱讀測驗｜第 48 題", "explanation": "最後一段重申需要高度專業、風險管理、對港口的知識、保護船與環境——總結要點。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 49, "question": "【閱讀測驗 第 49–52 題】\nProbably the most widely used oil in cooking, olive oil is made by crushing olives with stone or steel blades to release the oil. Extra virgin oil, the finest grade, is made from the first pressing of the olives and has a very low acidity rate (under 1%). To be qualified as “extra virgin,” the oil must also pass both an official test in a laboratory and a sensory evaluation by a trained tasting panel. It must be free from impurity, while exhibiting some fruitiness and creating a pleasant bitter flavor along with a peppery sensation in the mouth. Second on the ranking is virgin olive oil. It is also a first pressing, but has a slightly higher acidity level (under 2%). Lastly, pure olive oil is the cheapest olive oil. It is refined to remove its impurities and blended to improve flavor, and is recommended for all-purpose cooking.\nPackaging and storage also have an impact on the quality of olive oil. Olive oil spoils quickly when exposed to direct sunlight, so it should be stored in the dark at 16-18°C. Moisture and oxygen promote oxidation and therefore limit its shelf life. Plastic containers usually do not provide adequate protection from light, heat, or moisture; additionally, small particles in plastics can leak into the oil, which further reduces its quality.\nOlive oil tasters have long adopted descriptive terms such as “pure” and “light” to evaluate the quality of olive oil. Recently, however, the International Olive Council (IOC) is seeking input on test methods to improve the transparency of the testing process and boost the accuracy of the results. A redefinition of the term “olive oil” is also proposed to make a clear distinction between virgin olive oil and pure olive oil. Industry members of the IOC hope to promote the trade of olive oil by initiating these changes.\n\n▶ 第 49 題　What is the passage mainly about?", "options": ["The flavor of olive oil.", "The trade of olive oil.", "The promotion of olive oil.", "The quality of olive oil."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 49 題", "explanation": "第一段講等級與品質標準，第二段講包裝儲存對品質的影響，第三段講改進品質測試——橄欖油的品質。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 50, "question": "【閱讀測驗 第 49–52 題】\nProbably the most widely used oil in cooking, olive oil is made by crushing olives with stone or steel blades to release the oil. Extra virgin oil, the finest grade, is made from the first pressing of the olives and has a very low acidity rate (under 1%). To be qualified as “extra virgin,” the oil must also pass both an official test in a laboratory and a sensory evaluation by a trained tasting panel. It must be free from impurity, while exhibiting some fruitiness and creating a pleasant bitter flavor along with a peppery sensation in the mouth. Second on the ranking is virgin olive oil. It is also a first pressing, but has a slightly higher acidity level (under 2%). Lastly, pure olive oil is the cheapest olive oil. It is refined to remove its impurities and blended to improve flavor, and is recommended for all-purpose cooking.\nPackaging and storage also have an impact on the quality of olive oil. Olive oil spoils quickly when exposed to direct sunlight, so it should be stored in the dark at 16-18°C. Moisture and oxygen promote oxidation and therefore limit its shelf life. Plastic containers usually do not provide adequate protection from light, heat, or moisture; additionally, small particles in plastics can leak into the oil, which further reduces its quality.\nOlive oil tasters have long adopted descriptive terms such as “pure” and “light” to evaluate the quality of olive oil. Recently, however, the International Olive Council (IOC) is seeking input on test methods to improve the transparency of the testing process and boost the accuracy of the results. A redefinition of the term “olive oil” is also proposed to make a clear distinction between virgin olive oil and pure olive oil. Industry members of the IOC hope to promote the trade of olive oil by initiating these changes.\n\n▶ 第 50 題　Which of the following statements is true about extra virgin olive oil?", "options": ["It is free from any bitter flavor.", "It is refined to remove its impurities.", "It requires mixing of more than one kind of oil.", "It has a lower acidity rate than virgin olive oil."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 50 題", "explanation": "第一段：特級初榨酸度低於 1%，初榨低於 2%——特級的酸度更低。(D)。(A) 錯：要有宜人的苦味；(B)(C) 是 pure olive oil。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 51, "question": "【閱讀測驗 第 49–52 題】\nProbably the most widely used oil in cooking, olive oil is made by crushing olives with stone or steel blades to release the oil. Extra virgin oil, the finest grade, is made from the first pressing of the olives and has a very low acidity rate (under 1%). To be qualified as “extra virgin,” the oil must also pass both an official test in a laboratory and a sensory evaluation by a trained tasting panel. It must be free from impurity, while exhibiting some fruitiness and creating a pleasant bitter flavor along with a peppery sensation in the mouth. Second on the ranking is virgin olive oil. It is also a first pressing, but has a slightly higher acidity level (under 2%). Lastly, pure olive oil is the cheapest olive oil. It is refined to remove its impurities and blended to improve flavor, and is recommended for all-purpose cooking.\nPackaging and storage also have an impact on the quality of olive oil. Olive oil spoils quickly when exposed to direct sunlight, so it should be stored in the dark at 16-18°C. Moisture and oxygen promote oxidation and therefore limit its shelf life. Plastic containers usually do not provide adequate protection from light, heat, or moisture; additionally, small particles in plastics can leak into the oil, which further reduces its quality.\nOlive oil tasters have long adopted descriptive terms such as “pure” and “light” to evaluate the quality of olive oil. Recently, however, the International Olive Council (IOC) is seeking input on test methods to improve the transparency of the testing process and boost the accuracy of the results. A redefinition of the term “olive oil” is also proposed to make a clear distinction between virgin olive oil and pure olive oil. Industry members of the IOC hope to promote the trade of olive oil by initiating these changes.\n\n▶ 第 51 題　According to the passage, what is the best way to store olive oil?", "options": ["In a plastic container in a damp cellar.", "In a clear glass bottle near the kitchen stove.", "In an airtight glass bottle in a kitchen cupboard.", "In an airproof bottle next to a well-lighted window."], "answer": 2, "answerLabel": "C", "source": "109 學測｜閱讀測驗｜第 51 題", "explanation": "第二段：避光、避濕氣與氧氣、不用塑膠容器——密封玻璃瓶放在櫥櫃裡。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 52, "question": "【閱讀測驗 第 49–52 題】\nProbably the most widely used oil in cooking, olive oil is made by crushing olives with stone or steel blades to release the oil. Extra virgin oil, the finest grade, is made from the first pressing of the olives and has a very low acidity rate (under 1%). To be qualified as “extra virgin,” the oil must also pass both an official test in a laboratory and a sensory evaluation by a trained tasting panel. It must be free from impurity, while exhibiting some fruitiness and creating a pleasant bitter flavor along with a peppery sensation in the mouth. Second on the ranking is virgin olive oil. It is also a first pressing, but has a slightly higher acidity level (under 2%). Lastly, pure olive oil is the cheapest olive oil. It is refined to remove its impurities and blended to improve flavor, and is recommended for all-purpose cooking.\nPackaging and storage also have an impact on the quality of olive oil. Olive oil spoils quickly when exposed to direct sunlight, so it should be stored in the dark at 16-18°C. Moisture and oxygen promote oxidation and therefore limit its shelf life. Plastic containers usually do not provide adequate protection from light, heat, or moisture; additionally, small particles in plastics can leak into the oil, which further reduces its quality.\nOlive oil tasters have long adopted descriptive terms such as “pure” and “light” to evaluate the quality of olive oil. Recently, however, the International Olive Council (IOC) is seeking input on test methods to improve the transparency of the testing process and boost the accuracy of the results. A redefinition of the term “olive oil” is also proposed to make a clear distinction between virgin olive oil and pure olive oil. Industry members of the IOC hope to promote the trade of olive oil by initiating these changes.\n\n▶ 第 52 題　What is the IOC trying to do?", "options": ["Train more qualified olive oil tasters.", "Improve the ways of grading olive oil.", "Look for new techniques to boost production.", "Build better connections among industry members."], "answer": 1, "answerLabel": "B", "source": "109 學測｜閱讀測驗｜第 52 題", "explanation": "第三段：IOC 徵求測試方法的意見以提高透明度與準確度，並重新定義「橄欖油」——改進分級方式。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nResearchers in Japan have installed on a train a speaker that barks like a dog and snorts like a deer in order to prevent collisions with animals on the tracks.\nThe country has been troubled by a problem with trains colliding with deer on its railways. According to Japan’s transport ministry, there were 613 cases of train services suspended or delayed for at least 30 minutes resulting from collisions with deer and other wild animals in 2016-17.\nDeer are attracted to railway lines because of a need for iron in their diets. They lick the rails to pick up iron filings caused by the action of wheels against tracks. This dietary need has led to a constant battle to keep the deer separate from the unforgiving nature of tons of onrushing rolling stock. In the past, flashing red lights and even lion faces have been unsuccessfully trialed in an attempt to keep deer off the tracks.\nThis new device has been invented by a team at the country’s Railway Technical Research Institute (RTRI). RTRI officials explain that deer have a habit of repeatedly snorting short, shrill sounds to alert other deer when they perceive danger. The barking of the hound, which drives deer to panic, strengthens the effect of the warning noise, according to the RTRI. When the deer hear a combination of a 3-second-long recording of a deer’s snort and 20 seconds of a barking dog, they panic and flee rapidly.\nRTRI researchers say late-night tests, at times when deer are most frequently seen by railway tracks, have resulted in a 45 percent reduction of deer sighting. Future plans include static barking sites where deer are commonly seen, but “the noises will not be blared in areas where people live beside the tracks.”\n\n▶ 第 53 題　Why are deer attracted to train tracks?", "options": ["They mate at night near railways.", "They need nutrition from train tracks.", "They like to snort at the passing train.", "They sharpen their horns rubbing against the rails."], "answer": 1, "answerLabel": "B", "source": "109 學測｜閱讀測驗｜第 53 題", "explanation": "第三段：鹿需要鐵質，會舔鐵軌上的鐵屑。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nResearchers in Japan have installed on a train a speaker that barks like a dog and snorts like a deer in order to prevent collisions with animals on the tracks.\nThe country has been troubled by a problem with trains colliding with deer on its railways. According to Japan’s transport ministry, there were 613 cases of train services suspended or delayed for at least 30 minutes resulting from collisions with deer and other wild animals in 2016-17.\nDeer are attracted to railway lines because of a need for iron in their diets. They lick the rails to pick up iron filings caused by the action of wheels against tracks. This dietary need has led to a constant battle to keep the deer separate from the unforgiving nature of tons of onrushing rolling stock. In the past, flashing red lights and even lion faces have been unsuccessfully trialed in an attempt to keep deer off the tracks.\nThis new device has been invented by a team at the country’s Railway Technical Research Institute (RTRI). RTRI officials explain that deer have a habit of repeatedly snorting short, shrill sounds to alert other deer when they perceive danger. The barking of the hound, which drives deer to panic, strengthens the effect of the warning noise, according to the RTRI. When the deer hear a combination of a 3-second-long recording of a deer’s snort and 20 seconds of a barking dog, they panic and flee rapidly.\nRTRI researchers say late-night tests, at times when deer are most frequently seen by railway tracks, have resulted in a 45 percent reduction of deer sighting. Future plans include static barking sites where deer are commonly seen, but “the noises will not be blared in areas where people live beside the tracks.”\n\n▶ 第 54 題　What device has NOT been used to solve the railway problem in Japan?", "options": ["Flashing lights.", "Barking speakers.", "Noisy train tracks.", "Lion face paintings."], "answer": 2, "answerLabel": "C", "source": "109 學測｜閱讀測驗｜第 54 題", "explanation": "文中提到閃紅燈、獅子臉（失敗）和新的狗吠喇叭；沒有「會發出噪音的鐵軌」。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 55, "question": "【閱讀測驗 第 53–56 題】\nResearchers in Japan have installed on a train a speaker that barks like a dog and snorts like a deer in order to prevent collisions with animals on the tracks.\nThe country has been troubled by a problem with trains colliding with deer on its railways. According to Japan’s transport ministry, there were 613 cases of train services suspended or delayed for at least 30 minutes resulting from collisions with deer and other wild animals in 2016-17.\nDeer are attracted to railway lines because of a need for iron in their diets. They lick the rails to pick up iron filings caused by the action of wheels against tracks. This dietary need has led to a constant battle to keep the deer separate from the unforgiving nature of tons of onrushing rolling stock. In the past, flashing red lights and even lion faces have been unsuccessfully trialed in an attempt to keep deer off the tracks.\nThis new device has been invented by a team at the country’s Railway Technical Research Institute (RTRI). RTRI officials explain that deer have a habit of repeatedly snorting short, shrill sounds to alert other deer when they perceive danger. The barking of the hound, which drives deer to panic, strengthens the effect of the warning noise, according to the RTRI. When the deer hear a combination of a 3-second-long recording of a deer’s snort and 20 seconds of a barking dog, they panic and flee rapidly.\nRTRI researchers say late-night tests, at times when deer are most frequently seen by railway tracks, have ct of the warning noise, according to the RTRI. When the deer hear a combination of a 3-second-long recording of a deer’s snort and 20 seconds of a barking dog, they panic and flee rapidly.\nRTRI researchers say late-night tests, at times when deer are most frequently seen by railway tracks, have resulted in a 45 percent reduction of deer sighting. Future plans include static barking sites where deer are commonly seen, but “the noises will not be blared in areas where people live beside the tracks.”\n\n▶ 第 56 題　What does the author mean by “the unforgiving nature of tons of onrushing rolling stock” in the third paragraph?", "options": ["The heavy weight of iron materials.", "The cruelty of a barking hound.", "The battle between deer and other animals.", "The danger of a fast-moving train."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 56 題", "explanation": "unforgiving 無情的、rolling stock 列車車輛、onrushing 疾駛——數噸重疾駛列車的危險。(D)。", "explanationSource": "own", "section": "閱讀測驗"}]};</script><script>(function(){var M={};window.QUIZ_CONFIG.questions.forEach(function(q){if(q.image)M[q.question]=q.image});var qn=document.getElementById("question");if(!qn)return;function put(){var old=document.getElementById("gsatImg");var src=M[qn.textContent];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement("img");im.id="gsatImg";im.dataset.src=src;im.src=src;im.alt="題目圖片";im.style.cssText="display:block;max-width:100%;max-height:520px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;background:#fff";qn.insertAdjacentElement("afterend",im)}new MutationObserver(put).observe(qn,{childList:true,characterData:true,subtree:true});})();</script><script src="quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="109 年學測英文：詞彙 15＋綜合測驗 15＋文意選填 10＋閱讀測驗 16｜共 56 題｜單選｜附中文解析｜Level 3–6 單字滑過即看中譯與字卡｜可隨機 20 題、隨時結束並下載 DOCX 錯題";</script><script src="lexicon.js?v=20261120-6"></script><script src="vocab-ho
