gelfish is that they have an occupation in the fish world. Most of them act as cleaners for other fish and pick dead tissue from their bodies. This is not their food, though. Their diet consists mainly of sponge and algae.\nOne particular kind of angelfish, the blackspot angelfish, has a special capability that allows it to change gender from female to male. However, the change is not made at random; it happens for a specific reason. Angelfish live in groups, and each group has one male fish, which is blue in color, and four female fish, which are yellow. The male angelfish is the strongest and largest member of the group. He is the one who protects and looks after the females. When the male dies, the group needs a new “security guard.” This is when the largest female in the group begins to change in appearance. She begins to grow larger in size, and after a week, she starts changing color, from yellow to blue. Slowly, her behavior toward the other fish also changes. She begins behaving like a male. Two weeks later, black stripes appear on her body, indicating the gender change is complete. She is now completely male!\n\n▶ 第 41 題　What is the job of an angelfish in the sea?", "options": ["Being a cleaner for other fish.", "Being a bodyguard for other fish.", "Being a gardener for roots and plants.", "Being a caretaker for sponge and algae."], "answer": 0, "answerLabel": "A", "source": "108 學測｜閱讀測驗｜第 41 題", "explanation": "第二段：大多數神仙魚為其他魚「清理」身上的死組織。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 42, "question": "【閱讀測驗 第 41–44 題】\nAngelfish, often found in the warm seas and coral reefs, are among the most brightly colored fish of the ocean. Brilliant colors and stripes form amazing patterns on their body. These patterns actually help the fish to hide from danger among roots and plants. At night, when these fish become inactive, their colors may become pale. Often, the young ones are differently colored than the adults. Some scientists believe that the color difference between the young and the old indicates their different social positions.\nAnother interesting fact about angelfish is that they have an occupation in the fish world. Most of them act as cleaners for other fish and pick dead tissue from their bodies. This is not their food, though. Their diet consists mainly of sponge and algae.\nOne particular kind of angelfish, the blackspot angelfish, has a special capability that allows it to change gender from female to male. However, the change is not made at random; it happens for a specific reason. Angelfish live in groups, and each group has one male fish, which is blue in color, and four female fish, which are yellow. The male angelfish is the strongest and largest member of the group. He is the one who protects and looks after the females. When the male dies, the group needs a new “security guard.” This is when the largest female in the group begins to change in appearance. She begins to grow larger in size, and after a week, she starts changing color, from yellow to blue. Slowly, her behavior toward the other fish also changes. She begins behaving like a male. Two weeks later, black stripes appear on her body, indicating the gender change is complete. She is now completely male!\n\n▶ 第 42 題　Which of the following statements is true about the color of angelfish?", "options": ["Female angelfish are blue in color.", "The colors of the fish become less bright at night.", "Male angelfish do not have black stripes on them.", "The adult fish and the young ones have the same colors."], "answer": 1, "answerLabel": "B", "source": "108 學測｜閱讀測驗｜第 42 題", "explanation": "第一段：夜間不活動時顏色可能變淡。(B)。(A) 錯：雌魚黃色；(C) 錯：變性完成時出現黑色條紋；(D) 錯：幼魚與成魚顏色不同。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 43, "question": "【閱讀測驗 第 41–44 題】\nAngelfish, often found in the warm seas and coral reefs, are among the most brightly colored fish of the ocean. Brilliant colors and stripes form amazing patterns on their body. These patterns actually help the fish to hide from danger among roots and plants. At night, when these fish become inactive, their colors may become pale. Often, the young ones are differently colored than the adults. Some scientists believe that the color difference between the young and the old indicates their different social positions.\nAnother interesting fact about angelfish is that they have an occupation in the fish world. Most of them act as cleaners for other fish and pick dead tissue from their bodies. This is not their food, though. Their diet consists mainly of sponge and algae.\nOne particular kind of angelfish, the blackspot angelfish, has a special capability that allows it to change gender from female to male. However, the change is not made at random; it happens for a specific reason. Angelfish live in groups, and each group has one male fish, which is blue in color, and four female fish, which are yellow. The male angelfish is the strongest and largest member of the group. He is the one who protects and looks after the females. When the male dies, the group needs a new “security guard.” This is when the largest female in the group begins to change in appearance. She begins to grow larger in size, and after a week, she starts changing color, from yellow to blue. Slowly, her behavior toward the other fish also changes. She begins behaving like a male. Two weeks later, black stripes appear on her body, indicating the gender change is complete. She is now completely male!\n\n▶ 第 43 題　According to the passage, what triggers the gender change in the blackspot angelfish?", "options": ["Dangers to the group.", "Changes in the fish’s diet.", "The birth of young angelfish.", "The death of the male fish in a group."], "answer": 3, "answerLabel": "D", "source": "108 學測｜閱讀測驗｜第 43 題", "explanation": "第三段：When the male dies，群體需要新的保護者，最大的雌魚開始變化。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 44, "question": "【閱讀測驗 第 41–44 題】\nAngelfish, often found in the warm seas and coral reefs, are among the most brightly colored fish of the ocean. Brilliant colors and stripes form amazing patterns on their body. These patterns actually help the fish to hide from danger among roots and plants. At night, when these fish become inactive, their colors may become pale. Often, the young ones are differently colored than the adults. Some scientists believe that the color difference between the young and the old indicates their different social positions.\nAnother interesting fact about angelfish is that they have an occupation in the fish world. Most of them act as cleaners for other fish and pick dead tissue from their bodies. This is not their food, though. Their diet consists mainly of sponge and algae.\nOne particular kind of angelfish, the blackspot angelfish, has a special capability that allows it to change gender from female to male. However, the change is not made at random; it happens for a specific reason. Angelfish live in groups, and each group has one male fish, which is blue in color, and four female fish, which are yellow. The male angelfish is the strongest and largest member of the group. He is the one who protects and looks after the females. When the male dies, the group needs a new “security guard.” This is when the largest female in the group begins to change in appearance. She begins to grow larger in size, and after a week, she starts changing color, from yellow to blue. Slowly, her behavior toward the other fish also changes. She begins behaving like a male. Two weeks later, black stripes appear on her body, indicating the gender change is complete. She is now completely male!\n\n▶ 第 44 題　Which of the following describes the order of changes in the features of a blackspot angelfish during gender change?", "options": ["Size → behavior → color → stripes.", "Color → size → behavior → stripes.", "Size → color → behavior → stripes.", "Color → behavior → size → stripes."], "answer": 2, "answerLabel": "C", "source": "108 學測｜閱讀測驗｜第 44 題", "explanation": "第三段順序：先變大（size）→ 一週後變色（color）→ 行為改變（behavior）→ 兩週後出現黑條紋（stripes）。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 45, "question": "【閱讀測驗 第 45–48 題】\nTotem poles in North America are poles or posts carved with symbols or figures by Aboriginal peoples of the Northwest Coast. Carved from large, straight trees and painted vibrant colors, the totem poles are not just unique works of art. The coastal peoples have long passed on knowledge from generation to generation through oral traditions, and totem poles were the traditional way of telling the story of an individual family or clan.\nThe totem pole can be grouped into specific categories, depending on its location and the occasion for which it was carved. Welcome poles were traditionally placed on village beachfronts to greet visitors arriving by canoe. Inside the homes of high-ranking chiefs is where house poles were found. The family’s history was carefully carved into each pole. Placed along the rear or front walls of a house, house poles also helped to support the main beam of the roof.\nMemorial poles stood in front of a house. They were erected in memory of a deceased chief or a high-ranking clan member. The poles depicted the person’s accomplishments or family history. Mortuary poles were also raised to honor the dead, but they differed from memorial poles, having a burial box placed at the top of the pole. Inside the burial box were the remains of the deceased.\nWhile many of these poles can still be found in various locations on the west coast of North America, there is one pole that can now only be found in a museum—the shame pole. Traditionally, shame poles were carved for a chief to embarrass and ridicule another who had done something wrong. Once the wrong was made right, the pole was taken down.\nTotem poles are important expressions of specific Aboriginal cultures. Despite the threats posed by cultural and political encroachment of colonial forces, the art of totem pole carving has survived. Aboriginal carvers continue to carve totems as symbols of their cultural pride and clan kinship.\n\n▶ 第 45 題　Which of the following is the best title for this passage?", "options": ["Totem Poles, the Legends of Aboriginal Peoples", "Totem Poles: Their Functions", "Totem Poles, Symbols of Historical Resistance", "Totem Poles: Their Designs"], "answer": 1, "answerLabel": "B", "source": "108 學測｜閱讀測驗｜第 45 題", "explanation": "第二至四段依用途分類介紹迎賓柱、屋柱、紀念柱、墓柱、羞辱柱——功能。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 46, "question": "【閱讀測驗 第 45–48 題】\nTotem poles in North America are poles or posts carved with symbols or figures by Aboriginal peoples of the Northwest Coast. Carved from large, straight trees and painted vibrant colors, the totem poles are not just unique works of art. The coastal peoples have long passed on knowledge from generation to generation through oral traditions, and totem poles were the traditional way of telling the story of an individual family or clan.\nThe totem pole can be grouped into specific categories, depending on its location and the occasion for which it was carved. Welcome poles were traditionally placed on village beachfronts to greet visitors arriving by canoe. Inside the homes of high-ranking chiefs is where house poles were found. The family’s history was carefully carved into each pole. Placed along the rear or front walls of a house, house poles also helped to support the main beam of the roof.\nMemorial poles stood in front of a house. They were erected in memory of a deceased chief or a high-ranking clan member. The poles depicted the person’s accomplishments or family history. Mortuary poles were also raised to honor the dead, but they differed from memorial poles, having a burial box placed at the top of the pole. Inside the burial box were the remains of the deceased.\nWhile many of these poles can still be found in various locations on the west coast of North America, there is one pole that can tuary poles were also raised to honor the dead, but they differed from memorial poles, having a burial box placed at the top of the pole. Inside the burial box were the remains of the deceased.\nWhile many of these poles can still be found in various locations on the west coast of North America, there is one pole that can now only be found in a museum—the shame pole. Traditionally, shame poles were carved for a chief to embarrass and ridicule another who had done something wrong. Once the wrong was made right, the pole was taken down.\nTotem poles are important expressions of specific Aboriginal cultures. Despite the threats posed by cultural and political encroachment of colonial forces, the art of totem pole carving has survived. Aboriginal carvers continue to carve totems as symbols of their cultural pride and clan kinship.\n\n▶ 第 47 題　Which of the following is located at the edge of a body of water?", "options": ["The house pole.", "The shame pole.", "The memorial pole.", "The welcome pole."], "answer": 3, "answerLabel": "D", "source": "108 學測｜閱讀測驗｜第 47 題", "explanation": "第二段：Welcome poles 放在村子的海灘前迎接乘獨木舟來的訪客——水邊。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 48, "question": "【閱讀測驗 第 45–48 題】\nTotem poles in North America are poles or posts carved with symbols or figures by Aboriginal peoples of the Northwest Coast. Carved from large, straight trees and painted vibrant colors, the totem poles are not just unique works of art. The coastal peoples have long passed on knowledge from generation to generation through oral traditions, and totem poles were the traditional way of telling the story of an individual family or clan.\nThe totem pole can be grouped into specific categories, depending on its location and the occasion for which it was carved. Welcome poles were traditionally placed on village beachfronts to greet visitors arriving by canoe. Inside the homes of high-ranking chiefs is where house poles were found. The family’s history was carefully carved into each pole. Placed along the rear or front walls of a house, house poles also helped to support the main beam of the roof.\nMemorial poles stood in front of a house. They were erected in memory of a deceased chief or a high-ranking clan member. The poles depicted the person’s accomplishments or family history. Mortuary poles were also raised to honor the dead, but they differed from memorial poles, having a burial box placed at the top of the pole. Inside the burial box were the remains of the deceased.\nWhile many of these poles can still be found in various locations on the west coast of North America, there is one pole that can now only be found in a museum—the shame pole. Traditionally, shame poles were carved for a chief to embarrass and ridicule another who had done something wrong. Once the wrong was made right, the pole was taken down.\nTotem poles are important expressions of specific Aboriginal cultures. Despite the threats posed by cultural and political encroachment of colonial forces, the art of totem pole carving has survived. Aboriginal carvers continue to carve totems as symbols of their cultural pride and clan kinship.\n\n▶ 第 48 題　Which is closest in meaning to the word “encroachment” in the last paragraph?", "options": ["Invasion.", "Appointment.", "Objection.", "Enrichment."], "answer": 0, "answerLabel": "A", "source": "108 學測｜閱讀測驗｜第 48 題", "explanation": "encroachment 侵占、侵犯；殖民勢力在文化與政治上的侵入——invasion。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 49, "question": "【閱讀測驗 第 49–52 題】\nMusic has a tendency to get stuck in our heads. Sometimes a tune intrudes on our thoughts and then plays, and replays, in a never-ending loop. This interesting phenomenon becomes a subject explored by many scientists. They use a range of terms to describe it—stuck-song syndrome, sticky music, cognitive itch, or most commonly “earworm.” Earworms can run around our heads for several minutes to numerous hours. As the melody repeats, it becomes embedded into our mind. Even though our ears do not hear the tune, our brain continues to play it.\nEarworms often take the form of song fragments rather than entire songs, and the song is usually a familiar one. Researchers are not sure why some songs are more likely to get stuck in our heads than others, but everyone has their own tunes. Often those songs have a simple, upbeat melody and catchy, repetitive lyrics, such as popular commercial jingles and slightly annoying radio hits. Recent or repeated exposure to a song or even a small part of a song can also trigger earworms, as can word associations, such as a phrase similar to the lyrics of a song.\nWhile earworms might be annoying, most people who experience them nevertheless report that they are pleasant or at least neutral. Only a third of people are disturbed by the song in their heads. How people cope with their earworms seems to depend on how they feel about them. Those who have positive feelings about their stuck songs prefer to just “let them be,” while those with negative feelings turn to more behavioral responses, which include coping strategies such as singing, talking, or even praying.\n\n▶ 第 49 題　According to the passage, which of the following is true about an earworm?", "options": ["It is a creature living inside our ears.", "It is a tune memorized in a personal way.", "It is a melody repeating in our heads.", "It is a commercial recalled through lyrics."], "answer": 2, "answerLabel": "C", "source": "108 學測｜閱讀測驗｜第 49 題", "explanation": "第一段：旋律在腦中不斷重播，耳朵沒聽到但大腦繼續播放。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 50, "question": "【閱讀測驗 第 49–52 題】\nMusic has a tendency to get stuck in our heads. Sometimes a tune intrudes on our thoughts and then plays, and replays, in a never-ending loop. This interesting phenomenon becomes a subject explored by many scientists. They use a range of terms to describe it—stuck-song syndrome, sticky music, cognitive itch, or most commonly “earworm.” Earworms can run around our heads for several minutes to numerous hours. As the melody repeats, it becomes embedded into our mind. Even though our ears do not hear the tune, our brain continues to play it.\nEarworms often take the form of song fragments rather than entire songs, and the song is usually a familiar one. Researchers are not sure why some songs are more likely to get stuck in our heads than others, but everyone has their own tunes. Often those songs have a simple, upbeat melody and catchy, repetitive lyrics, such as popular commercial jingles and slightly annoying radio hits. Recent or repeated exposure to a song or even a small part of a song can also trigger earworms, as can word associations, such as a phrase similar to the lyrics of a song.\nWhile earworms might be annoying, most people who experience them nevertheless report that they are pleasant or at least neutral. Only a third of people are disturbed by the song in their heads. How people cope with their earworms seems to depend on how they feel about them. Those who have positive feelings about their stuck songs prefer to just “let them be,” while those with negative feelings turn to more behavioral responses, which include coping strategies such as singing, talking, or even praying.\n\n▶ 第 50 題　Which of the following best defines “subject” in the first paragraph?", "options": ["A kind of mental disease.", "A course being taken.", "A participant in an experiment.", "A matter being studied."], "answer": 3, "answerLabel": "D", "source": "108 學測｜閱讀測驗｜第 50 題", "explanation": "a subject explored by many scientists：被科學家研究的「主題」。(D)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 51, "question": "【閱讀測驗 第 49–52 題】\nMusic has a tendency to get stuck in our heads. Sometimes a tune intrudes on our thoughts and then plays, and replays, in a never-ending loop. This interesting phenomenon becomes a subject explored by many scientists. They use a range of terms to describe it—stuck-song syndrome, sticky music, cognitive itch, or most commonly “earworm.” Earworms can run around our heads for several minutes to numerous hours. As the melody repeats, it becomes embedded into our mind. Even though our ears do not hear the tune, our brain continues to play it.\nEarworms often take the form of song fragments rather than entire songs, and the song is usually a familiar one. Researchers are not sure why some songs are more likely to get stuck in our heads than others, but everyone has their own tunes. Often those songs have a simple, upbeat melody and catchy, repetitive lyrics, such as popular commercial jingles and slightly annoying radio hits. Recent or repeated exposure to a song or even a small part of a song can also trigger earworms, as can word associations, such as a phrase similar to the lyrics of a song.\nWhile earworms might be annoying, most people who experience them nevertheless report that they are pleasant or at least neutral. Only a third of people are disturbed by the song in their heads. How people cope with their earworms seems to depend on how they feel about them. Those who have positive feelings about their stuck songs prefer to just “let them be,” while those with negative feelings turn to more behavioral responses, which include coping strategies such as singing, talking, or even praying.\n\n▶ 第 51 題　Which of the following is NOT mentioned as a feature that would trigger earworms?", "options": ["Tunes repeatedly encountered.", "Melodies with smooth rhythms.", "Fragments of songs recently heard.", "Words similar to the lyrics of a song."], "answer": 1, "answerLabel": "B", "source": "108 學測｜閱讀測驗｜第 51 題", "explanation": "第二段提到簡單輕快的旋律、重複的歌詞、最近或反複聽到、相似的字詞；沒有「平順的節奏」。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 52, "question": "【閱讀測驗 第 49–52 題】\nMusic has a tendency to get stuck in our heads. Sometimes a tune intrudes on our thoughts and then plays, and replays, in a never-ending loop. This interesting phenomenon becomes a subject explored by many scientists. They use a range of terms to describe it—stuck-song syndrome, sticky music, cognitive itch, or most commonly “earworm.” Earworms can run around our heads for several minutes to numerous hours. As the melody repeats, it becomes embedded into our mind. Even though our ears do not hear the tune, our brain continues to play it.\nEarworms often take the form of song fragments rather than entire songs, and the song is usually a familiar one. Researchers are not sure why some songs are more likely to get stuck in our heads than others, but everyone has their own tunes. Often those songs have a simple, upbeat melody and catchy, repetitive lyrics, such as popular commercial jingles and slightly annoying radio hits. Recent or repeated exposure to a song or even a small part of a song can also trigger earworms, as can word associations, such as a phrase similar to the lyrics of a song.\nWhile earworms might be annoying, most people who experience them nevertheless report that they are pleasant or at least neutral. Only a third of people are disturbed by the song in their heads. How people cope with their earworms seems to depend on how they feel about them. Those who have positive feelings about their stuck songs prefer to just “let them be,” while those with negative feelings turn to more behavioral responses, which include coping strategies such as singing, talking, or even praying.\n\n▶ 第 52 題　What is the third paragraph mainly about?", "options": ["Why people find earworms annoying.", "How people react to earworms.", "What people use to kill earworms.", "When people start to notice earworms."], "answer": 1, "answerLabel": "B", "source": "108 學測｜閱讀測驗｜第 52 題", "explanation": "第三段：多數人覺得耳蟲是愉快或中性的，人們如何因應取決於感受——人們對耳蟲的反應。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 53, "question": "【閱讀測驗 第 53–56 題】\nGot a bug bite problem? Many people who are troubled by skin rashes caused by bug bites use “foggers,” or “bug bombs,” to get rid of the annoying crawlers in their homes. Many people think these bug killers or pesticides will penetrate every place where the insects hide. Actually, quite the opposite is true. Once the pests detect the chemical fog in the room, they’ll hide themselves in walls or other hideaways, where you’ll never be able to treat them effectively.\nOhio State University researchers tested three commercially sold foggers in a study on the effect of foggers on bedbugs. After testing these brands on five different groups of live bedbugs for two hours, the scientists saw that the foggers had little—if any—effect on the insects. The researchers said bedbugs hide in cracks and crevices such as under sheets and mattresses, or deep in carpets where foggers won’t reach. Moreover, bugs that do come in contact with the mist may be resistant to the pesticide.\nFoggers, or bug bombs, should really be a measure of last resort. First of all, the gases used in bug bombs are highly flammable and thus pose a serious risk of fire or explosion if the product is not used properly. Second, once a bug bomb is used, every surface in your home will be covered with the toxic pesticide. When you use a bug bomb, a chemical mixture rains down on your counters, furniture, floors, and walls, leaving behind oily and toxic substances. Your health might thus be endangered. Therefore, it is suggested that people leave the problem to the professionals.\n\n▶ 第 53 題　What is this passage mainly about?", "options": ["Steps to get rid of bedbugs.", "Ways to use foggers correctly.", "The ineffectiveness of bug bombs.", "The problems caused by insects."], "answer": 2, "answerLabel": "C", "source": "108 學測｜閱讀測驗｜第 53 題", "explanation": "全文說明煙霧殺蟲劑（bug bombs）對床蟲幾乎無效且有風險——無效。(C)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 54, "question": "【閱讀測驗 第 53–56 題】\nGot a bug bite problem? Many people who are troubled by skin rashes caused by bug bites use “foggers,” or “bug bombs,” to get rid of the annoying crawlers in their homes. Many people think these bug killers or pesticides will penetrate every place where the insects hide. Actually, quite the opposite is true. Once the pests detect the chemical fog in the room, they’ll hide themselves in walls or other hideaways, where you’ll never be able to treat them effectively.\nOhio State University researchers tested three commercially sold foggers in a study on the effect of foggers on bedbugs. After testing these brands on five different groups of live bedbugs for two hours, the scientists saw that the foggers had little—if any—effect on the insects. The researchers said bedbugs hide in cracks and crevices such as under sheets and mattresses, or deep in carpets where foggers won’t reach. Moreover, bugs that do come in contact with the mist may be resistant to the pesticide.\nFoggers, or bug bombs, should really be a measure of last resort. First of all, the gases used in bug bombs are highly flammable and thus pose a serious risk of fire or explosion if the product is not used properly. Second, once a bug bomb is used, every surface in your home will be covered with the toxic pesticide. When you use a bug bomb, a chemical mixture rains down on your counters, furniture, floors, and walls, leaving behind oily and toxic substances. Your health might thus be endangered. Therefore, it is suggested that people leave the problem to the professionals.\n\n▶ 第 54 題　How do bedbugs react to foggers?", "options": ["They remain motionless.", "They retreat to safe places.", "They stop biting people.", "They escape into another house."], "answer": 1, "answerLabel": "B", "source": "108 學測｜閱讀測驗｜第 54 題", "explanation": "第一段：蟲子偵測到化學煙霧就躲進牆壁等藏身處。(B)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 55, "question": "【閱讀測驗 第 53–56 題】\nGot a bug bite problem? Many people who are troubled by skin rashes caused by bug bites use “foggers,” or “bug bombs,” to get rid of the annoying crawlers in their homes. Many people think these bug killers or pesticides will penetrate every place where the insects hide. Actually, quite the opposite is true. Once the pests detect the chemical fog in the room, they’ll hide themselves in walls or other hideaways, where you’ll never be able to treat them effectively.\nOhio State University researchers tested three commercially sold foggers in a study on the effect of foggers on bedbugs. After testing these brands on five different groups of live bedbugs for two hours, the scientists saw that the foggers had little—if any—effect on the insects. The researchers said bedbugs hide in cracks and crevices such as under sheets and mattresses, or deep in carpets where foggers won’t reach. Moreover, bugs that do come in contact with the mist may be resistant to the pesticide.\nFoggers, or bug bombs, should really be a measure of last resort. First of all, the gases used in bug bombs are highly flammable and thus pose a serious risk of fire or explosion if the product is not used properly. Second, once a bug bomb is used, every surface in your home will be covered with the toxic pesticide. When you use a bug bomb, a chemical mixture rains down on your counters, furniture, floors, and walls, leaving behind oily and toxic substances. Your health might thus be endangered. Therefore, it is suggested that people leave the problem to the professionals.\n\n▶ 第 55 題　According to the passage, which of the following statements about foggers is true?", "options": ["They can cause a fire.", "They do not stay on furniture.", "They can kill most insects.", "They do not contain chemicals."], "answer": 0, "answerLabel": "A", "source": "108 學測｜閱讀測驗｜第 55 題", "explanation": "第三段：所用氣體高度易燃，使用不當有火災或爆炸風險。(A)。", "explanationSource": "own", "section": "閱讀測驗"}, {"id": 56, "question": "【閱讀測驗 第 53–56 題】\nGot a bug bite problem? Many people who are troubled by skin rashes caused by bug bites use “foggers,” or “bug bombs,” to get rid of the annoying crawlers in their homes. Many people think these bug killers or pesticides will penetrate every place where the insects hide. Actually, quite the opposite is true. Once the pests detect the chemical fog in the room, they’ll hide themselves in walls or other hideaways, where you’ll never be able to treat them effectively.\nOhio State University researchers tested three commercially sold foggers in a study on the effect of foggers on bedbugs. After testing these brands on five different groups of live bedbugs for two hours, the scientists saw that the foggers had little—if any—effect on the insects. The researchers said bedbugs hide in cracks and crevices such as under sheets and mattresses, or deep in carpets where foggers won’t reach. Moreover, bugs that do come in contact with the mist may be resistant to the pesticide.\nFoggers, or bug bombs, should really be a measure of last resort. First of all, the gases used in bug bombs are highly flammable and thus pose a serious risk of fire or explosion if the product is not used properly. Second, once a bug bomb is used, every surface in your home will be covered with the toxic pesticide. When you use a bug bomb, a chemical mixture rains down on your counters, furniture, floors, and walls, leaving behind oily and toxic substances. Your health might thus be endangered. Therefore, it is suggested that people leave the problem to the professionals.\n\n▶ 第 56 題　What does the author advise people to do with bedbug problems?", "options": ["Choose the right fogger.", "Clean the house regularly.", "Close the doors when using pesticides.", "Consult a pest-control expert."], "answer": 3, "answerLabel": "D", "source": "108 學測｜閱讀測驗｜第 56 題", "explanation": "最後一句：建議把問題交給專業人士。(D)。", "explanationSource": "own", "section": "閱讀測驗"}]};</script><script>(function(){var M={};window.QUIZ_CONFIG.questions.forEach(function(q){if(q.image)M[q.question]=q.image});var qn=document.getElementById("question");if(!qn)return;function put(){var old=document.getElementById("gsatImg");var src=M[qn.textContent];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement("img");im.id="gsatImg";im.dataset.src=src;im.src=src;im.alt="題目圖片";im.style.cssText="display:block;max-width:100%;max-height:520px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;background:#fff";qn.insertAdjacentElement("afterend",im)}new MutationObserver(put).observe(qn,{childList:true,characterData:true,subtree:true});})();</script><script src="quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="108 年學測英文：詞彙 15＋綜合測驗 15＋文意選填 10＋閱讀測驗 16｜共 56 題｜單選｜附中文解析｜Level 3–6 單字滑過即看中譯與字卡｜可隨機 20 題、隨時結束並下載 DOCX 錯題";</script><script src="lexicon.js?v=20261120-6"></script><script src="vocab-hover.js?v=20261120-6"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
