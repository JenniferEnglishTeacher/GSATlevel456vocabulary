<script>window.GSAT_PASSAGES={"115-11–15": "From the campfire to the café, people have always gathered together to share the latest news. White rhinoceroses, __11__, do the same thing—only their choice of meeting place is a giant pile of poop.\nA new study indicates that rhinos have a smelly way to __12__. Scientists studying white rhinos in South Africa have found that these animals leave messages in their poop. In particular, they leave their poop in the same place for all the other members in the group to smell—just like humans leaving messages on social media. Furthermore, different rhinos leave different chemicals in their poop, which provide important __13__ about the age, sex, general health, and reproductive conditions of each specific rhino. This is of great significance for the peace and harmony in the group. When all members in a group know what’s going on with each other, it is __14__ that they will fight.\nThe researchers have even made “fake poop” to see how different rhinos would react. They find that dominant males are particularly __15__ the “fake poop” that carries chemicals from females ready to mate. The males sniff it for longer duration and come back to the same spot more frequently, a clear sign that they are gathering information about mating opportunities from the poop.", "115-16–20": "The history of dim sum stretches back to the early days of the Silk Road, an ancient network of trade routes connecting the East and the West. Those who traveled along the routes through China needed places to rest. Teahouses thus sprang up to __16__ the weary travelers, offering them a cup of tea to help them regain energy. But the culinary art of dim sum __17__, for it was considered inappropriate to pair tea with food. Centuries later, the ability of tea to aid in digestion finally became known. Teahouse owners therefore began providing bite-sized snacks as an accompaniment, and the tradition of these Cantonese delicacies was born.\nDim sum is more than just an example of Chinese cuisine. It is __18__ an enjoyable dining experience that can span hours. The small portions were designed to merely “touch the heart,” as the name literally means, and __19__ were first enjoyed as snacks. The small size allows the customer to order a great variety of dishes, creating a banquet of different tastes and flavors. It is customary for big groups to enjoy simple dishes together as __20__. Ultimately, dim sum—the food—is only a small part of the dim sum experience.", "115-21–30": "Are you feeling a little guilty about your daily mid-afternoon snooze? Well, you don’t need to. Taking a nap in the middle of the day is by no means __21__. In fact, you are giving your brain and your body some time to recharge and turn up refreshed.\nResearch has shown that napping is linked with brain size and __22__; specifically, it can boost our cognition and memory. In our early 20s, our brain starts shrinking, which gradually slows cognition and increases dementia __23__ in later life. The brain size of habitual nappers, however, is found to be better preserved. This suggests that napping may significantly __24__ age-related brain shrinkage, and thus lower the possibility of developing dementia. Neurologists also confirm that naps can enhance memory and learning. For students cramming for college exams, napping will help __25__ acquired knowledge and learned skills.\nUnderstanding how to perfect your nap is vital for reaping its benefits. To begin with, you need to find out the ideal length of a nap. Some studies recommend napping for 20 to 40 minutes, while others __26__ shorter naps, such as 15 to 20 minutes. The best nap length, however, may __27__ a person’s physical condition and fatigue level. For some people, even a five-minute nap can bring about surprisingly __28__ benefits.\nFurthermore, the environment where naps are taken also plays an important role. A dark space with little distraction is ideal for napping. So, find yourself a quiet place with __29__ light or with blackout curtains. If you can’t find a dark room, consider wearing a sleep mask. You can also add some soothing nature sounds to create a relaxing __30__, which can make your naps more effective.", "115-31–34": "Smiling is a gesture that many people engage in dozens of times a day without thought. Most people believe that smiling is an expression of good feelings, a simple way to show happiness and friendliness. But does this hold true across time and cultures?\n__31__ In the West, for example, portraits of men and women before the 1700s typically depicted them with a serious, unsmiling expression. The absence of smiles stemmed partly from the attempt to hide their decayed teeth caused by poor dental hygiene. More importantly, smiling and laughter had long been perceived in the society as manifestations of a lack of self-control and good manners. Paintings with white-toothed smiles emerged after the 1700s, with the gradual rise of a culture that valued perception and responsiveness.\nRecent studies also show that interpretations of smiling may vary from culture to culture. While in most cultures smiling is associated with positive emotions, in certain cultures the same person can be judged as less intelligent when smiling. __32__ The amount people smile is culturally influenced as well. People smile more when they are from countries that are high in individualism and low in population. These are often places where the needs and rights of the individual take precedence over those of the group. __33__ Newcomers from different parts of the world are found to smile more. Without a shared language, they often resort to smiling to get along with others. For them, smiling is a straightforward way to indicate that one is reliable and trustworthy.\n__34__ As many psychologists now point out, this simple gesture is in fact far more complicated than it may appear.", "114-11–15": "In 1995, a group of business and academic leaders met at the home of Juanita Brown and David Isaacs in Mill Valley, California. None of them had any idea they were about to create a social innovation that __11__ rapidly around the world.\nThe group was supposed to have a large-circle discussion in their beautiful garden. Unfortunately, it started pouring. With their plan __12__ by the rain, the two dozen participants squeezed into the living room. They broke into small, intimate table conversations, recording their insights on paper tablecloths. They periodically stopped their conversations to switch tables so the insights and ideas might __13__ and deepen. As they moved from one table to another, they noticed new ideas emerging from the discussions. This in turn enriched subsequent rounds of conversation. Over the course of the morning, the innovative discussion process __14__ a new form of collective effort that transformed the depth, scope, and quality of their discussion.\nThe World Café was __15__ created. Since that rainy morning in Mill Valley, the World Café approach has been applied to multi-group discussions and cooperative actions by businesses, industries, and educational institutions around the world.", "114-16–20": "If you have ever been sick to your stomach on a rocking boat or a bumpy car ride, you know the discomfort of motion sickness. It can __16__ suddenly, progressing from a feeling of uneasiness to a cold sweat. Soon, it can lead to dizziness, nausea, and vomiting.\nMotion sickness occurs when the signals your brain receives from your eyes, ears, and body __17__. Your brain doesn’t know whether you are stationary or moving when these parts send conflicting information: One part of your balance-sensing system detects that your body is moving, but the other parts __18__. Your brain’s confused reaction makes you feel sick. You may experience the discomfort from the motion of cars, boats, or amusement park rides. You may also get sick from playing video games, or looking through a microscope.\nYou can take some __19__ to help avoid the discomfort. If you are traveling, reserve seats where motion is felt the least, such as the front row of a car or forward cars of a train. Looking out into the distance from the vehicle can help __20__. You can also take medicine before your ride to avoid or reduce nausea and vomiting.", "114-21–30": "The Notre-Dame de Paris is one of the most famous cathedrals in Europe. Located at the heart of Paris, this medieval cathedral is __21__ for its intricate architecture, stunning stained glass windows, and, above all, its bells.\nMounted in the two tall towers of the cathedral, Notre-Dame’s bells have been ringing for over 800 years. In fact, there is documented __22__ to the ringing of bells even before the cathedral’s construction was completed, dating as far back as the 12th century. The 10 bells vary in size, each __23__ a name. The largest one, named “Emmanuel,” weighs over 13 tons. It is the only one of the whole group that __24__ the French Revolution, while the rest were melted down for weapons. The melted bells were recast in the late 19th century. But due to their poor acoustic quality, all of the bells were replaced in 2013—except for Emmanuel, which __25__ its renowned, excellent sound. This particular bell, ringing in F sharp, is considered one of the most harmonically beautiful in Europe.\nOver centuries, the bells have become a __26__ part of life in Paris, where they are known as “the cathedral’s voice.” They have been used to mark the hours of the day, to call the __27__ to prayer, and to signal emergency situations such as fires and invasions. They have also rung in times of __28__ and of mourning, announcing such events as royal weddings and coronations of kings, as well as funerals of heads of state.\nHowever, after the devastating fire that damaged the cathedral in 2019, the bells fell __29__. The building went through a complex and time-consuming process of __30__, and the famous monument was finally reopened on December 8, 2024. The sounds of Notre-Dame bells once again filled the air in Paris, and will be heard for generations to come.", "114-31–34": "A capsule hotel, also known as a pod hotel, is a unique type of basic, affordable accommodation. Originated in Japan, these hotels were initially meant for business professionals to stay close to populated business districts without spending a lot. __31__ A typical room of a capsule hotel is roughly the length and width of a single bed, with sufficient height for a guest to crawl in and sit up on the bed. The walls of each capsule may be made of wood, metal or any rigid material, but are often fiberglass or plastic. __32__ Each capsule is equipped with a comfortable mattress, a small light, and sometimes a television or other entertainment options. Such minimalist design is what makes these hotels both inexpensive and efficient, providing only the essential elements for a good night sleep.\nThe first capsule hotel, the Capsule Inn Osaka, opened in 1979. Since then, capsule hotels have quickly spread to other cities and countries. Chains have emerged in Taiwan, Singapore, and even on resort islands like Bali. Pod hotels are also seen in Europe and North America, especially in big cities like New York, London, and Paris. __33__ Instead of the traditional bare pod-sized style, new chains now feature interior design that appeals to digitally connected travelers from around the world. Guests may enjoy facilities such as free Wi-Fi, mobile charging, and even a soundless alarm system that raises the sleeping guests into a seated position while gradually brightening the lights.\nWhile offering budget-conscious travelers a unique option, capsule hotels may not be suitable for everyone. Some hotels may not provide air conditioning in the capsules, leading to poor air flow. __34__ Also, you may have to share common facilities (such as bathrooms) with other guests. And, if you’re worried about feeling claustrophobic in small spaces, you’d better think twice before making a reservation.", "113-11–15": "Mystery shoppers are paid consumers who are hired to shop in stores and collect data. They are sent to a wide variety of service-based businesses, including stores, restaurants, and banks—potentially anywhere customers are served. Sometimes referred to as secret shoppers, mystery shoppers __11__ regular customers to purchase items, eat in restaurants, make inquiries, or return items. They grade and report on the quality of products, customer service, and environment of the stores __12__ they are assigned.\nWhen evaluating a business, mystery shoppers have to follow certain standard procedures to avoid __13__. They are often given a checklist that provides directions on what to observe or look out for to ensure consistency. Sometimes these shoppers collect data about their “normal” observations, such as cleanliness of the store or timeliness of the service. They may also pretend to be __14__ customers, arguing with a salesperson without a good reason. With the data they collect, mystery shoppers can identify areas for __15__ and thereby help enhance the quality of products and services. In this way, these secret shoppers may help a business gain a competitive edge.", "113-16–20": "The modern worker rolls out of bed, groans, and turns off an alarm clock before reluctantly getting up for the day’s work. But how did people get to work on time before alarm clocks were widely used?\nDuring the second Industrial Age, people toiled at unusual hours in mines or factories and often had to get up for work early in the morning. They __16__ alarm clocks because adjustable alarms had been invented by the mid-19th century. But the new device was still relatively expensive and unreliable. British workers thus relied on a human alarm clock known as a “knocker-up.” __17__ sticks or pea shooters, the human alarms would tour the streets, tap on windows, or blast them with dried peas, trying to wake paying customers in time for work.\nWhether they wielded rods or pea shooters, knockers-up became __18__ throughout the United Kingdom. Every morning, these people, often older in age, were seen in big streets and small alleys, waking up their customers professionally. They usually would not leave people’s houses until they were sure their customers were awake.\nWhile the practice continued in some parts of the country until the 1970s, it __19__ as alarm clocks became more widespread and affordable. Today, beeping alarm clocks and smartphones that play morning music are surely simpler and more convenient. However, they cannot __20__ the personal attention coming from the distinctive tap of a pea shooter.", "113-21–30": "On a hilltop overlooking the 2011-tsunami hit Otsuchi Town in northeastern Japan, there is a white phone booth standing all alone in the wind. The lonely “wind phone” serves to connect family members to their __21__ loved ones who died in the tsunami that claimed 18,000 lives. People come to speak to those they have lost, to say the words they never got to say on that __22__ day.\nThe idea for the wind phone was first __23__ by a Japanese garden designer named Itaru Sasaki, who was grieving over the death of his cousin in 2010, before the tsunami. Feeling that he needed a private space to help him navigate through the __24__, Sasaki positioned a booth where he could “speak” to the dead relative. The booth he built __25__ only an old dial phone with a disconnected phone line. When he stepped into the booth, he could pick up the phone to call his cousin, telling him how he was, and how he missed him. Sasaki stated in an interview: “Because my thoughts couldn’t be __26__ through a regular phone line, I wanted them to be carried on the wind.” Hence, the wind phone allows Sasaki to create a one-way conversation with deep, soulful personal meaning, and renders the grieving process more __27__ for him.\nSasaki opened his wind phone to the public in 2011, after the devastating tsunami. News about the phone gradually spread, and the booth has become a __28__ between the living and the dead. Phones resembling the wind phone have since been built around the world. Some were even set up to allow people to call their loved ones lost in the COVID-19 pandemic.\nGrieving is a natural __29__ for coping with loss of a loved one, and people grieve in various ways. For those who speak into the wind phone, __30__ is always there: They believe that their messages will—through some unknown way—reach the deceased.", "113-31–34": "While Dr. Weinstein, a surgeon at Dartmouth College, was trying to lift a heavy box, he twisted his back. The pain was agonizing. The surgeon could not sit, and when he lay down he could barely get up. So he decided to go out for a run. He took an aspirin, iced the injured area, and off he went. When he returned, he felt “pretty good.”\n__31__ When people have sprained a muscle or tendon, they are usually advised not to go right back to exercising until the pain goes away. But Dr. Weinstein says that approach is outdated and counterproductive. In fact, when active people consult him, he usually tells them to just keep exercising.\nDr. Weinstein is not alone in his treatment of sports injury, but the specific advice can differ from specialist to specialist. __32__ They nevertheless caution that a cutback may be necessary, such as running shorter distances or going more slowly. Others say the patients may need to engage in sports outside of their usual, main sport (that is, to cross-train), at least some of the time. Still others say the safest thing to do is cross-train all the time until the pain is gone. __33__ Their consensus, however, is that unless the injury involves something as serious as a broken bone or a ripped muscle, moderate exercise can actually speed healing.\n__34__ Thus, more and more patients are now advised to keep moving despite the pain. The rule of thumb, however, is to see a doctor first and get an accurate diagnosis. If a serious injury is ruled out and the pain is not getting worse after exercising, then the exercise “makes a lot of sense.”", "112-11–15": "In certain forests, when you look up you will see a network of cracks formed by gaps between the outermost edges of tree branches. It looks like a precisely engineered jigsaw puzzle, each branch growing just perfectly so it almost, __11__, touches the neighboring tree. This beautiful phenomenon is called crown shyness.\nScientists have been discussing crown shyness since the 1920s, proposing __12__ explanations for the phenomenon. Some researchers point out that as trees often grow close together, treetops can easily collide and break when swayed by the wind. In order to protect their branches from breakage, trees maintain “shyness gaps”—spaces large enough to prevent them from touching their neighbors.\nOther scientists suggest that plants, like animals, __13__ resources—nutrients, water, space, and light. In forested areas with thick tree crowns, there is intense struggle for these resources. Gaps in the treetops resulting from crown shyness may allow trees to increase their __14__ light and enhance photosynthesis. Additionally, by having branches that do not touch those of their neighbors, trees may be able to limit the spread of leaf-eating insects, and potentially also the transmission of diseases from tree to tree. __15__ decades of investigation, there is no consensus on exactly what causes the beautiful and mysterious phenomenon of crown shyness.", "112-16–20": "Gravity has been at the top of the science agenda since the start of Mars missions. In the earlier days of space travel, scientists tried to overcome the force of gravity so that a rocket could shoot __16__ Earth’s pull in order to land humans on the moon. Today, they are more interested in how reduced gravity affects the astronauts’ __17__ condition.\nOur bodies have evolved to exist within Earth’s gravity (1 g), not in the weightlessness of space (0 g) or the microgravity of Mars (0.3 g). When on Earth, we have more fluids in our lower body because they are pulled down by Earth’s gravity. However, with the absence of gravity in the outer space, our body fluids __18__, shifting toward the upper body and the head. As a result, the astronauts have swollen, puffy faces, very much resembling that of the round-headed Charlie Brown in the famous comic strip. This “Charlie Brown effect” will be more __19__ when the astronauts go on their Mars missions, which will take about three years to complete, much longer than missions to the moon. Moreover, the effect is often __20__ space motion sickness, headaches, and nausea. Such a syndrome is considered the top health risk for the astronauts, and scientists are still trying to figure out how it may be prevented.", "112-21–30": "Water makes up more than half of our body weight. To sustain this amount of fluid in our bodies, plain water is considered our best choice, for it contains no sugar and no calories. Yet, is water always the healthiest drink we can __21__? Well, it depends on who and where we are, and what we’re doing.\nObviously, a physically __22__ person with an outdoor job under the sun will need to drink more fluid than a desk-bound person who lives and works in an air-conditioned place. But there’s more to it than that. When a person sweats, he loses water and salt, so he needs to replace both. Replacing lost fluid with just plain water means the body has too much water and not enough salt. To __23__ things out, the body will get rid of water by producing urine. For this reason, milk can actually be more __24__ than drinking water. Milk naturally contains salt and lactose, a sugar which the human body needs in small amounts to help stimulate water __25__. Coconut water, which contains salt and carbohydrates, is also more functional than water at restoring and maintaining a normal fluid __26__ after exercise.\nFor the average person, however, water remains a very good __27__ for keeping hydrated—if you know how to drink it. The secret is: Never wait until the body is telling you you’re thirsty, since there must already have been significant changes in your body for it to eventually __28__ your consciousness. At that point, it might be well past the best moment to take in fluid. Also, drinking a lot of liquid in one go can cause more water to __29__ the body quickly and come out as urine. To __30__ this, you need to drink water throughout the day to maintain your hydration levels.", "112-31–34": "Have you ever thought of “coloring” the names of the days of the week? When you listen to someone speaking, do you see a rainbow of colors? Or perhaps Mozart’s music tastes like an apple pie to you? If so, it is very likely that you have synesthesia.\nSynesthesia is a condition in which people’s senses intermix. In some cases, people with synesthesia may experience colors when they hear, read, or even think of letters and numbers. In others, words can trigger a real sensation of taste on their tongue.\n__31__ In the early 1990s, however, scientists noticed that synesthetic colors do not change over time. When asked what color is evoked by a letter or number, synesthetic people would persistently give the same answer even if tested months or years apart. __32__ The most compelling support, however, comes from brain scans, which show that color processing areas in the brain light up when these people listen to certain words.\nIs synesthesia genetically inherited or acquired after birth? Scientists agree that synesthesia has a genetic basis, because it frequently runs in families. But an actual synesthesia gene (or genes) has not been identified yet. __33__ For example, the flavors people with taste-word synesthesia experience are usually childhood flavors, such as chocolate or strawberries. Also, people with color-music synesthesia more often than not have had early musical training.\nOnce thought to be extremely rare, synesthesia is now found to affect about one to four percent of the population. __34__ As is often observed, most of us tend to associate lower notes with darker colors and higher notes with brighter colors. Researchers further point out that in most people synesthesia is active only during the first months of their infancy, while this ability remains forever in certain individuals.", "111-11–15": "A book town is a rural town in which second-hand and antiquarian bookshops are concentrated. The concept was __11__ by Richard Booth, who opened the first second-hand bookshop in Hay-on-Wye, UK in 1961. Following him, many local people opened their own bookshops, and the small town soon became a model of sustainable rural development and tourism. Since the 1970s, book towns like Hay-on-Wye __12__ up all over the world.\nAlthough all book towns have a great number of bookshops, that’s where the similarities __13__. Each of these towns shows unique features of its own. Some have many small private shops, while others have organizations steered by volunteers. Some even run regular activities to attract visitors. For example, an annual book festival is held in Hay-on-Wye. Clunes, in Australia, holds a monthly book talk that hosts authors to discuss their latest __14__.\nAs digital reading is changing our traditional way of reading, book towns like Hay-on-Wye are particularly important to __15__. The feel of a book, the smell, the weight, and the knowledge that a particular book might be more than a hundred years old—all these highlight the importance of preserving the physical book as a complement to technology.", "111-16–20": "Airline passengers may have noticed that all plane windows have rounded edges, instead of the hard corners commonly found in our house. The round windows are indeed pleasant to the eye, but they actually were designed for reasons __16__ aesthetics.\nIn the early days of aviation, plane windows __17__ square in shape. Then as commercial air travel became popular in the 1950s and airplanes began flying higher and faster, three planes mysteriously broke apart in midair. The cause? Square windows. Scientists found that sharp corners are natural weak spots where stress concentrates. The problem is __18__ when airplanes fly at higher altitudes, where the difference between the inside and outside pressure increases, causing added stress. When subjected to repeated pressurization high in the sky, the four corners on a square window may __19__.\nCurved windows, on the other hand, distribute stress around more evenly, reducing the likelihood of cracks or breaks. Circular shapes are also stronger and resist deformation, and therefore can __20__ extreme differences in pressure inside and outside of an aircraft.\nThus, round windows are a major safety innovation that keeps planes from disintegrating mid-flight. They are also used on ships and spacecraft for their greater structural integrity.", "111-21–30": "A stunt person is a man or a woman who performs dangerous acts, usually in the television or movie industry. In this line of work, the person is paid to do daring actions that are deemed too __21__ for the regular actor to perform, including jumping from heights, crashing cars, or fighting with weapons.\nStunt work emerged out of __22__ over time. In the early days of the film industry, actors themselves shot acrobatic acts and dangerous scenes, until they began to get injured. There were, however, no __23__ crew members to perform impressive stunts at that time. If something dangerous needed to be done for a scene, the producers would hire anyone crazy or desperate enough to do it. These people were not trained to perform stunts, so they often __24__ things for the first time during the actual shooting. They had to learn from their own mistakes, which __25__ some their lives, and almost all suffered light or severe injuries.\nBeginning around 1910, audiences developed a taste for serial action movies, which __26__ the use of dedicated stunt peopl section": "110年"}, {"id": 201, "question": "【文意選填 第 31–40 題】\n@@110-31–40@@\n\n▶ 第 31 題　請從 (A)–(J) 選出最適合 __31__ 的字（每個選項只用一次）", "options": ["means", "soreness", "point to", "argue", "demanding", "abide by", "fanatic", "current", "make time", "modest"], "answer": 9, "answerLabel": "J", "source": "110 學測｜文意選填｜第 31 題", "explanation": "研究顯示「適量」的運動——即使一天 15 分鐘——就能減輕憂鬱：modest amounts of exercise。(J) modest。", "explanationSource": "own", "section": "110年"}, {"id": 202, "question": "【文意選填 第 31–40 題】\n@@110-31–40@@\n\n▶ 第 32 題　請從 (A)–(J) 選出最適合 __32__ 的字（每個選項只用一次）", "options": ["means", "soreness", "point to", "argue", "demanding", "abide by", "fanatic", "current", "make time", "modest"], "answer": 6, "answerLabel": "G", "source": "110 學測｜文意選填｜第 32 題", "explanation": "運動使人快樂，而且你不必是健身「狂」：a fitness fanatic。(G) fanatic。", "explanationSource": "own", "section": "110年"}, {"id": 203, "question": "【文意選填 第 31–40 題】\n@@110-31–40@@\n\n▶ 第 33 題　請從 (A)–(J) 選出最適合 __33__ 的字（每個選項只用一次）", "options": ["means", "soreness", "point to", "argue", "demanding", "abide by", "fanatic", "current", "make time", "modest"], "answer": 5, "answerLabel": "F", "source": "110 學測｜文意選填｜第 33 題", "explanation": "把「慢慢開始、享受樂趣」當作要「遵守」的座右銘：a motto to abide by。(F) abide by。", "explanationSource": "own", "section": "110年"}, {"id": 204, "question": "【文意選填 第 31–40 題】\n@@110-31–40@@\n\n▶ 第 34 題　請從 (A)–(J) 選出最適合 __34__ 的字（每個選項只用一次）", "options": ["means", "soreness", "point to", "argue", "demanding", "abide by", "fanatic", "current", "make time", "modest"], "answer": 7, "answerLabel": "H", "source": "110 學測｜文意選填｜第 34 題", "explanation": "事實上，「近期」的健康研究證明運動不必痛苦也能有效：current health studies。(H) current。", "explanationSource": "own", "section": "110年"}, {"id": 205, "question": "【文意選填 第 31–40 題】\n@@110-31–40@@\n\n▶ 第 35 題　請從 (A)–(J) 選出最適合 __35__ 的字（每個選項只用一次）", "options": ["means", "soreness", "point to", "argue", "demanding", "abide by", "fanatic", "current", "make time", "modest"], "answer": 3, "answerLabel": "D", "source": "110 學測｜ uch a long time that they no longer taste fresh and ______.", "options": ["solid", "crispy", "original", "smooth"], "answer": 1, "answerLabel": "B", "source": "109 學測｜詞彙｜第 5 題", "explanation": "洋芋片沒蓋放太久，不再新鮮「酥脆」：crispy。solid 固體的、original 原本的、smooth 平滑的。", "explanationSource": "own", "section": "109年"}, {"id": 216, "question": "第 6 題　The townspeople built a ______ in memory of the brave teacher who sacrificed her life to save her students from a burning bus.", "options": ["monument", "refugee", "souvenir", "firecracker"], "answer": 0, "answerLabel": "A", "source": "109 學測｜詞彙｜第 6 題", "explanation": "為紀念犧牲自己救學生的老師而建「紀念碑」：monument。refugee 難民、souvenir 紀念品、firecracker 鞭炮。", "explanationSource": "own", "section": "109年"}, {"id": 217, "question": "第 7 題　The students in Professor Smith’s classical Chinese class are required to ______ poems by famous Chinese poets.", "options": ["construct", "expose", "recite", "install"], "answer": 2, "answerLabel": "C", "source": "109 學測｜詞彙｜第 7 題", "explanation": "古文課要求「背誦」名家詩作：recite。construct 建造、expose 暴露、install 安裝。", "explanationSource": "own", "section": "109年"}, {"id": 218, "question": "第 8 題　Although Mr. Tang claims that the house belongs to him, he has not offered any proof of ______.", "options": ["convention", "relationship", "insurance", "ownership"], "answer": 3, "answerLabel": "D", "source": "109 學測｜詞彙｜第 8 題", "explanation": "聲稱房子是他的，卻無法提出「所有權」證明：ownership。convention 慣例、relationship 關係、insurance 保險。", "explanationSource": "own", "section": "109年"}, {"id": 219, "question": "第 9 題　Ancient Athens, famous for its early development of the democratic system, is often said to be the ______ of democracy.", "options": ["mission", "target", "cradle", "milestone"], "answer": 2, "answerLabel": "C", "source": "109 學測｜詞彙｜第 9 題", "explanation": "雅典最早發展民主制度，被稱為民主的「發源地」：cradle 搖籃、發源地。mission 任務、target 目標、milestone 里程碑。", "explanationSource": "own", "section": "109年"}, {"id": 220, "question": "第 10 題　The candy can no longer be sold because it wa planation": "銀行為吸引客戶，員工隨時提供「迅速的」服務：prompt。singular 單一的、expensive 昂貵的、probable 可能的。", "explanationSource": "own", "section": "102年"}, {"id": 497, "question": "第 7 題　John’s part-time experience at the cafeteria is good ______ for running his own restaurant.", "options": ["preparation", "recognition", "formation", "calculation"], "answer": 0, "answerLabel": "A", "source": "102 學測｜詞彙｜第 7 題", "explanation": "打工經驗是日後開餐廳的好「準備」：preparation。recognition 認可、formation 形成、calculation 計算。", "explanationSource": "own", "section": "102年"}, {"id": 498, "question": "第 8 題　Women’s fashions are ______ changing: One season they may favor pantsuits, but the next season they may prefer miniskirts.", "options": ["lately", "shortly", "relatively", "constantly"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 8 題", "explanation": "一季流行褲裝、下一季流行迷你裙，表示時尚「不斷」改變：constantly。lately 最近、shortly 不久、relatively 相對地。", "explanationSource": "own", "section": "102年"}, {"id": 499, "question": "第 9 題　Standing on the seashore, we saw a ______ of seagulls flying over the ocean before they glided down and settled on the water.", "options": ["pack", "flock", "herd", "school"], "answer": 1, "answerLabel": "B", "source": "102 學測｜詞彙｜第 9 題", "explanation": "a flock of seagulls 一「群」海鷗：flock 用於鳥類。pack 用於狼/狗、herd 用於牛羊、school 用於魚群。", "explanationSource": "own", "section": "102年"}, {"id": 500, "question": "第 10 題　The book is not only informative but also ______ , making me laugh and feel relaxed while reading it.", "options": ["understanding", "infecting", "entertaining", "annoying"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 10 題", "explanation": "這本書讓我邊讀邊笑，表示不只有資訊也很「有娛樂性」：entertaining。understanding 體諒的、infecting 感染的、annoying 惱人的。", "explanationSource": "own", "section": "102年"}, {"id": 501, "question": "第 11 題　After working in front of my computer for the entire day, my neck and shoulders got so ______ that I couldn’t even turn my head.", "options": ["dense", "harsh", "stiff", "concrete"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 11 題", "explanation": "整天用電腦，脖子和肩膀「僵硬」到無法轉頭：stiff。dense 密集的、harsh 嚴厲的、concrete 具體的。", "explanationSource": "own", "section": "102年"}, {"id": 502, "question": "第 12 題　Getting a flu shot before the start of flu season gives our body a chance to build up protection against the ______ that could make us sick.", "options": ["poison", "misery", "leak", "virus"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 12 題", "explanation": "打流感疫苗讓身體建立對「病毒」的防護：virus。poison 毒藥、misery 痛苦、leak 漏洞。", "explanationSource": "own", "section": "102年"}, {"id": 503, "question": "第 13 題　The kingdom began to ______ after the death of its ruler, and was soon taken over by a neighboring country.", "options": ["collapse", "dismiss", "rebel", "withdraw"], "answer": 0, "answerLabel": "A", "source": "102 學測｜詞彙｜第 13 題", "explanation": "統治者死後王國開始「崩潰」，很快被鄰國占領：collapse。dismiss 解散、rebel 反叛、withdraw 撤退。", "explanationSource": "own", "section": "102年"}, {"id": 504, "question": "第 14 題　Though Kevin failed in last year’s singing contest, he did not feel ______ . This year he practiced day and night and finally won first place in the competition.", "options": ["relieved", "suspected", "discounted", "frustrated"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 14 題", "explanation": "比賽失利卻沒有感到「受挫」，隔年日夜練習奪冠：frustrated。relieved 鬆一口氣的、suspected 被懷疑的、discounted 被低估的。", "explanationSource": "own", "section": "102年"}, {"id": 505, "question": "第 15 題　Emma and Joe are looking for a live-in babysitter for their three-year-old twins, ______ one who knows how to cook.", "options": ["initially", "apparently", "preferably", "considerably"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 15 題", "explanation": "找保母，「最好是」會做菜的：preferably。initially 最初、apparently 顯然、considerably 相當地。", "explanationSource": "own", "section": "102年"}, {"id": 506, "question": "【綜合測驗 第 16–20 題】\n@@102-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["calling", "being called" ], "answer": 2, "answerLabel": "C", "source": "99 學測｜綜合測驗｜第 21 題", "explanation": "available in yellow, red and white：有黃、紅、白等顏色可選，顏色用介系詞 in。", "explanationSource": "own", "section": "99年"}, {"id": 632, "question": "【綜合測驗 第 21–25 題】\n@@99-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["grown", "tasted", "identified", "emphasized"], "answer": 2, "answerLabel": "C", "source": "99 學測｜綜合測驗｜第 22 題", "explanation": "可藉由薄而淺色的外皮「辨認」：be identified by。grow 種植、taste 嚐、emphasize 強調。", "explanationSource": "own", "section": "99年"}, {"id": 633, "question": "【綜合測驗 第 21–25 題】\n@@99-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["such", "much", "that", "it"], "answer": 3, "answerLabel": "D", "source": "99 學測｜綜合測驗｜第 23 題", "explanation": "make it easier for them to bruise：it 為虛受詞，代替後面的不定詞片語。", "explanationSource": "own", "section": "99年"}, {"id": 634, "question": "【綜合測驗 第 21–25 題】\n@@99-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["Unlike", "Through", "Besides", "Despite"], "answer": 0, "answerLabel": "A", "source": "99 學測｜綜合測驗｜第 24 題", "explanation": "「不同於」新鮮洋蔥，儲藏洋蔥有多層厚而深色的外皮：Unlike。through 透過、besides 除了、despite 儘管。", "explanationSource": "own", "section": "99年"}, {"id": 635, "question": "【綜合測驗 第 21–25 題】\n@@99-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["anxious", "intense", "organic", "effective"], "answer": 1, "answerLabel": "B", "source": "99 學測｜綜合測驗｜第 25 題", "explanation": "儲藏洋蔥風味更「濃烈」，適合需要更多味道的辛辣菜餚：intense。anxious 焦慮的、organic 有機的、effective 有效的。", "explanationSource": "own", "section": "99年"}, {"id": 636, "question": "【綜合測驗 第 26–30 題】\n@@99-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["frightening", "threatening", "appealing", "promoting"], "answer": 1, "answerLabel": "B", "source": "99 學測｜綜合測驗｜第 26 題", "explanation": "塑膠瓶可能釋放有害化學物質，因此瓶裝水可能「威脅」健康：health threatening。frightening 可怕的、appealing 吸引人的。", "explanationSource": "own", "section": "99年"}, {"id": 637, "question": "【綜合測驗 第 26–30 題】\n@@99-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["cause", " oss", "fold", "veil", "yield"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 2 題", "explanation": "緊張時會把手臂「交叉抱」在胸前像保護自己：fold one’s arms 抱臂。toss 丟、veil 遮蓋、yield 屈服。", "explanationSource": "own", "section": "98年"}, {"id": 653, "question": "第 3 題　The doors of these department stores slide open ______ when you approach them. You don’t have to open them yourself.", "options": ["necessarily", "diligently", "automatically", "intentionally"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 3 題", "explanation": "不必自己開門，門會「自動」滑開：automatically。necessarily 必然地、diligently 勤奮地、intentionally 故意地。", "explanationSource": "own", "section": "98年"}, {"id": 654, "question": "第 4 題　Nicole is a ______ language learner. Within a short period of time, she has developed a good command of Chinese and Japanese.", "options": ["convenient", "popular", "regular", "brilliant"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 4 題", "explanation": "短時間內精通中日文，是「傑出的」語言學習者：brilliant。convenient 方便的、popular 受歡迎的、regular 規律的。", "explanationSource": "own", "section": "98年"}, {"id": 655, "question": "第 5 題　With rising oil prices, there is an increasing ______ for people to ride bicycles to work.", "options": ["permit", "instrument", "appearance", "tendency"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 5 題", "explanation": "油價上漲，騎單車通勤的「趨勢」增加：tendency 趨勢。permit 許可證、instrument 工具、appearance 外表。", "explanationSource": "own", "section": "98年"}, {"id": 656, "question": "第 6 題　This information came from a very ______ source, so you don’t have to worry about being cheated.", "options": ["reliable", "flexible", "clumsy", "brutal"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 6 題", "explanation": "不必擔心被騙，表示消息來源「可靠」：reliable。flexible 有彈性的、clumsy 笨拙的、brutal 殘暴的。", "explanationSource": "own", "section": "98年"}, {"id": 657, "question": "第 7 題　We hope that there will be no war in the world and that all people live in peace and ______ with each other.", "options": ["complaint", "harmony", "mission", "texture"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 7 題", "explanation": "live in peace and harmony 和平和諧地共處：harmony 和諧。complaint 抱怨、mission 任務、texture 質地。", "explanationSource": "own", "section": "98年"}, {"id": 658, "question": "第 8 題　To have a full discussion of the issue, the committee spent a whole hour ______ their ideas at the meeting.", "options": ["depositing", "exchanging", "governing", "interrupting"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 8 題", "explanation": "為了充分討論，花一小時「交換」意見：exchanging ideas。deposit 存放、govern 統治、interrupt 打斷。", "explanationSource": "own", "section": "98年"}, {"id": 659, "question": "第 9 題　While adapting to western ways of living, many Asian immigrants in the US still try hard to ______ their own cultures and traditions.", "options": ["volunteer", "scatter", "preserve", "motivate"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 9 題", "explanation": "適應西方生活的同時仍努力「保存」自己的文化：preserve。volunteer 自願、scatter 散播、motivate 激勵。", "explanationSource": "own", "section": "98年"}, {"id": 660, "question": "第 10 題　With the worsening of global economic conditions, it seems wiser and more ______ to keep cash in the bank rather than to invest in the stock market.", "options": ["sensible", "portable", "explicit", "anxious"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 10 題", "explanation": "經濟惡化時，把錢存銀行比投資股市更「明智」：sensible 明智的。portable 可攜帶的、explicit 明確的、anxious 焦慮的。", "explanationSource": "own", "section": "98年"}, {"id": 661, "question": "第 11 題　Under the ______ of newly elected president Barack Obama, the US is expected to turn a new page in politics and economy.", "options": ["adoption", "fragrance", "identity", "leadership"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 11 題", "explanation": "在新總統的「領導」下，美國將開啟新頁：leadership。adoption 採用、fragrance 香氣、identity 身分。", "explanationSource": "own", "section": "98年"}, {"id": 662, "question": "第 12 題　Rapid advancement in motor engineering makes it ______ possible to build a flying car in the near future.", "options": ["individually", "narrowly", "punctually", "technically"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 12 題", "explanation": "引擎技術進步，使製造飛行汽車在「技術上」可行：technically。individually 個別地、narrowly 勉強地、punctually 準時地。", "explanationSource": "own", "section": "98年"}, {"id": 663, "question": "第 13 題　When you take photos, you can move around to shoot the target object from different ______.", "options": ["moods", "trends", "angles", "inputs"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 13 題", "explanation": "拍照時可移動以從不同「角度」拍攝：angles。mood 心情、trend 趨勢、input 輸入。", "explanationSource": "own", "section": "98年"}, {"id": 664, "question": "第 14 題　Students were asked to ______ or rewrite their compositions based on the teacher’s comments.", "options": ["revise", "resign", "refresh", "remind"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 14 題", "explanation": "依老師評語「修改」或重寫作文：revise 修訂。resign 辭職、refresh 使恢復、remind 提醒。", "explanationSource": "own", "section": "98年"}, {"id": 665, "question": "第 15 題　Besides lung cancer, another ______ of smoking is wrinkles, a premature sign of aging.", "options": ["blessing", "campaign", "consequence", "breakthrough"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 15 題", "explanation": "除了肺癌，吸菸的另一個「後果」是皺紋：consequence。blessing 福氣、campaign 活動、breakthrough 突破。", "explanationSource": "own", "section": "98年"}, {"id": 666, "question": "【綜合測驗 第 16–20 題】\n@@98-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["marked", "tore", "served", "took"], "answer": 0, "answerLabel": "A", "source": "98 學測｜綜合測驗｜第 16 題", "explanation": "用小紙片在聖歌本上「標記」頁面：marked。後文說紙片總是掉出來，呼應書籤功能。", "explanationSource": "own", "section": "98年"}, {"id": 667, "question": "【綜合測驗 第 16–20 題】\n@@98-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["threw at", "occurred to", "looked down upon", "came up with"], "answer": 1, "answerLabel": "B", "source": "98 學測｜綜合測驗｜第 17 題", "explan rce": "97 學測｜詞彙｜第 9 題", "explanation": "新電腦功能多，明顯「優於」舊電腦：be superior to 優於（固定搭配 to）。technical 技術的、suitable 適合的、typical 典型的。", "explanationSource": "own", "section": "97年"}, {"id": 700, "question": "第 10 題　Simon loves his work. To him, work always comes first, and family and friends are ______.", "options": ["secondary", "temporary", "sociable", "capable"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 10 題", "explanation": "工作永遠第一，家人朋友就是「次要的」：secondary。temporary 暫時的、sociable 善於社交的、capable 有能力的。", "explanationSource": "own", "section": "97年"}, {"id": 701, "question": "第 11 題　Although your plans look good, you have to be ______ and consider what you can actually do.", "options": ["dramatic", "realistic", "stressful", "manageable"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 11 題", "explanation": "要考慮實際做得到的事，表示要「務實」：realistic 實際的。dramatic 戲劇性的、stressful 有壓力的、manageable 可管理的。", "explanationSource": "own", "section": "97年"}, {"id": 702, "question": "第 12 題　Built under the sea in 1994, the ______ between England and France connects the UK more closely with mainland Europe.", "options": ["waterfall", "temple", "tunnel", "channel"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 12 題", "explanation": "1994 年建於海底、連接英法兩國的是「隧道」（英法海底隧道）：tunnel。channel 是海峡，非人工建造。", "explanationSource": "own", "section": "97年"}, {"id": 703, "question": "第 13 題　This tour package is very appealing, and that one looks ______ attractive. I don’t know which one to choose.", "options": ["equally", "annually", "merely", "gratefully"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 13 題", "explanation": "這個行程很吸引人，那個「同樣」吸引人，所以難以抉擇：equally 同樣地。annually 每年、merely 僅僅、gratefully 感激地。", "explanationSource": "own", "section": "97年"}, {"id": 704, "question": "第 14 題　Hseu Fang-yi, a young Taiwanese dancer, recently ______ at Lincoln Center in New York and won a great deal of praise.", "options": ["performed", "pretended", "postponed", "persuaded"], "answer": 0, "answerLabel":
