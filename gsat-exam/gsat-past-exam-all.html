erve both as a screwdriver and a can opener.\nIt was a lifesaver for Swiss knife makers, who were struggling to compete with cheaper German imports. In 1884, Carl Elsener, head of the Swiss knife manufacturer Victorinox, seized that opportunity with both hands, and designed a soldier’s knife that the army loved. It was a simple knife with one big blade, a can opener, and a screwdriver.\nA few years after the soldier’s knife was issued, the “Schweizer Offizier Messer,” or Swiss Officer’s Knife, came on the market. Interestingly, the Officer’s Knife was never given to those serving in the army. The Swiss military purchasers considered the new model with a corkscrew for opening wine not “essential for survival,” so officers had to buy this new model by themselves. But its special multi-functional design later launched the knife as a global brand. After the Second World War, a great number of American soldiers were stationed in Europe. And as they could buy the Swiss army knife at shops on military bases, they bought huge quantities of them. However, it seems that “Schweizer Offizier Messer” was too difficult for them to say, so they just called it the Swiss army knife, and that is the name it is now known by all over the world.", "102-45–48": "Space is where our future is—trips to the Moon, Mars and beyond. Most people would think that aside from comets and stars there is little else out there. But, since our space journey started we have left so much trash there that scientists are now concerned that if we don’t clean it up, we may all be in mortal danger.\nThe first piece of space junk was created in 1964, when the American satellite Vanguard I stopped operating and lost its connection with the ground center. However, since it kept orbiting around the Earth without any consequences, scientists became increasingly comfortable abandoning things that no longer served any useful purpose in space.\nIt is estimated that there are currently over 500,000 pieces of man-made trash orbiting the Earth at speeds of up to 17,500 miles per hour. The junk varies from tiny pieces of paint chipped off rockets to cameras, huge fuel tanks, and even odd items like the million-dollar tool kit that astronaut Heidemarie Stefanyshyn-Piper lost during a spacewalk.\nThe major problem with the space trash is that it may hit working satellites and damage traveling spacecraft. Moreover, pieces of junk may collide with each other and break into fragments which fall back to the Earth. To avoid this, scientists have devised several ways for clearing the sky. Ground stations have been built to monitor larger pieces of space trash to prevent them from crashing into working satellites or space shuttles. Future plans include a cooperative effort among many nations to stop littering in space and to clean up the trash already there.", "102-49–52": "An alcohol breath test (ABT) is often used by the police to find out whether a person is drunk while driving. In the United States, the legal blood alcohol limit is 0.08% for people aged 21 years or older, while people under 21 are not allowed to drive a car with any level of alcohol in their body. A “positive” test result, a result over the legal limit, allows the police to arrest the driver. However, many people who tested positive on the test have claimed that they only drank a “non-alcoholic” energy drink. Can one of these energy drinks really cause someone to test positive on an ABT? Researchers in Missouri set up an experiment to find out.\nFirst, the amount of alcohol in 27 different popular energy drinks was measured. All but one had an alcohol level greater than 0.005%. In nine of the 27 drinks, the alcohol level was at least 0.096%. The scientists then investigated the possibility that these small levels of alcohol could be detected by an ABT. They asked test subjects to drink a full can or bottle of an energy drink and then gave each subject an ABT one minute and 15 minutes after the drink was finished.\nFor 11 of the 27 energy drinks, the ABT did detect the presence of alcohol if the test was given within one minute after the drink was taken. However, alcohol could not be detected for any of the drinks if the test was given 15 minutes after the drink was consumed. This shows that when the test is taken plays a crucial role in the test result. The sooner the test is conducted after the consumption of these drinks, the more likely a positive alcohol reading will be obtained.", "102-53–56": "The majority of Indian women wear a red dot between their eyebrows. While it is generally taken as an indicator of their marital status, the practice is primarily related to the Hindu religion. The dot goes by different names in different Hindi dialects, and “bindi” is the one that is most commonly known. Traditionally, the dot carries no gender restriction: Men as well as women wear it. However, the tradition of men wearing it has faded in recent times, so nowadays we see a lot more women than men wearing one.\nThe position of the bindi is standard: center of the forehead, close to the eyebrows. It represents a third, or inner eye. Hindu tradition holds that all people have three eyes: The two outer ones are used for seeing the outside world, and the third one is there to focus inward toward God. As such, the dot signifies piety and serves as a constant reminder to keep God in the front of a believer’s thoughts.\nRed is the traditional color of the dot. It is said that in ancient times a man would place a drop of blood between his wife’s eyes to seal their marriage. According to Hindu beliefs, the color red is believed to bring good fortune to the married couple. Today, people go with different colors depending upon their preferences. Women often wear dots that match the color of their clothes. Decorative or sticker bindis come in all sizes, colors and variations, and can be worn by young and old, married and unmarried people alike. Wearing a bindi has become more of a fashion statement than a religious custom.", "101-16–20": "Kizhi is an island on Lake Onega in Karelia, Russia, with a beautiful collection of wooden churches and houses. It is one of the most popular tourist __16__ in Russia and a United Nations Educational, Scientific, and Cultural Organization (UNESCO) World Heritage Site.\nThe island is about 7 km long and 0.5 km wide. It is surrounded by about 5,000 other islands, some of __17__ are just rocks sticking out of the ground.\nThe entire island of Kizhi is, __18__, an outdoor museum of wooden architecture created in 1966. It contains many historically significant and beautiful wooden structures, __19__ windmills, boathouses, chapels, fish houses, and homes. The jewel of the architecture is the 22-domed Transfiguration Church, built in the early 1700s. It is about 37 m tall, __20__ it one of the tallest log structures in the world. The church was built with pine trees brought from the mainland, which was quite common for the 18th century.", "101-21–25": "There was once a time when all human beings were gods. However, they often took their divinity for granted and __21__ abused it. Seeing this, Brahma, the chief god, decided to take their divinity away from them and hide it __22__ it could never be found.\nBrahma called a council of the gods to help him decide on a place to hide the divinity. The gods suggested that they hide it __23__ in the earth or take it to the top of the highest mountain. But Brahma thought __24__ would do because he believed humans would dig into the earth and climb every mountain, and eventually find it. So, the gods gave up.\nBrahma thought for a long time and finally decided to hide their divinity in the center of their own being, for humans would never think to __25__ it there. Since that time humans have been going up and down the earth, digging, climbing, and exploring—searching for something already within themselves.", "101-26–30": "In the fall of 1973, in an effort to bring attention to the conflict between Egypt and Israel, World Hello Day was born. The objective is to promote peace all over the world, and to __26__ barriers between every nationality. Since then, World Hello Day—November 21st of every year— __27__ observed by people in 180 countries.\nTaking part couldn’t be __28__. All one has to do is say hello to 10 people on the day. However, in response to the __29__ of this event, the concepts of fostering peace and harmony do not have to be confined to one day a year. We can __30__ the spirit going by communicating often and consciously. It is a simple act that anyone can do and it reminds us that communication is more effective than conflict.", "101-31–40": "Generally there are two ways to name typhoons: the number-based convention and the list-based convention. Following the number-based convention, typhoons are coded with __31__ types of numbers such as a 4-digit or a 6-digit code. For example, the 14th typhoon in 2003 can be labeled either as Typhoon 0314 or Typhoon 200314. The __32__ of this convention, however, is that a number is hard to remember. The list-based convention, on the other hand, is based on the list of typhoon names compiled in advance by a committee, and is more widely used.\nAt the very beginning, only __33__ names were used because at that time typhoons were named after girlfriends or wives of the experts on the committee. In 1979, however, male names were also included because women protested against the original naming __34__ for reasons of gender equality.\nIn Asia, Western names were used until 2000 when the committee decided to use Asian names to __35__ Asians’ awareness of typhoons. The names were chosen from a name pool __36__ of 140 names, 10 each from the 14 members of the committee. Each country has its unique naming preferences. Korea and Japan __37__ animal names and China likes names of gods such as Longwang (dragon king) and Fengshen (god of the wind).\nAfter the 140 names are all used in order, they will be __38__. But the names can be changed. If a member country suffers great damage from a certain typhoon, it can __39__ that the name of the typhoon be deleted from the list at the annual committee meeting. For example, the names of Nabi by South Korea, and Longwang by China were __40__ with other names in 2007. The deletion of both names was due to the severe damage caused by the typhoons bearing the names.", "101-41–44": "The kilt is a skirt traditionally worn by Scottish men. It is a tailored garment that is wrapped around the wearer’s body at the waist starting from one side, around the front and back and across the front again to the opposite side. The overlapping layers in front are called “aprons.” Usually, the kilt covers the body from the waist down to just above the knees. A properly made kilt should not be so loose that the wearer can easily twist the kilt around the body, nor should it be so tight that it causes bulging of the fabric where it is buckled. Underwear may be worn as one prefers.\nOne of the most distinctive features of the kilt is the pattern of squares, or sett, it exhibits. The association of particular patterns with individual families can be traced back hundreds of years. Then in the Victorian era (19th century), weaving companies began to systematically record and formalize the system of setts for commercial purposes. Today there are also setts for States and Provinces, schools and universities, and general patterns that anybody can wear.\nThe kilt can be worn with accessories. On the front apron, there is often a kilt pin, topped with a small decorative family symbol. A small knife can be worn with the kilt too. It typically comes in a very wide variety, from fairly plain to quite elaborate silver- and jewel-ornamented designs. The kilt can also be worn with a sporran, which is the Gaelic word for pouch or purse.", "101-45–48": "Wesla Whitfield, a famous jazz singer, has a unique style and life story, so I decided to see one of her performances and interview her for my column.\nI went to a nightclub in New York and watched the stage lights go up. After the band played an introduction, Wesla Whitfield wheeled herself onstage in a wheelchair. As she sang, Whitfield’s voice was so powerful and soulful that everyone in the room forgot the wheelchair was even there.\nAt 57, Whitfield is small and pretty, witty and humble, persistent and philosophical. Raised in California, Whitfield began performing in public at age 18, when she took a job as a singing waitress at a pizza parlor. After studying classical music in college, she moved to San Francisco and went on to sing with the San Francisco Opera Chorus.\nWalking home from rehearsal at age 29, she was caught in the midst of a random shooting that left her paralyzed from the waist down. I asked how she dealt with the realization that she’d never walk again, and she confessed that initially she didn’t want to face it. After a year of depression she tried to kill herself. She was then admitted to a hospital for treatment, where she was able to recover.\nWhitfield said she came to understand that the only thing she had lost in this misfortunate event was the ability to walk. She still possessed her most valuable asset—her mind. Pointing to her head, she said, “Everything important is in here. The only real disability in life is losing your mind.” When I asked if she was angry about what she had lost, she admitted to being frustrated occasionally, “especially when everybody’s dancing, because I love to dance. But when that happens I just remove myself so I can focus instead on what I can do.”", "101-49–52": "Forks trace their origins back to the ancient Greeks. Forks at that time were fairly large with two tines that aided in the carving of meat in the kitchen. The tines prevented meat from twisting or moving during carving and allowed food to slide off more easily than it would with a knife.\nBy the 7th century A.D., royal courts of the Middle East began to use forks at the table for dining. From the 10th through the 13th centuries, forks were fairly common among the wealthy in Byzantium. In the 11th century, a Byzantine wife brought forks to Italy; however, they were not widely adopted there until the 16th century. Then in 1533, forks were brought from Italy to France. The French were also slow to accept forks, for using them was thought to be awkward.\nIn 1608, forks were brought to England by Thomas Coryate, who saw them during his travels in Italy. The English first ridiculed forks as being unnecessary. “Why should a person need a fork when God had given him hands?” they asked. Slowly, however, forks came to be adopted by the wealthy as a symbol of their social status. They were prized possessions made of expensive materials intended to impress guests. By the mid 1600s, eating with forks was considered fashionable among the wealthy British.\nEarly table forks were modeled after kitchen forks, but small pieces of food often fell through the two tines or slipped off easily. In late 17th century France, larger forks with four curved tines were developed. The additional tines made diners less likely to drop food, and the curved tines served as a scoop so people did not have to constantly switch to a spoon while eating. By the early 19th century, four-tined forks had also been developed in Germany and England and slowly began to spread to America.", "101-53–56": "Animals are a favorite subject of many photographers. Cats, dogs, and other pets top the list, followed by zoo animals. However, because it’s hard to get them to sit still and “perform on command,” some professional photographers refuse to photograph pets.\nOne way to get an appealing portrait of a cat or dog is to hold a biscuit or treat above the camera. The animal’s longing look toward the food will be captured by the camera, but the treat won’t appear in the picture because it’s out of the camera’s range. When you show the picture to your friends afterwards, they’ll be impressed by your pet’s loving expression.\nIf you are using fast film, you can take some good, quick shots of a pet by simply snapping a picture right after calling its name. You’ll get a different expression from your pet using this technique. Depending on your pet’s mood, the picture will capture an interested, curious expression or possibly a look of annoyance, especially if you’ve awakened it from a nap.\nTaking pictures of zoo animals requires a little more patience. After all, you can’t wake up a lion! You may have to wait for a while until the animal does something interesting or moves into a position for you to get a good shot. When photographing zoo animals, don’t get too close to the cages, and never tap on the glass or throw things between the bars of a cage. Concentrate on shooting some good pictures, and always respect the animals you are photographing.", "100-16–20": "When it comes to Egypt, people think of pyramids and mummies, both of which are closely related to Egyptian religious beliefs. The ancient Egyptians believed firmly in life __16__ death. When a person died, his or her soul was thought to travel to an underworld, where it __17__ a series of judgments before it could progress to a better life in the next world. For the soul to travel smoothly, the body had to __18__ unharmed. Thus, they learned how to preserve the body by drying it out, oiling and then __19__ the body in linen, before placing it in the coffin. Egyptians also built pyramids as __20__ for their kings, or pharaohs. The pyramid housed the pharaoh’s body together with priceless treasure, which would accompany him into the next world.", "100-21–25": "On March 23, 1999, the musical MAMMA MIA! made its first public appearance in London. It __21__ the kind of welcome it has been getting ever since. The audience went wild. They were literally out of their seats and singing and dancing in the aisles.\nMAMMA MIA! has become a __22__ entertainment phenomenon. More than 30 million people all over the world have fallen in love with the characters, the story and the music. The musical has been performed in more than nine languages, with more productions than any __23__ musical. Its worldwide popularity is mainly due to its theme music, which showcases ABBA’s timeless songs in a fresh and vital way __24__ retains the essence of both pop music and good musical theater. It has __25__ so many people that a film version was also made. To no one’s surprise, it has enjoyed similar popularity.", "100-26–30": "Which is more valuable? Water or diamonds? Water is more useful to mankind than diamonds, and yet __26__ are costlier. Why? Called the diamond-water paradox, this is a classic problem posed to students of economics.\nThe answer has to do with supply and demand. Being a rare natural resource, diamonds are __27__ in supply. However, their demand is high because many people buy them to tell the world that they have money, __28__ as conspicuous consumption in economics. In other words, the scarcity of goods is __29__ causes humans to attribute value. If we __30__ surrounded by an unending abundance of diamonds, we probably wouldn’t value them very much. Hence, diamonds carry a higher monetary value than water, even though we find more use for water.", "100-31–40": "Popcorn is one of the snacks that rarely fail to make watching a movie more fun. However, the modern way of preparing this __31__ snack may carry an unhappy secret. Research by the U.S. government now reports that microwave popcorn may contain substances that can cause health __32__.\nResearchers found that commercial popcorn companies often coat their microwave popcorn bags with a __33__ called perfluorooctanoic acid (PFOA) which has been found to cause both cancer and lung disease in laboratory animals. Making matters worse, the artificial butter substitute that generally __34__ with microwavable popcorn contains a common food-flavoring substance. This substance, according to health scientists, is __35__ for some serious lung diseases.\nFor an easy and __36__ alternative, nutritionists suggest that we pop our own popcorn. All that is __37__ is a large, high pot, about four tablespoons of vegetable oil and a small handful of organic popcorn kernels. When the kernels start __38__, shake the pot to let the steam escape and to let the unpopped kernels fall to the bottom. As soon as the popping slows down, __39__ the pot from the stove. Then pour the popcorn into a bowl and season with a small __40__ of real butter or olive oil and natural salt. And the healthy and fun snack is ready to serve.", "100-41–44": "There is a long-held belief that when meeting someone, the more eye contact we have with the person, the better. The result is an unfortunate tendency for people making initial contact—in a job interview, for example—to stare fixedly at the other individual. However, this behavior is likely to make the interviewer feel very uncomfortable. Most of us are comfortable with eye contact lasting a few seconds. But eye contact which persists longer than that can make us nervous.\nAnother widely accepted belief is that powerful people in a society—often men—show their dominance over others by touching them in a variety of ways. In fact, research shows that in almost all cases, lower-status people initiate touch. Women also initiate touch more often than men do.\nThe belief that rapid speech and lying go together is also widespread and enduring. We react strongly—and suspiciously—to fast talk. However, the opposite is a greater cause for suspicion. Speech that is slow, because it is laced with pauses or errors, is a more reliable indicator of lying than the opposite.", "100-45–48": "It is easy for us to tell our friends from our enemies. But can other animals do the same? Elephants can! They can use their sense of vision and smell to tell the difference between people who pose a threat and those who do not.\nIn Kenya, researchers found that elephants react differently to clothing worn by men of the Maasai and Kamba ethnic groups. Young Maasai men spear animals and thus pose a threat to elephants; Kamba men are mainly farmers and are not a danger to elephants.\nIn an experiment conducted by animal scientists, elephants were first presented with clean clothing or clothing that had been worn for five days by either a Maasai or a Kamba man. When the elephants detected the smell of clothing worn by a Maasai man, they moved away from the smell faster and took longer to relax than when they detected the smells of either clothing worn by Kamba men or clothing that had not been worn at all.\nGarment color also plays a role, though in a different way. In the same study, when the elephants saw red clothing not worn before, they reacted angrily, as red is typically worn by Maasai men. Rather than running away as they did with the smell, the elephants acted aggressively toward the red clothing.\nThe researchers believe that the elephants’ emotional reactions are due to their different interpretations of the smells and the sights. Smelling a potential danger means that a threat is nearby and the best thing to do is run away and hide. Seeing a potential threat without its smell means that risk is low. Therefore, instead of showing fear and running away, the elephants express their anger and become aggressive.", "100-49–52": "It was something she had dreamed of since she was five. Finally, after years of training and intensive workouts, Deborah Duffey was going to compete in her first high school basketball game. The goals of becoming an outstanding player and playing college ball were never far from Deborah’s mind.\nThe game was against Mills High School. With 1:42 minutes left in the game, Deborah’s team led by one point. A player of Mills had possession of the ball, and Deborah ran to guard against her. As Deborah shuffled sideways to block the player, her knee went out and she collapsed on the court in burning pain. Just like that  and the rising heat dries and opens the ripe cones of the redwood, releasing many thousands of seeds onto the ground below.\nNew trees are often produced from sprouts, little baby trees, which form at the base of the trunk. These sprouts grow slowly, nourished by the root system of the “mother” tree. When the main tree dies, the sprouts are then free to grow as full trees, forming a “fairy ring” of trees around the initial tree. These trees, in turn, may give rise to more sprouts, and the cycle continues.", "99-16–20": "Anita was shopping with her mother and enjoying it. Interestingly, both of them __16__ buying the same pair of jeans.\nAccording to a recent marketing study, young adults influence 88% of household clothing purchases. More often than not, those in their early twenties are the more __17__ consumers. There isn’t a brand or a trend that these young people are not aware of. That is why mothers who want to keep abreast of trends usually __18__ the experts－their daughters. This tells the retailers of the world that if you want to get into a mother’s __19__, you’ve got to win her daughter over first.\nWith a DJ playing various kinds of music rather than just rap, and a mix of clothing labels designed more for taste and fashion than for a precise age, department stores have managed to appeal to successful middle-aged women __20__ losing their younger customers. They have created a shopping environment where the needs of both mother and daughter are satisfied.", "99-21–25": "Onions can be divided into two categories: fresh onions and storage onions. Fresh onions are available __21__ yellow, red and white throughout their season, March through August. They can be __22__ by their thin, light-colored skin. Because they have a higher water content, they are typically sweeter and milder tasting than storage onions. This higher water content also makes __23__ easier for them to bruise. With its delicate taste, the fresh onion is an ideal choice for salads and other lightly-cooked dishes. Storage onions, on the other hand, are available August through April. __24__ fresh onions, they have multiple layers of thick, dark, papery skin. They also have an __25__ flavor and a higher percentage of solids. For these reasons, storage onions are the best choice for spicy dishes that require longer cooking times or more flavor.", "99-26–30": "Many people like to drink bottled water because they feel that tap water may not be safe, but is bottled water really any better?\nBottled water is mostly sold in plastic bottles and that’s why it is potentially health __26__. Processing the plastic can lead to the release of harmful chemical substances into the water contained in the bottles. The chemicals can be absorbed into the body and __27__ physical discomfort, such as stomach cramps and diarrhea.\nHealth risks can also result from inappropriate storage of bottled water. Bacteria can multiply if the water is kept on the shelves for too long or if it is exposed to heat or direct sunlight. __28__ the information on storage and shipment is not always readily available to consumers, bottled water may not be a better alternative to tap water.\nBesides these __29__ issues, bottled water has other disadvantages. It contributes to global warming. An estimated 2.5 million tons of carbon dioxide were generated in 2006 by the production of plastic for bottled water. In addition, bottled water produces an incredible amount of solid __30__. According to one research, 90% of the bottles used are not recycled and lie for ages in landfills.", "99-31–40": "Football is more than a sport; it is also an invaluable __31__. In teaching young players to cooperate with their fellows on the practice __32__, the game shows them the necessity of teamwork in society. It prepares them to be __33__ citizens and persons.\nWherever football is played, the players learn the rough-and-tumble lesson that only through the __34__ of each member can the team win. It is a lesson they must always __35__ on the field. Off the field, they continue to keep it in mind. In society, the former player does not look upon himself as a lone wolf who has the right to remain __36__ from the society and go his own way. He understands his place in the team; he knows he is a member of society and must __37__ himself as such. He realizes that only by cooperating can he do his __38__ in making society what it should be. The man who has played football knows that teamwork is __39__ in modern living. He is also aware that every citizen must do his part if the nation is to __40__. So he has little difficulty in adjusting himself to his role in family life and in the business world, and to his duties as a citizen.", "99-41–44": "On the island of New Zealand, there is a grasshopper-like species of insect that is found nowhere else on earth. New Zealanders have given it the nickname weta, which is a native Maori word meaning “god of bad looks.” It’s easy to see why anyone would call this insect a bad-looking bug. Most people feel disgusted at the sight of these bulky, slow-moving creatures.\nWetas are nocturnal creatures; they come out of their caves and holes only after dark. A giant weta can grow to over three inches long and weigh as much as 1.5 ounces. Giant wetas can hop up to two feet at a time. Some of them live in trees, and others live in caves. They are very long-lived for insects, and some adult wetas can live as long as two years. Just like their cousins grasshoppers and crickets, wetas are able to “sing” by rubbing their leg parts together, or against their lower bodies.\nMost people probably don’t feel sympathy for these endangered creatures, but they do need protecting. The slow and clumsy wetas have been around on the island since the times of the dinosaurs, and have evolved and survived in an environment where they had no enemies until rats came to the island with European immigrants. Since rats love to hunt and eat wetas, the rat population on the island has grown into a real problem for many of the native species that are unaccustomed to its presence, and poses a serious threat to the native weta population.", "99-45–48": "The high school prom is the first formal social event for most American teenagers. It has also been a rite of passage for young Americans for nearly a century.\nThe word “prom” was first used in the 1890s, referring to formal dances in which the guests of a party would display their fashions and dancing skills during the evening’s grand march. In the United States, parents and educators have come to regard the prom as an important lesson in social skills. Therefore, proms have been held every year in high schools for students to learn proper social behavior.\nThe first high school proms were held in the 1920s in America. By the 1930s, proms were common across the country. For many older Americans, the prom was a modest, home-grown affair in the school gymnasium. Prom-goers were well dressed but not fancily dressed up for the occasion: boys wore jackets and ties and girls their Sunday dresses. Couples danced to music provided by a local amateur band or a record player. After the 1960s, and especially since the 1980s, the high school prom in many areas has become a serious exercise in excessive consumption, with boys renting expensive tuxedos and girls wearing designer gowns. Stretch limousines were hired to drive the prom-goers to expensive restaurants or discos for an all-night extravaganza.\nWhether simple or lavish, proms have always been more or less traumatic events for adolescents who worry about self-image and fitting in with their peers. Prom night can be a dreadful experience for socially awkward teens or for those who do not secure dates. Since the 1990s, alternative proms have been organized in some areas to meet the needs of particular students. For example, proms organized by and for homeless youth were reported. There were also “couple-free” proms to which all students are welcome.", "99-49–52": "No budget for your vacation? Try home exchanges－swapping houses with strangers. Agree to use each other’s cars, and you can save bucks on car rentals, too.\nHome exchanges are not new. At least one group, Intervac, has been facilitating such an arrangement since 1953. But trading online is gaining popularity these days, with several sites in operation, including HomeExchanges. Founded in 1992, with some 28,000 listings, this company bills itself as the world’s largest home exchange club, reporting that membership has increased 30% this year.\nThe annual fee is usually less than US$100. Members can access thousands of listings for apartments, villas, suburban homes and farms around the world. Initial contact is made via e-mail, with subsequent communication usually by phone. Before a match is made, potential swappers tend to discuss a lot.\nHowever, the concept may sound risky to some people. What about theft? Damage? These are reasonable causes for concern, but equally unlikely. As one swapper puts it, “Nobody is going to fly across the ocean or drive 600 miles to come steal your TV. Besides, at the same time they’re staying in your home, you are staying in their home.”\nExchange sites recommend that swappers discuss such matters ahead of time. They may fill out an agreement spelling out who shoulders which responsibilities if a problem arises. It does not matter if the agreement would hold up in court, but it does give the exchangers a little satisfaction.\nGenerally, the biggest complaint among home exchangers has to do with different standards of cleanliness. Swappers are supposed to make sure their home is in order before they depart, but one person’s idea of “clean” may be more forgiving than another’s. Some owners say if they come back to a less-than-sparkling kitchen, it may be inconvenient but would not sour them on future exchanges.", "99-53–56": "Bekoji is a small town of farmers and herders in the Ethiopian highlands. There, time almost stands still, and horse-drawn carts outnumber motor vehicles. Yet, it has consistently yielded many of the world’s best distance runners.\nIt’s tempting, when breathing the thin air of Bekoji, to focus on the special conditions of the place. The town sits on the side of a volcano nearly 10,000 feet above sea level, making daily life a kind of high-altitude training. Children in this region often start running at an early age, covering great distances to fetch water and firewood or to reach the nearest school. Added to this early training is a physical trait shared by people there－disproportionately long legs, which is advantageous for distance runners.\nA strong desire burns inside Bekoji’s young runners. Take the case of Million Abate. Forced to quit school in fifth grade after his father died, Abate worked as a shoe-shine boy for years. He saw a hope in running and joined Santayehu Eshetu’s training program. This 18-year-old sprinted to the finish of a 12-mile run with his bare feet bleeding. The coach took off his own Nikes and handed them to him. To help Abate continue running, the coach arranged a motel job for him, which pays $9 a month.\nMost families in Bekoji live from hand to mouth, and distance running offers the younger generation a way out. Bekoji’s legend Derartu Tulu, who won the 10,000-meter Olympic gold medals in 1992 and 2000, is a national hero. As a reward, the government gave her a house. She also won millions of dollars in the races.\nMotivated by such signs of success, thousands of kids from the villages surrounding Bekoji have moved into town. They crowd the classrooms at Bekoji Elementary School, where Eshetu works as a physical-education instructor. All these kids share the same dream: Some day they could become another Derartu Tulu.", "98-16–20": "Art Fry was a researcher in the 3M Company. He was bothered by a small irritation every Sunday as he sang in the church choir. That is, after he __16__ his pages in the hymn book with small bits of paper, the small pieces would invariably fall out all over the floor. One day, an idea __17__ Art Fry. He remembered a kind of glue developed by a colleague that everyone thought __18__ a failure because it did not stick very well. He then coated the glue on a paper sample and found that it was not only a good bookmark, but it was great for writing notes. It would stay in place __19__ you wanted it to. Then you could remove it __20__ damage. The resulting product was called the Post-it, one of 3M’s most successful office products.", "98-21–25": "The pineapple, long a symbol of Hawaii, was not a native plant. __21__, pineapples did not appear there until 1813. The pineapple was __22__ found in Paraguay and in the southern part of Brazil. Natives planted the fruit across South and Central America and in the Caribbean region, __23__ Christopher Columbus first found it. Columbus brought it, along with many other new things, back to Europe with him. From there, the tasty fruit __24__ throughout other parts of civilization. It was carried on sailing ships around the world because it was found to help prevent scurvy, a disease that often __25__ sailors on long voyages. It was at the end of one of these long voyages that the pineapple came to Hawaii to stay.", "98-26–30": "The Paralympics are Olympic-style games for athletes with a disability. They were organized for the first time in Rome in 1960. In Toronto in 1976, the idea of putting together different disability groups __26__ sports competitions was born. Today, the Paralympics are sports events for athletes from six different disability groups. They emphasize the participants’ athletic achievements __27__ their physical disability. The games have grown in size gradually. The number of athletes __28__ in the Summer Paralympic Games has increased from 400 athletes from 23 countries in 1960 to 3,806 athletes from 136 countries in 2004.\nThe Paralympic Games have always been held in the same year as the Olympic Games. Since the Seoul 1988 Paralympic Games and the Albertville 1992 Winter Paralympic Games, they have also __29__ in the same city as the Olympics. On June 19, 2001, an agreement was signed between the International Olympic Committee and the International Paralympics Committee to keep this __30__ in the future. From the 2012 bid onwards, the city chosen to host the Olympic Games will also host the Paralympics.", "98-31–40": "Familiar fables can be narrated differently or extended in interesting and humorous ways. The end of the famous fable of “The Tortoise and the Hare” is well known to all: the tortoise wins the race against the hare. The moral lesson is that slow and steady wins the race. We all have grown up with this popular version, but the __31__ fable can be extended with different twists. At the request of the hare, a second race is __32__ and this time, the hare runs without taking a rest and wins. The moral lesson is that __33__ and consistent will always beat slow and steady. Then it is the tortoise that __34__ the hare to a third race along a different route in which there is a river just before the final destination. This time, the tortoise wins the race because the hare cannot swim. The moral lesson is “First __35__ your strengths, and then change the playing field to suit them.”\nBut the story continues. Both __36__ know their own drawbacks and limitations very well; therefore, they jointly decide to have one last race—not to decide who the winner or loser is, but just for their own pleasure and satisfaction. The two __37__ as a team. Firstly, the hare carries the tortoise on its back to the river. Then, the tortoise carries the hare and swims to the __38__ bank of the river. Lastly, the hare carries the tortoise again on its back. Thus they reach the __39__ line together. Overall, many moral lessons from the last match are highlighted. The most obvious one is the importance of __40__. Another moral which also means a great deal is “competition against situations rather than against rivals.”", "98-41–44": "To Whom It May Concern:\nYour address was forwarded to us by Why Bother Magazine. All of us here think The International Institute of Not Doing Much is the best organization in the world. You know how to avoid unnecessary activities!\nWe closely followed the advice in your article. First, we replaced all our telephones with carrier pigeons. Simply removing the jingle of telephones and replacing them with the pleasant sounds of birds has had a remarkable effect on everyone. Besides, birds are cheaper than telephone service. After all, we are a business. We have to think of the bottom line. As a side benefit, the birds also fertilize the lawn outside the new employee sauna.\nNext, we sold the computers off to Stab, Grab, Grit, and Nasty, a firm of lawyers nearby. Our electricity bill went way down. Big savings! The boss is impressed. We have completely embraced paper technology. Now that we all use pencils, doodling is on the increase, and the quality of pencilwomanship is impressive, as you can tell from my handwriting in this letter. By the way, if you can, please send this letter back to us. We can erase and reuse it. Just tie it to Maggie’s leg and she’ll know where to take it.\nNow it’s very calm and quiet here. You can notice the difference. No more loud chatter on the telephones! All we hear is the scratching of pencil on paper, the sound of pigeons, and the delivery of inter-office correspondence by paper airplane.\nWonderful! I’ve always wanted to work for an insurance company ever since I was a little girl. Now it’s perfect.\nSincerely yours,\nEleanor Lightly\nSpokeswoman and Company Hair Stylist\nABC Activity Insurance: Insure against overdoing it", "98-45–48": "The Galápagos Islands are the Pacific island paradise where Darwin’s theory of evolution was born. They are places filled with giant tree lizards, sandy beaches, and tropical plants. Now they will be famous for one more thing: the world’s first green airport.\nThis group of islands off the coast of Ecuador has recently contracted Argentine Corporación America to manage the redevelopment of the airport on the island of Baltra. It is estimated that US$20 million is needed to complete the project by 2009. The new development has several important features: use of wind and solar energy, passive heating and cooling systems, as well as concrete runways in place of asphalt, which has a greater carbon footprint during its production cycle. This new development couldn’t be coming at a better time for the Galápagos, which were added to an environmental “danger list” in 2007.\nPacific islands like the Galápagos, Easter Island, and Tahiti, have economies that are driven almost completely by tourism. However, some people think these are “unsustainable models of development.” The number of visitors to the Galápagos rose more than 250% from 1990 to 2006, while the number of commercial flights to the area rose 193% from 2001 to 2006. These increases put great stress on the islands’ resources and environment. Air travel is especially criticized for exhausting natural resources and causing environmental damage. Thus, efforts are being made to reduce the environmental impact of the tourism industry. The greening of airports is just one of these attempts.", "98-49–52": "According to popular folklore, many animals are smarter than they appear. Dogs bark before earthquakes; cattle predict rainfall by sitting on the ground. But cattle may have another hidden talent in telling which way is north.\nSmall animals such as mole rats living underground are known for the use of magnetism to navigate. Dr. Begall and her colleagues wanted to know whether larger mammals also have the ability to perceive magnetic fields. They investigated this possibility by studying images of thousands of cattle captured on Google Earth, a website that stitches together satellite photographs to produce an image of the Earth’s surface.\nGrazing animals are known to orient themselves in a way that minimizes wind chill from the north and maximizes the warmth of the sun when they are cold. The researchers therefore had to study a lot of cows grazing in lots of different places at different times of day, in order to average out these factors and see whether cattle could act like compass needles.\nThe researchers concluded that cattle do generally orient themselves in a north-south direction. This north-south preference has also been noted in flies, termites and honeybees. But unfortunately, even the high resolution of Google Earth is not powerful enough to tell which end of the cow is its head, and which its tail. The researchers were therefore unable to answer their research questions of whether cattle prefer to look north or south, and whether that differs in the northern and southern hemispheres.", "98-53–56": "Children normally have a distrust of new foods. But it’s the parents’ job to serve a variety of foods and expose their children to healthy dieting habits.\nSome simple strategies can help even the pickiest eater learn to like a more varied diet. First of all, you don’t have to send children out of the kitchen. With hot stoves, boiling water and sharp knives at hand, it is understandable that parents don’t want children in the kitchen when they’re making dinner. But studies suggest that involving children in meal preparation is an important first step in getting them to try new foods. In one study, nearly 600 children from kindergarten to sixth grade took part in a nutrition curriculum intended to get them to eat more vegetables and whole grains. The researchers found that children who had cooked their own foods were more likely to eat those foods in the cafeteria than children who had not. Kids don’t usually like radishes, but if kids cut them up and put them in the salad, they will love the dish.\nAnother strategy is not to diet in front of your children. Kids are tuned into their parents’ eating preferences and are far more likely to try foods if they see their mother or father eating them. Given this powerful effect, parents who are trying to lose weight should be careful of how their dieting habits can influence a child’s perceptions about food and healthful eating. In one study of 5-year-old girls about dieting, one child noted that dieting involved drinking chocolate milkshakes, because her mother was using Slim-Fast drinks. Another child said dieting meant “you fix food but you don’t eat it.” By exposing young children to erratic dieting habits, parents may be putting them at risk for eating disorders.", "97-16–20": "What is so special about green tea? The Chinese and Indians __16__ it for at least 4,000 years to treat everything from headache to depression. Researchers at Purdue University recently concluded that a compound in green tea __17__ the growth of cancer cells. Green tea is also helpful __18__ infection and damaged immune function. The secret power of green tea is its richness in a powerful anti-oxidant.\nGreen tea and black tea come from the same plant. Their __19__ is in the processing. Green tea is dried but not fermented, and this shorter processing gives it a lighter flavor than black tea. It also helps retain the tea’s beneficial chemicals. That is __20__ green tea is so good for health. The only reported negative effect of drinking green tea is a possible allergic reaction and insomnia due to the caffeine it contains.", "97-21–25": "A wise woman traveling in the mountains found a precious stone. The next day she met another traveler who was hungry. The wise woman generously opened her bag to __21__ her food with the traveler. When the hungry traveler saw the precious stone, he asked her to give it to him. The woman did __22__ without hesitation. The traveler left, rejoicing. If he sold the stone, he thought, he __23__ enough money for the rest of his life. But in a few days he came back to find the woman. When he found her, he said, “I know how valuable this stone is, but I’m giving it back to you, __24__ that you can give me something even more precious. You gave me the stone without asking for anything __25__. Please teach me what you have in your heart that makes you so generous.”", "97-26–30": "Prague, the capital of the Czech Republic, is a very beautiful city. Situated on both banks of the winding River Vltava, Prague is like one big open-air museum. __26__ some six hundred years of architecture nearly untouched by natural disaster or war, the city retains much of its medieval appearance. __27__ you go, there are buildings in Romanic, Baroque, and Rococo styles that were popular hundreds of years ago. All of them successfully __28__ the destruction of postwar redevelopment and remained unchanged. While the Iron Curtain was still in place under the communist government, Prague was __29__ visited by foreigners. Since the 1990s, __30__, all that has changed. Prague is now one of the most popular tourist attractions in Europe.", "97-31–40": "One day, a guru foresaw in a vision what he would be in his next life. Then he called his favorite disciple and asked him, “What would you do to thank me for all you have received from me?” The disciple said he would do whatever his guru asked him to do. Having received this __31__, the guru said, “Then this is what I’d like you to do for me. I’ve just __32__ that I’ll die very soon and I’m going to be reborn as a pig. Do you see that sow eating garbage there in the yard? I’m going to be the fourth piglet of its next litter. You’ll __33__ me by a mark on my brow. After that sow gives birth, find the fourth piglet with a mark on its brow and, with one __34__ of your knife, slaughter it. I’ll then be __35__ from a pig’s life. Will you do this for me?”\nThe disciple felt sad to hear this, but he agreed to do as he was told. Soon after their __36__, the guru died and the sow did have a litter of four little pigs. Then the disciple __37__ his knife and picked out the little pig with a mark on its brow. When he was about to cut its throat, the little pig suddenly __38__, “Stop!” Before the disciple could recover from the __39__ of hearing the little pig speak in a human voice, it continued, “Don’t kill me. I want to live on as a pig. When I asked you to kill me, I didn’t know what a pig’s life would be __40__. It’s great! Just let me go.”", "97-41–44": "Howler monkeys are named for the long loud cries, or howls, that they make every day. They are the loudest land animal and their howls can be heard three miles away through dense forests. Male howler monkeys use their loud voices to fight for food, mates, or territory. Everyone starts and ends the day by howling to check out where their nearest competitors are.\nInterestingly, when there are few howler monkeys in an area, the howling routine takes on a different pattern. In Belize, where howler monkeys were newly reintroduced into a wildlife sanctuary, the howler monkeys were heard only a few times a week rather than every day. Apparently, with plenty of space and no other howler monkeys around, there was no need to check on the whereabouts of their competitors. At the sanctuary, keepers now use recorded howler sounds from a distance so that the monkeys feel the need to make the territorial calls as they would do in the wild. In the future when the population grows, there will be no need for the recording because the howler monkeys will have more reason to check in with the neighbors to define their own territories.", "97-45–48": "After the creation of the Glacier National Park in Montana, the growing number of park visitors increased the need for roads. Eventually, the demand for a road across the mountains led to the building of the Going-to-the-Sun Road.\nThe construction of the Going-to-the-Sun Road was a huge task. After 11 years of work, the final section of the road was completed in 1932. The road is considered an engineering feat. Even today, visitors to the park marvel at how such a road could have been built. It is one of the most scenic roads in North America. The construction of the road has changed the way visitors experience the Glacier National Park. Visitors now can drive over sections of the park that previously took days of horseback riding to see.\nJust across the border, in Canada, is the Waterton Lakes National Park. In 1931, members of the Rotary Clubs of Alberta and Montana suggested joining the two parks as a symbol of peace and friendship between the two countries. In 1932, the United States and Canadian governments renamed the parks the Waterton-Glacier International Peace Park, the world’s first. More recently, the parks have received several international honors. They were named as a World Heritage Site in 1995. This international recognition highlights the importance of this area, not just to the United States and Canada, but to the entire world.", "97-49–52": "Ice sculpting is a difficult process. First, ice must be carefully selected so that it is suitable for sculpting. Its ideal material is pure, clean water with high clarity. It should also have the minimum amount of air bubbles. Perfectly clear ice blocks weighing 140 kg and measuring 100 cm × 50 cm × 25 cm are available from the Clinebell Company in Colorado. Much larger clear blocks are produced in Europe and Canada or harvested from a frozen river in Sweden. These large ice blocks are used for large ice sculpting events and for building ice hotels.\nAnother difficulty in the process of ice sculpting is time control. The temperature of the environment affects how quickly the piece must be completed to avoid the effects of melting. If the sculpting does not take place in a cold environment, then the sculptor must work quickly to finish his piece. The tools used for sculpting also affect when the task can be accomplished. Some sculptures can be completed in as little as ten minutes if power tools are used. Ice sculptors also use razor-sharp chisels that are specifically designed for cutting ice. The best ice chisels are made in Japan, a country that, along with China, has a long tradition of magnificent ice sculptures.\nIce sculptures are used as decorations in some cuisines, especially in Asia. When holding a dinner party, some large restaurants or hotels will use an ice sculpture to decorate the table. For example, in a wedding banquet it is common to see a pair of ice-sculpted swans that represent the union of the new couple.", "97-53–56": "If you touch your finger to a hot stove, you know it’s going to hurt. However, if you convince yourself beforehand that the pain won’t be so bad, you might not suffer as much. According to a recent study, the part of your brain that reacts to severe pain is largely the same part that reacts to expectation of pain.\nResearchers in this study worked with 10 volunteers, ages 24 to 46. Each volunteer wore a device that gave out 20-second-long pulses of heat to the right leg. There were three levels of heat, producing mild, moderate, or strong pain. During training, the volunteers would first hear a tone, followed by a period of silence, and then feel a heat pulse. They then learned to associate the length of the silent pause with the intensity of the upcoming heat pulse. The longer the pause, the stronger the heat pulse would be, causing more severe pain.\nA day or two later, the real experiment began. The researchers found that the parts of the brain involved in learning, memory, emotion, and touch became more active as the volunteers expected higher levels of pain. These were mainly the same areas that became active when participants actually felt pain. Interestingly, when the volunteers expected only mild or moderate pain but experienced severe pain, they reported feeling 28 percent less pain than when they expected severe pain and actually got it.\nThe new study emphasizes that pain has both physical and psychological elements. Understanding how pain works in the mind and brain could eventually give doctors tools for helping people cope with painful medical treatments."};window.QUIZ_CONFIG={"title": "學測英文歷屆試題｜97–115 年選擇題", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　The mayor has such a ______ schedule that it takes weeks to arrange an interview with her.", "options": ["hasty", "tight", "diligent", "routine"], "answer": 1, "answerLabel": "B", "source": "115 學測｜詞彙｜第 1 題", "explanation": "要花好幾週才能安排訪談，表示市長行程非常「緊湊」：a tight schedule（固定搭配）。hasty 匆忙的、diligent 勤奮的、routine 例行的。", "explanationSource": "own", "section": "115年"}, {"id": 2, "question": "第 2 題　Jane started as an ______ art designer, but now she has a professional studio of her own.", "options": ["official", "instant", "amateur", "elementary"], "answer": 2, "answerLabel": "C", "source": "115 學測｜詞彙｜第 2 題", "explanation": "一開始是「業餘」設計師，現在有自己的專業工作室：amateur，與 professional 對比。official 官方的、instant 即時的、elementary 基礎的。", "explanationSource": "own", "section": "115年"}, {"id": 3, "question": "第 3 題　The teaching ______ at the famous high school soon attracted more than a dozen well-qualified applicants.", "options": ["career", "vacancy", "expectation", "inspiration"], "answer": 1, "answerLabel": "B", "source": "115 學測｜詞彙｜第 3 題", "explanation": "教職「空缺」吸引十多位合格申請者：vacancy。career 職涯、expectation 期望、inspiration 靈感。", "explanationSource": "own", "section": "115年"}, {"id": 4, "question": "第 4 題　Designed by a young engineer, the new product has created far more profit than ______ expected.", "options": ["initially", "genuinely", "alternatively", "fundamentally"], "answer": 0, "answerLabel": "A", "source": "115 學測｜詞彙｜第 4 題", "explanation": "獲利遠超過「最初」預期：than initially expected。genuinely 真誠地、alternatively 或者、fundamentally 根本上。", "explanationSource": "own", "section": "115年"}, {"id": 5, "question": "第 5 題　It has been confirmed that a balanced ______ of fruit and vegetables is a key element to good health.", "options": ["dimension", "integration", "provision", "consumption"], "answer": 3, "answerLabel": "D", "source": "115 學測｜詞彙｜第 5 題", "explanation": "均衡「攝取」蔬果是健康關鍵：consumption。dimension 面向、integration 整合、provision 供應。", "explanationSource": "own", "section": "115年"}, {"id": 6, "question": "第 6 題　As a shy boy afraid of making public appearances, Timmy ______ the thought of speaking before large audiences.", "options": ["dreads", "stresses", "wanders", "escapes"], "answer": 0, "answerLabel": "A", "source": "115 學測｜詞彙｜第 6 題", "explanation": "害羞的男孩「害怕」在大眾面前說話的念頭：dreads。stress 強調、wander 徘徊、escape 逃離。", "explanationSource": "own", "section": "115年"}, {"id": 7, "question": "第 7 題　To the newly-crowned winner of the piano competition, music is his life’s ______, which he has devoted himself to whole-heartedly.", "options": ["resource", "impact", "passion", "emphasis"], "answer": 2, "answerLabel": "C", "source": "115 學測｜詞彙｜第 7 題", "explanation": "音樂是他一生的「熱情」所在，全心投入：passion。resource 資源、impact 影響、emphasis 強調。", "explanationSource": "own", "section": "115年"}, {"id": 8, "question": "第 8 題　The drunk driver who shouted at passers-by and ______ them with glass bottles was quickly arrested by the police.", "options": ["shattered", "assaulted", "overturned", "condemned"], "answer": 1, "answerLabel": "B", "source": "115 學測｜詞彙｜第 8 題", "explanation": "酒駕者對路人大叫並用玻璃瓶「攻擊」他們：assaulted。shatter 打碎、overturn 翻覆、condemn 譴責。", "explanationSource": "own", "section": "115年"}, {"id": 9, "question": "第 9 題　There were so many people at the bus station that I had to ______ my way through the crowd to board the bus in time.", "options": ["crash", "tumble", "elbow", "struggle"], "answer": 2, "answerLabel": "C", "source": "115 學測｜詞彙｜第 9 題", "explanation": "人太多，只能「用手肘推擠」穿過人群：elbow one’s way through。crash 撞、tumble 跌倒、struggle 掙扎（不接 one’s way）。", "explanationSource": "own", "section": "115年"}, {"id": 10, "question": "第 10 題　Deadly shootings on US campuses have raised ______ concerns about how to prevent such tragic incidents from happening again.", "options": ["swift", "brutal", "harsh", "grave"], "answe tentment, while a forced smile suggests underlying distress.", "In fact, there is a well-known Russian proverb that goes, “Smiling with no reason is a sign of stupidity.”"], "answer": 0, "answerLabel": "A", "source": "115 學測｜篇章結構｜第 33 題", "explanation": "前句談個人主義高、人口少的國家笑得多，後句說來自世界各地的新移民笑得更多。(A)「另一個關鍵因素是社會的移民多樣性」引出移民這個新因素。", "explanationSource": "own", "section": "115年"}, {"id": 34, "question": "【篇章結構 第 31–34 題】\n@@115-31–34@@\n\n▶ 第 34 題　請選出最適合放入 __34__ 的句子", "options": ["Another crucial factor is a society’s immigration diversity.", "Various factors have thus contributed to the phenomenon of smiling.", "For most of recorded human history, the open smile has been deeply unfashionable.", "A genuine smile indicates contentment, while a forced smile suggests underlying distress.", "In fact, there is a well-known Russian proverb that goes, “Smiling with no reason is a sign of stupidity.”"], "answer": 1, "answerLabel": "B", "source": "115 學測｜篇章結構｜第 34 題", "explanation": "全文結尾段開頭，後句說心理學家指出這個簡單手勢其實比表面複雜得多。(B)「因此，各種因素共同造就了微笑這個現象」總結前面的歷史、文化、移民等因素。", "explanationSource": "own", "section": "115年"}, {"id": 35, "question": "【閱讀測驗 第 35–38 題】\n@@115-35–38@@\n\n▶ 第 35 題　What is this passage mainly about?", "options": ["A renowned Antarctic explorer.", "The extreme weather in Antarctica.", "A challenging voyage to Antarctica.", "The amazing discovery of a sunken ship."], "answer": 2, "answerLabel": "C", "source": "115 學測｜閱讀測驗｜第 35 題", "explanation": "全文主體（第二至五段）敘述 Shackleton 遠征南極、船被冰困、求援獲救的艱難航程。(C)。(D) 只是開頭與結尾的引子。", "explanationSource": "own", "section": "115年"}, {"id": 36, "question": "【閱讀測驗 第 35–38 題】\n@@115-35–38@@\n\n▶ 第 36 題　Which of the following idioms is closest in meaning to “exacerbated the situation” in the third paragraph?", "options": ["Broke the ice.", "Cost an arm and a leg.", "Missed the boat.", "Added fuel to the fire."], "answer": 3, "answerLabel": "D", "source": "115 學測｜閱讀測驗｜第 36 題", "explanation": "exacerbate 使惡化：冰水灌入讓情況更糟——add fuel to the fire 火上加油。(D)。break the ice 打破僵局、cost an arm and a leg 非常昂貴、miss the boat 錯失良機。", "explanationSource": "own", "section": "115年"}, {"id": 37, "question": "【閱讀測驗 第 35–38 題】\n@@115-35–38@@\n\n▶ 第 37 題　According to the passage, which of the following is true about Shackleton and his Antarctic expedition?", "options": ["His journey lasted more than two years.", "He was the first man to cross over the Antarctic.", "His team camped out on Elephant Island for five months.", "He sent five crew members on a lifeboat to get help from a whaling station."], "answer": 0, "answerLabel": "A", "source": "115 學測｜閱讀測驗｜第 37 題", "explanation": "1914 年 8 月 4 日出發，1916 年 8 月 30 日救出全員——超過兩年。(A)。(B) 錯：未完成橫越；(C) 錯：在浮冰上紮營五個月；(D) 錯：他帶五名船員「親自」去求援。", "explanationSource": "own", "section": "115年"}, {"id": 38, "question": "【閱讀測驗 第 35–38 題】\n@@115-35–38@@\n\n▶ 第 38 題　Which of the following shows the correct route of the Endurance after leaving South Georgia?", "options": ["圖 (A)", "圖 (B)", "圖 (C)", "圖 (D)"], "answer": 2, "answerLabel": "C", "source": "115 學測｜閱讀測驗｜第 38 題", "explanation": "第三、四段：離開南喬治亞島後被冰困住，「慢慢向南漂，再被冰推向北」，在 Weddell Sea 沉沒，船員再乘救生艇到 Elephant Island——先南後北、終點在島上的圖 (C)。", "explanationSource": "own", "section": "115年", "image": "assets/q38-115-endurance-route-options.png?v=20261120-6"}, {"id": 39, "question": "【閱讀測驗 第 39–42 題】\n@@115-39–42@@\n\n▶ 第 39 題　Which question can the passage answer?", "options": ["Where was the first spiral staircase constructed?", "Who was the first designer of the spiral staircase?", "What is the world’s most famous spiral staircase?", "Why is the spiral staircase popular in modern times?"], "answer": 3, "answerLabel": "D", "source": "115 學測｜閱讀測驗｜第 39 題", "explanation": "最後一段：永恆的古典設計魅力使螺旋梯成為豪宅、辦公室與公共建築的熱門元素——回答它為何在現代受歡迎。(D)。(A) 文中只說最古老「仍存在」的在羅馬。", "explanationSource": "own", "section": "115年"}, {"id": 40, "question": "【閱讀測驗 第 39–42 題】\n@@115-39–42@@\n\n▶ 第 40 題　What does “them” in the third paragraph refer to?", "options": ["Stairs.", "Confines.", "Attackers.", "Defenders."], "answer" ce.", "Ancient India.", "East-orientation of maps."], "answer": 3, "answerLabel": "D", "source": "115 學測｜閱讀測驗｜第 44 題", "explanation": "Though there is no physical evidence to support this：this 指前句「古印度地圖最可能以東方為上」。(D)。", "explanationSource": "own", "section": "115年"}, {"id": 45, "question": "【閱讀測驗 第 43–46 題】\n@@115-43–46@@\n\n▶ 第 45 題　Which of the following is closest in meaning to “a blip” in the last paragraph?", "options": ["A temporary state.", "An urgent need.", "A critical decision.", "An advanced system."], "answer": 0, "answerLabel": "A", "source": "115 學測｜閱讀測驗｜第 45 題", "explanation": "blip 短暫的異常、小插曲：作者說北方在上「不是規則，只是一段小插曲」，因為現在又回到以自己為中心。(A)。", "explanationSource": "own", "section": "115年"}, {"id": 46, "question": "【閱讀測驗 第 43–46 題】\n@@115-43–46@@\n\n▶ 第 46 題　Which of the following statements is true?", "options": ["Sailors took the North Star as their final destination.", "The GPS system has a fixed direction for orientation.", "South was placed at the top of maps in the pre-Biblical era.", "Old Islamic maps put south at the top for religious purposes."], "answer": 3, "answerLabel": "D", "source": "115 學測｜閱讀測驗｜第 46 題", "explanation": "第三段：阿拉伯地圖南方在上，是因為早期穆斯林住在麥加以北，這樣信徒就像抬頭望向聖城——宗教因素。(D)。(C) 錯：聖經時代是東方在上。", "explanationSource": "own", "section": "115年"}, {"id": 47, "question": "第 1 題　If you put a ______ under a leaking faucet, you will be surprised at the amount of water collected in 24 hours.", "options": ["border", "timer", "container", "marker"], "answer": 2, "answerLabel": "C", "source": "114 學測｜詞彙｜第 1 題", "explanation": "在漏水的水龍頭下放「容器」，24 小時收集到的水量驚人：container。border 邊界、timer 計時器、marker 標記。", "explanationSource": "own", "section": "114年"}, {"id": 48, "question": "第 2 題　The local farmers’ market is popular as it offers a variety of fresh seasonal ______ to people in the community.", "options": ["produce", "fashion", "brand", "trend"], "answer": 0, "answerLabel": "A", "source": "114 學測｜詞彙｜第 2 題", "explanation": "農夫市集提供各種新鮮當季「農產品」：produce（名詞，農產品）。fashion 時尚、brand 品 ource": "own", "section": "113年"}, {"id": 130, "question": "【閱讀測驗 第 35–38 題】\n@@113-35–38@@\n\n▶ 第 38 題　Which of the following fields is NOT mentioned for Velcro uses in the passage?", "options": ["Civil engineering.", "Aerospace industry.", "Medical technology.", "Sports and recreation."], "answer": 0, "answerLabel": "A", "source": "113 學測｜閱讀測驗｜第 38 題", "explanation": "文中提到運動器材、NASA 太空設備、血壓計袖帶與手術衣、人工心臟；沒有土木工程。(A)。", "explanationSource": "own", "section": "113年"}, {"id": 131, "question": "【閱讀測驗 第 39–42 題】\n@@113-39–42@@\n\n▶ 第 39 題　What can we learn from the passage?", "options": ["How national parks around the world were established.", "How Yellowstone’s natural features were formed.", "Why Moran’s family moved to the United States.", "Why Moran started painting Yellowstone."], "answer": 3, "answerLabel": "D", "source": "113 學測｜閱讀測驗｜第 39 題", "explanation": "第二段末：他讀到 Langford 描述的奇景後「渴望親眼看看這片奇特的土地」，第三段說明他隨考察隊前往作畫——為什麼開始畫黃石。(D)。", "explanationSource": "own", "section": "113年"}, {"id": 132, "question": "【閱讀測驗 第 39–42 題】\n@@113-39–42@@\n\n▶ 第 40 題　Why does the author use “the blackened heart” in paragraph 2 to describe Moran’s hometown?", "options": ["The place was severely polluted.", "The town was filled with darkened holes.", "There were many evil-hearted industry owners.", "The laborers mostly wore dark and dirty uniforms."], "answer": 0, "answerLabel": "A", "source": "113 學測｜閱讀測驗｜第 40 題", "explanation": "後文說主街是「黑暗、難看的洞」，河水骯髒——工業革命重鎮污染嚴重。(A)。", "explanationSource": "own", "section": "113年"}, {"id": 133, "question": "【閱讀測驗 第 39–42 題】\n@@113-39–42@@\n\n▶ 第 41 題　Which of the following statements is true about the Yellowstone National Park?", "options": ["Its establishment was proposed by Langford.", "Americans knew little about its beauty before the 1870s.", "The government project was started due to its rich natural resources.", "It was the only national park established because of Moran’s works."], "answer": 1, "answerLabel": "B", "source": "113 學測｜閱讀測驗｜第 41 題", "explanation": "第四段：Moran 到之前，黃石在大眾想像中是有熱水與蒸氣從地獄般洞口冒出的蠻荒之地，之後才被視為如畫的仙境——1870 年代前美國人不了解它的美。(B)。(D) 錯：他還畫了十多個後來成為國家公園的地方。", "explanationSource": "own", "section": "113年"}, {"id": 134, "question": "【閱讀測驗 第 39–42 題】\n@@113-39–42@@\n\n▶ 第 42 題　What can be inferred from the passage?", "options": ["Scribner’s Monthly was a magazine promoting national parks.", "Moran had visited Yellowstone before he started painting its landscapes.", "Color photos were not common when Moran started painting Yellowstone.", "Watercolor was the most popular form of landscape painting in the 19th century."], "answer": 2, "answerLabel": "C", "source": "113 學測｜閱讀測驗｜第 42 題", "explanation": "第三段：Moran 的水彩是該地區「最早的彩色描繪」，Jackson 拍的是照片——可推論當時彩色照片不普遍。(C)。", "explanationSource": "own", "section": "113年"}, {"id": 135, "question": "【閱讀測驗 第 43–46 題】\n@@113-43–46@@\n\n▶ 第 43 題　What is the primary goal of 100% Fish?", "options": ["To advance ocean technology.", "To reduce food crises worldwide.", "To enhance cross-industry cooperation.", "To make the most of marine resources."], "answer": 3, "answerLabel": "D", "source": "113 學測｜閱讀測驗｜第 43 題", "explanation": "第二段：鼓勵「完全利用」每條捕到的魚——充分利用海洋資源。(D)。", "explanationSource": "own", "section": "113年"}, {"id": 136, "question": "【閱讀測驗 第 43–46 題】\n@@113-43–46@@\n\n▶ 第 44 題　What does “this pioneering procedure” in the second paragraph refer to?", "options": ["100% Fish’s mission.", "Oddsson’s skin transplant.", "A fundamental change in seafood business.", "A new approach to protect the environment."], "answer": 1, "answerLabel": "B", "source": "113 學測｜閱讀測驗｜第 44 題", "explanation": "前句說 Oddsson 的魚皮移植是 100% Fish 計畫的成果，this pioneering procedure 就指這項移植手術。(B)。", "explanationSource": "own", "section": "113年"}, {"id": 137, "question": "【閱讀測驗 第 43–46 題】\n@@113-43–46@@\n\n▶ 第 45 題　Which of the following is true according to the passage?", "options": ["Iceland has increased their fish catch by 30% in the last 20 years.", "Petur Oddsson was an important member of the Icelandic project.", "Cross-field collaboration has proved to be very fruitful for 100% Fish.", "100% Fish is a big international enterprise marketing seafood products."], "answer": 2, "answerLabel": "C", "source": "113 學測｜閱讀測驗｜第 45 題", "explanation": "第四段：成功主要來自跨產業合作，透過分享知識開發出各種創新產品——跨領域合作成效豐碩。(C)。(A) 錯：是每條鱈魚多 30% 價值。", "explanationSource": "own", "section": "113年"}, {"id": 138, "question": "【閱讀測驗 第 43–46 題】\n@@113-43–46@@\n\n▶ 第 46 題　Here is a sentence: “Almost nothing of a fish is left for the trash bin.” Which paragraph is most suitable to have it as the final sentence?", "options": ["Paragraph 1.", "Paragraph 2.", "Paragraph 3.", "Paragraph 4."], "answer": 2, "answerLabel": "C", "source": "113 學測｜閱讀測驗｜第 46 題", "explanation": "第三段列舉魚皮、魚頭、魚骨、Omega-3 膠囊、狗零食等，說明幾乎 95% 都被利用——「幾乎沒有部分被丟進垃圾桶」最適合作為第三段結尾。(C)。", "explanationSource": "own", "section": "113年"}, {"id": 139, "question": "第 1 題　The bus driver often complains about chewing gum found under passenger seats because it is ______ and very hard to remove.", "options": ["sticky", "greasy", "clumsy", "mighty"], "answer": 0, "answerLabel": "A", "source": "112 學測｜詞彙｜第 1 題", "explanation": "口香糖很「黏」、難清除：sticky。greasy 油膩的、clumsy 笨拙的、mighty 強大的。", "explanationSource": "own", "section": "112年"}, {"id": 140, "question": "第 2 題　Jesse is a talented model. He can easily adopt an elegant ______ for a camera shoot.", "options": ["clap", "toss", "pose", "snap"], "answer": 2, "answerLabel": "C", "source": "112 學測｜詞彙｜第 2 題", "explanation": "模特兒能輕鬆做出優雅的「姿勢」：pose。clap 拍手、toss 拋、snap 快照。", "explanationSource": "own", "section": "112年"}, {"id": 141, "question": "第 3 題　In order to draw her family tree, Mary tried to trace her ______ back to their arrival in North America.", "options": ["siblings", "commuters", "ancestors", "instructors"], "answer": 2, "answerLabel": "C", "source": "112 學測｜詞彙｜第 3 題", "explanation": "畫家族樹要追溯「祖先」何時抵達北美：ancestors。sibling 兄弟姊妹、commuter 通勤者、instructor 教師。", "explanationSource": "own", "section": "112年"}, {"id": 142, "question": "第 4 題　Upon the super typhoon warning, Nancy rushed to the supermarket—only to find the shelves almost ______ and the stock nearly gone.", "options": ["blank", "bare", "hollow", "queer"], "answer": 1, "answerLabel": "B", "source": "112 學測｜詞彙｜第 4 題", "explanation": "超市貨架幾乎「空了」、存貨快沒了：bare 空的。blank 空白的、hollow 中空的、queer 奇怪的。", "explanationSource": "own", "section": "112年"}, {"id": 143, "question": "第 5 題　Even though Jack said “Sorry!” to me in person, I did not feel any ______ in his apology.", "options": ["liability", "generosity", "integrity", "sincerity"], "answer": 3, "answerLabel": "D", "source": "112 學測｜詞彙｜第 5 題", "explanation": "雖然當面說抱歉，卻感受不到任何「誠意」：sincerity。liability 責任、generosity 慷慨、integrity 正直。", "explanationSource": "own", "section": "112年"}, {"id": 144, "question": "第 6 題　My grandfather has astonishing powers of ______ . He can still vividly describe his first day at school as a child.", "options": ["resolve", "fraction", "privilege", "recall"], "answer": 3, "answerLabel": "D", "source": "112 學測｜詞彙｜第 6 題", "explanation": "能生動描述小時候上學第一天，表示「記憶力」驚人：powers of recall。resolve 決心、fraction 分數、privilege 特權。", "explanationSource": "own", "section": "112年"}, {"id": 145, "question": "第 7 題　Recent research has found lots of evidence to ______ the drug company’s claims about its “miracle” tablets for curing cancer.", "options": ["provoke", "counter", "expose", "convert"], "answer": 1, "answerLabel": "B", "source": "112 學測｜詞彙｜第 7 題", "explanation": "研究找到許多證據「反駁」藥廠的神奇藥丸說法：counter。provoke 激怒、expose 揭露、convert 轉變。", "explanationSource": "own", "section": "112年"}, {"id": 146, "question": "第 8 題　Corrupt officials and misguided policies have ______ the country’s economy and burdened its people with enormous foreign debts.", "options": ["crippled", "accelerated", "rendered", "ventured"], "answer": 0, "answerLabel": "A", "source": "112 學測｜詞彙｜第 8 題", "explanation": "貪腐官員與錯誤政策「重創」了國家經濟：crippled。accelerate 加速、render 使成為、venture 冒險。", "explanationSource": "own", "section": "112年"}, {"id": 147, "question": "第 9 題　As a record number of fans showed up for the baseball final, the highways around the stadium were ______ with traffic all day.", "options": ["choked", "disturbed", "enclosed", "injected"], "answer": 0, "answerLabel": "A", "source": "112 學測｜詞彙｜第 9 題", "explanation": "球迷人數創紀錄，公路整天「塞」滿車：choked with traffic。disturb 干擾、enclose 圍住、inject 注射。", "explanationSource": "own", "section": "112年"}, {"id": 148, "question": "第 10 題　Studies show that the ______ unbiased media are in fact often deeply influenced by political ideology.", "options": ["undoubtedly", "roughly", "understandably", "supposedly"], "answer": 3, "answerLabel": "D", "source": "112 學測｜詞彙｜第 10 題", "explanation": "「號稱」公正的媒體其實受政治意識形態影響：supposedly。undoubtedly 無疑地、roughly 大約、understandably 可理解地。", "explanationSource": "own", "section": "112年"}, {"id": 149, "question": "【綜合測驗 第 11–15 題】\n@@112-11–15@@\n\n▶ 第 11 題　請選出 __11__ 的最佳答案", "options": ["in no time", "by all means", "but not quite", "and pretty much"], "answer": 2, "answerLabel": "C", "source": "112 學測｜綜合測驗｜第 11 題", "explanation": "每根樹枝剛好長到幾乎碰到鄰樹，「但又沒碰到」：but not quite。in no time 立刻、by all means 務必、and pretty much 大致上。", "explanationSource": "own", "section": "112年"}, {"id": 150, "question": "【綜合測驗 第 11–15 題】\n@@112-11–15@@\n\n▶ 第 12 題　請選出 __12__ 的最佳答案", "options": ["universal", "productive", "conventional", "multiple"], "answer": 3, "answerLabel": "D", "source": "112 學測｜綜合測驗｜第 12 題", "explanation": "科學家提出「多種」解釋：multiple explanations。後文列舉不同研究者的看法。universal 普遍的、productive 有生產力的、conventional 傳統的。", "explanationSource": "own", "section": "112年"}, {"id": 151, "question": "【綜合測驗 第 11–15 題】\n@@112-11–15@@\n\n▶ 第 13 題　請選出 __13__ 的最佳答案", "options": ["get over", "compete for", "give way to", "make up for"], "answer": 1, "answerLabel": "B", "source": "112 學測｜綜合測驗｜第 13 題", "explanation": "植物和動物一樣會「爭奪」資源——養分、水、空間、光：compete for。get over 克服、give way to 讓步、make up for 彌補。", "explanationSource": "own", "section": "112年"}, {"id": 152, "question": "【綜合測驗 ent the circle of life."], "answer": 2, "answerLabel": "C", "source": "112 學測｜閱讀測驗｜第 36 題", "explanation": "第一段：古希臘的金屬圈不只是玩具，也是「運動器材」。(C)。(A) 錯：英國是造成背部脫臼等醫療紀錄；(D) 錯：生命之環是美洲原住民。", "explanationSource": "own", "section": "112年"}, {"id": 175, "question": "【閱讀測驗 第 35–38 題】\n@@112-35–38@@\n\n▶ 第 37 題　Which of the following is NOT mentioned as a way of enjoying hula hoop fun?", "options": ["Striking.", "Twirling.", "Spinning.", "Kicking."], "answer": 3, "answerLabel": "D", "source": "112 學測｜閱讀測驗｜第 37 題", "explanation": "文中提到 twirled、threw、jumped、slung、struck、roll、spun；沒有「踢」。(D)。", "explanationSource": "own", "section": "112年"}, {"id": 176, "question": "【閱讀測驗 第 35–38 題】\n@@112-35–38@@\n\n▶ 第 38 題　According to the passage, what materials have been used for making hoops?", "options": ["reed, grapevine, bamboo, plastic", "reed, grapevine, plastic, metal", "reed, bamboo, plastic, animal skin", "grapevine, plastic, metal, animal skin"], "answer": 1, "answerLabel": "B", "source": "112 學測｜閱讀測驗｜第 38 題", "explanation": "埃及：乾葡萄藤；希臘：金屬；美洲原住民：蘆葦；Wham-O：塑膠。(B)。", "explanationSource": "own", "section": "112年"}, {"id": 177, "question": "【閱讀測驗 第 39–42 題】\n@@112-39–42@@\n\n▶ 第 39 題　Why do farmers in Assam dig trenches in tea gardens?", "options": ["To protect tea trees.", "To trap elephants.", "To expand tea farms.", "To mark boundaries of tea gardens."], "answer": 0, "answerLabel": "A", "source": "112 學測｜閱讀測驗｜第 39 題", "explanation": "第二段：茶園地勢平坦，農民挖排水溝「防止積水傷害茶樹」。(A)。", "explanationSource": "own", "section": "112年"}, {"id": 178, "question": "【閱讀測驗 第 39–42 題】\n@@112-39–42@@\n\n▶ 第 40 題　Why are baby elephants easily injured in the Assam tea gardens according to the passage?", "options": ["They cannot find a safe shelter when climbing out of the trenches.", "They cannot locate the landmarks while trying to navigate forests.", "They are trapped by the sharp branches of the tea trees.", "They have difficulties moving around the uneven fields."], "answer": 3, "answerLabel": "D", "source": "112 學測｜
