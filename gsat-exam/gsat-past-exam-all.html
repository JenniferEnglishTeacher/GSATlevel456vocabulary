82, "question": "【閱讀測驗 第 43–46 題】\n@@112-43–46@@\n\n▶ 第 44 題　According to the passage, where is Zanzibar most likely located on the following map?", "options": ["A", "B", "C", "D"], "answer": 1, "answerLabel": "B", "source": "112 學測｜閱讀測驗｜第 44 題", "explanation": "第一句：位於坦尚尼亞外海、印度洋——東非海岸外的 B。(B)。", "explanationSource": "own", "section": "112年", "image": "assets/q44-112-zanzibar-map.png?v=20261120-6"}, {"id": 183, "question": "【閱讀測驗 第 43–46 題】\n@@112-43–46@@\n\n▶ 第 45 題　Which of the following can be inferred from the passage about Zanzibar?", "options": ["For centuries, Zanzibar has been a heaven for beach lovers.", "Cloves, vanilla, and cinnamon are common spices in Zanzibar.", "Besides spices, Zanzibar is well known for a great variety of jewelry.", "Vasco da Gama was Zanzibar’s first foreign ruler during the Age of Exploration."], "answer": 1, "answerLabel": "B", "source": "112 學測｜閱讀測驗｜第 45 題", "explanation": "最後一段：空氣中飄著丁香、香草與肉桂的香氣，可推論這些是當地常見香料。(B)。(C) jewels 是比喻島嶼，不是珠寶。", "explanationSource": "own", "section": "112年"}, {"id": 184, "question": "【閱讀測驗 第 43–46 題】\n@@112-43–46@@\n\n▶ 第 46 題　Which set of words is used in the passage to refer to Zanzibar?", "options": ["islands, settlements, posts, crossroads", "islands, posts, jewels, destination", "archipelago, islands, jewels, destination", "archipelago, settlements, paths, islands"], "answer": 2, "answerLabel": "C", "source": "112 學測｜閱讀測驗｜第 46 題", "explanation": "文中稱 Zanzibar 為 tropical archipelago、islands、popular beach destination、these jewels on the Indian Ocean；settlements/posts 指波斯人的聚落與貿易站。(C)。", "explanationSource": "own", "section": "112年"}, {"id": 185, "question": "第 1 題　When Jeffery doesn’t feel like cooking, he often orders pizza online and has it ______ to his house.", "options": ["advanced", "delivered", "offered", "stretched"], "answer": 1, "answerLabel": "B", "source": "111 學測｜詞彙｜第 1 題", "explanation": "線上訂披薩並請店家「送」到家：have it delivered（have + O + p.p.）。advance 前進、offer 提供、stretch 伸展。", "explanationSource": "own", "section": "111年"}, {"id": 186, "question": "第 2 題　Jane is the best ______ I have ever had. I cannot imagine running my office without her help.", "options": ["assistant", "influence", "contribution", "politician"], "answer": 0, "answerLabel": "A", "source": "111 學測｜詞彙｜第 2 題", "explanation": "沒有她的幫助無法經營辦公室，表示她是最好的「助理」：assistant。influence 影響、contribution 貢獻、politician 政治人物。", "explanationSource": "own", "section": "111年"}, {"id": 187, "question": "第 3 題　The temple celebrated Mazu Festival by hosting ten days of lion dances, Taiwanese operas, and traditional hand ______ shows.", "options": ["chat", "quiz", "puppet", "variety"], "answer": 2, "answerLabel": "C", "source": "111 學測｜詞彙｜第 3 題", "explanation": "媽祖慶典有舞獅、歌仔戲和傳統「布袋戲」：hand puppet shows。chat 聊天、quiz 問答、variety 綜藝。", "explanationSource": "own", "section": "111年"}, {"id": 188, "question": "第 4 題　The new vaccine was banned by the Food and Drug Administration due to its ______ fatal side effects.", "options": ["potentially", "delicately", "ambiguously", "optionally"], "answer": 0, "answerLabel": "A", "source": "111 學測｜詞彙｜第 4 題", "explanation": "疫苗因「可能」致命的副作用被禁：potentially fatal。delicately 精細地、ambiguously 模糊地、optionally 選擇性地。", "explanationSource": "own", "section": "111年"}, {"id": 189, "question": "第 5 題　______ the photos with dates and keywords help you sort them easily in your file.", "options": ["Tagging", "Flocking", "Rolling", "Snapping"], "answer": 0, "answerLabel": "A", "source": "111 學測｜詞彙｜第 5 題", "explanation": "為照片「加標籤」（日期與關鍵字）方便分類：Tagging。flock 聚集、roll 滾動、snap 拍照。", "explanationSource": "own", "section": "111年"}, {"id": 190, "question": "第 6 題　An ______ person is usually pleasant and easy to get along with, but don’t expect that he or she will always say “yes” to everything.", "options": ["enormous", "intimate", "agreeable", "ultimate"], "answer": 2, "answerLabel": "C", "source": "111 學測｜詞彙｜第 6 題", "explanation": "「和善的」人好相處，但不代表什麼都說好：agreeable。enormous 巨大的、intimate 親密的、ultimate 最終的。", "explanationSource": "own", "section": "111年"}, {"id": 191, "question": "第 7 題　Hidden deep in a small alley among various tiny shops, the entrance of the Michelin star restaurant is barely ______ to passersby.", "options": ["identical", "visible", "available", "remarkable"], "answer": 1, "answerLabel": "B", "source": "111 學測｜詞彙｜第 7 題", "explanation": "藏在小巷深處，餐廳入口對路人幾乎「看不見」：visible。identical 相同的、available 可取得的、remarkable 顯著的。", "explanationSource": "own", "section": "111年"}, {"id": 192, "question": "第 8 題　The original budget for my round-island trip was NT$5,000, but the ______ cost is likely to be 50 percent higher.", "options": ["moderate", "absolute", "promising", "eventual"], "answer": 3, "answerLabel": "D", "source": "111 學測｜詞彙｜第 8 題", "explanation": "原本預算五千，但「最終」花費可能高出 50%：eventual cost。moderate 適度的、absolute 絕對的、promising 有前景的。", "explanationSource": "own", "section": "111年"}, {"id": 193, "question": "第 9 題　After watching a TV program on natural history, Adam decided to go on a ______ for dinosaur fossils in South Dakota.", "options": ["trial", "route", "strike", "quest"], "answer": 3, "answerLabel": "D", "source": "111 學測｜詞彙｜第 9 題", "explanation": "決定去南達科他州「尋找」恐龍化石：go on a quest for。trial 試驗、route 路線、strike 罷工。", "explanationSource": "own", "section": "111年"}, {"id": 194, "question": "第 10 題　With pink cherry blossoms blooming everywhere, the valley ______ like a young bride under the bright spring sunshine.", "options": ["bounces", "blushes", "polishes", "transfers"], "answer": 1, "answerLabel": "B", "source": "111 學測｜詞彙｜第 10 題", "explanation": "粉色櫻花盛開，山谷像年輕新娘般「泛紅、羞紅」：blushes。bounce 彈跳、polish 擦亮、transfer 轉移。", "explanationSource": "own", "section": "111年"}, {"id": 195, "question": "【綜合測驗 第 11–15 題】\n@@111-11–15@@\n\n▶ 第 11 題　請選出 __11__ 的最佳答案", "options": ["initiated", "represented", "acknowledged", "manipulated"], "answer": 0, "answerLabel": "A", "source": "111 學測｜綜合測驗｜第 11 題", "explanation": "書鎮的概念由 Richard Booth「開創」：initiated。represent 代表、acknowledge 承認、manipulate 操控。", "explanationSource": "own", "section": "111年"}, {"id": 196, "question": "【綜合測驗 第 11–15 題】\n@@111-11–15@@\n\n▶ 第 12 題　請選出 __12__ 的最佳答案", "options": ["spring", "sprang", "had sprung", "have been springing"], "answer": 3, "answerLabel": "D", "source": "111 學測｜綜合測驗｜第 12 題", "explanation": "Since the 1970s 自 1970 年代以來，書鎮不斷出現：現在完成進行式 have been springing up。", "explanationSource": "own", "section": "111年"}, {"id": 197, "question": "【綜合測驗 第 11–15 題】\n@@111-11–15@@\n\n▶ 第 13 題　請選出 __13__ 的最佳答案", "options": ["form", "count", "end", "matter"], "answer": 2, "answerLabel": "C", "source": "111 學測｜綜合測驗｜第 13 題", "explanation": "書鎮都有很多書店，但相似之處「到此為止」：that’s where the similarities end。後文說各有特色。", "explanationSource": "own", "section": "111年"}, {"id": 198, "question": "【綜合測驗 第 11–15 題】\n@@111-11–15@@\n\n▶ 第 14 題　請選出 __14__ 的最佳答案", "options": ["trends", "releases", "agendas", "announcements"], "answer": 1, "answerLabel": "B", "source": "111 學測｜綜合測驗｜第 14 題", "explanation": "書談邀請作者討論最新「出版作品」：releases。trend 趨勢、agenda 議程、announcement 公告。", "explanationSource": "own", "section": "111年"}, {"id": 199, "question": "【綜合測驗 第 11–15 題】\n@@111-11–15@@\n\n▶ 第 15 題　請選出 __15__ 的最佳答案", "options": ["get their worldwide fame", "conform to the new mode", "make their visitors satisfied", "keep the printed word alive"], "answer": 3, "answerLabel": "D", "source": "111 學測｜綜合測驗｜第 15 題", "explanation": "數位閱讀改變閱讀方式，書鎮對「保存實體書」特別重要：keep the printed word alive。後文強調 preserving the physical book。", "explanationSource": "own", "section": "111年"}, {"id": 200, "question": "【綜合測驗 第 16–20 題】\n@@111-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["contrary to", "except for", "more of", "other than"], "answer": 3, "answerLabel": "D", "source": "111 學測｜綜合測驗｜第 16 題", "explanation": "圓窗設計的原因「不是」美觀：reasons other than aesthetics。contrary to 與…相反、except for 除了、more of 更多的。", "explanationSource": "own", "section": "111年"}, {"id": 201, "question": "【綜合測驗 第 16–20 題】\n@@111-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["used to be", "were to be", "would have been", "must have been"], "answer": 0, "answerLabel": "A", "source": "111 學測｜綜合測驗｜第 17 題", "explanation": "早期飛機窗戶「以前是」方形的：used to be。後文說後來因為方窗出事而改成圓窗。", "explanationSource": "own", "section": "111年"}, {"id": 202, "question": "【綜合測驗 第 16–20 題】\n@@111-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["disguised", "understood", "confronted", "intensified"], "answer": 3, "answerLabel": "D", "source": "111 學測｜綜合測驗｜第 18 題", "explanation": "高空內外壓差增大、壓力增加，問題「加劇」：intensified。disguise 偽裝、understand 理解、confront 面對。", "explanationSource": "own", "section": "111年"}, {"id": 203, "question": "【綜合測驗 第 16–20 題】\n@@111-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["cause conflict", "rebuild strength", "spell disaster", "endure shock"], "answer": 2, "answerLabel": "C", "source": "111 學測｜綜合測驗｜第 19 題", "explanation": "方窗四角反覆承受壓力可能「釀成災難」：spell disaster。cause conflict 引起衝突、rebuild strength 重建力量、endure shock 承受衝擊。", "explanationSource": "own", "section": "111年"}, {"id": 204, "question": "【綜合測驗 第 16–20 題】\n@@111-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["tolerate", "improve", "justify", "obtain"], "answer": 0, "answerLabel": "A", "source": "111 學測｜綜合測驗｜第 20 題", "explanation": "圓形更堅固、抗變形，因此能「承受」機內外極大的壓差：tolerate。improve 改善、justify 證明正當、obtain 獲得。", "explanationSource": "own", "section": "111年"}, {"id": 205, "question": "【文意選填 第 21–30 題】\n@@111-21–30@@\n\n▶ 第 21 題　請從 (A)–(J) 選出最適合 __21__ 的字（每個選項只用一次）", "options": ["possible", "sensation", "risky", "cost", "witnessed", "professional", "called for", "tried out", "necessity", "career"], "answer": 2, "answerLabel": "C", "source": "111 學測｜文意選填｜第 21 題", "explanation": "特技演員做的是對一般演員來說「太危險」的動作（跳樓、撞車、持械打鬥）：too risky for … to perform。(C) risky 危險的。", "explanationSource": "own", "section": "111年"}, {"id": 206, "question": "【文意選填 第 21–30 題】\n@@111-21–30@@\n\n▶ 第 22 題　請從 (A)–(J) 選出最適合 __22__ 的字（每個選項只用一次）", "options": ["possible", "sensation", "risky", "cost", "witnessed", "professional", "called for", "tried out", "necessity", "career"], "answer": 8, "answerLabel": "I", "source": "111 學測｜文意選填｜第 22 題", "explanation": "特技工作是「出於需要」而逐漸出現的：emerged out of necessity。後文說演員自己拍危險場面受傷，所以才需要特技人員。(I) necessity 必要性。", "explanationSource": "own", "section": "111年"}, {"id": 207, "question": "【文意選填 第 21–30 題】\n@@111-21–30@@\n\n▶ 第 23 題　請從 (A)–(J) 選出最適合 __23__ 的字（每個選項只用一次）", "options": ["possible", "sensation", "risky", "cost", "witnessed", "professional", "called for", "tried out", "necessity", "career"], "answer": 5, "answerLabel": "F", "source": "111 學測｜文意選填｜第 23 題", "explanation": "當時沒有「專業的」工作人員能表演特技：no professional crew members。(F) professional 專業的。", "explanationSource": "own", "section": "111年"}, {"id": 208, "question": "【文意選填 第 21–30 題】\n@@111-21–30@@\n\n▶ 第 24 題　請從 (A)–(J) 選出最適合 __24__ 的字（每個選項只用一次）", "options": ["possible", "sensation", "risky", "cost", "witnessed", "professional", "called for", "tried out", "necessity", "career"], "answer": 7, "answerLabel": "H", "source": "111 學測｜文意選填｜第 24 題", "explanation": "沒受過訓練的人在正式拍攝時才第一次「嘗試」：tried out things for the first time。(H) tried out 嘗試。", "explanationSource": "own", "section": "111年"}, {"id": 209, "question": "【文意選填 第 21–30 題】\n@@111-21–30@@\n\n▶ 第 25 題　請從 (A)–(J) 選出最適合 __25__ 的字（每個選項只用一次）", "options": ["possible", "sensation", "risky", "cost", "witnessed", "professional", "called for", "tried out", "necessity", "career"], "answer": 3, "answerLabel": "D", "source": "111 學測｜文意選填｜第 25 題", "explanation": "從錯誤中學習，而這些錯誤「使」有些人「付出」生命：which cost some their lives（cost + 人 + 代價）。(D) cost。", "explanationSource": "own", "section": "111年"}, {"id": 210, "question": "【文意選填 第 21–30 題】\n@@111-21–30@@\n\n▶ 第 26 題　請從 (A)–(J) 選出最適合 __26__ 的字（每個選項只用一次）", "options": ["possible", "sensation", "risky", "cost", "witnessed", "professional", "called for", "tried out", "necessity", "career"], "answer": 6, "answerLabel": "G", "source": "111 學測｜文意選填｜第 26 題", "explanation": "連續動作片受歡迎，「需要」專門的特技人員：called for the use of dedicated stunt people。(G) called for 需要。" d pray for their ancestors.", "Such festive activities are usually held in parks, temples, and other public places around Japan.", "Obon concludes with another bonfire, okuribi, lighting up the sky to see the ancestors’ spirits off.", "Originating from the Chinese Ghost Festival, this annual event has evolved into a time of family reunion."], "answer": 3, "answerLabel": "D", "source": "111 學測｜篇章結構｜第 31 題", "explanation": "空格前介紹盂蘭盆節是紀念亡者的節日，接著說節日持續四五天、大家返鄉與親人團聚。(D) 說明它源自中國中元節並演變成家族團聚的日子，承上啟下。", "explanationSource": "own", "section": "111年"}, {"id": 216, "question": "【篇章結構 第 31–34 題】\n@@111-31–34@@\n\n▶ 第 32 題　請選出最適合放入 __32__ 的句子", "options": ["Some people also visit the cemetery to clean up the family graves and pray for their ancestors.", "Such festive activities are usually held in parks, temples, and other public places around Japan.", "Obon concludes with another bonfire, okuribi, lighting up the sky to see the ancestors’ spirits off.", "Originating from the Chinese Ghost Festival, this annual event has evolved into a time of family reunion."], "answer": 0, "answerLabel": "A", "source": "111 學測｜篇章結構｜第 32 題", "explanation": "前句說迎火引導祖先回家，後句說在家中佛壇與寺廟供奉食物。(A)「有些人也會去墓地清理家族墳墓、祭拜祖先」屬於同一系列的祭祖活動，用 also 銜接。", "explanationSource": "own", "section": "111年"}, {"id": 217, "question": "【篇章結構 第 31–34 題】\n@@111-31–34@@\n\n▶ 第 33 題　請選出最適合放入 __33__ 的句子", "options": ["Some people also visit the cemetery to clean up the family graves and pray for their ancestors.", "Such festive activities are usually held in parks, temples, and other public places around Japan.", "Obon concludes with another bonfire, okuribi, lighting up the sky to see the ancestors’ spirits off.", "Originating from the Chinese Ghost Festival, this annual event has evolved into a time of family reunion."], "answer": 2, "answerLabel": "C", "source": "111 學測｜篇章結構｜第 33 題", "explanation": "此段開頭：接著說紙燈與供品順河漂流送祖先回去。(C) Obon 以另一場篝火 okuribi「送火」作結，點出送祖先離開的主題，與第一段 mukaebi 迎火呼應。", "explanationSource": "own", "section": "111年"}, {"id": 218, "question": "【篇章結構 第 31–34 題】\n@@111-31–34@@\n\n▶ 第 34 題　請選出最適合放入 __34__ 的句子", "options": ["Some people also visit the cemetery to clean up the family graves and pray for their ancestors.", "Such festive activities are usually held in parks, temples, and other public places around Japan.", "Obon concludes with another bonfire, okuribi, lighting up the sky to see the ancestors’ spirits off.", "Originating from the Chinese Ghost Festival, this annual event has evolved into a time of family reunion."], "answer": 1, "answerLabel": "B", "source": "111 學測｜篇章結構｜第 34 題", "explanation": "前句說參加者穿輕便和服隨音樂圍著舞台跳舞。(B)「這類節慶活動通常在公園、寺廟等公共場所舉行」說明活動地點，接著才說舞蹈已成夏日祭典的象徵。", "explanationSource": "own", "section": "111年"}, {"id": 219, "question": "【閱讀測驗 第 35–38 題】\n@@111-35–38@@\n\n▶ 第 35 題　Which of the following pictures best represents the image of a typical Maasai warrior?", "options": ["圖 (A)", "圖 (B)", "圖 (C)", "圖 (D)"], "answer": 1, "answerLabel": "B", "source": "111 學測｜閱讀測驗｜第 35 題", "explanation": "第一段紅毯與彩繪盾牌、第三段「戰士很少不帶長矛與盾牌」——圖 (B)：披紅布、持矛與盾。(A) 弓箭、(C)(D) 無紅布。", "explanationSource": "own", "section": "111年", "image": "assets/q35-111-maasai-options.png?v=20261120-6"}, {"id": 220, "question": "【閱讀測驗 第 35–38 題】\n@@111-35–38@@\n\n▶ 第 36 題　What can we learn from the passage about the Maasai people?", "options": ["They have been urged by governments to leave behind their traditions.", "They resist foreign influence because they were enslaved in the past.", "A boy has to kill a lion by himself before becoming an adult.", "A Maasai woman is usually good at beadwork and farming."], "answer": 0, "answerLabel": "A", "source": "111 學測｜閱讀測驗｜第 36 題", "explanation": "第二段：他們抵制肯亞與坦尚尼亞政府要他們採取現代生活方式的催促。(A)。(B) 錯：他們抵抗奴役，不是曾被奴役；(C) 錯：是成為「戰士」而非成人；(D) 文中沒說擅長農耕。", "explanationSource": "own", "section": "111年"}, {"id": 221, "question": "【閱讀測驗 第 35–38 題】\n@@111-35–38@@\n\n▶ 第 37 題　Which of the following is true about Maasai clothing and beadwork?", "options": ["Striped and patterned cloth is preferred by young adults.", "Young men cannot wear black until they become warriors.", "Colorful glass jewelry became popular after the 19th century.", "The color of the shúkà represented one’s importance in the tribe."], "answer": 2, "answerLabel": "C", "source": "111 學測｜閱讀測驗｜第 37 題", "explanation": "第四段：19 世紀與歐洲人貿易後，天然材料被彩色玻璃珠取代。(C)。(A) 錯：是女性偏好格紋條紋；(B) 錯：黑色是割禮後穿數月。", "explanationSource": "own", "section": "111年"}, {"id": 222, "question": "【閱讀測驗 第 35–38 題】\n@@111-35–38@@\n\n▶ 第 38 題　Why does the author quote Blixen’s comment at the end of the third paragraph?", "options": ["To explain how Maasai warriors hunt for deer in the wild.", "To exemplify the types of weapons used by Maasai warriors.", "To emphasize that weapons are an inseparable part of a Maasai warrior’s outfit.", "To show the similarities between the behavior of a Maasai warrior and that of a male deer."], "answer": 2, "answerLabel": "C", "source": "111 學測｜閱讀測驗｜第 38 題", "explanation": "引述「武器和飾品是他們存在的一部分，就像雄鹿的角一樣」——強調武器是戰士裝束不可分割的部分。(C)。", "explanationSource": "own", "section": "111年"}, {"id": 223, "question": "【閱讀測驗 第 39–42 題】\n@@111-39–42@@\n\n▶ 第 39 題　Which of the following aspects about hard hats is NOT discussed in the passage?", "options": ["Their functions.", "Their appearances.", "Their materials.", "Their limitations."], "answer": 3, "answerLabel": "D", "source": "111 學測｜閱讀測驗｜第 39 題", "explanation": "文中談功能（保護頭部）、外觀（顏色代碼、配件）、材質演變；沒有討論安全帽的「限制」。(D)。", "explanationSource": "own", "section": "111年"}, {"id": 224, "question": "【閱讀測驗 第 39–42 題】\n@@111-39–42@@\n\n▶ 第 40 題　In what order did the following protective hats appear? a. fiberglass hats b. hats with see-through shields c. hats with canvas and leather d. hats with tar over them", "options": ["dcab", "cdba", "cbad", "dcba"], "answer": 0, "answerLabel": "A", "source": "111 學測｜閱讀測驗｜第 40 題", "explanation": "順序：戰前塗煤焦油的帽子 (d) → 1919 帆布皮革 (c) → 之後玻璃纖維 (a) → 近年透明面罩 (b)：dcab。(A)。", "explanationSource": "own", "section": "111年"}, {"id": 225, "question": "【閱讀測驗 第 39–42 題】\n@@111-39–42@@\n\n▶ 第 41 題　According to the passage, which of the following statements is true about the hard hat?", "options": ["Global sales have doubled every ten years.", "The inspiration came from the inventor’s wartime experience.", "It was standard equipment for construction workers in the 1920s.", "Different colors are used in different industries to signal the roles of people on site."], "answer": 1, "answerLabel": "B", "source": "111 學測｜閱讀測驗｜第 41 題", "explanation": "第二段：Bullard 在一戰中見識金屬頭盔救命的力量，因而決定生產——靈感來自戰時經驗。(B)。(D) 錯：顏色區分的是工地上的角色，不是不同產業。", "explanationSource": "own", "section": "111年"}, {"id": 226, "question": "【閱讀測驗 第 39–42 題】\n@@111-39–42@@\n\n▶ 第 42 題　Which of the following words are used in the passage to refer to the hard hat? a. tool b. code c. device d. helmet e. accessory f. headgear", "options": ["a, b, d, e", "a, c, d, f", "c, d, e, f", "a, d, e, f"], "answer": 1, "answerLabel": "B", "source": "111 學測｜閱讀測驗｜第 42 題", "explanation": "文中用了 tool（number one safety tool）、device（head protection device）、helmet（第一句）、headgear（第一、二段）；code 指顏色代碼，accessory 指配件。(B)。", "explanationSource": "own", "section": "111年"}, {"id": 227, "question": "【閱讀測驗 第 43–46 題】\n@@111-43–46@@\n\n▶ 第 43 題　What can we learn about zebrafish from the passage?", "options": ["How they should be studied in labs.", "Where they derive their regenerative ability.", "Why they share humans’ genetic code.", "What they may offer in medical advancements."], "answer": 3, "answerLabel": "D", "source": "111 學測｜閱讀測驗｜第 43 題", "explanation": "全文說明斑馬魚的再生能力可能帶來醫學進展（如治療失明）。(D)。", "explanationSource": "own", "section": "111年"}, {"id": 228, "question": "【閱讀測驗 第 43–46 題】\n@@111-43–46@@\n\n▶ 第 44 題　Which of the following statements is true regarding GABA in zebrafish?", "options": ["Increasing GABA level facilitates neuron activities.", "There is a high level of GABA in the brain of zebrafish.", "Lowering GABA levels in the brain can stimulate retina regrowth.", "GABA contains chemical elements that trigger the growth of neurons."], "answer": 2, "answerLabel": "C", "source": "111 學測｜閱讀測驗｜第 44 題", "explanation": "第四段：降低 GABA 濃度可觸發視網膜再生，高濃度則抑制。(C)。", "explanationSource": "own", "section": "111年"}, {"id": 229, "question": "【閱讀測驗 第 43–46 題】\n@@111-43–46@@\n\n▶ 第 45 題　Which of the following is closest in meaning to “replicated” in the third paragraph?", "options": ["Reproduced.", "Reassembled.", "Recycled.", "Restored."], "answer": 0, "answerLabel": "A", "source": "111 學測｜閱讀測驗｜第 45 題", "explanation": "replicate 複製、重現：若此過程能在人體重現——reproduced。(A)。", "explanationSource": "own", "section": "111年"}, {"id": 230, "question": "【閱讀測驗 第 43–46 題】\n@@111-43–46@@\n\n▶ 第 46 題　According to the passage, which of the following is an opinion, but NOT a fact?", "options": ["Humans and zebrafish have 70 percent of genes in common.", "Zebrafish can quickly recover vision after damage to the retina.", "Scientists are testing if the GABA theory works on mice as it does on zebrafish.", "Understanding regeneration in zebrafish may allow humans to regrow their organs."], "answer": 3, "answerLabel": "D", "source": "111 學測｜閱讀測驗｜第 46 題", "explanation": "(A)(B)(C) 都是研究結果或正在進行的事實；(D) 是科學家的「希望」（hope that… may one day），屬於意見。(D)。", "explanationSource": "own", "section": "111年"}, {"id": 231, "question": "第 1 題　Tom is really a naughty boy. He likes to ______ and play jokes on his younger sister when their parents are not around.", "options": ["alert", "spare", "tease", "oppose"], "answer": 2, "answerLabel": "C", "source": "110 學測｜詞彙｜第 1 題", "explanation": "調皮的男孩喜歡「逗弄」妹妹、開她玩笑：tease。alert 警告、spare 省去、oppose 反對。", "explanationSource": "own", "section": "110年"}, {"id": 232, "question": "第 2 題　Elderly shoppers in this store are advised to take the elevator rather than the ______, which may move too fast for them to keep their balance.", "options": ["airway", "operator", "escalator", "instrument"], "answer": 2, "answerLabel": "C", "source": "110 學測｜詞彙｜第 2 題", "explanation": "搭電梯而不要搭「電扶梯」，因為移動太快難以保持平衡：escalator。airway 氣道、operator 操作員、instrument 儀器。", "explanationSource": "own", "section": "110年"}, {"id": 233, "question": "第 3 題　Upon hearing its master’s call, the dog wagged its tail, and followed her out of the room ______.", "options": ["obediently", "apparently", "logically", "thoroughly"], "answer": 0, "answerLabel": "A", "source": "110 學測｜詞彙｜第 3 題", "explanation": "狗聽到主人呼喚就搖尾巴「順從地」跟出去：obediently。apparently 顯然、logically 邏輯上、thoroughly 徹底地。", "explanationSource": "own", "section": "110年"}, {"id": 234, "question": "第 4 題　Since many of our house plants are from humid jungle environments, they need ______ air to keep them green and healthy.", "options": ["moist", "stale", "crisp", "fertile"], "answer": 0, "answerLabel": "A", "source": "110 學測｜詞彙｜第 4 題", "explanation": "來自潮濕叢林的植物需要「濕潤的」空氣：moist。stale 不新鮮的、crisp 清爽的、fertile 肥沃的。", "explanationSource": "own", "section": "110年"}, {"id": 235, "question": "第 5 題　The skydiver managed to land safely after jumping out of the aircraft, even though her ______ failed to open in midair.", "options": ["glimpse", "latitude", "segment", "parachute"], "answer": 3, "answerLabel": "D", "source": "110 學測｜詞彙｜第 5 題", "explanation": "「降落傘」在空中沒打開卻仍安全著陸：parachute。glimpse 一瞥、latitude 緯度、segment 部分。", "explanationSource": "own", "section": "110年"}, {"id": 236, "question": "第 6 題　The invention of the steam engine, which was used to power heavy machines, brought about a ______ change in society.", "options": ["persuasive", "harmonious", "conventional", "revolutionary"], "answer": 3, "answerLabel": "D", "source": "110 學測｜詞彙｜第 6 題", "explanation": "蒸汽機的發明帶來「革命性的」社會變化：revolutionary。persuasive 有說服力的、harmonious 和諧的、conventional 傳統的。", "explanationSource": "own", "section": "110年"}, {"id": 237, "question": "第 7 題　To encourage classroom ______, the teacher divided the class into groups and asked them to solve a problem together with their partners.", "options": ["operation", "interaction", "adjustment", "explanation"], "answer": 1, "answerLabel": "B", 1–44 題】\n@@110-41–44@@\n\n▶ 第 43 題　Which of the following statements about the prickly pear cactus is true?", "options": ["Its soft inner part is often discarded.", "It was not discovered until the modern era.", "It turns into 200,000 tons of waste in Mexico each year.", "It appears in a prominent place on Mexico’s national flag."], "answer": 3, "answerLabel": "D", "source": "110 學測｜閱讀測驗｜第 43 題", "explanation": "第一句：它在墨西哥國旗上占有顯著位置。(D)。(A) 錯：丟棄的是外皮；(C) 錯：20 萬噸是產量。", "explanationSource": "own", "section": "110年"}, {"id": 274, "question": "【閱讀測驗 第 41–44 題】\n@@110-41–44@@\n\n▶ 第 44 題　What advantage does the prickly pear cactus have over other biofuel crops?", "options": ["It generates more energy.", "It will not influence food prices.", "It may replace feed for livestock.", "It can increase global food production."], "answer": 1, "answerLabel": "B", "source": "110 學測｜閱讀測驗｜第 44 題", "explanation": "第四段：只用外皮發電，果肉仍供食用，因此「不會對食品價格造成壓力」。(B)。", "explanationSource": "own", "section": "110年"}, {"id": 275, "question": "【閱讀測驗 第 45–48 題】\n@@110-45–48@@\n\n▶ 第 45 題　How is the information in the passage organized?", "options": ["In order of time.", "By cause and effect.", "In order of importance.", "By definition and illustration."], "answer": 0, "answerLabel": "A", "source": "110 學測｜閱讀測驗｜第 45 題", "explanation": "從公元前 450 年、中世紀、亨利五世到一戰——依時間順序。(A)。", "explanationSource": "own", "section": "110年"}, {"id": 276, "question": "【閱讀測驗 第 45–48 題】\n@@110-45–48@@\n\n▶ 第 46 題　Which of the following statements is true about the earliest travel document?", "options": ["It was issued by the king of Judah.", "It was given to an official of Persia.", "It appeared more than three thousand years ago.", "It served to invite people to travel beyond the river."], "answer": 1, "answerLabel": "B", "source": "110 學測｜閱讀測驗｜第 46 題", "explanation": "第一段：波斯王給他的官員 Nehemiah 一封信——給波斯的官員。(B)。(C) 錯：約 2,500 年前；(D) 錯：是請求讓他安全通行。", "explanationSource": "own", "section": "110年"}, {"id": 277, "question": "【閱讀測驗 第 45–48 題】\n@@110-45–48@@\n\n▶ 第 47 題　When did the term “passport” start being used?", "options": ["In about 450 B.C.", "During World War I.", "In the 16th century.", "During King Henry V’s reign."], "answer": 2, "answerLabel": "C", "source": "110 學測｜閱讀測驗｜第 47 題", "explanation": "第三段：15 世紀議會法案首次提及，「passport」一詞約一世紀後（16 世紀）才開始使用。(C)。", "explanationSource": "own", "section": "110年"}, {"id": 278, "question": "【閱讀測驗 第 45–48 題】\n@@110-45–48@@\n\n▶ 第 48 題　Which of the following is NOT mentioned in the passage as a form of passport?", "options": ["A letter.", "A receipt.", "A proof of identity.", "A list of seaports."], "answer": 3, "answerLabel": "D", "source": "110 學測｜閱讀測驗｜第 48 題", "explanation": "文中提到信（波斯）、繳稅收據（伊斯蘭）、證明身分（亨利五世）、可進入的城鎮清單；沒有「海港清單」，且去海港不需文件。(D)。", "explanationSource": "own", "section": "110年"}, {"id": 279, "question": "【閱讀測驗 第 49–52 題】\n@@110-49–52@@\n\n▶ 第 49 題　Which of the following is the closest illustration of Benjamin Franklin’s invention?", "options": ["圖 (A)", "圖 (B)", "圖 (C)", "圖 (D)"], "answer": 3, "answerLabel": "D", "source": "110 學測｜閱讀測驗｜第 49 題", "explanation": "第二段：不同大小的玻璃半球由大到小套在鐵棒上，以紡車狀裝置和腳踏板轉動——圖 (D)。(A) 編鐘、(B) 玻璃杯琴（富蘭克林聽到的樂器）、(C) 紡紗機。", "explanationSource": "own", "section": "110年", "image": "assets/q49-110-glass-armonica-options.png?v=20261120-6"}, {"id": 280, "question": "【閱讀測驗 第 49–52 題】\n@@110-49–52@@\n\n▶ 第 50 題　Which of the following statements is true about how the glass armonica works?", "options": ["Water has to be poured into the glass hemispheres.", "Colored paint makes it sound better and last longer.", "An iron rod is used to strike the thicker glass hemispheres.", "The performer’s fingers have to be slightly wet when playing it."], "answer": 3, "answerLabel": "D", "source": "110 學測｜閱讀測驗｜第 50 題", "explanation": "第二段：富蘭克林把手指沾濕，按在轉動的玻璃半球邊緣——手指要微濕。(D)。", "explanationSource": "own", "section": "110年"}, {"id": 281, "question": "【閱讀測驗 第 49–52 題】\n@@110-49–52@@\n\n▶ 第 51 題　According to the passage, why did the glass armonica lose its popularity?", "options": ["The skill of playing the glass armonica was very hard to master.", "Famous musicians like Beethoven had problems composing for it.", "Concert halls became too big for its music to be heard by the audience.", "Reviewers in that time indicated that it was clumsy and not fashionable."], "answer": 2, "answerLabel": "C", "source": "110 學測｜閱讀測驗｜第 51 題", "explanation": "第三段：音樂廳變大，沒有擴音就聽不到玻璃琴的聲音。(C)。", "explanationSource": "own", "section": "110年"}, {"id": 282, "question": "【閱讀測驗 第 49–52 題】\n@@110-49–52@@\n\n▶ 第 52 題　What does the highlighted “they” in the second paragraph refer to?", "options": ["Iron rods.", "Hemispheres.", "Colored notes.", "Musical pitches."], "answer": 1, "answerLabel": "B", "source": "110 學測｜閱讀測驗｜第 52 題", "explanation": "so that they could nest together from largest to smallest：they 指前面的玻璃半球。(B)。", "explanationSource": "own", "section": "110年"}, {"id": 283, "question": "【閱讀測驗 第 53–56 題】\n@@110-53–56@@\n\n▶ 第 53 題　What is the passage mainly about?", "options": ["The new addition to Morgan’s Wonderland.", "The establishment and features of a special theme park.", "The advanced technological devices in Morgan’s Wonderland.", "The needs of people who suffer from physical and mental disabilities."], "answer": 1, "answerLabel": "B", "source": "110 學測｜閱讀測驗｜第 53 題", "explanation": "全文介紹 Morgan’s Wonderland 這座為身心障礙兒童設計的主題樂園的成立緣由與特色。(B)。", "explanationSource": "own", "section": "110年"}, {"id": 284, "question": "【閱讀測驗 第 53–56 題】\n@@110-53–56@@\n\n▶ 第 54 題　What does “ultra-accessible” in the second paragraph imply?", "options": ["It’s easy for all visitors to use the facilities.", "Admission is free for people young and old.", "Wheelchairs are provided for every featured attraction.", "Morgan’s Wonderland is situated in a convenient location."], "answer": 0, "answerLabel": "A", "source": "110 學測｜閱讀測驗｜第 54 題", "explanation": "ultra-accessible 極易到達使用的：後文說完全無障礙、輪椅可用——所有訪客都容易使用設施。(A)。", "explanationSource": "own", "section": "110年"}, {"id": 285, "question": "【閱讀測驗 第 53–56 題】\n@@110-53–56@@\n\n▶ 第 55 題　Which of the following is NOT mentioned as a fun activity in the park?", "options": ["Fishing.", "Driving.", "Hiking.", "Picnicking."], "answer": 2, "answerLabel": "C", "source": "110 學測｜閱讀測驗｜第 55 題", "explanation": "第三段提到釣魚湖、野餐區、越野駕駛；沒有健行。(C)。", "explanationSource": "own", "section": "110年"}, {"id": 286, "question": "【閱讀測驗 第 53–56 題】\n@@110-53–56@@\n\n▶ 第 56 題　Which of the following statements is true about Morgan’s Wonderland?", "options": ["Waterproof chairs enable visitors to roam all over the park.", "Morgan’s Inspiration Island includes 25 acres of attractions.", "The success of the park is exactly what Morgan intended to achieve.", "GPS bands allow visitors to enjoy the convenience of the electronic devices."], "answer": 3, "answerLabel": "D", "source": "110 學測｜閱讀測驗｜第 56 題", "explanation": "第三段：GPS 手環可互相追蹤位置並參與電子活動（如拍照寄 email）。(D)。(B) 錯：25 英畝是樂園本身。", "explanationSource": "own", "section": "110年"}, {"id": 287, "question": "第 1 題　After hours of discussion, our class finally reached the ______ that we would go to Hualien for our graduation trip.", "options": ["balance", "conclusion", "definition", "harmony"], "answer": 1, "answerLabel": "B", "source": "109 學測｜詞彙｜第 1 題", "explanation": "討論數小時後終於得出「結論」：reach the conclusion that。balance 平衡、definition 定義、harmony 和諧。", "explanationSource": "own", "section": "109年"}, {"id": 288, "question": "第 2 題　Jane ______ her teacher by passing the exam with a nearly perfect score; she almost failed the course last semester.", "options": ["bored", "amazed", "charmed", "informed"], "answer": 1, "answerLabel": "B", "source": "109 學測｜詞彙｜第 2 題", "explanation": "上學期差點被當，這次幾乎滿分，讓老師「驚訝」：amazed。bore 使無聊、charm 使陶醉、inform 通知。", "explanationSource": "own", "section": "109年"}, {"id": 289, "question": "第 3 題　The vacuum cleaner is not working. Let’s send it back to the ______ to have it inspected and repaired.", "options": ["lecturer", "publisher", "researcher", "manufacturer"], "answer": 3, "answerLabel": "D", "source": "109 學測｜詞彙｜第 3 題", "explanation": "吸塵器壞了，送回「製造商」檢修：manufacturer。lecturer 講師、publisher 出版商、researcher 研究員。", "explanationSource": "own", "section": "109年"}, {"id": 290, "question": "第 4 題　Due to the global financial crisis, the country’s exports ______ by 40 percent last month, the largest drop since 2000.", "options": ["flattered", "transformed", "relieved", "decreased"], "answer": 3, "answerLabel": "D", "source": "109 學測｜詞彙｜第 4 題", "explanation": "金融危機使出口「下降」40%，是 2000 年以來最大跌幅：decreased。flatter 諂媚、transform 轉變、relieve 緩解。", "explanationSource": "own", "section": "109年"}, {"id": 291, "question": "第 5 題　The potato chips have been left uncovered on the table for such a long time that they no longer taste fresh and ______.", "options": ["solid", "crispy", "original", "smooth"], "answer": 1, "answerLabel": "B", "source": "109 學測｜詞彙｜第 5 題", "explanation": "洋芋片沒蓋放太久，不再新鮮「酥脆」：crispy。solid 固體的、original 原本的、smooth 平滑的。", "explanationSource": "own", "section": "109年"}, {"id": 292, "question": "第 6 題　The townspeople built a ______ in memory of the brave teacher who sacrificed her life to save her students from a burning bus.", "options": ["monument", "refugee", "souvenir", "firecracker"], "answer": 0, "answerLabel": "A", "source": "109 學測｜詞彙｜第 6 題", "explanation": "為紀念犧牲自己救學生的老師而建「紀念碑」：monument。refugee 難民、souvenir 紀念品、firecracker 鞭炮。", "explanationSource": "own", "section": "109年"}, {"id": 293, "question": "第 7 題　The students in Professor Smith’s classical Chinese class are required to ______ poems by famous Chinese poets.", "options": ["construct", "expose", "recite", "install"], "answer": 2, "answerLabel": "C", "source": "109 學測｜詞彙｜第 7 題", "explanation": "古文課要求「背誦」名家詩作：recite。construct 建造、expose 暴露、install 安裝。", "explanationSource": "own", "section": "109年"}, {"id": 294, "question": "第 8 題　Although Mr. Tang claims that the house belongs to him, he has not offered any proof of ______.", "options": ["convention", "relationship", "insurance", "ownership"], "answer": 3, "answerLabel": "D", "source": "109 學測｜詞彙｜第 8 題", "explanation": "聲稱房子是他的，卻無法提出「所有權」證明：ownership。convention 慣例、relationship 關係、insurance 保險。", "explanationSource": "own", "section": "109年"}, {"id": 295, "question": "第 9 題　Ancient Athens, famous for its early development of the democratic system, is often said to be the ______ of democracy.", "options": ["mission", "target", "cradle", "milestone"], "answer": 2, "answerLabel": "C", "source": "109 學測｜詞彙｜第 9 題", "explanation": "雅典最早發展民主制度，被稱為民主的「發源地」：cradle 搖籃、發源地。mission 任務、target 目標、milestone 里程碑。", "explanationSource": "own", "section": "109年"}, {"id": 296, "question": "第 10 題　The candy can no longer be sold because it was found to contain artificial ingredients far beyond the ______ level.", "options": ["abundant", "immense", "permissible", "descriptive"], "answer": 2, "answerLabel": "C", "source": "109 學測｜詞彙｜第 10 題", "explanation": "人工成分遠超過「容許的」標準，不能再販售：permissible level。abundant 豐富的、immense 巨大的、descriptive 描述的。", "explanationSource": "own", "section": "109年"}, {"id": 297, "question": "第 11 題　Jack’s excellent performance in last week’s game has ______ all the doubts about his ability to play on our school basketball team.", "options": ["erased", "canceled", "overlooked", "replaced"], "answer": 0, "answerLabel": "A", "source": "109 學測｜詞彙｜第 11 題", "explanation": "出色表現「消除」了所有對他能力的質疑：erased。cancel 取消、overlook 忽略、replace 取代。", "explanationSource": "own", "section": "109年"}, {"id": 298, "question": "第 12 題　It is bullying to ______ a foreign speaker’s accent. No one deserves to be laughed at for their pronunciation.", "options": ["mock", "sneak", "prompt", "glare"], "answer": 0, "answerLabel": "A", "source": "109 學測｜詞彙｜第 12 題", "explanation": "「嘲笑」外國人的口音是霸凌：mock。sneak 偷偷溜走、prompt 促使、glare 怒視。", "explanationSource": "own", "section": "109年"}, {"id": 299, "question": "第 13 題　Mary lost ten kilograms in three months, so her ______ skin-tight jeans are now hanging off her hips.", "options": ["barely", "evenly", "currently", "formerly"], "answer": 3, "answerLabel": "D", "source": "109 學測｜詞彙｜第 13 題", "explanation": "三個月瘦十公斤，「以前」緊身的牛仔褲現在鬆垮：formerly。barely 幾乎不、evenly 平均地、currently 目前。", "explanationSource": "own", "section": "109年"}, {"id": 300, "question": "第 14 題　The police officer showed us pictures of drunk driving accidents to highlight the importance of staying ______ on the road.", "options": ["sober", "majestic", "vigorous", "noticeable"], "answer": 0, "answerLabel": "A", "source": "109 學測｜詞彙｜第 14 題", "explanation": "展示酒駕事故照片，強調開車時保持「清醒（未飲酒）」的重要：sober。majestic 雄偉的、vigorous 有活力的、noticeable 明顯的。", "explanationSource": "own", "section": "109年"}, {"id": 301, "question": "第 15 題　The claim that eating chocolate can prevent heart disease is ______ because there is not enough scientific evidence to support it.", "options": ["creative", "disputable", "circular", "magnificent"], "answer": 1, "answerLabel": "B", "source": "109 學測｜詞彙｜第 15 題", "explanation": "缺乏足夠科學證據，這個說法「有爭議」：disputable。creative 有創意的、circular 圓形的、magnificent 壯麗的。", "explanationSource": "own", "section": "109年"}, {"id": 302, "question": "【綜合測驗 第 16–20 題】\n@@109-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["were being", "have been", "will be", "had to be"], "answer": 1, "answerLabel": "B", "source": "109 學測｜綜合測驗｜第 16 題", "explanation": "Over the centuries（數世紀以來）… have been used：現在完成式被動，表從過去持續至今。", "explanationSource": "own", "section": "109年"}, {"id": 303, "question": "【綜合測驗 第 16–20 題】\n@@109-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["competition", "application", "investigation", "participation"], "answer": 1, "answerLabel": "B", "source": "109 學測｜綜合測驗｜第 17 題", "explanation": "古老藝術在當代藝術家手中找到新的「用途、應用」：application。competition 競爭、investigation 調查、participation 參與。", "explanationSource": "own", "section": "109年"}, {"id": 304, "question": "【綜合測驗 第 16–20 題】\n@@109-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["carry away", "build on", "cope with", "get off"], "answer": 2, "answerLabel": "C", "source": "109 學測｜綜合測驗｜第 18 題", "explanation": "幫助癌症病人「面對、處理」治療後掉髮的失落：cope with。carry away 帶走、build on 建立於、get off 下車。", "explanationSource": "own", "section": "109年"}, {"id": 305, "question": "【綜合測驗 第 16–20 題】\n@@109-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["moreover", "altogether", "namely", "otherwise"], "answer": 3, "answerLabel": "D", "source": "109 學測｜綜合測驗｜第 19 題", "explanation": "指甲花皇冠取代病人「原本（否則）」會用來遮頭的帽子和假髮：otherwise。moreover 此外、altogether 總共、namely 也就是。", "explanationSource": "own", "section": "109年"}, {"id": 306, "question": "【綜合測驗 第 16–20 題】\n@@109-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["positive", "general", "flexible", "considerate"], "answer": 0, "answerLabel": "A", "source": "109 學測｜綜合測驗｜第 20 題", "explanation": "在脆弱沮喪時幫助她們建立更「正面的」自我形象：positive。general 一般的、flexible 彈性的、considerate 體貼的。", "explanationSource": "own", "section": "109年"}, {"id": 307, "question": "【綜合測驗 第 21–25 題】\n@@109-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["similar", "miserable", "realistic", "temporary"], "answer": 0, "answerLabel": "A", "source": "109 學測｜綜合測驗｜第 21 題", "explanation": "人打噴嚏會傳播疾病，研究顯示植物也有「類似的」問題：similar。後文說是植物版的打噴嚏。", "explanationSource": "own", "section": "109年"}, {"id": 308, "question": "【綜合測驗 第 21–25 題】\n@@109-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["As a result of", "In a search for", "With a view to", "To the extent of"], "answer": 1, "answerLabel": "B", "source": "109 學測｜綜合測驗｜第 22 題", "explanation": "「為了尋找」其他可能的傳播途徑，研究者觀察麥葉上的水滴：In a search for。As a result of 由於、With a view to 為了（接 V-ing）、To the extent of 到…程度。", "explanationSource": "own", "section": "109年"}, {"id": 309, "question": "【綜合測驗 第 21–25 題】\n@@109-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["shoot out", "hold on", "come across", "give up"], "answer": 0, "answerLabel": "A", "source": "109 學測｜綜合測驗｜第 23 題", "explanation": "生病的植物會「噴出」帶有病菌的小水滴：shoot out。hold on 等一下、come across 偶遇、give up 放棄。", "explanationSource": "own", "section": "109年"}, {"id": 310, "question": " wn", "section": "109年"}, {"id": 316, "question": "【綜合測驗 第 26–30 題】\n@@109-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["breaks down", "mixes up", "tears off", "results in"], "answer": 0, "answerLabel": "A", "source": "109 學測｜綜合測驗｜第 30 題", "explanation": "把複雜的憂鬱議題「拆解、簡化」成簡單易懂的東西：break down … into。mix up 混淆、tear off 撕下、result in 導致。", "explanationSource": "own", "section": "109年"}, {"id": 317, "question": "【文意選填 第 31–40 題】\n@@109-31–40@@\n\n▶ 第 31 題　請從 (A)–(J) 選出最適合 __31__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 5, "answerLabel": "F", "source": "109 學測｜文意選填｜第 31 題", "explanation": "酒窩通常兩頰都有，單邊酒窩相對「罕見」：a relatively rare phenomenon。(F) rare。", "explanationSource": "own", "section": "109年"}, {"id": 318, "question": "【文意選填 第 31–40 題】\n@@109-31–40@@\n\n▶ 第 32 題　請從 (A)–(J) 選出最適合 __32__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 3, "answerLabel": "D", "source": "109 學測｜文意選填｜第 32 題", "explanation": "有些文化偏好酒窩，因為被視為「吸引力」的象徵：a sign of attractiveness。(D) attractiveness。", "explanationSource": "own", "section": "109年"}, {"id": 319, "question": "【文意選填 第 31–40 題】\n@@109-31–40@@\n\n▶ 第 33 題　請從 (A)–(J) 選出最適合 __33__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 0, "answerLabel": "A", "source": "109 學測｜文意選填｜第 33 題", "explanation": "大多數酒窩其實是臉部肌肉過短造成的基因「缺陷」：a genetic flaw（後文 genetic defect 呼應）。(A) flaw。", "explanationSource": "own", "section": "109年"}, {"id": 320, "question": "【文意選填 第 31–40 題】\n@@109-31–40@@\n\n▶ 第 34 題　請從 (A)–(J) 選出最適合 __34__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 7, "answerLabel": "H", "source": "109 學測｜文意選填｜第 34 題", "explanation": "酒窩從父母「傳給」子女只需要一個基因：the transfer of dimples from parents to children。(H) transfer。", "explanationSource": "own", "section": "109年"}, {"id": 321, "question": "【文意選填 第 31–40 題】\n@@109-31–40@@\n\n▶ 第 35 題　請從 (A)–(J) 選出最適合 __35__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 1, "answerLabel": "B", "source": "109 學測｜文意選填｜第 35 題", "explanation": "若父母都沒有酒窩基因，孩子不會「顯現」這個特徵：will not exhibit the trait。(B) exhibit。", "explanationSource": "own", "section": "109年"}, {"id": 322, "question": "【文意選填 第 31–40 題】\n@@109-31–40@@\n\n▶ 第 36 題　請從 (A)–(J) 選出最適合 __36__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 9, "answerLabel": "J", "source": "109 學測｜文意選填｜第 36 題", "explanation": "有些酒窩是臉上過多脂肪的「存在」造成的：the presence of excessive fat。(J) presence。", "explanationSource": "own", "section": "109年"}, {"id": 323, "question": "【文意選填 第 31–40 題】\n@@109-31–40@@\n\n▶ 第 37 題　請從 (A)–(J) 選出最適合 __37__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 2, "answerLabel": "C", "source": "109 學測｜文意選填｜第 37 題", "explanation": "許多嬰兒「圓胖的」臉頰上有酒窩：their chubby cheeks。(C) chubby。", "explanationSource": "own", "section": "109年"}, {"id": 324, "question": "【文意選填 第 31–40 題】\n@@109-31–40@@\n\n▶ 第 38 題　請從 (A)–(J) 選出最適合 __38__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 4, "answerLabel": "E", "source": "109 學測｜文意選填｜第 38 題", "explanation": "長大後嬰兒肥消失，酒窩也會隨時間「消退」：may fade with time。(E) fade。", "explanationSource": "own", "section": "109年"}, {"id": 325, "question": "【文意選填 第 31–40 題】\n@@109-31–40@@\n\n▶ 第 39 題　請從 (A)–(J) 選出最適合 __39__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 8, "answerLabel": "I", "source": "109 學測｜文意選填｜第 39 題", "explanation": "天生沒有「自然」酒窩的人可以用各種方法製造：born without natural dimples。(I) natural。", "explanationSource": "own", "section": "109年"}, {"id": 326, "question": "【文意選填 第 31–40 題】\n@@109-31–40@@\n\n▶ 第 40 題　請從 (A)–(J) 選出最適合 __40__ 的字（每個選項只用一次）", "options": ["flaw", "exhibit", "chubby", "attractiveness", "fade", "rare", "range", "transfer", "natural", "presence"], "answer": 6, "answerLabel": "G", "source": "109 學測｜文意選填｜第 40 題", "explanation": "這些方法「從」化妝這類簡單步驟「到」手術這類激烈手段：range from … to …。(G) range。", "explanationSource": "own", "section": "109年"}, {"id": 327, "question": "【閱讀測驗 第 41–44 題】\n@@109-41–44@@\n\n▶ 第 41 題　Which culture most likely created the sandals shown in the picture?", "options": ["Indian.", "Greek.", "Mesopotamian.", "Roman."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 41 題", "explanation": "圖中涼鞋的帶子穿在第二、三趾之間；第二段：羅馬式涼鞋的帶子在第二與第三趾之間（希臘：一二趾；美索不達米亞：三四趾；印度：趾間有球）。(D)。", "explanationSource": "own", "section": "109年", "image": "assets/q41-109-flip-flop.png?v=20261120-6"}, {"id": 328, "question": "【閱讀測驗 第 41–44 題】\n@@109-41–44@@\n\n▶ 第 42 題　Why is the footwear discussed in the passage called “flip-flop”?", "options": ["Because of the noise it makes.", "Because of its changeable design.", "Because of its simple structure.", "Because of the comfort of wearing it."], "answer": 0, "answerLabel": "A", "source": "109 學測｜閱讀測驗｜第 42 題", "explanation": "第一段：名字來自涼鞋拍打腳時發出的聲音。(A)。", "explanationSource": "own", "section": "109年"}, {"id": 329, "question": "【閱讀測驗 第 41–44 題】\n@@109-41–44@@\n\n▶ 第 43 題　Which of the following is true about the modern development of the flip-flop?", "options": ["Modern flip-flops originated from Indian toe knob sandals.", "Americans loved the Japanese flip-flop because of its bright colors.", "Rubber became the major material of the flip-flop before World War II.", "The sandals American soldiers brought home from Japan later became modern flip-flops."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 43 題", "explanation": "第三、四段：現代夾腳拖源自日本草履，1950 年代美國士兵從佔領的日本帶回來後流行。(D)。(C) 錯：二戰後才改用橡膠。", "explanationSource": "own", "section": "109年"}, {"id": 330, "question": "【閱讀測驗 第 41–44 題】\n@@109-41–44@@\n\n▶ 第 44 題　Which of the following is NOT mentioned as a concern of wearing the flip-flop?", "options": ["Personal health.", "Poor quality.", "Social appropriateness.", "Marine pollution."], "answer": 1, "answerLabel": "B", "source": "109 學測｜閱讀測驗｜第 44 題", "explanation": "最後一段提到腳部受傷（健康）、在街上露腳是否合宜（社會適切性）、塑膠垃圾進入海洋（污染）；沒有提到「品質不佳」。(B)。", "explanationSource": "own", "section": "109年"}, {"id": 331, "question": "【閱讀測驗 第 45–48 題】\n@@109-45–48@@\n\n▶ 第 45 題　What is the passage mainly about?", "options": ["A special profession.", "Shipping and trading.", "Guidelines for safe docking.", "Protection of the marine environment."], "answer": 0, "answerLabel": "A", "source": "109 學測｜閱讀測驗｜第 45 題", "explanation": "全文介紹 marine pilot（領港員）這個專門職業的工作內容與挑戰。(A)。", "explanationSource": "own", "section": "109年"}, {"id": 332, "question": "【閱讀測驗 第 45–48 題】\n@@109-45–48@@\n\n▶ 第 46 題　Which of the following is part of the knowledge that a marine pilot must have?", "options": ["The value of the ships.", "The content of the cargo.", "The weather conditions.", "The diversity of marine life."], "answer": 2, "answerLabel": "C", "source": "109 學測｜閱讀測驗｜第 46 題", "explanation": "第三段：潮汐和風會改變船的方向，增加停泊難度——領港員必須了解天氣狀況。(C)。", "explanationSource": "own", "section": "109年"}, {"id": 333, "question": "【閱讀測驗 第 45–48 題】\n@@109-45–48@@\n\n▶ 第 47 題　What does “a crucial time” in the last paragraph refer to?", "options": ["When the vessel hits a flat.", "When the channel is not deep enough.", "When there is a collision of two ships.", "When a ship is waiting to enter the port."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 47 題", "explanation": "第一段：船長把船開到港口外等待進港，領港員在此時上船——關鍵時刻就是船等著進港時。(D)。", "explanationSource": "own", "section": "109年"}, {"id": 334, "question": "【閱讀測驗 第 45–48 題】\n@@109-45–48@@\n\n▶ 第 48 題　How does the author conclude the passage in the last paragraph?", "options": ["By adding new details.", "By predicting future development.", "By summarizing the main points.", "By giving advice to the general public."], "answer": 2, "answerLabel": "C", "source": "109 學測｜閱讀測驗｜第 48 題", "explanation": "最後一段重申需要高度專業、風險管理、對港口的知識、保護船與環境——總結要點。(C)。", "explanationSource": "own", "section": "109年"}, {"id": 335, "question": "【閱讀測驗 第 49–52 題】\n@@109-49–52@@\n\n▶ 第 49 題　What is the passage mainly about?", "options": ["The flavor of olive oil.", "The trade of olive oil.", "The promotion of olive oil.", "The quality of olive oil."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 49 題", "explanation": "第一段講等級與品質標準，第二段講包裝儲存對品質的影響，第三段講改進品質測試——橄欖油的品質。(D)。", "explanationSource": "own", "section": "109年"}, {"id": 336, "question": "【閱讀測驗 第 49–52 題】\n@@109-49–52@@\n\n▶ 第 50 題　Which of the following statements is true about extra virgin olive oil?", "options": ["It is free from any bitter flavor.", "It is refined to remove its impurities.", "It requires mixing of more than one kind of oil.", "It has a lower acidity rate than virgin olive oil."], "answer": 3, "answerLabel": "D", "source": "109 學測｜閱讀測驗｜第 50 題", "explanation": "第一段：特級初榨酸度低於 1%，初榨低於 2%——特級的酸度更低。(D)。(A) 錯：要有宜人的苦味；(B)(C) 是 pure olive oil。", "explanationSource": "own", "section": "109年"}, {"id": 337, "question": "【閱讀測驗 第 49–52 題】\n@@109-49–52@@\n\n▶ 第 51 題　According to the passage, what is the best way to store olive oil?", "options": ["In a plastic container in a damp cellar.", "In a clear glass bottle near the kitchen stove.", "In an airtight glass bottle in a kitchen cupboard.", "In an airproof bottle next to a well-lighted window."], "answer": 2, "answerLabel": "C", "source": "109 學測｜閱讀測驗｜第 51 題", "explanation": "第二段：避光、避濕氣與氧氣、不用塑膠容器——密封玻璃瓶放在櫥櫃裡。(C)。", "explanationSource": "own", "section": "109年"}, {"id": 338, "question": "【閱讀測驗 第 49–52 題】\n@@109-49–52@@\n\n▶ 第 52 題　What is the IOC trying to do?", "options": ["Train more qualified olive oil tasters.", "Improve the ways of grading olive oil.", "Look for new techniques to boost production.", "Build better connections among industry members."], "answer": 1, "answerLabel": "B", "source": "109 學測｜閱讀測驗｜第 52 題", "explanation": "第三段：IOC 徵求測試方法的意見以提高透明度與準確度，並重新定義「橄欖油」——改進分級方式。(B)。", "explanationSource": "own", "section": "109年"}, {"id": 339, "question": "【閱讀測驗 第 53–56 題】\n@@109-53–56@@\n\n▶ 第 53 題　Why are deer attracted to train tracks?", "options": ["They mate at night near railways.", "They need nutrition from train tracks.", "They like to snort at the passing train.", "They sharpen their horns rubbing against the rails."], "answer": 1, "answerLabel": "B", "source": "109 學測｜閱讀測驗｜第 53 題", "explanation": "第三段：鹿需要鐵質，會舔鐵軌上的鐵屑。(B)。", "explanationSource": "own", "section": "109年"}, {"id": 340, "question": "【閱讀測驗 第 53–56 題】\n@@109-53–56@@\n\n▶ 第 54 題　What device has NOT been used to solve the railway problem in Japan?", "options": ["Flashing lights.", "Barking speakers.", "Noisy train tracks.", "Lion face paintings."], "answer": 2, "answerLabel": "C", "source": "109 學測｜閱讀測驗｜第 54 題", "explanation": "文中提到閃紅燈、獅子臉（失敗）和新的狗吠喇叭；沒有「會發出噪音的鐵軌」。(C)。", "explanationSource": "own", "section": "109年"}, {"id": 341, "question": "【閱讀測驗 第 53–56 題】\n@@109-53–56@@\n\n▶ 第 55 題　Which of the following is true about the deer issue discussed in the passage?", "options": ["RTRI’s new invention prompts deer to run away.", "People living near the tracks complain about deer snorts.", "45 percent of train delays in Japan was caused by deer collision.", "A combination of sound and visual devices attracts more deer to the tracks."], "answer": 0, "answerLabel": "A", "source": "109 學測｜閱讀測驗｜第 55 題", "explanation": "第四段：鹿聽到鹿的警告鼻息加狗吠的錄音會驚慌逃跑。(A)。(C) 錯：45% 是目擊鹿的次數減少。", "explanationSource": "own", "section": "109年"}, {"id": 342, "question": "【閱讀測驗 第 53–56 題】\n@@109-53–56@@\n\n▶ 第 56 題　What does the author mean by “the unforgiving nature of tons of onrushing planationSource": "own", "section": "107年"}, {"id": 441, "question": "【閱讀測驗 第 41–44 題】\n@@107-41–44@@\n\n▶ 第 43 題　Who initiated the construction of the White House?", "options": ["John Adams.", "James Hoban.", "George Washington.", "Thomas Jefferson."], "answer": 2, "answerLabel": "C", "source": "107 學測｜閱讀測驗｜第 43 題", "explanation": "第一段：華盛頓總統宣布聯邦政府所在地、監督建造（但從未住過）——他發起建造。(C)。(B) Hoban 是建築師。", "explanationSource": "own", "section": "107年"}, {"id": 442, "question": "【閱讀測驗 第 41–44 題】\n@@107-41–44@@\n\n▶ 第 44 題　According to the passage, which of the following is NOT true about the White House?", "options": ["The White House has had several names.", "The designer of the White House was an American president.", "People were not allowed to visit the White House during wartime.", "The White House is located in a district not larger than ten miles square."], "answer": 1, "answerLabel": "B", "source": "107 學測｜閱讀測驗｜第 44 題", "explanation": "設計者 James Hoban 是愛爾蘭出生的建築師，不是總統。(B) 不正確。其他：三個舊名、戰時不開放、不超過十平方英里皆有提到。", "explanationSource": "own", "section": "107年"}, {"id": 443, "question": "【閱讀測驗 第 45–48 題】\n@@107-45–48@@\n\n▶ 第 45 題　What is this passage mainly about?", "options": ["West Nile and methods to fight it.", "West Nile and governmental efficiency.", "West Nile and the conditions its virus thrives in.", "West Nile and its relation to tropical diseases."], "answer": 2, "answerLabel": "C", "source": "107 學測｜閱讀測驗｜第 45 題", "explanation": "第三段問「為什麼 2012 年夏天對病毒和蚊子如此有利」並說明天氣、經濟因素——病毒滋長的條件。(C)。", "explanationSource": "own", "section": "107年"}, {"id": 444, "question": "【閱讀測驗 第 45–48 題】\n@@107-45–48@@\n\n▶ 第 46 題　Which of the following statements is true about West Nile?", "options": ["Its symptoms usually appear within two weeks.", "It is spread through air and water in tropical areas.", "Over 20% of people who contract it will suffer severe symptoms.", "It comes from direct human contact with birds infected with the virus."], "answer": 0, "answerLabel": "A", "source": "107 學測｜閱讀測驗｜第 46 題", "explanation": "第一段：症狀通常在被咬後 3 到 14 天出現——兩週內。(A)。(B)(D) 錯：經蚊子叮咬傳播；(C) 錯：嚴重症狀約 1/150。", "explanationSource": "own", "section": "107年"}, {"id": 445, "question": "【閱讀測驗 第 45–48 題】\n@@107-45–48@@\n\n▶ 第 47 題　What did Dallas County do to fight off West Nile?", "options": ["They sprayed pesticide from the air.", "They asked citizens to stay away from dead birds.", "They encouraged citizens to get vaccinations.", "They drained the swimming pools in the county."], "answer": 0, "answerLabel": "A", "source": "107 學測｜閱讀測驗｜第 47 題", "explanation": "第二段：達拉斯宣布緊急狀態，「空中噴灑」殺蟲劑。(A)。", "explanationSource": "own", "section": "107年"}, {"id": 446, "question": "【閱讀測驗 第 45–48 題】\n@@107-45–48@@\n\n▶ 第 48 題　Which of the following is a reason why Dallas was hit most seriously in the U.S. in 2012?", "options": ["The increasing population in Texas raised the risk of contracting the disease.", "The government did not issue a warning about the disease in time.", "The residents worried about the county’s decision and action.", "The weather of the previous winter was not as cold as usual."], "answer": 3, "answerLabel": "D", "source": "107 學測｜閱讀測驗｜第 48 題", "explanation": "第三段：異常溫暖的冬天讓更多蚊子存活。(D)。(B) 文中說郡政府沒做檢測死鳥等關鍵措施，但未提「警告不及時」。", "explanationSource": "own", "section": "107年"}, {"id": 447, "question": "【閱讀測驗 第 49–52 題】\n@@107-49–52@@\n\n▶ 第 49 題　Which of the following is closest in meaning to “arid” in the first paragraph?", "options": ["Occupied.", "Isolated.", "Dry.", "Remote."], "answer": 2, "answerLabel": "C", "source": "107 學測｜閱讀測驗｜第 49 題", "explanation": "arid 乾旱的；後文說沙烏地阿拉伯水資源有限。(C)。", "explanationSource": "own", "section": "107年"}, {"id": 448, "question": "【閱讀測驗 第 49–52 題】\n@@107-49–52@@\n\n▶ 第 50 題　What is the second paragraph mainly about?", "options": ["The high cost of desalinating seawater.", "The major chemical characteristics of seawater.", "The urgent need to turn seawater into fresh water.", "The amount of energy produced in the desalination of seawater."], "answer": 0, "answerLabel": "A", "source": "107 學測｜閱讀測驗｜第 50 題", "explanation": "第二段：海水淡化需要大量能源，能源和技術都昂貴——成本高。(A)。", "explanationSource": "own", "section": "107年"}, {"id": 449, "question": "【閱讀測驗 第 49–52 題】\n@@107-49–52@@\n\n▶ 第 51 題　According to the passage, which of the following statements is true?", "options": ["Mixing salt with water is not as easy as removing salt from seawater.", "Desalinating seawater may kill some sea creatures and disturb the food chain.", "Covering 70% of the Earth, the ocean has always satisfied human needs for water.", "The increasing population in Saudi Arabia has resulted in shortages of fresh water."], "answer": 1, "answerLabel": "B", "source": "107 學測｜閱讀測驗｜第 51 題", "explanation": "第三段：海洋生物會被吸進淡化廠，殺死小魚和浮游生物，破壞食物鏈。(B)。(A) 相反：鹽很容易溶於水。", "explanationSource": "own", "section": "107年"}, {"id": 450, "question": "【閱讀測驗 第 49–52 題】\n@@107-49–52@@\n\n▶ 第 52 題　Which of the following best describes the author’s attitude toward the future of desalination?", "options": ["Amazed.", "Doubtful.", "Conservative.", "Hopeful."], "answer": 3, "answerLabel": "D", "source": "107 學測｜閱讀測驗｜第 52 題", "explanation": "最後一段：儘管有障礙，淡化越來越有吸引力，「正在尋找更便宜的方法，並有令人期待的新發現」——樂觀。(D)。", "explanationSource": "own", "section": "107年"}, {"id": 451, "question": "【閱讀測驗 第 53–56 題】\n@@107-53–56@@\n\n▶ 第 53 題　Which of the following titles best describes the main idea of this passage?", "options": ["The Origin of Lullabies", "The Functions of Lullabies", "Threatening Lullabies", "Sleep-Inducing Lullabies"], "answer": 1, "answerLabel": "B", "source": "107 學測｜閱讀測驗｜第 53 題", "explanation": "第二、三段：搖籃曲能安撫嬰兒，也讓母親抒發憂慮、如同治療——講搖籃曲的功能。(B)。", "explanationSource": "own", "section": "107年"}, {"id": 452, "question": "【閱讀測驗 第 53–56 題】\n@@107-53–56@@\n\n▶ 第 54 題　Which of the following is closest in meaning to the word “undertones” in the first paragraph?", "options": ["Consequences.", "Vocals.", "Whispers.", "Messages."], "answer": 3, "answerLabel": "D", "source": "107 學測｜閱讀測驗｜第 54 題", "explanation": "dark undertones 隱含的陰暗訊息；上文說巴比倫搖籃曲的 message 並不安慰人。(D)。", "explanationSource": "own", "section": "107年"}, {"id": 453, "question": "【閱讀測驗 第 53–56 題】\n@@107-53–56@@\n\n▶ 第 55 題　What does the author use to support the idea that lullabies can have a soothing effect?", "options": ["Research reports.", "Examples found in history.", "Stories of caretakers.", "The author’s personal experiences."], "answer": 0, "answerLabel": "A", "source": "107 學測｜閱讀測驗｜第 55 題", "explanation": "第二段：Research has shown that lullabies… can soothe——用研究報告支持。(A)。", "explanationSource": "own", "section": "107年"}, {"id": 454, "question": "【閱讀測驗 第 53–56 題】\n@@107-53–56@@\n\n▶ 第 56 題　According to this passage, which of the following statements is true?", "options": ["Scary lullabies better help babies fall asleep.", "Mothers prefer to sing lullabies with a joyful melody.", "Lullabies comfort not only the baby but also the mother.", "Babies react to both the music and the lyrics of lullabies."], "answer": 2, "answerLabel": "C", "source": "107 學測｜閱讀測驗｜第 56 題", "explanation": "第三段：搖籃曲 serve as therapy for the mother——不只安撫嬰兒也安慰母親。(C)。(D) 錯：嬰兒反應的是聲音與旋律，不是歌詞。", "explanationSource": "own", "section": "107年"}, {"id": 455, "question": "第 1 題　John’s clock is not functioning ______. The alarm rings even when it’s not set to go off.", "options": ["tenderly", "properly", "solidly", "favorably"], "answer": 1, "answerLabel": "B", "source": "106 學測｜詞彙｜第 1 題", "explanation": "沒設定也會響，表示時鐘運作「不正常」：properly 正常地。tenderly 溫柔地、solidly 堅固地、favorably 有利地。", "explanationSource": "own", "section": "106年"}, {"id": 456, "question": "第 2 題　Michael has decided to ______ a career in physics and has set his mind on becoming a professor.", "options": ["pursue", "swear", "reserve", "draft"], "answer": 0, "answerLabel": "A", "source": "106 學測｜詞彙｜第 2 題", "explanation": "決定「追求」物理學的職涯，立志當教授：pursue a career。swear 發誓、reserve 保留、draft 起草。", "explanationSource": "own", "section": "106年"}, {"id": 457, "question": "第 3 題　Peter plans to hike in a ______ part of Africa, whe : "第一段：她要做一個「永久固定」在浴室、不用時能收起（可摺疊）的凳子。(A)。", "explanationSource": "own", "section": "105年"}, {"id": 558, "question": "【閱讀測驗 第 45–48 題】\n@@105-45–48@@\n\n▶ 第 48 題　Which of the following sayings best captures the spirit of Jeanie Low's story?", "options": ["Failure is the mother of success.", "There's nothing new under the sun.", "Necessity is the mother of invention.", "Genius is 1% inspiration and 99% perspiration."], "answer": 2, "answerLabel": "C", "source": "105 學測｜閱讀測驗｜第 48 題", "explanation": "因為有實際需要（原本的凳子不好用）而發明——「需要是發明之母」。(C)。", "explanationSource": "own", "section": "105年"}, {"id": 559, "question": "【閱讀測驗 第 49–52 題】\n@@105-49–52@@\n\n▶ 第 49 題　What is this article mainly about?", "options": ["Why people are moving away from their own countries.", "Why there are civil wars and violence in the Middle East.", "Why many schools have become shelters for displaced families.", "Why many children in the Middle East are not attending school."], "answer": 3, "answerLabel": "D", "source": "105 學測｜閱讀測驗｜第 49 題", "explanation": "第一段點題：中東衝突使 1,300 萬兒童無法上學，全文說明原因（學校損毀、人口流離）。(D)。", "explanationSource": "own", "section": "105年"}, {"id": 560, "question": "【閱讀測驗 第 49–52 題】\n@@105-49–52@@\n\n▶ 第 50 題　Why is \"Iraq\" mentioned in the second paragraph?", "options": ["To convince people that temporary housing can be easily found.", "To prove that classrooms there are big enough to host many families.", "To give an example of why schools are not usable for children's learning.", "To show how structural damages of school can affect the quality of education."], "answer": 2, "answerLabel": "C", "source": "105 學測｜閱讀測驗｜第 50 題", "explanation": "第二段：伊拉克的學校被當成流離者的收容所，一間教室住九個家庭——舉例說明學校為何無法供孩子上課。(C)。", "explanationSource": "own", "section": "105年"}, {"id": 561, "question": "【閱讀測驗 第 49–52 題】\n@@105-49–52@@\n\n▶ 第 51 題　What does the phrase \"in the balance\" in the last paragraph most likely mean?", "options": ["Being well taken care of.", "In an uncertain situation.", "Under control by the authority.", "Moving in the wrong direction."], "answer": 1, "answerLabel": "B", "source": "105 學測｜閱讀測驗｜第 51 題", "explanation": "in the balance 懸而未決、前途不確定；上文說 1,300 萬兒童被迫離開教室，一代人的教育前景堪慮。(B)。", "explanationSource": "own", "section": "105年"}, {"id": 562, "question": "【閱讀測驗 第 49–52 題】\n@@105-49–52@@\n\n▶ 第 52 題　According to the passage, which of the following statements is true?", "options": ["The war in Syria has been going on since 2011.", "More than nine thousand schools have been destroyed by wars.", "Thirteen million people have been forced to leave their homes in the Middle East.", "Forty percent of all children in the world are not attending schools due to ongoing conflict."], "answer": 0, "answerLabel": "A", "source": "105 學測｜閱讀測驗｜第 52 題", "explanation": "第三段：敘利亞內戰自 2011 年開始。(A)。(B) 錯：8,500 所；(C) 錯：1,300 萬是失學兒童；(D) 錯：40% 是該地區兒童。", "explanationSource": "own", "section": "105年"}, {"id": 563, "question": "【閱讀測驗 第 53–56 題】\n@@105-53–56@@\n\n▶ 第 53 題　What is the purpose of the study described in this passage?", "options": ["To test if sea snakes lose body water at sea.", "To see whether sea snakes drink water offered to them.", "To find out if sea snakes are greatly reduced in population.", "To prove that sea snakes drink only water coming from rivers."], "answer": 0, "answerLabel": "A", "source": "105 學測｜閱讀測驗｜第 53 題", "explanation": "第二段末：研究團隊想測試海蛇在海上是否會「脫水」。(A)。", "explanationSource": "own", "section": "105年"}, {"id": 564, "question": "【閱讀測驗 第 53–56 題】\n@@105-53–56@@\n\n▶ 第 54 題　Which of the following is true about sea snakes?", "options": ["Their salt glands can remove the salt in the seawater.", "They can drink seawater when it mixes with rainwater.", "The ocean is like a desert to them since they don't drink seawater.", "They usually live near the coastal area where there is more fresh water."], "answer": 2, "answerLabel": "C", "source": "105 學測｜閱讀測驗｜第 54 題", "explanation": "海蛇的鹽腺處理不了海水的鹽，不能喝海水，雨水是唯一淡水來源——海洋對它們來說像沙漠。(C)。(D) 錯：它們遠離陸地。", "explanationSource": "own", "section": "105年"}, {"id": 565, "question": "【閱讀測驗 第 53–56 題】\n@@105-53–56@@\n\n▶ 第 55 題　Which of the following is one of the findings of the study?", "options": ["If a sea snake was dried and weak, it drank more fresh water.", "If captured in the wet season, sea snakes drank a lot of fresh water.", "Most of the sea snakes had lost a lot of body water when captured.", "Dehydration is not a problem among sea snakes since they live at sea."], "answer": 0, "answerLabel": "A", "source": "105 學測｜閱讀測驗｜第 55 題", "explanation": "第三段：越乾癟虛弱的蛇越可能喝水、喝得越多。(A)。(B) 相反：雨季幾乎沒有蛇喝水。", "explanationSource": "own", "section": "105年"}, {"id": 566, "question": "【閱讀測驗 第 53–56 題】\n@@105-53–56@@\n\n▶ 第 56 題　What can be inferred from the study?", "options": ["Sea snakes can easily survive long years of drought.", "Evolution will very likely enable sea snakes to drink seawater.", "Sea snakes will be the last creature affected by global warming.", "The sea snakes' population distribution is closely related to rainfall."], "answer": 3, "answerLabel": "D", "source": "105 學測｜閱讀測驗｜第 56 題", "explanation": "海蛇靠雨水補充水分，脫水可能解釋某些地區海蛇數量減少——族群分布與降雨密切相關。(D)。", "explanationSource": "own", "section": "105年"}, {"id": 567, "question": "第 1 題　Nowadays many companies adopt a ______ work schedule which allows their employees to decide when to arrive at work—from as early as 6 a.m. to as late as 11 a.m.", "options": ["relative", "severe", "primitive", "flexible"], "answer": 3, "answerLabel": "D", "source": "104 學測｜詞彙｜第 1 題", "explanation": "員工可自行決定 6 點到 11 點之間何時上班，是「彈性」工時：flexible。relative 相對的、severe 嚴重的、primitive 原始的。", "explanationSource": "own", "section": "104年"}, {"id": 568, "question": "第 2 題　To teach children right from wrong, some parents will ______ their children when they behave well and punish them when they misbehave.", "options": ["settle", "declare", "reward", "neglect"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 2 題", "explanation": "表現好就「獎勵」、做錯就處罰：reward 與 punish 相對。settle 解決、declare 宣布、neglect 忽視。", "explanationSource": "own", "section": "104年"}, {"id": 569, "question": "第 3 題　To stick to a tight budget, Robert bought a more ______ LED TV instead of a fancy, expensive 3D TV.", "options": ["technical", "significant", "affordable", "expressive"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 3 題", "explanation": "預算有限，買較「負擔得起的」LED 電視而非昂貴的 3D 電視：affordable。technical 技術的、significant 重要的、expressive 表達力強的。", "explanationSource": "own", "section": "104年"}, {"id": 570, "question": "第 4 題　David’s new book made it to the best-seller list because of its beautiful ______ and amusing stories.", "options": ["operations", "illustrations", "engagements", "accomplishments"], "answer": 1, "answerLabel": "B", "source": "104 學測｜詞彙｜第 4 題", "explanation": "因為漂亮的「插圖」和有趣的故事而暢銷：illustrations。operation 操作、engagement 訂婚/參與、accomplishment 成就。", "explanationSource": "own", "section": "104年"}, {"id": 571, "question": "第 5 題　The airport was closed because of the snowstorm, and our ______ for Paris had to be delayed until the following day.", "options": ["movement", "registration", "tendency", "departure"], "answer": 3, "answerLabel": "D", "source": "104 學測｜詞彙｜第 5 題", "explanation": "機場關閉，飛往巴黎的「出發」延到隔天：departure。movement 移動、registration 登記、tendency 傾向。", "explanationSource": "own", "section": "104年"}, {"id": 572, "question": "第 6 題　The moment the students felt the earthquake, they ran ______ out of the classroom to an open area outside.", "options": ["swiftly", "nearly", "loosely", "formally"], "answer": 0, "answerLabel": "A", "source": "104 學測｜詞彙｜第 6 題", "explanation": "感覺到地震就「迅速」跑出教室：swiftly。nearly 幾乎、loosely 鬆散地、formally 正式地。", "explanationSource": "own", "section": "104年"}, {"id": 573, "question": "第 7 題　The ______ capacity of this elevator is 400 kilograms. For safety reasons, it shouldn’t be overloaded.", "options": ["delicate", "automatic", "essential", "maximum"], "answer": 3, "answerLabel": "D", "source": "104 學測｜詞彙｜第 7 題", "explanation": "電梯「最大」載重 400 公斤，不可超載：maximum capacity。delicate 精細的、automatic 自動的、essential 必要的。", "explanationSource": "own", "section": "104年"}, {"id": 574, "question": "第 8 題　An open display of ______ behavior between men and women, such as hugging and kissing, is not allowed in some conservative societies.", "options": ["intimate", "ashamed", "earnest", "urgent"], "answer": 0, "answerLabel": "A", "source": "104 學測｜詞彙｜第 8 題", "explanation": "擁抱、親吻等「親密」行為在保守社會不被允許公開：intimate。ashamed 羞愧的、earnest 認真的、urgent 緊急的。", "explanationSource": "own", "section": "104年"}, {"id": 575, "question": "第 9 題　When taking medicine, we should read the instructions on the ______ carefully because they provide important information such as how and when to take it.", "options": ["medals", "quotes", "labels", "recipes"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 9 題", "explanation": "吃藥前要仔細閱讀「標籤」上的說明：labels。medal 獎牌、quote 引言、recipe 食譜。", "explanationSource": "own", "section": "104年"}, {"id": 576, "question": "第 10 題　The angry passengers argued ______ with the airline staff because their flight was cancelled without any reason.", "options": ["evidently", "furiously", "obediently", "suspiciously"], "answer": 1, "answerLabel": "B", "source": "104 學測｜詞彙｜第 10 題", "explanation": "航班無故取消，乘客「憤怒地」與航空公司人員爭論：furiously。evidently 明顯地、obediently 順從地、suspiciously 懷疑地。", "explanationSource": "own", "section": "104年"}, {"id": 577, "question": "第 11 題　To ______ the new product, the company offered some free samples before they officially launched it.", "options": ["contribute", "impress", "promote", "estimate"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 11 題", "explanation": "為「推銷」新產品，上市前先提供免費試用品：promote。contribute 貢獻、impress 使印象深刻、estimate 估計。", "explanationSource": "own", "section": "104年"}, {"id": 578, "question": "第 12 題　I was worried about my first overseas trip, but my father ______ me that he would help plan the trip so that nothing would go wrong.", "options": ["rescued", "assured", "inspired", "conveyed"], " ["She had to be hospitalized for three weeks whenever she had a cold.", "She didn’t have any insurance, so she went broke because of her illness.", "When test results showed she was fine, her doctor still ordered more tests.", "Her doctor asked her to consult other specialists due to her constant complaints."], "answer": 2, "answerLabel": "C", "source": "104 學測｜閱讀測驗｜第 46 題", "explanation": "第二段：即使檢驗結果是陰性，醫生仍開更多檢查。(C)。(A) 錯：感冒住院是預防措施，非三週；(D) 錯：是輕微不適就轉診。", "explanationSource": "own", "section": "104年"}, {"id": 613, "question": "【閱讀測驗 第 45–48 題】\n@@104-45–48@@\n\n▶ 第 47 題　Who does “they” in the third paragraph most likely refer to?", "options": ["Physicians.", "Other patients.", "Mr. and Mrs. Power.", "The online support groups."], "answer": 0, "answerLabel": "A", "source": "104 學測｜閱讀測驗｜第 47 題", "explanation": "「很難判斷他們何時越線了」——指過度開檢查的醫生。(A)。", "explanationSource": "own", "section": "104年"}, {"id": 614, "question": "【閱讀測驗 第 45–48 題】\n@@104-45–48@@\n\n▶ 第 48 題　Which of the following best describes the author’s attitude toward medical tests?", "options": ["More tests than necessary are too much.", "Medical tests are essential for disease prevention.", "Many tests are needed for confirmation of diagnosis.", "Doctors’ interpretations of test results are seldom wrong."], "answer": 0, "answerLabel": "A", "source": "104 學測｜閱讀測驗｜第 48 題", "explanation": "作者以 overtreatment 可能有害為題，並以案例說明——超過必要的檢查就是太多。(A)。", "explanationSource": "own", "section": "104年"}, {"id": 615, "question": "【閱讀測驗 第 49–52 題】\n@@104-49–52@@\n\n▶ 第 49 題　Which of the following best describes Cartier-Bresson’s family background?", "options": ["His family was rich but was very economical.", "His father went to Paris to open a textile factory.", "His wealthy family went bankrupt and became poor.", "His parents were very liberal in their ways of education."], "answer": 0, "answerLabel": "A", "source": "104 學測｜閱讀測驗｜第 49 題", "explanation": "第二段：家境富裕，但父母節儉到常讓人覺得家裡很窮——有錢但很節省。(A)。", "explanationSource": "own", "section": "104年"}, {"id": 616, "question": "【閱讀測驗 第 49–52 題】\n@@104-49–52@@\n\n▶ 第 50 題　Which of the following is true about Cartier-Bresson’s career in photography?", "options": ["He devoted himself to photography all his life.", "He developed a passion for photography when he traveled to Africa.", "He quit photography right after the publication of The Decisive Moment.", "During World War II, he documented the everyday life of the Indian people."], "answer": 1, "answerLabel": "B", "source": "104 學測｜閱讀測驗｜第 50 題", "explanation": "第四段：1931 年到非洲打獵，非洲「點燃了他另一個興趣：攝影」。(B)。(A)(C) 錯：1968 年轉向繪畫；(D) 錯：是二戰後。", "explanationSource": "own", "section": "104年"}, {"id": 617, "question": "【閱讀測驗 第 49–52 題】\n@@104-49–52@@\n\n▶ 第 51 題　What significance did Cartier-Bresson have to Gandhi of India?", "options": ["He witnessed Gandhi’s assassination in 1948.", "He was the first photographer to take Gandhi’s photo.", "He used photos to document the effect of Gandhi’s death on India.", "His photos told the world who was guilty of assassinating Gandhi."], "answer": 2, "answerLabel": "C", "source": "104 學測｜閱讀測驗｜第 51 題", "explanation": "第五段：他記錄甘地之死及其對印度的衝擊，成為 Life 雜誌最珍貴的攝影專題之一。(C)。", "explanationSource": "own", "section": "104年"}, {"id": 618, "question": "【閱讀測驗 第 49–52 題】\n@@104-49–52@@\n\n▶ 第 52 題　Which of the following is true about Cartier-Bresson’s approach to photography?", "options": ["He never waited for a decisive moment to shoot photos.", "He preferred to edit his images carefully in his darkroom.", "Most of his photos described things that happen every day.", "He experimented with different ways and settled on being a naturalist."], "answer": 2, "answerLabel": "C", "source": "104 學測｜閱讀測驗｜第 52 題", "explanation": "第四段：用手持相機捕捉「日常生活稍縱即逝的瞬間」。(C)。(B) 相反：他討厭暗房效果與裁切。", "explanationSource": "own", "section": "104年"}, {"id": 619, "question": "【閱讀測驗 第 53–56 題】\n@@104-53–56@@\n\n▶ 第 53 題　What is the purpose of this passage?", "options": ["To point out the challenges of the modern lifestyle.", "To discuss how a modern epidemic may spread quickly.", "To explore the effects of regular exercise to our body.", "To explain the threat to our health from long hours of sitting."], "answer": 3, "answerLabel": "D", "source": "104 學測｜閱讀測驗｜第 53 題", "explanation": "全文說明久坐被稱為 sitting disease，講久坐對健康的威脅。(D)。", "explanationSource": "own", "section": "104年"}, {"id": 620, "question": "【閱讀測驗 第 53–56 題】\n@@104-53–56@@\n\n▶ 第 54 題　What does the word “sedentary” in the third paragraph most likely mean?", "options": ["Modern.", "Risky.", "Inactive.", "Epidemic."], "answer": 2, "answerLabel": "C", "source": "104 學測｜閱讀測驗｜第 54 題", "explanation": "sedentary lifestyle 久坐、不活動的生活方式；前文一直在講 sitting。(C)。", "explanationSource": "own", "section": "104年"}, {"id": 621, "question": "【閱讀測驗 第 53–56 題】\n@@104-53–56@@\n\n▶ 第 55 題　What is the best way to bring down high blood sugar level and blood pressure?", "options": ["Exercising for 150 minutes or more every week.", "Getting rid of the habit of car commuting and TV watching.", "Interrupting sitting time with light activity as often as possible.", "Standing or moving around for at least two or three minutes every day."], "answer": 2, "answerLabel": "C", "source": "104 學測｜閱讀測驗｜第 55 題", "explanation": "第二段：一整天中少量、規律的活動，兩三分鐘的短暫活動累加起來就有效——盡量用輕度活動打斷久坐。(C)。(A) 錯：第三段說每週 150 分鐘仍不夠。", "explanationSource": "own", "section": "104年"}, {"id": 622, "question": "【閱讀測驗 第 53–56 題】\n@@104-53–56@@\n\n▶ 第 56 題　Which of the following may be inferred about those who do serious exercise?", "options": ["They often live longer than those who don’t exercise.", "They tend to stand or move around less on days they work out.", "They generally spend less time sitting than those who are inactive.", "They usually do not meet the standard of exercise recommended by WHO."], "answer": 1, "answerLabel": "B", "source": "104 學測｜閱讀測驗｜第 56 題", "explanation": "第三段：規律運動者在運動當天「其他時間活動量少約 30%」。(B)。(C) 錯：不論是否運動，平均都坐 64 小時。", "explanationSource": "own", "section": "104年"}, {"id": 623, "question": "第 1 題　Lost and scared, the little dog ______ along the streets, looking for its master.", "options": ["dismissed", "glided", "wandered", "marched"], "answer": 2, "answerLabel": "C", "source": "103 學測｜詞彙｜第 1 題", "explanation": "走失又害怕的小狗沿街「徘徊」尋找主人：wandered。dismiss 解散、glide 滑行、march 行軍。", "explanationSource": "own", "section": "103年"}, {"id": 624, "question": "第 2 題　On a sunny afternoon last month, we all took off our shoes and walked on the grass with ______ feet.", "options": ["bare", "raw", "tough", "slippery"], "answer": 0, "answerLabel": "A", "source": "103 學測｜詞彙｜第 2 題", "explanation": "脫掉鞋子「光著」腳走在草地上：bare feet。raw 生的、tough 堅韌的、slippery 滑的。", "explanationSource": "own", "section": "103年"}, {"id": 625, "question": "第 3 題　It is both legally and ______ wrong to spread rumors about other people on the Internet.", "options": ["morally", "physically", "literarily", "commercially"], "answer": 0, "answerLabel": "A", "source": "103 學測｜詞彙｜第 3 題", "explanation": "網路散播謠言在法律上和「道德上」都是錯的：morally。physically 身體上、literarily 文學上、commercially 商業上。", "explanationSource": "own", "section": "103年"}, {"id": 626, "question": "第 4 題　These warm-up exercises are designed to help people ______ their muscles and prevent injuries.", "options": ["produce", "connect", "broaden", "loosen"], "answer": 3, "answerLabel": "D", "source": "103 學測｜詞彙｜第 4 題", "explanation": "暖身運動幫助「放鬆」肌肉、預防受傷：loosen。produce 生產、connect 連接、broaden 拓寬。", "explanationSource": "own", "section": "103年"}, {"id": 627, "question": "第 5 題　Mei-ling has a very close relationship with her parents. She always ______ them before she makes important decisions.", "options": ["impresses", "advises", "consults", "motivates"], "answer": 2, "answerLabel": "C", "source": "103 學測｜詞彙｜第 5 題", "explanation": "做重大決定前總會「請教」父母：consults。impress 使印象深刻、advise 建議（主詞應為給建議的人）、motivate 激勵。", "explanationSource": "own", "section": "103年"}, {"id": 628, "question": "第 6 題　The restaurant has a ______ charge of NT$250 per person. So the four of us need to pay at least
