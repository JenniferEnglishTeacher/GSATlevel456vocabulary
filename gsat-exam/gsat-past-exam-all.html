d Japan brought zōris home. The sandals have subsequently undergone redesign, often appearing in bright colors in line with Californian beach culture. They have remained popular due to their convenience, and are often worn with bathing suits or summer clothing. Some people also wear dressy versions for more formal occasions.\nDespite their popularity, flip-flops provoke some questions. Their simple design is responsible for many foot injuries. Another issue is the suitability of exposing feet on the street and places other than the beach. But even more serious is their environmental impact: Millions of plastic discards end up in landfills or the ocean, releasing chemicals and at the same time taking centuries to decompose.", "109-45–48": "Ships are the lifeline of trade among countries. Almost everything, from food to machinery, comes by way of the sea in huge ships piloted by captains. But the captain of a ship is responsible for guiding the vessel until they hit a port, waiting to enter the harbor. The task of bringing the ship into the harbor and anchoring it is taken up by a different captain. This captain is called a marine pilot.\nA marine pilot is a boat pilot with specialized knowledge of a particular port or harbor. The pilot is needed to direct large ships into a port, where there are often deep water channels surrounded by shallower seabeds. Without the services of a marine pilot, docking ships would be hazardous. There would be a real chance of running aground and damaging the ship and the cargo, some of which might be dangerous if released into a water-based ecosystem.\nIn addition to the shallower seabeds, tide and wind pose further challenges for bringing ships into a port. During different tides, currents may change from one direction to the other. The same strategy for docking a vessel during an incoming tide may not work during an outgoing tide. Also, the wind can significantly alter the direction of the ship and how it reacts, adding to the difficulty of anchoring the ship.\nMarine pilotage is a job that requires a high degree of proficiency as well as quick and independent thinking. Above all, it is about risk management. A marine pilot goes on board at a crucial time and controls the vessel based on his or her knowledge of the port and the situation at hand. The pilot is responsible for not only the safety of the ship but also the protection of the port and the marine environment.", "109-49–52": "Probably the most widely used oil in cooking, olive oil is made by crushing olives with stone or steel blades to release the oil. Extra virgin oil, the finest grade, is made from the first pressing of the olives and has a very low acidity rate (under 1%). To be qualified as “extra virgin,” the oil must also pass both an official test in a laboratory and a sensory evaluation by a trained tasting panel. It must be free from impurity, while exhibiting some fruitiness and creating a pleasant bitter flavor along with a peppery sensation in the mouth. Second on the ranking is virgin olive oil. It is also a first pressing, but has a slightly higher acidity level (under 2%). Lastly, pure olive oil is the cheapest olive oil. It is refined to remove its impurities and blended to improve flavor, and is recommended for all-purpose cooking.\nPackaging and storage also have an impact on the quality of olive oil. Olive oil spoils quickly when exposed to direct sunlight, so it should be stored in the dark at 16-18°C. Moisture and oxygen promote oxidation and therefore limit its shelf life. Plastic containers usually do not provide adequate protection from light, heat, or moisture; additionally, small particles in plastics can leak into the oil, which further reduces its quality.\nOlive oil tasters have long adopted descriptive terms such as “pure” and “light” to evaluate the quality of olive oil. Recently, however, the International Olive Council (IOC) is seeking input on test methods to improve the transparency of the testing process and boost the accuracy of the results. A redefinition of the term “olive oil” is also proposed to make a clear distinction between virgin olive oil and pure olive oil. Industry members of the IOC hope to promote the trade of olive oil by initiating these changes.", "109-53–56": "Researchers in Japan have installed on a train a speaker that barks like a dog and snorts like a deer in order to prevent collisions with animals on the tracks.\nThe country has been troubled by a problem with trains colliding with deer on its railways. According to Japan’s transport ministry, there were 613 cases of train services suspended or delayed for at least 30 minutes resulting from collisions with deer and other wild animals in 2016-17.\nDeer are attracted to railway lines because of a need for iron in their diets. They lick the rails to pick up iron filings caused by the action of wheels against tracks. This dietary need has led to a constant battle to keep the deer separate from the unforgiving nature of tons of onrushing rolling stock. In the past, flashing red lights and even lion faces have been unsuccessfully trialed in an attempt to keep deer off the tracks.\nThis new device has been invented by a team at the country’s Railway Technical Research Institute (RTRI). RTRI officials explain that deer have a habit of repeatedly snorting short, shrill sounds to alert other deer when they perceive danger. The barking of the hound, which drives deer to panic, strengthens the effect of the warning noise, according to the RTRI. When the deer hear a combination of a 3-second-long recording of a deer’s snort and 20 seconds of a barking dog, they panic and flee rapidly.\nRTRI researchers say late-night tests, at times when deer are most frequently seen by railway tracks, have resulted in a 45 percent reduction of deer sighting. Future plans include static barking sites where deer are commonly seen, but “the noises will not be blared in areas where people live beside the tracks.”", "108-16–20": "April Fools’ Day, one of the most light-hearted days of the year, has an unclear origin. Some see it as a celebration related to the turn of the seasons from winter to spring; others, however, believe that it __16__ the adoption of a new calendar.\nAncient cultures celebrated New Year’s Day on or around April 1, which roughly coincides with the beginning of spring. In 1582, Pope Gregory XIII ordered a new calendar, which called for New Year’s Day to be celebrated on January 1. However, many people, either refusing to accept the new date or not having heard about it, __17__ to celebrate New Year’s Day on April 1. Other people began to make fun of these traditionalists, sending them on “fool’s errands” or trying to fool them into believing something false. __18__, the practice spread throughout Europe and the rest of the world.\nNowadays, on April Fools’ Day, people often __19__ to create elaborate hoaxes to fool others. Newspapers, radio and TV stations, and websites have participated in the April 1 tradition of making __20__ reports in order to fool their audiences. The BBC once reported that Swiss farmers were experiencing a spaghetti crop and showed scenes of people harvesting noodles from trees. Guess what? Numerous viewers were fooled.", "108-21–25": "The pineapple, a delicious tropical fruit, has been valued for centuries not only for its distinct and unique taste, but also for its miraculous health and medical benefits. But pineapples can also be a fashionable fruit: Pineapple leaves can __21__ a substitute for leather.\nThe idea was developed when a Spanish designer travelling to the Philippines observed a traditional Filipino shirt __22__ together with the fibers of pineapple leaves. After five years of research, she created from pineapple leaves a material which, like real leather, can be used for making bags, shoes, and __23__ textile products. It is an eco-friendly and biodegradable fiber.\nThis eco-friendly leather has clear __24__ for the environment, compared to real leather and synthetic leathers. It requires fewer chemicals, making it safer for the workers in factories. Its manufacture also leaves a smaller carbon footprint. In addition, the leftover material following the removal of fibers can even be used as a natural fertilizer back in the pineapple fields. __25__ its low cost, this innovative material is already being used by many leading fashion companies to make their products.", "108-26–30": "Researchers from a university in Japan have developed “diet-glasses” that play tricks with one’s perception of food, which could be helpful to people on a diet. A camera and a viewing system are built __26__ these glasses. As the wearer brings the food toward their mouth, the camera captures an image of the food. It replays the image back through the glasses after processing it on an attached computer. The size of the food they are about to eat is magnified while __27__ of their hand remains normal. Their brain is __28__ tricked into thinking they are eating more than they really are. The study showed that participants who wore the glasses ate 9.3% less than those who did not wear them.\nThe team has also developed a special device which uses scent bottles and visual trickery to make the wearers of these glasses think that the plain snack they are eating is __29__ than it actually is. The device, for instance, can be set to __30__ one’s favorite flavor. Recent experiments with this device showed that 80% of the participants were fooled by the smell. For example, some participants thought that they were eating a chocolate snack, but in fact they were not.", "108-31–40": "My father started to suffer from memory loss right after his marriage. Or so my mother told us. She said they were married on May 26, while my dad’s memory told him it was June 25. This often __31__ their anniversary celebration, for his rose bouquet always came one month late. Mom seldom asked Dad to go shopping in the traditional market for her. But whenever Dad __32__ on going, she made sure that he brought a shopping list. Dad certainly had the list __33__ when he left for the market, but he would somehow forget it, and then would find it again only after he returned home. Of course, the __34__ that he made were based mainly on his memory of the list. Unfortunately, the items were usually different from Mom’s __35__.\nMy father’s poor memory gave him certain advantages, though. For instance, he was __36__ with many secrets in my family and our community. Because of his poor memory, he had the __37__ of hearing everyone’s private matters. The reason was __38__: Dad would not remember any of it, we thought. As for our neighbors, they liked to invite my father to dinner so that they could tell him stories about their children, parents, friends, and pets. They also believed the secrets in their families would never be __39__. They were quite right, for my father cared __40__ about who did what to whom. But there is one thing he would never forget: showing up for dinner on time.", "108-41–44": "Angelfish, often found in the warm seas and coral reefs, are among the most brightly colored fish of the ocean. Brilliant colors and stripes form amazing patterns on their body. These patterns actually help the fish to hide from danger among roots and plants. At night, when these fish become inactive, their colors may become pale. Often, the young ones are differently colored than the adults. Some scientists believe that the color difference between the young and the old indicates their different social positions.\nAnother interesting fact about angelfish is that they have an occupation in the fish world. Most of them act as cleaners for other fish and pick dead tissue from their bodies. This is not their food, though. Their diet consists mainly of sponge and algae.\nOne particular kind of angelfish, the blackspot angelfish, has a special capability that allows it to change gender from female to male. However, the change is not made at random; it happens for a specific reason. Angelfish live in groups, and each group has one male fish, which is blue in color, and four female fish, which are yellow. The male angelfish is the strongest and largest member of the group. He is the one who protects and looks after the females. When the male dies, the group needs a new “security guard.” This is when the largest female in the group begins to change in appearance. She begins to grow larger in size, and after a week, she starts changing color, from yellow to blue. Slowly, her behavior toward the other fish also changes. She begins behaving like a male. Two weeks later, black stripes appear on her body, indicating the gender change is complete. She is now completely male!", "108-45–48": "Totem poles in North America are poles or posts carved with symbols or figures by Aboriginal peoples of the Northwest Coast. Carved from large, straight trees and painted vibrant colors, the totem poles are not just unique works of art. The coastal peoples have long passed on knowledge from generation to generation through oral traditions, and totem poles were the traditional way of telling the story of an individual family or clan.\nThe totem pole can be grouped into specific categories, depending on its location and the occasion for which it was carved. Welcome poles were traditionally placed on village beachfronts to greet visitors arriving by canoe. Inside the homes of high-ranking chiefs is where house poles were found. The family’s history was carefully carved into each pole. Placed along the rear or front walls of a house, house poles also helped to support the main beam of the roof.\nMemorial poles stood in front of a house. They were erected in memory of a deceased chief or a high-ranking clan member. The poles depicted the person’s accomplishments or family history. Mortuary poles were also raised to honor the dead, but they differed from memorial poles, having a burial box placed at the top of the pole. Inside the burial box were the remains of the deceased.\nWhile many of these poles can still be found in various locations on the west coast of North America, there is one pole that can now only be found in a museum—the shame pole. Traditionally, shame poles were carved for a chief to embarrass and ridicule another who had done something wrong. Once the wrong was made right, the pole was taken down.\nTotem poles are important expressions of specific Aboriginal cultures. Despite the threats posed by cultural and political encroachment of colonial forces, the art of totem pole carving has survived. Aboriginal carvers continue to carve totems as symbols of their cultural pride and clan kinship.", "108-49–52": "Music has a tendency to get stuck in our heads. Sometimes a tune intrudes on our thoughts and then plays, and replays, in a never-ending loop. This interesting phenomenon becomes a subject explored by many scientists. They use a range of terms to describe it—stuck-song syndrome, sticky music, cognitive itch, or most commonly “earworm.” Earworms can run around our heads for several minutes to numerous hours. As the melody repeats, it becomes embedded into our mind. Even though our ears do not hear the tune, our brain continues to play it.\nEarworms often take the form of song fragments rather than entire songs, and the song is usually a familiar one. Researchers are not sure why some songs are more likely to get stuck in our heads than others, but everyone has their own tunes. Often those songs have a simple, upbeat melody and catchy, repetitive lyrics, such as popular commercial jingles and slightly annoying radio hits. Recent or repeated exposure to a song or even a small part of a song can also trigger earworms, as can word associations, such as a phrase similar to the lyrics of a song.\nWhile earworms might be annoying, most people who experience them nevertheless report that they are pleasant or at least neutral. Only a third of people are disturbed by the song in their heads. How people cope with their earworms seems to depend on how they feel about them. Those who have positive feelings about their stuck songs prefer to just “let them be,” while those with negative feelings turn to more behavioral responses, which include coping strategies such as singing, talking, or even praying.", "108-53–56": "Got a bug bite problem? Many people who are troubled by skin rashes caused by bug bites use “foggers,” or “bug bombs,” to get rid of the annoying crawlers in their homes. Many people think these bug killers or pesticides will penetrate every place where the insects hide. Actually, quite the opposite is true. Once the pests detect the chemical fog in the room, they’ll hide themselves in walls or other hideaways, where you’ll never be able to treat them effectively.\nOhio State University researchers tested three commercially sold foggers in a study on the effect of foggers on bedbugs. After testing these brands on five different groups of live bedbugs for two hours, the scientists saw that the foggers had little—if any—effect on the insects. The researchers said bedbugs hide in cracks and crevices such as under sheets and mattresses, or deep in carpets where foggers won’t reach. Moreover, bugs that do come in contact with the mist may be resistant to the pesticide.\nFoggers, or bug bombs, should really be a measure of last resort. First of all, the gases used in bug bombs are highly flammable and thus pose a serious risk of fire or explosion if the product is not used properly. Second, once a bug bomb is used, every surface in your home will be covered with the toxic pesticide. When you use a bug bomb, a chemical mixture rains down on your counters, furniture, floors, and walls, leaving behind oily and toxic substances. Your health might thus be endangered. Therefore, it is suggested that people leave the problem to the professionals.", "107-16–20": "It has long been assumed that creativity is some unusual trait enjoyed by the few. However, according to a wide array of scientific and sociological research, creativity is __16__ a sign of rare genius than a natural human potential. Thus, it can be nurtured and encouraged.\nIt is believed that taking breaks from a problem can help __17__ a moment of insight or stimulate new ideas. Unconventional solutions can also be explored. That is why some of the most successful companies in the world, such as 3M and Google, encourage their employees to __18__ all sorts of relaxing activities, such as playing pinball and wandering about the campus. During such breaks, the mind turns inward, __19__ it can subconsciously puzzle over subtle meanings and connections.\nAnother way to increase creativity is to take risks. This is because many breakthroughs come up when people venture __20__ their usual routines or areas of expertise. This can be done by, for example, learning new skills or traveling to new countries.", "107-21–25": "Hair usually gets greasy when it has not been washed because it soaks up oil—hence the need for shampoo! __21__ this oil-absorbing feature might not always be so great for our hygiene, it can be great for the environment.\nMatter of Trust, a nonprofit organization, has an innovative solution for removing the large-scale oil spill in the Gulf of Mexico in 2010, using the ultimate renewable __22__: human hair, of which there is an unlimited supply. Since its founding in 1998, Matter of Trust has collected donations of human hair and animal fur to __23__ the thousands of oil spills that happen each year. The hair and fur are made into mats and brooms and sent to __24__ waters to absorb the oil.\nAcross the United States each day, 300,000 pounds of hair and fur are cut. Matter of Trust is helping organize the collection of this __25__ hair and fur through thousands of salons, pet groomers, and ranchers. Individuals can also speak to local hair stylists and pet groomers about sending in leftover hair and fur.", "107-26–30": "You must have had this kind of experience: While in the middle of a normal dream, you suddenly realize that you are dreaming. This kind of dream is called a “lucid dream.” The term “lucid” means clear; lucid dreamers know that they are dreaming and __26__ they are dreaming of. It is different from daydreaming. When a person is having a lucid dream, the person’s body is __27__; when a person daydreams, his/her body is awake. Thus, daydreams are really just waking thoughts. In lucid dreams, however, we are completely immersed in the dream world.\nYet, lucid dreaming is __28__ just having a clear dream. It is your chance to play around with the extraordinary abilities buried in unused parts of your brain. __29__, it is a way for you to put the deepest areas of your brain to good use while you’re sleeping. You can be an everyday Jane Doe or John Smith while awake but a superhero while sleeping, __30__ who you are in real life. All the obstacles of reality can be set aside and you are able to accomplish tasks that you could never manage in waking reality.", "107-31–40": "Fortune cookies, commonly served after meals at Chinese restaurants in the U.S., are characterized by a fortune, which is written on a small piece of paper tucked inside the cookie. There are several __31__ stories about the origin of the fortune cookie. None of them, however, has been proven to be entirely true.\nOne of these stories __32__ the cookie’s origin back to 13th- and 14th-century China, which was then occupied by the Mongols. According to the legend, notes of __33__ plans for a revolution to overthrow the Mongols were hidden in mooncakes that would ordinarily have been stuffed with sweet bean paste. The revolution turned out to be __34__ and eventually led to the formation of the Ming Dynasty. This story may sound highly credible, but there seems to be no solid evidence that it inspired the creation of the __35__ we know of today as fortune cookies.\nAnother __36__ claims that David Jung, a Chinese immigrant living in Los Angeles, created the fortune cookie in 1918. Concerned about the poor people he saw wandering near his shop, he made cookies and passed them out free on the streets. Each cookie __37__ a strip of paper inside with an inspirational Bible quotation on it.\nHowever, the more generally accepted story is that the fortune cookie first __38__ in either 1907 or 1914 in San Francisco, created by a Japanese immigrant, Makoto Hagiwara. The fortune cookie was based on a Japanese snack, but Hagiwara sweetened the recipe to appeal to American __39__. He enclosed thank-you notes in the cookies and served them to his guests with tea. Within a few years, Chinese restaurant owners in San Francisco had copied the recipe and __40__ the thank-you notes with fortune notes. Such fortune cookies became common in Chinese restaurants in the U.S. after World War II.", "107-41–44": "For more than two hundred years, the White House has stood as a symbol of the United States Presidency, the U.S. government, and the American people. In 1790, President George Washington declared that the federal government would reside in a district “not exceeding ten miles square … on the river Potomac.” As preparations began, a competition was held to find a builder of the “President’s House.” Nine proposals were submitted, and the Irish-born architect James Hoban won the gold medal for his practical and handsome design. Construction began when the first cornerstone was laid in October of 1792. Although President Washington oversaw the construction of the house, he never lived in it. It was not until 1800, when the White House was nearly completed, that its first residents, President John Adams and his wife Abigail, moved in.\nAmerican presidents can express their individual style in how they decorate the house and in how they receive the public. Thomas Jefferson held the first inaugural open house in 1805; many of those who attended the swearing-in ceremony at the U.S. Capitol simply followed him home. President Jefferson also opened the house for public tours, and it has remained open, except during wartime, ever since. In addition, Jefferson welcomed visitors to annual receptions on New Year’s Day and on the Fourth of July. Abraham Lincoln did the same, but then the inaugural crowds became far too large for the White House to accommodate comfortably, and this also created a security issue. It was not until Grover Cleveland’s first presidency that some effective crowd control measures were implemented to address the problem caused by this practice.\nAt various times in history, the White House has been known as the “President’s Palace,” the “President’s House,” and the “Executive Mansion.” President Theodore Roosevelt officially gave the White House its current name in 1901.", "107-45–48": "West Nile is a tropical disease that begins in birds, which pass it on to mosquitoes that then go on to infect human beings with a bite. Most people who contract West Nile do not experience any symptoms at all, but, if they do, symptoms typically develop between 3 to 14 days after a mosquito bite. About 5 persons suffers fever, headaches, and body aches, usually lasting a week or so. A far less lucky 150 experiences high fever, tremors, paralysis, and coma. Some—especially the elderly and those with weak immune systems—die.\nThat is what made the major outbreaks of West Nile in the U.S. in the summer of 2012 so scary. The situation was particularly bad in Dallas, Texas, where the West Nile virus killed 10 people and sickened more than 200. The city declared a state of emergency and began aerial spraying of a pesticide to kill the mosquitoes, even though residents argued that the pesticide could be more dangerous than the disease.\nWhy was the summer of 2012 so hospitable to the West Nile virus and the mosquitoes that carry it? Blame the weather. An extremely mild winter allowed more mosquitoes than usual to survive, while the unusually high temperatures in that scorching summer further increased their number by speeding up their life cycle. The economic crisis may have also played a role: Homeowners who were not able to pay their bank loans were forced to abandon their properties, sometimes leaving behind swimming pools that made excellent mosquito breeding grounds.\nThe severity of tropical diseases is also a matter of whether governments are capable—and willing—to defend their populations against infections. Dallas County was not doing some of the key things to slow the spread of West Nile, such as testing dead birds and setting mosquito traps to test for the presence of the disease. Tropical infections are thus as much related to government inaction as they are to climate.", "107-49–52": "Most parts of Taiwan have access to sufficient supplies of fresh water for drinking. But fresh water can be in short supply in many arid regions of the world such as Saudi Arabia, where there are limited water resources. As the world population continues to grow, shortages of fresh water will occur more often and the need for additional water supplies will become critical. Some may ask, “Since the ocean covers more than 70 percent of the Earth, why not just get drinking water from the ocean?”\nTo turn seawater into fresh water, we need to remove the salt in seawater, that is, to desalinate seawater. The problem is that the desalination of water requires a lot of energy. Salt dissolves very easily in water, forming strong chemical bonds, and those bonds are difficult to break. The energy and technology to desalinate water are both expensive, and this means that desalinating water can be costly.\nThere are environmental costs of desalination as well. Sea life can get sucked into desalination plants, killing small ocean creatures like baby fish and plankton, upsetting the food chain. Also, there is the problem of what to do with the separated salt, which is left over as a very concentrated brine. Pumping this super-salty water back into the ocean can harm local aquatic life. Reducing these impacts is possible, but it adds to the costs.\nDespite the economic and environmental hurdles, desalination is becoming increasingly attractive as human beings are using up fresh water from other sources. At present, desalinating seawater is the only viable way to provide water to growing populations in rural areas of the Middle East and North Africa. Therefore, the race is on to find a cheaper, cleaner, and more energy-efficient way of desalinating seawater, and promising new findings are being reported.", "107-53–56": "Four millennia ago, an ancient Babylonian wrote down what is possibly the first lullaby. It is a rather threatening lullaby, in which the baby is scolded for disturbing the house god with its crying and warned of terrifying consequences. It may have got the baby to sleep, but its message is far from comforting: If he/she does not stop crying, the demon will eat him/her. This lullaby may sound more scary than sleep-inducing, yet it is true that many lullabies—including those sung today—have dark undertones.\nResearch has shown that lullabies, when used correctly, can soothe and possibly even help to heal an infant; but it is the caretaker’s voice and the rhythm and melody of the music that babies respond to, not the content of the song. Then, what is the function of the content? According to studies, some lullabies provide advice, like the Babylonian lullaby, and quite a few others offer the space to sing the unsung, say the unsayable. Lyrics to those lullabies can indeed be interpreted as a reflection of the caregiver’s emotions.\nResearchers believe that a large part of the function of lullabies is to help a mother vocalize her worries and concerns. The mother’s fear of loss especially makes sense since the infant/toddler years of life are fragile ones. Since there is a special physical bond between mother and child during this period, mothers feel they can sing to their child about their own fears and anxieties. Lullabies, therefore, serve as therapy for the mother. In addition, the songs are seemingly trying to work some magic—as if, by singing, the mother is saying, “Sadness has already touched this house; no need to come by again.”", "106-16–20": "You begin to notice a bit of pain on your eyelid each time you blink. You __16__ the mirror to find a tiny red spot on the base of your lower lashes. These __17__ are probably the beginning of an eye stye.\nAn eye stye is a small bump, resembling a pimple, that develops when an oil gland at the edge of an eyelid becomes infected by bacteria. These bacteria are found in the nose and are easily __18__ to the eye when you rub your nose, then your eye. Pus will build up in the center of the stye, causing a yellowish spot. Usually a stye is accompanied by a swollen eye. __19__ a stye can look unpleasant at times, it is usually harmless and doesn’t cause vision problems. Most styes heal on their own within a few days. You might speed up healing time by gently pressing a warm washcloth __20__ your eyelid for 10 minutes, 3 or 4 times a day. Make sure you don’t squeeze or pop a stye like you would a pimple. Doing so may cause a severe eye infection.", "106-21–25": "Shoes are hugely important for protecting our feet, especially in places like Africa, where healthcare provision is limited. Unfortunately, shoes are not always readily available for people living in poverty, __21__ shoes that are the right size. Almost as soon as a child receives shoes to wear, he/she is likely to have grown out of them. Then the child has to __22__ with shoes that are too small. The Shoe That Grows, created by a charity called Because International, changes all this. It allows children to __23__ their shoes’ size as their feet grow.\nThe innovative footwear resembles a common sandal and is made of leather straps and rubber soles, a material similar to that used in tires. They come __24__ two sizes, and can expand in three places. The straps on the heel and toe control the length of the shoe, __25__ the two on either side allow for different widths. With this special design, the shoes can “grow” up to five sizes and last for at least five years.", "106-26–30": "Research has proven that weather plays a part in our moods: Warmer temperatures and exposure to sunshine increase positive thinking, whereas cold, rainy days bring anxiety and fatigue. __26__, many people believe that bad weather can reduce productivity and efficiency.\nThere is, however, a significant __27__ between such beliefs and the actual effect of weather on people’s performance at work. Using empirical data from laboratory experiments __28__ observations of a mid-sized Japanese bank in real life, researchers find that weather conditions indeed influence a worker’s focus. When the weather is bad, individuals tend to focus more on their work rather than thinking about activities they could __29__ outside of work. But photos showing outdoor activities, such as sailing on a sunny day or walking in the woods, can greatly distract workers and thus __30__ their productivity. The findings conclude that workers are actually most productive when the weather is lousy—and only if nothing reminds them of good weather.", "106-31–40": "The widespread popularity of onions is not limited to modern-day kitchens. There is evidence of onions being used for culinary and medicinal purposes all over the ancient world. Nonetheless, no culture __31__ onions quite as much as the ancient Egyptians. For them, the onion was not just food or medicine; it held significant __32__ meaning. Onions were considered to be __33__ of eternal life. The circle-within-a-circle structure of an onion, for them, __34__ the eternity of existence. According to certain documents, ancient Egyptians also used onions for medicinal purposes, but they likely would have viewed the __35__ power of the vegetable as magical, rather than medical.\nOnions are depicted in many paintings __36__ inside pyramids and tombs that span the history of ancient Egypt. They __37__ as a funeral offering shown upon the altars of the gods. The dead were buried with onions and onion flowers on or around various __38__ of their bodies. Mummies have also been found with onions and onion flowers __39__ their pelvis, chest, ears, eyes, and feet.\nSome scholars theorize that onions may have been used for the dead because it was believed that their strong scent would __40__ the dead to breathe again. Other researchers believe it was because onions were known for their special curative properties, which would be helpful in the afterlife.", "106-41–44": "Is your dog an Einstein or a Charmer? For US $60, a recently-founded company called Dognition will help you learn more about your dog’s cognitive traits. It offers an online test telling you about the brain behind the bark.\nDognition’s test measures a dog’s intellect in several aspects—from empathy to memory to reasoning skills. But don’t expect it to measure your pet’s IQ. Dr. Hare, one of the venture’s co-founders, says a dog’s intelligence can’t be described with a single number. Just as humans have a wide range of intelligences, so do dogs. The question is what type your dog relies on more.\nAfter you plunk your money down, Dognition’s website will take you through a questionnaire about your dog: For example, how excited does your dog get around other dogs, or children? Do fireworks scare your pup? Then, Dognition guides you through tests that are as fun as playing fetch or hide-and-seek. At the end, you get a report of your dog’s cognitive profile.\nYour dog could fall into one of nine categories: Ace, Stargazer, Maverick, Charmer, Socialite, Protodog, Einstein, Expert, or Renaissance Dog. That can give you something to brag about on Dognition’s Facebook page. It also can shed new light on why dogs do the things they do. For example, a Charmer is a dog that trusts you so much that it would prefer to solve problems using information you give it rather than information it can get with its own eyes.\nDognition helps people understand their dogs in ways that they have never been able to do. This new understanding can enrich the relationship between dogs and their owners.", "106-45–48": "Capoeira is a martial art that combines elements of fight, acrobatics, drumming, singing, dance, and rituals. It involves a variety of techniques that make use of the hands, feet, legs, arms, and head. Although Capoeira appears dancelike, many of its basic techniques are similar to those in other martial arts.\nCapoeira was created nearly 500 years ago in Brazil by African slaves. It is believed that the martial art was connected with tribal fighting in Africa, in which people fought body to body, without weapons, in order to acquire a bride or desired woman. In the sixteenth century, when the Africans were taken from their homes to Brazil against their will and kept in slavery, Capoeira began to take form among the community of slaves for self-defense. But it soon became a strong weapon in the life-or-death struggle against their oppressors. When the slave owners realized the power of Capoeira, they began to punish those who practiced it. Capoeiristas learned to camouflage the forbidden fights with singing, clapping, and dancing as though it were simply entertainment.\nAt first, Capoeira was considered illegal in Brazil. However, a man known as Mestre Bimba devoted a great deal of time and effort to convincing the Brazilian authorities that Capoeira has great cultural value and should become an official fighting style. He succeeded in his endeavor and transformed the martial art into Brazil’s national sport. He and Mestre Pastinha were the first to open schools, and the Capoeira tree grew, spreading its branches across the world. Nowadays, it is performed in movies and music clips. Capoeira is also believed to have influenced several dancing styles like breaking and hip-hop.", "106-49–52": "Winslow Homer (1836-1910) is regarded by many as the greatest American painter of the nineteenth century. Born and raised in Boston, he began his career at age eighteen in his hometown, working as an apprentice at a printing company. Skilled at drawing, he soon made a name for himself making illustrations for novels, sheet music, magazines, and children’s books.\nHe then moved to New York City, where he worked as a freelance illustrator with Harper’s Weekly, a popular magazine of the time, and began painting. Homer was assigned to cover the inauguration of President Lincoln and, later, the Civil War. His pictures of the Union troops won international recognition. Homer moved to England and, after a two-year stay, returned to America. He settled permanently in Maine in 1883.\nFrom the late 1850s until his death in 1910, Winslow Homer produced a body of work distinguished by its thoughtful expression and its independence from artistic conventions. A man of multiple talents, Homer excelled equally in the arts of illustration, oil painting, and watercolor. Many of his works—depictions of children at play and in school, farm girls attending to their work, hunters and their prey—have become classic images of nineteenth-century American life. Others speak to more universal themes such as the primal relationship of humans to nature.\nThis two-week exhibition highlights a wide and representative range of Homer’s art. It shows his extraordinary career from the battlefields, farmland, and coastal villages of America, to the North Sea fishing village of Cullercoats, the rocky coast of Maine, the Adirondacks, and the Caribbean. The exhibition offers viewers an opportunity to experience and appreciate the breadth of his remarkable artistic achievement.", "106-53–56": "Tea, the most typical English drink, became established in Britain because of the influence of a foreign princess, Catherine of Braganza, the queen of Charles II. A lover of tea since her childhood in Portugal, she brought tea-drinking to the English royal court and set a trend for the beverage in the seventeenth century. The fashion soon spread beyond the circle of the nobility to the middle classes, and tea became a popular drink at the London coffee houses where people met to do business and discuss events of the day. Many employers served a cup of tea to their workers in the middle of the morning, thus inventing a lasting British institution, the “tea break.” However, drinking tea in social settings outside the workplace was beyond the means of the majority of British people. It came with a high price tag and tea was taxed as well.\nAround 1800, the seventh Duchess of Bedford, Anne Maria, began the popular practice of “afternoon tea,” a ceremony taking place at about four o’clock. Until then, people did not usually eat or drink anything between lunch and dinner. At approximately the same time, the Earl of Sandwich popularized a new way of eating bread—in thin slices, with something (e.g., jam or cucumbers) between them. Before long, a small meal at the end of the afternoon, involving tea and sandwiches, had become part of the British way of life.\nAs tea became much cheaper during the nineteenth century, its popularity spread right through all corners of the British society. Thus, tea became Britain’s favorite drink. In working-class households, it was served with the main meal of the day, eaten when workers returned home after a day’s labor. This meal has become known as “high tea.”\nToday, tea can be drunk at any time of the day, and accounts for over two-fifths of all beverages consumed in Britain—with the exception of water.", "105-16–20": "Bill and Sam decided to kidnap the son of a banker to compensate for their business loss. They kidnapped the boy and hid him in a cave. They asked for a ransom of $2,000 to return the boy. __16__, their plan quickly got out of control. Their young captive __17__ to be a mischievous boy. He viewed the kidnapping as a wonderful camping trip. He demanded that his kidnappers play tiring games with him, such as riding Bill as a horse for nine miles. Bill and Sam were soon desperate and decided to __18__ the little terror. They lowered the price to $1,500. Yet, knowing perfectly well __19__ a troublemaker his son was, the father refused to give them any money. __20__, he asked the kidnappers to pay him $250 to take the boy back. To persuade the boy to return home, Bill and Sam had to tell him that his father was taking him bear-hunting. The kidnappers finally handed over the boy and $250 to the banker and fled town as quickly as they could.", "105-21–25": "A polygraph machine, also known as a “lie detector,” is a common part of criminal investigations. The instrument is used to measure __21__ a person’s body reacts to questions. The theory underlying it is that lying is stressful, and that this stress can be measured and recorded on a polygraph machine.\nWhen a person takes a polygraph test, four to six wires, called sensors, are __22__ to different parts of his body. The sensors pick up signals from the person’s blood pressure, pulse, and perspiration. __23__ the process of questioning, all the signals are recorded on a single strip of moving paper. Once the questions are finished, the examiner analyzes the results to determine if the person tested __24__ truthful.\nWell-trained examiners can usually detect lying with a high degree of __25__ when they use a polygraph. However, because different people behave differently when lying, a polygraph test is by no means perfect.", "105-26–30": "International trade is the exchange of goods and services between countries. Trade is driven by different production costs in different countries, making __26__ cheaper for some countries to import goods rather than make them. A country is said to have a comparative advantage over another when it can produce a commodity more cheaply. This comparative advantage is __27__ by key factors of production such as land, capital, and labor.\nWhile international trade has long been conducted in history, its economic, social, and political importance has been __28__ in recent centuries. During the 1990s, international trade grew by nearly 8.6% each year. In the year 1990 alone, the growth in trade in services was as high as 19%.\nToday, all countries are involved in, and to varying degrees dependent on, trade with other countries. __29__ international trade, nations would be limited to the goods and services produced within their own borders. Trade is certainly a main __30__ force for globalization. It is also the subject of many international agreements that aim to govern and facilitate international trade, such as those negotiated through the World Trade Organization (WTO).", "105-31–40": "Are forests always created by nature? A man from rural India proves that this is not necessarily __31__.\nAbdul Kareem, who used to be an airline ticketing agent, has a great love for the woods. Though he never went to college, he can talk about plants and trees like an expert. In 1977, he bought a piece of rocky wasteland with the __32__ of growing trees on it. In the beginning, people thought he was __33__ to waste his time and money on the land. But he simply __34__ them and kept working on the soil and planting trees there. The land was so __35__ that it had to be watered several times a day. Kareem had to fetch the water from a source that was a kilometer away. In the first two years, none of the trees he planted __36__. However, in the third year, several young trees started growing. Greatly __37__ by the result, Kareem planted more trees and his man-made forest began to take shape.\nKareem let his forest grow naturally, without using fertilizers or insecticides. He believed in the ability of nature to renew itself without the __38__ of humans. That’s why he did not allow fallen leaves or twigs from the forest to be removed.\nAfter years of hard work, Kareem has not only realized his dream but also transformed a piece of __39__ property into a beautiful forest. Today, his forest is home to 1,500 medicinal plants, 2,000 varieties of trees, rare birds, animals, and insects. Now, scientists from all over the world come to visit his __40__. They hope to find the secret of his success.", "105-41–44": "In Japan, a person's blood type is popularly believed to decide his/her temperament and personality. Type-A people are generally considered sensitive perfectionists and good team players, but over-anxious. Type Os are curious and generous but stubborn. Type ABs are artistic but mysterious and unpredictable, and type Bs are cheerful but eccentric, individualistic, and selfish. Though lacking scientific evidence, this belief is widely seen in books, magazines, and television shows. The blood-type belief has been used in unusual ways. The women's softball team that won gold for Japan at the Beijing Olympics is reported to have used blood-type theories to customize training for each player. Some kindergartens have adopted teaching methods along blood group lines, and even major companies reportedly make decisions about assignments based on an employee's blood type. In 1990, Mitsubishi Electronics was reported to have announced the formation of a team composed entirely of AB workers, thanks to \"their ability to make plans.\" The belief even affects politics. One former prime minister considered it important enough to reveal in his official profile that he was a type A, while his opposition rival was type B. In 2011, a minister, Ryu Matsumoto, was forced to resign after only a week in office, when a bad-tempered encounter with local officials was televised. In his resignation speech, he blamed his failings on the fact that he was blood type B. The blood-type craze, considered simply harmless fun by some Japanese, may manifest itself as prejudice and discrimination. In fact, this seems so common that the Japanese now have a term for it: bura-hara, meaning blood-type harassment. There are reports of discrimination leading to children being bullied, ending of happy relationships, and loss of job opportunities due to blood type.", "105-45–48": "Like many other five-year-olds, Jeanie Low of Houston, Texas, would use a stool to help her reach the bathroom sink. However, the plastic step-stool she had at home was unstable and cluttered up the small bathroom shared by her whole family. After learning of an invention contest held by her school that year, Jeanie resolved to enter the contest by creating a stool that would be a permanent fixture in the bathroom, and yet could be kept out of the way when not in use. Jeanie decided to make a stool attached to the bathroom cabinet door under the sink. She cut a plank of wood into two pieces, each about two feet wide and one foot long. Using metal hinges, Jeanie attached one piece of the wood to the front of the cabinet door, and the second piece to the first. The first piece was set just high enough so that when it swung out horizontally from the cabinet door, the second piece would swing down from the first, just touching the ground, and so serving as a support for the first piece of the wood. This created a convenient, sturdy platform for any person too short to reach the sink. When not in use, the hinges allowed the two pieces of wood to fold back up tightly against the cabinet, where they were held in place by magnets. Jeanie called her invention the \"Kiddie Stool.\" Jeanie's Kiddie Stool won first place in her school's contest. Two years later, it was awarded first prize again at Houston's first annual Invention Fair. As a result, Jeanie was invited to make a number of public appearances with her Kiddie Stool, and was featured on local TV as well as in newspapers. Many people found the story of the Kiddie Stool inspiring because it showed that with imagination, anyone can be an inventor.", "105-49–52": "Ongoing conflicts across the Middle East have prevented more than 13 million children from attending school, according to a report published by UNICEF, the United Nations Children's Fund. The report states that 40% of all children across the region are currently not receiving an education, which is a result of two consequences of violence: structural damage to schools and the displacement of populations, also called \"forced migration.\" Both issues result from the tide of violence that has crossed the region in recent years. The report examines nine countries where a state of war has become the norm. Across these countries, violence has made 8,500 schools unusable. In certain cases, communities have relied on school buildings to function as shelters for the displaced, with up to nine families living in a single classroom in former schools across Iraq. The report pays particularly close attention to Syria, where a bloody civil war has displaced at least nine million people since the war began in 2011. With the crisis now in its fifth year, basic public services, including education, inside Syria have been stretched to breaking point. Within the country, the quality and availability of education depends on whether a particular region is suffering violence. The report concludes with an earnest request to international policymakers to distribute financial and other resources to ease the regional crisis. With more than 13 million children already driven from classrooms by conflict, it is no exaggeration to say that the educational prospects of a generation of children are in the balance. The forces that are crushing individual lives and futures are also destroying the prospects for an entire region.", "105-53–56": "Many marine animals, including penguins and marine iguanas, have evolved ways to get rid of excess salt by using special salt-expelling glands around their tongue. However, the sea snake's salt glands cannot handle the massive amounts of salt that would enter their bodies if they actually drank seawater. This poses a serious problem when it comes to getting enough water to drink. If seawater is not an option, how does this animal survive in the ocean? An international team of researchers focused on a population of yellow-bellied sea snakes living near Costa Rica, where rain often does not fall for up to seven months out of the year. Because yellow-bellied sea snakes usually spend all of their time far from land, rain is the animals' only source of fresh water. When it rains, a thin layer of fresh water forms on top of the ocean, providing the snakes with a fleeting opportunity to lap up that precious resource. But during the dry season when there is no rain, snakes presumably have nothing to drink. Thus, the team became interested in testing whether sea snakes became dehydrated at sea. The researchers collected more than 500 yellow-bellied sea snakes and weighed them. They found that during the dry season about half of the snakes accepted fresh water offered to them, while nearly none did during the wet season. A snake's likelihood to drink also correlated with its body condition, with more withered snakes being more likely to drink, and to drink more. Finally, as predicted, snakes captured during the dry season contained significantly less body water than those scooped up in the rainy season. Thus, it seems the snake is able to endure certain degrees of dehydration in between rains. Scientists believe that dehydration at sea may explain the declining populations of sea snakes in some parts of the world.", "104-16–20": "Tai Chi Chuan is a type of ancient Chinese martial art. People __16__ Tai Chi mainly for its health benefits. This centuries-old Chinese mind-body exercise is now gaining popularity in the United States.\nThe most familiar aspect of Tai Chi Chuan is the hand form, which is a series of slow-flowing movements with poetic names __17__ “dragons stirring up the wind” and “wave hands like clouds.” These movements, forming an exercise system, __18__ one to effortlessly experience the vital life force, or the Qi energy, in one’s body.\nTai Chi Chuan is not only a physical but also a __19__ exercise. Psychologically, this exercise may increase communication between the body and the mind and enable one to deal with other people more effectively. It __20__ stress and creates calmness and confidence. Relaxation and a feeling of joy are among the first noticeable differences in a Tai Chi student.", "104-21–25": "Much like the dove and robin, the bluebird is considered a very lucky sign in most cultures, particularly when seen in the spring. __21__, a woodpecker, when seen near the home, is regarded as a good sign. In contrast, the peacock is not __22__ seen as lucky. In places like India, the peacock is considered lucky because the great many “eyes” on its feathers are said to alert it to __23__ evil. Peacocks are also highly valued in China and Japan, where they are kept as symbols by the ruling families to __24__ their status and wealth. However, the peacock receives only scorn from the rest of the world. The feathers of peacocks are considered the most __25__ part of the bird because the eye-shaped markings on them are associated with “evil eyes.” To bring the evil eye into the home is thus believed to invite trouble and sorrow.", "104-26–30": "Nutritional products that can be collected from trees include fruits, nuts, seeds, leaves, and bark. Tree products have been an important part of diets for thousands of years, from early humans __26__ fruits and nuts to the first cultivation of important trees, such as mango and apple.\nThe apple is one of the world’s most cultivated fruit trees, __27__ over 7,000 different kinds in existence. Despite their great __28__, however, most domesticated apples can be traced back to a common ancestor, the wild apple of Central Asia, Malus sieversii. Apples have been grown for thousands of years in Asia and Europe, and __29__ to North America by European colonists in the 17th century. Today, apples are __30__ eaten the world over and form the basis for multi-million dollar industries. In 2005, at least 55 million tons of apples were grown worldwide, which generated a value of about $10 billion.", "104-31–40": "A paperclip, made of steel wire bent into a hooped shape, is an instrument used to hold sheets of paper together. This common __31__ is a wonder of simplicity and function. But where did this simple, cheap, and indispensable invention come from?\nIn the late 19th century, the most common way to hold papers together was by using a pin. Although the pin was an inexpensive tool and was easily __32__, it would leave holes in the paper. Later, as steel wire became more common, inventors began to notice its elastic feature. With this feature, it could be stretched and __33__ various clip-like objects. In the years just prior to 1900, quite a few paperclip designs emerged. The name most frequently __34__ the paperclip invention is Johan Vaaler, a Norwegian inventor. However, Vaaler’s clips were not the same as the paperclips currently in use. Specifically, they did not have the interior loop we see today. The __35__ looped design was invented by Gem Manufacturing Ltd. in England. This clip is therefore sometimes __36__ the Gem clip.\nBecause of Vaaler, the paperclip played an important __37__ role in Norway. During World War II, Norway was occupied by the Nazis. Norwegians were prohibited from wearing any __38__ of their national unity, such as buttons with the initials of their king. Thus, in __39__, they started wearing paperclips to show their solidarity. The reason for doing this was simple: Paperclips were a Norwegian invention whose original function was to bind together. After the war, a giant paperclip statue was erected in Oslo to __40__ Vaaler—even though his design was never actually manufactured.", "104-41–44": "In 2009, the Taiwu Elementary School Folk Singers were invited to perform in Belgium, France, Germany, and Luxemburg. In 2011, they were voted as one of the world’s top five performance groups by audiences of Japan Broadcasting Corporation’s Amazing Voice program.\nRecalling the group’s first tour in Europe, Camake Valaule, a physical education teacher and the founder of the Taiwu Elementary School Folk Singers, admitted that he felt very nervous. He was worried that the audience would fall asleep since most of the 75-minute performance was a cappella, that is, singing without instrumental sound. Surprisingly, the audience listened with full focus and high spirits. Camake said, “They told me afterward that through our performance, they had a vision of our country, our village, without having to visit it. This experience greatly boosted our confidence.”\nAccording to Camake Valaule, singing traditional ballads has helped students and their parents to re-understand their culture. “It used to be that the only ones who could sing these songs were tribal elders aged between 50 and 60. Now with the children performing the pieces, parents are beginning to ask, ‘Why do we not know how to sing these ballads?’ Many times nowadays, it is the children who teach the songs to their parents, putting back the pieces of a blurred memory.”\nWinning international fame, however, was neither the original intention nor the main reason why Camake founded the group in 2006. The most important thing was to make children understand why they sing these songs and to preserve and pass on their culture. Referring to the relocation of Taiwu Elementary School and Taiwu Village following Typhoon Morakot in August 2009, Camake said, “We could not take the forest or our houses in the mountains with us; but we were able to bring our culture along. As long as the children are willing to sing, I will always be there for them, singing with them and leading them to experience the meaning of the ballads.”", "104-45–48": "When it comes to medical care, many patients and doctors believe “more is better.” But what they do not realize is that overtreatment—too many scans, too many blood tests, too many procedures—may pose harm. Sometimes a test leads you down a path to more and more testing, some of which may be invasive, or to treatment for things that should be left alone.\nTerrence Power, for example, complained that after his wife learned she had Wegener’s disease, an uncommon disorder of the immune system, they found it difficult to refuse testing recommended by her physician. The doctor insisted on office visits every three weeks, even when she was feeling well. He frequently ordered blood tests and X-rays, and repeatedly referred her to specialists for even minor complaints. Even when tests came back negative, more were ordered, and she was hospitalized as a precaution when she developed a cold. She had as many as 25 doctor visits during one six-month period. The couple was spending about $30,000 a year for her care.\nAfter several years of physical suffering and near financial ruin from the medical costs, the couple began questioning the treatment after consulting with other patients in online support groups. “It’s a really hard thing to determine when they’ve crossed the line,” Mr. Power said. “You think she’s getting the best care in the world, but after a while you start to wonder: What is the objective?” Mr. Power then spoke with his own primary care doctor, who advised him to find a new specialist to oversee Mrs. Power’s care. Under the new doctor’s care, the regular testing stopped and Mrs. Power’s condition stabilized. Now she sees the doctor only four or five times a year.", "104-49–52": "Henri Cartier-Bresson (1908–2004) is one of the most original and influential figures in the history of photography. His humane, spontaneous photographs helped establish photojournalism as an art form.\nCartier-Bresson’s family was wealthy—his father made a fortune as a textile manufacturer—but Cartier-Bresson later joked that due to his parents’ frugal ways, it often seemed as though his family was poor.\nEducated in Paris, Cartier-Bresson developed an early love for literature and the arts. As a teenager, Cartier-Bresson rebelled against his parents’ formal ways of education. In his early adulthood, he even drifted toward communism. But it was art that remained at the center of his life.\nCartier-Bresson traveled to Africa in 1931 to hunt antelope and boar. And Africa fueled another interest in him: photography. He then wandered around the world with his camera, using a handheld camera to catch images from fleeting moments of everyday life.\nNot long after World War II, Cartier-Bresson traveled east, spending considerable time in India, where he met and photographed Gandhi shortly before his assassination in 1948. Cartier-Bresson’s subsequent work to document Gandhi’s death and its immediate impact on the country became one of Life Magazine’s most prized photo essays.\nCartier-Bresson’s approach to photography remained much the same throughout his life. He made clear his dislike of images that had been improved by artificial light, darkroom effects, and even cropping. The naturalist in Cartier-Bresson believed that all editing should be done when the photo is taken. In 1952, his first book, The Decisive Moment, a rich collection of his work spanning two decades, was published. “There is nothing in this world that does not have a decisive moment,” he said.\nIn 1968, he began to turn away from photography and returned to his passion for drawing and painting.", "104-53–56": "You’ve most likely heard the news by now: A car-commuting, desk-bound, TV-watching lifestyle can be harmful to our health. All the time that we spend rooted in the chair is linked to increased risks of so many deadly diseases that experts have named this modern-day health epidemic the “sitting disease.”\nSitting for too long slows down the body’s metabolism and the way enzymes break down our fat reserves, raising both blood sugar levels and blood pressure. Small amounts of regular activity, even just standing and moving around, throughout the day is enough to bring the increased levels back down. And those small amounts of activity add up—30 minutes of light activity in two or three-minute bursts can be just as effective as a half-hour block of exercise. But without that activity, blood sugar levels and blood pressure keep creeping up, steadily damaging the inside of the arteries and increasing the risk of diabetes, heart disease, stroke, and other serious diseases. In essence, fundamental changes in biology occur if you sit for too long.\nBut wait, you’re a runner. You needn’t worry about the harm of a sedentary lifestyle because you exercise regularly, right? Well, not so fast. Recent studies show that people spend an average of 64 hours a week sitting, whether or not they exercise 150 minutes a week as recommended by World Health Organization (WHO). Regular exercisers, furthermore, are found to be about 30 percent less active on days when they exercise. Overall, most people simply aren’t exercising or moving around enough to counteract all the harm that can result from sitting nine hours or more a day.\nScared straight out of your chair? Good. The remedy is as simple as standing up and taking activity breaks.", "103-16–20": "Aesop, the Greek writer of fables, was sitting by the roadside one day when a traveler asked him what sort of people lived in Athens. Aesop replied, “Tell me where you come from and what sort of people live there, and I’ll tell you what sort of people you’ll find in Athens.” __16__, the man answered, “I come from Argos, and there the people are all friendly, generous, and warm-hearted. I love them.” __17__ this, Aesop answered, “I’m happy to tell you, my dear friend, that you’ll find the people of Athens much the same.”\nA few hours later, __18__ traveler came down the road. He too stopped and asked Aesop the same question. __19__, Aesop made the same request. But frowning, the man answered, “I’m from Argos and there the people are unfriendly, __20__, and vicious. They’re thieves and murderers, all of them.” “Well, I’m afraid you’ll find the people of Athens much the same,” replied Aesop.", "103-21–25": "Every year tens of thousands of tourists visit Mount Kilimanjaro, the highest mountain in Tanzania, Africa, to witness the scenes depicted in Earnest Hemingway’s The Snows of Kilimanjaro. They are attracted by the American writer’s __21__ of the millennia-old glaciers. However, this tourist attraction will soon __22__. According to the Climate Change Group, formed by environmentalists worldwide to document the effects of global warming, Mount Kilimanjaro’s snows and glaciers are melting and are __23__ to disappear by 2020. Not only will the summit lose its tourist attraction, but the disappearance of the snows will also cause major damage to the ecosystem on the dry African plains at its base. __24__ the snow covering the peak, there will not be enough moisture and water to nourish the plants and animals below. Rising temperatures, an effect of global warming, __25__ threaten the ecosystem of this mountain area. The loss of snows on the 5,892m peak, which have been there for about 11,700 years, could have disastrous effects on Tanzania.", "103-26–30": "Most human beings actually decide before they think. When people encounter a complex issue and form an opinion, how thoroughly have they __26__ all the important factors involved before they make their decisions? The answer is: not very thoroughly, __27__ they are executives, specialized experts, or ordinary people in the street. Very few people, no matter how intelligent or experienced, can __28__ all the possibilities or outcomes of a policy or a course of action within just a short period of time. Those who take pride in being decisive often try their best to consider all the factors beforehand. __29__, it is not unusual for them to come up with a decision before they have the time to do so. And __30__ an opinion is formed, most of their thinking then is simply trying to find support for it.", "103-31–40": "In English-speaking cultures, the choice of first names for children can be prompted by many factors: tradition, religion, nature, culture, and fashion, to name just a few.\nCertain people like to give a name that has been handed down in the family to show __31__ for or to remember a relative whom they love or admire. Some families have a tradition of __32__ the father’s first name to the first born son. In other families, a surname is included in the selection of a child’s given name to __33__ a family surname going. It may be the mother’s maiden name, for instance.\nFor a long time, __34__ has also played an important role in naming children. Boys’ names such as John, Peter, and Thomas are chosen from the Bible. Girls’ names such as Faith, Patience, and Sophie (wisdom) are chosen because they symbolize Christian qualities. However, for people who are not necessarily religious but are fond of nature, names __35__ things of beauty are often favored. Flower and plant names like Heather, Rosemary, and Iris __36__ this category.\nAnother factor that has had a great __37__ on the choice of names is the spread of culture through the media. People may choose a name because they are strongly __38__ a character in a book or a television series; they may also adopt names of famous people or their favorite actors and actresses. Sometimes, people pick foreign names for their children because those names are unusual and will thus make their children more __39__ and distinctive.\nFinally, some people just pick a name the sound of which they like, __40__ of its meaning, its origins, or its popularity. However, even these people may look at the calendar to pick a lucky day when they make their choice.", "103-41–44": "American writer Toni Morrison was born in 1931 in Ohio. She was raised in an African American family filled with songs and stories of Southern myths, which later shaped her prose. Her happy family life led to her excellent performance in school, despite the atmosphere of racial discrimination in the society. After graduating from college, Morrison started to work as a teacher and got married in 1958. Several years later, her marriage began to fail. For a temporary escape, she joined a small writers' group, in which each member was required to bring a story or poem for discussion. She wrote a story based on the life of a girl she knew in childhood who had prayed to God for blue eyes. The story was well received by the group, but then she put it away, thinking she was done with it. In 1964, Morrison got divorced and devoted herself to writing. One day, she dusted off the story she had written for the writers' group and decided to make it into a novel. She drew on her memories from childhood and expanded upon them using her imagination so that the characters developed a life of their own. The Bluest Eye was eventually published in 1970. From 1970 to 1992, Morrison published five more novels. In her novels, Morrison brings in different elements of the African American past, their struggles, problems and cultural memory. In Song of Solomon, for example, Morrison tells the story of an African American man and his search for identity in his culture. The novels and other works won her several prizes. In 1993, Morrison received the Nobel Prize in Literature. She is the eighth woman and the first African American woman to win the honor.", "103-45–48": "Below is an excerpt from an interview with Zeke Emanuel, a health-policy expert, on his famous brothers. Interviewer: You're the older brother of Rahm, the mayor of Chicago, and Ari, an extremely successful talent agent. And you're a bioethicist and one of the architects of Obamacare. Isn't writing a book about how great your family is a bit odd? Zeke: I don't write a book about how great my family is. There are lots of idiocies and foolishness—a lot to make fun of in the book. I wrote Brothers Emanuel because I had begun jotting stories for my kids. And then we began getting a lot of questions: What did Mom put in the cereal? Three successful brothers, all different areas. I: To what do you attribute the Emanuel brothers' success? Z: I would put success in quotes. We strive. First, I think we got this striving from our mother to make the world a better place. A second important thing is you never rest on the last victory. There's always more to do. And maybe the third important thing is my father's admonition that offense is the best defense. We don't give up. I: Do you still not have a TV? Z: I don't own a TV. I don't own a car. I don't Facebook. I don't tweet. I: But you have four cell phones. Z: I'm down to two, thankfully. I: Your brothers are a national source of fascination. Where do you think they'll be in five years? Z: Ari will be a superagent running the same company. Rahm would still be mayor of Chicago. I will probably continue to be my academic self. The one thing I can guarantee is none of us will have taken a cruise, none of us will be sitting on a beach with a pina colada.", "103-49–52": "MOOC, a massive open online course, aims at providing large-scale interactive participation and open access via the web. In addition to traditional course materials such as videos, readings, and problem sets, MOOCs provide interactive user forums that help build a community for the students, professors, and teaching assistants. MOOCs first made waves in the fall of 2011, when Professor Sebastian Thrun from Stanford University opened his graduate-level artificial intelligence course up to any student anywhere, and 160,000 students in more than 190 countries signed up. This new breed of online classes is shaking up the higher education world in many ways. Since the courses can be taken by hundreds of thousands of students at the same time, the number of universities might decrease dramatically. Professor Thrun has even envisioned a future in which there will only need to be 10 universities in the world. Perhaps the most striking thing about MOOCs, many of which are being taught by professors at prestigious universities, is that they're free. This is certainly good news for cash-strapped students. There is a lot of excitement and fear surrounding MOOCs. While some say free online courses are a great way to increase the enrollment of minority students, others have said they will leave many students behind. Some critics have said that MOOCs promote an unrealistic one-size-fits-all model of higher education and that there is no replacement for true dialogues between professors and their students. After all, a brain is not a computer. We are not blank hard drives waiting to be filled with data. People learn from people they love and remember the things that arouse emotion. Some critics worry that online students will miss out on the social aspects of college.", "103-53–56": "Today the car seems to make periodic leaps in progress. A variety of driver assistance technologies are appearing on new cars. A developing technology called Vehicle-to-Vehicle communication, or V2V, is being tested by automotive manufacturers as a way to help reduce the number of accidents. V2V works by using wireless signals to send information back and forth between cars about their location, speed and direction, so that they keep safe distances from each other. Another new technology being tested is Vehicle-to-Infrastructure communication, or V2I. V2I would allow vehicles to communicate with road signs or traffic signals and provide information to the vehicle about safety issues. V2I could also request traffic information from a traffic management system and access the best possible routes. Both V2V and V2I have the potential to reduce around 80 percent of vehicle crashes on the road. More and more new cars can reverse-park, read traffic signs, maintain a safe distance in steady traffic and brake automatically to avoid crashes. Moreover, a number of firms are creating cars that drive themselves to a chosen destination without a human at the controls. It is predicted that driverless cars will be ready for sale within five years. If and when cars go completely driverless, the benefits will be enormous. Google, which already uses prototypes of such cars to ferry its staff along Californian freeways, once put a blind man in a prototype and filmed him being driven off to buy takeaway hamburgers. If this works, huge numbers of elderly and disabled people can regain their personal mobility. The young will not have to pay crippling motor insurance, because their reckless hands and feet will no longer touch the wheel or the accelerator. People who commute by car will gain hours each day to work, rest, or read a newspaper.", "102-16–20": "An area code is a section of a telephone number which generally represents the geographical area that the phone receiving the call is based in. It is the two or three digits just before the local number. If the number __16__ is in the same area as the number making the call, an area code usually doesn’t need to be dialed. The local number, __17__, must always be dialed in its entirety.\nThe area code was introduced in the United States in 1947. It was created __18__ the format of XYX, with X being any number between 2-9 and Y being either 1 or 0. Cities and areas with higher populations would have a smaller first and third digit, and 1 as the center digit. New York, being the largest city in the United States, was __19__ the 212 area code, followed by Los Angeles at 213.\nIn countries other than the United States and Canada, the area code generally determines the __20__ of a call. Calls within an area code and often a small group of neighboring area codes are normally charged at a lower rate than outside the area code.", "102-21–25": "For coin collectors who invest money in coins, the value of a coin is determined by various factors. First, scarcity is a major determinant. __21__ a coin is, the more it is worth. Note, however, that rarity has little to do with the __22__ of a coin. Many thousand-year-old coins often sell for no more than a few dollars because there are a lot of them around, __23__ a 1913 Liberty Head Nickel may sell for over one million US dollars because there are only five in existence. Furthermore, the demand for a particular coin will also __24__ influence coin values. Some coins may command higher prices because they are more popular with collectors. For example, a 1798 dime is much rarer than a 1916 dime, but the __25__ sells for significantly more, simply because many more people collect early 20th century dimes than dimes from the 1700s.", "102-26–30": "French psychologist Alfred Binet (1859-1911) took a different approach from most other psychologists of his day: He was interested in the workings of the __26__ mind rather than the nature of mental illness. He wanted to find a way to measure the ability to think and reason, apart from education in any particular field. In 1905 he developed a test in which he __27__ children do tasks such as follow commands, copy patterns, name objects, and put things in order or arrange them properly. He later created a standard of measuring children’s intelligence __28__ the data he had collected from the French children he studied. If 70 percent of 8-year-olds could pass a particular test, then __29__ on the test represented an 8-year-old’s level of intelligence. From Binet’s work, the phrase “intelligence quotient” (“IQ”) entered the English vocabulary. The IQ is the ratio of “mental age” to chronological age times 100, with 100 __30__ the average. So, an 8-year-old who passes the 10-year-old’s test would have an IQ of 10/8 times 100, or 125.", "102-31–40": "Often called “rainforests of the sea,” coral reefs provide a home for 25% of all species in the ocean. They are stony structures full of dark hideaways where fish and sea animals can lay their eggs and __31__ from predators. Without these underwater “apartment houses,” there would be
