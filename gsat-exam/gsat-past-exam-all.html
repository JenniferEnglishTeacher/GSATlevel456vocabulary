", "explanationSource": "own", "section": "103年"}, {"id": 660, "question": "【文意選填 第 31–40 題】\n@@103-31–40@@\n\n▶ 第 38 題　請從 (A)–(J) 選出最適合 __38__ 的字（每個選項只用一次）", "options": ["drawn to", "fall into", "impact", "involving", "keep", "passing down", "regardless", "religion", "respect", "unique"], "answer": 0, "answerLabel": "A", "source": "103 學測｜文意選填｜第 38 題", "explanation": "人們可能因為強烈「被」書或電視角色「吸引」而取名：be strongly drawn to a character。(A) drawn to。", "explanationSource": "own", "section": "103年"}, {"id": 661, "question": "【文意選填 第 31–40 題】\n@@103-31–40@@\n\n▶ 第 39 題　請從 (A)–(J) 選出最適合 __39__ 的字（每個選項只用一次）", "options": ["drawn to", "fall into", "impact", "involving", "keep", "passing down", "regardless", "religion", "respect", "unique"], "answer": 9, "answerLabel": "J", "source": "103 學測｜文意選填｜第 39 題", "explanation": "外國名字不尋常，讓孩子更「獨特」、與眾不同：more unique and distinctive。(J) unique。", "explanationSource": "own", "section": "103年"}, {"id": 662, "question": "【文意選填 第 31–40 題】\n@@103-31–40@@\n\n▶ 第 40 題　請從 (A)–(J) 選出最適合 __40__ 的字（每個選項只用一次）", "options": ["drawn to", "fall into", "impact", "involving", "keep", "passing down", "regardless", "religion", "respect", "unique"], "answer": 6, "answerLabel": "G", "source": "103 學測｜文意選填｜第 40 題", "explanation": "有人只挑喜歡的發音，「不管」意義、來源或流行度：regardless of。(G) regardless。", "explanationSource": "own", "section": "103年"}, {"id": 663, "question": "【閱讀測驗 第 41–44 題】\n@@103-41–44@@\n\n▶ 第 41 題　What is the passage mainly about?", "options": ["The life of black people in the U.S.", "The life of an African American writer.", "The history of African American culture.", "The history of the Nobel Prize in Literature."], "answer": 1, "answerLabel": "B", "source": "103 學測｜閱讀測驗｜第 41 題", "explanation": "全文從出生、婚姻、寫作到獲諾貝爾獎，講一位非裔美國作家 Toni Morrison 的一生。(B)。", "explanationSource": "own", "section": "103年"}, {"id": 664, "question": "【閱讀測驗 第 41–44 題】\n@@103-41–44@@\n\n▶ 第 42 題　Why did Morrison join the writers' group?", "options": ["She wanted to publish The Bluest Eye.", "She wanted to fight racial discrimination.", "She wanted to be a professional writer.", "She wanted to get away from her unhappy marriage."], "answer": 3, "answerLabel": "D", "source": "103 學測｜閱讀測驗｜第 42 題", "explanation": "婚姻開始出問題，「為了暫時逃避」她加入寫作小組。(D)。", "explanationSource": "own", "section": "103年"}, {"id": 665, "question": "【閱讀測驗 第 41–44 題】\n@@103-41–44@@\n\n▶ 第 43 題　According to the passage, what is one of the themes in Morrison's works?", "options": ["A search for African American values.", "Divorced black women in American society.", "Songs and stories of African Americans in Ohio.", "History of African Americans from the 1970s through the 1990s."], "answer": 0, "answerLabel": "A", "source": "103 學測｜閱讀測驗｜第 43 題", "explanation": "Morrison 的小說帶入非裔美國人的過去、掙扎與文化記憶，如《所羅門之歌》講一個黑人男子「在自身文化中尋找身分」。(A)。", "explanationSource": "own", "section": "103年"}, {"id": 666, "question": "【閱讀測驗 第 41–44 題】\n@@103-41–44@@\n\n▶ 第 44 題　Which of the following statements is true about Toni Morrison?", "options": ["She has been writing a lot since her adolescent years.", "She suffered from severe racial discrimination in her family.", "What she wrote in her novels are true stories of African Americans.", "No African American woman ever received a Nobel Prize in Literature before her."], "answer": 3, "answerLabel": "D", "source": "103 學測｜閱讀測驗｜第 44 題", "explanation": "最後一句：她是第一位獲諾貝爾文學獎的非裔美國女性——在她之前沒有。(D)。(A) 錯：離婚後才投入寫作；(B) 錯：家庭生活快樂；(C) 錯：她運用想像力擴充。", "explanationSource": "own", "section": "103年"}, {"id": 667, "question": "【閱讀測驗 第 45–48 題】\n@@103-45–48@@\n\n▶ 第 45 題　What does Zeke Emanuel have in mind when saying \"What did Mom put in the cereal?\"", "options": ["The secret to bringing up successful kids.", "The recipe for a breakfast food.", "The difference among the brothers.", "The questions from his kids."], "answer": 0, "answerLabel": "A", "source": "103 學測｜閱讀測驗｜第 45 題", "explanation": "三兄弟各在不同領域成功，大家問「媽媽在麥片裡放了什麼」——意指養出成功孩子的祕訣。(A)。", "explanationSource": "own", "section": "103年"}, {"id": 668, "question": "【閱讀測驗 第 45–48 題】\n@@103-45–48@@\n\n▶ 第 46 題　What does Zeke Emanuel think of the modern conveniences mentioned in the interview?", "options": ["Better late than never.", "Practice makes perfect.", "One can live without many of them.", "They are great inventions."], "answer": 2, "answerLabel": "C", "source": "103 學測｜閱讀測驗｜第 46 題", "explanation": "他沒有電視、沒有車、不用 Facebook 和 Twitter——顯示沒有這些現代便利也能生活。(C)。", "explanationSource": "own", "section": "103年"}, {"id": 669, "question": "【閱讀測驗 第 45–48 題】\n@@103-45–48@@\n\n▶ 第 47 題　According to Zeke Emanuel, which of the following is a reason for the brothers' success?", "options": ["They defend themselves by attacking others.", "They learn a lot from great people's quotes.", "They are committed to glorifying their parents.", "They keep moving forward even after a big success."], "answer": 3, "answerLabel": "D", "source": "103 學測｜閱讀測驗｜第 47 題", "explanation": "三個成功原因之一：never rest on the last victory，永遠還有更多事要做——大成功之後仍繼續前進。(D)。(A) 誤解「攻擊是最好的防守」意指不放棄。", "explanationSource": "own", "section": "103年"}, {"id": 670, "question": "【閱讀測驗 第 45–48 題】\n@@103-45–48@@\n\n▶ 第 48 題　Which of the following best summarizes Zeke Emanuel's response to the last question?", "options": ["The brothers look forward to a family trip on a cruise.", "Nothing much will change in the near future for them.", "Higher positions and more power will be their goals.", "None of the brothers will go to the beach."], "answer": 1, "answerLabel": "B", "source": "103 學測｜閱讀測驗｜第 48 題", "explanation": "回答五年後：Ari 仍是超級經紀人、Rahm 仍是市長、我仍是學者——近期不會有太大改變。(B)。(D) 只是比喻他們不會停下來度假，不是重點。", "explanationSource": "own", "section": "103年"}, {"id": 671, "question": "【閱讀測驗 第 49–52 題】\n@@103-49–52@@\n\n▶ 第 49 題　What does the word \"cash-strapped\" in the second paragraph mean?", "options": ["Making a lot of money.", "Being short of money.", "Being careful with money.", "Spending little money."], "answer": 1, "answerLabel": "B", "source": "103 學測｜閱讀測驗｜第 49 題", "explanation": "cash-strapped 缺錢的；前句說課程是免費的，對缺錢的學生是好消息。(B)。", "explanationSource": "own", "section": "103年"}, {"id": 672, "question": "【閱讀測驗 第 49–52 題】\n@@103-49–52@@\n\n▶ 第 50 題　Which of the following is NOT one of the features of MOOCs?", "options": ["It is free to take the courses.", "Many courses are offered by famous universities.", "Most courses address artificial intelligence.", "Many students can take the course at the same time."], "answer": 2, "answerLabel": "C", "source": "103 學測｜閱讀測驗｜第 50 題", "explanation": "文中提到免費、名校教授授課、數十萬人同時上課；人工智慧只是 Thrun 第一門課的主題，不是 MOOC 的特色。(C)。", "explanationSource": "own", "section": "103年"}, {"id": 673, "question": "【閱讀測驗 第 49–52 題】\n@@103-49–52@@\n\n▶ 第 51 題　What is the second paragraph mainly about?", "options": ["The impact of MOOCs.", "The goal of MOOCs.", "The size of MOOC classes.", "The cost of MOOC courses."], "answer": 0, "answerLabel": "A", "source": "103 學測｜閱讀測驗｜第 51 題", "explanation": "第二段：MOOC 正在撼動高等教育——大學數量可能大減、課程免費——講的是 MOOC 的「影響」。(A)。", "explanationSource": "own", "section": "103年"}, {"id": 674, "question": "【閱讀測驗 第 49–52 題】\n@@103-49–52@@\n\n▶ 第 52 題　Which of the following is a problem of MOOCs mentioned in the passage?", "options": ["The disappearance of traditional course materials.", "The limited number of courses offered around the world.", "The overreliance on professors from prestigious universities.", "The lack of social interaction among students and professors."], "answer": 3, "answerLabel": "D", "source": "103 學測｜閱讀測驗｜第 52 題", "explanation": "第三段：批評者說無法取代師生之間真正的對話，學生會錯過大學的社交面向。(D)。", "explanationSource": "own", "section": "103年"}, {"id": 675, "question": "【閱讀測驗 第 53–56 題】\n@@103-53–56@@\n\n▶ 第 53 題　Which of the following statements is true about V2V?", "options": ["V2V communication has been very well developed.", "Through V2V, drivers can chat with each other on the road.", "V2V is designed to decrease crashes by keeping safe distances.", "Through V2V, a car can warn cyclists nearby of its approach."], "answer": 2, "answerLabel": "C", "source": "103 學測｜閱讀測驗｜第 53 題", "explanation": "第一段：V2V 讓車輛互傳位置、速度、方向資訊，以「保持安全距離」減少事故。(C)。(A) 錯：仍在測試中。", "explanationSource": "own", "section": "103年"}, {"id": 676, "question": "【閱讀測驗 第 53–56 題】\n@@103-53–56@@\n\n▶ 第 54 題　What does \"infrastructure\" in Vehicle-to-Infrastructure refer to?", "options": ["Traffic facilities and information systems.", "The basic structure of roads and bridges.", "Knowledge and regulations about safe driving.", "The traffic department of the government."], "answer": 0, "answerLabel": "A", "source": "103 學測｜閱讀測驗｜第 54 題", "explanation": "V2I 讓車輛與「路標、交通號誌」溝通，並向交通管理系統索取資訊——交通設施與資訊系統。(A)。", "explanationSource": "own", "section": "103年"}, {"id": 677, "question": "【閱讀測驗 第 53–56 題】\n@@103-53–56@@\n\n▶ 第 55 題　Which of the following is NOT a potential benefit of driverless cars?", "options": ["The elderly will become more mobile.", "\"Drivers\" can sleep in cars all the way to work.", "People can race cars to their heart's content.", "A blind man can get into a car and travel safely."], "answer": 2, "answerLabel": "C", "source": "103 學測｜閱讀測驗｜第 55 題", "explanation": "第三段列出老人與身障者恢復行動力、年輕人省保險費、通勤者多出時間；沒有「盡情賽車」，而且無人駕駛是不讓人碰方向盤。(C)。", "explanationSource": "own", "section": "103年"}, {"id": 678, "question": "【閱讀測驗 第 53–56 題】\n@@103-53–56@@\n\n▶ 第 56 題　What can be inferred from the passage?", "options": ["Cars will refuse to start if the driver is drunk.", "The future may be a vehicle-accident-free era.", "Everyone, including children, can afford a car.", "The production of driverless cars is still far away."], "answer": 1, "answerLabel": "B", "source": "103 學測｜閱讀測驗｜第 56 題", "explanation": "V2V、V2I 可減少 80% 車禍，加上無人駕駛，可推論未來可能是沒有車禍的時代。(B)。(D) 錯：預測五年內上市。", "explanationSource": "own", "section": "103年"}, {"id": 679, "question": "第 1 題　It rained so hard yesterday that the baseball game had to be ______ until next Saturday.", "options": ["surrendered", "postponed", "abandoned", "opposed"], "answer": 1, "answerLabel": "B", "source": "102 學測｜詞彙｜第 1 題", "explanation": "大雨導致球賽「延期」到下週六：postponed。surrender 投降、abandon 放棄、oppose 反對。", "explanationSource": "own", "section": "102年"}, {"id": 680, "question": "第 2 題　As more people rely on the Internet for information, it has ______ newspapers as the most important source of news.", "options": ["distributed", "subtracted", "replaced", "transferred"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 2 題", "explanation": "網路「取代」報紙成為最重要的新聞來源：replaced。distribute 分配、subtract 減去、transfer 轉移。", "explanationSource": "own", "section": "102年"}, {"id": 681, "question": "第 3 題　Having saved enough money, Joy ______ two trips for this summer vacation, one to France and the other to Australia.", "options": ["booked", "observed", "enclosed", "deposited"], "answer": 0, "answerLabel": "A", "source": "102 學測｜詞彙｜第 3 題", "explanation": "存夠錢後「預訂」了兩個暑假行程：booked。observe 觀察、enclose 附上、deposit 存放。", "explanationSource": "own", "section": "102年"}, {"id": 682, "question": "第 4 題　Since I do not fully understand your proposal, I am not in the position to make any ______ on it.", "options": ["difference", "solution", "demand", "comment"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 4 題", "explanation": "不完全了解提案，所以無法「評論」：make a comment on。difference 差異、solution 解答、demand 要求。", "explanationSource": "own", "section": "102年"}, {"id": 683, "question": "第 5 題　Betty was ______ to accept her friend’s suggestion because she thought she could come up with a better idea herself.", "options": ["tolerable", "sensitive", "reluctant", "modest"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 5 題", "explanation": "覺得自己能想出更好的點子，所以「不願意」接受朋友的建議：reluctant。tolerable 可忍受的、sensitive 敏感的、modest 謙虛的。", "explanationSource": "own", "section": "102年"}, {"id": 684, "question": "第 6 題　The bank tries its best to attract more customers. Its staff members are always available to provide ______ service.", "options": ["singular", "prompt", "expensive", "probable"], "answer": 1, "answerLabel": "B", "source": "102 學測｜詞彙｜第 6 題", "explanation": "銀行為吸引客戶，員工隨時提供「迅速的」服務：prompt。singular 單一的、expensive 昂貵的、probable 可能的。", "explanationSource": "own", "section": "102年"}, {"id": 685, "question": "第 7 題　John’s part-time experience at the cafeteria is good ______ for running his own restaurant.", "options": ["preparation", "recognition", "formation", "calculation"], "answer": 0, "answerLabel": "A", "source": "102 學測｜詞彙｜第 7 題", "explanation": "打工經驗是日後開餐廳的好「準備」：preparation。recognition 認可、formation 形成、calculation 計算。", "explanationSource": "own", "section": "102年"}, {"id": 686, "question": "第 8 題　Women’s fashions are ______ changing: One season they may favor pantsuits, but the next season they may prefer miniskirts.", "options": ["lately", "shortly", "relatively", "constantly"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 8 題", "explanation": "一季流行褲裝、下一季流行迷你裙，表示時尚「不斷」改變：constantly。lately 最近、shortly 不久、relatively 相對地。", "explanationSource": "own", "section": "102年"}, {"id": 687, "question": "第 9 題　Standing on the seashore, we saw a ______ of seagulls flying over the ocean before they glided down and settled on the water.", "options": ["pack", "flock", "herd", "school"], "answer": 1, "answerLabel": "B", "source": "102 學測｜詞彙｜第 9 題", "explanation": "a flock of seagulls 一「群」海鷗：flock 用於鳥類。pack 用於狼/狗、herd 用於牛羊、school 用於魚群。", "explanationSource": "own", "section": "102年"}, {"id": 688, "question": "第 10 題　The book is not only informative but also ______ , making me laugh and feel relaxed while reading it.", "options": ["understanding", "infecting", "entertaining", "annoying"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 10 題", "explanation": "這本書讓我邊讀邊笑，表示不只有資訊也很「有娛樂性」：entertaining。understanding 體諒的、infecting 感染的、annoying 惱人的。", "explanationSource": "own", "section": "102年"}, {"id": 689, "question": "第 11 題　After working in front of my computer for the entire day, my neck and shoulders got so ______ that I couldn’t even turn my head.", "options": ["dense", "harsh", "stiff", "concrete"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 11 題", "explanation": "整天用電腦，脖子和肩膀「僵硬」到無法轉頭：stiff。dense 密集的、harsh 嚴厲的、concrete 具體的。", "explanationSource": "own", "section": "102年"}, {"id": 690, "question": "第 12 題　Getting a flu shot before the start of flu season gives our body a chance to build up protection against the ______ that could make us sick.", "options": ["poison", "misery", "leak", "virus"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 12 題", "explanation": "打流感疫苗讓身體建立對「病毒」的防護：virus。poison 毒藥、misery 痛苦、leak 漏洞。", "explanationSource": "own", "section": "102年"}, {"id": 691, "question": "第 13 題　The kingdom began to ______ after the death of its ruler, and was soon taken over by a neighboring country.", "options": ["collapse", "dismiss", "rebel", "withdraw"], "answer": 0, "answerLabel": "A", "source": "102 學測｜詞彙｜第 13 題", "explanation": "統治者死後王國開始「崩潰」，很快被鄰國占領：collapse。dismiss 解散、rebel 反叛、withdraw 撤退。", "explanationSource": "own", "section": "102年"}, {"id": 692, "question": "第 14 題　Though Kevin failed in last year’s singing contest, he did not feel ______ . This year he practiced day and night and finally won first place in the competition.", "options": ["relieved", "suspected", "discounted", "frustrated"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 14 題", "explanation": "比賽失利卻沒有感到「受挫」，隔年日夜練習奪冠：frustrated。relieved 鬆一口氣的、suspected 被懷疑的、discounted 被低估的。", "explanationSource": "own", "section": "102年"}, {"id": 693, "question": "第 15 題　Emma and Joe are looking for a live-in babysitter for their three-year-old twins, ______ one who knows how to cook.", "options": ["initially", "apparently", "preferably", "considerably"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 15 題", "explanation": "找保母，「最好是」會做菜的：preferably。initially 最初、apparently 顯然、considerably 相當地。", "explanationSource": "own", "section": "102年"}, {"id": 694, "question": "【綜合測驗 第 16–20 題】\n@@102-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["calling", "being ion": "102年"}, {"id": 716, "question": "【文意選填 第 31–40 題】\n@@102-31–40@@\n\n▶ 第 38 題　請從 (A)–(J) 選出最適合 __38__ 的字（每個選項只用一次）", "options": ["resistance", "identified", "last", "escape", "sadly", "eventually", "disappearance", "souvenirs", "endangered", "carry"], "answer": 5, "answerLabel": "F", "source": "102 學測｜文意選填｜第 38 題", "explanation": "藻類死亡後珊瑚失去顏色，「最終」也死亡：it also dies eventually。(F) eventually。", "explanationSource": "own", "section": "102年"}, {"id": 717, "question": "【文意選填 第 31–40 題】\n@@102-31–40@@\n\n▶ 第 39 題　請從 (A)–(J) 選出最適合 __39__ 的字（每個選項只用一次）", "options": ["resistance", "identified", "last", "escape", "sadly", "eventually", "disappearance", "souvenirs", "endangered", "carry"], "answer": 6, "answerLabel": "G", "source": "102 學測｜文意選填｜第 39 題", "explanation": "造成珊瑚礁「消失」的最後一個因素是人：the disappearance of coral reefs。(G) disappearance。", "explanationSource": "own", "section": "102年"}, {"id": 718, "question": "【文意選填 第 31–40 題】\n@@102-31–40@@\n\n▶ 第 40 題　請從 (A)–(J) 選出最適合 __40__ 的字（每個選項只用一次）", "options": ["resistance", "identified", "last", "escape", "sadly", "eventually", "disappearance", "souvenirs", "endangered", "carry"], "answer": 7, "answerLabel": "H", "source": "102 學測｜文意選填｜第 40 題", "explanation": "有人把珊瑚敲下來當「紀念品」收藏，因為它漂亮：collect for souvenirs。(H) souvenirs。", "explanationSource": "own", "section": "102年"}, {"id": 719, "question": "【閱讀測驗 第 41–44 題】\n@@102-41–44@@\n\n▶ 第 41 題　What is the main purpose of the passage?", "options": ["To explain the origin of the Swiss army knife.", "To introduce the functions of the Swiss army knife.", "To emphasize the importance of the Swiss army knife.", "To tell a story about the designer of the Swiss army knife."], "answer": 0, "answerLabel": "A", "source": "102 學測｜閱讀測驗｜第 41 題", "explanation": "全文從瑞士軍隊配發螺絲起子兼開罐器的刀，到美軍取名，講的是瑞士刀的「起源」。(A)。", "explanationSource": "own", "section": "102年"}, {"id": 720, "question": "【閱讀測驗 第 41–44 題】\n@@102-41–44@@\n\n▶ 第 42 題　What does “It” in the third paragraph refer to?", "options": ["The Swiss army needed a knife for every soldier.", "Every good Swiss citizen had a knife in his pocket.", "Swiss knives were competing with imported knives.", "Canned food was becoming popular in the Swiss army."], "answer": 0, "answerLabel": "A", "source": "102 學測｜閱讀測驗｜第 42 題", "explanation": "It was a lifesaver for Swiss knife makers：前一段說軍方決定配發每位士兵一把標準刀——「軍隊需要刀」救了瑞士刀匠。(A)。", "explanationSource": "own", "section": "102年"}, {"id": 721, "question": "【閱讀測驗 第 41–44 題】\n@@102-41–44@@\n\n▶ 第 43 題　Why didn’t the Swiss army purchase the Swiss Officer’s Knife?", "options": ["The design of the knife was too simple.", "The knife was sold out to American soldiers.", "The army had no budget to make the purchase.", "The new design was not considered necessary for officers to own."], "answer": 3, "answerLabel": "D", "source": "102 學測｜閱讀測驗｜第 43 題", "explanation": "第四段：軍方採購人員認為附開酒器的新款「不是生存必需」，軍官得自己買。(D)。", "explanationSource": "own", "section": "102年"}, {"id": 722, "question": "【閱讀測驗 第 41–44 題】\n@@102-41–44@@\n\n▶ 第 44 題　Who gave the name “the Swiss army knife” to the knife discussed in the passage?", "options": ["Carl Elsener.", "Swiss generals.", "American soldiers.", "German businessmen."], "answer": 2, "answerLabel": "C", "source": "102 學測｜閱讀測驗｜第 44 題", "explanation": "第四段末：美國士兵唸不出德文名稱，就叫它 Swiss army knife。(C)。", "explanationSource": "own", "section": "102年"}, {"id": 723, "question": "【閱讀測驗 第 45–48 題】\n@@102-45–48@@\n\n▶ 第 45 題　What was the first piece of man-made space trash?", "options": ["A camera.", "A tool kit.", "A fuel tank.", "A broken satellite."], "answer": 3, "answerLabel": "D", "source": "102 學測｜閱讀測驗｜第 45 題", "explanation": "第二段：第一件太空垃圾是 1964 年停止運作的美國衛星 Vanguard I。(D)。", "explanationSource": "own", "section": "102年"}, {"id": 724, "question": "【閱讀測驗 第 45–48 題】\n@@102-45–48@@\n\n▶ 第 46 題　Why were scientists NOT concerned about space trash in the beginning?", "options": ["It no longer served any useful purpose.", "It was millions of miles away from the Earth.", "It did not cause any problems.", "It was regarded as similar to comets and stars."], "answer": 2, "answerLabel": "C", "source": "102 學測｜閱讀測驗｜第 46 題", "explanation": "第二段：它持續繞地球運行「沒有造成任何後果」，科學家因此越來越習慣丟棄東西。(C)。", "explanationSource": "own", "section": "102年"}, {"id": 725, "question": "【閱讀測驗 第 45–48 題】\n@@102-45–48@@\n\n▶ 第 47 題　Which of the following statements is true about space junk?", "options": ["It is huge, heavy machines.", "It never changes position.", "It floats slowly around the Earth.", "It may cause problems for space shuttles."], "answer": 3, "answerLabel": "D", "source": "102 學測｜閱讀測驗｜第 47 題", "explanation": "第四段：太空垃圾可能撞上運作中的衛星、損害太空船。(D)。(A) 錯：小至油漆碎片；(C) 錯：時速達 17,500 英里。", "explanationSource": "own", "section": "102年"}, {"id": 726, "question": "【閱讀測驗 第 45–48 題】\n@@102-45–48@@\n\n▶ 第 48 題　What has been done about the space trash problem?", "options": ["Scientists have cleaned up most of the trash.", "Large pieces of space trash are being closely watched.", "Many nations have worked together to stop polluting space.", "Ground stations are built to help store the trash properly in space."], "answer": 1, "answerLabel": "B", "source": "102 學測｜閱讀測驗｜第 48 題", "explanation": "第四段：已建立地面站「監測較大的太空垃圾」；國際合作清理是「未來計畫」。(B)。", "explanationSource": "own", "section": "102年"}, {"id": 727, "question": "【閱讀測驗 第 49–52 題】\n@@102-49–52@@\n\n▶ 第 49 題　For a person who just turned 20, what is the legal alcohol level allowed while driving in the US?", "options": ["0.000%.", "0.005%.", "0.080%.", "0.096%."], "answer": 0, "answerLabel": "A", "source": "102 學測｜閱讀測驗｜第 49 題", "explanation": "第一段：21 歲以下「體內不得有任何酒精」才能開車——0%。(A)。", "explanationSource": "own", "section": "102年"}, {"id": 728, "question": "【閱讀測驗 第 49–52 題】\n@@102-49–52@@\n\n▶ 第 50 題　What is the purpose of the Missouri experiment?", "options": ["To introduce a new method of calculating blood alcohol levels.", "To discover the relation between energy drinks and ABT test results.", "To warn about the dangers of drinking energy drinks mixed with alcohol.", "To challenge the current legal alcohol limit for drivers in the United States."], "answer": 1, "answerLabel": "B", "source": "102 學測｜閱讀測驗｜第 50 題", "explanation": "第一段末：很多人說只喝了「無酒精」能量飲料就測出陽性，研究就是要查能量飲料能否造成酒測陽性。(B)。", "explanationSource": "own", "section": "102年"}, {"id": 729, "question": "【閱讀測驗 第 49–52 題】\n@@102-49–52@@\n\n▶ 第 51 題　What were the participants of the experiment asked to do after they finished their energy drink?", "options": ["To line up in the laboratory.", "To recall the drink brands.", "To take an alcohol breath test.", "To check their breath for freshness."], "answer": 2, "answerLabel": "C", "source": "102 學測｜閱讀測驗｜第 51 題", "explanation": "第二段：喝完一罐後，於 1 分鐘和 15 分鐘後各做一次酒測。(C)。", "explanationSource": "own", "section": "102年"}, {"id": 730, "question": "【閱讀測驗 第 49–52 題】\n@@102-49–52@@\n\n▶ 第 52 題　What is the most important factor that affects the ABT test result for energy drink consumers?", "options": ["The age of the person who takes the test.", "The place where the test is given.", "The equipment that the test uses.", "The time when the test is taken."], "answer": 3, "answerLabel": "D", "source": "102 學測｜閱讀測驗｜第 52 題", "explanation": "第三段：喝完 1 分鐘內測得到，15 分鐘後都測不到——「測試時間」是關鍵。(D)。", "explanationSource": "own", "section": "102年"}, {"id": 731, "question": "【閱讀測驗 第 53–56 題】\n@@102-53–56@@\n\n▶ 第 53 題　Why did people in India start wearing a red dot on their forehead?", "options": ["To indicate their social rank.", "To show their religious belief.", "To display their financial status.", "To highlight their family background."], "answer": 1, "answerLabel": "B", "source": "102 學測｜閱讀測驗｜第 53 題", "explanation": "第一段：這個習俗「主要與印度教有關」。(B)。", "explanationSource": "own", "section": "102年"}, {"id": 732, "question": "【閱讀測驗 第 53–56 題】\n@@102-53–56@@\n\n▶ 第 54 題　What is the significance of the third eye in Hindu tradition?", "options": ["To stay in harmony with nature.", "To observe the outside world more clearly.", "To pay respect to God.", "To see things with a subjective view."], "answer": 2, "answerLabel": "C", "source": "102 學測｜閱讀測驗｜第 54 題", "explanation": "第二段：第三隻眼用來「向內專注於神」，象徵虔誠，提醒信徒把神放在心中。(C)。", "explanationSource": "own", "section": "102年"}, {"id": 733, "question": "【閱讀測驗 第 53–56 題】\n@@102-53–56@@\n\n▶ 第 55 題　Why was red chosen as the original color of the bindi?", "options": ["The red dot represented the blood of God.", "Red stood for a wife’s love for her husband.", "The word “bindi” means “red” in some Hindi dialects.", "Red was supposed to bring blessings to a married couple."], "answer": 3, "answerLabel": "D", "source": "102 學測｜閱讀測驗｜第 55 題", "explanation": "第三段：紅色被認為能「為夫妻帶來好運」。(D)。", "explanationSource": "own", "section": "102年"}, {"id": 734, "question": "【閱讀測驗 第 53–56 題】\n@@102-53–56@@\n\n▶ 第 56 題　Which of the following statements is true about the practice of wearing a bindi today?", "options": ["Bindis are worn anywhere on the face now.", "Bindis are now used as a decorative item.", "Most Indian women do not like to wear bindis anymore.", "Wearing a bindi has become more popular among Indian men."], "answer": 1, "answerLabel": "B", "source": "102 學測｜閱讀測驗｜第 56 題", "explanation": "第三段末：有各種大小顏色的貼紙 bindi，已「更像時尚宣言而非宗教習俗」——裝飾品。(B)。(D) 相反：男性佩戴的傳統已式微。", "explanationSource": "own", "section": "102年"}, {"id": 735, "question": "第 1 題　The ending of the movie did not come as a ______ to John because he had already read the novel that the movie was based on.", "options": ["vision", "focus", "surprise", "conclusion"], "answer": 2, "answerLabel": "C", "source": "101 學測｜詞彙｜第 1 題", "explanation": "已經讀過原著，所以結局並不「意外」：come as a surprise 令人意外。vision 視野、focus 焦點、conclusion 結論。", "explanationSource": "own", "section": "101年"}, {"id": 736, "question": "第 2 題　In order to stay healthy and fit, John exercises ______. He works out twice a week in a gym.", "options": ["regularly", "directly", "hardly", "gradually"], "answer": 0, "answerLabel": "A", "source": "101 學測｜詞彙｜第 2 題", "explanation": "每週固定上健身房兩次，表示「規律地」運動：regularly。directly 直接地、hardly 幾乎不、gradually 逐漸地。", "explanationSource": "own", "section": "101年"}, {"id": 737, "question": "第 3 題　Traveling is a good way for us to ______ different cultures and broaden our horizons.", "options": ["assume", "explore", "occupy", "inspire"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 3 題", "explanation": "旅行是「探索」不同文化、拓展視野的好方法：explore。assume 假定、occupy 占據、inspire 啟發。", "explanationSource": "own", "section": "101年"}, {"id": 738, "question": "第 4 題　The story about Hou-I shooting down nine suns is a well-known Chinese ______, but it may not be a true historical event.", "options": ["figure", "rumor", "miracle", "legend"], "answer": 3, "answerLabel": "D", "source": "101 學測｜詞彙｜第 4 題", "explanation": "后羿射日是著名的中國「傳說」，未必是真實歷史：legend。figure 人物、rumor 謠言、miracle 奇蹟。", "explanationSource": "own", "section": "101年"}, {"id": 739, "question": "第 5 題　According to recent research, children under the age of 12 are generally not ______ enough to recognize risk and deal with dangerous situations.", "options": ["diligent", "mature", "familiar", "sincere"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 5 題", "explanation": "12 歲以下兒童不夠「成熟」，難以辨識風險：mature。diligent 勤奮的、familiar 熟悉的、sincere 真誠的。", "explanationSource": "own", "section": "101年"}, {"id": 740, "question": "第 6 題　Helen let out a sigh of ______ after hearing that her brother was not injured in the accident.", "options": ["hesitation", "relief", "sorrow", "triumph"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 6 題", "explanation": "聽到哥哥沒受傷，鬆了一口氣：a sigh of relief。hesitation 猶豫、sorrow 悲傷、triumph 勝利。", "explanationSource": "own", "section": "101年"}, {"id": 741, "question": "第 7 題　Research suggests that people with outgoing personalities tend to be more ______, often expecting that good things will happen.", "options": ["efficient", "practical", "changeable", "optimistic"], "answer": 3, "answerLabel": "D", "source": "101 學測｜詞彙｜第 7 題", "explanation": "外向的人常期待好事發生，較「樂觀」：optimistic。efficient 有效率的、practical 實際的、changeable 多變的。", "explanationSource": "own", "section": "101年"}, {"id": 742, "question": "第 8 題　No one could beat Paul at running. He has won the running championship ______ for three years.", "options": ["rapidly", "urgently", "continuously", "temporarily"], "answer": 2, "answerLabel": "C", "source": "101 學測｜詞彙｜第 8 題", "explanation": "沒人跑得過他，「連續」三年奪冠：continuously。rapidly 快速地、urgently 緊急地、temporarily 暫時地。", "explanationSource": "own", "section": "101年"}, {"id": 743, "question": "第 9 題　If you fly from Taipei to Tokyo, you’ll be taking an international, rather than a ______ flight.", "options": ["liberal", "domestic", "connected", "universal"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 9 題", "explanation": "台北飛東京是國際航線，而非「國內」航線：domestic。liberal 自由的、connected 相連的、universal 普遍的。", "explanationSource": "own", "section": "101年"}, {"id": 744, "question": "第 10 題　Jack is very proud of his fancy new motorcycle. He has been ______ to all his friends about how cool it looks and how fast it runs.", "options": ["boasting", "proposing", "gossiping", "confessing"], "answer": 0, "answerLabel": "A", "source": "101 學測｜詞彙｜第 10 題", "explanation": "向朋友「吹噓」新機車多酷多快：boast to sb. about。propose 提議、gossip 八卦、confess 坦承。", "explanationSource": "own", "section": "101年"}, {"id": 745, "question": "第 11 題　The ideas about family have changed ______ in the past twenty years. For example, my grandfather was one of ten children in his family, but I am the only child.", "options": ["mutually", "narrowly", "considerably", "scarcely"], "answer": 2, "answerLabel": "C", "source": "101 學測｜詞彙｜第 11 題", "explanation": "祖父有九個兄弟姊妹而我是獨子，表示家庭觀念改變「相當大」：considerably。mutually 相互地、narrowly 勉強地、scarcely 幾乎不。", "explanationSource": "own", "section": "101年"}, {"id": 746, "question": "第 12 題　The chairperson of the meeting asked everyone to speak up instead of ______ their opinions among themselves.", "options": ["reciting", "giggling", "murmuring", "whistling"], "answer": 2, "answerLabel": "C", "source": "101 學測｜詞彙｜第 12 題", "explanation": "主席要大家大聲說，而不是私下「低聲議論」：murmuring。recite 背誦、giggle 傻笑、whistle 吹口哨。", "explanationSource": "own", "section": "101年"}, {"id": 747, "question": "第 13 題　Although Mr. Chen is rich, he is a very ______ person and is never willing to spend any money to help those who are in need.", "options": ["absolute", "precise", "economic", "stingy"], "answer": 3, "answerLabel": "D", "source": "101 學測｜詞彙｜第 13 題", "explanation": "有錢卻從不願花錢幫助需要的人，很「小氣」：stingy。absolute 絕對的、precise 精確的、economic 經濟的。", "explanationSource": "own", "section": "101年"}, {"id": 748, "question": "第 14 題　If you want to know what your dreams mean, now there are websites you can visit to help you ______ them.", "options": ["overcome", "interpret", "transfer", "revise"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 14 題", "explanation": "網站可幫你「解讀」夢的意義：interpret。overcome 克服、transfer 轉移、revise 修訂。", "explanationSource": "own", "section": "101年"}, {"id": 749, "question": "第 15 題　The memory ______ of the new computer has been increased so that more information can be stored.", "options": ["capacity", "occupation", "attachment", "machinery"], "answer": 0, "answerLabel": "A", "source": "101 學測｜詞彙｜第 15 題", "explanation": "記憶「容量」增加以儲存更多資料：memory capacity。occupation 職業、attachment 附件、machinery 機械。", "explanationSource": "own", "section": "101年"}, {"id": 750, "question": "【綜合測驗 第 16–20 題】\n@@101-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["affairs", "fashions", "industries", "attractions"], "answer": 3, "answerLabel": "D", "source": "101 學測｜綜合測驗｜第 16 題", "explanation": "基日島是俄羅斯最熱門的觀光「景點」之一：tourist attractions。affair 事務、fashion 時尚、industry 產業。", "explanationSource": "own", "section": "101年"}, {"id": 751, "question": "【綜合測驗 第 16–20 題】\n@@101-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["them", "that", "those", "which"], "answer": 3, "answerLabel": "D", "source": "101 學測｜綜合測驗｜第 17 題", "explanation": "some of which are just rocks：介系詞 + which 引導形容詞子句，代替前面的 5,000 other islands。", "explanationSource": "own", "section": "101年"}, {"id": 752, "question": "【綜合測驗 第 16–20 題】\n@@101-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["in fact", "once again", "as usual", "for instance"], "answer": 0, "answerLabel": "A", "source": "101 學測｜綜合測驗｜第 18 題", "explanation": "整座島「事實上」就是一座戶外木造建築博物館：in fact。once again 再一次、as usual 照常、for instance 例如。", "explanationSource": "own", "section": "101年"}, {"id": 753, "question": "【綜合測驗 第 16–20 題】\n@@101-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["except", "besides", "including", "regarding"], "answer": 2, "answerLabel": "C", "source": "101 學測｜綜合測驗｜第 19 題", "explanation": "許多木造建築，「包括」風車、船屋、小教堂等：including。except 除了…之外（不包含）、besides 除此之外、regarding 關於。", "explanationSource": "own", "section": "101年"}, {"id": 754, "question": "【綜合測驗 第 16–20 題】\n@@101-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["make", "making", "made", "to make"], "answer": 1, "answerLabel": "B", "source": "101 學測｜綜合測驗｜第 20 題", "explanation": "…, making it one of the tallest log structures：分詞構句表結果，用 making。", "explanationSource": "own", "section": "101年"}, {"id": 755, "question": "【綜合測驗 第 21–25 題】\n@@101-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["yet", "even", "never", "rather"], "answer": 1, "answerLabel": "B", "source": "101 學測｜綜合測驗｜第 21 題", "explanation": "人類把神性視為理所當然，「甚至」濫用它：even。yet 然而、never 從不、rather 寧願。", "explanationSource": "own", "section": "101年"}, {"id": 756, "question": "【綜合測驗 第 21–25 題】\n@@101-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["though", "because", "where", "when"], "answer": 2, "answerLabel": "C", "source": "101 學測｜綜合測驗｜第 22 題", "explanation": "把神性藏在「一個找不到的地方」：hide it where it could never be found，where 引導地方副詞子句。", "explanationSource": "own", "section": "101年"}, {"id": 757, "question": "【綜合測驗 第 21–25 題】\n@@101-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["close", "apart", "deep", "hard"], "answer": 2, "answerLabel": "C", "source": "101 學測｜綜合測驗｜第 23 題", "explanation": "眾神建議藏在地底「深處」或最高山頂：deep in the earth。close 近、apart 分開、hard 硬。", "explanationSource": "own", "section": "101年"}, {"id": 758, "question": "【綜合測驗 第 21–25 題】\n@@101-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["each", "more", "any", "neither"], "answer": 3, "answerLabel": "D", "source": "101 學測｜綜合測驗｜第 24 題", "explanation": "Brahma 認為這「兩個方法都不」行，因為人類會挖地、也會爬山：neither。", "explanationSource": "own", "section": "101年"}, {"id": 759, "question": "【綜合測驗 第 21–25 題】\n@@101-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["look for", "get over", "do without", "bump into"], "answer": 0, "answerLabel": "A", "source": "101 學測｜綜合測驗｜第 25 題", "explanation": "藏在人類內心深處，人類絕不會想到要「在那裡尋找」：look for。get over 克服、do without 沒有…也行、bump into 撞見。", "explanationSource": "own", "section": "101年"}, {"id": 760, "question": "【綜合測驗 第 26–30 題】\n@@101-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["skip over", "come across", "look into", "break down"], "answer": 3, "answerLabel": "D", "source": "101 學測｜綜合測驗｜第 26 題", "explanation": "促進世界和平，「打破」各民族之間的隔閡：break down barriers。skip over 略過、come across 偶遇、look into 調查。", "explanationSource": "own", "section": "101年"}, {"id": 761, "question": "【綜合測驗 第 26–30 題】\n@@101-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["is", "has been", "was", "had been"], "answer": 1, "answerLabel": "B", "source": "101 學測｜綜合測驗｜第 27 題", "explanation": "Since then（自那時以來）… has been observed：現在完成式表從過去持續至今。", "explanationSource": "own", "section": "101年"}, {"id": 762, "question": "【綜合測驗 第 26–30 題】\n@@101-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["quicker", "sooner", "easier", "better"], "answer": 2, "answerLabel": "C", "source": "101 學測｜綜合測驗｜第 28 題", "explanation": "Taking part couldn’t be easier 參加「再簡單不過了」：後句說只要向 10 個人說 hello。", "explanationSource": "own", "section": "101年"}, {"id": 763, "question": "【綜合測驗 第 26–30 題】\n@@101-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["aim", "tone", "key", "peak"], "answer": 0, "answerLabel": "A", "source": "101 學測｜綜合測驗｜第 29 題", "explanation": "呼應這個活動的「目標」（ nation": "1979 年加入男性名字，因為女性抗議原本的命名「做法」：the original naming practice。(F) practice。", "explanationSource": "own", "section": "101年"}, {"id": 769, "question": "【文意選填 第 31–40 題】\n@@101-31–40@@\n\n▶ 第 35 題　請從 (A)–(J) 選出最適合 __35__ 的字（每個選項只用一次）", "options": ["request", "favor", "disadvantage", "composed", "recycled", "practice", "replaced", "raise", "various", "female"], "answer": 7, "answerLabel": "H", "source": "101 學測｜文意選填｜第 35 題", "explanation": "改用亞洲名字以「提高」亞洲人對颱風的意識：raise Asians’ awareness。(H) raise。", "explanationSource": "own", "section": "101年"}, {"id": 770, "question": "【文意選填 第 31–40 題】\n@@101-31–40@@\n\n▶ 第 36 題　請從 (A)–(J) 選出最適合 __36__ 的字（每個選項只用一次）", "options": ["request", "favor", "disadvantage", "composed", "recycled", "practice", "replaced", "raise", "various", "female"], "answer": 3, "answerLabel": "D", "source": "101 學測｜文意選填｜第 36 題", "explanation": "名字來自一個「由」140 個名字「組成」的名字庫：a name pool composed of 140 names。(D) composed。", "explanationSource": "own", "section": "101年"}, {"id": 771, "question": "【文意選填 第 31–40 題】\n@@101-31–40@@\n\n▶ 第 37 題　請從 (A)–(J) 選出最適合 __37__ 的字（每個選項只用一次）", "options": ["request", "favor", "disadvantage", "composed", "recycled", "practice", "replaced", "raise", "various", "female"], "answer": 1, "answerLabel": "B", "source": "101 學測｜文意選填｜第 37 題", "explanation": "韓國和日本「偏好」動物名：favor animal names。(B) favor。", "explanationSource": "own", "section": "101年"}, {"id": 772, "question": "【文意選填 第 31–40 題】\n@@101-31–40@@\n\n▶ 第 38 題　請從 (A)–(J) 選出最適合 __38__ 的字（每個選項只用一次）", "options": ["request", "favor", "disadvantage", "composed", "recycled", "practice", "replaced", "raise", "various", "female"], "answer": 4, "answerLabel": "E", "source": "101 學測｜文意選填｜第 38 題", "explanation": "140 個名字依序用完後會「循環再用」：be recycled。(E) recycled。", "explanationSource": "own", "section": "101年"}, {"id": 773, "question": "【文意選填 第 31–40 題】\n@@101-31–40@@\n\n▶ 第 39 題　請從 (A)–(J) 選出最適合 __39__ 的字（每個選項只用一次）", "options": ["request", "favor", "disadvantage", "composed", "recycled", "practice", "replaced", "raise", "various", "female"], "answer": 0, "answerLabel": "A", "source": "101 學測｜文意選填｜第 39 題", "explanation": "受災嚴重的會員國可以「要求」刪除該名字：request that the name be deleted（request + that 子句用原形動詞）。(A) request。", "explanationSource": "own", "section": "101年"}, {"id": 774, "question": "【文意選填 第 31–40 題】\n@@101-31–40@@\n\n▶ 第 40 題　請從 (A)–(J) 選出最適合 __40__ 的字（每個選項只用一次）", "options": ["request", "favor", "disadvantage", "composed", "recycled", "practice", "replaced", "raise", "various", "female"], "answer": 6, "answerLabel": "G", "source": "101 學測｜文意選填｜第 40 題", "explanation": "Nabi 和 Longwang 在 2007 年「被」其他名字「取代」：were replaced with other names。(G) replaced。", "explanationSource": "own", "section": "101年"}, {"id": 775, "question": "【閱讀測驗 第 41–44 題】\n@@101-41–44@@\n\n▶ 第 41 題　What’s the proper way of wearing the kilt?", "options": ["It should be worn with underwear underneath it.", "It should loosely fit on the body to be turned around.", "It should be long enough to cover the wearer’s knees.", "It should be wrapped across the front of the body two times."], "answer": 3, "answerLabel": "D", "source": "101 學測｜閱讀測驗｜第 41 題", "explanation": "第一段：從一側繞到前面、繞過背面、再「橫過前面」到另一側——前面繞兩次（重疊的部分叫 aprons）。(D)。(A) 錯：內褲隨個人喜好；(B) 錯：不可太鬆；(C) 錯：只到膝上。", "explanationSource": "own", "section": "101年"}, {"id": 776, "question": "【閱讀測驗 第 41–44 題】\n@@101-41–44@@\n\n▶ 第 42 題　Which of the following is a correct description about setts?", "options": ["They were once symbols for different Scottish families.", "They were established by the government for business purposes.", "They represented different States and Provinces in the 19th century.", "They used to come in one general pattern for all individuals and institutions."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 42 題", "explanation": "第二段：特定格紋與「個別家族」的關聯可追溯數百年。(A)。(B) 錯：是織布公司而非政府記錄；(C) 州省圖案是「今日」才有。", "explanationSource": "own", "section": "101年"}, {"id": 777, "question": "【閱讀測驗 第 41–44 題】\n@@101-41–44@@\n\n▶ 第 43 題　Which of the following items is NOT typically worn with the kilt for decoration?", "options": ["A pin.", "A purse.", "A ruby apron.", "A silver knife."], "answer": 2, "answerLabel": "C", "source": "101 學測｜閱讀測驗｜第 43 題", "explanation": "第三段提到 kilt pin、小刀、sporran（袋子）；apron 是裙子前面重疊的布，不是裝飾品，且文中沒有紅寶石 apron。(C)。", "explanationSource": "own", "section": "101年"}, {"id": 778, "question": "【閱讀測驗 第 41–44 題】\n@@101-41–44@@\n\n▶ 第 44 題　What is the purpose of this passage?", "options": ["To introduce a Scottish garment.", "To advertise a weaving pattern.", "To persuade men to wear kilts.", "To compare a skirt with a kilt."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 44 題", "explanation": "全文客觀介紹蘇格蘭裙的穿法、格紋、配件——介紹一種蘇格蘭服飾。(A)。", "explanationSource": "own", "section": "101年"}, {"id": 779, "question": "【閱讀測驗 第 45–48 題】\n@@101-45–48@@\n\n▶ 第 45 題　In which of the following places has Wesla Whitfield worked?", "options": ["A college.", "A hospital.", "A pizza parlor.", "A news agency."], "answer": 2, "answerLabel": "C", "source": "101 學測｜閱讀測驗｜第 45 題", "explanation": "第三段：18 歲時在「披薩店」當會唱歌的女服務生。(C)。(B) 錯：醫院是去治療不是工作。", "explanationSource": "own", "section": "101年"}, {"id": 780, "question": "【閱讀測驗 第 45–48 題】\n@@101-45–48@@\n\n▶ 第 46 題　What does “when that happens” mean in the last paragraph?", "options": ["When Wesla is losing her mind.", "When Wesla is singing on the stage.", "When Wesla is going out in her wheelchair.", "When Wesla is watching other people dancing."], "answer": 3, "answerLabel": "D", "source": "101 學測｜閱讀測驗｜第 46 題", "explanation": "前句：「尤其當大家都在跳舞的時候」會感到挫折——that 指看到別人跳舞。(D)。", "explanationSource": "own", "section": "101年"}, {"id": 781, "question": "【閱讀測驗 第 45–48 題】\n@@101-45–48@@\n\n▶ 第 47 題　Which of the following statements is true about Wesla Whitfield’s physical disability?", "options": ["It was caused by a traffic accident.", "It made her sad and depressed at first.", "It seriously affected her singing career.", "It happened when she was a college student."], "answer": 1, "answerLabel": "B", "source": "101 學測｜閱讀測驗｜第 47 題", "explanation": "第四段：起初她不願面對，憂鬱了一年甚至想自殺——一開始讓她悲傷沮喪。(B)。(A) 錯：是隨機槍擊；(D) 錯：是 29 歲走路回家時。", "explanationSource": "own", "section": "101年"}, {"id": 782, "question": "【閱讀測驗 第 45–48 題】\n@@101-45–48@@\n\n▶ 第 48 題　What advice would Wesla most likely give other disabled people?", "options": ["Ignore what you have lost and make the best use of what you have.", "Be modest and hard-working to earn respect from other people.", "Acquire a skill so that you can still be successful and famous.", "Try to sing whenever you feel upset and depressed."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 48 題", "explanation": "最後一段：她只失去走路的能力，仍擁有最寶貴的心智；挫折時就「專注在我能做的事上」。(A)。", "explanationSource": "own", "section": "101年"}, {"id": 783, "question": "【閱讀測驗 第 49–52 題】\n@@101-49–52@@\n\n▶ 第 49 題　What is the passage mainly about?", "options": ["The different designs of forks.", "The spread of fork-aided cooking.", "The history of using forks for dining.", "The development of fork-related table manners."], "answer": 2, "answerLabel": "C", "source": "101 學測｜閱讀測驗｜第 49 題", "explanation": "全文從古希臘到美國，講叉子用於用餐的歷史。(C)。", "explanationSource": "own", "section": "101年"}, {"id": 784, "question": "【閱讀測驗 第 49–52 題】\n@@101-49–52@@\n\n▶ 第 50 題　By which route did the use of forks spread?", "options": ["Middle East → Greece → England → Italy → France", "Greece → Middle East → Italy → France → England", "Greece → Middle East → France → Italy → Germany", "Middle East → France → England → Italy → Germany"], "answer": 1, "answerLabel": "B", "source": "101 學測｜閱讀測驗｜第 50 題", "explanation": "依文章順序：古希臘 → 7 世紀中東宮廷 → 11 世紀義大利 → 1533 法國 → 1608 英國。(B)。", "explanationSource": "own", "section": "101年"}, {"id": 785, "question": "【閱讀測驗 第 49–52 題】\n@@101-49–52@@\n\n▶ 第 51 題　How did forks become popular in England?", "options": ["Wealthy British were impressed by the design of forks.", "Wealthy British thought it awkward to use their hands to eat.", "Wealthy British gave special forks to the nobles as luxurious gifts.", "Wealthy British considered dining with forks a sign of social status."], "answer": 3, "answerLabel": "D", "source": "101 學測｜閱讀測驗｜第 51 題", "explanation": "第三段：叉子逐漸被富人採用，作為「社會地位的象徵」。(D)。", "explanationSource": "own", "section": "101年"}, {"id": 786, "question": "【閱讀測驗 第 49–52 題】\n@@101-49–52@@\n\n▶ 第 52 題　Why were forks made into a curved shape?", "options": ["They could be used to scoop food as well.", "They looked more fashionable in this way.", "They were designed in this way for export to the US.", "They ensured the meat would not twist while being cut."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 52 題", "explanation": "第四段：彎曲的叉齒「可以當作湯匙舀食物」，不必一直換湯匙。(A)。(D) 是廚房叉子的功能。", "explanationSource": "own", "section": "101年"}, {"id": 787, "question": "【閱讀測驗 第 53–56 題】\n@@101-53–56@@\n\n▶ 第 53 題　Why do some professional photographers NOT like to take pictures of pets?", "options": ["Pets may not follow orders.", "Pets don’t want to be bothered.", "Pets may not like photographers.", "Pets seldom change their expressions."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 53 題", "explanation": "第一段：寵物很難乖乖坐好、「聽指令表演」，所以有些專業攝影師不拍。(A)。", "explanationSource": "own", "section": "101年"}, {"id": 788, "question": "【閱讀測驗 第 53–56 題】\n@@101-53–56@@\n\n▶ 第 54 題　What is the use of a biscuit in taking pictures of a pet?", "options": ["To capture a cute look.", "To create a special atmosphere.", "To arouse the appetite of the pet.", "To keep the pet from looking at the camera."], "answer": 0, "answerLabel": "A", "source": "101 學測｜閱讀測驗｜第 54 題", "explanation": "第二段：把餅乾舉在相機上方，相機會捕捉到寵物渴望的眼神——拍到可愛的表情。(A)。", "explanationSource": "own", "section": "101年"}, {"id": 789, "question": "【閱讀測驗 第 53–56 題】\n@@101-53–56@@\n\n▶ 第 55 題　What is the advantage of calling your pet’s name when taking a shot of it?", "options": ["To help your pet look its best.", "To make sure that your pet sits still.", "To keep your pet awake for a while.", "To catch a different expression of your pet."], "answer": 3, "answerLabel": "D", "source": "101 學測｜閱讀測驗｜第 55 題", "explanation": "第三段：叫名字後立刻拍，會得到「不同的表情」（好奇或被吵醒的不悅）。(D)。", "explanationSource": "own", "section": "101年"}, {"id": 790, "question": "【閱讀測驗 第 53–56 題】\n@@101-53–56@@\n\n▶ 第 56 題　In what way is photographing zoo animals different from photographing pets?", "options": ["You need to have fast film.", "You need special equipment.", "You need to stay close to the animals.", "You need more time to watch and wait."], "answer": 3, "answerLabel": "D", "source": "101 學測｜閱讀測驗｜第 56 題", "explanation": "第四段：拍動物園動物需要更多耐心，你叫不醒獅子，可能要「等一段時間」。(D)。(C) 相反：不要太靠近籠子。", "explanationSource": "own", "section": "101年"}, {"id": 791, "question": "第 1 題　All the new students were given one minute to ______ introduce themselves to the whole class.", "options": ["briefly", "famously", "gradually", "obviously"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 1 題", "explanation": "只有一分鐘，所以是「簡短地」自我介紹：briefly。famously 著名地、gradually 逐漸地、obviously 明顯地。", "explanationSource": "own", "section": "100年"}, {"id": 792, "question": "第 2 題　His dark brown jacket had holes in the elbows and had ______ to light brown, but he continued to wear it.", "options": ["cycled", "faded", "loosened", "divided"], "answer": 1, "answerLabel": "B", "source": "100 學測｜詞彙｜第 2 題", "explanation": "深棕色夾克「褪色」成淺棕色：faded。cycle 循環、loosen 鬆開、divide 分開。", "explanationSource": "own", "section": "100年"}, {"id": 793, "question": "第 3 題　Everyone in our company enjoys working with Jason. He’s got all the qualities that make a ______ partner.", "options": ["desirable", "comfortable", "frequent", "hostile"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 3 題", "explanation": "大家都喜歡和 Jason 合作，他具備「理想」夥伴的所有特質：desirable 令人想要的。comfortable 舒適的、frequent 頻繁的、hostile 有敵意的。", "explanationSource": "own", "section": "100年"}, {"id": 794, "question": "第 4 題　Eyes are sensitive to light. Looking at the sun ______ could damage our eyes.", "options": ["hardly", "specially", "totally", "directly"], "answer": 3, "answerLabel": "D", "source": "100 學測｜詞彙｜第 4 題", "explanation": "「直視」太陽會傷害眼睛：directly。hardly 幾乎不、specially 特別地、totally 完全地。", "explanationSource": "own", "section": "100年"}, {"id": 795, "question": "第 5 題　We were forced to ______ our plan for the weekend picnic because of the bad weather.", "options": ["maintain", "record", "propose", "cancel"], "answer": 3, "answerLabel": "D", "source": "100 學測｜詞彙｜第 5 題", "explanation": "天氣不好被迫「取消」野餐計畫：cancel。maintain 維持、record 記錄、propose 提議。", "explanationSource": "own", "section": "100年"}, {"id": 796, "question": "第 6 題　Three people are running for mayor. All three ______ seem confident that they will be elected, but we won’t know until the outcome of the election is announced.", "options": ["particles", "receivers", "candidates", "containers"], "answer": 2, "answerLabel": "C", "source": "100 學測｜詞彙｜第 6 題", "explanation": "三個人競選市長，三位「候選人」都有信心：candidates。particle 粒子、receiver 接收者、container 容器。", "explanationSource": "own", "section": "100年"}, {"id": 797, "question": "第 7 題　If you ______ a traffic law, such as drinking and driving, you may not drive for some time.", "options": ["destroy", "violate", "attack", "invade"], "answer": 1, "answerLabel": "B", "source": "100 學測｜詞彙｜第 7 題", "explanation": "「違反」交通法規會被禁止開車一段時間：violate a law。destroy 破壞、attack 攻擊、invade 入侵。", "explanationSource": "own", "section": "100年"}, {"id": 798, "question": "第 8 題　Applying to college means sending in applications, writing study plans, and so on. It’s a long ______, and it makes students nervous.", "options": ["errand", "operation", "process", "display"], "answer": 2, "answerLabel": "C", "source": "100 學測｜詞彙｜第 8 題", "explanation": "寄申請、寫讀書計畫等一連串步驟，是漫長的「過程」：process。errand 差事、operation 手術/操作、display 展示。", "explanationSource": "own", "section": "100年"}, {"id": 799, "question": "第 9 題　Dr. Chu’s speech on the new energy source attracted great ______ from the audience at the conference.", "options": ["attention", "fortune", "solution", "influence"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 9 題", "explanation": "演講吸引聽眾極大的「注意」：attract attention。fortune 財富、solution 解答、influence 影響。", "explanationSource": "own", "section": "100年"}, {"id": 800, "question": "第 10 題　Everyone in the office must attend the meeting tomorrow. There are no ______ allowed.", "options": ["exceptions", "additions", "divisions", "measures"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 10 題", "explanation": "每個人都必須出席，不允許任何「例外」：exceptions。addition 增加、division 分割、measure 措施。", "explanationSource": "own", "section": "100年"}, {"id": 801, "question": "第 11 題　To make fresh lemonade, cut the lemon in half, ______ the juice into a bowl, and then add as much water and sugar as you like.", "options": ["decrease", "squeeze", "freeze", "cease"], "answer": 1, "answerLabel": "B", "source": "100 學測｜詞彙｜第 11 題", "explanation": "把檸檬切半，「擠」汁到碗裡：squeeze。decrease 減少、freeze 冷凍、cease 停止。", "explanationSource": "own", "section": "100年"}, {"id": 802, "question": "第 12 題　Buddhism is the ______ religion in Thailand, with 90% of the total population identified as Buddhists.", "options": ["racial", "competitive", "modest", "dominant"], "answer": 3, "answerLabel": "D", "source": "100 學測｜詞彙｜第 12 題", "explanation": "90% 人口是佛教徒，佛教是泰國「主要的」宗教：dominant 占優勢的。racial 種族的、competitive 競爭的、modest 謙虛的。", "explanationSource": "own", "section": "100年"}, {"id": 803, "question": "第 13 題　When I open a book, I look first at the table of ______ to get a general idea of the book and to see which chapters I might be interested in reading.", "options": ["contracts", "contents", "contests", "contacts"], "answer": 1, "answerLabel": "B", "source": "100 學測｜詞彙｜第 13 題", "explanation": "翻開書先看「目錄」了解大概內容：table of contents。contract 合約、contest 比賽、contact 聯絡。", "explanationSource": "own", "section": "100年"}, {"id": 804, "question": "第 14 題　The children were so ______ to see the clown appear on stage that they laughed, screamed, and correct."], "answer": 3, "answerLabel": "D", "source": "100 學測｜閱讀測驗｜第 44 題", "explanation": "每段都先提出一個普遍信念（long-held belief / widely accepted belief / widespread belief），再用研究推翻——常見看法不一定正確。(D)。", "explanationSource": "own", "section": "100年"}, {"id": 835, "question": "【閱讀測驗 第 45–48 題】\n@@100-45–48@@\n\n▶ 第 45 題　According to the passage, which of the following statements is true about Kamba and Maasai people?", "options": ["Maasai people are a threat to elephants.", "Kamba people raise elephants for farming.", "Both Kamba and Maasai people are elephant hunters.", "Both Kamba and Maasai people traditionally wear red clothing."], "answer": 0, "answerLabel": "A", "source": "100 學測｜閱讀測驗｜第 45 題", "explanation": "第二段：年輕 Maasai 男子會用矛刺動物，對象構成威脅；Kamba 人主要是農夫。(A)。", "explanationSource": "own", "section": "100年"}, {"id": 836, "question": "【閱讀測驗 第 45–48 題】\n@@100-45–48@@\n\n▶ 第 46 題　How did the elephants react to smell in the study?", "options": ["They attacked a man with the smell of new clothing.", "They needed time to relax when smelling something unfamiliar.", "They became anxious when they smelled Kamba-scented clothing.", "They were frightened and ran away when they smelled their enemies."], "answer": 3, "answerLabel": "D", "source": "100 學測｜閱讀測驗｜第 46 題", "explanation": "第三段：聞到 Maasai 人穿過的衣服，大象更快走開、更久才放鬆——害怕逃離。(D)。(C) 錯：對 Kamba 衣物沒有這種反應。", "explanationSource": "own", "section": "100年"}, {"id": 837, "question": "【閱讀測驗 第 45–48 題】\n@@100-45–48@@\n\n▶ 第 47 題　What is the main idea of this passage?", "options": ["Elephants use sight and smell to detect danger.", "Elephants attack people who wear red clothing.", "Scientists are now able to control elephants’ emotions.", "Some Kenyan tribes understand elephants’ emotions very well."], "answer": 0, "answerLabel": "A", "source": "100 學測｜閱讀測驗｜第 47 題", "explanation": "第一段點題：大象能用視覺和嗅覺分辨有威脅與無威脅的人，全文即在證明這點。(A)。", "explanationSource": "own", "section": "100年"}, {"id": 838, "question": "【閱讀測驗 第 45–48 題】\n@@100-45–48@@\n\n▶ 第 48 題　What can be inferred about the elephant’s behavior from this passage?", "options": ["Elephants learn from their experiences.", "Elephants have sharper sense of smell than sight.", "Elephants are more intelligent than other animals.", "Elephants tend to attack rather than escape when in danger."], "answer": 0, "answerLabel": "A", "source": "100 學測｜閱讀測驗｜第 48 題", "explanation": "大象知道 Maasai 有威脅、紅色是 Maasai 的服色，顯示它們「從經驗中學習」。(A)。(D) 錯：聞到威脅時是逃跑。", "explanationSource": "own", "section": "100年"}, {"id": 839, "question": "【閱讀測驗 第 49–52 題】\n@@100-49–52@@\n\n▶ 第 49 題　What is the best title for this passage?", "options": ["A Painful Mistake", "A Great Adventure", "A Lifelong Punishment", "A New Direction in Life"], "answer": 3, "answerLabel": "D", "source": "100 學測｜閱讀測驗｜第 49 題", "explanation": "全文：Deborah 因受傷無法打球，卻在物理治療中找到新志向——人生新方向。(D)。", "explanationSource": "own", "section": "100年"}, {"id": 840, "question": "【閱讀測驗 第 49–52 題】\n@@100-49–52@@\n\n▶ 第 50 題　How did Deborah feel when she first hurt her knee?", "options": ["Excited.", "Confused.", "Ashamed.", "Disappointed."], "answer": 3, "answerLabel": "D", "source": "100 學測｜閱讀測驗｜第 50 題", "explanation": "第三段：她第一次面對無法控制的處境，只能坐在場邊看別人打球——失望。(D)。", "explanationSource": "own", "section": "100年"}, {"id": 841, "question": "【閱讀測驗 第 49–52 題】\n@@100-49–52@@\n\n▶ 第 51 題　What is true about Deborah Duffey?", "options": ["She didn’t play on the court after the initial injury.", "She injured her knee when she was trying to block her opponent.", "She knew that she couldn’t be a basketball player when she was a child.", "She refused to seek professional assistance to help her recover from her injuries."], "answer": 1, "answerLabel": "B", "source": "100 學測｜閱讀測驗｜第 51 題", "explanation": "第二段：她側步要阻擋對手球員時膝蓋受傷。(B)。(A) 錯：之後五年又受傷三次表示有再上場；(D) 錯：她花很多時間接受物理治療。", "explanationSource": "own", "section": "100年"}, {"id": 842, "question": "【閱讀測驗 第 49–52 題】\n@@100-49–52@@\n\n▶ 第 52 題　What was the new light that Deborah saw in her life?", "options": ["To help people take care of their bodies.", "To become a teacher of Physical Education.", "To become an outstanding basketball player.", "To receive treatment in a physical therapy office."], "answer": 0, "answerLabel": "A", "source": "100 學測｜閱讀測驗｜第 52 題", "explanation": "第四、五段：頻繁接受治療讓她對這個專業產生熱情，決定攻讀物理治療，教人如何照顧身體。(A)。", "explanationSource": "own", "section": "100年"}, {"id": 843, "question": "【閱讀測驗 第 53–56 題】\n@@100-53–56@@\n\n▶ 第 53 題　Why were redwood trees more prominent in the forests of North America millions of years ago?", "options": ["The trees were taller and stronger.", "The soil was softer for seeds to sprout.", "The climate was warmer and more humid.", "The temperature was lower along the Pacific coast."], "answer": 2, "answerLabel": "C", "source": "100 學測｜閱讀測驗｜第 53 題", "explanation": "第一段：一億年前北美「更潮濕、更熱帶」，紅杉很常見；氣候變乾變冷後才退到加州沿岸。(C)。", "explanationSource": "own", "section": "100年"}, {"id": 844, "question": "【閱讀測驗 第 53–56 題】\n@@100-53–56@@\n\n▶ 第 54 題　What does a “fairy ring” in the last paragraph refer to?", "options": ["Circled tree trunks.", "Connected root systems.", "Insect holes around an old tree.", "Young trees surrounding a mature tree."], "answer": 3, "answerLabel": "D", "source": "100 學測｜閱讀測驗｜第 54 題", "explanation": "最後一段：母樹死後，根部長出的小樹長成環繞原樹的一圈樹——「幼樹圍繞成熟樹」。(D)。", "explanationSource": "own", "section": "100年"}, {"id": 845, "question": "【閱讀測驗 第 53–56 題】\n@@100-53–56@@\n\n▶ 第 55 題　Which of the following is a function of the tree bark as mentioned in the passage?", "options": ["It allows redwood trees to bear seeds.", "It prevents redwood trees from attack by insects.", "It helps redwood trees absorb moisture in the air.", "It makes redwood trees more beautiful and appealing."], "answer": 1, "answerLabel": "B", "source": "100 學測｜閱讀測驗｜第 55 題", "explanation": "第二段：厚樹皮讓老樹「免於昆蟲侵害」，更重要的是耐火。(B)。", "explanationSource": "own", "section": "100年"}, {"id": 846, "question": "【閱讀測驗 第 53–56 題】\n@@100-53–56@@\n\n▶ 第 56 題　Why do redwood trees grow to live that long according to the passage?", "options": ["They have heavy and straight tree trunks.", "They are properly watered and nourished.", "They are more resistant to fire damage than other trees.", "They produce many young trees to sustain their life cycle."], "answer": 2, "answerLabel": "C", "source": "100 學測｜閱讀測驗｜第 56 題", "explanation": "第二段：This fire resistant quality explains why the giant redwood grows to live that long——比其他樹更耐火。(C)。", "explanationSource": "own", "section": "100年"}, {"id": 847, "question": "第 1 題　Mr. Lin is a very ______ writer; he publishes at least five novels every year.", "options": ["moderate", "temporary", "productive", "reluctant"], "answer": 2, "answerLabel": "C", "source": "99 學測｜詞彙｜第 1 題", "explanation": "每年至少出版五本小說，是非常「多產的」作家：productive。moderate 適度的、temporary 暫時的、reluctant 不情願的。", "explanationSource": "own", "section": "99年"}, {"id": 848, "question": "第 2 題　Using a heating pad or taking warm baths can sometimes help to ______ pain in the lower back.", "options": ["polish", "relieve", "switch", "maintain"], "answer": 1, "answerLabel": "B", "source": "99 學測｜詞彙｜第 2 題", "explanation": "熱敷或泡熱水澡可「緩解」下背疼痛：relieve 減輕。polish 擦亮、switch 切換、maintain 維持。", "explanationSource": "own", "section": "99年"}, {"id": 849, "question": "第 3 題　Peter stayed up late last night, so he drank a lot of coffee this morning to keep himself ______ in class.", "options": ["acceptable", "amazed", "accurate", "awake"], "answer": 3, "answerLabel": "D", "source": "99 學測｜詞彙｜第 3 題", "explanation": "熬夜後喝很多咖啡讓自己在課堂上保持「清醒」：awake。acceptable 可接受的、amazed 驚訝的、accurate 準確的。", "explanationSource": "own", "section": "99年"}, {"id": 850, "question": "第 4 題　Due to ______, prices for daily necessities have gone up and we have to pay more for the same items now.", "options": ["inflation", "solution", "objection", "condition"], "answer": 0, "answerLabel": "A", "source": "99 學測｜詞彙｜第 4 題", "explanation": "物價上漲、同樣東西要付更多錢，原因是「通貨膨脹」：inflation。solution 解決方法、objection 反對、condition 狀況。", "explanationSource": "own", "section": "99年"}, {"id": 851, "question": "第 5 題　The government is doing its best to ______ the cultures of the tribal people for fear that they may soon die out.", "options": ["preserve", "frustrate", "hesitate", "overthrow"], "answer": 0, "answerLabel": "A", "source": "99 學測｜詞彙｜第 5 題", "explanation": "擔心部落文化消失，所以盡力「保存」：preserve。frustrate 使受挫、hesitate 猶豫、overthrow 推翻。", "explanationSource": "own", "section": "99年"}, {"id": 852, "question": "第 6 題　I could not ______ the sweet smell from the bakery, so I walked in and bought a fresh loaf of bread.", "options": ["insist", "resist", "obtain", "contain"], "answer": 1, "answerLabel": "B", "source": "99 學測｜詞彙｜第 6 題", "explanation": "無法「抗拒」麵包店的香味，於是走進去買了麵包：resist。insist 堅持、obtain 獲得、contain 包含。", "explanationSource": "own", "section": "99年"}, {"id": 853, "question": "第 7 題　Steve has several meetings to attend every day; therefore, he has to work on a very ______ schedule.", "options": ["dense", "various", "tight", "current"], "answer": 2, "answerLabel": "C", "source": "99 學測｜詞彙｜第 7 題", "explanation": "每天有好幾個會議，行程非常「緊湊」：a tight schedule（固定搭配）。dense 密集的、various 各種的、current 目前的。", "explanationSource": "own", "section": "99年"}, {"id": 854, "question": "第 8 題　Michael Phelps, an American swimmer, broke seven world records and won eight gold medals in men’s swimming ______ in the 2008 Olympics.", "options": ["drills", "techniques", "routines", "contests"], "answer": 3, "answerLabel": "D", "source": "99 學測｜詞彙｜第 8 題", "explanation": "在奧運游泳「比賽」中破紀錄、奪金牌：contests 競賽。drill 操練、technique 技巧、routine 例行動作。", "explanationSource": "own", "section": "99年"}, {"id": 855, "question": "第 9 題　Those college students work at the orphanage on a ______ basis, helping the children with their studies without receiving any pay.", "options": ["voluntary", "competitive", "sorrowful", "realistic"], "answer": 0, "answerLabel": "A", "source": "99 學測｜詞彙｜第 9 題", "explanation": "不收任何報酬，表示是「自願」性質：on a voluntary basis。competitive 競爭的、sorrowful 悲傷的、realistic 務實的。", "explanationSource": "own", "section": "99年"}, {"id": 856, "question": "第 10 題　Studies show that asking children to do house ______, such as taking out the trash or doing the dishes, helps them grow into responsible adults.", "options": ["missions", "chores", "approaches", "incidents"], "answer": 1, "answerLabel": "B", "source": "99 學測｜詞彙｜第 10 題", "explanation": "倒垃圾、洗碗等「家事」：house chores / household chores。mission 任務、approach 方法、incident 事件。", "explanationSource": "own", "section": "99年"}, {"id": 857, "question": "第 11 題　John has been scolded by his boss for over ten minutes now. ______, she is not happy about his being late again.", "options": ["Expressively", "Apparently", "Immediately", "Originally"], "answer": 1, "answerLabel": "B", "source": "99 學測｜詞彙｜第 11 題", "explanation": "被老闆罵了十多分鐘，「顯然」老闆對他又遲到很不滿：Apparently。expressively 富表情地、immediately 立刻、originally 最初。", "explanationSource": "own", "section": "99年"}, {"id": 858, "question": "第 12 題　Since the orange trees suffered ______ damage from a storm in the summer, the farmers are expecting a sharp decline in harvests this winter.", "options": ["potential", "relative", "severe", "mutual"], "answer": 2, "answerLabel": "C", "source": "99 學測｜詞彙｜第 12 題", "explanation": "橘子樹受到暴風「嚴重」損害，所以預期收成大減：severe。potential 潛在的、relative 相對的、mutual 相互的。", "explanationSource": "own", "section": "99年"}, {"id": 859, "question": "第 13 題　Typhoon Morakot claimed more than six hundred lives in early August of 2009, making it the most serious natural ______ in Taiwan in recent decades.", "options": ["disaster", "barrier", "anxiety", "collapse"], "answer": 0, "answerLabel": "A", "source": "99 學測｜詞彙｜第 13 題", "explanation": "莫拉克颱風奪走六百多人性命，是近幾十年最嚴重的天然「災害」：disaster。barrier 障礙、anxiety 焦慮、collapse 崩塌。", "explanationSource": "own", "section": "99年"}, {"id": 860, "question": "第 14 題　Robert was the only ______ to the car accident. The police had to count on him to find out exactly how the accident happened.", "options": ["dealer", "guide", "witness", "client"], "answer": 2, "answerLabel": "C", "source": "99 學測｜詞彙｜第 14 題", "explanation": "警方得靠他才能知道車禍經過，表示他是唯一的「目擊者」：witness。dealer 商人、guide 導遊、client 客戶。", "explanationSource": "own", "section": "99年"}, {"id": 861, "question": "第 15 題　Badly injured in the car accident, Jason could ______ move his legs and was sent to the hospital right away.", "options": ["accordingly", "undoubtedly", "handily", "scarcely"], "answer": 3, "answerLabel": "D", "source": "99 學測｜詞彙｜第 15 題", "explanation": "重傷之下「幾乎無法」移動雙腿：scarcely 幾乎不。accordingly 因此、undoubtedly 無疑地、handily 輕易地。", "explanationSource": "own", "section": "99年"}, {"id": 862, "question": "【綜合測驗 第 16–20 題】\n@@99-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["gave up", "ended up", "took to", "used to"], "answer": 1, "answerLabel": "B", "source": "99 學測｜綜合測驗｜第 16 題", "explanation": "母女兩人「最後」買了同一件牛仔褲：end up + V-ing 最終（做了…）。give up 放棄、take to 開始喜歡、used to 過去習慣。", "explanationSource": "own", "section": "99年"}, {"id": 863, "question": "【綜合測驗 第 16–20 題】\n@@99-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["informed", "informative", "informal", "informational"], "answer": 0, "answerLabel": "A", "source": "99 學測｜綜合測驗｜第 17 題", "explanation": "二十出頭的年輕人是「消息靈通的」消費者，沒有不知道的品牌或潮流：informed 見多識廣的。informative 提供資訊的、informal 非正式的。", "explanationSource": "own", "section": "99年"}, {"id": 864, "question": "【綜合測驗 第 16–20 題】\n@@99-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["deal with", "head for", "turn to", "look into"], "answer": 2, "answerLabel": "C", "source": "99 學測｜綜合測驗｜第 18 題", "explanation": "想跟上潮流的母親通常「求助於」專家——她們的女兒：turn to 求助。deal with 處理、head for 前往、look into 調查。", "explanationSource": "own", "section": "99年"}, {"id": 865, "question": "【綜合測驗 第 16–20 題】\n@@99-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["textbook", "notebook", "workbook", "pocketbook"], "answer": 3, "answerLabel": "D", "source": "99 學測｜綜合測驗｜第 19 題", "explanation": "要讓母親掏錢（進入她的「錢包」），得先贏得女兒的心：pocketbook 錢包、皮夾。", "explanationSource": "own", "section": "99年"}, {"id": 866, "qu e taken?", "options": ["A science magazine.", "A travel guide.", "A biology textbook.", "A business journal."], "answer": 3, "answerLabel": "D", "source": "99 學測｜閱讀測驗｜第 41 題", "explanation": "文章介紹紐西蘭特有昆蟲 weta 的外觀、習性與保育，可能出自科學雜誌、旅遊指南或生物課本，最不可能出自「商業期刊」。(D)。", "explanationSource": "own", "section": "99年"}, {"id": 888, "question": "【閱讀測驗 第 41–44 題】\n@@99-41–44@@\n\n▶ 第 42 題　According to the passage, which of the following statements is true?", "options": ["Wetas are unpleasant to the eye.", "The weta is a newly discovered insect species.", "The Maoris nicknamed themselves “Wetas.”", "The Europeans brought wetas to New Zealand."], "answer": 0, "answerLabel": "A", "source": "99 學測｜閱讀測驗｜第 42 題", "explanation": "第一段：weta 是毛利語「醜神」，大多數人看到它都覺得噁心——不好看。(A)。(B)(D) 錯：它自恐龍時代就在島上；(C) 是昆蟲的暱稱不是毛利人自稱。", "explanationSource": "own", "section": "99年"}, {"id": 889, "question": "【閱讀測驗 第 41–44 題】\n@@99-41–44@@\n\n▶ 第 43 題　Which of the following descriptions of wetas is accurate?", "options": ["They are quick in movement.", "They are very active in the daytime.", "They are decreasing in number.", "They have a short lifespan for insects."], "answer": 2, "answerLabel": "C", "source": "99 學測｜閱讀測驗｜第 43 題", "explanation": "第三段：these endangered creatures、老鼠對 weta 構成嚴重威脅——數量在減少。(C)。(A)(B) 錯：緩慢笨拙、夜行；(D) 錯：對昆蟲而言很長壽。", "explanationSource": "own", "section": "99年"}, {"id": 890, "question": "【閱讀測驗 第 41–44 題】\n@@99-41–44@@\n\n▶ 第 44 題　Which of the following is the most appropriate interpretation of “its” in the last paragraph?", "options": ["The rat’s.", "The weta’s.", "The island’s.", "The dinosaur’s."], "answer": 0, "answerLabel": "A", "source": "99 學測｜閱讀測驗｜第 44 題", "explanation": "its presence 指前面 the rat population——本地物種不習慣「老鼠的」存在。(A)。", "explanationSource": "own", "section": "99年"}, {"id": 891, "question": "【閱讀測驗 第 45–48 題】\n@@99-45–48@@\n\n▶ 第 45 題　In what way are high school proms significant to American teenagers?", "options": ["They are part of the graduation ceremony.", "They are occasions for teens to show off their limousines.", "They are important events for teenagers to learn social skills.", "They are formal events in which teens share their traumatic experiences."], "answer": 2, "answerLabel": "C", "source": "99 學測｜閱讀測驗｜第 45 題", "explanation": "第二段：家長與教育者視 prom 為學習社交技巧的重要一課，因此每年舉辦讓學生學習得體社交行為。(C)。", "explanationSource": "own", "section": "99年"}, {"id": 892, "question": "【閱讀測驗 第 45–48 題】\n@@99-45–48@@\n\n▶ 第 46 題　What is the main idea of the third paragraph?", "options": ["Proper social behavior must be observed by prom-goers.", "Proms held in earlier times gave less pressure to teenagers.", "Proms are regarded as important because everyone dresses up for the occasion.", "The prom has changed from a modest event to a glamorous party over the years."], "answer": 3, "answerLabel": "D", "source": "99 學測｜閱讀測驗｜第 46 題", "explanation": "第三段從 1920 年代樸實的校內舞會，講到 1980 年代後租禮服、加長禮車的奢華消費——由樸素變豪華。(D)。", "explanationSource": "own", "section": "99年"}, {"id": 893, "question": "【閱讀測驗 第 45–48 題】\n@@99-45–48@@\n\n▶ 第 47 題　According to the passage, what gave rise to alternative proms?", "options": ["Not all students behaved well at the proms.", "Proms were too serious for young prom-goers.", "Teenagers wanted to attend proms with their dates.", "Students with special needs did not enjoy conventional proms."], "answer": 3, "answerLabel": "D", "source": "99 學測｜閱讀測驗｜第 47 題", "explanation": "第四段：1990 年代起有另類舞會「以滿足特定學生的需求」，如無家可歸青少年、無伴舞會——傳統舞會不適合有特殊需求的學生。(D)。", "explanationSource": "own", "section": "99年"}, {"id": 894, "question": "【閱讀測驗 第 45–48 題】\n@@99-45–48@@\n\n▶ 第 48 題　Which of the following statements is true?", "options": ["Unconventional proms have been organized since the 1960s.", "In the 1980s, proms were held in local churches for teenagers to attend.", "Proms have become a significant event in American high schools since the 1930s.", "In the 1890s, high school proms were all-night social events for some American families."], "answer": 2, "answerLabel": "C", "source": " 】\n@@99-53–56@@\n\n▶ 第 53 題　Which of the following is NOT mentioned as a factor for the excellence of distance runners in Ethiopia?", "options": ["Well-known coaches.", "Thin air in the highlands.", "Extraordinarily long legs.", "Long distance running in daily life."], "answer": 0, "answerLabel": "A", "source": "99 學測｜閱讀測驗｜第 53 題", "explanation": "文中提到高海拔稀薄空氣、日常長距離行走、腿特別長等因素；教練 Eshetu 有出現但未被列為「知名教練」這個因素。(A)。", "explanationSource": "own", "section": "99年"}, {"id": 900, "question": "【閱讀測驗 第 53–56 題】\n@@99-53–56@@\n\n▶ 第 54 題　Which of the following is true about Bekoji?", "options": ["It’s the capital of Ethiopia.", "It has changed a lot over the years.", "It’s located near a volcano.", "It has trouble handling car accidents."], "answer": 2, "answerLabel": "C", "source": "99 學測｜閱讀測驗｜第 54 題", "explanation": "第二段：The town sits on the side of a volcano，位於火山坡上近一萬英尺高。(C)。(B) 錯：時間幾乎靜止。", "explanationSource": "own", "section": "99年"}, {"id": 901, "question": "【閱讀測驗 第 53–56 題】\n@@99-53–56@@\n\n▶ 第 55 題　What is the goal of Bekoji’s school kids?", "options": ["To work as motel managers.", "To win in international competitions.", "To become PE teachers.", "To perform well academically at school."], "answer": 1, "answerLabel": "B", "source": "99 學測｜閱讀測驗｜第 55 題", "explanation": "最後一段：所有孩子都夢想成為另一個 Derartu Tulu（奧運金牌得主）——在國際賽事獲勝。(B)。", "explanationSource": "own", "section": "99年"}, {"id": 902, "question": "【閱讀測驗 第 53–56 題】\n@@99-53–56@@\n\n▶ 第 56 題　What can be inferred from this passage?", "options": ["More distance runners may emerge from Bekoji.", "Nike will sponsor the young distance runners in Bekoji.", "Bekoji will host an international long-distance competition.", "The Ethiopian government has spared no efforts in promoting running."], "answer": 0, "answerLabel": "A", "source": "99 學測｜閱讀測驗｜第 56 題", "explanation": "最後一段：數千名孩子為成功典範所鼓舞湧入 Bekoji 受訓——可推論將有更多長跑選手出現。(A)。(B)(C)(D) 文中無依據。", "explanationSource": "own", "section": "99年"}, {"id": 903, "question": "第 1 題　Steve’s description of the place was so ______ that I could almost picture it in my mind.", "options": ["bitter", "vivid", "sensitive", "courageous"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 1 題", "explanation": "描述「生動」到幾乎能在腦中想像出畫面：vivid 生動的。bitter 苦的、sensitive 敏感的、courageous 勇敢的。", "explanationSource": "own", "section": "98年"}, {"id": 904, "question": "第 2 題　When people feel uncomfortable or nervous, they may ______ their arms across their chests as if to protect themselves.", "options": ["toss", "fold", "veil", "yield"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 2 題", "explanation": "緊張時會把手臂「交叉抱」在胸前像保護自己：fold one’s arms 抱臂。toss 丟、veil 遮蓋、yield 屈服。", "explanationSource": "own", "section": "98年"}, {"id": 905, "question": "第 3 題　The doors of these department stores slide open ______ when you approach them. You don’t have to open them yourself.", "options": ["necessarily", "diligently", "automatically", "intentionally"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 3 題", "explanation": "不必自己開門，門會「自動」滑開：automatically。necessarily 必然地、diligently 勤奮地、intentionally 故意地。", "explanationSource": "own", "section": "98年"}, {"id": 906, "question": "第 4 題　Nicole is a ______ language learner. Within a short period of time, she has developed a good command of Chinese and Japanese.", "options": ["convenient", "popular", "regular", "brilliant"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 4 題", "explanation": "短時間內精通中日文，是「傑出的」語言學習者：brilliant。convenient 方便的、popular 受歡迎的、regular 規律的。", "explanationSource": "own", "section": "98年"}, {"id": 907, "question": "第 5 題　With rising oil prices, there is an increasing ______ for people to ride bicycles to work.", "options": ["permit", "instrument", "appearance", "tendency"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 5 題", "explanation": "油價上漲，騎單車通勤的「趨勢」增加：tendency 趨勢。permit 許可證、instrument 工具、appearance 外表。", "explanationSource": "own", "section": "98年"}, {"id": 908, "question": "第 6 題　This information came from a very ______ source, so you don’t have to worry about being cheated.", "options": ["reliable", "flexible", "clumsy", "brutal"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 6 題", "explanation": "不必擔心被騙，表示消息來源「可靠」：reliable。flexible 有彈性的、clumsy 笨拙的、brutal 殘暴的。", "explanationSource": "own", "section": "98年"}, {"id": 909, "question": "第 7 題　We hope that there will be no war in the world and that all people live in peace and ______ with each other.", "options": ["complaint", "harmony", "mission", "texture"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 7 題", "explanation": "live in peace and harmony 和平和諧地共處：harmony 和諧。complaint 抱怨、mission 任務、texture 質地。", "explanationSource": "own", "section": "98年"}, {"id": 910, "question": "第 8 題　To have a full discussion of the issue, the committee spent a whole hour ______ their ideas at the meeting.", "options": ["depositing", "exchanging", "governing", "interrupting"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 8 題", "explanation": "為了充分討論，花一小時「交換」意見：exchanging ideas。deposit 存放、govern 統治、interrupt 打斷。", "explanationSource": "own", "section": "98年"}, {"id": 911, "question": "第 9 題　While adapting to western ways of living, many Asian immigrants in the US still try hard to ______ their own cultures and traditions.", "options": ["volunteer", "scatter", "preserve", "motivate"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 9 題", "explanation": "適應西方生活的同時仍努力「保存」自己的文化：preserve。volunteer 自願、scatter 散播、motivate 激勵。", "explanationSource": "own", "section": "98年"}, {"id": 912, "question": "第 10 題　With the worsening of global economic conditions, it seems wiser and more ______ to keep cash in the bank rather than to invest in the stock market.", "options": ["sensible", "portable", "explicit", "anxious"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 10 題", "explanation": "經濟惡化時，把錢存銀行比投資股市更「明智」：sensible 明智的。portable 可攜帶的、explicit 明確的、anxious 焦慮的。", "explanationSource": "own", "section": "98年"}, {"id": 913, "question": "第 11 題　Under the ______ of newly elected president Barack Obama, the US is expected to turn a new page in politics and economy.", "options": ["adoption", "fragrance", "identity", "leadership"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 11 題", "explanation": "在新總統的「領導」下，美國將開啟新頁：leadership。adoption 採用、fragrance 香氣、identity 身分。", "explanationSource": "own", "section": "98年"}, {"id": 914, "question": "第 12 題　Rapid advancement in motor engineering makes it ______ possible to build a flying car in the near future.", "options": ["individually", "narrowly", "punctually", "technically"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 12 題", "explanation": "引擎技術進步，使製造飛行汽車在「技術上」可行：technically。individually 個別地、narrowly 勉強地、punctually 準時地。", "explanationSource": "own", "section": "98年"}, {"id": 915, "question": "第 13 題　When you take photos, you can move around to shoot the target object from different ______.", "options": ["moods", "trends", "angles", "inputs"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 13 題", "explanation": "拍照時可移動以從不同「角度」拍攝：angles。mood 心情、trend 趨勢、input 輸入。", "explanationSource": "own", "section": "98年"}, {"id": 916, "question": "第 14 題　Students were asked to ______ or rewrite their compositions based on the teacher’s comments.", "options": ["revise", "resign", "refresh", "remind"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 14 題", "explanation": "依老師評語「修改」或重寫作文：revise 修訂。resign 辭職、refresh 使恢復、remind 提醒。", "explanationSource": "own", "section": "98年"}, {"id": 917, "question": "第 15 題　Besides lung cancer, another ______ of smoking is wrinkles, a premature sign of aging.", "options": ["blessing", "campaign", "consequence", "breakthrough"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 15 題", "explanation": "除了肺癌，吸菸的另一個「後果」是皺紋：consequence。blessing 福氣、campaign 活動、breakthrough 突破。", "explanationSource": "own", "section": "98年"}, {"id": 918, "question": "【綜合測驗 第 16–20 題】\n@@98-1
