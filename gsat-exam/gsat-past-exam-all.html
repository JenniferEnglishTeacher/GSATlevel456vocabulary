llenges", "competitors", "cooperate", "fast", "finishing", "identify", "opposite", "same", "teamwork"], "answer": 4, "answerLabel": "E", "source": "98 學測｜文意選填｜第 33 題", "explanation": "兔子不休息跑贏了，啟示是「快」而穩定勝過慢而穩：fast and consistent（與 slow and steady 對比）。(E) fast。", "explanationSource": "own", "section": "98年"}, {"id": 936, "question": "【文意選填 第 31–40 題】\n@@98-31–40@@\n\n▶ 第 34 題　請從 (A)–(J) 選出最適合 __34__ 的字（每個選項只用一次）", "options": ["arranged", "challenges", "competitors", "cooperate", "fast", "finishing", "identify", "opposite", "same", "teamwork"], "answer": 1, "answerLabel": "B", "source": "98 學測｜文意選填｜第 34 題", "explanation": "接著是烏龜「向兔子挑戰」第三場：the tortoise challenges the hare（主詞第三人稱單數加 s）。(B) challenges。", "explanationSource": "own", "section": "98年"}, {"id": 937, "question": "【文意選填 第 31–40 題】\n@@98-31–40@@\n\n▶ 第 35 題　請從 (A)–(J) 選出最適合 __35__ 的字（每個選項只用一次）", "options": ["arranged", "challenges", "competitors", "cooperate", "fast", "finishing", "identify", "opposite", "same", "teamwork"], "answer": 6, "answerLabel": "G", "source": "98 學測｜文意選填｜第 35 題", "explanation": "先「認清」自己的優勢，再改變場地：First identify your strengths。(G) identify。", "explanationSource": "own", "section": "98年"}, {"id": 938, "question": "【文意選填 第 31–40 題】\n@@98-31–40@@\n\n▶ 第 36 題　請從 (A)–(J) 選出最適合 __36__ 的字（每個選項只用一次）", "options": ["arranged", "challenges", "competitors", "cooperate", "fast", "finishing", "identify", "opposite", "same", "teamwork"], "answer": 2, "answerLabel": "C", "source": "98 學測｜文意選填｜第 36 題", "explanation": "兩位「競爭者」都很清楚自己的缺點：Both competitors。(C) competitors。", "explanationSource": "own", "section": "98年"}, {"id": 939, "question": "【文意選填 第 31–40 題】\n@@98-31–40@@\n\n▶ 第 37 題　請從 (A)–(J) 選出最適合 __37__ 的字（每個選項只用一次）", "options": ["arranged", "challenges", "competitors", "cooperate", "fast", "finishing", "identify", "opposite", "same", "teamwork"], "answer": 3, "answerLabel": "D", "source": "98 學測｜文意選填｜第 37 題", "explanation": "兩者「合作」組成團隊：The two cooperate as a team（複數主詞用原形）。(D) cooperate。", "explanationSource": "own", "section": "98年"}, {"id": 940, "question": "【文意選填 第 31–40 題】\n@@98-31–40@@\n\n▶ 第 38 題　請從 (A)–(J) 選出最適合 __38__ 的字（每個選項只用一次）", "options": ["arranged", "challenges", "competitors", "cooperate", "fast", "finishing", "identify", "opposite", "same", "teamwork"], "answer": 7, "answerLabel": "H", "source": "98 學測｜文意選填｜第 38 題", "explanation": "烏龜載兔子游到河的「對岸」：the opposite bank。(H) opposite。", "explanationSource": "own", "section": "98年"}, {"id": 941, "question": "【文意選填 第 31–40 題】\n@@98-31–40@@\n\n▶ 第 39 題　請從 (A)–(J) 選出最適合 __39__ 的字（每個選項只用一次）", "options": ["arranged", "challenges", "competitors", "cooperate", "fast", "finishing", "identify", "opposite", "same", "teamwork"], "answer": 5, "answerLabel": "F", "source": "98 學測｜文意選填｜第 39 題", "explanation": "一起抵達「終點」線：the finishing line。(F) finishing。", "explanationSource": "own", "section": "98年"}, {"id": 942, "question": "【文意選填 第 31–40 題】\n@@98-31–40@@\n\n▶ 第 40 題　請從 (A)–(J) 選出最適合 __40__ 的字（每個選項只用一次）", "options": ["arranged", "challenges", "competitors", "cooperate", "fast", "finishing", "identify", "opposite", "same", "teamwork"], "answer": 9, "answerLabel": "J", "source": "98 學測｜文意選填｜第 40 題", "explanation": "最明顯的啟示是「團隊合作」的重要：the importance of teamwork。(J) teamwork。", "explanationSource": "own", "section": "98年"}, {"id": 943, "question": "【閱讀測驗 第 41–44 題】\n@@98-41–44@@\n\n▶ 第 41 題　Which of the following best describes the life the author is leading?", "options": ["A simple, slow-paced life.", "A life of hard work and security.", "A religious, peasant-like life.", "A life away from paper and pencils."], "answer": 0, "answerLabel": "A", "source": "98 學測｜閱讀測驗｜第 41 題", "explanation": "整封信描述把電話換成信鴿、賣掉電腦改用鉛筆、辦公室安靜平和——簡單、慢節奏的生活。(A)。", "explanationSource": "own", "section": "98年"}, {"id": 944, "question": "【閱讀測驗 第 41–44 題】\n@@98-41–44@@\n\n▶ 第 42 題　Where is Eleanor’s letter sent to?", "options": ["Why Bother Magazine.", "ABC Activity Insurance Company.", "Stab, Grab, Grit, and Nasty Law Firm.", "The International Institute of Not Doing Much."], "answer": 3, "answerLabel": "D", "source": "98 學測｜閱讀測驗｜第 42 題", "explanation": "開頭說「你們 The International Institute of Not Doing Much 是世上最好的組織」，並說照著你們文章的建議做——收信者就是這個機構。(D)。", "explanationSource": "own", "section": "98年"}, {"id": 945, "question": "【閱讀測驗 第 41–44 題】\n@@98-41–44@@\n\n▶ 第 43 題　Which of the following is practiced in the author’s company?", "options": ["Replacing the manual work system with modern technology.", "Turning off lights in the daytime to save electricity.", "Recycling paper resources whenever possible.", "Buying birds and pets as company for the staff."], "answer": 2, "answerLabel": "C", "source": "98 學測｜閱讀測驗｜第 43 題", "explanation": "第三段：請把信寄回來，「我們可以擦掉重複使用」——盡可能回收紙張。(C)。(A) 相反，他們放棄現代科技。", "explanationSource": "own", "section": "98年"}, {"id": 946, "question": "【閱讀測驗 第 41–44 題】\n@@98-41–44@@\n\n▶ 第 44 題　What is true about Maggie?", "options": ["She works as a manager in the author’s company.", "She sometimes helps fertilize the lawn outside the sauna.", "She often helps with inter-office correspondence using e-mail.", "Her handwriting has improved a lot after entering the company."], "answer": 1, "answerLabel": "B", "source": "98 學測｜閱讀測驗｜第 44 題", "explanation": "Maggie 是信鴿（「把信綁在 Maggie 的腳上」）；第二段說鳥會「為桑拿外的草地施肥」。(B)。", "explanationSource": "own", "section": "98年"}, {"id": 947, "question": "【閱讀測驗 第 45–48 題】\n@@98-45–48@@\n\n▶ 第 45 題　What is this article mainly about?", "options": ["The problems of Darwin’s theory.", "The background of building a green airport.", "The history of the Galápagos Islands.", "The ease of transportation to the Pacific islands."], "answer": 1, "answerLabel": "B", "source": "98 學測｜閱讀測驗｜第 45 題", "explanation": "全文：加拉巴哥群島要蓋全球第一座綠色機場，並說明觀光壓力等背景。(B)。", "explanationSource": "own", "section": "98年"}, {"id": 948, "question": "【閱讀測驗 第 45–48 題】\n@@98-45–48@@\n\n▶ 第 46 題　Where will the world’s first green airport be built?", "options": ["In Tahiti.", "In Argentina.", "In Baltra.", "In the United States."], "answer": 2, "answerLabel": "C", "source": "98 學測｜閱讀測驗｜第 46 題", "explanation": "第二段：重新開發「Baltra 島」上的機場。(C)。", "explanationSource": "own", "section": "98年"}, {"id": 949, "question": "【閱讀測驗 第 45–48 題】\n@@98-45–48@@\n\n▶ 第 47 題　What is true about the Galápagos Islands?", "options": ["They are located near Ecuador in the Pacific Ocean.", "They have had a great increase in population since 2001.", "They will invest US$20 million to promote their tourism.", "They have become one of the most dangerous places in the world."], "answer": 0, "answerLabel": "A", "source": "98 學測｜閱讀測驗｜第 47 題", "explanation": "第二段：This group of islands off the coast of Ecuador，位於太平洋、厄瓜多外海。(A)。(B) 是遊客數增加非人口；(C) 資金是蓋機場非推廣觀光；(D) 是列入環境「危險名單」。", "explanationSource": "own", "section": "98年"}, {"id": 950, "question": "【閱讀測驗 第 45–48 題】\n@@98-45–48@@\n\n▶ 第 48 題　What does the project in the second paragraph refer to?", "options": ["The plan to build a green airport.", "The research on the production of solar energy.", "The task of calculating a carbon footprint.", "The study on the exhaustion of natural resources."], "answer": 0, "answerLabel": "A", "source": "98 學測｜閱讀測驗｜第 48 題", "explanation": "the project 指前句的「重新開發 Baltra 島機場」，即建綠色機場的計畫。(A)。", "explanationSource": "own", "section": "98年"}, {"id": 951, "question": "【閱讀測驗 第 49–52 題】\n@@98-49–52@@\n\n▶ 第 49 題　What is the article mainly about?", "options": ["The usefulness of Google Earth.", "Whether cattle are superior to other animals.", "Animals’ sensitivity to natural disasters.", "Whether cattle behave like compass needles."], "answer": 3, "answerLabel": "D", "source": "98 學測｜閱讀測驗｜第 49 題", "explanation": "全文探討牛是否能像指北針一樣辨別方向。(D)。", "explanationSource": "own", "section": "98年"}, {"id": 952, "question": "【閱讀測驗 第 49–52 題】\n@@98-49–52@@\n\n▶ 第 50 題　Which of the following factors might affect Dr. Begall’s research result?", "options": ["Rainfall.", "Earthquakes.", "Location.", "Cost."], "answer": 2, "answerLabel": "C", "source": "98 學測｜閱讀測驗｜第 50 題", "explanation": "第三段：牛會依風寒和日照方位調整站向，所以研究者要觀察「不同地點、不同時間」的牛以平均掉這些因素——地點會影響結果。(C)。", "explanationSource": "own", "section": "98年"}, {"id": 953, "question": "【閱讀測驗 第 49–52 題】\n@@98-49–52@@\n\n▶ 第 51 題　What is the major finding of Dr. Begall’s study?", "options": ["Cattle point north-south.", "Magnetism can’t be studied scientifically.", "Animals prefer to look south.", "Google Earth is a reliable research tool."], "answer": 0, "answerLabel": "A", "source": "98 學測｜閱讀測驗｜第 51 題", "explanation": "第四段：研究者結論牛大致呈南北向站立。(A)。", "explanationSource": "own", "section": "98年"}, {"id": 954, "question": "【閱讀測驗 第 49–52 題】\n@@98-49–52@@\n\n▶ 第 52 題　Why couldn’t the researchers get the answer to their research questions?", "options": ["Many cattle in their study were sitting on the ground.", "The cattle constantly change directions to avoid wind chill.", "There is magnetic difference between the two hemispheres.", "They couldn’t tell a cow’s head from its tail in the satellite pictures."], "answer": 3, "answerLabel": "D", "source": "98 學測｜閱讀測驗｜第 52 題", "explanation": "第四段末：Google Earth 解析度不足以分辨牛的頭和尾，因此無法回答牛是面向北或南。(D)。", "explanationSource": "own", "section": "98年"}, {"id": 955, "question": "【閱讀測驗 第 53–56 題】\n@@98-53–56@@\n\n▶ 第 53 題　What is the main purpose of this article?", "options": ["To explain what causes children’s eating disorder.", "To teach children about the meal preparation process.", "To advocate the importance of vegetables and whole grains.", "To inform parents how they can help their children like varied foods."], "answer": 3, "answerLabel": "D", "source": "98 學測｜閱讀測驗｜第 53 題", "explanation": "第一段與全文：父母的工作是讓孩子接觸多樣食物，並提供兩個策略——告訴父母如何幫助孩子喜歡多樣化飲食。(D)。", "explanationSource": "own", "section": "98年"}, {"id": 956, "question": "【閱讀測驗 第 53–56 題】\n@@98-53–56@@\n\n▶ 第 54 題　Which of the following groups will eat more balanced meals?", "options": ["The children who help cook food.", "The children whose parents are on a diet.", "The children who do not love radishes.", "The children whose parents work in a cafeteria."], "answer": 0, "answerLabel": "A", "source": "98 學測｜閱讀測驗｜第 54 題", "explanation": "第二段：研究發現「自己動手煮過的孩子」較願意在餐廳吃那些食物。(A)。", "explanationSource": "own", "section": "98年"}, {"id": 957, "question": "【閱讀測驗 第 53–56 題】\n@@98-53–56@@\n\n▶ 第 55 題　What does erratic in the last sentence imply?", "options": ["Obvious.", "Healthful.", "Dishonest.", "Inappropriate."], "answer": 3, "answerLabel": "D", "source": "98 學測｜閱讀測驗｜第 55 題", "explanation": "erratic dieting habits 指前文母親喝代餐、「做了食物卻不吃」等不穩定、不當的減肥習慣，可能造成飲食失調——不恰當的。(D)。", "explanationSource": "own", "section": "98年"}, {"id": 958, "question": "【閱讀測驗 第 53–56 題】\n@@98-53–56@@\n\n▶ 第 56 題　Which of the following is true about Slim-Fast?", "options": ["It is children’s favorite food.", "It looks like a chocolate milkshake.", "It contains a variety of vegetables.", "It is intended for slim, fast people."], "answer": 1, "answerLabel": "B", "source": "98 學測｜閱讀測驗｜第 56 題", "explanation": "第三段：女孩認為減肥就是喝巧克力奶昔，因為媽媽在喝 Slim-Fast——它看起來像巧克力奶昔。(B)。", "explanationSource": "own", "section": "98年"}, {"id": 959, "question": "第 1 題　Amy did not ______ changes in the course schedule and therefore missed the class.", "options": ["arrest", "alarm", "notice", "delay"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 1 題", "explanation": "沒有「注意到」課表更動，因此錯過上課：notice 注意到。arrest 逮捕、alarm 使驚恐、delay 延誤皆不合。", "explanationSource": "own", "section": "97年"}, {"id": 960, "question": "第 2 題　It is not easy for old people to ______ their backs, so they need help when their backs itch.", "options": ["label", "scratch", "lighten", "squeeze"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 2 題", "explanation": "背癢時需要人幫忙，表示老人不容易「抓」自己的背：scratch 抓、搔。label 貼標籤、lighten 變亮、squeeze 擠壓。", "explanationSource": "own", "section": "97年"}, {"id": 961, "question": "第 3 題　Mary is suffering from a stomachache and needs to eat food which is easy to ______.", "options": ["launch", "invade", "adopt", "digest"], "answer": 3, "answerLabel": "D", "source": "97 學測｜詞彙｜第 3 題", "explanation": "胃痛時要吃容易「消化」的食物：digest 消化。launch 發射、invade 入侵、adopt 採用。", "explanationSource": "own", "section": "97年"}, {"id": 962, "question": "第 4 題　Since our classroom is not air-conditioned, we have to ______ the heat during the hot summer days.", "options": ["consume", "tolerate", "recover", "promote"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 4 題", "explanation": "教室沒冷氣，只能「忍受」炎熱：tolerate 忍受。consume 消耗、recover 恢復、promote 促進。", "explanationSource": "own", "section": "97年"}, {"id": 963, "question": "第 5 題　Sue is so ______ that she always breaks something when she is shopping at a store.", "options": ["religious", "visual", "clumsy", "intimate"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 5 題", "explanation": "逛街總是打破東西，表示她很「笨手笨腳」：clumsy。religious 虔誠的、visual 視覺的、intimate 親密的。", "explanationSource": "own", "section": "97年"}, {"id": 964, "question": "第 6 題　Ann enjoyed going to the flower market. She believed that the ______ of flowers refreshed her mind.", "options": ["instance", "dominance", "appliance", "fragrance"], "answer": 3, "answerLabel": "D", "source": "97 學測｜詞彙｜第 6 題", "explanation": "花的「香氣」使她精神一振：fragrance 芳香。instance 例子、dominance 支配、appliance 家電。", "explanationSource": "own", "section": "97年"}, {"id": 965, "question": "第 7 題　The profits of Prince Charles’s organic farm go to ______ to help the poor and the sick.", "options": ["charities", "bulletins", "harvests", "rebels"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 7 題", "explanation": "有機農場的利潤捐給「慈善機構」幫助窮人和病人：charities。bulletin 公告、harvest 收成、rebel 反叛者。", "explanationSource": "own", "section": "97年"}, {"id": 966, "question": "第 8 題　Jack was given the rare ______ of using the president’s office, which made others quite jealous.", "options": ["mischief", "privilege", "involvement", "occupation"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 8 題", "explanation": "能使用總裁辦公室是罕見的「特權」，令人嫉妒：privilege。mischief 惡作劇、involvement 參與、occupation 職業。", "explanationSource": "own", "section": "97年"}, {"id": 967, "question": "第 9 題　This new computer is obviously ______ to the old one because it has many new functions.", "options": ["technical", "suitable", "superior", "typical"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 9 題", "explanation": "新電腦功能多，明顯「優於」舊電腦：be superior to 優於（固定搭配 to）。technical 技術的、suitable 適合的、typical 典型的。", "explanationSource": "own", "section": "97年"}, {"id": 968, "question": "第 10 題　Simon loves his work. To him, work always comes first, and family and friends are ______.", "options": ["secondary", "temporary", "sociable", "capable"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 10 題", "explanation": "工作永遠第一，家人朋友就是「次要的」：secondary。temporary 暫時的、sociable 善於社交的、capable 有能力的。", "explanationSource": "own", "section": "97年"}, {"id": 969, "question": "第 11 題　Although your plans look good, you have to be ______ and consider what you can actually do.", "options": ["dramatic", "realistic", "stressful", "manageable"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 11 題", "explanation": "要考慮實際做得到的事，表示要「務實」：realistic 實際的。dramatic 戲劇性的、stressful 有壓力的、manageable 可管理的。", "explanationSource": "own", "section": "97年"}, {"id": 970, "question": "第 12 題　Built under the sea in 1994, the ______ between England and France connects the UK more closely with mainland Europe.", "options": ["waterfall", "temple", "tunnel", "channel"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 12 題", "explanation": "1994 年建於海底、連接英法兩國的是「隧道」（英法海底隧道）：tunnel。channel 是海峡，非人工建造。", "explanationSource": "own", "section": "97年"}, {"id": 971, "question": "第 13 題　This tour package is very appealing, and that one looks ______ attractive. I don’t know which one to choose.", "options": ["equally", "annually", "merely", "gratefully"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 13 題", "explanation": "這個行程很吸引人，那個「同樣」吸引人，所以難以抉擇：equally 同樣地。annually 每年、merely 僅僅、gratefully 感激地。", "explanationSource": "own", "section": "97年"}, {"id": 972, "question": "第 14 題　Hseu Fang-yi, a young Taiwanese dancer, recently ______ at Lincoln Center in New York and won a great deal of praise.", "options": ["performed", "pretended", "postponed", "persuaded"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 14 題", "explanation": "舞者在林肯中心「演出」並獲得好評：performed。pretend 假裝、postpone 延後、persuade 說服。", "explanationSource": "own", "section": "97年"}, {"id": 973, "question": "第 15 題　The police searched the house of the suspect ______. They almost turned the whole house upside down.", "options": ["relatively", "thoroughly", "casually", "permanently"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 15 題", "explanation": "幾乎把整間房子翻過來，表示搜查得非常「徹底」：thoroughly。relatively 相對地、casually 隨意地、permanently 永久地。", "explanationSource": "own", "section": "97年"}, {"id": 974, "question": "【綜合測驗 第 16–20 題】\n@@97-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["would use", "are using", "had used", "have been using"], "answer": 3, "answerLabel": "D", "source": "97 學測｜綜合測驗｜第 16 題", "explanation": "for at least 4,000 years 表示從過去持續到現在，用現在完成進行式 have been using。", "explanationSource": "own", "section": "97年"}, {"id": 975, "question": "【綜合測驗 第 16–20 題】\n@@97-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["looks after", "slows down", "takes over", "turns out"], "answer": 1, "answerLabel": "B", "source": "97 學測｜綜合測驗｜第 17 題", "explanation": "綠茶中的化合物會「減緩」癌細胞生長：slow down。look after 照顧、take over 接管、turn out 結果是。", "explanationSource": "own", "section": "97年"}, {"id": 976, "question": "【綜合測驗 第 16–20 題】\n@@97-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["for", "from", "at", "inside"], "answer": 0, "answerLabel": "A", "source": "97 學測｜綜合測驗｜第 18 題", "explanation": "be helpful for 對…有幫助：綠茶對感染與免疫功能受損有幫助。", "explanationSource": "own", "section": "97年"}, {"id": 977, "question": "【綜合測驗 第 16–20 題】\n@@97-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["weight", "purpose", "difference", "structure"], "answer": 2, "answerLabel": "C", "source": "97 學測｜綜合測驗｜第 19 題", "explanation": "綠茶和紅茶來自同一種植物，兩者的「差別」在於加工方式：difference。", "explanationSource": "own", "section": "97年"}, {"id": 978, "question": "【綜合測驗 第 16–20 題】\n@@97-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["whether", "whenever", "what", "why"], "answer": 3, "answerLabel": "D", "source": "97 學測｜綜合測驗｜第 20 題", "explanation": "That is why + 子句：「那就是為什麼」綠茶有益健康，why 引導的名詞子句說明原因。", "explanationSource": "own", "section": "97年"}, {"id": 979, "question": "【綜合測驗 第 21–25 題】\n@@97-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["give", "bring", "share", "earn"], "answer": 2, "answerLabel": "C", "source": "97 學測｜綜合測驗｜第 21 題", "explanation": "慷慨地打開袋子與旅人「分享」食物：share … with。give/bring 不與 with 搭配，earn 賺取不合。", "explanationSource": "own", "section": "97年"}, {"id": 980, "question": "【綜合測驗 第 21–25 題】\n@@97-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["so", "such", "as", "thus"], "answer": 0, "answerLabel": "A", "source": "97 學測｜綜合測驗｜第 22 題", "explanation": "did so 代替前面提到的動作「把石頭給他」；so 代替前述內容，such/as/thus 不能這樣用。", "explanationSource": "own", "section": "97年"}, {"id": 981, "question": "【綜合測驗 第 21–25 題】\n@@97-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["had", "had had", "would have", "would have had"], "answer": 2, "answerLabel": "C", "source": "97 學測｜綜合測驗｜第 23 題", "explanation": "If he sold …, he would have … 假設語氣，與現在/未來事實相反：would have。", "explanationSource": "own", "section": "97年"}, {"id": 982, "question": "【綜合測驗 第 21–25 題】\n@@97-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["hope", "hoping", "hoped", "to hope"], "answer": 1, "answerLabel": "B", "source": "97 學測｜綜合測驗｜第 24 題", "explanation": "分詞構句：I’m giving it back to you, hoping that …，主詞 I 主動「希望」，用 hoping。", "explanationSource": "own", "section": "97年"}, {"id": 983, "question": "【綜合測驗 第 21–25 題】\n@@97-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["on leave", "by surprise", "off record", "in return"], "answer": 3, "answerLabel": "D", "source": "97 學測｜綜合測驗｜第 25 題", "explanation": "妳給我石頭卻沒要求任何「回報」：in return 作為回報。on leave 休假、by surprise 出其不意、off record 非正式地。", "explanationSource": "own", "section": "97年"}, {"id": 984, "question": "【綜合測驗 第 26–30 題】\n@@97-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["For", "With", "Upon", "Along"], "answer": 1, "answerLabel": "B", "source": "97 學測｜綜合測驗｜第 26 題", "explanation": "With + 名詞片語表「有著、擁有」：有著六百年幾乎未受破壞的建築，城市保留中世紀風貌。", "explanationSource": "own", "section": "97年"}, {"id": 985, "question": "【綜合測驗 第 26–30 題】\n@@97-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["Since", "Before", "Whatever", "Wherever"], "answer": 3, "answerLabel": "D", "source": "97 學測｜綜合測驗｜第 27 題", "explanation": "Wherever you go 無論你走到哪裡，都有各種風格的建築：wherever 引導副詞子句。", "explanationSource": "own", "section": "97年"}, {"id": 986, "question": "【綜合測驗 第 26–30 題】\n@@97-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["escaped", "featured", "defended", "inspired"], "answer": 0, "answerLabel": "A", "source": "97 學測｜綜合測驗｜第 28 題", "explanation": "這些建築成功「躲過」戰後重建的破壞而維持原貌：escaped 逃過、免於。feature 以…為特色、defend 防禦、inspire 啟發。", "explanationSource": "own", "section": "97年"}, {"id": 987, "question": "【綜合測驗 第 26–30 題】\n@@97-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["ever", "seldom", "nearly", "wholly"], "answer": 1, "answerLabel": "B", "source": "97 學測｜綜合測驗｜第 29 題", "explanation": "鐵幕時期（共產政府統治下）外國人「很少」造訪布拉格：seldom。後句 all that has changed 呼應。", "explanationSource": "own", "section": "97年"}, {"id": 988, "question": "【綜合測驗 第 26–30 題】\n@@97-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["afterwards", "therefore", "however", "furthermore"], "answer": 2, "answerLabel": "C", "source": "97 學測｜綜合測驗｜第 30 題", "explanation": "前句說以前很少人來，1990 年代以後一切改變，語氣轉折：however 然而。", "explanationSource": "own", "section": "97年"}, {"id": 989, "question": "【文意選填 第 31–40 題】\n@@97-31–40@@\n\n▶ 第 31 題　請從 (A)–(J) 選出最適合 __31__ 的字（每個選項只用一次）", "options": ["shock", "conversation", "like", "promise", "released", "screamed", "learned", "recognize", "stroke", "sharpened"], "answer": 3, "an "97年"}, {"id": 999, "question": "【閱讀測驗 第 41–44 題】\n@@97-41–44@@\n\n▶ 第 41 題　Why do howler monkeys howl?", "options": ["To claim their territory.", "To check how popular they are.", "To tell others they are going to leave.", "To show friendliness to their neighbors."], "answer": 0, "answerLabel": "A", "source": "97 學測｜閱讀測驗｜第 41 題", "explanation": "第一段：公猴用吼聲爭奪食物、配偶和「領域」，每天開始和結束都要吼叫以確認競爭者在哪——即宣示領域。(A)。", "explanationSource": "own", "section": "97年"}, {"id": 1000, "question": "【閱讀測驗 第 41–44 題】\n@@97-41–44@@\n\n▶ 第 42 題　Why did the howler monkeys in Belize howl less often?", "options": ["They lived too close to each other.", "There was enough food for all of them.", "There were no other competitors around.", "They were not used to the weather there."], "answer": 2, "answerLabel": "C", "source": "97 學測｜閱讀測驗｜第 42 題", "explanation": "第二段：Belize 保護區空間充足、周圍沒有其他吼猴，「不需要確認競爭者的位置」，所以叫得少。(C)。", "explanationSource": "own", "section": "97年"}, {"id": 1001, "question": "【閱讀測驗 第 41–44 題】\n@@97-41–44@@\n\n▶ 第 43 題　Why do the keepers at the sanctuary use recorded howls?", "options": ["To prevent the howler monkeys from getting homesick.", "To help howler monkeys maintain their howling ability.", "To trick the monkeys into the belief that there is plenty of space around.", "To teach the monkeys how to make the loudest cries to scare people away."], "answer": 1, "answerLabel": "B", "source": "97 學測｜閱讀測驗｜第 43 題", "explanation": "第二段：管理員播放錄音，讓猴子覺得「有必要像在野外一樣發出領域呼叫」，維持它們的吼叫習性。(B)。(C) 相反，錄音是讓它們以為附近有競爭者。", "explanationSource": "own", "section": "97年"}, {"id": 1002, "question": "【閱讀測驗 第 41–44 題】\n@@97-41–44@@\n\n▶ 第 44 題　According to the passage, which of the following is true about howler monkeys?", "options": ["They howl most often at noon.", "They originally came from Belize.", "People can hear their howls three miles away.", "Female monkeys howl to protect their babies."], "answer": 2, "answerLabel": "C", "source": "97 學測｜閱讀測驗｜第 44 題", "explanation": "第一段：吼聲可穿過茂密森林傳到「三英里外」。(C)。(B) 錯：文中說它們是「重新引進」Belize；(A)(D) 文中未提。", "explanationSource": "own", "section": "97年"}, {"id": 1003, "question": "【閱讀測驗 第 45–48 題】\n@@97-45–48@@\n\n▶ 第 45 題　What made it necessary to build a road through the Glacier National Park?", "options": ["There were too many parks in Montana.", "The park was not sunny enough for visitors.", "The existing mountain roads were destroyed.", "More visitors were interested in going to the park."], "answer": 3, "answerLabel": "D", "source": "97 學測｜閱讀測驗｜第 45 題", "explanation": "第一段：公園遊客增加，「對道路的需求」增加，因此修建橫越山脈的道路。(D)。", "explanationSource": "own", "section": "97年"}, {"id": 1004, "question": "【閱讀測驗 第 45–48 題】\n@@97-45–48@@\n\n▶ 第 46 題　How has the Going-to-the-Sun Road influenced the way people experience the Glacier National Park?", "options": ["The scenery along the road is too beautiful for visitors to drive carefully.", "It has become a marvelous experience for people to ride horses on this road.", "The road has allowed people to see more of the park in a shorter period of time.", "The transportation on the road was so difficult that few people could really enjoy the trip."], "answer": 2, "answerLabel": "C", "source": "97 學測｜閱讀測驗｜第 46 題", "explanation": "第二段末：遊客現在開車就能看到以前「要騎馬好幾天」才看得到的區域——更短時間看更多。(C)。", "explanationSource": "own", "section": "97年"}, {"id": 1005, "question": "【閱讀測驗 第 45–48 題】\n@@97-45–48@@\n\n▶ 第 47 題　What does “an engineering feat” mean?", "options": ["A big success in construction.", "A magical building machine.", "A great disaster for the travelers.", "An enjoyable process for engineers."], "answer": 0, "answerLabel": "A", "source": "97 學測｜閱讀測驗｜第 47 題", "explanation": "feat＝壯舉、功績；上下文說大家驚嘆這條路竟能建成，所以是「工程上的大成就」。(A)。", "explanationSource": "own", "section": "97年"}, {"id": 1006, "question": "【閱讀測驗 第 45–48 題】\n@@97-45–48@@\n\n▶ 第 48 題　What is special about the Waterton-Glacier International Peace Park?", "options": ["It is where the glacier runs to the lake.", "It is the first park funded by the whole world.", "It is a special park built to protect wild animals.", "It is composed of two parks located in two countries."], "answer": 3, "answerLabel": "D", "source": "97 學測｜閱讀測驗｜第 48 題", "explanation": "第三段：美國冰川國家公園與加拿大 Waterton Lakes 國家公園合併，成為世界第一座國際和平公園——由兩國的兩座公園組成。(D)。", "explanationSource": "own", "section": "97年"}, {"id": 1007, "question": "【閱讀測驗 第 49–52 題】\n@@97-49–52@@\n\n▶ 第 49 題　What kind of ice is ideal for sculpting?", "options": ["Ice from ice hotels.", "Ice from clean water.", "Ice with lots of bubbles in it.", "Ice weighing over 100 kilograms."], "answer": 1, "answerLabel": "B", "source": "97 學測｜閱讀測驗｜第 49 題", "explanation": "第一段：理想材料是純淨、清澄的水，氣泡越少越好。(B)。(C) 相反。", "explanationSource": "own", "section": "97年"}, {"id": 1008, "question": "【閱讀測驗 第 49–52 題】\n@@97-49–52@@\n\n▶ 第 50 題　Why is ice sculpting difficult?", "options": ["It is hard to control the size and shape of the ice.", "The right theme for ice sculpting is not easy to find.", "The appropriate tools are only available in some countries.", "It is not easy to find the right kind of ice and work environment."], "answer": 3, "answerLabel": "D", "source": "97 學測｜閱讀測驗｜第 50 題", "explanation": "第一段講要慎選冰塊，第二段講時間控制與工作環境溫度——找到合適的冰和工作環境都不容易。(D)。", "explanationSource": "own", "section": "97年"}, {"id": 1009, "question": "【閱讀測驗 第 49–52 題】\n@@97-49–52@@\n\n▶ 第 51 題　What is paragraph 3 mainly about?", "options": ["The uses of ice sculptures.", "The places where ice is sculpted.", "The quality of ice sculptures.", "The origin of ice sculpting parties."], "answer": 0, "answerLabel": "A", "source": "97 學測｜閱讀測驗｜第 51 題", "explanation": "第三段：冰雕用作餐飲裝飾，如宴會餐桌、婚宴的天鵝——講的是冰雕的「用途」。(A)。", "explanationSource": "own", "section": "97年"}, {"id": 1010, "question": "【閱讀測驗 第 49–52 題】\n@@97-49–52@@\n\n▶ 第 52 題　Which of the following statements is true about the process of sculpting ice?", "options": ["It takes more time to carve with razor-sharp chisels.", "It can be finished in 10 minutes if the right tools are used.", "Larger blocks of ice from Sweden are easier to handle for sculptors.", "The carver must work fast in a cold environment to avoid catching cold."], "answer": 1, "answerLabel": "B", "source": "97 學測｜閱讀測驗｜第 52 題", "explanation": "第二段：使用電動工具，有些作品「十分鐘內」就能完成。(B)。(A) 錯：鋒利鑿刀是為切冰設計；(D) 錯：是在不冷的環境才要快。", "explanationSource": "own", "section": "97年"}, {"id": 1011, "question": "【閱讀測驗 第 53–56 題】\n@@97-53–56@@\n\n▶ 第 53 題　What is the main idea of the passage?", "options": ["We should learn to be sensitive to pain.", "Our feeling of pain is decided by our environment.", "How people feel pain remains unknown to scientists.", "Our reaction to pain is closely related to our expectation of pain."], "answer": 3, "answerLabel": "D", "source": "97 學測｜閱讀測驗｜第 53 題", "explanation": "全文主旨：大腦對疼痛的反應區與對「預期疼痛」的反應區大致相同，預期會影響感受。(D)。", "explanationSource": "own", "section": "97年"}, {"id": 1012, "question": "【閱讀測驗 第 53–56 題】\n@@97-53–56@@\n\n▶ 第 54 題　Which of the following is true about the pulses of heat in the study?", "options": ["Each heat pulse lasted for 20 seconds.", "The pulses were given to the arms of the volunteers.", "Different devices gave out different levels of heat pulses.", "There were two levels of heat intensity given to the volunteers."], "answer": 0, "answerLabel": "A", "source": "97 學測｜閱讀測驗｜第 54 題", "explanation": "第二段：裝置發出「20 秒長」的熱脈衝到右腿；共三個強度等級。(A)。(B) 是腿不是手臂；(D) 是三級不是兩級。", "explanationSource": "own", "section": "97年"}, {"id": 1013, "question": "【閱讀測驗 第 53–56 題】\n@@97-53–56@@\n\n▶ 第 55 題　How did the volunteers learn to expect different levels of heat?", "options": ["From the loudness of the tone they heard.", "From the instruction given to them by the researchers.", "From the color of a light flashing on the device they wore.", "From the length of the pause between a tone and the heat pulse."], "answer": 3, "answerLabel": "D", "source": "97 學測｜閱讀測驗｜第 55 題", "explanation": "第二段：受試者學會把「聲音後靜默的長度」與即將到來的熱度強度連結，靜默越長越痛。(D)。", "explanationSource": "own", "section": "97年"}, {"id": 1014, "question": "【閱讀測驗 第 53–56 題】\n@@97-53–56@@\n\n▶ 第 56 題　According to the passage, what may be the author’s advice to a doctor before a surgery?", "options": ["To provide the patient with more pain killers.", "To talk to the patient and ease his/her worries.", "To give the patient strong heat pulses beforehand.", "To emphasize the possible severe pain to the patient."], "answer": 1, "answerLabel": "B", "source": "97 學測｜閱讀測驗｜第 56 題", "explanation": "第三段：預期輕微疼痛卻遭遇劇痛的人，痛感少 28%；因此醫生應降低病人的預期與擔憂。(B)。(D) 相反。", "explanationSource": "own", "section": "97年"}]};</script><script>(function(){var P=window.GSAT_PASSAGES||{};window.QUIZ_CONFIG.questions.forEach(function(q){q.question=q.question.replace(/@@([^@]+)@@/g,function(m,k){return P[k]||m});});})();</script><script>(function(){var M={};window.QUIZ_CONFIG.questions.forEach(function(q){if(q.image)M[q.question]=q.image});var qn=document.getElementById("question");if(!qn)return;function put(){var old=document.getElementById("gsatImg");var src=M[qn.textContent];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement("img");im.id="gsatImg";im.dataset.src=src;im.src=src;im.alt="題目圖片";im.style.cssText="display:block;max-width:100%;max-height:520px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;background:#fff";qn.insertAdjacentElement("afterend",im)}new MutationObserver(put).observe(qn,{childList:true,characterData:true,subtree:true});})();</script><script src="quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="97–115 年共 19 屆：詞彙 260＋綜合測驗 260＋文意選填 190＋篇章結構 20＋閱讀測驗 284｜可選單一年度／隨機 20 題／全部｜附中文解析｜Level 3–6 單字滑過即看中譯與字卡｜隨時結束並下載 DOCX 錯題";</script><script src="lexicon.js?v=20261120-6"></script><script src="vocab-hover.js?v=20261120-6"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script><script src="../tracker.js?v=20261125sc" data-no-pwa></script>
